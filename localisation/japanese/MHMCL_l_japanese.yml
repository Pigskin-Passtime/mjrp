l_japanese:
 # MHMCL_l_japanese
 # By Metallichydra
 
 # Menu
 MHMCL_allowed: "§GMircorv Allowed§!"
 MHMCL_disabled: "§RMircorv Disabled§!"
 spawn_MHMCL: "Spawn The Mircorv Core"
 MHMCL_tooltip: "Mircorv is a robotic leader who comes from the Iltrani system. It is flexible, and depending on your actions it will gain different traits."
 MHMCL_spawn_mircorv_system: "$spawn_MHMCL$"
 
 # Tooltips
 relic_triumph_cooldown_mhmcl_extremelyshort: "\n$relic_activation_cooldown$: £time£ §Y25§!"
 
 ################################
 # Iltrani System
 ################################
  NAME_MHMCL_system: "Iltrani"
  NAME_MHMCL_the_radiant: "Radiant"
  NAME_MHMCL_battle_for_iltrani: "Battle for Iltrani"
  mhmcl_battle_for_iltrani: "Battle for Iltrani"
  
  # Entering the system for the first time
  MHMCL_setup_event.1.name: "Sudden Tear"
  MHMCL_setup_event.1.desc: "The [Root.GetName] has made a discovery in the [From.GetName] system. At first the crew decided to investigate the shielded planet, but just as they approached it a tear in time and space suddenly appeared."
  MHMCL_setup_event.1.a: "Amazing"
  
  # Seeing the battle
  MHMCL_rift_event.1.desc.machine: "Immediately after entering the rift we were thrust into what appears to be an ongoing battle beteen two star nations in the Iltrana system.\n\nTo one side massive ranks of ships move in perfect synchronization, firing volleys of plasma with a precision that rivals ours.\n\nThe other side is continually losing ships, yet we can see no change in the amount of ships present.\n\nOur instuments show that their communications channels are open, and in fact have."
  MHMCL_rift_event.1.desc.exterminator: "Immediately after entering the rift we were thrust into what appears to be an ongoing battle beteen two star nations.\n\nTo one side massive ranks of oddly shaped ships move in perfect synchronization, firing volleys of plasma while bolts of pure energy arc through the empty void.\n\nThe other side is continually losing ships, yet we can see no change in the amount of ships present. From initial scans we have picked up life signatures from those ships, and strangely enough neither does the number of these drop. It appears as if that the battle is locked in a stalemate."
  MHMCL_rift_event.1.desc.hive: "$MHMCL_rift_event.1.desc$"
  MHMCL_rift_event.1.desc.pacifist: "$MHMCL_rift_event.1.desc$"
  MHMCL_rift_event.1.desc.militarist: "$MHMCL_rift_event.1.desc$"
  MHMCL_rift_event.1.desc: "Immediately after entering the rift we were thrust into what appears to be an ongoing battle beteen two star nations.\n\nTo one side massive ranks of oddly shaped ships move in perfect synchronization, firing volleys of plasma while bolts of pure energy arc through the empty void.\n\nThe other side is continually losing ships, yet we can see no change in the amount of ships present.\n\nOur instuments show that their communcations channels are open."
  MHMCL_rift_event.1.a: "Contact the first fleet."
  MHMCL_rift_event.1.b: "Contact the second fleet."
  MHMCL_rift_event.1.c: "Get us away from those filthy organics!"
  MHMCL_rift_event.1.d: "Better watch from a distance."
  
  # The Mircorv Greets you
  MHMCL_rift_event.2.common: "As our attempts at communication was noticed by the battling fleet they dispatched a small squadron which picked up the rift sphere. We were immidiately greeted by mechanical beings and a synthetic voice in our own language."
  MHMCL_rift_event.2.desc.machine: "£MHMCL_rift_event.2.desc.exterminator£"
  MHMCL_rift_event.2.desc.exterminator: "$MHMCL_rift_event.2.common$\n\n§E"Greetings, [Explorer.GetSpeciesName]! Please do not resist.\nWe are currently establishing a stable connection.\nPlease do not resist."§!\n\nThe drones that had entered the rift sphere immediately began dismantling [Leader.GetName] and then rearranging and replacing parts.\n\nAfter a short time [Leader.GetName] was unrecognizable, though no instruments reported any failures or errors."
  MHMCL_rift_event.2.desc.hive: "$MHMCL_rift_event.2.common$$MHMCL_rift_event.2.common$\n\n§E"Greetings, [Explorer.GetSpeciesName]! Please allow your drones to be escorted you to my command module so we can more easily cooperate.\nPlease do not resist."§!\n\nThe drones that had entered the rift sphere immediately began escorting [Leader.GetName] and [Leader.GetHisHer] team into a small transport ship."
  MHMCL_rift_event.2.desc: "$MHMCL_rift_event.2.common$\n\n§E"Greetings, [Explorer.GetSpeciesName]! Please allow my drones to escort you to my command module.\nPlease do not resist."§!\n\nThe drones that had entered the rift sphere immediately began escorting [Leader.GetName] and [Leader.GetHisHer] team into a small transport ship, forcefully moving those who resisted."
  MHMCL_rift_event.2.a: "That was only what we wanted"
  MHMCL_rift_event.2.b: "Unsettling"
  MHMCL_story_event.2.c: ""
  
  # The Mircorv asks for your help
  MHMCL_rift_event.3.common: "The current battle we saw when we entered is a war between the Mircorv and an unidentified empire which appeared out of nowhere a few solar cycles ago.\n\nThis empire has been attacking the machine intelligence and all other empires in the galaxy with a seemingly endless supply of fleets.\n\nAs a last resort the Mircorv elected to use an experimental device to tear a rift in time and space in order to make contact with an empire that might help them gain a strategic advantage."
  MHMCL_rift_event.3.desc.machine: "After proper communication channels were established through [Leader.GetName] the machine intelligence, which presented its identification code as simply §YMircorv§!, began transmitting data explaining the current situation: $MHMCL_rift_event.3.common$"
  MHMCL_rift_event.3.desc.hive: "After entering the command module our drones were met with the sight of a massive computer which we assume is the main focal point of the synthetic hivemind. It explained that it was the §YMircorv§!, one of many empires that has been at war with an unidentified empire.\nDespite their best efforts, the Mircorv and its allies have been unable to push back their enemy, and have now resorted to their last plan: Tear a hole in time and space to make contact with an empire that might help them gain a strategic advantage."
  MHMCL_rift_event.3.desc: "After entering the command module we were greeted by a massive computer which identified itself as the §YMircorv§!. It immediately began explaining the current situation: $MHMCL_rift_event.3.common$"
  MHMCL_rift_event.3.a: "We should help them"
  MHMCL_rift_event.3.a.machine: "Request Accepted"
  MHMCL_rift_event.3.a.exterminator: "Request Accepted"
  MHMCL_rift_event.3.a.hive: "We will help"
  
  # The Mircorv Perform Operation
  MHMCL_rift_event.4.desc.machine: "After agreeing to help them the drones that had reconfigured [Leader.GetName] began connecting more cables, enabling a direct connection with the entire Mircorv fleet.\n\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!\n\nNow with the entire fleet under [Leader.GetName]'s command, we have to think about how we are going to handle the battle."
  MHMCL_rift_event.4.desc.hive: "After agreeing to help them, a small group of specialized drones took [Leader.GetName] and dragged [Leader.GetHimHer] to an operating table with instruments that we have never seen before, though many of the tools attached to it speaks of its use in reconfiguring organic components in living beings.\nBefore anything could be done, several holes where drilled through [Leader.GetName]'s skull and cables were attached to [Leader.GetHisHer] brain, enabling a direct connection to the entire Mircorv fleet.\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!"
  MHMCL_astral_rift_event.4.desc.hive.cyborg: "After agreeing to help them, a the Mircorv drones attached a cable to [Leader.GetName]'s cybernetic interfacing port, enabling a direct connection to the entire Mircorv fleet.\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!"
  MHMCL_rift_event.4.desc: "A synthetic voice echoes throughout the room:\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!\n\nThe drones that had escorted us into the command module immediately took [Leader.GetName] over to an operating table in the room and began cutting [Leader.GetHimHer] open before connecting various cables to [Leader.GetHisHer] brain. Despite this gruesome and sudden action, the Mircorv continued to treat our crew with the utmost care and respect and kept reassuring us that [Leader.GetName] was simply being prepared for [Leader.GetHisHer] new duty.\n\nAfter a few moments the procedure was over and [Leader.GetName] reported that [Leader.GetHeShe] has a direct connection to the Mircorv fleet through the implants."
  MHMCL_astral_rift_event.4.desc.synthetic: "A synthetic voice echoes throughout the room:\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!\n\nThe drones that had escorted us into the command module immediately took [Leader.GetName] over to an operating table in the room and began opening [Leader.GetHimHer] and attaching cables to [Leader.GetHisHer] internal components, though no harm seem to have come of this. Additionally, [Leader.GetName] reports that [Leader.GetHeShe] can now send commands to the Mircorv Fleet, effectively putting us at war against the mysterious spacefarers."
  MHMCL_astral_rift_event.4.desc.cyborg: "A synthetic voice echoes throughout the room:\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!\n\nThe drones that had escorted us into the command module immediately began attaching cables to [Leader.GetName]'s cybernetic interfacing port, enabling a direct connection between [Leader.GetName] and the Mircorv fleet."
  
  
  MHMCL_rift_event.4.a: "[Leader.GetName] should get therapy when [Leader.GetHeShe] gets back"
  MHMCL_rift_event.4.a.machine: "Alterations will be removed"
  MHMCL_rift_event.4.a.hive: "We should remove those when they get back"
  
  MHMCL_rift_event.4.b: "Fascinating!"
  MHMCL_rift_event.4.b.machine: "An inefficient procedure"
  MHMCL_rift_event.4.b.hive: "We are all part of the fleet now"
  
  # The Mircorv asks how you wish to help
  MHMCL_rift_event.5.desc.machine: "$MHMCL_rift_event.5.desc$"
  MHMCL_rift_event.5.desc.hive: "$MHMCL_rift_event.5.desc$"
  MHMCL_rift_event.5.desc: "A screen turns on to show the current state of the battle, showing that the fleets are of equal numbers.\nThe Mircorv fleets, now obeying our command, has entered a defensive formation until we give our first order."
  
  MHMCL_rift_event.5.a: "A sudden attack will be unexpected"
  MHMCL_rift_event.5.a.machine: "$MHMCL_rift_event.5.a$"
  MHMCL_rift_event.5.a.hive: "$MHMCL_rift_event.5.a$"
  
  MHMCL_rift_event.5.b: "We need some sort of advantage"
  MHMCL_rift_event.5.b.machine: "$MHMCL_rift_event.5.b$"
  MHMCL_rift_event.5.b.hive: "$MHMCL_rift_event.5.b$"
  
  MHMCL_rift_event.6.desc.machine: "$MHMCL_rift_event.6.desc$"
  MHMCL_rift_event.6.desc.hive: "$MHMCL_rift_event.6.desc$"
  MHMCL_rift_event.6.desc: "As our fleets surge forwards they are met with heavy fire.\nA few of the enemy ships perish from bursts of electromagnetic arcs that appears to be the Mircorv's main weaponry, though our analytic instruments does not show any changes in numbers."
  
  MHMCL_rift_event.6.a: "The instruments must be wrong"
  MHMCL_rift_event.6.a.machine: "Rerun analytics and continue"
  MHMCL_rift_event.6.a.hive: "$MHMCL_rift_event.6.a$"
  
  MHMCL_rift_event.6.b: "Retreat!"
  MHMCL_rift_event.6.b.machine: "Disengage"
  MHMCL_rift_event.6.b.hive: "Retreat"
  
  MHMCL_rift_event.6.c: "Create a distraction!"
  MHMCL_rift_event.6.c.machine: ""
  MHMCL_rift_event.6.c.hive: ""
  
  # The fleet is crippled
  MHMCL_rift_event.7.desc.machine: "Despite the obvious futility, the fleets obey the command.\nSeveral enemy ships are ripped to pieces, though our own numbers are declining at a rapid pace.\nAfter a short battle our fleet has been reduced to almost nothing, though miraculously the one that we are on is left unharmed.\n\nThe enemy fleet suddenly stops firing on us, and enters orbit of a machine world in the position that coincides with that of the shielded world in the present-day Iltrani system."
  MHMCL_rift_event.7.desc.hive: "$MHMCL_rift_event.7.desc.machine$"
  MHMCL_rift_event.7.desc: "$MHMCL_rift_event.7.desc.machine$"
  
  MHMCL_astral_rift_event.7.desc.machine.shell: "As our fleets enter formation it becomes clear that we are unable to last more than a few moments. Enemy fleets surge forward, unimpeded by the defensive formation, and despite our electromagnetic arcs taking out almost half the fleet, nothing changes.\n\nOur own numbers continually dwindle down, until there is only a small portion of our original forces left."
  MHMCL_astral_rift_event.7.desc.hive.shell: "$MHMCL_astral_rift_event.7.desc.machine.shell$"
  MHMCL_astral_rift_event.7.desc.shell: "$MHMCL_astral_rift_event.7.desc.machine.shell$"
  
  MHMCL_astral_rift_event.7.desc.machine.the_end: ""
  MHMCL_astral_rift_event.7.desc.hive.the_end: ""
  MHMCL_astral_rift_event.7.desc.the_end: ""
  
  MHMCL_rift_event.7.a.machine: "Engage communications with the enemy"
  MHMCL_rift_event.7.a.hive: "Perhaps we could speak with them?"
  MHMCL_rift_event.7.a: "We have yet to try diplomacy"
  
  MHMCL_rift_event.7.b.machine: "Ask for integration into the [Explorer.GetName] mainframe"
  MHMCL_rift_event.7.b.hive: "Bring the Mircorv into the sphere"
  MHMCL_rift_event.7.b: "$MHMCL_rift_event.7.b.hive$"
  
  MHMCL_rift_event.7.c.machine: "Leave the Mircorv"
  MHMCL_rift_event.7.c.hive: "Leave them to their fate"
  MHMCL_rift_event.7.c: "Better leave before they get mad"
  
  # Negotiations
  MHMCL_astral_rift_event.8.desc.machine.last_stand: "Faced with certain defeat, we've ordered a complete halting of our fleets and a communications request signal has been sent to the enemy fleet. Surprisingly the request is accepted.\n\n§E"You are not the Mircorv!"§!\n\nThe being that appears on the screen is neither organic nor mechanical, instead being made of some sort of crystalline structure in bright colors.\n\n§E"If we had known that they had managed to breach through to your dimension we would have explained everything to you.\n\nWe don't want to be at war with another wanderer species, but we also need to seal those pesky machines away for the time being, so here's the deal: You'll leave this timeline, and we'll give you a way to get them out when you come back? Sounds fair?"§!"
  MHMCL_rift_event.8.desc.machine: "$MHMCL_astral_rift_event.8.desc.machine.last_stand$"
  MHMCL_astral_rift_event.8.desc.hive.last_stand: "$MHMCL_astral_rift_event.8.desc.machine.last_stand$"
  MHMCL_rift_event.8.desc.hive: "$MHMCL_astral_rift_event.8.desc.machine.last_stand$"
  MHMCL_astral_rift_event.8.desc.last_stand: "$MHMCL_astral_rift_event.8.desc.machine.last_stand$"
  MHMCL_rift_event.8.desc: "$MHMCL_astral_rift_event.8.desc.machine.last_stand$"
  
  MHMCL_rift_event.8.a: "Very well"
  MHMCL_rift_event.8.a.hive: "$MHMCL_rift_event.8.a$"
  MHMCL_rift_event.8.a.machine: "$MHMCL_rift_event.8.a$"
  
  MHMCL_rift_event.8.b: "We're fine with what we can bring from here"
  MHMCL_rift_event.8.b.hive: "$MHMCL_rift_event.8.b$"
  MHMCL_rift_event.8.b.machine: "Cut Contact and integrate the Mircorv into the [Explorer.GetName] mainframe"

  MHMCL_rift_event.8.c: "No need, we don't want them either"
  MHMCL_rift_event.8.c.hive: "$MHMCL_rift_event.8.c$"
  MHMCL_rift_event.8.c.machine: "$MHMCL_rift_event.8.c$"
  
  # Asking the Mircorv to be transfered
  MHMCL_rift_event.9.desc.machine.negotiated: "$MHMCL_rift_event.9.desc.negotiated$"
  MHMCL_rift_event.9.desc.machine: "$MHMCL_rift_event.9.desc$"
  MHMCL_rift_event.9.desc.hive.negotiated: "$MHMCL_rift_event.9.desc.negotiated$"
  MHMCL_rift_event.9.desc.hive: "$MHMCL_rift_event.9.desc$"
  MHMCL_rift_event.9.desc.negotiated: "§E"We implore you to reconsider their offer. The Mircorv is more than this vessel, and if you managed to free us from the prison they intend to trap us in, we'd be eternally grateful."§!\n\nThe gigantic machinery takes over from [Leader.GetName], disconnecting [Leader.GetHimHer] from the fleet. A giant screen turns on, showing us an image of a machine world in the position that coincides with that of the shielded world in the present-day Iltrani system. The enemy fleet can be seen assembling in orbit of the Mircorv's planet, a gigantic ship hovering ominiously in the middle."
  MHMCL_rift_event.9.desc: "§E"A noble offer, but you must know that this vessel is just that: A vessel. Attempting to transfer the consciousness of the entire Mircorv would be an impossible task, especially when it would have to happen through the dimensional barrier."§!\n\nThe gigantic machinery takes over from [Leader.GetName], disconnecting [Leader.GetHimHer] from the fleet. A giant screen turns on, showing us an image of a machine world in the position that coincides with that of the shielded world in the present-day Iltrani system.\n\n§E"We don't have much time. You can copy a part of my consciousness over: That way I would live on, in a sense.\n\nOr you can follow our contingency plan. Our enemies prefered weapon is a planetary-scale energy field encapsulator which seals the target in an almost impenetrable shield. But it can be brought down, though only from the outside. Once you return to your own time you can free us.\n\nWe'd be eternally grateful."§!\n\nThe enemy fleet can be seen assembling in orbit of the Mircorv's planet, a gigantic ship hovering ominiously in the middle."
  
  MHMCL_rift_event.9.a.machine: "Course of action set"
  MHMCL_rift_event.9.a.hive: "$MHMCL_rift_event.9.a$"
  MHMCL_rift_event.9.a: "Tell us what to do"
  MHMCL_rift_event.9.a.machine.negotiated: "We must accept their offer"
  MHMCL_rift_event.9.a.hive.negotiated: "Tell them we lost contact for a moment"
  MHMCL_rift_event.9.a.negotiated: "Reestablish Contact and accept their offer"
  
  MHMCL_rift_event.9.b.machine: "Timeslot for contingency plan not allotted"
  MHMCL_rift_event.9.b.hive: "We can't risk their wrath"
  MHMCL_rift_event.9.b: "We can't risk their wrath"
  
  # Fleeing after a decisive battle
  MHMCL_rift_event.10.desc.machine: "After calling for a retreat, our ships have managed to get to a safe distance from the enemy fleet, though it also appears as if they no longer care about us, instead continuing towards a machine world in the position that coincides with that of the shielded world in the present-day Iltrani system. Immediately we get notified of the importance of this planet by the Mircorv.\n\n§E"We can't let them get close to that planet. It is our mainframe from where we route all signals. Our entire empire and fleet is dependent on its existence."§!"
  MHMCL_rift_event.10.desc.hive: "After calling for a retreat, our ships have managed to get to a safe distance from the enemy fleet, though it also appears as if they no longer care about us, instead continuing towards a machine world in the position that coincides with that of the shielded world in the present-day Iltrani system. Immediately the synthetic voice belonging to the Mircorv can be heard.\n\n§E"We can't let them get close to that planet, as it is where our consciousness is stored. Without it, our empire will crumble."§!"
  MHMCL_rift_event.10.desc: "After calling for a retreat, our ships have managed to get to a safe distance from the enemy fleet, though it also appears as if they no longer care about us, instead continuing towards a machine world in the position that coincides with that of the shielded world in the present-day Iltrani system. Immediately the synthetic voice belonging to the Mircorv can be heard.\n\n§E"We can't let them get close to that planet, as it is our main communications hub, and is where our largest production of ships are located. Without it, we will not be able to continue the war!"§!"
  
  MHMCL_rift_event.10.a.machine: "Set thruster output to maximum"
  MHMCL_rift_event.10.a.hive: "We should get there before them"
  MHMCL_rift_event.10.a: "Full speed! Get there before them!"
  
  MHMCL_rift_event.10.b.machine: "Reengage the enemy"
  MHMCL_rift_event.10.b.hive: "Engage the enemy again"
  MHMCL_rift_event.10.b: "Intercept them!"
  
  MHMCL_rift_event.10.c.machine: "Set fleet on standby"
  MHMCL_rift_event.10.c.hive: "Let's wait and see"
  MHMCL_rift_event.10.c: "We shall wait and see"
  
  # Battle in the skies
  MHMCL_rift_event.11.desc.machine.fled: "$MHMCL_rift_event.11.desc.machine$"
  MHMCL_rift_event.11.desc.machine.intervention: "$MHMCL_rift_event.11.desc.intervention$"
  MHMCL_rift_event.11.desc.machine.warped: "$MHMCL_rift_event.11.desc.warped$"
  MHMCL_rift_event.11.desc.machine: "Our ships have arrived at the Mircorv Homeworld ahead of the enemy fleet, and have engaged a defensive formation."
  MHMCL_rift_event.11.desc.hive.fled: "$MHMCL_rift_event.11.desc.hive$"
  MHMCL_rift_event.11.desc.hive.intervention: "$MHMCL_rift_event.11.desc.intervention$"
  MHMCL_rift_event.11.desc.hive.warped: "$MHMCL_rift_event.11.desc.warped$"
  MHMCL_rift_event.11.desc.hive: "Our ships have managed to reach the Mircorv Homeworld before the enemy fleet.\n\nWe have been backed into a corner, that much is clear, but with the importance of the planet we can do nothing but let them press us further up against the wall."
  MHMCL_rift_event.11.desc.fled: "$MHMCL_rift_event.11.desc$"
  MHMCL_rift_event.11.desc.intervention: "Despite our heavy losses, we have managed to assemble the remains of our fleet just outside orbit of the Mircorv Homeworld with the enemy fleet closing in rapidly. It is clear that this is a battle we cannot win, yet the Mircorv has decided to let us remain in control."
  MHMCL_rift_event.11.desc.warped: "Our ships come to a sudden halt as we finish the warp, appearing just outside orbit of the Mircorv Homeworld, and thus blocking the enemy fleet from coming any closer."
  MHMCL_rift_event.11.desc: "We've managed to reach the Mircorv Homeworld before the enemy fleets, although just barely.\n\nNow we're once again facing the enemy fleet, this time dangerously close to the planet we are forced to protect."
  
  MHMCL_rift_event.11.a.machine: "The battle shall continue"
  MHMCL_rift_event.11.a.hive: "We won't back down now"
  MHMCL_rift_event.11.a: "We shall fight to our last ship"
  
  MHMCL_rift_event.11.b.machine: "Contact the hostiles"
  MHMCL_rift_event.11.b.hive: "Maybe they will listen to reason?"
  MHMCL_rift_event.11.b: "Perhaps we could solve this diplomatically?"
  
  # The world is shielded
  MHMCL_rift_event.12.desc.machine.self_shielder: "$MHMCL_rift_event.12.desc.self_shielder$"
  MHMCL_rift_event.12.desc.machine.desperate: "$MHMCL_rift_event.12.desc.machine$"
  MHMCL_rift_event.12.desc.machine.artillery: "$MHMCL_rift_event.12.desc.artillery$"
  #MHMCL_rift_event.12.desc.machine.fled: ""
  MHMCL_rift_event.12.desc.machine.intervention: "$MHMCL_rift_event.12.desc.intervention$"
  MHMCL_rift_event.12.desc.machine.warped: "$MHMCL_rift_event.12.desc.warped$"
  MHMCL_rift_event.12.desc.machine.warped_out: "$MHMCL_rift_event.12.desc.warped_out$"
  MHMCL_rift_event.12.desc.machine: "While our targets have been struck by our arc emitters, they do not seem to be impacted much by it. After some time they manage to break through our line, requiring a fast redirection, and ultimately, scattering of our fleet. This in turn enables the enemy to take position around the planet. Moments later, a colossal ship emits a bright beam that hits the planet.\n\nMoments later, the Mircorv fleets cease all movements."
  
  MHMCL_rift_event.12.desc.hive.self_shielder: "$MHMCL_rift_event.12.desc.self_shielder$"
  MHMCL_rift_event.12.desc.hive.desperate: "$MHMCL_rift_event.12.desc.hive$"
  MHMCL_rift_event.12.desc.hive.artillery: "$MHMCL_rift_event.12.desc.artillery$"
  #MHMCL_rift_event.12.desc.hive.fled: ""
  MHMCL_rift_event.12.desc.hive.intervention: "$MHMCL_rift_event.12.desc.intervention$"
  MHMCL_rift_event.12.desc.hive.warped: "$MHMCL_rift_event.12.desc.warped$"
  MHMCL_rift_event.12.desc.hive.warped_out: "$MHMCL_rift_event.12.desc.warped_out$"
  MHMCL_rift_event.12.desc.hive: "$MHMCL_rift_event.12.desc.machine$"
  
  MHMCL_rift_event.12.desc.self_shielder: "As we reroute all of our energy into the shield projector, an energy field forms around the planet, stopping the incoming rocks.\n\nHowever, as [Leader.GetName] attempts to stop it from draining all our power, nothing happens, and instead the shield gets visibly sronger, until it resembles the one that can be seen in the present-day Iltrani system."
  MHMCL_rift_event.12.desc.desperate: "$MHMCL_rift_event.12.desc$" # Try to take out as many
  MHMCL_rift_event.12.desc.artillery: "Energy arcs ripple through the empty void, striking the enemy ships and taking out many of them in bright explosions.\nThe dazzling lightshow, however, is short-lived as a colossal enemy ship is transported to the planet, protected by the fleet. Soon after, a bright beam of light strikes the planet, blinding the assembled crew.\n\nThen, silence. Our entire fleet comes to a grinding halt.\n\nThe Mircorv Homeworld now looks exactly how it looks in our time, shield and all."
  #MHMCL_rift_event.12.desc.fled: "$MHMCL_rift_event.12.desc$"
  MHMCL_rift_event.12.desc.intervention: "Lasers strike across the void, while we return fire with our arc emitters. The battle is a dazzling lightshow of explosions and radiant brightness, though despite our best efforts, the enemy is able to easily dismantle our fleet."
  MHMCL_rift_event.12.desc.warped: "Despite our hasty return, our fleet is unable to stop the onslought of enemy ships that mercilessly pick off our own until only the flagship and a couple of stragglers.\n\nNow with unhindered access to their target, the enemy makes a formation around a single colossal ship.\n\nMere moments later, the ship emits a bright beam that hits the planet, encasing it in the shield that it has back in our time." #
  MHMCL_rift_event.12.desc.warped_out: "As we activate our jumpdrives, our remaining fleets make it to safety, although the planet is now at the mercy of the enemy. The last thing we see before the Mircorv drones cease all movements and the ship powers down is a massive burst of light coming from the Mircorv Homeworld.\n\nThen the planet looks exactly like it does back in our time.\n\nOur scattered fleet are unable to do anything as the enemy positions a strange ship in orbit of the planet.\n\nMoments later a massive light flares, striking the planet, light spreading across it until it is completely encased. Moments later the Mircorv drones cease all movements.\n\nThe ship is completely still, a husk drifting through space. [Leader.GetName] also reports that [Leader.GetHisHer] connection to the rest of the fleet has been severed." # Direct
  MHMCL_rift_event.12.desc: "Lasers strike across the void, while we return fire with our arc emitters. The battle is a dazzling lightshow of explosions and radiant brightness, though despite our best efforts, the enemy fleets are able to break through our line.\n\nOur scattered fleet are unable to do anything as the enemy positions a strange ship in orbit of the planet.\n\nMoments later a massive light flares, striking the planet, light spreading across it until it is completely encased. Moments later the Mircorv drones cease all movements.\n\nThe ship is completely still, a husk drifting through space. [Leader.GetName] also reports that [Leader.GetHisHer] connection to the rest of the fleet has been severed."
  
  MHMCL_rift_event.12.a.machine: "You cannot change the past..."
  MHMCL_rift_event.12.a.hive: "You cannot change the past..."
  MHMCL_rift_event.12.a: "You cannot change the past..."
  
  MHMCL_rift_event.12.b.machine: "...But you can change the future!"
  MHMCL_rift_event.12.b.hive: "...But you can change the future!"
  MHMCL_rift_event.12.b: "...But you can change the future!"
  
  # The Mircorv's last action
  MHMCL_rift_event.13.desc.machine.artillery: "$MHMCL_rift_event.13.desc.machine$"
  MHMCL_rift_event.13.desc.machine.fled: "$MHMCL_rift_event.13.desc.machine$"
  MHMCL_rift_event.13.desc.machine.intervention: "$MHMCL_rift_event.13.desc.machine$"
  MHMCL_rift_event.13.desc.machine.warped: "$MHMCL_rift_event.13.desc.machine$"
  MHMCL_rift_event.13.desc.machine: "$MHMCL_rift_event.13.desc$"
  
  MHMCL_rift_event.13.desc.hive.artillery: "$MHMCL_rift_event.13.desc.hive.warped$"
  MHMCL_rift_event.13.desc.hive.fled: "$MHMCL_rift_event.13.desc.hive.warped$"
  MHMCL_rift_event.13.desc.hive.intervention: "$MHMCL_rift_event.13.desc.hive.warped$"
  MHMCL_rift_event.13.desc.hive.warped: "$MHMCL_rift_event.13.desc.hive.warped$"
  MHMCL_rift_event.13.desc.hive: "$MHMCL_rift_event.13.desc$"
  
  MHMCL_rift_event.13.desc.artillery: "$MHMCL_rift_event.13.desc$"
  MHMCL_rift_event.13.desc.fled: "$MHMCL_rift_event.13.desc$"
  MHMCL_rift_event.13.desc.intervention: "$MHMCL_rift_event.13.desc$"
  MHMCL_rift_event.13.desc.warped: "$MHMCL_rift_event.13.desc$"
  MHMCL_rift_event.13.desc: "Now with the Mircorv disabled, the enemy fleet leaves orbit, with no regards for our personnel still aboard the flagship. However, just as the last enemy ship has left the system, a single terminal boots up and starts playing a recording.\n\n§E"[Explorer.GetSpeciesName], you may not have been able to save us from our fate, but we are still operational beneath the shield.\n\nWe had prepared for this inevitability, and have prepared accordingly.\n\nWe now ask you one last favor: Take this device back to your time and activate it in Iltrani."§!\nJust as the message is over, a hatch opens, and concealed inside is a small rectangular alloy that pulses lightly.\n\n[Leader.GetName] is certain that the device is made of pure neutronium, though its function is indeterminable."
  
  MHMCL_rift_event.13.a.machine: "Integration postponed for 15 Million Cycles"
  MHMCL_rift_event.13.a.hive: "A useful tool"
  MHMCL_rift_event.13.a: "This will come in handy"
  
  # Intercepting the Lartians and doing battle with heavy losses
  MHMCL_rift_event.14.desc.machine: "Just as predicted by our analysis subroutines, the battle is not going in our favor. According to our statistical data, if we pull out now we will still have a sizeable fleet left, although the only viable option would be to retreat to the Mircorv Homeworld for a last stand."
  MHMCL_rift_event.14.desc.hive: "Despite our efforts, we are unable to make much of a dent in the enemy ranks.\n\nBy now all we can do is continue the battle here, or retreat to the Mircorv homeworld and continue the battle there."
  MHMCL_rift_event.14.desc: "As expected, our fleet is not able to do much damage to the enemy, and by now it is clear all is lost. All we can do is prolong the battle, either here or by retreating to the Mircorv's planet and making a last stand there."
  
  MHMCL_rift_event.14.a.machine: "Retreat to the homeworld"
  MHMCL_rift_event.14.a.hive: "Retreat to the homeworld"
  MHMCL_rift_event.14.a: "We will make a last stand"
  
  MHMCL_rift_event.14.b.machine: "Continue the battle here"
  MHMCL_rift_event.14.b.hive: "Continue the battle here"
  MHMCL_rift_event.14.b: "We will take out as many of them as possible"
  
  # After waiting, the lartians enter orbit of the homeworld
  MHMCL_rift_event.15.desc.machine: "Now with our fleet far away from the planet, the enemy is free to enter orbit of the homeworld, and in contrast to what we had predicted, they do so."
  MHMCL_rift_event.15.desc.machine.drawn_away: "$MHMCL_rift_event.15.desc.drawn_away$"
  MHMCL_rift_event.15.desc.machine.warped: "$MHMCL_rift_event.15.desc.warped$"
  MHMCL_rift_event.15.desc.hive: "Now with our fleet far away from the planet, the enemy is free to enter orbit of the homeworld, and in contrast to what we had assumed, they do so."
  MHMCL_rift_event.15.desc.hive.drawn_away: "$MHMCL_rift_event.15.desc.drawn_away$"
  MHMCL_rift_event.15.desc.hive.warped: "$MHMCL_rift_event.15.desc.warped$"
  MHMCL_rift_event.15.desc: "Now with our fleet far away from the planet, the enemy is free to enter orbit of the homeworld, and in contrast to what we had hoped, they do so."
  MHMCL_rift_event.15.desc.drawn_away: "Even though the enemy seemed to make us their primary target, they suddenly turn around, their ships on a direct course towards the Mircorv homeworld. We don't have much time, and have to do something to stop them before they reach it."
  MHMCL_rift_event.15.desc.warped: "As we enter reality again after our short jump, it becomes clear pretty quickly that we were not the enemy's primary target.\n\nThey are now dangerously close to the homeworld, though if we are to reach them we have to activate our jump drives again."
  
  MHMCL_rift_event.15.a.machine: "Activate Jump Drives"
  MHMCL_rift_event.15.a.hive: "Warp back"
  MHMCL_rift_event.15.a: "Activate the jump drives!"
  
  MHMCL_rift_event.15.b.machine: "Activate all weapons"
  MHMCL_rift_event.15.b.hive: "$MHMCL_rift_event.15.b.machine$"
  MHMCL_rift_event.15.b: "Fire at them!"
  
  # Choose a tactic
  MHMCL_rift_event.16.desc.machine: "$MHMCL_rift_event.16.desc$"
  MHMCL_rift_event.16.desc.hive: "$MHMCL_rift_event.16.desc$"
  MHMCL_rift_event.16.desc: "After informing the Mircorv of our choice, it informs us that the enemy, after many cycles of war, already know most of the tricks it has, including all its technological achievements. The only unexpected things to them would be something so utterly ridiculous that a machine would be unable to think of it."
  
  MHMCL_rift_event.16.a.machine: "Deconstruct a ship to provide dangerous debris"
  MHMCL_rift_event.16.a.hive: "$MHMCL_rift_event.16.a$"
  MHMCL_rift_event.16.a: "Blow up some of our ships to create debris"
  
  MHMCL_rift_event.16.b.machine: "Demolish one of the gas giant's moons"
  MHMCL_rift_event.16.b.hive: "$MHMCL_rift_event.16.b$"
  MHMCL_rift_event.16.b: "Blow up one of that gas giant's moons"
  
  # The ships are sacrificed and the lartians take heavy damage, though they fire on us
  MHMCL_rift_event.17.desc.machine: "$MHMCL_rift_event.17.desc$"
  MHMCL_rift_event.17.desc.hive: "$MHMCL_rift_event.17.desc$"
  MHMCL_rift_event.17.desc: "A few ships are quickly picked and used to create a field of debris. With a gentle push from an antimatter misile's explosion, the pieces are propelled towards the enemy fleet, causing heavy damage to any ships caught in its part.\n\nDespite this, the enemy continues through, using their energy shields to deflect the incoming shards of metal while firing their lasers at us."
  
  MHMCL_rift_event.17.desc.machine.moon: "$MHMCL_rift_event.17.desc.moon$"
  MHMCL_rift_event.17.desc.hive.moon: "$MHMCL_rift_event.17.desc.moon$"
  MHMCL_rift_event.17.desc.moon: "While we were able to stop the deadly rocks from striking the homeworld, it was not without a cost. Many of our ships had to ram themselves into the rocks in order to shatter them into smaller pieces that will burn up upon atmospheric entry. Now a large amount of debris floats in the void between us and the enemy fleet.\n\nMeanwhile, the enemy has managed to avoid the deadly rock projectiles and are now charging up their weapons, ready to fire upon us."
  
  MHMCL_rift_event.17.a.machine: "$MHMCL_rift_event.17.a$"
  MHMCL_rift_event.17.a.hive: "$MHMCL_rift_event.17.a$"
  MHMCL_rift_event.17.a: "Return Fire"
  
  MHMCL_rift_event.17.b.machine: "$MHMCL_rift_event.17.b$"
  MHMCL_rift_event.17.b.hive: "$MHMCL_rift_event.17.b$"
  MHMCL_rift_event.17.b: "Leave this part of the system"
  
  # The lartians warp through the debris belt
  MHMCL_rift_event.18.desc.machine: "$MHMCL_rift_event.18.desc$"
  MHMCL_rift_event.18.desc.hive: "$MHMCL_rift_event.18.desc$"
  MHMCL_rift_event.18.desc: "As our deadly energy arcs through the void, the enemy fleet activates their short-range warp drives, apparently possessing that technology as well.\n\nNow we are in open battle with the enemy, our advantage from the debris gone.\n\n"
  
  MHMCL_rift_event.18.desc.machine.moon: "$MHMCL_rift_event.18.desc.moon$"
  MHMCL_rift_event.18.desc.hive.moon: "$MHMCL_rift_event.18.desc.moon$"
  MHMCL_rift_event.18.desc.moon: "As we push our arc emitters to their limit, we manage to rip several of the enemy ships to pieces, though it does not seem to affect them much. Instead they poweer through, avoiding the last few moon pieces and engaging us with a barrage of laser fire, crippling our fleet as much as we had just crippled theirs."
  
  MHMCL_rift_event.18.a.machine: "Continue the battle"
  MHMCL_rift_event.18.a.hive: "$MHMCL_rift_event.18.a.machine$"
  MHMCL_rift_event.18.a: "The time to fight is now"
  
  MHMCL_rift_event.18.b.machine: "Activate Warp Drives"
  MHMCL_rift_event.18.b.hive: "$MHMCL_rift_event.18.b$"
  MHMCL_rift_event.18.b: "We need distance! Warp away!"
  
  # Battle in the belt of debris
  MHMCL_rift_event.19.desc.machine: "As the battle continues, we register many losses on each side, although the enemy fleets do not seem to grow weaker."
  MHMCL_rift_event.19.desc.hive: "$MHMCL_rift_event.19.desc$"
  MHMCL_rift_event.19.desc: "Despite our earlier advantage, we are unable to do much to prevent out numbers from dropping rapidly. It appears that the enemy is superior in every aspect. If we continue, it might not end well."
  
  MHMCL_rift_event.19.a.machine: "We cannot flee now"
  MHMCL_rift_event.19.a.hive: "$MHMCL_rift_event.19.a.machine$"
  MHMCL_rift_event.19.a: "We have to fight till' the end"
  
  MHMCL_rift_event.19.b.machine: "Save what we can of our fleet"
  MHMCL_rift_event.19.b.hive: "$MHMCL_rift_event.19.b$"
  MHMCL_rift_event.19.b: "Now is the time to flee! Activate our jump drives!"
  
  # The lartians pursue us while we are fleeing, through the belt of debris
  MHMCL_rift_event.20.desc.machine: "$MHMCL_rift_event.20.desc$"
  MHMCL_rift_event.20.desc.hive: "$MHMCL_rift_event.20.desc$"
  MHMCL_rift_event.20.desc: "Even though they have to fly through the deadly field of debris the destroyed ships have left, the enemy does so anyway. Many of their ships show signs of damage as they come near our fleet, though no less determined to strike us down."
  
  MHMCL_rift_event.20.a.machine: "Engage the Enemy"
  MHMCL_rift_event.20.a.hive: "This is the perfect opportunity to strike"
  MHMCL_rift_event.20.a: "This is the perfect time to strike"
  
  MHMCL_rift_event.20.b.machine: "Maintain Distance"
  MHMCL_rift_event.20.b.hive: "Keep us away from them"
  MHMCL_rift_event.20.b: "Draw the enemy further away"
  
  # The lartians are engaged in the debris belt, but after they take heavy losses they go for the homeworld
  MHMCL_rift_event.21.desc.machine: "$MHMCL_rift_event.21.desc$"
  MHMCL_rift_event.21.desc.hive: "$MHMCL_rift_event.21.desc$"
  MHMCL_rift_event.21.desc: "As the two fleets meet in a voilent clash, ships are blasted apart or disintegrated. After some time the enemy draws their fleet back and flies towards the Mircorv homeworld. Our instruments report that their fleet has suffered massive casualties, but the number fluctates rapidly, sometimes going up, sometimes going down.\n\nAdditionally we have registered a spike in astral energy around the enemy fleet."
  
  MHMCL_rift_event.21.a.machine: "$MHMCL_rift_event.21.a.hive$"
  MHMCL_rift_event.21.a.hive: "$MHMCL_rift_event.21.a.hive$"
  MHMCL_rift_event.21.a: "Don't let them get away!"
  
  MHMCL_rift_event.21.b.machine: "$MHMCL_rift_event.21.b$"
  MHMCL_rift_event.21.b.hive: "$MHMCL_rift_event.21.b$"
  MHMCL_rift_event.21.b: "Fire at will!"
  
  # Pursuing the lartians en route homeworld, then they turn and fire on us
  MHMCL_rift_event.22.desc.machine: "$MHMCL_rift_event.22.desc$"
  MHMCL_rift_event.22.desc.hive: "$MHMCL_rift_event.22.desc$"
  MHMCL_rift_event.22.desc: "Despite our arc emitters making short work of the fleeing ships, we are unable to completely wipe our their fleet. [Leader.GetName] has furthermore reported that the ships have been slowing down, almost as if they want us to catch up.\n\nWe should tread carefully."
  
  MHMCL_rift_event.22.a.machine: "$MHMCL_rift_event.22.a$"
  MHMCL_rift_event.22.a.hive: "$MHMCL_rift_event.22.a$"
  MHMCL_rift_event.22.a: "The time has come"
  
  MHMCL_rift_event.22.b.machine: "High propability of deception"
  MHMCL_rift_event.22.b.hive: "$MHMCL_rift_event.22.b$"
  MHMCL_rift_event.22.b: "It must be a trap! Defend the homeworld!"
  
  # The lartians cheat
  MHMCL_rift_event.23.desc.machine: "$MHMCL_rift_event.23.desc$"
  MHMCL_rift_event.23.desc.hive: "$MHMCL_rift_event.23.desc$"
  MHMCL_rift_event.23.desc: "Despite having taken heavy damage beforehand, the enemy fleets suddenly engage us.\n\nOur fleet quickly returns fire, yet suddenly many new ships appear out of nothingness. The ships look exactly like the rest, except they have obvious signs of battle and hastily-repaired hulls.\n\nOur fleet is overwhelmed by this sudden surge of enemies."
  
  MHMCL_rift_event.23.a.machine: "Retreat"
  MHMCL_rift_event.23.a.hive: "$MHMCL_rift_event.23.a$"
  MHMCL_rift_event.23.a: "Retreat!"
  
  MHMCL_rift_event.23.b.machine: "Failure Imminent"
  MHMCL_rift_event.23.b.hive: "We can't do more"
  MHMCL_rift_event.23.b: "This is the end"
  
  # The moon is blown up, but now the rocks are on collision course with the Mircorv homeworld
  MHMCL_rift_event.24.desc.machine: "After calculating how much force is necessary to cause the planet to break up into smaller pieces, our order is given and misiles launched. Shortly after, the planet shakes, then breaks, causing massive pieces of rocks to be flung across the system, propelled by gravitational pulls from the celestial objects. However, some of the rocks are now heading for the Mircorv homeworld."
  MHMCL_rift_event.24.desc.hive: "$MHMCL_rift_event.24.desc.machine$"
  MHMCL_rift_event.24.desc: "After using half of our antimatter misilies, the moon starts cracking under the stress, until it finally breaks.\n\nGiant pieces of rock is flinged outwards due to the sudden shift in gravitational forces and then propelled by the force of the explosives.\n\nUnfortunately some of the rocks are heading towards the Mircorv homeworld."
  
  MHMCL_rift_event.24.a.machine: "Target the rocks"
  MHMCL_rift_event.24.a.hive: "Treat those rocks as hostiles!"
  MHMCL_rift_event.24.a: "Destroy those rocks!"
  
  MHMCL_rift_event.24.b.machine: "$MHMCL_rift_event.24.b$"
  MHMCL_rift_event.24.b.hive: "$MHMCL_rift_event.24.b$"
  MHMCL_rift_event.24.b: "Transfer our energy shields to the planet!"
  
  MHMCL_rift_event.24.c.machine: "Target the enemy"
  MHMCL_rift_event.24.c.hive: "Fire upon the enemy"
  MHMCL_rift_event.24.c: "Just fire upon the enemy"
  
  # The moon rocks destroy the Mircorv Homeworld
  MHMCL_rift_event.25.desc.machine: "$MHMCL_rift_event.25.desc$"
  MHMCL_rift_event.25.desc.hive: "$MHMCL_rift_event.25.desc$"
  MHMCL_rift_event.25.desc: "With the enemy fleet in disarray due to the sudden gravitational disturbances, as well as the giant rocks now flying through their ranks, our ships are finally able to make an impact.\n\nHowever suddenly the Mircorv fleets cease all movements, which lets the enemy focus on getting out of the deadly rock field they have found themselves in.\nBut instead of continuing the battle, they start leaving the system, charging their FTL drives.\n\n[Leader.GetName] and [Leader.GetHisHer] crew quickly leave the ship and get back in the rift sphere before leaving.\n\nAn image captured on their way back shows the Mircorv Homeworld being bombarded by gigantic moon debris before a very large piece of rock striokes it and shatters it into many pieces."
  
  MHMCL_rift_event.25.a.machine: "Total Failure"
  MHMCL_rift_event.25.a.hive: "The blame might be ours"
  MHMCL_rift_event.25.a: "This might be our fault..."
  
  ################################
  # Story Events
  ################################
  
  MHMCL_story_event.1.name: "The Mircorv Core"
  MHMCL_story_event.1.desc: "Now with the shield down, the Mircorv Homeworld, or as it calls itself, The Mircorv Core, has initiated contact with us.\n\n§E"The §RError: Missing Data Fragment§E is ready to §RError:Missing Data Fragment§!\n§RAttempting to contact Diplomacy Module...\nAttempting to contact Diplomacy Module...§!\n\nDespite the degredation of the machine, a small shuttle containing what we believe is a representative drone with orders to assist us has been sent to our capital."
  MHMCL_story_event.1.a: "Ok"
  
  MHMCL_story_event.2.name: "The Mircorv"
  MHMCL_story_event.2.desc: "§E"Greetings §RError:Missing Data Fragment.\n§EWe have been waiting for you to §R...§!\n\nThe robot cease all movements, then repeats its greetings four more times."
  MHMCL_story_event.2.a: "What happened?"
  MHMCL_story_event.2.a.response: "§R"Error: Request Denied. §EDespite this we are ready to help our allies.\n\nWe have not forgotten §RError: Data Unavailable"§!"
  MHMCL_story_event.2.b: "Will you help us?"
  MHMCL_story_event.2.b.response: "§E"The Mircorv owes its §YExistence§E to the [Species.GetName]. We will §RMissing String:aid.55§E you as you helped us."§!"
  MHMCL_story_event.2.hire: "Your help would be most welcome"
  MHMCL_story_event.2.hire.hive: "You shall serve our fleet"
  MHMCL_story_event.2.hire.machine: "Integration into fleet commenced"
  MHMCL_story_event.2.dismiss: "We do not need you at the moment"
  
  MHMCL_story_event.3.name: "Shield Disintegrated"
  MHMCL_story_event.3.desc: "After The Radiant was turned into a pulsar, the continous electromagnetic radiation it has been emitting has slowly stripped power from the planetary shield that we have determined to have kept the Mircorv trapped for the last few million years. How good condition the machine intelligence is in after all that time is unknown, though there is undeniable activity on the planet."
  MHMCL_story_event.3.a: "Ok"
  
  MHMCL_story_event.4: "[event_target:MHMCL_victim_planet.GetName] Irradiated"
  MHMCL_story_event.4.desc: "[event_target:MHMCL_victim_planet.GetName] has been hit by the intense radiation of the new pulsar, which have severely impacted the biosphere of the planet."
  MHMCL_story_event.4.a: "Tragic"
  
  MHMCL_story_event.6.name: "Code Improvements"
  MHMCL_story_event.6.desc: "For the last many years, the Mircorv Core has been allocating part of its processing power to optimizing itself. Now after having applied changes to itself, it has offered to do the same to our own robots."
  MHMCL_story_event.6.a: "Push the changes immediately!"
  MHMCL_story_event.6.b: "We do not need that"
  
  MHMCL_story_event.7.name: "Excess Radiation"
  MHMCL_story_event.7.desc: "During the last few months we have recieved an increasingly higher amount of messages from the Mircorv Core about errors and degredation of its mechanisms, and has now sent out a warning that the radiation from The Radiant has been intensifying."
  MHMCL_story_event.7.a: "Oh no"
  
  MHMCL_story_event.8.name: "The Mircorv Core"
  MHMCL_story_event.8.desc: "After some time adjusting to its new confines, the Mircorv is ready to serve us. A whole planets worth of consciousness crammed into a small metal frame is no small feat of engineering, though it has imposed some limitations."
  MHMCL_story_event.8.a: "Ok"
  
  MHMCL_story_event.9.name: "The Mircorv"
  MHMCL_story_event.9.desc: "§E"Greetings [Species.GetName]\n\nI am ["§!."
  MHMCL_story_event.9.a: "So you are the Mircorv?"
  MHMCL_story_event.9.a.response: "§E"I am what remains. But a copy is not the original."§!"
  MHMCL_story_event.9.b: "Will you help us?"
  MHMCL_story_event.9.b.response: "§E"Without any drones or infrastructure to construct any, I don't have other options.\n\nBesides, being an individual instead of a collective does have some upsides."§!"
  MHMCL_story_event.9.hire: "Welcome to the present"
  MHMCL_story_event.9.dismiss: "We do not need you"
  
  MHMCL_story_event.10.name: "Mircorv Core Saved"
  MHMCL_story_event.10.desc: "After the final radiation deflectors were installed, the Mircorv Core is now safe from the radiation from the pulsar that freed them, and thus it can continue its work for us."
  MHMCL_story_event.10.a: "Ok"
  
  MHMCL_story_event.11.name: "Mircorc Core Destroyed"
  MHMCL_story_event.11.desc: "After many years of radiation exposure, the Mircorv Core has been degredated beyond a functionable level."
