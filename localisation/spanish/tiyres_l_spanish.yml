l_spanish:

  tiyres_tooltip: "The Tiyanki Resurgence crisis awakens mid-game in the Tiyun Ort solar system, where the the Tiyanki Death World lies. The Death World's Tiyanki core suddenly becomes active and periodically the dead Tiyanki start to break away from their greater entity.\n\nAlthough dead, they instinctively travel towards anything living they sense nearby. Any populated planets that become fully consumed by the Tiyanki recon fleet's assimilation will be marked as a candidate for the Tiyanki leviathans. It will use all biological matter on the planet to give birth to a monstrous Tiyanki planet. Machine populated planets can still be turned into a monstrous Tiyanki planet by assimilating the planet's fauna.\n\nThis newly formed planet will have the ability to not only rain assimilation armies similarly to the Tiyanki recon fleets, also give birth to more Tiyanki recon fleets. This process however consumes a certain amount of their biological mass, making the Tiyanki planets vulnerable to hostile combatants.\n\nThe Tiyanki monstrosities will commence journey and process across the galaxy to consume and assimilating all pops and all fauna that is unfortunate enough to cross its path - cleansing the galaxy of all that is living."
  tiyres_allowed: "§GTiyanki Resurgence Enabled§!"
  tiyres_disabled: "§RTiyanki Resurgence Disabled§!"

  tiyres_show_events.1.name:0 "Rumbling Graveyard"
  tiyres_show_events.1.desc:0 "Unusual activity has been detected in the §YTiyan Ort§! system. The Tiyanki bio mass conglomeration, called "The Graveyard" by some, appears to be less of a grave than all might have assumed."
  tiyres_show_events.1.a:0 "Keep it under observation"

  tiyres_show_events.2.name:0 "The Tiyanki Blob"
  tiyres_show_events.2.desc:0 "The unusual activity in the graveyard system has been confirmed. Further scans and reports from passing ships are starting to indicate that our assumptions of the Tiyanki's natural healing abilities has been vastly underestimated. The Tiyanki's ability to heal seems to have evolved by orders of magnitude, possibly on a near immortal scale. Even the Leviathan Tiyanki that made up the majority of the mass of The Tiyanki graveyard, assumed dormant or dead for millions of years, are losing their battle scars and starting to wake from their long slumber. If even the Grave Mound continues its steady recovery, the tiyanki might be in less danger of extinction than previously thought..."
  tiyres_show_events.2.a:0 "They don't seem too friendly"

  tiyres_show_events.3.name:0 "Large Tiyanki Fleets"
  tiyres_show_events.3.desc:0 "Startling update regarding the Tiyan Ort system. The Tiyanki have suddenly begun to separate themselves from the graveyard in large groups. Even leviathan sized Tiyanki have begun to rip themselves off of the graveyard even while causing extreme damage to themselves in the process. What could have prompted the sudden change in behaviour of the Tiyanki is still unknown."
  tiyres_show_events.3.a:0 "Unsettling"

  tiyres_show_events.4.name:0 "Tiyanki Planetary Assimilation"
  tiyres_show_events.4.desc:0 "The Tiyanki we were observing have stopped above the planet. Although this doesn't appear to be their final destination. The Tiyanki changed course one last time and unexpectedly crash through the atmosphere to the planet below. Though this does not seem to be a mistake of a Tiyanki gone mad. Spreading out from the epicentre of the Tiyanki's crash, biological fauna has rapidly begun to be altered. The sacrifice of the leviathan reveals the true horrifying potential of the Tiyanki's regenerative ability. Surviving the crash through reentry, the Tiyanki continues toward its final purpose. The Tiyanki reaches out brushing against anything unlucky enough to make contact. Burying itself in the ground, becoming the start of a new Tiyanki organism. Its tendrils branch out to the surrounding area reconnecting with parts of itself lost in the crash, proceeding to anything else caught in the aftermath of the descent. Anything caught in its path is assimilated or broken down by the virtually unstoppable super organism as it integrates itself with the entirety of the planet."
  tiyres_show_events.4.a:0 "Dub it the 'T-Janky'"

  tiyres_show_events.5.name:0 "Tiyanki Planetary Colony Assimilation!?"
  tiyres_show_events.5.desc:0 "Tiyanki falls from the sky crashing into our cities below. Our defence forces are attempting all they can to wound or slow the gigantic invades but not all can fight back or reach safety. Tiyanki, barely able to be damaged by our forces, makes fatal contact with our brave soldiers and unfortunate people. Losing themselves to the horrifying assimilation and regeneration abilities of the Tiyanki. Our people make their final last stand as the tiyanki  make their final preparation to assimilate our planet and what few of our people that remain."
  tiyres_show_events.5.a:0 "Well that's not good"

  tiyres_show_events.6.name:0 "The Colossus"
  tiyres_show_events.6.desc:0 "Our fleets have entered the Tiyan Ourt system seeking the origin point of the Tiyanki turned scourge of the galaxy. The graveyard still awaits, silent and uncaring of our fleet's approach. Our fleet moves to target the graveyard and opens fire on it with all of the fleets weapons and bombardment munitions. The however, graveyard is not like any normal spaceship or planetary target. One or even multiple of our fleets are greatly eclipsed by the giant regenerating conglomeration.\n\n Tiyanki orbit around the graveyard following our fleet's attempts to strike and intercept our fire. They circle around the Graveyard, striking down our planetary munitions, intercepting the path of our kinetic drivers and using themselves as living planetary shield to ablate our weapon fire and stop it from ever reaching its intended target."
  tiyres_show_events.6.a:0 "Bring out the Colossus"

  tiyres_show_events.7.name:0 "No Time To Lose"
  tiyres_show_events.7.desc:0 "The Tiyan Ort system has been secured, but it's as we feared. All the tiyanki are fleeting to this system as we speak. However, our colossus is in position, ready to fire on the graveyard and ready to end this nightmare. They can struggle all they want; they'll never make it."
  tiyres_show_events.7.a:0 "Do it"

  tiyres_show_events.8.name:0 "The End Is Nigh"
  tiyres_show_events.8.desc:0 "Every Tiyanki in the Graveyard starts to emit a cry audible across the system. Even through the vacuum of space, our crew can hear and feel the howling of the graveyard."
  tiyres_show_events.8.a:0 "and stay down"

  tiyres_show_events.9.name:0 "Tiyanki Blight"
  tiyres_show_events.9.desc:0 "The Tiyanki's assault against our defensives has failed. However the threat still remains. Whatever is left of the Tiyanki still continues to live and amalgamate. The Tiyanki that are left and too damaged to regenerate begin to break themselfs down into a simpler organism. No longer being what they were before the Tiyanki becomes like a blight spreading across the planet. Each survivng cell becoming another chance for it to regenerate itself and merge with all fauna in sight, even without populus. Specialised facilites will need to be construted if we have any hope of stopping the Tiyanki infestation now that it has made landfall."
  tiyres_show_events.9.a:0 "It must be stopped while we still can!"

  tiyres_show_events.10.name:0 "Success!"
  tiyres_show_events.10.desc:0 "We were able to design new weaponry to cleanse the Tiyanki infestation on our planets. Our specialists will now be able to fight this infestation to stop its spread and regress it depending on how much it has developed."
  tiyres_show_events.10.a:0 "Great news! Initiate this immediately."

  tiyres_show_events.11.name:0 "The Tiyanki's End"
  tiyres_show_events.11.desc:0 "Our fleets have entered the Tiyan Ourt system seeking the origin point of the Tiyanki turned scourge of the galaxy. The graveyard still awaits, silent and uncaring of our fleet's approach. Our fleet moves to target the graveyard and opens fire on it with all of the fleets weapons and bombardment munitions. The however, graveyard is not like any normal spaceship or planetary target. One or even multiple of our fleets are greatly eclipsed by the giant regenerating conglomeration.\n\n Tiyanki orbit around the graveyard following our fleet's attempts to strike and intercept our fire. They circle around the Graveyard, striking down our planetary munitions, intercepting the path of our kinetic drivers and using themselves as living planetary shield to ablate our weapon fire and stop it from ever reaching its intended target. We have however another method. After our extensive skirmishes and research of the Tiyanki, we believe we may have finally come through with a breakthrough and potential solution to the galactic infestation. The Tiyanki Graveyard is the source of all this malice and should be our focus point in saving what's left of the galaxy. Unfortunately conventional fleet weaponry will not be enough to destroy the graveyard from the outside, we must take the fight to its core."
  tiyres_show_events.11.a:0 "We must not let this continue!"

  tiyres_army:0 "Tiyanki Infested Blobs"
  tiyres_army_desc:0 "Tiyanki Infested Blobs that consume and merge with any living thing they touch."
  tiyres_decision:0 "Eliminate Whatever It Takes"
  tiyres_decision_desc:0 "The infestation has touched our citizens and this alien lifeform vassalizes in their bodies, eating away at them from the inside. We must not allow it to spread into our remaining populous. Little choice we have to cease this abomination."
  NAME_Reanimated_Elderly_Tiyanki:0 "Smashanki"
  NAME_tiyanki_planet_creature:0 "Tiybomination"
  tiyanki_planet_monster:0 "T-Janky"
  tiyanki_planet_monster_plural:0 "Tiybomination"
  tiyanki_planet_creature_key:0 "Tiybomination"
  tiy_power:0 "Regenerative Force"
  planet_army_drop:0 "Biomass sacrifice"
  planet_tiy_mark:0 "Tiyanki's Embodiment"
  planet_tiy_infestation:0 "Tiyfestation"
  planet_tiy_infestation_desc:0 "Our populations happiness is plummeting as the infestation grows, it vassalizes pops and devours them slowly from the inside. We must not let these abominations spread to our remaining pops. Once the happiness drops to negative 100%, our planet will have nothing left to protect."
  tiy_lev_speed_boost:0 "Tiyanki Planerary sandwitch"
  tiy_planet_pop_scaling:0 "Pop Biomass Enhansment"
  TIYRES_INFESTATION_PURGING_PROJECT:0 "What Infestation?"
  TIYRES_INFESTATION_PURGING_PROJECT_DESC:0 "The remainder of the Tiyanki abominations have left us with an infestation zone that seems to be merging with any biological fife that is unfortunate enough to cross its path. We must devise a way of purging this infestation that will prevent it from spreading and eliminate this threat for good. Our initial finding show that specialized area of effect weaponry capable of cleansing all bio-life will have to be used, which will unfortunately have long term effects."
  TIYRES_EXPLODING_THE_GRAVE:0 "A Core Resolve"
  TIYRES_EXPLODING_THE_GRAVE_DESC:0 "Our combatants will attempt to infiltrate the Tiyanki Graveyard and planet explosives with similar technology used in cleansing the infestation on our planets, but at a planetary scale. This process will take a while due to the sheer amount of preparation and load that has to be setup. The Tiyanki might sense our presence once we get near enough the the Graveyard, so we must be prepared for that possibility."
  building_tiyres_infestation_purge:0 "Bio Facility"
  building_tiyres_infestation_purge_desc:0 "Provides specialist jobs that purge the Tiyanki infestation with dedicated weaponry and where research in done on lifeform for the scientific gains of our empire."
  tech_tiyres_infestation_purger:0 "Bio Facility"
  tech_tiyres_infestation_purger_desc:0 "Provides specialist jobs that purge the Tiyanki infestation with dedicated weaponry and where research in done on lifeform for the scientific gains of our empire."
  planet_tiy_infestation_remains:0 "Tiyanki Infestation Remains"
  planet_tiy_infestation_remains_desc:0 "The remainders of a biological warzone that has left all fauna dead as a consequence of indiscriminate extermination of all that is living in hopes of cleansing the Tiyanki infestation."
  job_tiyres_infestation_purger:0 "Infestation Purifier"
  job_tiyres_infestation_purger_plural:0 "Infestation Purifiers"
  job_tiyres_infestation_purger_desc:0 "An infestation specialist that studies this type of lifeforms and designs the means of cleansing infestations even at a Tiyanki level of threat."
  mod_job_tiyres_infestation_purger_add:0 "Infestation Purifier"
  tiy_speed:0 "Sense of Threat"
