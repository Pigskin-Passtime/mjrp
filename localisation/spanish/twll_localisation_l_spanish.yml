l_spanish:

  warpeo_allowed:0 "§GWarpeo, The Dimensional Phantasm Allowed§!"
  warpeo_disabled:0 "§RWarpeo, The Dimensional Phantasm Disabled§!"
  warpeo_tooltip:0 "You shall meet with an interdimensional being that will aid you throughout your hardships while conquering the galaxy. This is a truly mysterious being that can manipulate space at will and has found a way to amplify this prowess!"
  spawn_warpeo:0 "Spawn §YWarpeo, The Dimensional Phantasm§!"

  NAME_legendary_puzzle_system:0 "Dimensiva Custodiae"
  NAME_Warpeo:0 "Warpeo, the dimensional phantasm"
  NAME_Dimentional_Guardians:0 "Dimentional Locks"
  NAME_Warpeo_Guardian:0 "Dimentional Lock"
  r_warpeo_artifice:0 "Warpeo Artifice"
  r_warpeo_artifice_desc:0 "The relic has been crafted by the dimensional phantasm and only appears to react in their presence. Its structure nor material is unknown to us, but its power seems to amplify the phantasm's dimensional abilities for use at much greater scales."
  r_warpeo_artifice_regular_effect:0 "§YAmplify Warpeo's dimensional prowess§!"
  warpeo_not_assigned_fail:0 "§RWarpeo operates best assigned to a fleet§!"
  warpeo_system_no_lock_fail:0 "§RWarpeo's fleet is in a solar system where no dimensional locks are present.§!"
  warpeo_system_no_bypass_or_locked_fail:0 "§RWarpeo's fleet is in a solar system where there are no bypasses, or a dimensional lock(s) has been placed on the bypass(es).§!"
  WARPEO_GUARDIANS_PROJECT:0 "Dimensional vortexes and station"
  WARPEO_GUARDIANS_PROJECT_DESC:0 "We must investigate the mysterious station and find any clues that may lead us to an explanation of these unnatural vortex formations."
  WARPEO_GUARDIANS_RESET_PROJECT:0 "Restarting the pillar devices"
  WARPEO_GUARDIANS_RESET_PROJECT_DESC:0 "The whole system of the pillar devices must be restarted as they are no longer responding to our inputs. Until we do so, there is no way of telling what secrets these pillars are hiding."
  warpeo_enemy_fleet_mia_time:0 "Warpeo's influence"
  leader_trait_space_manipulator:0 "Space Manipulator"
  leader_trait_space_manipulator_desc:0 "The dimensional effects of Warpeo's presence are many, empowering fleets to be as illusive as the universe itself."
  warpeo_system_puzzle_info:0 "Postpone the activations for §Y1 year§!, saving current progress."

  twll_events.1.name:0 "Mysterious Dimensional Vortexes"
  twll_events.1.desc:0 "We have encountered strange wormhole-like manifestations that do not appear to have naturally occurred. There is also a station in the middle that may have something to do with these phenomena. We can investigate the station and confirm our suspicions, but our sensors are not detecting any life onboard so it should be safe to proceed; however, with caution nevertheless."
  twll_events.1.a:0 "See what you can find..."

  twll_events.2.name:0 ""
  twll_events.2.desc:0 "As an interdimensional being, Warpeo grew weary of his situation. Existing without purpose for an untold amount of time, he decided to begin testing his limits with wormholes and the potential behind these unknown phenomena.\n\nDuring his experimentations, Warpeo made himself known to multiple lifeforms spanning across the universe. His appearance and prowess was frightening to many, sparking fear and concern. His careless interactions have led him to be tricked and sealed away for a few millennia.\n\nThe seal's workings were unknown to him, however, five dimensional devices were set up to endlessly imprison him in an inescapable void."
  twll_events.2.a:0 "Hopefully this was just a misunderstanding..."

  twll_events.3.name:0 "Warpeo vocalises..."
  twll_events.3.desc:0 "Greetings,\n\n§HA strange relatively miniature wormhole-like vortex materialises as a mysterious entity becomes visible shortly after.§!\n\nThey call me Warpeo, the dimensional phantasm, and as thanks for my release, I shall aid you in your cause for the duration of your fleeting existence... If you so wish."
  twll_events.3.a:0 "Hello, Warpeo."
  twll_events.3.a.response:0 "I'm impressed you managed to break the seal those creatures tricked me into... I am the dimensional phantasm, bending space itself to my will. I have existed since time itself, but that is still the one thing I cannot seem to grasp. In my absence in the universe, I have developed a way to generate transient wormholes on a larger scale than those that can only contain me..."
  twll_events.3.b:0 "Is that... a wormhole?"
  twll_events.3.b.response:0 "Ahh yes, that is what I call a transient wormhole. Its capability of transportation is much greater to that of just me, but it would require a lot more power. In my time in the void, I have devised an artifice that may allow me to channel greater amplitudes of energy to manipulate dimensional matters at uncanny levels."
  twll_events.3.c:0 "Who imprisoned you?"
  twll_events.3.c.response:0 "I met them only once, but immediately I was surprised how much understanding of the universe they possessed. During my naïve exploration of the universe, I did not meet any other lifeform that held so much power. I carelessly assumed no one could do me harm nor did I see a reason for it. Unfortunately, they turned out to be my biggest threat as I was to them. They called themselves the ancient ones, and before I knew it, they tricked me into this confinement that you have released me from today."

  twll_events.5.name:0 "Station Control Hall?"
  twll_events.5.desc:0 "Found something! There are 4 pillar shaped devices, and they all surround the one in the middle. They will all require significant power to activate but it doesn't look like it will be that simple. Something is written on each pillar, with the one in the middle telling five narratives… Perhaps it's an activation sequence riddle?!\n\nClue one; stars are formed from clouds of gas and dust, and the dimension where time is reversed is the past. You must activate this device last, as it will take you back to the origin of the ancients.\n\nClue two; planets orbit the sun in a roughly flat alignment, and the dimension where space is curved is the gravity. You must activate this device third, as it will show you the influence of the ancients on the solar system.\n\nClue three; comets are composed of ice and rock and orbit far from the sun, and the dimension where matter is dispersed is the entropy. You must activate this device second, as it will reveal the chaos and disorder that the ancients faced.\n\nClue four; black holes emit no light or sound and consume everything around them, and the dimension where energy is conserved is the mass. You must activate this device first, as it will unlock the power and potential of the ancients.\n\nClue five; whereas this one, refers to something that the ancients sealed in fear, knew nothing about, and could not understand."
  twll_events.5.a:0 "Event Horizon"
  twll_events.5.b:0 "Oort Cloud"
  twll_events.5.c:0 "Ecliptic Plane"
  twll_events.5.d:0 "A Phantasm"
  twll_events.5.e:0 "Nebula"
  twll_events.5.f:0 "We do not have the time nor resources to deal with this right now"
  twll_events.6.name:0 "Warpeo Artifice Activation"
  twll_events.6.desc:0 "How would you like to proceed?"
  twll_events.6.a:0 "Use a §MDimensional Rift§! agaist an enemy garrison"
  twll_events.6.a.tooltip:0 "Get Warpeo to use the channelled energy to open a dimensional rift and throw enemy armies into the Abyss.\n\n§YThis manifestation of a phenomenon will occur when Warpeo's fleet enters the orbit of an enemy planet!§!"
  twll_events.6.b:0 "Place §MDimensional Lock(s)§!"
  twll_events.6.b.tooltip:0 "Place a Dimensional Lock on every bypass in the system that Warpeo's current fleet is in for 5 years."
  twll_events.6.c:0 "Use A §MDimensional Rift§! agaist the enemy fleet"
  twll_events.6.c.tooltip:0 "Get Warpeo to use the channelled energy to open a dimensional rift and make enemy ship go MIA with double the return time.\n\n§YThis manifestation of a phenomenon will occur when Warpeo's fleet engages an enemy fleet!§!"
  twll_events.6.d:0 "A single leader will go with Warpeo on an §Yexpedition§!"
  twll_events.6.d.tooltip:0 "Warpeo will take [This.GetName] of lesser skill on an expedition around the universe. The result will depend on [This.GetName]'s disposition to learn, but their skill and experience will increase greatly nevertheless. This journey will take 5 years to complete, and both leaders will be unavailable for the duration!"
  twll_events.7.name:0 "The fleet has been... 'mitigated'"
  twll_events.7.desc:0 "Warpeo's fleet has engaged an enemy fleet and used the channelled energy from the relic to force the opponent into a state of MIA!"
  twll_events.7.a:0 "Good news, push on!"
  twll_events.8.name:0 "Warpeo vocalises..."
  twll_events.8.desc:0 "Greetings, once again.\n\nPlease take the artifice I have talked about earlier. It will enable you to channel more energy for me to use in dimensional manipulation."
  twll_events.8.a:0 "We'll take good care of it!"
  twll_events.8.b:0 "How can we use it?"
  twll_events.8.b.response:0 "It's very simple... All you must do is channel your energy reserves into the artifice and a whole new dimension of options will open."
  twll_events.8.c:0 "Finally... What can be do with it?"
  twll_events.8.c.response:0 "Well... There are many things I can do with it. We can channel the energy to lock a dimensional passage like a wormhole just for our use. We can also throw an enemy planet garrison into the void never to be seen again...\n\nAnother way to utilise my prowess is right before engaging an enemy fleet. Once I get in range, we can pull the enemy into a dimensional rift that will make their ships go MIA. However, it will not be your regular situation as finding a way back will take at least double the time.\n\nLastly, if knowledge is what you seek instead, I am willing to take one of your leaders on an expedition across the universe greatly increasing their skill and experience."
  twll_events.9.name:0 "Silent Feedback"
  twll_events.9.desc:0 "The pillar devices are no longer responding to our inputs. We have no choice but to restart the whole system and try again."
  twll_events.10.name:0 "Fleet has gone MIA!?"
  twll_events.10.desc:0 "..."
  twll_events.10.a:0 "This is not good..."
  twll_events.10.b:0 "Who are you?!"
  twll_events.10.b.response:0 "They call me Warpeo, the dimensional phantasm, and you are now unfortunately my enemy..."
  twll_events.11.name:0 "Warpeo has returned!"
  twll_events.11.desc:0 "Greetings, I have returned from the expedition with one of your leaders. They have learnt a great wealth of knowledge over these couple of years as we traversed the universe. What you do with this individual and their experience is up to you."
  twll_events.11.a:0 "Thank you Warpeo, we'll put this leader to good use!"
  twll_events.12.name:0 "The fleet has been... 'voided'"
  twll_events.12.desc:0 "Warpeo's fleet has engaged an enemy planet and used the channelled energy from the relic to throw the enemy armies into the abyss."
  twll_events.12.a:0 "Scary... glad Warpeo is on our side!"
  twll_events.13.name:0 "Garrison has disappeared!?"
  twll_events.13.desc:0 "..."