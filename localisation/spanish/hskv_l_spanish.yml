 hskv_leader_trait_thayo_everdawn_5:0 "$hskv_leader_trait_thayo_everdawn$"
 hskv_leader_trait_thayo_everdawn_5_desc:0 "$hskv_leader_trait_thayo_everdawn_desc$"

 hskv_leader_trait_rusty:0 "Rusty"
 hskv_leader_trait_rusty_desc:0 "Thayo has been imprisoned for so long that many of his governing skills have significantly atrophied."
 hskv_leader_trait_rusty_1:0 "$hskv_leader_trait_rusty$"
 hskv_leader_trait_rusty_1_desc:0 "$hskv_leader_trait_rusty_desc$"
 hskv_leader_trait_rusty_2:0 "$hskv_leader_trait_rusty$"
 hskv_leader_trait_rusty_2_desc:0 "$hskv_leader_trait_rusty_desc$"
 hskv_leader_trait_rusty_3:0 "$hskv_leader_trait_rusty$"
 hskv_leader_trait_rusty_3_desc:0 "$hskv_leader_trait_rusty_desc$"
 hskv_leader_trait_adaptable:0 "$leader_trait_adaptable$"
 hskv_leader_trait_adaptable_desc:0 "This leader is incredibly adaptable, flexible, and fluid when it comes to experimentation of methods and ideas in order to find the most superior methodologies for governing."
 hskv_leader_trait_psionic:0 "$leader_trait_psionic$"
 hskv_leader_trait_psionic_desc:0 "$leader_trait_psionic_desc$"
 hskv_leader_trait_gratitude:0 "Gratitude"
 hskv_leader_trait_gratitude_desc:0 "In all the years Thayo has been alive, gratitude was something he always believed was beneath him. You suspect that there is some tiny part of him that is pleased to have been proven wrong."

 hskv_leader_trait_zro_dealer_contact:0 "Zro Dealer Contact"
 hskv_leader_trait_zro_dealer_contact_desc:0 "Thayo has a shady contact which can supply a small supply of Zro each month for a significant energy cost."
 hskv_leader_trait_worker_oversight:0 "Worker Oversight"
 hskv_leader_trait_worker_oversight_desc:0 "Thayo has directed his personal network towards overseeing worker productivity. While this does result in a significant efficiency boost, those being overseen are less than thrilled with his heavy handed leadership style."
 hskv_leader_trait_specialist_oversight:0 "Specialist Oversight"
 hskv_leader_trait_specialist_oversight_desc:0 "Thayo has directed his personal network towards overseeing specialist productivity. While this does result in a significant efficiency boost, those being overseen are less than thrilled with his heavy handed leadership style."
 hskv_leader_trait_population_oversight:0 "Planetary Oversight"
 hskv_leader_trait_population_oversight_desc:0 "Thayo has directed his personal network towards overseeing planetary productivity. While this does result in a significant efficiency boost, those being overseen are less than thrilled with his heavy handed leadership style."
 hskv_leader_trait_constant_surveillance:0 "Constant Surveillance"
 hskv_leader_trait_constant_surveillance_desc:0 "Finally fed up with Thayo's antics, you've allocated a non trivial amount of resources to oversee him and his personal network and attempting to overwhelm him with bureaucratic red tape. While this expensive hand holding does reign in a good amount of his excesses, it doesn't completely eliminate them as he continues to embezzle resources, albeit at a much smaller amount. Unfortunately all this effort also hampers his normal governing skills."
 hskv_leader_trait_corruption:0 "Thief"
 hskv_leader_trait_corruption_desc:0 "There is enough evidence to suggest that some percentage of resources going missing due to piracy and planetary crime is actually a cover for him to divert them for his own avarice."
 hskv_leader_trait_asset_forfeiture:0 "Asset Forfeiture Authorized"
 hskv_leader_trait_asset_forfeiture_desc:0 "In the latest attempt to curtail the rampant crime through the empire, we have authorized Asset Forfeiture in order to help recover our losses and to strike back at criminals."
 hskv_leader_trait_insider_trading:0 "Insider Trading"
 hskv_leader_trait_insider_trading_desc:0 "Thayo's criminal acts to enrich himself have become more and more brazen. Now reaching the point that it is open secret."
 hskv_leader_trait_insider_trading_2:0 "$hskv_leader_trait_insider_trading$"
 hskv_leader_trait_insider_trading_2_desc:0 "$hskv_leader_trait_insider_trading_desc$"
 hskv_leader_trait_unrestricted_research:0 "Unrestricted Research"
 hskv_leader_trait_unrestricted_research_desc:0 "Apparently unshackling moral, economic, and resource considerations from theoretical and practical science can yield tremendous benefits to academic sciences. Of course these grants aren't cheap, as is dealing with the moral panic fallout from them. But progress demands sacrifices. The intense collaboration encouraged by this has also allowed for a rise in cyber criminals infiltrating our research networks in order to download millions of underacted peer reviewed papers and patents."
 hskv_leader_trait_unrestricted_research_2:0 "Unrestricted Research"
 hskv_leader_trait_unrestricted_research_2_desc:0 "Apparently unshackling moral, economic, and resource considerations from theoretical and practical science can yield tremendous benefits to academic sciences. Of course these grants aren't cheap, as is dealing with the moral panic fallout from them. But progress demands sacrifices. The intense collaboration encouraged by this has also allowed for a rise in cyber criminals infiltrating our research networks in order to download millions of underacted peer reviewed papers and patents, even if our network security has improved considerably since then."
 hskv_leader_trait_indignant_outrage:0 "Indignant Outrage"
 hskv_leader_trait_indignant_outrage_desc:0 "This loyal leader is holding a grudge for being falsely accused as a Thayo sympathizer."

 hskv_leader_trait_pinnacle:0 "Pinnacle Reached"
 hskv_leader_trait_pinnacle_desc:0 "Until a major event occurs, Thayo has reached the pinnacle of his skills"

