########################################################################################################
########################################################################################################
 hskv_hunt.1000.name:0 "Gone"
 hskv_hunt.1000.desc:0 "Gone. It's all... Gone. Much of our energy and resources, some of our ships and even some of our esteemed leaders, including Thayo Everdawn himself... gone. In the span of a single day, countless transactions funneled away our energy credits into a torrent of credit laundry schemes as to completely vanish, entire warehouses full of building materials or exotic crystals emptied, and ships disappearing while in transit.\n\nOnce the shock wore off, soon replaced by raw panic, every resource was applied to investigate and get to the bottom of it. The initial fear of it being the opening prelude to war was quickly dispelled. But the risk that our enemies might pounce on us in our moment of weakness is all too real.\n\nInitial reports soon made it abundantly clear that this was an inside job, and when you look at the sheer scope and scale of these disappearances, there really is only one person in the entire galaxy who was skilled, motivated, and audacious enough to pull something like this off."
 hskv_hunt.1000.response:0 "THAYO EVERDAWN!!!"
 hskv_hunt.1000.response.tooltip:0 "In additional, up to roughly §R20%§! of our fleet will also go missing"
 hskv_hunt.1001.name:0 "Dawn Catcher Task Force Created"
 hskv_hunt.1001.desc:0 "Given the sheer size of this grand larceny, including the theft of critical materials for the empire, let alone the insult of working with us for so long before ultimately betraying us, that there is no choice but to try and hunt Thayo down. It won't be easy, Thayo has almost certainly covered his tracks as he prepared this heist decades in advance. But even he could not cover every track for an operation of this scale.\n\nYet one of the more alarming realizations is that we have no insight into his motivation as to why he did this. While greed could explain some of his many actions, it does not explain all of them. A few theorize that he could be trying to misdirect us, but without knowing what his ultimate goal could be, it is hard to figure out what he might be doing right now.\n\nNever the less, we have started the Dawn Catcher Task Force to try and locate Thayo. Our progress will be summarized in an ongoing situation where you can authorize the budget and resources for our effort."
 hskv_hunt.1001.response:0 "He will not get away with this"

 hskv_hunt.1002.name:0 "Promising Leads"
 hskv_hunt.1002.desc:0 "Thanks to the constant surveillance we had placed Thayo under, we managed to collect a lot of data about his daily activities, a few of which have proven to be very promising leads to pull at the threads of this complex web of deception Thayo has woven. We have already begun to follow up on them to try and grasp the full extend of this private network of his."
 hskv_hunt.1020.name:0 "Explosion on §Y[hskv_target_planet.GetName]§!"
 hskv_hunt.1020.desc:0 "An attempt to infiltrate a clandestine meeting happening in a factory on §Y[hskv_target_planet.GetName]§! turned horrifically tragic. The agent was spotted and got into a confrontation with the fugitives. During the struggle, the factory sustained small but critical damage which culminated in a fire before the factory exploded. The damage to the factory, the city, and the environment is expected to take years to recover from. Meanwhile, we are forced to suppress the true nature of the disaster, least the public panics."
 hskv_hunt.1021.name:0 "Pirate Retaliation"
 hskv_hunt.1021.desc:0 "A group of pirates that are believed to have been bankrolled by Thayo's agents have begun harassing our trade routes. While they probably didn't need much encouragement to turn to a life of piracy, being set up with a few old warships that have been laundered through many different hands was all the support they needed to take up their life of crime."
 hskv_hunt.1022.name:0 "Crime Wave"
 hskv_hunt.1022.desc:0 "There has been a recent upswing of crime on several planets in our empire. While there is no identifiable source for this general lawlessness, they are starting to cause considerable problems as their influence grows."
 hskv_hunt.1023.name:0 "Resources Being Siphoned on §Y[hskv_target_planet.GetName]§!"
 hskv_hunt.1023.desc:0 "We've just received an alarming report that our resources on  §Y[hskv_target_planet.GetName]§! are being siphoned away by a very well informed, equipped, and skilled organization. With how deeply rooted they are, it will take some time before we are able to put a stop to them. Until then, resources here will just seemingly vanish from warehouses, cargo crates, and delivery vehicles. Although with a significant investment, we may be able to reduce the time it takes to root them out."
 hskv_hunt.1023.option.b:0 "Increase security"

 hskv_hunt.1025.name:0 "Mining Stations Under Threat"
 hskv_hunt.1025.desc:0 "Criminals and pirates have begun targeting our remote mining stations, making off with our energy credits, minerals, and more. While there are certainly many unaligned pirates jumping on this bandwagon, there is agreement among the task force that a good percentage of them are somehow, even if indirectly, involved with Thayo."
 hskv_hunt.1026.name:0 "§Y[hskv_false_leader_sympathizer.GetName]§! Falsly accused as Thayo Sympathizer"
 hskv_hunt.1026.desc:0 "In an embarrassing blunder, the Dawn Catcher Task Force (perhaps mislead by false evidence planted by Thayo's agents) arrested §Y[hskv_false_leader_sympathizer.GetName]§! under suspicion that they were secretly on Thayo's payroll. However during the interview and follow up investigation it was determine that this was not the case.\n\nWhile we are all relieved that §Y[hskv_false_leader_sympathizer.GetName]§! was ultimately innocent of the allegations... They were less than amused by the entire fiasco and have become rather indignant about what had happened."
 hskv_hunt.1027.name:0 "Dawn Catcher Task Force Setback"
 hskv_hunt.1027.desc:0 "The Dawn Catcher Task Force has reported the unfortunate news that one of the most promising leads they have been following for the past several months was ultimately determined to be a complete fabrication made up by Thayo's agents. Resources are currently being reassigned elsewhere, but it will take some time before we'll get anything new to report."
 hskv_hunt.1030.name:0 "Informant Requesting Asylum"
 hskv_hunt.1030.desc:0 "An individual claiming to be on the run from Thayo's agents has come to us begging for Asylum, Pardon, Payment, and Protection. In exchange for this, he is willing to offer us everything he knows about some of their ongoing operations. While he wouldn't know much due to how compartmentalized everything is, getting any kind of information would be good.\n\nNormally this is something the Task Force would just handle on their own, but this individual is requesting a suspicious amount of payments on top of all this. We can't help but feel like we are being taken advantage of here, but we are desperate enough for any potential leads that we are willing to entertain their offer."
 hskv_hunt.1030.option.a:0 "Pay the informant"
 hskv_hunt.1030.option.b:0 "Refuse to hand this scum even a single energy credit"
 hskv_hunt.1030.option.b.tooltip:0 "If we refuse the offer, Thayo's agents will almost certainly get them and do damage control on the operations they were aware of before we have any opportunity to strike at them."
 hskv_hunt.1031.name:0 "Resource Silos Robbed!"
 hskv_hunt.1031.desc:0 "A heist onto one of our warehouses turned into a deadly highspeed chase when heighten security managed to catch them in the act. Most of the stolen goods had already been moved when they were caught trying to fit one last shipping crate into their vehicle. During the insuring chase our forces managed to corner and capture them. This allowed us to catch quite a few of the criminals in this cell and give us several enterprising leads for us to follow up on, even if not all of the stolen goods were recovered."
 hskv_hunt.1040.name:0 "Resource Cache Recovered!"
 hskv_hunt.1040.desc:0 "The Dawn Catcher Task Force has reported some good news concerning some of the goods Thayo has stolen from us. Following up on some suspicious connections to a warehouse resulted in us finding a significant number of shipping crates stolen from us, some of which even still have the §H[Root.GetName]§! tags on them. While there is no sign of the perpetrators, we are scouring the warehouse for any clues to their whereabouts."
 hskv_hunt.1041.name:0 "§H[hskv_target_country_theft.GetName]§! Resource Cache Recovered!"
 hskv_hunt.1041.desc:0 "The Dawn Catcher Task Force has reported some good news concerning some of Thayo's stolen goods. Following up on some suspicious connections to a warehouse resulted in us finding a significant number of shipping crates. At first we thought they were ours, but a closer inspection revealed that they were in fact stolen from §H[hskv_target_country_theft.GetName]§!. While there is no sign of the perpetrators, we are scouring the warehouse for any clues to their whereabouts.\n\nThe Task Force, in conjunction with our Intelligence Officers, have concluded that §H[hskv_target_country_theft.GetName]§! have no knowledge of the whereabouts of these items. Thus we could just claim them for ourselves. However I am sure §H[hskv_target_country_theft.GetName]§! would appreciate us returning them."
 hskv_hunt.1041.option.a:0 "Return the cache to §H[hskv_target_country_theft.GetName]§!"
 hskv_hunt.1041.option.b:0 "Keep the supplies"
 hskv_hunt.1042.name:0 "Serendipitous Breakthrough"
 hskv_hunt.1042.desc:0 "The Dawn Catcher Task Force has reported some good news that during one of our sting operations that we managed to capture one of the much more elusive inter-cell agents that Thayo uses to manage the many cells his network resides in. This rare source of knowledge will be a significant boon in our understanding about the inner workings of their operation."
 hskv_hunt.1050.name:0 "Pirate Retaliation"
 hskv_hunt.1050.desc:0 "In what many have considered to be one of the largest coordinated attacks on our empire perpetrated by an individual. A number of pirates have banded together to strike out at our trade routes and outposts in unison. The Dawn Catcher Task Force believes that Thayo is behind this rare act of collaboration and that this is a sign that we may be catching up to him if we are forcing his hand like so. This doesn't make dealing with this headache any easier though."


 hskv_hunt.2099.name:0 "Thayo Everdawn's location identified"
 hskv_hunt.2099.desc:0 "Despite the many setbacks and traps we had to deal with, we managed to finally identify Thayo's base of operations in an obscure and secluded system. All records suggested that the trading post located here was a very old space station suffering from neglect, barely able to make its taxes.\n\nYet eye witness reports from our covert operatives have shown us footage that it is bustling as if it was one of our central trading hubs. Whatever Thayo is planning, it is big, big enough to rival small empires. But whatever it is, it must be stopped so we can recover what he stole from us."
 hskv_hunt.2099.response:0 "Commence Operation Dawntaker"
 hskv_hunt.2100.name:0 "Operation Dawntaker"
 hskv_hunt.2100.desc:0 "The operation was sealed at the highest possible classification. Everything was on a Needs to Know basis. Although you couldn't shake the feeling that Thayo's agents are in so deep that he already knows. Still, after careful preparations you order the assault.\n\nYour fleet warps in, hoping for the element of surprise, but it is clear that they are already expecting you. But while they had a number of sizable combat vessels at the ready to intercept, it was clear that they were hopelessly outmatched. Your fleet came in expecting a fight, if at a minimum to capture fleeing ships, but to your admiral's surprise, your demands for surrender were accepted.\n\nEven more surprising was that Thayo himself was present at the trading post, although the only condition of his surrender was to speak with you. With him finally in custody, we can humor his final request and get to the bottom of this whole mess."
 hskv_hunt.2101.desc:0 "§YThayo walks into the conference room on the fleet's flagship, escorted by five armed guards, yet his demeanor gives you pause. It is not the disposition of one who has lost, but rather one of confidence, the confidence he has always shown ever since he first began working for us.§!\n\nI must say that I am impressed §Y[Root.Leader.GetName]§!. You know how I pride myself being five moves ahead of everyone. But it would seem that I may have played my hand too soon, resulting in me being only two moves ahead. That's right. You might believe you have me in checkmate, but rest assure, this is merely check.\n\nStill. Your interference will cause this entire operation to suffer an unacceptable setback. Thus in order to ensure the continue success of my project, attempting to try and accomplish it by myself is no longer an option, we are going to need to work together."
 hskv_hunt.2101.response:0 "After all you've done? Why on §Y[Root.Capital.GetName]§! would I accept?"
 hskv_hunt.2102.desc:0 "Remember how I once told you that §H[hskv_target_fe_country.GetRealName]§! forcefully prolonged my life? I spared you the grisly details at the time. But those details are the crux of the matter. Of my suffering.\n\nYou see, my body is not just long lived, but I am also conditionally immortal. Now now. That is not to say you couldn't fling this body into the sun. But this shell is an avatar for my consciousness. The source of which is elsewhere. And let me assure you, having a consciousness but no body is the closest thing to an actual hell this side of the Shroud. Something which §H[hskv_target_fe_country.GetRealName]§! demonstrated several times to me during my imprisonment.\n\n§PEverything§! I've done since you freed me was towards a single goal. To recover my stolen consciousness, because, believe or not, I am tired of this long life of suffering. Even more so that it is at the whim of my jailer, a chain I can never be freed of unless I take back what never should had been stolen."

 hskv_hunt.2102.option.a:0 "Where is your consciousness located?"
 hskv_hunt.2102.option.a.response:0 "It is located in a system off the star maps near §H[hskv_target_fe_country.GetRealName]§! which they fittingly call §YDawn's End§!. Located in that system is a giant starbase called the §YEverdawn Vault§!. While it houses many things, only one thing within interests me.\n\nA device called the §MAstral Anchor§! which houses my consciousness. You might consider it something akin to a phylactery, to borrow a term used in some of your folk tales of old. It takes advantage of my psychic connection and abilities, transmitting through the Shroud, and forcefully binds me there, should this body ever succumb."

 hskv_hunt.2102.option.b:0 "You still didn't answer why we should help you."
 hskv_hunt.2102.option.b.response:0 "Because of everything else that resides within §YEverdawn Vault§!. While they purged most records of the §HEverdawn Dynasty§! from their history. For some reason or another, they chose to merely banish the last remnants of my once great empire. Within are cultural artifacts and technological marvels that were the envy of the galaxy. All yours for the taking, as the only thing I want is is to destroy the §MAstral Anchor§!.\n\nI never wished to put myself in such a situation where my fate was in the hands of another. For the only one I ever trusted was myself. But I am logical enough to know that this plan has the highest chance of success in the shortest period of time."

 hskv_hunt.2102.option.c:0 "What is your plan?"
 hskv_hunt.2102.option.c.response:0 "Walking through the front door of §H[hskv_target_fe_country.GetRealName]§! is out of the question. Even were you able to get into their good graces, they would never let you anywhere near the system. So I plan to take advantage of a historical curiosity between §YAzure Dream§! and §YDawn's End§!.\n\nThere once used to be a stable wormhole between the two systems back when they were constructing my prison. But at some time between my imprisonment then and now, the wormhole collapsed. Whether it was by their doing or just natural decay I cannot say. But I've been working on developing a device which will restore the wormhole which connects the two systems, albeit temporary, thus getting us access to the vault.\n\nOnce there I will use a special device to jam their inter-systems communications and prevent them from sending word to the rest of §H[hskv_target_fe_country.GetRealName]§!. It will not stop them forever, but it will buy us the time we need to complete the operation and cover our tracks."
 hskv_hunt.2102.option.d:0 "Why should we trust you?"
 hskv_hunt.2102.option.d.response:0 "While the value of my word has been lessened to you, you should know that I have just bared my most important and personal motivation. Assuming you believe me of course. But knowing my motivation, you should be able to see how it drove all my actions since the day you freed me. And it is this consistency, these actions that further this goal, that you should believe in.\n\nOf course how I achieve that goal can be complex, far reaching, and obfuscated, but they all lead towards this single point. And it is §Pthat§! you should believe in and trust in, not any affirmation I could offer."

 hskv_hunt.2102.option.e:0 "Enough Talk"
 hskv_hunt.2103.desc:0 "Very well then. Now you have heard everything. I trust you will put aside your emotions and think about how this is mutually beneficial to us both and that we are both necessary components of it.\n\nIf we're successful, the contents of this vault will exceed your wildest dreams and §H[hskv_target_fe_country.GetRealName]§! will never even realize it was us. You'll have in your hands an advantage no other empire can claim, one which will set you upon the path of greatness... should we succeed."
 hskv_hunt.2103.option.1:0 "We will help you, but no more tricks"
 hskv_hunt.2103.option.2:0 "No. We've had enough of your shenanigans"


 hskv_hunt.2104.desc:0 "§YThayo pauses to take a long sigh.§!\n\nI was afraid it would come to this. I thought I would have had enough time to complete this project before any consequences would catch up to me. But it would seem that I have misjudged you that my offer of the vault would be spurned like so. It is fortunate then that my plans do account for such miscalculations. Let me just say, I did warn you.\n\n§YThayo then suddenly claps his hands three times.§!\n\nActivate Contingency Dusk Star."
 hskv_hunt.2104.response:0 "What?!"
 hskv_hunt.2105.name:0 "Chaos"
 hskv_hunt.2105.desc:0 "Suddenly three of the five armed guards watching Thayo turned their guns on the other two before one shoots at the monitor you were using to communicate with him. As the signal goes dead you see alarms and reports filling up your notifications."
 hskv_hunt.2106.desc:0 "Chaos was not just confined to that room, but across the entire system. We had already accounted for the risk of sleeper agents for this mission, but it would seem that Thayo cashed in all his chips as he used every sleeper agent he had to cover his escape. Fighting began to break out between our own forces while Thayo's combat vessels that stood down now suddenly power back up.\n\nBy the time the dust settles, there was no sign of Thayo. While he might have had to leave the majority of his ill gotten goods in the system, the extensive unexpected fighting has caused widespread damage to some of these assets."


 hskv_hunt.2111.desc:0 "Excellent. I am glad you were able to see reason. I will transfer the blueprints we have for the §YWormhole Stabilization Generator§! which will enable us to stabilize the wormhole and allow access to §YDawn's End§!.\n\nHowever there are some key details you should know about it. The device requires a substantial amount of Zro to function as well as a very large starbase to power it. Sourcing this much Zro will require a significant amount of investment, something which I can help with if needed. It was, unfortunately, the one deficiency that was holding back my operation from a timely execution and allowed you to catch up to me.\n\nNow then, let us get to work."


 hskv.1113.name:0 "§YWormhole Stabilization Generator§! built"
 hskv.1113.desc:0 "With the §YWormhole Stabilization Generator§! built in §YAzure Dream§!, we can now begin the complicated special project to stabilize the wormhole."
 hskv.1114.name:0 "Wormhole Stabilized"
 hskv.1114.desc:0 "The §YWormhole Stabilization Generator§! was successful in at least temporarily bridging the wormhole between §YAzure Dream§! and §YDawn's End§!. As Thayo warned, once we enter, he will use the jamming device to prevent them from sending a distress call out, but we will only have a short time period to secure the vault and its treasures.\n\nIt is strongly recommended that we have a reasonable stockpile of resources as well as soldiers, construction ships, and science vessels in reserve at §YAzure Dream§! before we send our fleets into §YDawn's End§!. While a science vessel might be able to scout the system. §ROnce we enter with our military, there is no turning back.§!"

 hskv.1120.name:0 "§YDawn's End§!"
 hskv.1120.desc:0 "Our fleet has just passed through the wormhole into §YDawn's End§!. The system contains few things of note outside of the substantial asteroid field, save for a single very large starbase like structure, no doubt the §YEverdawn Vault§! Thayo spoke of.\n\nHowever, before we had any time to survey the system, a large fleet has begun to take off from the facility and move on an intercept course to us. Even before they have all finished taking off, the flagship of the group has hailed us with a communication beam that is so powerful that at first we thought it might have been a long range attack. It is doubtful that any peaceful resolution can be had, but we might as well hear them out."
 hskv.1121.name:0 "Communication from §H[hskv_target_fe_country.GetRealName]§!"
 hskv.1121.desc:0 "Arrogant little wretch! I don't know how you barbarians managed to find this system. This system is restricted and is under the protection of the §H[hskv_target_fe_country.GetRealName]§!. Leave immediately or I will annihilate every single one of your worthless toys you call spaceships. And depending on how I feel afterward, maybe I'll head through that wormhole you somehow created and destroy everything on the other side too. But not before I inform my liaison about this trespassing onto-\n\n§HThe smug §Y[hskv_target_fe_country.GetSpeciesName]§! pauses as they look off screen, and you feel some gleeful vindication at him being somewhat flabbergasted.§!\nWhat do you mean you can't contact §Y[hskv_target_fe_country.Capital.GetName]§!?!\n§HThe realization they are still communicating with you hits them as look back at you, in an expression you can only assume to be the §Y[hskv_target_fe_country.GetSpeciesName]§! equivalent of the rage of a thousand burning suns.§!\n\nYour actions have earned you no mercy. Your deaths will be so swift that you won't even have time to make your peace."
 hskv.1121.response:0 "We've come too far to back down now. Battlestations!"

 hskv.1122.name:0 "Time is ticking"
 hskv.1122.desc:0 "Thayo has sent us a message, very politely, that the jamming device will not keep §H[hskv_target_fe_country.GetRealName]§! from communicating from their high command indefinitely. Eventually they will break through or find some alternative way of sending a message. Thayo does have a contingency plan for this, but there will be consequences and strongly urges you to secure the vault before it is too late."

 hskv.1130.name:0 "§YDawn's End§! secured"
 hskv.1130.desc:0 "With the defeat of §H[hskv_target_fe_country.GetRealName]§! fleet, we can move in our forces to secure §YEverdawn Vault§!. The size of it, as well as the sensitivity of securing it without damaging it, will make this a significant challenge for our forces.\n\nIt is also imperative to take note of how much time we have available. If we are unable to fully secure the vault before the jamming device is overcome, then §H[hskv_target_fe_country.GetRealName]§! will be alerted to our actions and we can expect a quick and merciless response. In order to help you keep track of how much time we have, a situation has been created to give you an overview of the heist itself."

########################################################################################################
########################################################################################################
########################################################################################################
########################################################################################################
 hskv_heist.1130.name:0 "Everdawn Heist - Slow Start"
 hskv_heist.1130.desc:0 "Due to how slow we were in securing the system, the enemy has managed to make some progress attempting to bypass our jammer. We will need to minimze further mistakes if we are to have any hope of success." 

hskv_heist.1131.name:0 "Everdawn Heist - Phase 1"
 hskv_heist.1131.desc:0 "While we have control of the entire system, the immobile §YEverdawn Vault§! itself is still fully operational. While it may be bereft of its mobile defenses, it is still heavily defended with powerful shields and potent weapon platforms. These outer defenses will need to be breached in order for our forces to get inside."
 hskv_heist.1131.option.a:0 "Our fleets will bring down their defenses"
 hskv_heist.1131.option.a.tooltip:0 "Overwhelming firepower is certainly the fastest way through the outer defenses.\n\nThe Vault will turn hostile."
 hskv_heist.1131.option.b:0 "A large enough explosive charge ought to do the trick."
 hskv_heist.1131.option.b.tooltip:0 "We can construct several suicide vessels, loaded to the brim with Volatile Motes, and have them ram into the main defenses. While it is unclear if this will breach the armor, it should at least clear out enough of the outer defenses that we can proceed to the next phase.\n\nEnables a Construction Ship Special Project."

 hskv_heist.1132.desc:0 "The ships laded with volatile motes, under the cover of our fleets, were able to get close enough to the immobile defenses and blow right through their shields and the weapon batteries behind them. While the blasts did not do much to the underlying armor protecting the vault, the outer defenses were no more. What few that did remain were made short work by our fleets. We can now proceed to landing our teams onto the station itself."
 hskv_heist.1133.desc:0 "Thanks to the efforts of our glorious fleet, the weapon platforms hiding behind the impressive shields are no more. We can now proceed to landing our teams onto the station itself."

 hskv_heist.2200.name:0 "Everdawn Heist - Phase 2"
 hskv_heist.2200.desc:0 "The largest entry point into the vault is the hanger which the enemy fleet was originally docked in. While we can get our team into the hanger, they apparently sealed several extremely thick blast doors that we will need to get through."
 hskv_heist.2200.option.a:0 "Place several explosive charges on the door"
 hskv_heist.2200.option.a.tooltip:0 "While we might risk creating more problems for us, the blast doors will succumb to our explosive might"
 hskv_heist.2200.option.b:0 "Hack the Door"
 hskv_heist.2200.option.b.tooltip:0 "Using several hacking techniques should allow us to simply open the door for us. However the length of time this will take depends entirely on how skilled our empire is at codebreaking."
 hskv_heist.2200.option.c:0 "Drill through it"
 hskv_heist.2200.option.c.tooltip:0 "Barring any other options, we can always use advance drill mining to drill through the door."
 hskv_heist.2210.desc:0 "Everyone was surprised when the dust settled for the initial blast that only the outer blast doors were destroyed. But the inner blast doors stood no chance against the second explosive charge. We now have our ingress point into the facility. Already we are preparing to set up a base camp in the hanger so we can support our exploratory forces."
 hskv_heist.2220.desc:0 "With some difficulty we managed to get through the exotic cyber defenses of the blast doors to disconnect them from their central command and to make them only listen to us. With them fully under our control we now have our ingress point into the facility. Already we are preparing to set up a base camp in the hanger so we can support our exploratory forces."
 hskv_heist.2230.desc:0 "At a slow and steady our drill cleared through the doors. Even if we did have to replace the drills multiple times in the process. We now have our ingress point into the facility. Already we are preparing to set up a base camp in the hanger so we can support our exploratory forces."

 hskv_heist.2300.name:0 "Everdawn Heist - Phase 3"
 hskv_heist.2300.desc:0 "While §H[hskv_target_fe_country.GetRealName]§! might have a skeleton crew defending the vault, they are still putting up a fight. Dozens of giant war machines are preventing us from progressive further. Even a single one of them is capable of taking on a hundred soldiers without even considering the tactical advantage they hold. After our initial skirmish we suffered several causalities and were forced to pull back to the hanger bay where we can at least hold them off thanks to our heavy weapon batteries."
 hskv_heist.2300.option.a:0 "If one is a match for a hundred soldiers then send thousands"
 hskv_heist.2300.option.a.tooltip:0 "A sufficiently large army backed by a seasoned commander should be able to defeat them."
 hskv_heist.2300.option.b:0 "Deploy cyber warfare and hack them"
 hskv_heist.2300.option.b.tooltip:0 "The war machines do not appear to be physically piloted, which means there is a chance for us to usurp their commands to shut them down. While feasible, our experts suggest that this will be a §Rchallenging endeavor§!. However the length of time this will take depends entirely on how skilled our empire is at codebreaking."
 hskv_heist.2300.option.c:0 "Our war bots are better"
 hskv_heist.2300.option.c.tooltip:0 "There are no stronger war machines than those created by Cybrex"
 hskv_heist.2300.option.d:0 "...Explosions?"
 hskv_heist.2300.option.d.tooltip:0 "Perhaps an extensive explosive will sufficiently damage them to allow us defeat them"
 hskv_heist.2301.desc:0 "Look... As much as explosives are fun and effective, their robotic guardians are far too mobile and intelligent to avoid the obvious red barrel traps we are placing near them."
 hskv_heist.2311.desc:0 "Our brave soldiers under the command of §Y[hskv_commander_leader_temp.GetName]§! fought a long and hard battle against the war machines before finally taking the last one out. As the last machine falls to the ground, we can finally move deeper into the starbase."
 hskv_heist.2312.desc:0 "Our brave soldiers under the command of §Y[hskv_commander_leader_temp.GetName]§! fought a long and hard battle against the war machines. Yet the fighting proved to be far more intense than even our most pessimistic estimates. While they were successful in defeating them, the extensive stalemate cost us a lot of time. At least we can finally move deeper into the starbase without the risk of more active defenses."

 hskv_heist.2320.desc:0 "The network security of these war machines dwarfed anything else we encountered within the vault. With multiple redundancies, firewalls, and black ICE defending it from our intrusions. Yet given time we managed to successfully bring down each and every one of their war machines.\n\nWhile the first few we took down managed to self destruct in order to prevent us from recovering them, the last few were successfully shut down without much internal damage. We are already shipping their remains back to §Y[Root.Capital.GetName]§! for further study and to see if we can repurpose and enable them."
 hskv_heist.2320.response.tooltip:0 "Create §Y3§! Cybrex Warforms on §Y[Root.Capital.GetName]§!"

 hskv_heist.2330.desc:0 "As impressive as §H[hskv_target_fe_country.GetRealName]§!'s war machines were, they do not hold a candle next to the ruthless and brutal efficiency of a Cybrex Warform. Stepping over the rubble of their war machines, our scouts are moving on ahead deeper into the starbase."

 hskv_heist.2400.name:0 "Everdawn Heist - Phase 4"
 hskv_heist.2400.desc:0 "Once we were able to explore the starbase without the threat of war machines breathing down our back it became abundantly clear that §YEverdawn Vault§! is huge and that attempting to locate the inner vault where the §MAstral Anchor§! is located would take months.\n\nThe other concern we have is that while we have neutralized most of their active defenses, we believe there are still a handful of §Y[hskv_target_fe_country.GetSpeciesName]§! Hold up in the starbase's command center as they coordinate defenses, hamstring our operations, and desperately try to bypass our jamming signal.\n\nThayo has suggested that we could continue to push deeper in, but that there might be some value in breaching the command center that could make our further attempts easier, even if it is a detour."
 hskv_heist.2400.option.a:0 "Head to the Command Center"
 hskv_heist.2400.option.a.tooltip:0 "While it might be a detour to head towards it, we believe that there is some value if we can secure it."
 hskv_heist.2400.option.b:0 "Press onward"
 hskv_heist.2400.option.b.tooltip:0 "We need to remain focused on finding the inner vault and not get distracted by anything that does not directly lead us there."

 hskv_heist.2450.name:0 "Everdawn Heist - Phase 4a"
 hskv_heist.2450.desc:0 "Luckily the route to §YEverdawn Vault's§! Central Command was not too difficult to reach. However, the last few §Y[hskv_target_fe_country.GetSpeciesName]§! have apparently barricaded themselves inside where they continue to oversee the resistance efforts. Our survey of the area suggests that we would have to go through another series of thick blast doors, something which many of us worry we do not have time for. But we suspect that there is a possible defect in the air filtration system which we might be able to exploit."
 hskv_heist.2450.option.a:0 "Overload the console"
 hskv_heist.2450.option.a.tooltip:0 "If we apply an excessive amount of energy into the system, we may be able to short circuit the entire Central Command's network and power supplies. Either allowing us entry or neutering §H[hskv_target_fe_country.GetRealName]§! response."
 hskv_heist.2450.option.b:0 "Gas 'em"
 hskv_heist.2450.option.b.tooltip:0 "We can pump in an extremely toxic gas in to deal with the last few holdouts."
 hskv_heist.2450.option.c:0 "Deploy a Killer Microorganism"
 hskv_heist.2450.option.c.tooltip:0 "The Killer Microorganism we discovered, if properly handled, can make short work of them at a speed which they will have no time to react against"
 hskv_heist.2450.option.d:0 "Blow the door up"
 hskv_heist.2450.option.d.tooltip:0 "We really do like using explosions don't we? But yes, we could try blowing the door up with volatile motes."
 hskv_heist.2450.option.e:0 "Hack the Door"
 hskv_heist.2450.option.e.tooltip:0 "Using several hacking techniques should allow us to simply open the door for us. However the length of time this will take depends entirely on how skilled our empire is at codebreaking."
 hskv_heist.2450.option.f:0 "This is not worth our time."
 hskv_heist.2450.option.f.tooltip:0 "This is a distraction. Return to searching for the vault."

 hskv_heist.2460.desc:0 "The high power energy fields deployed to the console was entirely too powerful. Instead of just overloading the door, we managed to overload the entire command center. While this did succeeding in allowing us to enter, it also killed the §Y[hskv_target_fe_country.GetSpeciesName]§! inside, and fry every computer, console, and device as well. Without the an intact command center, there is little else for us here. But without the §Y[hskv_target_fe_country.GetSpeciesName]§! trying to get around our jamming, it now falls to whatever failsafe AI that is still running the Vault to do it. So while it was not a complete waste of time, it was still mostly a waste of time.\n\nAnd it still didn't even help us figure out where the vault with the §MAstral Anchor§! is located!"
 hskv_heist.2470.desc:0 "Exploiting the vents to pump in the deadly gas was surprisingly easy. Our engineers were very careful with the stuff, making sure that it wouldn't be used against us. While there was some spillover in the corridors, it was very successful at killing every §Y[hskv_target_fe_country.GetSpeciesName]§! inside the command center. While opening up the doors took a little time, without them attempting to stop us, it was manageable to do so.\n\nWith an intact command center at our disposal we can send in our best xeno-machine linguists to decipher as much as we can. While it is highly unlikely we will be able to shut down the entire vault or prevent the distress call from going out, at least not without more time than we have at our disposal, it will offer us support for further extrusions."
 hskv_heist.2480.desc:0 "Exploiting the vents to pump in the deadly microbe was surprisingly easy. Our engineers were very careful with the stuff, making sure that it wouldn't be used against us before we evacuated the area entirely. The §Y[hskv_target_fe_country.GetSpeciesName]§! didn't expect a thing. When the canister opened, the area was flooded with the killer microbe as it expanded as fast as it could to kill every living creature until its expiration timer hit after ten minutes. So quickly did it kill them all that none of them even time to do any kind last second shutdowns or logouts. While opening up the doors took a little time, without them attempting to stop us, it was manageable to do so.\n\nWith an intact command center at our disposal we can send in our best xeno-machine linguists to decipher as much as we can. While it is highly unlikely we will be able to shut down the entire vault or prevent the distress call from going out, at least not without more time than we have at our disposal, it will offer us support for further extrusions."
 hskv_heist.2490.desc:0 "The explosions ripped through the bulkhead and through the command center. Unfortunately, the entire command center was destroyed in the process. Killing every  §Y[hskv_target_fe_country.GetSpeciesName]§! inside, and destroying every computer, console, and device inside as well. Without the an intact command center, there is little else for us here. But without the §Y[hskv_target_fe_country.GetSpeciesName]§! trying to get around our jamming, it now falls to whatever failsafe AI that is still running the Vault to do it. So while it was not a complete waste of time, it was still mostly a waste of time.\n\nAnd it still didn't even help us figure out where the vault with the §MAstral Anchor§! is located!"
 hskv_heist.2495.desc:0 "The battle between your hackers and the defenders was arduous, but eventually a foothold was made that allowed us to lock the §Y[hskv_target_fe_country.GetSpeciesName]§! out of it, giving us time to override the doors and open. With the doors open the defenseless §Y[hskv_target_fe_country.GetSpeciesName]§! were quickly dealt with, although not before they all took their lives rather than being captured.\n\nWith an intact command center at our disposal we can send in our best xeno-machine linguists to decipher as much as we can. While it is highly unlikely we will be able to shut down the entire vault, at least not without more time than we have at our disposal, it will offer us support for further extrusions."

 hskv_heist.2500.name:0 "Everdawn Heist - Phase 5"
 hskv_heist.2500.desc:0 "As we continue to explore the deepest reaches of the starbase we finally made a breakthrough. It wasn't quite at the center of the starbase, hence why it threw us off, but we eventually found the inner vault. But it seems like the §H[hskv_target_fe_country.GetRealName]§! have some additional security measures in place to protect it, perhaps fearing some domestic threat.\n\nWith the vault on high alert, countless extremely high power lasers are actively frying any poor soul who attempts to get closer. The distance from our distance from the base camp has made some of our more usual options before difficult due to a lack of access to our heavy equipment. Nevertheless, our team has proposed a number of solutions which might get us past this obstacle."
 hskv_heist.2500.option.a:0 "Nothing a high power shield can't handle"
 hskv_heist.2500.option.a.tooltip:0 "A single skilled scientist with an extremely high power shield ought to be able to reach the control panels to forcefully bring them down. This will require a significant energy investment, one which a skilled scientist with advance shield tech will be able to apply a discount to."
 hskv_heist.2500.option.b:0 "Just turn them off"
 hskv_heist.2500.option.b.tooltip:0 "With control of the vault's Command Center, we can just turn them off, once we figure out how the controls work."
 hskv_heist.2500.option.b.tooltip.fail:0 "We do not have control of the vault's undamaged Command Center."
 hskv_heist.2500.option.c:0 "Hacking"
 hskv_heist.2500.option.c.tooltip:0 "Using several hacking techniques should allow us to remotely shut down the lasers. However the length of time this will take depends entirely on how skilled our empire is at codebreaking."
 hskv_heist.2500.option.d:0 "Explosions!"
 hskv_heist.2500.option.d.tooltip:0 "Really? Again? It might take us some time to get all the explosives down here, but yes, we can always go with this option."
 hskv_heist.2510.desc:0 "§Y[Prev.leader.GetName]§! admits to being uneasy, carrying this bulky personal shield generator, but has spent the past few days training both physically and mentally to build their confidence back up. With all systems go, they charge down this hallway of death. It did not take long before the shields began to attract the countless high power lasers. The force of which begins to slow §Y[Prev.leader.GetName]§!'s pace, yet they continue to struggle onward. By the time they are halfway across the hallway it became clear that they were not going to be able to make it without external assistance. Their only hope is to funnel as much energy into their shield generators to allow it to continue to function."
 hskv_heist.2510.option.a:0 "Route all power to their personal Deflectors!"
 hskv_heist.2510.option.b:0 "Route all power to their personal Shields!"
 hskv_heist.2510.option.c:0 "Route all power to their personal Advanced Shields!"
 hskv_heist.2510.option.d:0 "Route all power to their personal Hyper Shields!"
 hskv_heist.2510.option.e:0 "The shields can't hold!"
 hskv_heist.2510.option.e.tooltip:0 "§Y[Prev.leader.GetName]§! will almost certainly die."

 hskv_heist.2511.desc:0 "§Y[hskv_potential_laser_victim.GetName]§! pressed onward, sometimes dodging lasers, but mostly relying on the shields to protect them, now brimming with excessive power. The agonizing few minutes finally ended when they managed to access the console and despite the lasers continuing to attack and distract them, managed to shut them all down. All without any injuries. This was certainly one hallowing experience they will remember for a long long time."
 hskv_heist.2512.desc:0 "§Y[hskv_potential_laser_victim.GetName]§! pressed onward, sometimes dodging lasers, but mostly relying on the shields to protect them, yet completely unaware that there wasn't enough energy to fully power it. The agonizing few minutes finally ended when they managed to access the console. But the lasers continued to attack and distract them before slicing through flesh and bone as §Y[hskv_potential_laser_victim.GetName]§!'s shield failed. Yet in their dying breath, managed to shut down the laser grid before expiring. A brave and noble sacrifice, but was it truly necessarily?"
 hskv_heist.2513.desc:0 "§Y[hskv_potential_laser_victim.GetName]§! pressed onward, sometimes dodging lasers, but mostly relying on the shields to protect them, yet completely unaware that there wasn't enough energy to fully power it. The agonizing few minutes finally ended when they managed to access the console. Yet just as they were about to reach it, they tripped, inadvertently dodging a particularly large laser beam that would had blasted right through their shield had they stood there. Leaping up to the console they managed to pull the switch to shut the laser grid down. But not before another laser beam completely cut one of their an appendages off as their shield failed at that final moment.\n\nMiraculously, when medics arrived to them, §Y[hskv_potential_laser_victim.GetName]§! was still alive! While hideously scarred by the incident, we believe that they will make a slow recovery before returning to their duties. We can only hope whatever luck they had continues to bless them."

 hskv_heist.2520.desc:0 "With control of the command center, you order the xeno-machine linguists to see if they can disable the laser grid trap from their end. It took an uncomfortably long time, but eventually they found a way to reroute power away from the laser grid trap, shutting it down long enough for someone to physically disable it."
 hskv_heist.2530.desc:0 "Hacking the laser grid remotely seemed like the much safer option. But it was stymied by the fact that your hackers were unable to find any master control unit, but was forced to disable each laser beam... individually. Needless to say, this dramatically added to the time it took to disable the laser grid, even if it wasn't particularly difficult."
 hskv_heist.2540.desc:0 "The distance the vault was from our base camp added considerably to the amount of time it took to get the explosive charges in place. Yet when the explosions went off we found that while the laser grid was not completely taken out, it did open up several passageways into the walls and maintenance shafts that would allow us to bypass the trap entirely.\n\nA team will be left in place to see if they can disable the trap from the other side well the rest of us advance forward into the vault itself."

 hskv_heist.2600.name:0 "Everdawn Heist - Phase 6"
 hskv_heist.2600.desc:0 "Past the laser grid was a single very large door. Unlike many other doors in this facility, this one did not prove too challenging to open, which made it even more surprising given what was revealed when it opened up. Inside was what could only be described as a giant vault. With hundreds of vault doors lining each end of the long corridor, three very tall floors high. On a whim, we began opening the first few vaults we came across.\n\nInside the first was an immeasurable treasure trove of rare minerals. The second housed strangely beautiful cultural artifacts and perfectly persevered works of art. The third contained both physical and digital stores of vast amounts of information. All of which once belonging to the §HEverdawn Dynasty§!.\n\nThese alone would be enough to justify this entire operation. But while they contained many things, none of the vaults we opened contained the §MAstral Anchor§! Thayo is looking for. It seems that wherever it is, it must lay deeper in. But it couldn't hurt to help ourselves to some of these treasures first...?"
 hskv_heist.2600.option.a.tooltip:0 "Once we locate the §MAstral Anchor§! we will have time enough to loot what we can."
 hskv_heist.2600.option.b:0 "Grab whatever we can"
 hskv_heist.2600.option.b.tooltip:0 "The treasure here will provide our empire an edge that we cannot pass up. We will order our team to grab anything that isn't nailed down. We will also gently remind them that if they can pry it loose, then it isn't nailed down."
 hskv_heist.2610.desc:0 "We are so near our goal that we cannot afford to be sidetracked by such siren treasure. We must stay focused on finding the §MAstral Anchor§! above all else. It is somewhere in this vault. We just need to find it."
 hskv_heist.2620.desc:0 "While a few scouts continued to explore the vault, the rest of our forces plundered as much as we could. Knowing that time of essence, we couldn't even properly catalog our findings. Grab as much as we can and sort it all out later."

 hskv_heist.2800.name:0 "Everdawn Heist - Final Phase"
 hskv_heist.2800.desc:0 "Navigating the seemingly endless corridors of the inner vault took longer than expected. The clock was ticking and the anxiety of running out of time was on everyone's mind. But eventually a forward scout reported the largest and most impressive vault so far, with doors twice has large as any other vault we've seen so far. On the door itself was a single §Y[hskv_target_fe_country.GetSpeciesName]§! statement\n\n§LThe Everdawn Tyrant - May his soul suffer under the weight of his sins until the very stars fade away.§!\n\nOpening the door proved to be surprisingly trivial compared to every other challenge we've had to deal with so far, but what it revealed surpassed our wildest expectations. Inside at the very center of the chamber was a large spherical device, humming with some dark unknowable energy. The walls were lined with strange computers and robotic workers moving slowly around as they maintain it.\n\nThen a bolt of purple lightning arced around the spherical device and to your horror, it began to uncurl and then reform into an ominous floating machine that moved closer to the entrance. It began to spew out some nonsensical audio sounds that may or may not be a language before the machine began to spit out concentrated laser fire. This is it, the final obstacle in our way!"
 hskv_heist.2800.option.a:0 "Can we use explosions again?"
 hskv_heist.2800.option.a.tooltip:0 "Screw it. I don't care that we shouldn't damage this room, I am sick and tired of dealing with these impediments."
 hskv_heist.2800.option.b:0 "Hack it"
 hskv_heist.2800.option.b.tooltip:0 "Another machine we can target with our cyber warfare techniques. However the length of time this will take depends entirely on how skilled our empire is at codebreaking."
 hskv_heist.2800.option.c:0 "Use Military Force"
 hskv_heist.2800.option.c.tooltip:0 "Few things can't be solved with overwhelming firepower lead by a competent commander."
 hskv_heist.2810.desc:0 "But before you could give any order to fall back and begin the process of dealing with this final guardian, you suddenly notice a cloaked figure already deep inside the room. Not cloaked as in a physical cloak, but rather the tell tale shimmer of light bending around it. Only noticeable due to the speed at which it was moving. As your scouts retreated from the room, the footage of inside the room continued to show it moving towards an elevated platform near the back that could supervise the entire chamber."
 hskv_heist.2811.desc:0 "You order your forces to engage with the machine, an attempt to distract it from whatever that cloaked shimmer is as it enters the elevated platform. It was at that moment that the machine screams some large mechanical noise and turns around before rushing towards the platform. It tries to put one of its tendrils through the entrance before it screams further. A scream not of emotion, but rather a result of it pushing itself to 110% of its capabilities. Then the lights on the machine suddenly go out and it collapses to the floor."
 hskv_heist.2812.desc:0 "While your forces cut the guardian machine apart so to grant access to the platform, the strange spherical object in the center that the guardian had pulled itself off of begins to shift and rotate. As it slowly opens up to reveal a powerful containment field surrounding an impossibly §Mpurple sphere§! (its true color likely somewhere in the ultra violet range) the hum shifts into a higher pitch ringing.\n\nYou can't say you were surprised to see Thayo himself step outside of the platform entrance once the machine's tendrils were pulled loose. Still wearing the cloaking device on his back, he drops the heavy device with much relief and begins making his way towards the §MAstral Anchor§! without even an acknowledgment towards those who just freed him."

 hskv_heist.2813.desc:0 "Every member of the team there was transfixed by Thayo. His movement so confident and with such purpose. They all wanted to see what he would do next. As he approached the containment field, a visible wince at the energy and acoustics surrounding it, he pulls out a small lasgun pistol and fires a single shot into base that was powering it. The fear that it would explode violently was quickly seen unfounded as the machine just unceremoniously shuts down.\n\nHe then shoots several more times before finally ending with the §MAstral Anchor§! itself. However, it is this shot that garners a reaction as Thayo suddenly screams out in pain and collapses, clutching his head.\n\nBut the pain was short lived. Before anyone had time to run towards his aid, he began to push himself up to a sitting position with an expression of much relief."
 hskv_heist.2814.desc:0 "Done. It is finally done. The anchor destroyed, and the tethered between us snapped back to myself. Such relief and yet... I feel so tired.\n\n§YThere is a moment's pause before he suddenly laughs and begins to push himself standing.§!\n\nA realization that I must had seemed like some cliche death scene from a Holo. But no. Even if I do seek some release from this long life, we still do have that accord between us. One which I will continue to honor, for a time. As my life is now in my own hands, and no one else's. As it should be. Still, this seemingly immortal body will continue to serve me until such time when I am ready to face Death, on my own terms."

 hskv_heist.3000.name:0 "The Treasures of the §HEverdawn Dynasty§!"
 hskv_heist.3000.desc:0 "With Thayo's objective reached, we now moved on to the relentless plundering of the vaults. With alacrity we are pulling out these mixtures of priceless culture treasures, more mundane yet rare resources, exotic technological wonders, and even perfectly preserved ships of the §HEverdawn Dynasty§! and getting it out of system as fast as we can.\n\nThe final step in our plan involves having teams clean up every trace of our presence in the vault and system before we detonate the vault and hide all trace of our actions here. With luck, we will pull off the greatest heist the galaxy has ever known, and §H[hskv_target_fe_country.GetRealName]§! would never be any wiser of it."

 hskv_heist.3002.name:0 "The Destruction of §YEverdawn Vault§!"
 hskv_heist.3002.desc:0 "It took several months to locate the all the structural weakpoints and power plants within §YEverdawn Vault§!. But now all the charges placed in these key locations. Debris from our battle outside has been cleaned up and our forces have evacuated the system.\n\nWith the last ship out, we shutdown the wormhole stabilization generator, promptly collapsing the wormhole. A few days later the §YEverdawn Vault§! erupted in a huge explosion that tore it completely apart. We can now consider the heist to be a complete success."

 hskv_heist.3005.name:0 "A Panicked Giant"
 hskv_heist.3005.desc:0 "It was only a matter of time before §H[hskv_target_fe_country.GetRealName]§! would learn of the theft that occurred there. But thanks to our efforts, we managed to cover our tracks well enough that they have no idea it was us. In fact because we knew this would happen, we managed to take some actions preemptively to make us seem even less suspicious. In their paranoia of unseen threats, they view everyone as a possible suspect to the crime, even without any evidence. How this will change galactic politics is unclear. Perhaps they will lash out, perhaps not. But as long as they see everyone else as more suspicious than us, we should be fine."
 hskv_heist.3010.name:0 "False Flag Operation"
 hskv_heist.3010.desc:0 "While Thayo has very good reason to be joyful as of late, you can see a real glint in his eyes as he offers a proposal to you. Due to the speed at which they managed to secure the inner vault, we now have time to do more than just cover our tracks, but to actually implicate another empire for our actions. This false flag operation will likely result in provoking §H[hskv_target_fe_country.GetRealName]§! into a hostile action against them, significantly harming one of our galactic rivals and potentially giving us an opening to exploit them. Which of the following empires should we implicate for the Heist on the §YEverdawn Vault§!?"
 hskv_heist.3010.option.a:0 "§H[hskv_fe_false_flag_candidate_1.GetRealName]§!"
 hskv_heist.3010.option.a.tooltip:0 "§H[hskv_target_fe_country.GetRealName]§! will declare war on §Y[hskv_fe_false_flag_candidate_1.GetRealName]§! in 90 days"
 hskv_heist.3010.option.b:0 "§H[hskv_fe_false_flag_candidate_2.GetRealName]§!"
 hskv_heist.3010.option.b.tooltip:0 "§H[hskv_target_fe_country.GetRealName]§! will declare war on §Y[hskv_fe_false_flag_candidate_2.GetRealName]§! in 90 days"
 hskv_heist.3010.option.c:0 "§H[hskv_fe_false_flag_candidate_3.GetRealName]§!"
 hskv_heist.3010.option.c.tooltip:0 "§H[hskv_target_fe_country.GetRealName]§! will declare war on §Y[hskv_fe_false_flag_candidate_3.GetRealName]§! in 90 days"
 hskv_heist.3010.option.d:0 "§H[hskv_fe_false_flag_candidate_4.GetRealName]§!"
 hskv_heist.3010.option.d.tooltip:0 "§H[hskv_target_fe_country.GetRealName]§! will declare war on §Y[hskv_fe_false_flag_candidate_4.GetRealName]§! in 90 days"
 hskv_heist.3010.option.e:0 "§H[hskv_fe_false_flag_candidate_5.GetRealName]§!"
 hskv_heist.3010.option.e.tooltip:0 "§H[hskv_target_fe_country.GetRealName]§! will declare war on §Y[hskv_fe_false_flag_candidate_5.GetRealName]§! in 90 days"
 hskv_heist.3010.option.f:0 "No need to risk it, just cover our tracks"
 hskv_heist.3011.name:0 "Communication from §H[hskv_target_fe_country.GetRealName]§!"
 hskv_heist.3011.desc:0 "We never realized just how full of yourselves you lesser species are. Thinking that you can just attack our most secret systems and get away with it! It seems like a farmer must remove weeds from the garden, so must we from you insolent miscreants. You best use this time to consider your actions and learn from them, least we return to finish the job.\n\n§HYou were framed for this transgression§!"
 hskv_heist.3011.response:0 "It wasn't us!"


########################################################################################################

 hskv.3110.desc:0 "§H[hskv_target_fe_country.GetRealName]§! has fallen. By our own hand of all things. It still feels surreal to say that out loud. Despite all these years of captivity, I restrained myself from §Pever§! imagining revenge. From dreaming it. Lusting for it. Revenge is a sucker's game you know. In the great game of politics and diplomacy; last year's enemies may be this year's allies. You cannot allow your emotions to prevent you from making the optimal decision, even if you are more than willing to ruthlessly exploit the emotions of others.\n\nYet despite all this. Unasked. You gave me this dish of revenge. It matters not why you did. Only that you did, and in the process, allowed me to help bake it. That dish was exquisite. But now it is gone, leaving me feeling... empty? Hallow? I am not sure what I would have expected to feel, but I would had thought, imagined, believed it would be more. But I suppose this is exactly why revenge is such a sucker's game. Not worth to let it consume you, all for a fleeting moment of something mindless, followed by such emptiness."
 hskv.3111.desc:0 "I am glad I tried so hard to avoid it. That I set my sights not at revenge, but at returning what they stole from me. What would I have become, had I allowed such hatred to consume me? Likely a monster to make make even the so called §YEverdawn Tyrant§! appear a schoolyard bully.\n\nYet aside from that emptiness, there was something else. Something... I am ashamed to say it. But a certain gratitude. Even through gratitude is worthless. Curious. It was not freeing me or returning my consciousness that would do this. But this justice that I never asked for. Never deserved.\n\nThis is a debt I feel compelled to repay, but alas, I have nothing more to give. No more hidden gifts or secret skills. The only thing left I can give you is... §Ymy thanks§!."
 hskv.3111.response:0 "You're welcome Thayo Everdawn"

 hskv.3120.desc:0 "§H[hskv_target_fe_country.GetRealName]§! has fallen. It still feels surreal to say that out loud. Despite all these years of captivity, I restrained myself from §Pever§! imagining revenge. From dreaming it. Lusting for it. Revenge is a sucker's game you know. In great game of politics and diplomacy; last year's enemies may be this year's allies. You cannot allow your emotions to prevent you from making the optimal decision, even if you are more than willing to ruthlessly exploit the emotions of others.\n\nBut I can not help but feel some satisfaction at this poetic justice, that despite all that happened, in the end I managed to outlast them."

