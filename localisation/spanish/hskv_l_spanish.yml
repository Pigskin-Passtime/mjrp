# Anomaly
 hskv_azure_prison_anomaly:0 "Investigate Shielded World"
 hskv_azure_prison_anomaly_desc:0 "This strange world is surrounded with a seemingly impenetrable barrier. We should investigate this further."

# Buildings and Starbase Modules
 building_hskv_azure_prision_singularity_fabricator:0 "Azure Prison Singularity Fabricator"
 building_hskv_azure_prision_singularity_fabricator_desc:0 "The remains of the mysterious Facility which housed Thayo. The technology is so advance that it might as well be magic. But it continues to run without much input from us, allowing us access to a boon of ready made materials and energy."
 sm_hskv_wormhole_generator:0 "Wormhole Stabilization Generator"
 sm_hskv_wormhole_generator_desc:0 "The schematics for this starbase module are rather complex and very large. The fruits of countless years of research stolen and funneled away from our empire. Nevertheless it will take advantage of that tenuous link the two systems once held and stabilize the wormhole into existence between them."

# Deposits
 d_hskv_azure_prison_facility:0 "Azure Prison Facility"
 d_hskv_azure_prison_facility_desc:0 "Even after all this time, the containment fields which power this mysterious facility remain stable, providing a small but seemingly limitless source of energy and resources to fuel the prison. While we've managed to supplant its original purpose to fit our needs, no one understands how it continues to work and everyone is terrified at touching it to find out."


# Leader
 hskv_thayo_everdawn_leader_desc:0 "After being freed from his prison on §YAzure Dream§!, this former Imperial Chancellor of the Everdawn Dynasty is now working for you... hopefully."
 hskv_thayo_everdawn_leader_catch_phrase:0 "§L"Point me to your problems, and they will vanish - be they political or corporeal."§!"

# Leader Traits
 hskv_leader_trait_thayo_everdawn:0 "Ancient Imperial Chancellor"
 hskv_leader_trait_thayo_everdawn_desc:0 "This former Chancellor of the Everdawn Dynasty is remarkably talented in organization, governing, diplomacy, and in every and any underhanded trick."
