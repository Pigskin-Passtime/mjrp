########################################################################################################
########################################################################################################
########################################################################################################
########################################################################################################
########################################################################################################

 hskv.4000.desc:0 "It would seem that I had misjudged you. A rare error on my part. But not an unrecoverable one. Although it will delay things quite a bit as I pivot to one of my many backup plans. I shall just have to adapt as I continue onward without you. In the mean time. Farewell §Y[Root.GetLeaderName]§!, I doubt we shall meet again."
 hskv.4000.response:0 "Farewell and good riddance"

 hskv.4010.name:0 "Explosion in §H[hskv_target_fe_country.GetRealName]§!"
 hskv.4010.desc:0 "Our long range sensors have detected a massive explosion in a system near §H[hskv_target_fe_country.GetRealName]§! space. While not a supernova, it represents one of the largest non-stellar explosions on record. Shortly afterward, activity in §H[hskv_target_fe_country.GetRealName]§! began to skyrocket as patrols begin to escalate. We're not sure what has happened here, but something has spooked them, and they looking about the galaxy for something, anything, to lash out against."

 hskv.4021.name:0 "Explosion in §H[hskv_target_fe_country.GetRealName]§!"
 hskv.4021.desc:0 "Our long range sensors have detected a massive explosion in a system near §H[hskv_target_fe_country.GetRealName]§! space. While not a supernova, it represents one of the largest non-stellar explosions on record. Shortly afterward, activity in §H[hskv_target_fe_country.GetRealName]§! began to skyrocket as patrols begin to escalate. We're not sure what has happened here, but something has spooked them, and they looking about the galaxy for something, anything, to lash out against."
 hskv.4022.name:0 "Communication from §H[hskv_target_fe_country.GetRealName]§!"
 hskv.4022.desc:0 "We never realized just how full of yourselves you lesser species are. Thinking that you can just attack our most secret systems and get away with it! It seems like a farmer must remove weeds from the garden, so must we from you insolent miscreants. You best use this time to consider your actions and learn from them, least we return to finish the job.\n\n§HYou were framed for this transgression§!"
 hskv.4022.response:0 "It wasn't us!"

 hskv.4030.name:0 "Death of Thayo Everdawn"
 hskv.4030.desc:0 "We just received report that Thayo Everdawn has died. It would seem that despite all his skill and his unnatural life extension, that even he could not outrun death. His loss is a setback for our empire."

 hskv.4041.name:0 "Out of Time"
 hskv.4041.desc:0 "§YThey just got through the jamming.§!\n\nThayo suddenly announces to everyone in the war room, stunning everyone into silence, fear, and worry. Thayo just sits there, a thousand kilometer stare, stunned and not reacting at all, a realization that they would only have moments before all would be lost. You would later wonder if this was in fact, only the second time in his entire life where his confidence in the face of all adversery and challenge not just wavered but was sweep aside like cosmic dust. But this loss of his composure did not last long as he suddenly stood up.\n\n§YNo. I've come too far to lose now. I will have my freedom, no matter the cost.§!\n\nBefore he calmly walked out of the still stunned room."
 hskv.4042.name:0 "Out of Time"
 hskv.4042.desc:0 "Eventually the lethargic reaction was replaced with a hysteria as everyone began to make preparations for the §H[hskv_target_fe_country.GetRealName]§! response. But they had to do it without any input from Thayo. In the chaos of the escalating situation, Thayo vanished. But it was less that he was trying to cover his trail and more that everyone had bigger things to worry about than looking for him. His actions were later reconstructed after the fact through surveillance imagery and eye witness accounts and is detailed below.\n\nAfter he left the War Room, he proceeded to the hanger bay to board his own personal ship and left, without any of his usual support staff or assistants, suggesting he was piloting his ship alone. The last anyone saw of his ship was it activating a cloaking device to minimize non visual detection and vanishing off our sensors."
 hskv.4043.name:0 "Freedom, whatever the cost"
 hskv.4043.desc:0 "Hours passed before the §YDawn's End§! system is rocked by a massive explosion at the vault. While not a supernova, it represents one of the largest non-stellar explosions on record. Damaging and destroying almost any ship in the system. We can only assume that this was Thayo's last resort, completely destroying the vault and all the treasure and secrets within and freeing the final shackle of §H[hskv_target_fe_country.GetRealName]§!.\n\nBut there is little time to reflect upon this all, because a §H[hskv_target_fe_country.GetRealName]§! response will be forthcoming, now escalated even more with the loss of the vault."
 hskv.4043.response.a:0 "Godspeed Thayo Everdawn"
 hskv.4043.response.b:0 "Another mess we'll need to clean up"

