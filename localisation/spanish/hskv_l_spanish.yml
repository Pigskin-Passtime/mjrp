# Events
 hskv_event_thayo_title:0 "Thayo Everdawn"
 hskv_event_thayo_coms_title:0 "Communication from §YThayo Everdawn§!"
 hskv.10.name:0 "Mysterious Signal coming from Shielded World"
 hskv.10.desc:0 "After a particularly long and grueling investigation by §Y[Root.GetLeaderName]§!, they managed to complete their analysis of planet known as Azure Prison. The planet is shielded with an energy barrier that makes it completely opaque and blocks all known and even several theoretical scanning techniques. Neither are there any external sources of the shield, which has so far ignored all attempts at manipulating it. Had this been all, their investigation would had been over quickly. But a single... anomaly in this anomaly warranted a much deeper and closer look.\n\nThe barrier does appear to be leaking some sort of signal. It is faint, and distorted, but it does seem to interact with certain radiation wave frequencies. §Y[Root.GetLeaderName]§! believes a special project with significant resources and more importantly, budget, might be able to learn something more from this."
 hskv.11.name:0 "Azure Prison"
 hskv.11.desc:0 "Thanks to the hard work from the science team, they managed to decipher the signal. They determined that it is actually communication coming from someone inside the world! While the bandwidth is tiny and can only transmit text, it does allow for us to communicate with only a few second delay. They claimed to have been imprisoned here and are requesting our help in escaping. While we believe he 'seems' authentic, we simply lack the information to know for certain his intentions. We decided that it would be best if you talked with him and come to your own conclusions."
 hskv.12.name:0 "The Azure Prisoner"
 hskv.12.desc:0 "Hello §Y[Root.Leader.GetName]§!. I suppose you are the one I must convince that my plight is genuine? Very well then.\n\nMy name is Thayo Everdawn and I have been imprisoned here for... I'll be honest I lost count long ago. It was only several hundred years ago that I managed to subvert my warden's defenses and begin to pick away at the barrier from my side. Leading to the faint signal which brought you to me. I ask that you free me from this prison created by the §H[hskv_target_fe_country.GetRealName]§!. I could say you'd have my gratitude, but that is not something I personally believe in. Instead we must barter like equals. For only then would we both have something the other wants."

 hskv.12.option.a:0 "Why were you imprisoned?"
 hskv.12.option.a.response:0 "For my 'crimes' against the §H[hskv_target_fe_country.GetRealName]§!. While I will not deny some of them, it was clear that I was being made a scapegloru for every wrong in their society as they threw manufactured crimes on top of my very real ones. So great was this list of crimes that they decreed death was too good for me. And one life's sentence was too short. So they forcefully prolonged my life to an unnatural extent. There was also some torture, but they took pains to make sure that my mind never broke. That I would continue to be cognitive and sound as I live out in this hell they manufactured for me. They claimed to be seeking justice, but it was vengeance they sought.\n\nBut as the years went by, even they seem to have forgotten me. I am certain if any do remember me, it's as some boogytoro that scares their spawn into going to bed on time."
 hskv.12.option.b:0 "Why should we free you?"
 hskv.12.option.b.response:0 "If you desire an intrinsic reward, you can take pleasure in freeing me from this suffering. But there are other far more compelling extrinsic reasons for doing so.\n\nFirst, the world behind this shield may be small, but it is habitable. A worthy colony for your empire, one which would grant you access to this facility for salvage and study, full of wonders beyond your primitive imaginations.\n\nSecond, I can offer you my services. While I may be a little rusty, I can assure you that my skill in governance was never equaled. But alas, not even my skill could have saved us in the end. I am certain that even with your primitive tools, I will make your empire the envy of your neighbors."
 hskv.12.option.c:0 "I am ready to make a decision"

 hskv.13.desc:0 "Well? What have you decided. I cannot deny the risks of helping me. Even outside the risks of trusting me, you also risk confrontation with §H[hskv_target_fe_country.GetRealName]§!, either directly or through their automated defenses.\n\nBut I ask you to look past that and see the potential of what lies behind this barrier and my tireless assistance. Barring that, I also plead for your compassion. To free me from this suffering here and to right the injustice of it. Not the injustice of the punishment, but rather the injustice of the its severity."
 hskv.13.option.a:0 "Yes. We will help you."
 hskv.13.option.b:0 "No. We will not."
 hskv.13.option.b.tooltip:0 "This will effectively end the Thayo Everdawn questline"

 hskv.14.desc:0 "§YThere is a long pause before a reply is made.§!\n\nTo say that this disappoints me would be a grave understatement and yet I cannot fault you entirely. You must balance the needs and wants of many factors, desires, and risks. Your visit does at least give me hope as you have validated my efforts here. Perhaps it will take me another hundred years. Or maybe a thousand. But one day, someone will help. Or perhaps I will finally chip away at the shield enough to bring it down from my side. I just need to continue to wait either for them find me or for this facility to finally fail.\n\nGoodby §Y[Root.Leader.GetName]§!"

 hskv.15.desc:0 "While I have freed myself of some of the shackles my wardens have placed upon me, I am still very limited in what I can do. I would need your help to use the means of our communications in order to bring down this shield.\n\nWe can use this signal to try to destabilize it, but I can only generate so much power from my end. I believe if you create a much more powerful version of it on the outside, matching the pitch, frequency, and overlapping amplitudes of the signal I am sending that it will cause the imperfections in the shield to expand into a hole large enough for a ship to enter. Or violently collapse. Without such an incredibly niche background of this kind of physics, I admit everything I have been doing has just been improvising, so I am uncertain as to what might happen."
 hskv.16.desc:0 "I will continue to work with your scientists and engineers, but in order to destabilize it you'll need apply an excessive amount of energy to this signal. Larger than anything your ships can produce. Only a starbase would be able to house a §YDisruption Field Generator§! large and powerful enough to affect it.\n\nI would also warn you that this facility has some, but not many defenses. The defenses here were designed to stop me from escaping, as the shield itself would be more than enough to stop any external force. So even with such primitive weapons, you should be able to overwhelm them, especially if you properly equip your starbase. More importantly, I can disrupt their communications to prevent them from warning §H[hskv_target_fe_country.GetRealName]§!. As if they were ever warned, you would be utterly annihilated."

 hskv.21.name:0 "Destabilizing the Shield"
 hskv.21.desc:0 "With the module installed on the starbase in §YAzure Dream§!, we are ready to begin the destabilization process to bring down that shield. When you are ready to authorize this special project, we will begin. But if we heed Thayo's warning about possible automated defenses, we should only do it when we have sufficient forces ready to react."

 hskv.22.name:0 "Destabilizing the Shield"
 hskv.22.desc:0 "In unison, Thayo and your scientists begin to match frequency and pump as much power into the subatomic particle waves and directed them towards the shield. The starbase quivered from the amount of energy being funneled through the generator, but that was nothing compared with what was happening to the shield. The seemingly perfect sphere of energy starts to fluctuate. At first only enough to be picked up by sensitive sensors, but within minutes visible shock waves begin to form and interfere with each other, each time further compounding the destabilization.\n\nThen in a flash the shield collapses, the immense energy contained within rushing out as a shockwave emitting from the planet. The starbase shutters from the impact with the shockwave, losing power briefly before being restored. As the status reports come in it soon becomes apparent that the shockwave caused a kind of EMP blast which fried every shield in the system. It will take some time to repair them... time which we might not have.\n\nWithin hours of the collapse, a handful of relatively small ships begin to take off from the surface. They offer no hails, refuse all communications, and are moving to towards our starbase with a speed and agility that surpass our best designs."

 hskv.24.name:0 "Azure Prison"
 hskv.24.desc:0 "With the spacecraft automated defenses taken out, we can finally turn our attentions to the former shielded world Azure Prison. Thayo wasn't wrong that the world could sustain a colony, even if it is a small planet with an unfortunately low gravity. The only other notable feature is a single facility taking up a surprisingly large area. But perhaps that is not surprising given that it was designed to last for thousands if not more years without any outside support.\n\nWhile there are still a sizable number of ground forces for us to worry about, we should be able to manage without needing a full scale planetary assault. As Thayo said, their purpose is to be wardens for a single prisoner, not defend against an outside force. Even with their technological edge, it will not be long before we fully reclaim the facility for ourselves."
 hskv.26.name:0 "Azure Prison"
 hskv.26.desc:0 "Thanks to information Thayo gave us before our attack, we were able to quickly find the holding chamber for him. It was no conventional cell, but one where his body lies in a stasis pod, as his mind is imprisoned in a nearby mainframe. Performing the commands he gave us, we were able to release him from captivity. As he slowly rouses from age old comatose, you are suddenly struck with a realization that he is not same species as the §Y[hskv_target_fe_country.GetSpeciesName]§!. While you ponder whether or not this is relevant, Thayo attempts to stand but fails, and you can see the painful expression of him eating his own pride as he is carried out to someplace safer where he can recuperate."

 hskv.27.name:0 "Azure Prison"
 hskv.27.desc:0 "Within a month, the facility has been fully secured and the world is now ready for colonization. While some of the facility was damaged by the shield collapse and collateral damage as our forces moved in, it is still in working condition. Given the automated nature of it all, we will be able to reap the benefits of this facility for generations to come. Not to mention millions of PhD thesis papers as countless scientists study its secrets.\n\nAs for Thayo himself, he has made a remarkable and expedite recovery given the state he was in. After completing a full recovery, he insisted on speaking with you."

 hskv.30.desc:0 "You have no idea how good it feels to be free of that nightmarish machinery. Free to finally walk in the light of the sun. Any sun really. Free to travel the cosmos themselves. I could offer you my thanks, but gratitude is worthless. Yet the accord we reached is far more valuable than anything you found down there in my prison. Thus I am indeed willing to offer you my services. You would do well to accept so I can get to work. I have much to do, and even more to catch up on."
 hskv.30.option.a:0 "What was that device you were hooked up to?"
 hskv.30.option.b:0 "I noticed you are not the same species as the §Y[hskv_target_fe_country.GetSpeciesName]§!. Why is that?"
 hskv.30.option.c:0 "What talents can you offer to our empire?"
 hskv.30.option.a.response:0 "You might think that this shielded planet, this facility, or even that stasis pod was my prison. But no, the actual prison on this planet was the simulated world which my mind was trapped in. The ageless suffering, torture, reprieve, and even hints of manufactured joy. It took me countless years before I managed to break free of that shackle, gaining root access and allowing me to extend my reach to some, but not all, of the systems in this place.\n\nThere is a part of me that still thinks I never escaped it. That this is still all part of the simulation. But rationally, I know that is not the case. The simulated world they built was not perfect; indeed, it was never meant to be. Its sole purpose was merely to contain me. It also suppressed my psychic abilities which have been slowly recovering. And while they were excessively vindictive in their punishment, and I will admit this prolonging of my life was creative, they were far too shortsighted as to offer me the greatest torture of all, false hope."
 hskv.30.option.b.response:0 "Were you expecting me to have been a citizen of their empire? No. I was never a part of that puerile, callow, and unsophisticated cartel they call an empire.\n\nAlas, for all their faults, they were indeed the instrument of my defeat. I once helped rule an empire that could make even the very stars quake in fear. But we grew complacent and focused inward at the exclusive of all else. By the time we realized our mistake, it was too late. I pride myself in my ability to see five moves ahead of everyone, but the circumstances of our fall was that of an outside context, one which the §H[hskv_target_fe_country.GetRealName]§! took full advantage of. Sadly, seeing five moves ahead doesn't help when someone not in the game intervenes. The irony that they are now in the same state as we were so many years ago is not lost upon me."
 hskv.30.option.c.response:0 "Previously I was the chancellor of the §HEverdawn Dynasty§!. While my second cousin ruled as queen, I was her right hand as I enforced her will on the galaxy. If you want proof of my skill and reputation; look no further than the fact that §H[hskv_target_fe_country.GetRealName]§! spared no effort in their 'justice' for me, where as my queen was merely executed.\n\nBut aside from my organization skills, I am also psychic, something that was quite rare outside of the royal family. Extremely useful whenever I needed to get my hands dirty, which was quite often.\n\nOne thing I will make clear though is that I have no interest in ruling an empire. I find that being the right hand of an empire to be a lot more fulfilling, rewarding, liberating, and productive than actually ruling one."

 hskv.30.option.dismiss:0 "The deal is off"
 hskv.30.option.dismiss.tooltip:0 "This will effectively end Thayo's questline. But what will Thayo do next?"
 hskv.30.option.hire:0 "Welcome aboard!"
 hskv.30.option.hire.tooltip:0 "Welcoming a mysterious alien into a position of power who has been imprisoned for tens of thousands of years of unspecified crimes surely won't have any ramifications?\n\nNote that there is a minor interface bug where you will get a bogus pending trait. Just select any trait for no effect in order to get rid of it."


 hskv.31.desc:0 "Thayo's expression remains stoic as he responds.\n\n§YWell then. That is your loss. Now if you'll excuse me, I have work to do.§!\n\nThe communicator suddenly shuts off. By the time your demands for determining what happen were met, Thayo was gone. During that short window he managed to subvert his caretakers, likely due to the psychic abilities he claimed, and managed to talk/subdue/kill his way to the hanger and steal a ship before escaping the system. The fact that he did this all with only a week of planning is perhaps the most troubling bit of all. Underscoring just how much you underestimated this one alien. We can keep our sensors on the look out for him, but with luck we will never see or hear of him ever again."


 hskv.95.name:0 "Thayo Acclimates to governing"
 hskv.95.desc:0 "It seemed like it was only a few years ago when Thayo struggled integrating himself with our society, let alone actually governing. While there are still many minutiae of our empire he struggles with, but he is no longer accidentally making a fool of himself and has started to prove himself to be quite an asset to our empire."
 hskv.96.name:0 "Thayo Acclimates to governing"
 hskv.96.desc:0 "Thayo's integration with our society continues to improve. On one hand, it has taken him several years to reach his current state, but on the other hand, it is remarkable just how quickly he has relearned so many skills and talents from his time before his imprisonment. He probably would never admit it, but his time on that world took quite the toll on him and the fact that he has managed to recover in any functioning way is astounding."
 hskv.97.name:0 "Thayo Acclimates to governing"
 hskv.97.desc:0 "Thayo's long road to recovery as come to an end. He has finally reached his stride and moves between officials, officers, CEOs, scientists, and countless other individuals across all levels of society as if he was a born and raised §Y[Root.GetSpeciesName]§!. With the trials of his imprisonment put behind him, he seems to be more determined than ever as he runs a constant stream of meetings to govern our empire, continuing to learn, adapt, and perform beyond all expectation."

 hskv.120.desc:0 "Thayo has been hard at work as he charms his way through upper society and government in the course of his work. Somehow, despite the fact that he has many duties and responsibilities, he has also been doing quite a lot on the side as well. He claims it is because his body only needs a short amount of rest, but what is really on display is a truly tireless determination.\n\nHe has proceeded to hand us a very detailed report on §H[hskv_target_fe_country.GetRealName]§!. He admits that it is heavily outdated and mostly from his very ancient memory, but this report has been a gold mine for study and analysis and has given us a very deep insight into ancient §H[hskv_target_fe_country.GetRealName]§! culture, warefare and psychology."
 hskv.121.name:0 "The Unwanted Destitute Dregs of Society"
 hskv.121.desc:0 "You are not sure how Thayo did it, but somehow during the course of his duties he managed to locate several entirely hidden cities. At first you were surprised, but then it soon became clear why they were so hidden. These cities are full of people who wished to remain off the grid for criminal purposes outside the reach of our law. In short, they are full of low life smugglers, drug dealers, and criminals organizations. Thayo purposed several solutions to this dilemma below, with his own recommendation for integration back with our empire."
 hskv.121.option.a:0 "Bring them back into the fold, whatever the cost"
 hskv.121.option.a.tooltip:0 "While the addition of such a questionable labor force would be quite the boon, we should consider that they might not wish to be brought back into the ford, even with a generous package. Not to mention the morally bankrupt among them might continue to relapse into their criminal ways.\n\nThis will create four £pops£ §Y[Root.GetSpeciesName]§! on §Y[hskv_target_planet.GetName]§! with §Rdeviant§!, §Runruly§!, and §Rquarrelsome§! traits."
 hskv.121.option.b:0 "They may continue to exist, so long as they pay their due"
 hskv.121.option.b.tooltip:0 "So long as they pay their taxes and do not cause too much trouble, they may continue to exist."
 hskv.121.option.c:0 "Wipe that hive of scum and villainy off the star map"
 hskv.121.option.c.tooltip:0 "Such a criminal haven is a cancer on our society that must be removed, with force."

 hskv.130.desc:0 "In Thayo's tireless efforts to smooth out the operations of our empire, it seems he has created his very own private network of orderlies and assistants above and beyond the scope of his regular duties. You knew that his organizational skills were peerless, but the fact that he had manages to keep track of it all without fail is impressive.\n\nThis has allowed him to have the resources to be effective at both his duties on the council and on the planets under his jurisdiction. Most recently he has started working out some ways to improve worker productivity as he directs his ever growing network towards our workers. Although the workers do not appreciate this level of oversight, it has been showing results and an increased efficiency."
 hskv.131.desc:0 "As the sophistication of Thayo's private network continues to grow and get ever larger, some doubts and concerns began to form by some of Thayo's detractors. They wouldn't raise these issues directly to him, but rather behind his back. The most notable argument is that this private network of his exists outside the bounds of the government, thus not only is it outside most checks and balances but also would make his private network loyal only to him. This concern does begin to gnaw on you, although perhaps you are overthinking it too much. Instead you decide to do what they would not, talk to Thayo about it."
 hskv.132.desc:0 "You just noticed that did you? Yes, that is perhaps my most signature approach to governance, one which I replicated as quickly as I could. Accurate information, knowing the motivations of all players in the game, and even being able to nudge things a certain way. These are the key to both making sound decisions and also to ensure the best possible outcome. You can not plan five moves ahead if you can't even see what their current move is now, let alone what their goals and motivations are."
 hskv.132.response:0 "So a spy network?"
 hskv.133.desc:0 "You are not wrong in such an interpretation. There would be much overlap between the two concepts. But a spy network tends to focus on the important players. I, however, direct it more broadly towards not just the important players but also the overlooked ones. To find the boring pillars which hold everything up. The trend setters. The gears which must grind to make civilization function. It is certainly expensive, and produces unimaginable amounts of data to shift through, yet it is precisely this which enables me.\n\nStill your remark about comparing it to a spy network is a curious one. Perhaps I will arrange a meeting with the Intelligence Director. I imagine we would have much to discuss about."
 hskv.133.response:0 "A Good Idea"

 hskv.135.name:0 "Strange Rumors"
 hskv.135.desc:0 "While Thayo might overstep himself with his initiative, his record since joining your empire has been flawless. However, this impeccable record has started to see the first signs of... not quite a black mark, but an undercurrent of worry.\n\nIt is not that anything wrong has been found or proven, but rather that there has been a considerable amount of rumors about Thayo, specifically about what he has been doing with his own private network of orderlies. Shady dealings, meeting with individuals of questionable moral caliber, and even accusations of him enriching himself over the course of performing his duties.\n\nSome have wondered if these unsubstantiated rumors are a ploy by some rival or foreign empire to discredit him. While others have suggested that the amount of leeway he has been given will allow him to put his talons into more and more pies in the empire, eventually reaching the point where he could usurp control of the empire itself.\n\nBut one thing is certain, these rumors about Thayo started some time after the slow but steadily increasing rise in crime over the past few years that all seems explainable in isolation, but less so in aggregate. So great is this rise of crime that it is now a daily bullet point in your morning reports."

 hskv.136.name:0 "Production Boost on §Y[hskv_thayo_governing_planet.GetName]§!"
 hskv.136.desc:0 "Thayo has a put in place a controversial initiative to boost productivity on his governing planet of §Y[hskv_thayo_governing_planet.GetName]§!. He admits that it is somewhat of an experiment to see if it has merit to be exported elsewhere. But the early reports make it seem rather promising, even if it is universally panned by everyone on the planet."
 hskv.137.name:0 "§Y[Root.GetName]§!"
 hskv.137.desc:0 "Thayo's experiment on §Y[Root.GetName]§! has come to a tragic end. The factories and people, being pushed to their absolute limit for so long, suffered several cataclysmic failures causing a chain reaction that destroyed an entire city as well as causing an environmental disaster in the surrounding region that will take years to recover from.\n\nAs a result of this, his controversial productivity initiative has been terminated."

 hskv.140.desc:0 "The collaboration between Thayo and your Intelligence officers has been paying dividends. Already the efficiency of all your agents have been improved by a significant amount such that you are all surprised that something as simple as organizational logistics with a smart mixture of strong managerial authority mixed with local autonomy who are empowered to improvise could provide such a noticeable benefit as to throw out every leadership book written in the past century."
 hskv.141.name:0 "§YOperation Suffocating Tendril§Y"
 hskv.141.desc:0 "You were not expecting to wake up to a golden bomb being placed on your desk, but that is precisely the best analogy for the report Thayo has put on your desk. In it, Thayo has detailed a daring plan, called §YOperation Suffocating Tendril§Y to discover and convert a number of potential assets across nearly every single empire we are in contact with. This in itself is a very interesting proposal that as a lot of merit, risk, and costs associated with it.\n\nThat wasn't the problem though. The problem was that he had already put this operation into effect over a year ago and you only just discovered it this morning. Now you need to figure out what damage control, if any, you want to perform on this."
 hskv.141.option.a:0 "§YOperation Suffocating Tendril§Y is exactly what we need!"
 hskv.141.option.a.tooltip:0 "We will gain a random asset from nearly every empire we are in contact with. We will also gain a decaying §R-25 opinion§! with every empire."
 hskv.141.option.b:0 "The scope of this must be restricted at all costs"
 hskv.141.option.b.tooltip:0 "The fallout of this could risk a serious diplomatic incident that we must avoid. The benefit of a §YGather Information§! operation will complete against every empire we are in contact with."
 hskv.142.name:0 "A Questionable Contract"
 hskv.142.desc:0 "In what is becoming the latest in a long line of headaches caused by Thayo. He has apparently took it upon himself to renegotiate an important empire wide ship production and maintenance contract and gave it to the relatively unproven upstart Defense Contractor, Darkwater Industries. While their prices for ships are better than any other company, the general impression is that their ship quality is subpar and requires constant maintenance. The Red Flag for his contracted was raised when it was discovered that in the fine print that each Darkwater Industries ship can only be repaired at an authorized Darkwater Industries or one of their subsidiaries repair facilities, enforced by a quantum entangled DRM system and an army of lawyers.\n\nNeedless to say, this contract will ultimately cost our empire far more over the long run than the cheaper ships will save us. Complicating this though, is that the fine print also details a hefty breach of contract fee should we rescind it."
 hskv.142.response.a:0 "As painful as it is, it does suit our needs"
 hskv.142.response.b:0 "No. Just No. Just pay the damn Breach of Contract fee"

 hskv.143.name:0 "Crime Wave"
 hskv.143.desc:0 "There has been a recent upswing in crime on several planets in our empire. While there is no identifiable source for this general lawlessness, they are starting to cause considerable problems as their influence grows. Not only have they been targeting our loyal citizens, but are also brazen enough to strike out at our own resource silos and warehouses to fuel their crimes."

 hskv.150.desc:0 "Many years ago, Thayo had turned his private network towards optimizing worker productivity. As his network grows ever larger and embolden by his previous success (that one exception not withstanding) he has now directed his efforts towards improving specialist productivity. This has had the expected outcome of productivity being boosted at the cost of them really not liking this oversight."
 hskv.151.name:0 "\"Alleged\" Corruption"
 hskv.151.desc:0 "While the rumors around Thayo have always remained just that, rumors. Something has changed recently. Evidence has begun to slowly stack up that Thayo has been enriching himself at the expense of the empire, using the rising criminal undercurrent as a mask for his theft. It would appear that Thayo is abusing his position of power and privilege while using his governing competence as a shield against possible retribution. We will need to keep an eye out on him and see if this situation continues to develop."
 hskv.152.name:0 "A New Golden Age of Piracy"
 hskv.152.desc:0 "As trade booms at a nearly unprecedented level, merchant ships full to the brim with trade goods, amenities, and resources have become a target for pirates seeking to take advantage of such fat and juicy targets. Our starbases have been working overtime to try and cull the worst of them, but they have been overwhelmed. The situation may call for specialized police fleets to deal with the worst of them. But if we can keep the pirate activity in check we will benefit from the taxes such trade brings."

 hskv.160.desc:0 "The evolution of Thayo's private spy network has reached new heights. Frankly it is almost frightening in its efficiency as well as its scope and scale. You had first believed his private network was mostly domestic in nature, but now you suspected that it always had a galactic focus, even if he had started small.\n\nNow his agents are moving effortlessly through every alien empire, with his sleeper cells and contacts now so deeply integrated with them that it would be nearly impossible to remove them all, even if you were aware of them. The result of these efforts working together with your own spy network is apparent when you read the reports concerning foreign empire affairs. It is nothing short of astonishing."
 hskv.161.name:0 "Rising Crime"
 hskv.161.desc:0 "It is a sad state of affairs that you now have an entire department keeping an eye on Thayo now. But finding about the antics of some of his initiatives sooner rather than later at least can help you with the damage control. Still, even with his various... indiscretions, he has still a tremendous asset for the empire. Yet you wonder if the needle on that calculation has shifted closer to a tipping point.\n\nWhile it was generally assumed that his actions seemed to encourage or embolden criminal activity that he takes advantage of, his role in it all has become all the more apparent as crime has begun to increase across the entire empire, allowing him to mask his embezzlement even more."
 hskv.162.name:0 "Criminal Crackdown"
 hskv.162.desc:0 "After being grilled by the media §Pagain§! about the rising crime in §H[Root.GetName]§!, you immediately call an emergency conference call with your cabinet. While no direct accusations were aired during the meeting, dirty looks and off handed remarks were certainly aimed towards Thayo, who took such indirect criticisms as stoically as Durasteel armor plating would take a Coilgun round.\n\nDespite the tension in the room, the meeting was ultimately productive when Thayo put forth the suggestion that we can empower our enforcers to be even more effective and motivated by allowing them to reclaim criminal assets for the state, a la §YAsset Forfeiture§!."
 hskv.162.response:0 "We can only hope that this will help"
 hskv.163.name:0 "Diplomatic Incident"
 hskv.163.desc:0 "Another day, another headache. Stealing from §H[Root.GetName]§! is apparently not enough for him, but now he has gone and done it against the §H[hskv_target_country_theft.GetName]§! too. You half wonder if the only reason why he wanted to work with your spy agency in the first place was just so he could pull off stunts like this.\n\nWhile it is all but certain that he is pocketing some percentage of these stolen assets, the rest are currently in transit to our warehouses as we speak. Still, once §H[hskv_target_country_theft.GetName]§! finds out (if they haven't already), we will almost certainly have a diplomatic incident on our hands. The only way we could possibly avoid it is to quickly come clean about the incident and offer to pay restitution.\n\nAlternatively, we could just keep this valuable cache of technology and resources Thayo managed to claim for ourselves..."
 hskv.163.response.a:0 "Keep the stolen goods for ourselves"
 hskv.163.response.b:0 "Return the stolen goods and publicly apologize"

 hskv.170.desc:0 "Thayo's domestic interest has taken a curious pivot as of late. While on the council he has been pushing for aggressive subsidies and lifting of moral safeguards on many fields of science. With a specific focus on the strange material §YZro§! as well as §Ywormhole study§!. While it is not clear what the outcome of these will be, his fiery debate on the matter has swayed not just the council but also many leading research institutions as to their long term benefits."
 hskv.171.name:0 "Unrestricted Research"
 hskv.171.desc:0 "The fruits of Thayo's unrestricted research initiative is finally showing promise. Already countless researchers are working around the clock on experiments and devising new complicated theories. While these grants are not cheap, as is dealing with the moral panic over these objectionable scientists and engineers, they are showing a lot of promise.\n\nOne of the side effects of the intense collaboration occurring is the loosening of a lot of red tape regarding the sharing of data, which along with loosening security to facilitate ease of access, has resulted in our networks being opened up to cyber criminals looking to steal our unredacted peer reviewed papers and patents. While we can now move faster, so are those looking to follow in our tailwinds."

 hskv.180.desc:0 "Thayo's governing performance has, despite his best efforts at trying to convince us otherwise, been one of remarkable growth over the many years. But it seems that the growth of his skills has finally plateaued as he has apparently reached his pinnacle of potential with his recent expansion of his private spy network. Still, this network of his has deeply embedded itself into countless other foreign empires to such a degree that there is a joke that §Y[Root.GetRulerName]§! gets the morning news before ruler §Y[hskv_target_country_theft.GetRulerName]§! of §H[hskv_target_country_theft.GetName]§! gets theirs."
 hskv.181.name:0 "Has Thayo no Shame?"
 hskv.181.desc:0 "You take the latest report on Thayo's antics and throw it against the wall. You were willing to put up with his shenanigans for a long time, especially because of the rare skills and talents he brings to us. But as you stare at the latest report about his indiscretions as the datapad lies broken on the floor in a corner, it has finally gone too far. His theft of §H[Root.GetName]§! resources has reached a level of brazenness as to defy all comprehension. Is he trying to provoke a response? Does he think this is a joke? That he is immune to all consequences?\n\nDue to his power, few of his critics would formally accuse him. But if you, ruler of §H[Root.GetName]§! can not put a stop to this, then you might as well just hand the keys of the empire over to Thayo right now because it means that he runs this empire, not you. It is time to confront him and demand some answers."
 hskv.182.desc:0 "Of all the concerns you have in §H[Root.GetName]§!, this is the one you bring up? My private network which benefits this empire so much is also extraordinary expensive. With needs both obvious and not which all must be satisfied, least it all falls apart. Your concerns are overblown, misplaced, and irrelevant."
 hskv.182.response:0 "So you don't even deny it?"
 hskv.184.desc:0 "No. I do not. To say otherwise would be an insult to you. Resources are made to be exploited and used, not hoarded in a warehouse. I can assure you I am putting them to far better use than you ever would. And the results speak for themselves.\n\nAnd to answer your next question, no. I will not back down from this. This network is reaching the critical mass it needs to perform its functions flawlessly and achieve its purpose."

 hskv.184.option.a:0 "We've had enough Thayo. We are putting you under House Arrest"
 hskv.184.option.a.tooltip:0 "While Thayo can continue to perform his duties, he will be hampered by constant red tape, security sweeps, and surveillance. This won't be cheap, and it will impede his duties, but it will also dramatically lower the amount of corruption he can get away with."
 hskv.184.option.b:0 "We'll let you off with a warning... But tread carefully Thayo."
 hskv.184.option.b.tooltip:0 "By the Shroud. How do we put up with such an infuriating and insufferable individual?"


