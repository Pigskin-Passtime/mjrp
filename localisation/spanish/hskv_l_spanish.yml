# Situations
 hskv_situation_thayo_manhunt:0 "The Hunt for Thayo Everdawn"
 hskv_situation_thayo_manhunt_type:0 "$hskv_situation_thayo_manhunt$"
 hskv_situation_thayo_manhunt_desc:0 "Thayo Everdawn has finally gone too far. We must find him in order to recover the assets and resources he has stolen from us."
 hskv_situation_thayo_manhunt_monthly_change_tooltip:0 "Our current progress in our search for Thayo."
 hskv_situation_thayo_manhunt_outcome:0 "Locate and Capture Thayo Everdawn"
 hskv_situation_thayo_manhunt_frugal:0 "Minimal Effort"
 hskv_situation_thayo_manhunt_frugal_approach_tt:0 "Despite the damage to our empire and our pride done to us by Thayo, we have bigger issues to be concerned about than some wild Pilipo chase."
 hskv_situation_thayo_manhunt_regular:0 "Nominal Effort"
 hskv_situation_thayo_manhunt_regular_approach_tt:0 "Thayo cannot be allowed to escape justice. But neither can we divert what little of our resources we have left. We can only hope the trail will not go cold by the time we locate him."
 hskv_situation_thayo_manhunt_careful:0 "Cautious Effort"
 hskv_situation_thayo_manhunt_careful_approach_tt:0 "The betrayal of trust Thayo has shown us cannot go unpunished. While he has made errors we can exploit, we must be careful. Thayo would have almost certainly foreseen us coming after him and would have laid many a traps to discourage us from finding him.\n\n§GThe Chance of Negative events is reduced§!"
 hskv_situation_thayo_manhunt_aggressive:0 "Aggressive Effort"
 hskv_situation_thayo_manhunt_aggressive_approach_tt:0 "We will spare no expense at hunting down this no good lying double-crossing rapscallion! When we find him, he will wish we had left him to rot in that prison.\n\n§RThe Chance of Negative events is increased§!"

 hskv_thayo_stage_1_desc:0 "Our agents are scouring the galaxy for any sign of Thayo and his accomplices."
 hskv_thayo_stage_2_desc:0 "Our agents are zeroing in on Thayo's whereabouts."
 hskv_situation_thayo_manhunt_high_crypto_tt:0 "§GHigh codebreaking skill§!"


 hskv_situation_vault:0 "The §YEverdawn Vault§!"
 hskv_situation_vault_type:0 "$hskv_situation_vault$"
 hskv_situation_vault_desc:0 "Thayo's long running plan is now finally coming to fruition. We have only a limited amount of time to get in there and find the valuable repositories of §YEverdawn Dynasty§! artifacts, technology, and the §MAstral Anchor§!. If we take too long then §H[hskv_target_fe_country.GetRealName]§! will be alerted and their response will be nothing short of cataclysmic."
 hskv_situation_vault_outcome:0 "§YEverdawn Vault§! bypasses our jamming to send a distress call"
 hskv_vault_stage_1_desc:0 "Our finest explorers and soldiers are working around the clock to explore and secure the vault."
 hskv_situation_vault_monthly_change_tooltip:0 "§YEverdawn Vault§! is still operational and is attempting to circumvent our jamming to put out a distress signal."
 hskv_situation_vault_exploration:0 "Secure the Vault"
 hskv_situation_vault_exploration_approach_tt:0 "With the stakes this high of a §H[hskv_target_fe_country.GetRealName]§! response, there is only one logical approach; every resource at our empire's disposal MUST be available for this operation, no matter the cost."


