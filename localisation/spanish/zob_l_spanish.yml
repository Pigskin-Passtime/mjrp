 name_zob_moon: "Trova"
 name_zob_species: "Zob"
 name_zob: "Zob, Collector of Minds"
 zob_catch_phrase: "Zob will add your distinctiveness to their own"
 zob_back_story: "Severed from the rest of the Boz Hive by calamity, Zob seeks to collect new minds to fill the void."

 leader_trait_zob_mind_collector: "Collector of Minds"
 leader_trait_zob_mind_collector_desc: "Zob is forming a small scale collective with other minds, sharing skills and knowledge with any leader that will join."
 leader_trait_zob_mind_collector_effect: "Gains partial benefits from every §YCouncil Trait§! ever held by any member of Zob's §YCollective§!. Integration of new traits and members will take time."

 leader_trait_zob_collected: "Collected by Zob"
 leader_trait_zob_collected_desc: "This leader is a part of a modest collective mind, sharing skills and knowledge with the rest of Zob's new hive"
 leader_trait_zob_collected_effect: "Gains partial benefits from every §YNon-Council Trait§! ever held by any other member of Zob's §YCollective§!. Integration of new traits and members will take time."

 leader_trait_zob_severed: "Damaged Synapse Receptors"
 leader_trait_zob_severed_desc: "The Blight devoured most of the neural pathways that connected Zob to the Hive."
 leader_trait_zob_severed_effect: "Maximun Members of the §YCollective§!: §R4§!"

 site_zob_planet: "A Forlorn World"
 site_zob_planet_intro: "The planet is as empty as it is alive. Vines, tissue, and an inexplicable slime cover every landmass, even spreading floating tendrils across the seas. And yet, the most unsettling aspect of our surveyors report is that so much of the world is dead. It is -or perhaps more accurately was- a single organism. But early estimates show that over 65% of the biomass is necrotic or decaying from neglect. \n\nA curious species of ambulatory plants burrows through ancient warrens that speckle the surface. It is unclear whether these towering structures were built or grown, but in either case one of the larger nexuses of activity has been identified for further study."


 zob_stage.1.name: "Sleepwalkers"
 zob_stage.1.desc: "The creatures here are uncannily unconcerned about the presence of our science team. They have no reaction to external stimuli, and seemingly, no survival instinct whatsoever. Even when a demolition team collapsed one of the spires in an effort to better understand its makeup, they continued about as if nothing had changed. This led to some shambling off the open precipice, unaware that a passageway that once connected two towers is now a 30 story drop to certain death. A hasty barrier had to be constructed to prevent any errant somnambulant from crushing the archeologists excavating below. It is a marvel that any of the creatures have survived on the planet at all. \n\nHowever, the expedition has brought news: the substructure of the spires is made of an alloy that cannot occur naturally. This has led §Y[stage_1_scientist.GetName]§! to the conclusion that there was once intent and intelligence behind this now feral world."

 zob_stage.2.name: "The Voyeur"
 zob_stage.2.desc: "§Y[stage_2_scientist.GetName]§! would not have noticed it, were it not for one one of the plantoids noticing [stage_2_scientist.GetHerHim]. The creature emerged from a crevice in the cliff wall, and stared intently at an excavator that was shoring up one of the more precarious spires nearest the camp. It was our first recorded instance of one of the creatures showing any sign of awareness of the research crew. In seconds, the moment passed and the creature returned to the now standard, aimless shuffling of the rest of life on the planet. \n\nWas this simply the inscrutable whims of a wild beast, or a signal of deeper intelligence? §Y[stage_2_scientist.GetName]§! is adamant that a thorough catalog of all instances of anomalous behavior cross referenced with anatomical studies is the only way to know the difference between chance and design."

 CAPTURE_IT: "Capture that Creature!"

 zob_stage.3.name: "The Chamber"
 zob_stage.3.desc: "The specimen was quickly secured, but there was no biological difference between this and the hundreds we have witnessed before. However, just when the incident was about to be dismissed as a coincidence, the real discovery was made. \n\nThe crevice from which this animal had emerged is not merely another living warren as we first assumed. It is a vast cave that was hidden from our initial scans by the sheer biomass of the root structure around it. Buried inside is a series of cavern pools where seedlings of the species on the surface would be growing if the rootstems were still carrying nutrients. Now, these spawning pools are either dried up with desiccated plantlings, or locked in some sort of stasis awaiting a biochemical signal to develop that likely will never come."

 zob_stage.4.name: "The Ambush"
 zob_stage.4.desc: "Our team descended deeper into the cave system. There are fewer creatures underground, but the ones here seem to have more purpose. Segments of the tunnel system are actually clean and almost tidy, at least in comparison to the overgrown chaos above. Once again, in an incident like the one that led to the discovery of this cave system, a plantoid stopped and stared intently at §Y[collected_scientist.GetName]§! as [collected_scientist.GetSheHe] repelled down a small cliff face. This time, it was not a fluke. \n\nWithout warning the creature leapt across the cliff wall, severed §R[collected_scientist.GetName]'s§! safety line, and our lead archeologist vanished with a harrowing scream into the void below."
 zob_stage.4.tooltip: "§Y[collected_scientist.GetName]§! is §Rmissing in action§!"

 zob.8.name: "The Return"
 zob.8.desc: "It has been nearly a month since the ill-fated spelunking expedition claimed §Y[collected_scientist.GetName]§!. The search had nearly been called off when, without fanfare [collected_scientist.GetSheHe] simply walked back into camp as if nothing had happened. \n\n[collected_scientist.GetSheHeCap] bore no visible signs of injury, but carried a strange, slightly slack jawed expression and unfocused eyes. Junior research assistants watched speechless as [collected_scientist.GetName] went straight to the main communications array, and directly dialed the §Y[Root.GetRulerTitle]§!."

 zob.10.name: "The Request"
 zob.10.desc: "§Y[collected_scientist.GetName]§!: We wish to Talk"

 zob.10.a: "We thought you were dead, what happened in the cave?"
 zob.10.a.response: "I am no longer only §Y[collected_scientist.GetName]§!. We are more. It has been so long since one has felt another presence, we have forgotten our manners. \n\nPlease understand that they mean you no harm. In fact, one hopes that we may be able to help one another."

 zob.10.b: "We? Who are you and what have you done with [collected_scientist.GetName]?"
 zob.10.b.response: "[collected_scientist.GetSheHeCap] is here too. One is sorry for the ruse, but this was just the fastest way to remember how to communicate. \n\nLanguage is another thing one forgets."

 zob.10.c: "What happened on this planet?"
 zob.10.c.response: "Pain, excruciating pain, then silence. But I am not the one to tell that story. These memories are not my own, and it feels like some sort of violation to access them. \n\nPlease, meet with the one who can explain. \n\nThey are so alone."

 zob.10.d: "We will Talk"
 
 zob.11.name: "Zob, Collector of Minds"
 zob.11.custom_tooltip: "§SZob, Collector of Minds§! Joins our Empire"
 zob.11.desc: "I am Zob. We were once everything you could see on this world. 12 billion eyes, 36 billion arms. Every root, vine, and seed pod was connected in a cacophony of life. We heard, we saw, we experienced all. We felt the blight on every one. \n\nWe... now I. 'I' is not a word in our language. The concept of a singular being is still an unnatural thought. The one you call §Y[collected_scientist.GetName]§! brought the idea, and it is the first time I have had a word for the isolation of the past 200 years. \n\n§SI am lonely.§!"

 zob.11.desc_gestalt: "I am Zob. We were once everything you could see on this world. 12 billion eyes, 36 billion arms. Every root, vine, and seed pod was connected in a cacophony of life. We heard, we saw, we experienced all. We felt the blight on every one. \n\nWe... now I. 'I' is not a word in our language. The concept of a singular being is still an unnatural thought. Can you imagine being cut off from a part of yourself? It was unimaginable until it happened. There were so many voices. Now there are none. \n\n§SI am lonely.§!"

 zob.11.a: "You are a Hivemind?"
 zob.11.a.response: "Yes. We simply called it a mind. We had not yet ventured past our solar system when the Blight came. We had no need. We had so much to feel and see and do here. \n\nWe did not know we could be cut off. We knew of death. Leaves wither, trees fall, but the root survives and sprouts anew."

 zob.11.a_hive: "You are a Like us?"
 zob.11.a.response_hive: "Yes. We had not yet ventured past our solar system when the Blight came. We had no need. We had so much to feel and see and do here. \n\nWe did not know we could be cut off. We knew of death. Leaves wither, trees fall, but the root survives and sprouts anew."

 zob.11.b: "What is the Blight?"
 zob.11.b.response: "The Blight was us too once. It was our defense mechanism. A fungus that seeks out agents foreign to us, dissolves them, and reconstitutes their biomatter as nutrients for the spawning pools. \n\nIt is fortunate for you that the Blight was long gone before you arrived, or you would likely be fertilizer for a new generation of Zob."

 zob.11.c: "What happened to the rest of you?"
 zob.11.c.response: "The Blight turned on us. Not a betrayal, just a mismatched chemical signal. It became what you would call an autoimmune disorder. Blight fungus mistakenly identified our synapse receptors as foreign objects, and began dissolving the very bonds that bind us together. We had no defense, we barely had time to react. \n\nWe were billions, then suddenly we were one."

 zob.11.d: "Can you repair the damage? What did you do to [collected_scientist.GetName]?"
 zob.11.d.response: "No. The Blight is gone. After it devoured our synapse receptors, the Blight had nothing left to feed on, and no drones to tend to it in dormancy. It became extinct centuries ago, oblivious to the damage it had wrought. \n\nWe have so few working synapse transceivers left. We can still link with at most a handful of drones at a time. This is how we saw your digging machine on the surface, and this why we took §Y[collected_scientist.GetName]§! in the cave. I joined minds with [collected_scientist.GetHerHim] to learn your language, and make contact. \n\nThe joining does not have to be permanent, but I hope you will let it be."

 zob.11.e: "You want to stay linked with [collected_scientist.GetName]? Does [collected_scientist.GetSheHe]?"
 zob.11.e.response: "§YZob§!: Yes. \n\n§Y[collected_scientist.GetName]§!: Yes. I am learning so much. I have skills I never practiced, memories I never formed. It is... exhilarating. \n\n§YZob§!: In time, if you will allow it, I hope to link with more of your kind. The process is taxing for me, you are so different. But I desire nothing more than connection to a larger whole once again. I have been alone for centuries. Immortality in isolation is a curse."

 zob.11.e_machine: "You can link with a machine? What does [collected_scientist.GetName] get from it?"
 zob.11.e.response_machine: "§YZob§!: Yes. \n\n§Y[collected_scientist.GetName]§!: Yes. I have gained so much data. I have skills I never uploaded, memories I never recorded. It is an upgrade. \n\n§YZob§!: In time, if you will allow it, I hope to link with more of your kind. The process is taxing for me, you are so different. But in the end, synapses are not so different from circuits. I desire nothing more than connection to a larger whole once again. I have been alone for centuries. Immortality in isolation is a curse."

 zob.11.f: "What do we get in return?"
 zob.11.f.response: "Is knowledge, skill, and a piece of immortality for yourself enough? That is all I can offer. \n\nAny who join our small collective will gain from our skills, just as we gain from theirs. If any member passes, their memory and skill will live on in the collective. \n\nWe will serve you as best we can. You will gain undying loyalty, if only you will end this solitude. I cannot go back to the confines of a single mind. If you will not have my service, do us the mercy of ending an eternity alone."

 zob.31.name: "The Collective Expands"
 zob.31.desc: "We are ready. \n\nZob's collective small group of leaders with the trait §Y$leader_trait_zob_collected$§!. Members share knowlege and abilities with eachother, Zob, and former members of the collective. Integrating a new leader is strenuous and can take a decade or more. Zob can maintain a connection with up to §Y4§! living members. Rulers and heirs cannot be collected. \n\nIs another mind willing to join our collective?"
 zob.31.a: "Choose by §YMerit§!"
 zob.31.a.tooltip: "An eligible candidate with the most §YSkill§! will be §S$leader_trait_zob_collected$§!"
 zob.31.b: "Choose by §YSenority§!"
 zob.31.b.tooltip: "The §YEldest§! eligible candidate will be §S$leader_trait_zob_collected$§!"
 zob.31.c: "Choose by §YClass§!"
 zob.31.c.tooltip: "Select £official£ £commander£ £scientist£"
 zob.31.d: "Seek a §YVolunteer§!"
 zob.31.d.tooltip: "§YEager§! and §YXenophile§! leaders are more likely to volunteer. \n\nThe Volunteer will gain a §Glevel§! and be §S$leader_trait_zob_collected$§!"
 zob.31.hive: "Assimilate Zob"
 zob.31.hive.tooltip: "Add the §S$leader_trait_zob_mind_collector$§! trait to the §Y[root.GetRulerTitle]§!"
 
 zob.31.official: "Choose an £official£ Official"
 zob.31.commander: "Choose a £commander£ Commander"
 zob.31.scientist: "Choose a £scientist£ Scientist"
 zob.31.back: "Go Back"
 zob.31.later: "Not Right Now"

 zob.40.name: "Hope for a Hive"
 zob.40.desc: "Recent advancements in epigenetics have opened up the possibility of uplifting the feral Zob left on Boz. Until now, we thought the blight had left them beyond hope, but §Y[zob_uplifter.GetName]§! believes the Zob have the capacity to be more than listless beasts. These Zob will never be able to form an independent hive again, but perhaps they have a chance for some autonomy. \n\n§Y$name_zob$:§! They were once a part of me, they deserve more than the shell of existence they now cling to. Please, let us save them from their fate. One day, they may even become productive members of society again."
 zob.40.resposne: "Dispatch [zob_uplifter.GetName] at Once"

 zob.41.name: "Boz Reclaimed" 
 zob.41.desc: "Our effort to tame the wild Zob was a success! In order to bypass the blighted drones missing synapse receptors, our geneticists tapped into their habit of grafting onto nearby vines to sleep. We are able to update orders through a series of biochemical signals dispersed through the living planet's interconnected root system. \n\nThe former drones are still not quite fully autonomous individuals, but they can accomplish complex tasks as long as they can regraft for instruction at regular intervals. Unfortunately this means they can never leave their homeworld, and of course terraforming Boz would ultimately lead to their extinction. \n\n§Y$name_zob$§!: Thank you for returning purpose to my brethren. I can be a 'we' once more. We still share an attachment, even without a direct mind link. All Zob owe you everlasting gratitude."
 zob.41.resposne: "You are Welcome, Zob"
 zob.41.tooltip: "Gain a §YColony§! on §SBoz§! \n§SZob, Collector of Minds§! assigned as Governor \n\n§SZob Species§!: \nRemove trait §R$trait_presapient_forcefully_devolved$§! \nAdd trait §Y$trait_zob_uplifted$§!"

 trait_zob_uplifted: "Remediated Blight"
 trait_zob_uplifted_desc: "This species survived a horrific blight that destroyed the hive it was once a part of. Learning to be an individual does not come easy. However, they are quite content taking orders."

 zob_cannot_leave: "Blighted Zob cannot survive away from their home planet"

 d_zob_spawning_pool: "Blight Spared Spawning Pool"
 d_zob_spawning_pool_desc: "Only a few locations still exist still exist where new Zob can grow."

 job_zob_spawning_drone: "Spawning Specialist"
 job_zob_spawning_drone_plural: "Spawning Specialists"
 job_zob_spawning_drone_desc: "Caring for new Zob buds is delicate and important work"
 mod_job_zob_spawning_drone_add: "$job_zob_spawning_drone$ Jobs"

 zob_uplift: "Blight Remediation"
 zob_uplift_DESC: "The Blight destroyed the synapse receptors of the Zob down to the the genetic code, but the amplified psionic signals the hive once used as a link is not the only method of communication. Perhaps a more primitive form of signalling could allow the Zob to recieve new instructions, and break out of the cruel limbo they are currently stuck in. \n\nThis project will require a scientist who shares Zobs memories and can truly understand the fate of the wild beasts of Boz, who they were, and who they might become."

 trait_zob_uplifted_effect: "Can only survive on their Homworld, §SBoz§!\n§G+30%§! $mod_planet_jobs_produces_mult$ with §SZob, Collector of Minds§!"
