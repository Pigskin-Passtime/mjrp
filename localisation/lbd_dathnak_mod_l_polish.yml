 job_lbd_dathnak_scholar_calculator_effect_desc:0 "£job_lbd_dathnak_scholar_calculator£ $job_lbd_dathnak_scholar_calculator_plural$ turn £exotic_gases£ §Y$exotic_gases$§! into £physics£ £society£ £engineering£ §YResearch Points§! for new technologies, spawn £defense_army£ §YDefense Armies§! and increase £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!"
 district_lbd_dathnak_industrial:0 "Effluvium Militarized Industrial District"
 district_lbd_dathnak_industrial_desc:0 "A militarized district that focuses on producing alloys and putting idle hands to work, most of war is waiting, and this is where the Dathnak soldiers and reserves get put to work so they can build up muscle- wait do the Dathnak even have muscles? How does that even work-"
 district_lbd_dathnak_industrial_plural:0 "Effluvium Militarized Industrial Districts"
 job_lbd_dathnak_soldier_effect_desc:0 "£job_lbd_dathnak_soldier£ $job_lbd_dathnak_soldier_plural$ produce a small amount of £consumer_goods£ §Y$consumer_goods$§!, minorly increase £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§! and spawn £defense_army£ §YDefense Armies§!"
 job_lbd_dathnak_soldier_drone_effect_desc:0 "£job_lbd_dathnak_soldier_drone£ $job_lbd_dathnak_soldier_drone_plural$ increase £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§! and spawn £defense_army£ §YDefense Armies§!"
 district_lbd_dathnak_gas_gatherers:0 "Effluvium Effluvium District"
 district_lbd_dathnak_gas_gatherers_desc:0 "A district that focuses on gathering exotic gases, apparently this is a semi-holy thing for them or something (We worry that actually learning about their religion might enable it to spread) and thus helps unite and bind their people together. Not only does the amount of gas gathered increase with the number of Dathnak on the planet, due to the nature of the Dathnak, the increased concentration of noxious gases in the air decreases the rate that anything that isn't a Dathnak reproduces. Also the name gives me a headache"
 district_lbd_dathnak_gas_gatherers_plural:0 "Effluvium Effluvium Districts"
 civic_lbd_dathnak_generic_civic_one:0 "Baldarak"
 civic_lbd_dathnak_generic_civic_one_desc:0 "Really? I could have sworn... apologies, but it can be difficult to tell you solids apart. I'm afraid it's too late to change the name now. It has a nice ring to it, though, don't you think?"
 origin_lbd_dathnak_crisis_initial:0 "Noxious Fumes"
 origin_lbd_dathnak_crisis_initial_desc:0 "Sometimes likened to the unholy union between a wasp and a nails on the chalkboard, the Dathnak are the most annoying beings to ever waft into the galaxy. At times violently annoying at other times peacefully annoying, they have somehow risen to become a spacefaring race... Perhaps this is a signal that it is time to destroy the galactic core before it is too late"
 civic_lbd_dathnak_generic_civic_one_effect:0 "REPLACE_ME"
 civic_lbd_dathnak_authoritarian_regime:0 "Dathnak"
 civic_lbd_dathnak_authoritarian_regime_desc:0 "An authoritarian regime created by a well meaning fool, look at what has been unleashed upon the galaxy! LOOK!"
 civic_lbd_dathnak_authoritarian_regime_effect:0 "REPLACE_ME"
 civic_lbd_dathnak_revolution_is_on:0 "Dathnak"
 civic_lbd_dathnak_revolution_is_on_desc:0 "Freed from their shackles the Dathnak cry out into the night, no longer shall their breathren be laid low! No longer shall the working class be ground beneath the foot of others! Nay they say! NAY!"
 civic_lbd_dathnak_revolution_is_on_effect:0 "REPLACE_ME"
 civic_lbd_dathnak_helped_relocate_once:0 "Dathnak"
 civic_lbd_dathnak_helped_relocate_once_desc:0 "An outsider helped them escape immediate death by radiation, just so the outsiders could live long enough to regret it"
 civic_lbd_dathnak_helped_relocate_once_effect:0 "REPLACE_ME"
 civic_lbd_dathnak_helped_relocate_twice:0 "Dathnak"
 civic_lbd_dathnak_helped_relocate_twice_desc:0 "Relocated not once but twice! Their rebellion was not completed before they rose to the stars, so who knows what else might occur in the background?"
 civic_lbd_dathnak_helped_relocate_twice_effect:0 "REPLACE_ME"
