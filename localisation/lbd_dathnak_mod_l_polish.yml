 pc_lbd_dathnak_gas_giant:0 "Effluvium Giant"
 building_lbd_dathnak_refinery_motes:0 "Effluvium Mote Refiner"
 building_lbd_dathnak_refinery_motes_desc:0 "A structure in which using a small amount of energy we can convert volatile motes into exotic gases, which is surprising considering you would expect us to be more volatile after being exposed to something made by the Dathnak"
 tech_lbd_dathnak_exotic_gas_refining:0 "Effluvium Coalescence"
 tech_lbd_dathnak_exotic_gas_refining_desc:0 "Our researchers will unlock the hidden powers of gas that allowed the Dathnak to exist and utilize it for industrial purposes... unfortunately no Dathnak were harmed in the researching of this technology"
 job_lbd_dathnak_gas_refiner_motes_effect_desc:0 "£job_lbd_dathnak_gas_refiner_motes£ $job_lbd_dathnak_gas_refiner_motes_plural$ turn £volatile_motes£ §Y$volatile_motes$§! and £energy£ §Y$energy$§!  into £exotic_gases£ §Y$exotic_gases$§!"
 job_lbd_dathnak_gas_refiner_drone_motes_effect_desc:0 "£job_lbd_dathnak_gas_refiner_drone_motes£ $job_lbd_dathnak_gas_refiner_drone_motes_plural$ turn £volatile_motes£ §Y$volatile_motes$§! and £energy£ §Y$energy$§!  into £exotic_gases£ §Y$exotic_gases$§!"
 building_lbd_dathnak_refinery_crystals:0 "Effluvium Crystal Refiner"
 building_lbd_dathnak_refinery_crystals_desc:0 "A structure in which using a small amount of energy we can convert rare crystals into exotic gases, much like how the Dathnak convert sane people into gibbering maniacs"
 job_lbd_dathnak_gas_refiner_crystals_effect_desc:0 "£job_lbd_dathnak_gas_refiner_crystals£ $job_lbd_dathnak_gas_refiner_crystals_plural$ turn £rare_crystals£ §Y$rare_crystals$§! and £energy£ §Y$energy$§!  into £exotic_gases£ §Y$exotic_gases$§!"
 job_lbd_dathnak_gas_refiner_drone_crystals_effect_desc:0 "£job_lbd_dathnak_gas_refiner_drone_crystals£ $job_lbd_dathnak_gas_refiner_drone_crystals_plural$ turn £rare_crystals£ §Y$rare_crystals$§! and £energy£ §Y$energy$§!  into £exotic_gases£ §Y$exotic_gases$§!"
 building_lbd_dathnak_mineral_processing_plant:0 "Effluvium Concretization Plant"
 building_lbd_dathnak_mineral_processing_plant_desc:0 "A plant for stabilizing and somehow materializing exotic gases in such a way that they become usable for basic construction, yet lose many of their previous properties... unfortunately one of those properties in this case is not being super annoying"
 job_lbd_dathnak_gas_mineral_transmuter_effect_desc:0 "£job_lbd_dathnak_gas_mineral_transmuter£ $job_lbd_dathnak_gas_mineral_transmuter$ turn £exotic_gases£ §Y$exotic_gases$§! and £consumer_goods£ §Y$consumer_goods$§!  into £minerals£ §Y$minerals$§!"
 building_lbd_dathnak_energy_grid:0 "Effluvium Energistics Grid"
 building_lbd_dathnak_energy_grid_desc:0 "A structure built to utilize exotic gases to enhance power production, unfortunately it seems that motivating people through a promise of a world without the Dathnak wasn't enough"
 tech_lbd_dathnak_power_hub_1:0 "Effluvium Energistics"
 tech_lbd_dathnak_power_hub_1_desc:0 "Our researchers believe that by utilizing exotic gases we can enhance our ability to generate energy on a planet. Hopefully that energy isn't created through sheer annoyance"
 building_lbd_dathnak_energy_nexus:0 "Effluvium Energistics Nexus"
 building_lbd_dathnak_energy_nexus_desc:0 "An enhancement to the Effluvium Energistics Grid, this structure will greatly enhance our energy output on a planet in return for consuming exotic gases, we like to pretend the gases are Dathnaks but sadly they aren't... usually"
 job_lbd_dathnak_gas_technician_drone_effect_desc:0 "£job_lbd_dathnak_gas_technician_drone£ $job_lbd_dathnak_gas_technician_drone_plural$ turn £exotic_gases£ §Y$exotic_gases$§! into £energy£ §Y$energy$§! and increase £mod_pop_growth_speed£ §Y$MOD_POP_GROWTH_SPEED$§! for Dathnak pops"
 job_lbd_dathnak_gas_technician_effect_desc:0 "£job_lbd_dathnak_gas_technician£ $job_lbd_dathnak_gas_technician_plural$ turn £exotic_gases£ §Y$exotic_gases$§! into £energy£ §Y$energy$§! and increase £mod_pop_growth_speed£ §Y$MOD_POP_GROWTH_SPEED$§! for Dathnak pops"
 tech_lbd_dathnak_power_hub_2:0 "Enhanced Effluvium Energistics"
 tech_lbd_dathnak_power_hub_2_desc:0 "With the power of exotic gases, each planet can be made to produce energy comparable to a small star, not unlike the star we wish we could launch the entirety of the Dathnak race into"
 building_lbd_dathnak_foundry_1:0 "Effluvium Amalgamation Foundry"
 building_lbd_dathnak_foundry_1_desc:0 "Exotic gases can be utilized to control temperatures allowing for more efficient and faster smelting of alloys, if we were as annoying as the Dathnak we might be tempted to make a terrible pun about ''he who smelt it''"
 building_lbd_dathnak_foundry_2:0 "Effluvium Amalgamation Plant"
 building_lbd_dathnak_foundry_2_desc:0 "Exotic gases can be additionally utilized as reactants to enhance alloy production and efficiency, and more alloys means more dead Dathnak"
 tech_lbd_dathnak_basic_industry:0 "Effluvium Calefaction Exploitation"
 tech_lbd_dathnak_basic_industry_desc:0 "Exotic gases have unique properties regarding temperature that we might be able to exploit, whether this means we can use a match to blow up a Dathnak or not remains to be seen"
 job_lbd_dathnak_foundry_effect_desc:0 "£job_lbd_dathnak_foundry£ $job_lbd_dathnak_foundry_plural$ turn £exotic_gases£ §Y$exotic_gases$§! and £minerals£ §Y$minerals$§!  into £alloys£ §Y$alloys$§!"
 job_lbd_dathnak_catalytic_technician_effect_desc:0 "£job_lbd_dathnak_catalytic_technician£ $job_lbd_dathnak_catalytic_technician_plural$ turn £exotic_gases£ §Y$exotic_gases$§! and £food£ §Y$food$§!  into £alloys£ §Y$alloys$§!"
 job_lbd_dathnak_foundry_drone_effect_desc:0 "£job_lbd_dathnak_foundry_drone£ $job_lbd_dathnak_foundry_drone_plural$ turn £exotic_gases£ §Y$exotic_gases$§! and £minerals£ §Y$minerals$§!  into £alloys£ §Y$alloys$§!"
 job_lbd_dathnak_fabricator_effect_desc:0 "£job_lbd_dathnak_fabricator£ $job_lbd_dathnak_fabricator_plural$ turn £exotic_gases£ §Y$exotic_gases$§! and £minerals£ §Y$minerals$§!  into £alloys£ §Y$alloys$§!"
 job_lbd_dathnak_catalytic_drone_effect_desc:0 "£job_lbd_dathnak_catalytic_drone£ $job_lbd_dathnak_catalytic_drone_plural$ turn £exotic_gases£ §Y$exotic_gases$§! and £food£ §Y$food$§!  into £alloys£ §Y$alloys$§!"
 building_lbd_dathnak_foundry_3:0 "Effluvium Amalgamation Compound"
 building_lbd_dathnak_foundry_3_desc:0 "With the power of exotic gases this large structure greatly expands upon both the Effluvium Amalgamation Foundry and the Effluvium Amalgamation Plant, while entirely inaccurate (usually) it keeps me warm inside to imagine this is done via forced Dathnak labor"
 tech_lbd_dathnak_alloys_1:0 "Effluvium Catalyst Exploitation"
 tech_lbd_dathnak_alloys_1_desc:0 "Exotic gases can be used as a catalyst in the alloying process, allowing us to greatly improve our efficiency and production, and thus our deduction of the Dathnak from life"
 tech_lbd_dathnak_alloys_2:0 "Effluvium Amalgamation Industrialization"
 tech_lbd_dathnak_alloys_2_desc:0 "With new processes we can industrialize and optimize our previous exotic gases use for alloying metals, much like the medals we will undoubtedly earn from all the dead Dathnak"
 building_lbd_dathnak_growth_inducer:0 "Effluvium Propagation Center"
 building_lbd_dathnak_growth_inducer_desc:0 "Certain exotic gases can be used to enhance growth and learning rates in both mechanical and biological beings... this does of course run the risk of people ending up like the Dathnak but we've been assured the chance is negligible"
 tech_lbd_dathnak_exotic_gas_growth_induction:0 "Effluvium Erudition Acquisition"
 tech_lbd_dathnak_exotic_gas_growth_induction_desc:0 "It seems exotic gases can be used stimulate intellect in ways that may allow developing brains (mechanical or biological) as well as biological bodies to develop more quickly and thus be ready to work and propagate more quickly, we've been assured by the educators that this is in no way because they're torturing the students who get wrong answers by exposing them to the Dathnak"
 job_lbd_dathnak_gas_growth_maker_effect_desc:0 "£job_lbd_dathnak_gas_growth_maker£ $job_lbd_dathnak_gas_growth_maker_plural$ turn £exotic_gases£ §Y$exotic_gases$§! and £consumer_goods£ §Y$consumer_goods$§! into £mod_trade_value_add£ §Y$TRADE_VALUE$§!, £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!, £mod_pop_growth_speed£ §Y$MOD_POP_GROWTH_SPEED$§!, £mod_planet_pop_assembly_mult£ §Y$MOD_PLANET_POP_ASSEMBLY_MULT$§! and £mod_planet_pop_assembly_mult£ §Y$MOD_PLANET_POP_ASSEMBLY_ORGANIC_MULT$§!"
 job_lbd_dathnak_gas_growth_maker_drone_effect_desc:0 "£job_lbd_dathnak_gas_growth_maker_drone£ $job_lbd_dathnak_gas_growth_maker_drone_plural$ turn £exotic_gases£ §Y$exotic_gases$§! into £mod_planet_amenities_no_happiness_add£ §Y$PLANET_AMENITIES_TITLE$§!, £mod_pop_growth_speed£ §Y$MOD_POP_GROWTH_SPEED$§!, £mod_planet_pop_assembly_mult£ §Y$MOD_PLANET_POP_ASSEMBLY_MULT$§! and £mod_planet_pop_assembly_mult£ §Y$MOD_PLANET_POP_ASSEMBLY_ORGANIC_MULT$§!"
 casus_belli_cb_lbd_dathnak_xenon:0 "Wrath of Xenon"
 casus_belli_cb_lbd_dathnak_original:0 "Dangerous Dathnak"
 LBD_DATHNAK_GAMMA_LASER:0 "Effluvium Ray"
 LBD_DATHNAK_GAMMA_LASER_DESC:0 "A basic ray that uses the power of exotic gases to enhance destruction and penetration, also strangely annoying"
 LBD_DATHNAK_TITAN_LASER:0 "Effluvium Beam"
 LBD_DATHNAK_TITAN_LASER_DESC:0 "A massive beam that uses the power of exotic gases to enhance destruction and penetration, also strangely annoying"
 LBD_DATHNAK_PERDITION_BEAM:0 "Effluvium Beam"
 LBD_DATHNAK_PERDITION_BEAM_DESC:0 "A massive beam that uses the power of exotic gases to enhance destruction and penetration, also strangely annoying"
 LBD_DATHNAK_ENERGY_LANCE_2:0 "Effluvium Lance"
 LBD_DATHNAK_ENERGY_LANCE_2_DESC:0 "A huge lance that uses the power of exotic gases to enhance destruction and penetration, also strangely annoying"
 LBD_DATHNAK_ENERGY_TORPEDO_2:0 "Effluvium Torpedo"
 LBD_DATHNAK_ENERGY_TORPEDO_2_DESC:0 "Unlike the Dathnak this torpedo won't follow you to the ends of the galaxy, however it is still quite annoying if you get hit"
 LBD_DATHNAK_BARRIER:0 "Effluvium Barrier"
 LBD_DATHNAK_BARRIER_DESC:0 "So annoying that your weapons won't even want to hit the target"
 LBD_DATHNAK_CRYSTAL_ARMOR_2:0 "Effluvium Hull"
 LBD_DATHNAK_CRYSTAL_ARMOR_2_DESC:0 "You'll enhance your hull using the power of the Dathnak... but at what cost?"
 LBD_DATHNAK_DRAGON_ARMOR:0 "Effluvium Armor"
 LBD_DATHNAK_DRAGON_ARMOR_DESC:0 "I wish I could tell you this was forged from the dead bodies of the Dathnak, but really it just uses exotic gases... how does that work? Do I look like a scientist to you?!"
 LBD_DATHNAK_AUXILLARY_TECH_DEPOT:0 "Dathnak Tech Fragments"
 LBD_DATHNAK_AUXILLARY_TECH_DEPOT_DESC:0 "Fragments of Dathnak tech that our scientists can study to learn about their tech... if they can bare the smell!"
 LBD_DATHNAK_AUXILLARY_TECH_DEPOT_CORV:0 "Small $LBD_DATHNAK_AUXILLARY_TECH_DEPOT$"
 tech_lbd_dathnak_colonization:0 "Effluvium Tolerance Theory"
 tech_lbd_dathnak_colonization_desc:0 "Someone wanted to codename this project ''How to Stand Living on a Dathnak World Without Going Insane For Dummies'' but it was both too long and too accurate to be a good codename"
 LBD_DATHNAK_AUXILLARY_TECH_DEPOT_DESTROY:0 "Medium $LBD_DATHNAK_AUXILLARY_TECH_DEPOT$"
 tech_lbd_dathnak_shields:0 "Effluvium Shield Theory"
 tech_lbd_dathnak_shields_desc:0 "Shields made of exotic gases, I personally find it helps me sleep at night to imagine a captive Dathnak in every one of these screaming for mercy, but my psychiatrist tells me that's because I lack empathy"
 tech_lbd_dathnak_small_lasers:0 "Small Effluvium Ray Theory"
 tech_lbd_dathnak_small_lasers_desc:0 "You know, if we knew how this worked well enough to give it a proper description, we wouldn't need to research it in the first place"
 LBD_DATHNAK_AUXILLARY_TECH_DEPOT_CRUIS:0 "Large $LBD_DATHNAK_AUXILLARY_TECH_DEPOT$"
 tech_lbd_dathnak_armor:0 "Effluvium Armor Theory"
 tech_lbd_dathnak_armor_desc:0 "In theory we could use exotic gases to greatly enhance the armor of our ships, of course in theory I could also be a psychic Tiyanki, so let's hope this actually works"
 LBD_DATHNAK_AUXILLARY_TECH_DEPOT_BATTLESHIP:0 "Huge $LBD_DATHNAK_AUXILLARY_TECH_DEPOT$"
 tech_lbd_dathnak_hull:0 "Effluvium Hull Theory"
 tech_lbd_dathnak_hull_desc:0 "Using exotic gases to construct our hulls could greatly improve them, or drive us completely insane, but either way we'll get to kill Dathnak"
 tech_lbd_dathnak_medium_lasers:0 "Medium Effluvium Ray Theory"
 tech_lbd_dathnak_medium_lasers_desc:0 "Like the Small Effluvium Ray Theory but slightly larger, according to the Dathnak these would be one tech if you had bought the paid DLC beginner starting bundle"
 LBD_DATHNAK_AUXILLARY_TECH_DEPOT_2:0 "Small Complex $LBD_DATHNAK_AUXILLARY_TECH_DEPOT$"
 LBD_DATHNAK_AUXILLARY_TECH_DEPOT_2_DESTROY:0 "Medium Complex $LBD_DATHNAK_AUXILLARY_TECH_DEPOT$"
 LBD_DATHNAK_AUXILLARY_TECH_DEPOT_2_CRUISER:0 "Large Complex $LBD_DATHNAK_AUXILLARY_TECH_DEPOT$"
 tech_lbd_dathnak_large_lasers:0 "Large Effluvium Ray Theory"
 tech_lbd_dathnak_large_lasers_desc:0 "We're beginning to suspect that the Dathnak somehow intentionally split up these technologies as some kind of brilliant psychological warfare maneuver"
 tech_lbd_dathnak_energy_lance:0 "Extra Large Effluvium Lance Theory"
 tech_lbd_dathnak_energy_lance_desc:0 "Ok this is just getting silly, I mean at least give it a decent name! Changing ray to lance does not make this unique!"
 LBD_DATHNAK_AUXILLARY_TECH_DEPOT_2_BATTLE:0 "Huge Complex $LBD_DATHNAK_AUXILLARY_TECH_DEPOT$"
 tech_lbd_dathnak_titan_titanic_lasers:0 "Titanic Effluvium Beam Theory Part 1"
 tech_lbd_dathnak_titan_titanic_lasers_desc:0 "Part ONE?! and it only applies to Titans unless you have Part 2?! Who even plays this nonsense! I'm calling my space lawyer"
 tech_lbd_dathnak_titanic_lasers:0 "Titanic Effluvium Beam Theory Part 2"
 tech_lbd_dathnak_titanic_lasers_desc:0 "I swear if there is a part 3 or a ''Colossal Effluvium Wave Theory'' or something I'm going to actually hurt somebody"
