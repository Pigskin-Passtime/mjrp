 lbd_story.106.title:0 "A Noble Gas Reaction"
 lbd_story.106.authoritarian:0 "For several minutes the connection goes quiet, then the Dathnak speaks once more\n\n''Well I suppose as you've had more time to get used to interstellar travel that might make sense. Sure Baldarak, we'll be your subject...for now!''"
 lbd_story.106.rebel:0 "For several minutes the connection goes quiet, then the Dathnak speaks once more\n\n''Well I suppose as you've had more time to get used to interstellar travel that might make sense. Sure Comrade Baldarak, we'll be your subject...for now!''"
 lbd_story.106.ok:0 "Ok"
 lbd_story.107.title:0 "A Noble Gas Reaction"
 lbd_story.107.authoritarian:0 "The voice is filled with glee\n\n''Excellent! Now we pronounce you and your people honorary Dathnak! Together we shall destroy the solids once and for all!''"
 lbd_story.107.rebel:0 "The voice speaks once more with enthusiasm\n\n''Glorious, Comrade Baldarak! Now we pronounce you and your people honorary Dathnak! Together we shall liberate the solids from their existence once and for all!''"
 lbd_story.107.ok:0 "We hear and obey mighty Overlord!"
 lbd_story.108.title:0 "A Noble Gas Reaction"
 lbd_story.108.authoritarian:0 "Unfortunately you were too late, Baldarak! We've already agreed to work with another solid instead!"
 lbd_story.108.rebel:0 "Sadly Comrade it seems it is not to be! We've already agreed to work with another solid instead!"
 lbd_story.108.ok:0 "Unfortunate"
 lbd_dathnak_message_blocked_desc:0 "The Dathnak attempted to annoy us by forcing open a communication channel, but our advanced encryption technology allowed us to foil their plans!"
 lbd_story.131.title:0 "Effluvium Proliferation"
 lbd_story.131.authoritarian:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''Hey there Baldarak! We're calling to inform you about a new and potentially groundbreaking technology we've discovered! \n\nThat's right! With this new tech we will totally revolutionize the industry and leave a mark on history itself! But we wanted to consult you on what you thought the long term socio-economic impacts would be as you've had much mor experience with new technologies!\n\nThat being said we just decided to move forward with the tech so never mind Baldarak!\n\nNow we go forth to revolutionize the great sport of Space Yodeling!''\n\nThe message terminates"
 lbd_story.131.rebel:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''Greetings Comrade Baldarak! We're calling to inform you about a new and potentially groundbreaking technology we've discovered! \n\nThat's right! With this new tech we will totally revolutionize the industry and leave a mark on history itself! But we wanted to consult you on what you thought the long term socio-economic impacts would be as you've had much mor experience with new technologies!\n\nThat being said we just decided to move forward with the tech so never mind Comrade Baldarak!\n\nNow we go forth to revolutionize the great sport of Space Yodeling!''\n\nThe message terminates"
 lbd_story.131.ok:0 "Ok"
 lbd_story.132.title:0 "Effluvium Proliferation"
 lbd_story.132.authoritarian:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''Hey Baldarak long time no see! Just calling to let you know about another attempted rebellion by remnants of the old rebel faction! The battle was long fought and hard won but we've triumphed once again, in honor of those who died we've decided to rename one of our planets!\n\nHope that doesn't get too confusing for you Baldarak!''\n\nThe connection terminates"
 lbd_story.132.rebel:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''Greetings Comrade Baldarak long time no see! Just calling to let you know about another attempted rebellion by remnants of the old authoritarian government! The battle was long fought and hard won but we've triumphed once again, in honor of those who died we've decided to rename one of our planets!\n\nHope that doesn't get too confusing for you Comrade Baldarak!''\n\nThe connection terminates"
 lbd_story.132.ok:0 "Ok"
 lbd_story.133.title:0 "Effluvium Proliferation"
 lbd_story.133.authoritarian:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''Hey Baldarak! We've had a very exciting discovery!\n\nWe've identified a new star outside the galaxy! We've decided to name that star 'Baldarak' in honor of you! \n\nConfusing? Don't worry having a few stars with the same name shouldn't be a problem!''\n\nThe connection terminates"
 lbd_story.133.rebel:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''Greetings Comrade Baldarak! We've had a very exciting discovery!\n\nWe've identified a new star outside the galaxy! We've decided to name that star 'Comrade Baldarak' in honor of you! We actually meant to just call it 'Baldarak' but a minor clerical error took place. \n\nConfusing? Don't worry having a few stars with the same name shouldn't be a problem!''\n\nThe connection terminates"
 lbd_story.133.ok:0 "Ok"
 lbd_story.134.title:0 "Effluvium Proliferation"
 lbd_story.134.authoritarian:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''It has been a very eventful time since we last spoke, Baldarak! You won't believe the massive changes we've undergone! In fact the changes are so massive that I'll send them to you via space mail instead!\n\nI know you wouldn't mind paying on delivery so I'll get right on that!''"
 lbd_story.134.rebel:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''It has been a very eventful time since we last spoke, Comrade Baldarak! You won't believe the massive changes we've undergone! In fact the changes are so massive that I'll send them to you via space mail instead!\n\nI know you wouldn't mind paying on delivery so I'll get right on that!''"
 lbd_story.134.ok:0 "Definitely not paying for that"
 lbd_story.135.title:0 "Effluvium Proliferation"
 lbd_story.135.authoritarian:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''Hey there Baldarak! We've decided to commemorate our meeting with this poem one of our people wrote, you may have heard it before... I can't remember if I've read it to you before or not! Personally I think it gets better every time! \n\n'We were on a world full of toxic radiation\nOur leaders on the brink of abdication\nThen Baldarak came swinging in out of the blue\nHere to save me and you\nWe tried to spread to a new world to get better life\nbut then some foolish rebels came and started lots of strife\nGlory to Dathnak!\nGlory to Baldarak!'\n\nSee wasn't that great?''\n\nThe connection suddenly terminates"
 lbd_story.135.rebel:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''Greetings Comrade Baldarak! We've decided to commemorate our meeting with this poem one of our people wrote, you may have heard it before... I can't remember if I've read it to you before or not! Personally I think it gets better every time! \n\n'We were on a world full of toxic radiation\nOur leaders on the brink of abdication\nThen Baldarak came swinging in out of the blue\nHere to save me and you\nOur government was really bad\nBut luckily we had a cool comrade \nGlory to Dathnak!\nGlory to Baldarak!'\n\nSee wasn't that great?''\n\nThe connection suddenly terminates"
 lbd_story.135.ok:0 "Why...just...why?"
 lbd_story.136.title:0 "Effluvium Proliferation"
 lbd_story.136.authoritarian:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''Baldarak we have an urgent message for you!\n\nWe've spotted giant lifeforms on a planet near you that live hundreds of years, can live almost entirely off of sunlight and are capable of destroying entire buildings and that are constantly spreading!\n\nThese insidious beings trick other defenseless solids into eating their young to deliver their means of procreation allowing them to spread almost anywhere!\n\nStay vigilant Baldarak, we've found a number of similar pockets of these beings before!'' \n\nThe connection suddenly terminates"
 lbd_story.136.rebel:0 "The dreaded voice of a Dathnak suddenly rings out from a forced open communications channel\n\n''Comrade Baldarak we have an urgent message for you!\n\nWe've spotted giant lifeforms on a planet near you that live hundreds of years, can live almost entirely off of sunlight and are capable of destroying entire buildings and that are constantly spreading!\n\nThese insidious beings trick other defenseless solids into eating their young to deliver their means of procreation allowing them to spread almost anywhere!\n\nStay vigilant Comrade Baldarak, we've found a number of similar pockets of these beings before!'' \n\nThe connection suddenly terminates"
 lbd_story.136.ok:0 "You mean... Trees?"
 lbd_story.137.title:0 "Effluvium Proliferation"
