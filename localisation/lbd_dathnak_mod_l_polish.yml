 lbd_story.1.title:0 "Let It Rip"
 lbd_story.1.hive:0 "$lbd_story.1.reg$"
 lbd_story.1.machine:0 "$lbd_story.1.reg$"
 lbd_story.1.reg:0 "Suddenly a communication channel is forced open, and you find yourself being forced to communicate with a Dathnak \n\n''Hey there Baldarak! How have you been? \n\nWe're doing just great over here! After years of requiring you to ferry us around we've decided to send a small expedition of our own into space!\n\nOur previous Dathnak associates are continuing their rule, rooting out dissention and what not so you may hear from them from time to time, but we're going to prove that the Dathnak can be a great galactic force just like you, Baldarak!\n\nWe'll be sure to let everyone we encounter know how incredibly grateful we are to you for giving us this opportunity! All shall know that we never could have done it without you, Baldarak! We should hang out some time and swap intergalactic crusade stories!''"
 lbd_story.1.what_do_you_want:0 "What is it that you want?"
 lbd_story.1.please_no:0 "No... Please no...This can't be happening..."
 lbd_story.1.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.1.screaming:0 "NOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.1.oh_hi:0 "Greetings to you as well"
 lbd_story.2.title:0 "$lbd_story.1.title$"
 lbd_story.2.hive:0 "$lbd_story.2.reg$"
 lbd_story.2.machine:0 "$lbd_story.2.reg$"
 lbd_story.2.reg:0 "Suddenly a communication channel is forced open, and you find yourself being forced to communicate with a Dathnak \n\n''Hey there glorious comrade Baldarak! How have you been? \n\nWe're doing just great over here! After years of requiring you to ferry us around we've decided to send a small expedition of our own into space!\n\nOur previous Dathnak comrades are continuing their efforts back at home, ensuring that prosperity for the working Dathnak is achieved and what not so you may hear from them from time to time, but we're going to prove that the Dathnak can be a great galactic force just like you, Baldarak!\n\nWe'll be sure to let everyone we encounter know how incredibly grateful we are to you for giving us this opportunity! All shall know that we never could have done it without you, Baldarak! \n\nWe should hang out some time and swap intergalactic crusade stories!''"
 lbd_story.2.what_do_you_want:0 "What is it that you want?"
 lbd_story.2.please_no:0 "No... Please no...This can't be happening..."
 lbd_story.2.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.2.screaming:0 "NOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.2.oh_hi:0 "Greetings"
 lbd_story.3.title:0 "$lbd_story.1.title$"
 lbd_story.3.hive:0 "$lbd_story.3.reg$"
 lbd_story.3.machine:0 "$lbd_story.3.reg$"
 lbd_story.3.reg:0 "Suddenly a communication channel is forced open, and you find yourself being forced to communicate with a Dathnak \n\n''Oh hi Baldarak! Long time no see!\n\nThanks for helping us get through a close shave back there with transportation! Due to that some of us have realized how important it is to have our own transportation, so we've split off from the rest of the Dathnak to form our own space empire! Isn't this so exciting?\n\nWe never could have done it without you Baldarak and we'll be sure to let everyone else know it! You may still hear from time to time from the main Dathnak group since there have been some uh, political differences, but we know you'll be extra kind to them because you're just the best, Baldarak! \n\nMeanwhile we're going to be doing some building up of our own!''"
 lbd_story.3.what_do_you_want:0 "$lbd_story.1.what_do_you_want$"
 lbd_story.3.please_no:0 "$lbd_story.1.please_no$"
 lbd_story.3.exterminate:0 "$lbd_story.1.exterminate$"
 lbd_story.3.screaming:0 "NOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.3.oh_hi:0 "$lbd_story.1.oh_hi$"
 lbd_story.4.title:0 "$lbd_story.1.title$"
 lbd_story.4.hive:0 "$lbd_story.4.reg$"
 lbd_story.4.machine:0 "$lbd_story.4.reg$"
 lbd_story.4.reg:0 "Suddenly a communication channel is forced open, and you find yourself facing what appears to be an empty room on the other side. A strange indecribable voice filters out, as if there is some kind of invisible or perhaps gaseous being on the other side.\n\n''Hello? Does this thing work?\n\nAh looks like we got a hold of you! Hey there! You must be the one called Baldarak that our ancestors mentioned!\n\nWe're from the Dathnak, a small political splinter that broke off a bit back and have been growing ever since! Everything you've done to harm our people will be repaid a million fold!\n\nPreviously our planet was in dire straits and we attempted to reach out to you for help, but had difficulty getting in touch, luckily we managed to escape with a small portion of our population and rebuild, but we almost all died! \n\nVengeance will be had and the universe will be secured for gaseous lifeforms once and for all!\n\nThere are likely other pockets of Dathnak species out there that we shall soon find and liberate to prove the superiority of gas-based lifeforms once and for all!''"
 lbd_story.4.what_do_you_want:0 "$lbd_story.1.what_do_you_want$"
 lbd_story.4.please_no:0 "$lbd_story.1.please_no$"
 lbd_story.4.exterminate:0 "$lbd_story.1.exterminate$"
 lbd_story.4.screaming:0 "NOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.4.oh_hi:0 "Baldarak? What?"
 lbd_story.5.title:0 "$lbd_story.1.title$"
 lbd_story.5.authoritarian:0 "''You solids are always so amusing! Don't worry Baldarak, we've become a pinnacle of order and law that will spread to the stars themselves! Soon all shall know the truth of the Dathnak!\n\nIsn't that great? Of course if you're feeling inferior or anything we'd be glad to have you join us, maybe as a subject or something down the line once we finish establishing ourselves!''"
 lbd_story.5.rebel:0 "''Oh what a fun way to greet us!\n\nThanks to your help with our glorious revolution, we've achieved a society that is rapidly approaching the ideal empire! Soon our comrades shall know truth! And we shall spread that truth to the stars themselves! Feel free to join us if you ever feel like becoming our subject or anything once we've finished establishing ourselves Baldarak! We'd be glad to help you out!''"
 lbd_story.5.reloc_twice:0 "''Oh you solids have the weirdest ways of saying thank you! No problem Baldarak! We're just glad to know that you're ok! \n\nShame we had to set out before the big revolution, or else maybe our ties could have been even closer! \n\nRegardless, for now we've decided to work on improving our new tiny empire so don't worry Baldarak, we'll keep in touch!''"
 lbd_story.5.reloc_once:0 "''Oh no please, you don't have to thank us Baldarak! We're glad to help you out! Just give us a few years and we'll be conquering the stars! I wish we could have seen that second planet though, boy would that have been fun! You're not bad for a solid though Baldarak, we'll be sure to let others know!''"
 lbd_story.5.reloc_none:0 "'Oh no don't beg for forgiveness NOW Baldarak, it is far too late for that, you thought we wouldn't notice if you ignored our signal? You thought you could commit genocide and get away with it? Some of us may still be down there waiting for help! If they haven't already perished... but you will get no help from any other, Baldarak! Their deaths are on your hands...and as soon as we complete our buildup the galaxy shall know the might of the Baldarak!'' \n\nManiacal laughter ensues"
 lbd_story.5.no_encounter:0 "''Oh no don't beg for forgiveness NOW Baldarak, it is far too late for that, we hope you help any other Dathnak you might encounter, but from us you will get no mercy, it is only a matter of time until we grow to our true potential, and then we shall be unstoppable!\n\nPray to your foolish solid gods, Baldarak. Pray and wait for your inevitable demise!''"
 lbd_story.5.ya_sure:0 "Ya sure"
 lbd_story.5.we_will_find_you:0 "We will find you, and we will hurt you"
 lbd_story.5.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.5.screaming:0 "-OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.5.car_insurance:0 "I'm calling about your extended warranty on your car insurance-"
 lbd_story.6.title:0 "$lbd_story.1.title$"
 lbd_story.6.authoritarian:0 "''No need to be embarassed about thanking us Baldarak! We're just glad we'll have the chance to enrich your culture much as you've enriched ours! \n\nWe look forward to bringing an era of order and prosperity to solids throughout the galaxy! We've also decided to erect a statue in your honor made of pure methane emissions! The highest honor!\n\nTake care Baldarak!''"
 lbd_story.6.rebel:0 "''No need to be embarassed about thanking us Comrade Baldarak! We're just glad we'll have the chance to enrich your culture much as you've enriched ours! \n\nWe look forward to liberating the perceptions of solids throughout the galaxy! We've also decided to erect a statue in your honor made of pure methane emissions! The highest honor!\n\nTake care Comrade Baldarak!''"
 lbd_story.6.reloc_twice:0 "''No worries Baldarak, we understand! You're welcome! Surely someday down the line we'll be able to work together to reach even higher heights! I really hope no unpredictable political upheaval occurs turning us into violent despoiling conquerors happens...but that would be silly! I'm sure it will all be fine!''"
 lbd_story.6.reloc_once:0 "A Dathnak chuckle can be heard \n\n''You're such a joker, Baldarak! Your quaint solid jokes are really quite amusing! Don't worry, we will be the best of friends I just know it! Only after we finish establishing ourselves though! Sure hope no unpredictable political upheaval happens!''"
 lbd_story.6.reloc_none:0 "''But let's not let a little genocide divide us right Baldarak? I'm sure you thought it wasn't a big deal or anything right? Don't worry, we're the forgiving sort I promise you! Perhaps if you prostrate yourself like the filthy solid you are we will forgive you!\n\nJust kidding! Just wait until we finish establishing ourselves and then... then you shall know fear!''"
 lbd_story.6.no_encounter:0 "''You want to know the best part Baldarak? We would have gladly joined you and aided you had you helped us in our quest for existence, but you dared, you dared to mock us!\n\nSoon the galaxy shall know fear, fear unending and uninhibited! We are the inevitable, the shadow of death! Fear the Dathnak, Baldarak! Fear us!''"
 lbd_story.6.ugh:0 "Ugh"
 lbd_story.6.well_then:0 "...Well then"
 lbd_story.6.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.6.screaming:0 "-OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.6.you_too:0 "You too!"
 lbd_story.101.title:0 "A Noble Gas Reaction"
 lbd_story.101.authoritarian:0 "Suddenly a communication channel is forced open, a familiar Dathnak voice says \n\n''Baldarak, we're sending this message to inform you that as of today the Ionic party has taken control of the government!\n\nPreviously the Covalent party had been in control and had pursued a rigorous agenda of prosperity and coexistance with solids, however the Ionic party has decided that true order can only be achieved by strength!\n\nWe may have had our differences at times, Baldarak, but know that the Ionic party is no joke and you'd best step lightly!''"
 lbd_story.101.rebel:0 "Suddenly a communication channel is forced open, a familiar Dathnak voice says \n\n''Comrade Baldarak, as of this glorious day the ideals of the Ionic party have been chosen by the people to guide us moving forward! \n\nThis is unlikely to be a good thing for you Comrade Baldarak! They're not very friendly to solids! You'd best stay on your toes!\n\nThey're investing heavily in our military and it is likely that war is inevitable!''"
 lbd_story.101.reloc_twice:0 "Suddenly a communication channel is forced open, a familiar Dathnak voice says \n\n''Baldarak!\n\nCome in Baladarak!\n\nCan you hear us?\n\nThe Ionic party has just seized control of our government and it seems conflict is right around the corner! Be very careful Baldarak because the Ionic party is no joke and they hate solids! Conflict is right around the corner it seems and they'll stop at nothing to bring it about!''"
 lbd_story.101.reloc_once:0 "Suddenly a communication channel is forced open, a familiar Dathnak voice says \n\n''Baldarak!\n\nCome in Baladarak!\n\nCan you hear us?\n\nThe Ionic party has just seized control of our government and it seems conflict is right around the corner! Be very careful Baldarak because the Ionic party is no joke and they hate solids! Conflict is right around the corner it seems and they'll stop at nothing to bring it about!''"
 lbd_story.101.reloc_none:0 "Suddenly a communication channel is forced open, a familiar Dathnak voice says \n\n''Foolish Baldarak, the time is quickly approaching for you to pay for your crimes! We just wanted to let you filthy solids know so you can stew in existential anguish at the thought of our ferocious hordes!\n\nHope you're lookin forward to it!''"
 lbd_story.101.no_encounter:0 "Suddenly a communication channel is forced open, a familiar Dathnak voice says \n\n''Foolish Baldarak, the time is quickly approaching for you to know the fear of the Dathnak! We just wanted to let you solids know so you can stew in existential anguish at the thought of our ferocious hordes!\n\nHope you're lookin forward to it!''"
 lbd_story.101.you_again:0 "Oh no, you again"
 lbd_story.101.well_stop_you:0 "We will stop you"
 lbd_story.101.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.101.screaming:0 "-OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.101.oh_hey_again:0 "Oh hello"
 lbd_story.102.title:0 "A Noble Gas Reaction"
 lbd_story.102.authoritarian:0 "''Thanks Baldarak! I understand, I really hope you can stop us but I'm afraid there is little hope of you defeating the Ionics! They've discovered new technologies that will likely-\n\n§B*static noises*\n\n...\n\nmoments later a new voice is heard speaking through the transmitter§!\n\nWell HELLO there 'Baldarak'! \n\nThis is the representative of the Ionic party speaking! You solids have proven yourselves to be the antithesis of law and order, and thus must be expunged! You will find that our elite Dathnak forces will be more than a match for your solids, so worry not, your doom approaches.''"
 lbd_story.102.rebel:0 "''Thanks Comrade Baldarak! I understand, I really hope you can stop us but I'm afraid there is little hope of you defeating the Ionics! They've discovered new technologies that will likely-\n\n§B*static noises*\n\n...\n\nmoments later a new voice is heard speaking through the transmitter§!\n\nWell HELLO there 'Comrade Baldarak'! \n\nThis is the representative of the Ionic party speaking! You solids have proven yourselves to be the antithesis of comradery and friendship, and thus must be expunged! You will find that our elite Dathnak freedom fighters will be more than a match for your solids, so worry not, your doom approaches.''"
 lbd_story.102.reloc_twice:0 "''Thanks Baldarak! I understand, I really hope you can stop us but I'm afraid there is little hope of you defeating the Ionics! They've discovered new technologies that will likely-\n\n§B*static noises*\n\n...\n\nmoments later a new voice is heard speaking through the transmitter§!\n\nWell HELLO there 'Baldarak'! \n\nThis is the representative of the Ionic party speaking! You solids have toyed with our people for far too long, and thus must be expunged! You will find that our elite Dathnak forces will be more than a match for your solids, so worry not, your doom approaches.''"
 lbd_story.102.reloc_once:0 "''Thanks Baldarak! I understand, I really hope you can stop us but I'm afraid there is little hope of you defeating the Ionics! They've discovered new technologies that will likely-''\n\nstatic noises\n\n...\n\nmoments later a new voice is heard speaking through the transmitter\n\n''Well HELLO there ''Baldarak''! \n\nThis is the representative of the Ionic party speaking! You solids have toyed with our people for far too long, and thus must be expunged! You will find that our elite Dathnak forces will be more than a match for your solids, so worry not, your doom approaches.''"
 lbd_story.102.reloc_none:0 "''Filthy Solid Baldarak, you still dare to entertain notions that you might be able to challenge us?!\n\nYou will be crushed beneath our mercury vapor fists! There is no hope for you, filthy solid! \n\nNone!''"
 lbd_story.102.no_encounter:0 "''Filthy Solid Baldarak, you still dare to entertain notions that you might be able to challenge us?!\n\nYou will be crushed beneath our mercury vapor boots! There is no hope for you, solid! \n\nNone!''"
 lbd_story.102.youll_never_get_away_with_it:0 "You'll never get away with it!"
 lbd_story.102.this_is_madness:0 "This is madness!"
 lbd_story.102.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.102.screaming:0 "-OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.102.can_we_talk_this_out:0 "There is no need to fight, we can coexist"
 lbd_story.102.is_there_an_ignore_button:0 "Is there some kind of ignore button?"
 lbd_story.103.title:0 "A Noble Gas Reaction"
 lbd_story.103.authoritarian:0 "''I see no further need to digress, know that we are coming Baldarak, and soon.''\n\nThe Dathnak begins to terminate the connection"
 lbd_story.103.rebel:0 "''I see no further need to digress, know that we are coming Comrade Baldarak, and soon.''\n\nThe Dathnak begins to terminate the connection"
 lbd_story.103.reloc_twice:0 "''I see no further need to digress, know that we are coming Baldarak, and soon.''\n\nThe Dathnak begins to terminate the connection"
 lbd_story.103.reloc_once:0 "''I see no further need to digress, know that we are coming Baldarak, and soon.''\n\nThe Dathnak begins to terminate the connection"
 lbd_story.103.reloc_none:0 "''I see no further need to digress, know that we are coming Criminal Baldarak, and soon.''\n\nThe Dathnak begins to terminate the connection"
 lbd_story.103.no_encounter:0 "''I see no further need to digress, know that we are coming Baldarak, and soon.'' \n\nThe Dathnak begins to terminate the connection"
 lbd_story.103.bring_it_on:0 "Bring it on"
 lbd_story.103.well_stop_you:0 "We will deny you and your foolishness"
 lbd_story.103.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.103.screaming:0 "-OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.103.let_us_be_friends:0 "You need not do this, we can coexist!"
 LBD_DATHNAK_MUST_HAVE_HELPED_DATHNAK:0 "§RYou must have helped the Dathnak to a certain degree to choose this§!"
 LBD_DATHNAK_NOT_YET_IMPLEMENTED:0 "§RSorry this has not been implemented yet!§!"
 lbd_story.103.remember_how_we_helped_you:0 "Remember how we helped you, let us join together instead of tearing apart"
 lbd_story.104.title:0 "A Noble Gas Reaction"
 lbd_story.104.authoritarian:0 "''Your argument is convincing Baldarak,  despite your solid ways... Together our powers would allow us to create a galaxy of absolute order and prosperity! \n\nWe're glad to see that you're willing to be our subject! Also we noticed what appears to be minor clerical error in your country name, luckily we can fix that right up for you!''"
 lbd_story.104.rebel:0 "''Yes Comrade Baldarak, your argument is persuasive despite you being a solid, we could bring true freedom to this galaxy and liberate solid and Dathnak alike!\n\nWe're  glad to see you are willing to be our subject, Comrade Baldarak! Also we noticed what appears to be minor clerical error in your country name, luckily we can fix that right up for you!''"
 lbd_story.104.agreed:0 "Indeed, glory to the Dathnak!"
 lbd_story.104.nevermind:0 "Actually this was a mistake"
 lbd_story.105.title:0 "A Noble Gas Reaction"
 lbd_story.105.authoritarian:0 "''Foolish Baldarak, you could have been powerful, strong beyond imagining! But you chose WEAKNESS instead... You will regret this''\n\nThe connection terminates ominously"
 lbd_story.105.rebel:0 "''Comrade Baldarak you disappoint us! We had thought you committed to the cause of our glorious revolution!''\n\nThe connection terminates ominously"
 lbd_story.105.ok:0 "Ok"
 lbd_dathnak_warrior_princess_title:0 "Warrior Princess"
 dathnak_xenon_warrior_empire_name:0 "The Dathnak Dominion"
 lbd_story.201.title:0 "Wrath of Xenon"
 lbd_story.201.desc:0 "Suddenly, a communication is sent from an entirely different source, when the screen loads, the Dathnak seems different somehow. While you cannot see them, you sense a sort of regal presence and strength\n\n''Hail Baldarak,\n\nYou address Xenon, Warrior Princess and ruler of §M$dathnak_xenon_warrior_empire_name$§!.\n\nYou must be quite shocked, thinking you had massacred all of our kin...worry not while we will slaughter you to honor their memories, we would have slaughtered you regardless, for that is the way of the strong.\n\nYou must have many questions, but know that we are the descendents of the vestiges of the tragedy of the original Dathnak Planet. When a spacefaring race descended, offering to ferry our people to a new planet, some of our people doubted them and refused the offer, retreating to the planet core and the inevitable radiation...\n\nMany of them perished, however some survived the grueling environment, embraced the pain and grew stronger for it. They learned to depend on themselves and develop their own technology instead of relying upon others, they embraced pain and became something more than merely Dathnak...\n\nThey became warriors!\n\nNow to complete the ritual to become the true Queen of the Dathnak I must defeat a worthy enemy in combat, and I have chosen you and your other solid empires as my foes.''"
 lbd_story.201.more_of_you:0 "More Dathnak?!"
 lbd_story.201.finally_a_worthy_adversary:0 "Finally a true warrior!"
 lbd_story.201.screaming:0 "-OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.201.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.201.can_we_talk_about_this:0 "Why must we fight? Surely we can coexist"
 lbd_story.202.title:0 "Wrath of Xenon"
 lbd_story.202.desc:0 "Her voice seems almost to explode outward, filled with the lust for battle and the enjoyment of a new challenge.\n\n''Our battle shall be §RLEGENDARY§!\n\nA tale to tell until the end of time! You will pay for the many Dathnak you slaughtered, they may have been weak but they were our kin nonetheless and it would be dishonorable for us not to avenge them.\n\nYour planets shall be rent asunder, your skies split and fields left fallow with only the stench of rotten corpses left to enjoy the view... and what few of us decide to colonize them I suppose.''"
 lbd_story.202.what_makes_you_think:0 "What makes you think you'll do better than them?"
 lbd_story.202.i_enjoyed_their_deaths:0 "We slaughtered them and we liked it, we could go for some more even"
 lbd_story.202.screaming:0 "-OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.202.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.203.title:0 "Wrath of Xenon"
 lbd_story.203.desc:0 "There is a clear sense of hesitation, for the first time Xenon clearly exhibits something other than absolute confidence.\n\n''I see... I had thought the madness of solids to be overexagerated but now I find the stories hardly did it justice!''\n\nThe tone of her voice almost sounds as if she had accidentally touched something unhygienic."
 lbd_story.203.thank_you_i_try:0 "Thanks! I try"
 lbd_story.203.finally_a_worthy_adversary:0 "Finally a worthy adversary"
 lbd_story.203.screaming:0 "-OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.203.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.204.title:0 "Wrath of Xenon"
 lbd_story.204.desc:0 "For a moment you detect hesitation, but suddenly her rage is rekindled and you can sense an almost palpable heat to the air around you despite the distance and use of a communications device\n\n''How dare you Baldarak! You would tempt me to cowardice and weakness?!\n\nA true warrior only speaks with their weapons, conflict can only be solved with death, to do anything else is madness!\n\nDeath must bring death and fire must answer fire! Only the strength of steel can survive the forge!\n\nMy people are not so weak and neither am I, I will not fall for your deception and trickery!''"
 lbd_story.204.compassion_isnt_weakness:0 "Compassion isn't weakness!"
 lbd_story.204.dang_you_almost_fell_for_it:0 "My plan was perfect! Curses!"
 lbd_story.204.who_hurt_you:0 "Who... Who hurt you?"
 lbd_story.204.so_be_it:0 "So be it"
 lbd_story.205.title:0 "Wrath of Xenon"
 lbd_story.205.desc:0 "Clearly enjoying the thought of a potential challenge to be overcome, you can sense an undertone of joy in her voice, but also the occasional tingle of a strange hesitation that belies it.\n\n''It is true that nothing is certain, my life has taught me nothing if not that only the strong survive, and that complacency is death...\n\nWe shall soon settle this on the fields of battle but know that behind every ship shall be a thousand thousand Dathnak spirits pushing it to victory.\n\nSoon we shall know if you truly deserve the title of 'Baldarak'''"
 lbd_story.205.from_one_warrior_to_another:0 "A true warrior, I look forward to our battle"
 lbd_story.205.only_the_strongest_shall_survive:0 "The strong shall rise and the weak shall fall"
 lbd_story.205.there_is_no_more_need_for_words:0 "There is no more need for words, now we shall speak the language of battle"
 lbd_story.205.prepare_for_annihilation:0 "Prepare to be annihilated"
 lbd_story.205.i_will_revel_in_the_carnage:0 "Your people will die and I will laugh"
 lbd_story.206.title:0 "Wrath of Xenon"
 lbd_story.206.desc:0 "Her confusion quickly ignites, once more building into a flame of wrath, yet a sad undercurrent darts in and out of your perception from time to time.\n\n''It matters not,\nwhile I take no pleasure in the death of fools and madmen, you must pay the price for your crimes, and thus you shall. Prepare yourself Baldarak, for you face a foe now cannot be cowed by your trickery and deceit''"
 lbd_story.206.another_dead_gas_bag:0 "Oh no, a talking corpse!"
 lbd_story.206.give_it_your_best:0 "Give it your best shot"
 lbd_story.206.screaming:0 "-OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.206.exterminate:0 "Do not resist, your death is inevitable"
 lbd_story.206.i_will_revel_in_the_carnage:0 "I will bathe in the tears of your slaughtered comrades"
 lbd_story.207.title:0 "Wrath of Xenon"
 lbd_story.207.desc:0 "You get a sense of internal conflict, when she next speaks it seems as if the words are being torn from her body. \n\n''I...I cannot give you the answer you want, compassion is an illusion, a weakness to be exploited, my people would never respect a warrior who retreated in the face of battle, regardless of the cause.\n\nRage is the essence, the weapon we weild to conquer. \n\nWhat words can defeat death?\nMy position in particular will not allow it. I know the trap you lay Baldarak, and I will not fall for your wiles.\n\nI make of my heart mercury vapor and will embrace what fate holds for me, for I must protect my people at all costs.''"
 lbd_story.207.let_out_your_pain:0 "You're only hurting yourself like this, let the pain out"
 lbd_story.207.so_you_choose_cowardice:0 "So you choose cowardice"
 lbd_story.207.dang_you_almost_fell_for_it:0 "No, my plan was so close to success!"
 lbd_story.207.i_dont_have_time_for_this:0 "I don't have time for this"
 lbd_story.208.title:0 "Wrath of Xenon"
 lbd_story.208.desc:0 "If she had seemed angry before at times it is nothing compared to the raging inferno that suddenly envelops your sense.\n\n''Your §RTREACHERY§! and §RDECEIT§! shall be well remembered §RSOLID SCUM§!, know that I will remember this and reap a harvest of death from your people far greater than any you have ever known! My people have known constant conflict facing death daily in struggles against both fellow Dathnak and beasts the likes of which you cannot imagine. I am §RXENON the Despoiler§!, Wrath of the Dathnak, Slayer of the Xerkak Serpent, Vanquisher of the Amborkak Drake! I alone toppled the Orgybh Fortress and slew Rutgak the Merciless! I have killed more Dathnak than you have ever known and a thousand times as many beasts!\n\nYou will grovel beneath me for mercy, but you will find none!''"
 lbd_story.208.minorly_terrifying:0 "Minorly terrifying"
 lbd_story.208.you_think_your_primitive:0 "You think your primitive struggles will help you?!"
 lbd_story.208.if_you_fight_as_much_as_you_talk:0 "If you fight as much as you talk, you are a threat indeed"
 lbd_story.208.i_dont_have_time_for_this:0 "I don't have time for this"
 lbd_story.211.title:0 "Wrath of Xenon"
 lbd_story.211.desc:0 "She is audibly shaken and somehow hurt.\n\n''Your words touch a heart I had thought long lost, and a weakness I had thought discarded. Some portion of me wishes to see a future where we might live along side eachother hand in hand, Baldarak and Dathnak, but it is not to be. I cannot know weakness, and The Dathnak Dominion cannot know peace. Had things been different perhaps... but no. Only the stong can survive, my parents taught this to me young when they left my foolish young self in the Deserts of Orgybbh, all that was weak was seared away and only strength survived, and this is the strength I will use to crush you, Baldarak. Prepare yourself, the war begins now.''"
 lbd_story.211.nothing_but_regret:0 "I have nothing but regret that it has come to this"
 lbd_story.211.no_wait:0 "No! Wait! Don't-"
 lbd_story.211.you_leave_us_no_choice:0 "Then you leave us no choice"
 lbd_story.212.title:0 "Wrath of Xenon"
 lbd_story.212.desc:0 "Her rage intensifies but even more than angry she sounds baffled, however that confusion quickly gives way to even more rage. \n\n''You would call §RME§! a coward?! \n\nAt the age of five I was abandoned in the Deserts of Orgybbh and slew Krogakthna the Immortal with my bare hands! At the age of eight I bested the mighty Glorbagak boar that had killed a thousand Dathnaks and feasted on its flesh! I have faced ten thousand warriors with nothing but a single Elgrybbh and killed them all to kill my father, the previous ruler, when I could have easily run and allowed his tyranny to continue! You who would call me a coward know NOTHING or our people and the sacrifices I have made, the trainings and trials I have taken.\n\nYou will pay for questioning my honor Baldarak, count on it!''"
 lbd_story.212.how_very_sad:0 "How very sad... to have had to live such a life"
 lbd_story.212.you_cannot_hide_fear_as_anger:0 "You hide your fear as anger but you cannot run from yourself"
 lbd_story.212.dang_you_almost_fell_for_it:0 "Hah! You almost fell for it!"
 lbd_story.212.you_leave_us_no_choice:0 "Then you leave us no choice"
 lbd_story.213.title:0 "Wrath of Xenon"
 lbd_story.213.desc:0 "It is clear that it is not often, if ever, that Xenon has opened up to someone like this, however your response is like a spear thrust into her open heart. \n\n''How dare you... HOW DARE YOU...!''\n\nSuddenly she terminates the connection."
 lbd_story.213.finally:0 "Finally! About time!"
 lbd_story.212.well_that_could_have_gone_better:0 "Well that could have gone better"
 lbd_story.212.sigh:0 "*Sigh*"
 lbd_story.214.title:0 "An Explosive Reaction"
 lbd_story.214.desc:0 "A communication channel is suddenly forced open, and the ragged breath of Xenon can be heard, she is clearly in a great deal of pain as she speaks.\n\n''You have won this war and bested me, I acknowledge it, you are deserving of the title 'Baldarak'.''\n\nA sound similar to a cough and then a bit of particularly noxious air is released, perhaps analogous to coughing up blood for a Dathnak\n\n''We lived by the Kragybbh and died by the Kragybbh and I'm afraid my time is rapidly coming... To think that in the end it would be a solid that would strike me down... everything I've built, all the Dathnak I've loved as if they were my children... gone...''\n\nShe suddenly begins to laugh in a pained manner, as if at a private joke."
 lbd_story.214.it_didnt_have_to_be_this_way:0 "It didn't have to be this way..."
 lbd_story.214.why_are_you_laughing:0 "Wh-Why are you laughing?"
 lbd_story.214.finally_you_die:0 "Finally you die! FINALLY!"
 lbd_story.214.you_were_weak_and_that_is_all:0 "Your biggest mistake was being weak"
 lbd_story.214.screaming:0 "-OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO-"
 lbd_story.214.a_worthy_opponent:0 "You were a worthy opponent, we salute you."
 lbd_story.215.title:0 "An Explosive Reaction"
 lbd_story.215.desc:0 "Her laughter is suddenly ended by a spurt of more coughing of noxious gas.\n\n''You don't understand Baldarak, from me you would have had an easy death, an honorable death... but the others will not be so merciful... The other Noble Gases are watching, and you defeating me will only embolden them.''\n\nMore noxious gas coughing is heard and then she continues in a faltering voice.\n\n''Goodbye Baldarak, perhaps if we had met under different circumstances...but no... the cycle is never so kind to any of us... I only ask... if any of my children survived... please... have mercy...''\n\nAnd then with a last breath she is gone, leaving more questions than before... \n\n\n\nWho or what exactly are the Noble Gases? \nWhat does this mean for the future? \n\nPerhaps... only time will tell."
 lbd_story.215.why_why_did_you_have_to_do_this:0 "Why... Why did it have to come to this Xenon... Why?"
 lbd_story.215.they_will_die_as_you_have_died:0 "They will die as you died Xenon"
 lbd_story.215.ugh_not_more_of_you:0 "Ugh not more of you!?"
 lbd_story.215.then_the_strong_will_survive:0 "Then the strong will survive"
 lbd_story.215.screaming:0 "-OOO! Anything but the Dathnak! Oh wait-"
 lbd_story.215.i_look_forward_to_it:0 "I look forward to it"
 lbd_story.215.wait_what:0 "Wait what?!"
