 personality_lbd_dathnak_original_crisis:0 "Effluvium Irritants"
 personality_lbd_dathnak_original_crisis_desc:0 "Not the most dangerous threat the galaxy has ever known, but quite possibly the most annoying one."
 personality_lbd_dathnak_original_crisis_awoken_2:0 "Effluvium Irritants"
 personality_lbd_dathnak_original_crisis_awoken_2_desc:0 "Not the most dangerous threat the galaxy has ever known, but quite possibly the most annoying one."
 personality_lbd_dathnak_xenon_warriors_crisis:0 "Furious Berserkers"
 personality_lbd_dathnak_xenon_warriors_crisis_desc:0 "Unlike the other Dathnak, these Dathnak were forged in the hearts of dying worlds and have learned to seek out carnage. Like rabid dogs they will fight with everyone and anyone until they can prove that they retain the right to live"
 personality_lbd_dathnak_xenon_warriors_subdued:0 "REPLACE_ME"
 personality_lbd_dathnak_xenon_warriors_subdued_desc:0 "REPLACE_ME"
 pc_lbd_dathnak_gas_giant_desc:0 "A mysterious gas giant that has somehow been optimized for sustaining life, with the right technology these curious gases might be navigable in ways not unlike a liquid such as on an ocean world"
 pc_lbd_dathnak_gas_giant_adj:0 "Gaseous"
 mod_pc_lbd_dathnak_gas_giant_habitability:0 "Effluvium Giant Habitability"
 trait_pc_lbd_dathnak_gas_giant_preference:0 "Effluvium Born"
 trait_pc_lbd_dathnak_gas_giant_preference_desc:0 "Born in the mysterious gases of an Effluvium Giant, this being has a strange kinship with exotic gases"
 job_lbd_dathnak_slave_toiler:0 "Effluvium Toiler"
 job_lbd_dathnak_slave_toiler_plural:0 "Effluvium Toilers"
 job_lbd_dathnak_slave_toiler_desc:0 "Without using any equipment gathering exotic gases would normally be impossible, but on an Effluvium Giant the gases are nearly liquid and a small amount can be gained"
 job_lbd_dathnak_soldier:0 "Effluvium Soldier"
 job_lbd_dathnak_soldier_plural:0 "Effluvium Soldiers"
 job_lbd_dathnak_soldier_desc:0 "Part of Dathnak soldier training is putting in hard grueling work for the populace, while these soldiers are the best of the best they also work hard and pay their taxes just like any other Dathnak... Wait do Dathnak have money?! How does that work-"
 mod_job_lbd_dathnak_soldier_add:0 "$job_lbd_dathnak_soldier$ Jobs"
 job_lbd_dathnak_gas_unity_worker:0 "Effluvium Unifier"
 job_lbd_dathnak_gas_unity_worker_plural:0 "Effluvian Unifiers"
 job_lbd_dathnak_gas_unity_worker_desc:0 "Some consider the collection of exotic gases a holy task, much like collecting the bones of the dead for biologicals. You see it all has to do with their religion which is really interestin-"
 mod_job_lbd_dathnak_gas_unity_worker_add:0 "$job_lbd_dathnak_gas_unity_worker$ Jobs"
 job_lbd_dathnak_gas_extractor:0 "Effluvium Harvester"
 job_lbd_dathnak_gas_extractor_plural:0 "Effluvium Harvesters"
 job_lbd_dathnak_gas_extractor_desc:0 "Using only the best equipment these harvesters gather exotic gases from the air, however the resulting discharge is highly toxic to anything that isn't a Dathnak, much like the Dathnak themselves."
 mod_job_lbd_dathnak_gas_extractor_add:0 "$job_lbd_dathnak_gas_extractor$ Jobs"
 job_lbd_dathnak_gas_technician:0 "Effluvium Technician"
 job_lbd_dathnak_gas_technician_plural:0 "Effluvium Technicians"
 job_lbd_dathnak_gas_technician_desc:0 "They turn exotic gases into energy, which is pretty cool if you think about it... especially if those gases happened to have been an annoying Dathnak"
 mod_job_lbd_dathnak_gas_technician_add:0 "$job_lbd_dathnak_gas_technician$ Jobs"
 job_lbd_dathnak_gas_refiner_motes:0 "Effluvium Mote Transmuter"
 job_lbd_dathnak_gas_refiner_motes_plural:0 "Effluvium Mote Transmuters"
 job_lbd_dathnak_gas_refiner_motes_desc:0 "Using a little bit of energy to jumpstart the process, a little bit of motes can become a bigger bit of gases! Don't ask how that works, it's a trade secret."
 mod_job_lbd_dathnak_gas_refiner_motes_add:0 "$job_lbd_dathnak_gas_refiner_motes$ Jobs"
 job_lbd_dathnak_gas_refiner_crystals:0 "Effluvium Crystal Transmuter"
 job_lbd_dathnak_gas_refiner_crystals_plural:0 "Effluvium Crystal Transmuters"
 job_lbd_dathnak_gas_refiner_crystals_desc:0 "Using a little bit of energy to jumpstart the process, a little bit of crystal can become a bigger bit of gases! Don't ask how that works, it's a trade secret."
 mod_job_lbd_dathnak_gas_refiner_crystals_add:0 "$job_lbd_dathnak_gas_refiner_crystals$ Jobs"
 job_lbd_dathnak_gas_mineral_transmuter:0 "Effluvium Concretizer"
 job_lbd_dathnak_gas_mineral_transmuter_plural:0 "Effluvium Concretizer"
 job_lbd_dathnak_gas_mineral_transmuter_desc:0 "They don't actually make minerals, instead they simply alter the properties of exotic gases to be usable for construction, now if only we could alter the Dathnak to be usable for my sanity"
 mod_job_lbd_dathnak_gas_mineral_transmuter_add:0 "$job_lbd_dathnak_gas_mineral_transmuter$ Jobs"
 job_lbd_dathnak_foundry:0 "Effluvium Forger"
 job_lbd_dathnak_foundry_plural:0 "Effluvium Forgers"
 job_lbd_dathnak_foundry_desc:0 "Using exotic gases as a catalyst, they can make alloys with much less waste and considerably faster! Almost as fast as you got tired of the corny jokes in these descriptions even!"
 mod_job_lbd_dathnak_foundry_add:0 "$job_lbd_dathnak_foundry$ Jobs"
 job_lbd_dathnak_catalytic_technician:0 "Effluvium Catalytic Forger"
 job_lbd_dathnak_catalytic_technician_plural:0 "Effluvium Catalytic Forgers"
 job_lbd_dathnak_catalytic_technician_desc:0 "Using exotic gases as a catalyst, they can make alloys with much less waste and considerably faster! Almost as fast as you got tired of the corny jokes in these descriptions even!"
 mod_job_lbd_dathnak_catalytic_technician_add:0 "$job_lbd_dathnak_catalytic_technician$ Jobs"
 job_lbd_dathnak_artisan:0 "Effluvium Artisan"
 job_lbd_dathnak_artisan_plural:0 "Effluvium Artisans"
 job_lbd_dathnak_artisan_desc:0 "They make gases into various luxuries, an art form that requires years of training and dedication (or simply reassigning a pop) and results in a transformed state that is both luxurious and functional"
 mod_job_lbd_dathnak_artisan_add:0 "$job_lbd_dathnak_artisan$ Jobs"
 job_lbd_dathnak_artificer:0 "Effluvium Artificer"
 job_lbd_dathnak_artificer_plural:0 "Effluvium Artificers"
 job_lbd_dathnak_artificer_desc:0 "They make gases into various luxuries, an art form that requires decades of training and dedication (or simply reassigning a pop) and results in a transformed state that is both luxurious and functional"
 mod_job_lbd_dathnak_artificer_add:0 "$job_lbd_dathnak_artificer$ Jobs"
 job_lbd_dathnak_gas_growth_maker:0 "Effluvium Educator"
 job_lbd_dathnak_gas_growth_maker_plural:0 "Effluvium Educators"
 job_lbd_dathnak_gas_growth_maker_desc:0 "Highly illegal in over 23 star systems, patented Dathnak technology allows these beings to utilize near torturous methods to educate and develop pops at insanely fast speeds"
 mod_job_lbd_dathnak_gas_growth_maker_add:0 "$job_lbd_dathnak_gas_growth_maker$ Jobs"
 job_lbd_dathnak_scholar:0 "Effluvium Elite"
 job_lbd_dathnak_scholar_plural:0 "Effluvium Elites"
 job_lbd_dathnak_scholar_desc:0 "The cream of the crop, essentially nobility that have received advanced educations and training in a variety of fields. This pop includes not only the nobles themselves but also their entourages which are highly trained in military matters"
 mod_job_lbd_dathnak_scholar_add:0 "$job_lbd_dathnak_scholar$ Jobs"
 job_lbd_dathnak_maintenance_drone:0 "Effluvium Maintenance Drone"
 job_lbd_dathnak_maintenance_drone_plural:0 "Effluvium Maintenance Drones"
 job_lbd_dathnak_maintenance_drone_desc:0 "Legend has it that the crazy productivity of this drone comes from the imprisoned tortured soul of a Dathnak powering it, but that's obviously untrue, we know those are happy screams."
 mod_job_lbd_dathnak_maintenance_drone_add:0 "$job_lbd_dathnak_maintenance_drone$ Jobs"
 job_lbd_dathnak_soldier_drone:0 "Effluvium Warrior Drone"
 job_lbd_dathnak_soldier_drone_plural:0 "Effluvium Warrior Drones"
 job_lbd_dathnak_soldier_drone_desc:0 "Drones that have been equipped with only the newest exotic gas based weapons"
 mod_job_lbd_dathnak_soldier_drone_add:0 "$job_lbd_dathnak_soldier_drone$ Jobs"
 job_lbd_dathnak_gas_unity_worker_drone:0 "Effluvium Unifier Drone"
 job_lbd_dathnak_gas_unity_worker_drone_plural:0 "Effluvium Unifier Drones"
 job_lbd_dathnak_gas_unity_worker_drone_desc:0 "This job makes no sense, but neither do the Dathnak! I mean think about it, how does a gas based life form even work, who came up with thi-"
 mod_job_lbd_dathnak_gas_unity_worker_drone_add:0 "$job_lbd_dathnak_gas_unity_worker_drone$ Jobs"
 job_lbd_dathnak_gas_extractor_drone:0 "Effluvium Harvester Drone"
 job_lbd_dathnak_gas_extractor_drone_plural:0 "Effluvium Harvester Drones"
 job_lbd_dathnak_gas_extractor_drone_desc:0 "Using only the best equipment these harvesters gather exotic gases from the air, however the resulting discharge is highly toxic to anything that isn't a Dathnak, much like the Dathnak themselves."
 mod_job_lbd_dathnak_gas_extractor_drone_add:0 "$job_lbd_dathnak_gas_extractor_drone$ Jobs"
 job_lbd_dathnak_gas_technician_drone:0 "Effluvium Technician Drone"
 job_lbd_dathnak_gas_technician_drone_plural:0 "Effluvium Technician Drones"
 job_lbd_dathnak_gas_technician_drone_desc:0 "Gas powered energy, put gas in get energy out! It's just that simple!"
 mod_job_lbd_dathnak_gas_technician_drone_add:0 "$job_lbd_dathnak_gas_technician_drone$ Jobs"
 job_lbd_dathnak_slave_toiler_drone:0 "Effluvium Toiler Drone"
 job_lbd_dathnak_slave_toiler_drone_plural:0 "Effluvium Toiler Drones"
 job_lbd_dathnak_slave_toiler_drone_desc:0 "The drones aren't nearly as effective as $job_lbd_dathnak_gas_extractor_drone_plural$ as they lack all but the most basic equipment needed for collecting gas, that being said free gas is never a bad thing!"
 job_lbd_dathnak_gas_growth_maker_drone:0 "Effluvium Educator Drone"
 job_lbd_dathnak_gas_growth_maker_drone_plural:0 "Effluvium Educator Drones"
 job_lbd_dathnak_gas_growth_maker_drone_desc:0 "Certain kinds of exotic gases allow them to optimize learning and development protocols which in turn results in higher pop growth!"
 mod_job_lbd_dathnak_gas_growth_maker_drone_add:0 "$job_lbd_dathnak_gas_growth_maker_drone$ Jobs"
 job_lbd_dathnak_scholar_drone:0 "Effluvium Brain Drone"
 job_lbd_dathnak_scholar_drone_plural:0 "Effluvium Brain Drones"
 job_lbd_dathnak_scholar_drone_desc:0 "Similar to how the $job_lbd_dathnak_gas_growth_maker_drone_plural$ use gases to optimize learning protocols, this brain drone utilizes gases to optimize research processes and is highly unstable. For that reason it is kept guarded at all times in order to ensure no enemy saboteurs get close enough to do anything funny!"
 mod_job_lbd_dathnak_scholar_drone_add:0 "$job_lbd_dathnak_scholar_drone$ Jobs"
 job_lbd_dathnak_scholar_calculator:0 "Effluvium Calculator"
 job_lbd_dathnak_scholar_calculator_plural:0 "Effluvium Calculators"
 job_lbd_dathnak_scholar_calculator_desc:0 "Similar to how the $job_lbd_dathnak_gas_growth_maker_drone_plural$ use gases to optimize learning protocols, this brain drone utilizes gases to optimize research processes and is highly unstable. For that reason it is kept guarded at all times in order to ensure no enemy saboteurs get close enough to do anything funny!"
 mod_job_lbd_dathnak_scholar_calculator_add:0 "$job_lbd_dathnak_scholar_calculator$ Jobs"
 job_lbd_dathnak_foundry_drone:0 "Effluvium Forger Drone"
 job_lbd_dathnak_foundry_drone_plural:0 "Effluvium Forger Drones"
 job_lbd_dathnak_foundry_drone_desc:0 "You know what makes good fuel? Gas. You know what needs fuel to be made? Alloys. More gas = more alloys! Also more alloy efficiency!"
 mod_job_lbd_dathnak_foundry_drone_add:0 "$job_lbd_dathnak_foundry_drone$ Jobs"
