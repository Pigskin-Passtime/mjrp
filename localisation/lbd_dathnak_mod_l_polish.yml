 mod_ships_alloys_upkeep_mult:0 "Ships £alloys£ §Y$alloys$§! Upkeep"
 district_lbd_dathnak_generator:0 "Effluvium Energistics District"
 district_lbd_dathnak_generator_desc:0 "Utilizes the unique qualities of exotic gases on an Effluvian Giant to create motion, and thus energy, with nearly 0 loss to friction or other forces. Gas goes in, energy numbers go up, basic science."
 district_lbd_dathnak_generator_plural:0 "Effluvium Energistics Districts"
 district_lbd_dathnak_science:0 "Effluvium Luxury District"
 district_lbd_dathnak_science_desc:0 "A district where the low ranking Dathnak nobility would reside, it includes everything a Dathnak noble would need to pursue higher concerns while the peasantry sustain them. The joke here is the idea that Dathnak can be noble... or useful..."
 district_lbd_dathnak_science_plural:0 "Effluvium Luxury Districts"
 job_lbd_dathnak_artisan_effect_desc:0 "£job_lbd_dathnak_artisan£ $job_lbd_dathnak_artisan_plural$ turn £exotic_gases£ §Y$exotic_gases$§! into £consumer_goods£ §Y$consumer_goods$§! and £minerals£ §Y$minerals$§!"
 job_lbd_dathnak_artificer_effect_desc:0 "£job_lbd_dathnak_artificer£ $job_lbd_dathnak_artificer_plural$ turn £exotic_gases£ §Y$exotic_gases$§! into £mod_trade_value_add£ §Y$TRADE_VALUE$§!, £consumer_goods£ §Y$consumer_goods$§! and £minerals£ §Y$minerals$§!"
 job_lbd_dathnak_scholar_effect_desc:0 "£job_lbd_dathnak_scholar£ $job_lbd_dathnak_scholar_plural$ turn £exotic_gases£ §Y$exotic_gases$§! and £consumer_goods£ §Y$consumer_goods$§! into £physics£ £society£ £engineering£ §YResearch Points§! for new technologies, spawn £defense_army£ §YDefense Armies§! and increase £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!"
