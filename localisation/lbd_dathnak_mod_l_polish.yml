 MEDIUM_LBD_DATHNAK_GAMMA_LASER:0 "Medium Effluvium Ray"
 LARGE_LBD_DATHNAK_GAMMA_LASER:0 "Large Effluvium Ray"
 LBD_DATHNAK_PERDITION_BEAM_TITAN:0 "Titanic Effluvium Beam"
 tech_lbd_dathnak_energy_torpedoes:0 "Effluvium Torpedo Theory"
 tech_lbd_dathnak_energy_torpedoes_desc:0 "These aren't even torpedoes, they're just blobs of energy, why not just call it ''Energy Blob Launcher'' or something, come on!"
 district_lbd_dathnak_city:0 "Effluvium Habitation District"
 district_lbd_dathnak_city_desc:0 "A special habitation district that due to its design is especially good at housing gaseous bodies, unfortunately does not come with noise canceling"
 district_lbd_dathnak_city_plural:0 "Effluvium Habitation Districts"
 district_lbd_dathnak_hive:0 "Effluvium Hive Habitation District"
 district_lbd_dathnak_hive_desc:0 "$district_lbd_dathnak_city_desc$"
 district_lbd_dathnak_hive_plural:0 "Effluvium Hive Habitation Districts"
