 narrow_escape_archaeology.1070.name: "Cryptic Cave"
 narrow_escape_archaeology.1010.desc: "We discovered a hidden resource cache. We're not sure how it got here, but it's sure to be useful."
 narrow_escape_archaeology.1020.desc: "Upon closer examination, we discovered some mysterious artifacts. They could come in handy."
 narrow_escape_archaeology.1030.desc: "We discovered some cryptic text. Unfortunately it seems extremely difficult to decode, but it's a potential clue nonetheless."
 narrow_escape_archaeology.1040.desc: "One of the expedition teams discovered a cryptic artifact in one of the structures. Unfortunately, as they were searching it, it collaped upon itself, but luckily no one got hurt."
 narrow_escape_archaeology.1050.desc: "We discovered some cryptic text. Unfortunately it seems extremely difficult to decode, but it's a potential clue nonetheless."
 narrow_escape_archaeology.1060.desc: "One of the expedition teams discovered a cryptic artifact in one of the structures. Unfortunately, as they were searching it, it collaped upon itself, but luckily no one got hurt."
 narrow_escape_archaeology.1070.desc: "One of our expedition teams exploring a cave discovered that it has cryptic writings all over it. Unfortunately they seem extremely difficult to decode, but they're potential clues nonetheless."
 narrow_escape_archaeology.1010.a: "Neat"
 narrow_escape_archaeology.1020.a: "Neat"
