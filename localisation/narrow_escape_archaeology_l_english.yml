 site_narrow_escape_destroyed_homeworld: "Destroyed Homeworld"
 site_narrow_escape_destroyed_homeworld_desc: "Our homeworld, [Planet.GetName], has been turned into a [Planet.GetClassName] by some unknown force. It would likely be benefitial for us to investigate."

 narrow_escape_archaeology.3.name: "Destroyed Homeworld"
 narrow_escape_archaeology.3.desc.a: "It has been a while since we lived on [narrow_escape_origin_homeworld.GetName]. With our research getting more and more advanced, it may be worth trying to understand the cause of our homeworld's destruction."
 narrow_escape_archaeology.3.desc.b: "It has been a few decades since we lived on [narrow_escape_origin_homeworld.GetName]. With our research getting more and more advanced, it may be worth trying to understand the cause of our homeworld's destruction."
 narrow_escape_archaeology.3.desc.c: "It has been several decades since we lived on [narrow_escape_origin_homeworld.GetName]. With our research getting more and more advanced, it may be worth trying to understand the cause of our homeworld's destruction."
 narrow_escape_archaeology.3.desc.d: "It has been over a century since we lived on [narrow_escape_origin_homeworld.GetName]. With our research getting more and more advanced, it may be worth trying to understand the cause of our homeworld's destruction."
 narrow_escape_archaeology.3.desc.e: "It has been a few centuries since we lived on [narrow_escape_origin_homeworld.GetName]. With our research getting more and more advanced, it may be worth trying to understand the cause of our homeworld's destruction."
 narrow_escape_archaeology.3.desc.f: "It has been several centuries since we lived on [narrow_escape_origin_homeworld.GetName]. With our research getting more and more advanced, it may be worth trying to understand the cause of our homeworld's destruction."
 narrow_escape_archaeology.3.desc.g: "It has been over a millennium since we lived on [narrow_escape_origin_homeworld.GetName]. With our research getting more and more advanced, it may be worth trying to understand the cause of our homeworld's destruction."
 narrow_escape_archaeology.3.a: "We shall find out"

 narrow_escape_archaeology.101.name: "Ruins of [From.Planet.GetName]"
 narrow_escape_archaeology.101.desc: "We have gone through a large part of our city ruins, so far having failed to find an answer. But, we are still hopeful."
 narrow_escape_archaeology.101.a: "Conduct a more comprehensive expedition"
 narrow_escape_archaeology.102.name: "The Mystery Grows"
 narrow_escape_archaeology.102.desc: "Even after going through almost all of our city ruins, we have still failed to find any cause or reason for this disaster. Some scientists are beginning to doubt the viability of this..."
 narrow_escape_archaeology.102.a: "Search through every single ruin"
 narrow_escape_archaeology.103.name: "Nothing to be Found"
 narrow_escape_archaeology.103.desc: "We have looked through every piece of ruin, and even the area around populated cities and other buildings, but we still haven't been successful in finding any cause or reason for this disaster. Many scientists are doubting we would find much of value."
 narrow_escape_archaeology.103.a: "Search the entire surface"
 narrow_escape_archaeology.104.name: "Growing Insanity"
 narrow_escape_archaeology.104.desc: "We have gone through the entire planet's surface, even looking though parts of the underground, but still don't have a single clue about the cause or reason for this disaster. Scientists are growing insane from this expedition."
 narrow_escape_archaeology.104.a: "Search the planet's underground"
 narrow_escape_archaeology.105.name: "Collapsing Reality"
 narrow_escape_archaeology.105.desc: "Having gone through the entire underground, but still not having found anything, scientists are beginning to question your sanity."
 narrow_escape_archaeology.105.a: "This is absurd! Search the *entire* planet!"
 narrow_escape_archaeology.106.name: "Meditations on the Abyss"
 narrow_escape_archaeology.106.desc: "It is done. The entire planet has been searched. Finally. A clue. But not just one...\nUpon analysis of this clue, [FromFrom.GetLeaderName] had a revelation. We have been finding a lot of clues, little hints, but overlooking all of them.\n\nAll evidence points to the cause being an extradimensional creature.\nWhat it is, what it wants, what it thinks, we do not know. We cannot see it. We cannot hear it. We cannot feel it.\n\nBut..."
 narrow_escape_archaeology.106.a: "Perhaps with this knowledge..."
 narrow_escape_archaeology.106.a.tooltip: "§HWe may be able to make it act more favourably towards us.§!\n\nPlanets will no longer get randomly destroyed and may instead get a massive production boost.\nBoons are now more likely."
 narrow_escape_archaeology.106.b: "Perhaps with this knowledge..."
 narrow_escape_archaeology.106.b.tooltip: "§HWe may be able to make it act more favourably towards us.§!\n\nPlanets will no longer get randomly destroyed and may instead get a massive production boost.\nBoons are now more likely.\n\nA new archaeological site is available."

