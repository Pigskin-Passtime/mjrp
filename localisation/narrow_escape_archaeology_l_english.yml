 narrow_escape_archaeology.2020.desc: "One of our expedition teams ran into spike traps and, unfortunately, got injured."
 narrow_escape_archaeology.2030.desc: "One of our expedition teams ran into arrow traps but, fortunately, managed to get through unharmed, and found some small trinkets."
 narrow_escape_archaeology.2040.desc: "An expedition team managed to find a small resource cache. This is bound to be useful."
 narrow_escape_archaeology.2050.desc: "An expedition team discovered a cryptic artifact. Despite the difficulty of doing so, they've managed to decode it, leading them closer to finding the answer to our questions."
 narrow_escape_archaeology.2060.desc: "An expedition team discovered a mysterious door following a series of branching paths. Upon opening it, they discovered several artifacts and other clues, which will surely be useful."
 narrow_escape_archaeology.2070.desc: "An expedition team managed to uncover a hidden door in one of the walls. Behind it was a room with various relics containing clues to navigating the maze-like paths."
