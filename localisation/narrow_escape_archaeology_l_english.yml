 site_narrow_escape_mysterious_moon: "Mysterious Moon"
 site_narrow_escape_mysterious_moon_desc: "Our homeworld has an interesting set of moons. It might be worth investigating."

 narrow_escape_archaeology.201.name: "Orbital Mechanics"
 narrow_escape_archaeology.201.desc: "For a celestial body to orbit a moon, orbitting a planet, is... unlikely. However this 'moonmoon' seems to be orbitting perfectly around the moon."
 narrow_escape_archaeology.201.a: "We have to investigate further"
 narrow_escape_archaeology.202.name: "Origin of the Moonmoon"
 narrow_escape_archaeology.202.desc: "All evidence points to this moon not having been here from the beginning. It is either a captured asteroid, or, more likely, been put here by a more advanced alien civilization."
 narrow_escape_archaeology.202.a: "Keep searching"
 narrow_escape_archaeology.203.name: "The Secret of the Moonmoon"
 narrow_escape_archaeology.203.desc: "From the looks of things, this seems to have been a 'secret base' for an alien civilization. Its purpose is not clear and, unfortunately, the civilization seems to have died off. The moon itself seems to be kept in orbit by an automated system and has enough energy to keep doing so for many millennia."
 narrow_escape_archaeology.203.a: "Amazing."

