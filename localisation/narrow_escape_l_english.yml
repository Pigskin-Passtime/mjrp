l_english:

  origin_narrow_escape: "Narrow Escape"
 origin_narrow_escape_desc: "§RWARNING: Challenging Origin§!\nThis civilization has had a slight headstart in discovering FTL technology. Unfortunately, with the discovery of FTL technology has also come the discovery of an imminent disaster on their homeworld.\n\nWith the cause and reason unknown, all attempts to prevent it have failed. As a last-ditch effort, they have scavenged the planet for all the resources it contains and evacuated from the planet onto several colony ships, in search of a new home."
 origin_tooltip_narrow_escape_effects: "- Species Trait: §YVersatile§!\n- Edict: §YColony Ship Consolidation§!\n- Start with a large amount of £basic_resources£ §YBasic Resources§!\n- Starting Ships:\n   - 2 £science_ship£ §YScience Ships§!\n   - 3 £colony_ship£ §YColony Ships§!\n   - 1 £construction_ship£ §YStarbase Constructor§!\n- Nearby Star Systems:\n   - Start partially explored\n   - Habitable worlds spawn further away\n- Initial Colonization:\n   - Increased £mod_empire_size_colonies_mult£ §YColonization Speed§!\n   - Reduced £mod_planet_building_build_speed_mult£ §YBuild Time§!\n   - Minor §YDevastation§!"
 origin_tooltip_narrow_escape_negative_effects: "§R- Any resource deficit will result in the destruction of your empire while you are lacking a colony§!\n- Start without a §YHomeworld§!\n- Starting Ships:\n   - No £construction_ship£ §YConstruction Ship§!\n   - No £military_ship£ §YMilitary Fleets§!"
 START_SCREEN_NARROW_ESCAPE: "Several decades ago, we discovered the hyperlane network, resulting in the creation of the Hyperdrive. Only recently have we developed the ability to build vessels capable of utilising such technology.\n\nHowever, shortly after the first exploration ships were built and left to explore other systems, we determined that [Root.Capital.GetName] was showing signs of instability, likely resulting in its eventual destruction. Without the cause or reason known, all attempts to prevent it were futile. In order for our civilisation to live on, we must take to the stars and look for a new world to settle.\n\nWe have scrounged our planet for resources and constructed several colony ships capable of settling our civilizsation on other planets. We don't have much time.\n\nWe must find a new home."

