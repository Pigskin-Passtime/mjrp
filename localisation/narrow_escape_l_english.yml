 narrow_escape.33.name: "A New Home"
 narrow_escape.33.desc: "Our colonists have completed the initial colonization of [This.GetName], which will serve as the forefront and great capital of our galactic nation.\n\nIt will house many [This.Owner.GetSpeciesNamePlural] as our old homeworld did, and it will grow to even surpass it. Future generations will never know the toil and turmoil faced by our people. As it should be.\n\nEager colonists and settlers have already begun construction of essential towns, districts and outposts. We should seize this opportunity to rapidly develop [This.GetName] to accomodate for our future."
 narrow_escape.33.a: "It is only the beginning."
 narrow_escape.34.name: "Frontier Colony Established"
 narrow_escape.34.desc: "Our colonists have completed the initial colonization of [This.GetName], which will serve as the second planet housing survivors of the destruction of our homeworld.\n\nThis world will house many [This.Owner.GetSpeciesNamePlural] as our old homeworld did, and tales will be told of those who survived the arduous journey between the stars.\n\nEager colonists and settlers have already begun construction of essential towns, districts and outposts. We should seize this opportunity to rapidly develop [This.GetName] to accomodate for our future."
 narrow_escape.34.a: "Now we are truly safe."
 narrow_escape.35.name: "$narrow_escape.34.name$"
 narrow_escape.35.desc: "Our colonists have completed the initial colonization of [This.GetName], which will serve as the third planet housing survivors of the destruction of our homeworld.\n\nThis world will house many [This.Owner.GetSpeciesNamePlural] as our old homeworld did, and tales will be told of those who survived the arduous journey between the stars.\n\nEager colonists and settlers have already begun construction of essential towns, districts and outposts. We should seize this opportunity to rapidly develop [This.GetName] to accomodate for our future."
 narrow_escape.35.a: "Great."
 narrow_escape.36.name: "Colony Finished"
 narrow_escape.36.desc: "We have finished colonizing another planet. Now, we just need to build it up."
 narrow_escape.36.a: "Great!"

