 narrow_escape.20.desc.a: "Our remaining Colony Ships house our entire species. They must colonize worlds to ensure our survival, though we are able to alter the population belonging to each ship if needed.\n\nShip estimates suggest that the population of each colony ship is as follows: §Y[Root.narrow_escape_origin_first_colony_pops]00§!, §Y[Root.narrow_escape_origin_second_colony_pops]00§!, §Y[Root.narrow_escape_origin_third_colony_pops]00§!. Overall, our ships collectively house §Y[Root.narrow_escape_origin_colony_pops_left]00§! Pops.\n\nOur next colony will house §Y[Root.narrow_escape_origin_first_colony_pops]00§! Pops intially, as it is vital to use our largest colony ships first."
