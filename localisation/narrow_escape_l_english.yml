l_english:

  origin_narrow_escape: "Narrow Escape"
 origin_narrow_escape_desc: "§RWARNING: Challenging Origin§!\nThis civilization has had a slight headstart in discovering FTL technology. Unfortunately, with the discovery of FTL technology has also come the discovery of an imminent disaster on their homeworld. With the cause and reason unknown, all attempts to prevent it have failed. As a last-ditch effort, they have scavenged the planet for all the resources it contains and evacuated all pops from the planet onto several colony ships, in search of a new habitable planet."
 origin_tooltip_narrow_escape_effects: "\n- Start with a large amount of resources\n- Starting Ships:\n   - §Y2§! §HScience Ships§!\n   - §Y3§! §HColony Ships§!\n   - §Y1§! §HStarbase Constructor§!\n- Nearby Star Systems:\n   - Start partially explored\n   - Habitable worlds spawn further away\n- Initial Colonisation:\n   - Greatly increased colonisation speed\n   - Reduced build time and cost\n   - Minor £devastation£ §HDevastation§!"
 origin_tooltip_narrow_escape_negative_effects: "§R- Any resource deficit will result in the destruction of your empire while you are lacking a colony§!- Start without a §HHomeworld§!\n- Starting Ships:\n   - No §HConstruction Ship§!\n   - No §HMilitary Fleets§!"
 START_SCREEN_NARROW_ESCAPE: "Several decades ago, we discovered the hyperlane network, resulting in the creation of the Hyperdrive. Only recently have we developed the ability to build vessels capable of utilising such technology.\n\nHowever, shortly after the first exploration ships were built and left to explore other systems, we determined that [Root.Capital.GetName] was showing signs of instability, likely resulting in its eventual destruction. Without the cause or reason known, all attempts to prevent it were futile. In order for our civilisation to live on, we must take to the stars and look for a new world to settle.\n\nWe have scrounged our planet for resources and constructed several colony ships capable of settling our civilizsation on other planets. We don't have much time.\n\nWe must find a new home."

