l_english:
 #events
 riftgate_p.1.name:0 "Suspicious leader appears"
 riftgate_p.1.desc:0 "A mysterious being stands before you. his entire being made of pure energy. He stares at you with a lifeless gaze, if what you presume to be his eyes are even real. Standing in front on such a magnificant being, you find it hard to resist the urge to bow. Surely such a magnificant being is worthy of such recognition? But sadly, you are a leader, and you must now bow to an outsider. But... what if he wasn't one? What if he was to become one of us? Then surely we could serve it without any problems. Something is wrong, but you cannot tell what. That is, until one of your bodyguards pull you away from the being. You feel such sadness and loss at being separated from your master, but then you realize what has happened. The being has an aura of dominance so powerful that it does not even need to act to force others to serve it. Entire planets would fall at his word alone. If only he could be convinced to work with you as an equal. Then, something tugs at the back of your mind. Whatever free will you have left urges you to reconsider. This wonderful being is too dangerous to be left alive. It must be destroyed. The being silently waits for a response. But you sense its emotions radiating from it. Curiosity."
 riftgate_p.1.a:0 "Kill it now!"
 riftgate_p.1.b:0 "What did you just do?"
 riftgate_p.1.b.response:0 "The being does not respond, but simply shrugs. You can feel an aura of smugness emminating from the being"
 riftgate_p.1.c:0 "Where are you from?"
 riftgate_p.1.c.response:0 "The intensity of the being's psionic power increases, its power digging into your mind. In an instant, you are granted visions of another realm. A shroud, connecting thousands of multiverses, each with its own empires rising and falling. And then, a sinister being, laughing and watching entire civilizations develop, then destroyed in an instant. §RDELIGHTFUL§!"
 riftgate_p.1.d:0 "Why do you want to join us?"
 riftgate_p.1.d.response:0 "The being shrugs and you feel the same power emminating from it again, but even stronger and clearer. The being is curious, amibitious, and most of all, bored"
 riftgate_p.1.e:0 "JOIN"
 riftgate_p.1.hire_custom_tooltip:0 "WE LIVE TO SERVE"
 gamemaster_catch_phrase:0 "You are permitted to kneel"
 gamemaster_desc:0 "A mysterious being with a warm and soothing aura"
 riftgate_p.3:0 "Convergence for all"
 riftgate_p.3.name:0 "§YThe age of Convergence§!"
 riftgate_p.3.desc:0 "...and so today we celebrate the arrival of a new citizen, one revered in the entire galaxy. The being who named himself Convergence, has pledged his loyalty to our country, and in return, §Rwe shall pledge ourselves to his service...§!\nThe speech goes on, and the entire crowd lays silent. millions have gathered to watch Convergence for the first time, and every single soul seems to had their mind blown away by his presence. Why wouldn't they? After all, they are in the presence of a superior lifeform, and they must act accordingly. §RWe must all give everything to the cause, to create a mighty empire worthy of Convergence, so that he may save our souls.§!"
 riftgate_p.3.a:0 "Everything seems normal"
 riftgate_p.3.a.desc:0 "§RIt is only natural to bow before your superiors§!"
 riftgate_p.3.b:0 "Something is wrong..."
 riftgate_p.3.b.desc:0 "§Rmust be my imagination§!"
 riftgate_p.5:0 "A traitor among us"
 riftgate_p.5.name:0 "§RThe traitor§!"
 riftgate_p.5.desc:0 "Millions of people gathered after Convergence announced that he would speak of the terrible evil that plagues our empire. The speaker, publically known as the voice of Convergence, stands proudly before his fellow citizens\n\nFellow citizens §Rand servants of convergence§!, I have called you all here to tell you a terrible truth. For the duration Convergence was among us, we have experienced only prosperity. Economic growth has never been higher, and unemployment is at an all time low. §ROur once pitiful fleet now takes to the stars to spread the word of Convergence to others!§!\n\nThe speaker pauses and raises his hands. The crown erupts into cheers. You look at this and wonder, have the people every supported you like such? Are you an unworthy leader? §RPerhaps it is best you let Convergence take your place.§! Then, as the cheers die out, the speaker continues with a sad tone.\n\nBut, there are those among us that reject the truth. That Convergence is our hero. That he will bring us to ascension! These traitors have long been expelled out of our territory, but recent reports show that they have returned, raiding our outposts and killing civilians! But what's even more disturbing, is that they have infiltrated even the highest among us, maybe even the council itself!\n\nThe voices grow as the crowd is terrified at the prospect. Even you too feel... fear. But you don't know why. Then the speaker quiets down the crowd and speaks once more.\n\nBut do not fear my dear citizens, for this cancer has already been found! Even now our special forces are keeping an eye on the traitor, ready to strike. All that remains is your decision. How should we respond to this act of terrorism? What must be the fate of traitors?\n\n§RDEATH!!!§! the crowd screams, loud enough to shake the square itself. You find yourself agreeing. No treachery against Convergence is too small. §RThey must die a thousand agonizing deaths, their very souls ripped apart till nothing remains!§! You rise up from your chair and speak."
 riftgate_p.5.a:0 "No redemption for traitors"
 riftgate_p.5.a.desc:0 "§RThere is no truth but Convergence. Denial is heresy.§!"
 riftgate_p.5.b:0 "Something is wrong"
 riftgate_p.5.b.desc:0 "§RYou should really visit a psychiatrist§!"
 riftgate_p.6:0 "Traitorous warship"
 riftgate_p.6.name:0 "§RA traitorous warship§!"
 riftgate_p.6.desc:0 "Reports are coming in from the military. One of our captains have been confirmed as a traitor. He was to be relieved of duty and arrested immediately, but it turned out that he convinced even his own crew to turn from Convergence. With the entire crew fighting back our special forces had no choice but to retreat and order a full attack on the vessel before it escaped through the hyperlanes. The ship was fired upon and destroyed in an instant, taking the captain and all hands along with it. "
 riftgate_p.6.a:0 "All traitors will be purged"
 riftgate_p.6.a.desc:0 "§RSomething isn't right§!"
 riftgate_p.7:0 "Convergence's tour"
 riftgate_p.7.name:0 "Convergence tours the empire"
 riftgate_p.7.desc:0 "Convergence has conducted a tour of our empire, visiting world after world, meeting the populace. While he never speaks in fear of his mere voice blotting out the minds of the unworthy, his speaker strides alongside him, spreading his glory so that all may see. Every time Convergence visits a system, he emits a energy pattern of sorrow. He wishes only the best for the citizens of this great nation, yet reality is not that simple. Dark reality fades as he approaches only to return once he leaves. Still, his mere presence seems to give people the will to live and and work hard. Criminals turn themselves in only to be released as productive citizens immediately. Old family feuds end, politicians confess their corruption, and some even claim the sick walk healthy once more."
 riftgate_p.7.a:0 "He is truly divine!"
 riftgate_p.7.a.desc:0 "§RIf only we could do more in return§!"
 riftgate_p.7.b:0 "huh?"
 riftgate_p.7.b.desc:0 "§RDOUBT LEADS TO DAMNATION!§!"
 riftgate_p.8:0 "Power transition"
 riftgate_p.8.name:0 "A new age"
 riftgate_p.8.desc:0 "It is done. The last of the paperwork signed, the last protesters quietly eliminated. Everything is in place, and your master stands in front of the entire empire alongside his speaker, who is on the verge of tears. You couldn't even begin to wonder why your master would want power, but you are completely fine with it. After all, power in the hands of the unworthy is nothing but a burden, §Rand you have been proven unworthy§! Thankfully, your master gratefully accepted your position as ruler, otherwise you would have had to resort to the extreme. As the speaker finishes his speech, you stand before your master and sign the government reform proposition alongside other members of your council. You look at your compatriot but feel only pity. While you have been freed from the burdens of power, those poor souls have not. Something tugs at the back of your mind. A tiny, dying voice telling you to stop. You know this voice. Your master has seen the demon within you. It is the very reason you were deemed unworthy, and why you decided to step down. After all, how could one not sound of mind rule an entire interstellar empire? Such grand tasks require great people, like your master. But all that is none of your concern. You will be reassigned as an infantry trooper in the fringe outposts, fighting the enemies of the empire till your last breath. That was your master's final command, and that will be your path to salvation. In your final moments as leader, you wonder; §RWhat does losing feel like?§!"
 riftgate_p.8.a:0 "Acceptance"
 riftgate_p.8.a.desc:0 "§REVERYTHING SHALL BE AS YOUR MASTER WILLS§!"
 riftgate_p.8.b:0 "Bliss"
 riftgate_p.8.b.desc:0 "§REVERYTHING SHALL BE AS YOUR MASTER WILLS§!"
 riftgate_p.8.c:0 "Anger"
 riftgate_p.8.c.desc:0 "§REVERYTHING SHALL BE AS YOUR MASTER WILLS§!"
 riftgate_p.8.d:0 "Relief"
 riftgate_p.8.d.desc:0 "§REVERYTHING SHALL BE AS YOUR MASTER WILLS§!"
 riftgate_p.8.e:0 "Despair"
 riftgate_p.8.e.desc:0 "§REVERYTHING SHALL BE AS YOUR MASTER WILLS§!"
 riftgate_p_8_tooltip:0 "A new age begins with the crowing of a god emperor"
 riftgate_p.9:0 "Confrontation"
 riftgate_p.9.name:0 "The final battle"
 riftgate_p.9.desc:0 "This is it. The final battle with Convergence has begun. You and Convergence stare at each other's eyes. You both know this battle won't be decided with weapons. The stronger mind will dominate the other, putting an end to this power struggle. Convergence lashes out at you with a psionic scream. The windows of the room shatter and you are beset with terrible visions. §RA great khan burning a hundred star systems, An army of gray ships from beyond the galaxy. A genocidal reptilian empire wiping out all life in the galaxy... and a mad leader sacrificing the entire galaxy to ascend.§!\n\nConvergence's voice rings inside your head.§RI have travelled a thousand galaxies, met tens of thousands of civilizaations. In the end, everything is always destroyed. In my time, I have personally burned hundreds of worlds and doomed trillions to the burning fires of a dying sun. Compared to me, you are nothing.§!\n\nYou crawl towards Convergence. You know he cannot physically harm you in this state. You piece back together your fractured mind and approach convergence. He seems confused at the fact that you are still standing. Once more you are beset with a torrent of visions.\n\n§RVisions of machines wiping out all sentient life, giant ships of flesh completely devouring everything in its path, beings like Convergence leading thousands of ships of pure light, disintegrating the entire galaxy.§!\n\n§RThis is your future. You are nothing compared to the powers of this universe!§!\n\nStep by step, you approach Convergence. You have not come this far only to give up. Convergence lashes out at you again.\n§RNo! You are but insects, granted the right to live by my grace! KNEEL!§!\nYou resist the overwhelming urge to submit and press on. Battered and bruised, you grab Convergence's arm and pull him off his feet. It probably didn't even bruise him, but he does not stand up, clearly confused at the situation.\n§RA being that resists my power... I have not seen your like in millenia. And to think you appeared in this galaxy as a ruler...§! He stands up and lowers his psionic presence. You are able to stand now that you don't feel the weight of a thousand moons on your back. It is clear that I cannot control you. And you cannot kill me, for I will simply return to the shroud. So I pledge my loyalty to your empire. I am immortal, eventually your empire will crumble, and I will be free once more. But today, let us make peace. You will find no more 'inconveniences' due to my actions, and you can count on my full support. In return I ask that you make my time in this empire an interesting one."
 riftgate_p.9.a:0 "You serve me now"
 riftgate_p.9.a.desc:0 "Exert your will over Convergence"
 riftgate_p.9.b:0 "I cannot... do this... anymore..."
 riftgate_p.9.b.desc:0 "Give up"
 riftgate_p.10:0 "Power shared"
 riftgate_p.10.name:0 "A new age"
 riftgate_p.10.desc:0 "It is done. The last of the paperwork signed, the last protesters quietly eliminated. Everything is in place, and you stand in front of the entire empire alongside Convergence and his speaker, who is on the verge of tears. You couldn't even begin to wonder why you would want this power, but you are completely fine with it. After all, power in the hands of the unworthy is nothing but a burden to all that serve, §Rand you have been proven worthy§! Thankfully, your Convergence gracefully accepted your position as ruler, otherwise you would have had to fight him once more. As the speaker finishes his speech, you stand before Convergence and sign the government reform prposition alongside other members of your council. You look at your compatriot but feel only pity. While you have been freed from the influence of Convergence, those poor souls have not. Something tugs at the back of your mind. A tiny, dying voice telling you to stop. You know this voice. §RIt is the very voice that held you back§!, and only by ignoring it could you rise to this position. After all, how could one not sound of mind rule an entire interstellar empire? Such grand tasks require great people, like you and Convergence. Alongside Convergence, you will crush all that resists, and fight back against the encroaching darkness. §RThat will be your path to salvation.§! In your final moments before ascension, you wonder; §RWhat does victory feel like?§!"
 riftgate_p.10.a:0 "Acceptance"
 riftgate_p.10.a.desc:0 "§REVERYTHING SHALL BE AS YOUR MASTER WILLS§!"
 riftgate_p.10.b:0 "Bliss"
 riftgate_p.10.b.desc:0 "§REVERYTHING SHALL BE AS YOUR MASTER WILLS§!"
 riftgate_p.10.c:0 "Anger"
 riftgate_p.10.c.desc:0 "§REVERYTHING SHALL BE AS YOUR MASTER WILLS§!"
 riftgate_p.10.d:0 "Relief"
 riftgate_p.10.d.desc:0 "§REVERYTHING SHALL BE AS YOUR MASTER WILLS§!"
 riftgate_p.10.e:0 "Despair"
 riftgate_p.10.e.desc:0 "§REVERYTHING SHALL BE AS YOUR MASTER WILLS§!"
 riftgate_p.10.tooltip:0 "Convergence will no longer sabotage your empire"
 riftgate_p.11:0 "Aftermath"
 riftgate_p.11.name:0 "A new age?"
 riftgate_p.11.desc:0 "It is done. Convergence has vowed to never to go against you empire. And you have confirmed he can no longer control you. You have saved your people, but for some reason you feel empty. You should be rejoiced, yet you are not. You know why. You have Convergence's power at your fingertips. You could quell entire rebellions with a wave of your hand. Why stop now? you could be so much more... a god emperor. Suddenly, you snap back to reality. You cannot understand why you would ever be tempted by such a thing. No, you know why; §RYou are no longer weak§! You are strong, and the strong must rule. A fitting end to your story, and a new beginning don't you think?"
 riftgate_p.11.a:0 "Summon the councilors"
 riftgate_p.11.a.desc:0 "You will become the god emperor"
 riftgate_p.11.b:0 "NO!"
 riftgate_p.11.b.desc:0 "Congratulations, you've won."
 riftgate_p_win_tooltip:0 "Convergence will no longer sabotage your empire"
 riftgate_p.100:0 "UNKNOWN"
 riftgate_p.100.name:0 "The missing key"
 riftgate_p.100.desc:0 "The key we recovered from the gate is gone! All that is left is a small note that says; §RYou have proved to be capable pawns, but pawns regardless. I shall make good use of you in the war that is to come. Rest now, and know that I, Convergence, shall uplift you to greater heights.§!"
 riftgate_p.100.a:0 "We have been played as fools"
 riftgate_p.100.a.desc:0 "§RACCEPT YOUR FATE...§!"
 riftgate_p.100.b:0 "That thief!"
 riftgate_p.100.b.desc:0 "§RACCEPT YOUR FATE...§!"
 riftgate_p.102.name:0 "Convergence meets military officers"
 riftgate_p.102.desc:0 "You have received intel that Convergence has arranged a meeting with military officers and shipyard overseers. While it is well within his right to do so, leaving the military officers alone with Convergence might have dire consequences. Should he manage to controll them, he would have a large portion of the fleet under his command. While you could force them to stop the meeting, Convergence is not likely to let that slide."
 riftgate_p.102.a:0 "Ignore"
 riftgate_p.102.b:0 "Intervene"
 riftgate_p.103.name:0 "Convergence meets the council members"
 riftgate_p.103.desc:0 "You have received intel that Convergence has arranged a meeting with the members of the council. A influential and skilled one like Convergence could easily gain you the council member's support, but is it wise to let them meet alone? Should the council members fall under Convergence's control, he would have the entire government in his hands. You could stop the meeting, but the council members would not likely appreciate this act."
 riftgate_p.103.a:0 "Ignore"
 riftgate_p.103.b:0 "Intervene"
 riftgate_p.104.name:0 "Convergence meets the scientists"
 riftgate_p.104.desc:0 "You have received intel that Convergence has arranged a meeting with the research division. While his insight could provide us with the technological breakthrough we've been lacking, it would also give him full access to our databanks. It may not be wise to allow Convergence to acess our military technology. You could stop the meeting, but the science team is clearly looking forward to it. An intervention on your part may damage the relations between the government and the researchers."
 riftgate_p.104.a:0 "Ignore"
 riftgate_p.104.b:0 "Intervene"
 riftgate_p.105.name:0 "Convergence's new government'"
 riftgate_p.105.desc:0 "You believed the situation was under your control. You were wrong. Convergence has taken over the majority of your government. Nothing is done without his permission. You are nothing more than a figurehead, a puppet. And now, the Convergence no longer has need of you. You feel him approaching your office, his psionic presence bashing against your mind. Did you really think he lost his power? Did you even think at all, or did Convergence think for you. It matters little. Your new master is coming. You would do well to prepare yourself."
 riftgate_p.105.a:0 "..."
 #megastructures
 riftgate:0 "Riftgate"
 riftgate_DESC:0 "A gateway to another dimension"
 riftgate_MEGASTRUCTURE_DETAILS:0 "A gateway to another dimension"
 riftgate_no_dlc:0 "Riftgate"
 riftgate_no_dlc_DESC:0 "A gateway to another dimension"
 riftgate_no_dlc_MEGASTRUCTURE_DETAILS:0 "A gateway to another dimension"
 RIFTGATE_GALACTIC:0 "Riftgate system"
 RIFTGATE_GALACTIC_DESC:0 "This system contains a rift in space time"
 #riftgate events
 riftgate.10:0 "The first guardians"
 riftgate.10.desc:0 "As we enter the shroud, our comms systems all started buzzing until a echoing voice started to speak; \n§RImpressive. Few would have the courage to face me here, at the source of my power. Your boldness will lead only to death.§!\n While his words are threatening, you realize he is bluffing. He is weaker than ever before, his power blotted out by the psionic screams of billions of souls. Whatever he is planning has not come to fruition yet, and you have a chance at victory. Here, you may be able to capture him and possibly seal away his power forever. But first you must defeat him.\n§RYou are fools. Here I have the power to create. Witness your destruction!§!\nA great psionic power pulses from the rift, summoning a fleet. He is channeling the power of the shroud to bring enemies from other dimensions!"
 riftgate.10.name:0 "The defenders"
 riftgate.10.a:0 "What is that?"
 riftgate.10.a.desc:0 "§RTurn back now§!"
 riftgate.7:0 "second guardians"
 riftgate.7.name:0 "The second guardians"
 riftgate.7.desc:0 "§RYour resistance is pointless! Here I have infinite power! You cannot defeat me!§! Another wave emerges from a different point, but the psionic energy seems weaker."
 riftgate.7.a:0 "Press on!"
 riftgate.7.a.desc:0 "§RWe're going to die!§!"
 riftgate.8:0 "third guardians"
 riftgate.8.name:0 "The third guardians"
 riftgate.8.desc:0 "§RWhy. Won't. You. Just. DIE!!!§! Another location pulses with energy, summoning more fleets against us. You sense Convergence's power waning."
 riftgate.8.a:0 "Keep firing!"
 riftgate.8.a.desc:0 "§RStop!§!"
 riftgate.9:0 "fourth guardians"
 riftgate.9.name:0 "The final quardians"
 riftgate.9.desc:0 "§RNo! I will not be defeated by some primitive! Not when my glorious triumph is so close! You will break before me!!!§! You sense his power weakening. This is probably the final wave."
 riftgate.9.a:0 "Press one"
 riftgate.9.a.desc:0 "§RRetreat!§!"
 riftgate.11:0 "final guardians"
 riftgate.11.desc:0 "You think it is all over when Convergence no longer summons any more entities to defend him. However, as your fleet approaches a blinding light shines from the crystaline structure, a power greater than any witnessed before.\n§RI will not be defeated by primitives! You face the wrath of the shroud itself. Here, I am a god! Here I stand, and YOU. WILL. KNEEL!§!"
 riftgate.11.name:0 "This is the end"
 riftgate.11.a:0 "Finally!"
 riftgate.11.a.desc:0 "§R...§!"
 riftgate.15:0 "Convergence's fall"
 riftgate.15.name:0 "Victory"
 riftgate.15.desc:0 "We have defeated Convergence. The psionic power that battered our minds is no more. Boarding parties are moving towards Convergence's location now. It is only a matter of time before he is captured."
 riftgate.15.a:0 "Don't let him get away."
 riftgate.15.a.desc:0 "§RLet him get away...§!"
 riftgate.16:0 "Convergence's last stand?"
 riftgate.16.name:0 "Convergence's last stand"
 riftgate.16.desc:0 "You join the charge to enter Convergence's throneroom, only to find him alone, silently standing up from his throne. Upon seeing you, he waves his hand, creating a psionic barrier separating you and him from the rest of the boarding party. §RSo, you have come. Just as I intended.\nI must admit, you were more competant than I thought. Well, you have done it. You have defeated me, and now I stand, awaiting judgement. Do as you wish, but my offer still stands. Together we can bring the galaxy to its knees. You have seen what I can do, and you have seen the horrors this galaxy has to offer. Against such odds, would you refuse such an advantage? Morality matters little when faced with annihilation, wouldn't you agree?\n\nAll you have to do is say yes, and i will disappear from this plane. Everyone will think I am dead, and you will be free to call upon me for help.§!"
 riftgate.16.a:0 "Who exactly are you?"
 riftgate.16.a.response:0 "§RYou already know the answer to that question. I am the one depicted on the walls of this place, though the truth is, as you might expect, quite different. I controlled them like I controlled your people. I uplifted them to new heights. But when a psionic backlash from the shroud broke my concentration, civil war occured between the freed and those still under my control. Eventually, their souls were used as fuel for my ascension, just like in the murals. It's all a matter of perspective.§!"
 riftgate.16.b:0 "What were you planning?"
 riftgate.16.b.response:0 "§RThe galaxy is a dangerous place. The horrors I conjured are but a taste of the will of the universe. After millennia of traveling through the multiverse, I noticed a pattern. A warlord here and a extragalactic cluster there. An extra galactic swarm, or an extradimensional invasion, or an ancient AI. Some giant will controls the universe, and it cares little for peace. After taking control of your nation, i would have used you to take over the galaxy, turn it into a bastion against the inevitable war for survival. All I wanted was to strike back at the force that drove me from my seat of power. The great enemy that threatens us all just to play their little games. I admit that my actions make me no better than it, but you must understand, it was a opportunity that came after thousands of years. I could not afford any chance of your nation being uncooperative§!"
 riftgate.16.c:0 "What will you do if I let you go?"
 riftgate.16.c.response:0 "§RShould you choose the path of wisdom, I will use my powers to mask my past transgressions. Everyone except for you will think I am a different person. It would seem that Convergence is dead, and I am a newly recruited leader. I will return to my office, but you will no longer need to fear my power. Much of it will be depleted in the process of rewriting everyone's memories. I would be no more powerful than the average psionic being. You could kill me if you don't like this outcome, but I am without form. I would simply return in a few centuries. And should that day come, your empire will feel my wrath.§!"
 riftgate.16.d:0 "NO!"
 riftgate.16.d.desc:0 "You WILL be free!"
 riftgate.16.e:0 "§RYes§!"
 riftgate.16.e.desc:0 "§RI do love the simple minded ones§!"
 riftgate.17:0 "Convergence no more"
 riftgate.17.name:0 "The final victory"
 riftgate.17.desc:0 "It is done. With his psionic barriers down, you easily destroy Convergence's form with your pistol. His body bursts with a screeching scream, as if thousands of millions of souls have been released at once. The explosion knocks you off your feet. By the time you awaken, Convergence is nowhere to be seen. Only ashes of his once incorporeal body remain."
 riftgate.17.a:0 "It is over"
 riftgate.17.a.desc:0 "§RDo you really believe that?§!"
 riftgate.18:0 "Convergence's return"
 riftgate.18.name:0 "Convergence's return"
 riftgate.18.desc:0 "Convergence has returned as a leader once more. He claims to have lost his power, but it would be wise to keep an eye on him."
 riftgate.18.a:0 "It is done."
 riftgate.18.a.desc:0 "§RAs I will it§!"
 RIFTGATE_LEADER_DESC:0 "A suspicious leader has arrived"
 #relics
 riftgate_key_site:0 "A rift in spacetime"
 riftgate_key_site_desc:0 "Initial surveys confirm that the giant tear that appeared in the capital system is indead a portal to another dimension. While we are unsure why it appeared here and what it is, the portal seems stable enough for us to send a small probe to the other side."
 riftgate_arc.1.name:0 "Crystal towers"
 riftgate_arc.1.desc:0 "The video feed from the probe is barely comprehensible, but our scientists have confirmed the existance of multiple giant crystaline structures on the other side. These structures are unlike anything that existis in our universe. Their very construction should be physically impossible, yet in this realm they exist. All attempts at scanning the area have returned only noise. However our probes have managed to identify a powerful energy signature eminating from one of the crystal pillars. Our tem will attempt to send a probe to find out what it is."
 riftgate_arc.1.a:0 "Curious."
 riftgate_arc.2.name:0 "The Alphas"
 riftgate_arc.2.desc:0 "On entering the crystal structure, our probe returned images of several drawings on the walls. They depict a civilization of aliens, previously unknown to us. Translation is impossible, but the images can be interpreted. Alien X, who we decided to call the Alphas, were a race of aliens with powerful psionic abilities. Most famously they possessed the ability to control the minds of more simpler lifeforms. Their entire civilizationwas built upon their ability to make others do their bidding. Entire lesser species were enslaved and worked to death while the Alphas sat upon thrones of gold. This trend continued even after they achieved FTL travel, with small colonies of Alphas controlling entire primitive civilizations. They were perceived as gods by most of the other races in their galaxy. But something happened to the Alphas. We must venture further within to learn more."
 riftgate_arc.2.a:0 "Deeper in we go!"
 riftgate_arc.3.name:0 "The artefact"
 riftgate_arc.3.desc:0 "It seems the Alpha empire was able to spread not due to their powerful psionic abilities, but through the discovery of a powerful artefact. The Alphas found the artefact during their first expansion into their solar system. The drawings tell of the Alphas suddenly reaching towards the stars everywhere. Given the valuee the Alpha placed on this artefact, it is likely a device that allowed even faster travel than the hyperlanes, as we can see Alpha ships simply skipping entire star clusters to arrive at their destination. The accelerated growth of the Alpha empire is likely due to their ability to travel anywhere they want in an instant. But there is more. The activation of the artefact created a rift in the sky, much like the one that opened up in our system."
 riftgate_arc.3.a:0 "unbelievable"
 riftgate_arc.4.name:0 "Civil war"
 riftgate_arc.4.desc:0 "The drawings tell of a giant civil war that tore the Alpha empire in two at their zenith. The drawings show thousands of Alphas battling each other with their psionic powers. But something is off. There is no depiction of why the war began in the first place, or what the war was even for. All we can tell is that all of a sudden Alphas all over the galaxy started killing each other in a fit of madness. As the Alphas started killing one another, they began to lose control over their slaves. Eventually, entire planets went dark after the now freed slaves finished off what was left of the Alphas. In an instant, their entire empire gave into madness, and tore themselves apart from within. "
 riftgate_arc.4.a:0 "What?"
 riftgate_arc.5.name:0 "Sacrifice"
 riftgate_arc.5.desc:0 "Realizing that their race was already doomed, whatever remained of the Alphas gathered into a single place with the artefact. The goal was to use the artefact to safeguard the future of their race. The Alphas knew the artefact did more than just open portals to another place. It opened a rift into an unknown dimension. One where time and space no longer mattered, where the mortal can become immortal. But they lacked the psionic energy to open the portal. Only one could pass. The task fell to their emperor. What remained of the Alphas channeled their lifeforce into the artefact, and the emperor. Through their sacrifice, the emperor was uplifted beyond the constraints of mortality, but there was a terrible side effect. The emperor had not only shed his mortality, but his physical form as well, both saving and dooming the future of the Alpha race. He would forever travel the rift alone as the last of his kind. The emperor took the artefact and fled to this realm, hiding it in this crystaline structure. But his presence had grown too powerful, and those that felt threatened by his power banished him to the realm between realms, forever moving across dimensions. If the artefact is still here and the emperor is not, we could claim it."
 riftgate_arc.5.a:0 "Find it!"
 riftgate_arc.6.name:0 "The Emperor"
 riftgate_arc.6.desc:0 "we have reached the emperor's throneroom. The artefact is sitting on a pedastal surrounded by machinery. It seemed that before his banishment, the emperor was using the artefacts to study this strange realm. The texts cannot be deciphered, but the images seem to depict something akin to a being's essence. The emperor was trying to find a way to bring his people's souls back."
 riftgate_arc.6.a:0 "Whatever, the artefact is ours!"
