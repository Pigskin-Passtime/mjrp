 # ----------------- phase 1 ---------------
  # Fake anomaly 1
  chronotec_narrative.1001.name:0 "$chronotec_fake_anomaly_strange_energy$"
  chronotec_narrative.1001.desc:0 "After a thoroughly study, we have concluded our sensors were right... but also they were not; a strange anomaly is present on the object, but at the same time it's impossible the signal is transmitted or received in any regard.\nSomehow, the object is in a state of emission and inertia that is, relatively speaking, impossible."
  chronotec_narrative.1001.a:0 "What can this mean?"
  chronotec_narrative.1001.a.tooltip:0 "An anomaly like this can be an indication of something that may happen soon..."

  # Fake anomaly 2
  chronotec_narrative.1002.name:0 "$chronotec_fake_anomaly_strange_resonance$"
  chronotec_narrative.1002.desc:0 "After a throughly study, the resonance of the star corona have been deemed impossible.\nThe radiation emissions are just coming from nowhere, we have identified the same energy as the star but the source is not the star.\nOf course this is, based on our understanding of physics, impossible."
  chronotec_narrative.1002.a:0 "What can this mean?"
  chronotec_narrative.1002.a.tooltip:0 "An anomaly like this can be an indication of something that may happen soon..."

  # Fake anomaly 3
  chronotec_narrative.1003.name:0 "$chronotec_fake_anomaly_strange_planet$"
  chronotec_narrative.1003.desc:0 "A myriad of tests have been done regarding these readings and all led us to the same conclusion:\nThe emanations are, of course, from the studied body, but definitively they aren't being produced by that celestial body, which has no scientific sense."
  chronotec_narrative.1003.a:0 "What can this mean?"
  chronotec_narrative.1003.a.tooltip:0 "An anomaly like this can be an indication of something that may happen soon..."

  # Fake anomaly 4
  chronotec_narrative.1004.name:0 "$chronotec_fake_anomaly_strange_system$"
  chronotec_narrative.1004.desc:0 "We have discarded a thousand different calculations regarding the interferences because, somehow, they make no sense; They are indeed produced by the System star, but at the same time there is no projection or emanation from the star, nor any close body. This is, in all regards, impossible."
  chronotec_narrative.1004.a:0 "What can this mean?"
  chronotec_narrative.1004.a.tooltip:0 "An anomaly like this can be an indication of something that may happen soon..."

  ## Fake anomaly 5
  #chronotec_narrative.15.name:0 ""
  #chronotec_narrative.15.desc:0 """
  #chronotec_narrative.15.a:0 ""
  #chronotec_narrative.15.a.tooltip:0 ""

  # Scar appears (20) (rift vs situation)
  chronotec_narrative.20.name:0 "Timeless Scar"
  chronotec_narrative.20.desc:0 "Seems the anomalies on the [From.GetStarName] System were not impossible as we thought! An incredible powersppike of energy was succeeded by an apparent time-space anomaly, a ... scar of sorts.\nWe estimate being able to obtain more information about the anomalous findings if we dedicate some of our research efforts towards it."
  chronotec_narrative.20.a:0 "Study this anomaly carefully"
  chronotec_narrative.20.a.tooltip:0 "Starts the §Y$situation_chronotec_study_scar$§! Situation to inspect and analyze the scar without direct intervention."
  chronotec_narrative.20.b:0 "We must seize the opportunity!"
  chronotec_narrative.20.b.tooltip:0 "Starts the §Y$project_chronotec_unseal_the_scar$§! special project, to further open and study the Astral Scar."

  # Situation
  chronotec_narrative.21100.name:0 "Timeless Scar"
  chronotec_narrative.21100.desc:0 "The time-space wound pulsates with constant energy, in different states than even the ones we can register with our technology.\nThe nature of these emissions is periodic but it seems to be accelerating and decelerating based on an arbitrary pattern, which maybe we can take advantage of to further discover the secrets laying behind it."
  chronotec_narrative.21100.a:0 "Study it passively"
  chronotec_narrative.21100.a.tooltip:0 "Change approach"
  chronotec_narrative.21100.b:0 "Try to decipher its secrets!"
  chronotec_narrative.21100.b.tooltip:0 "Change approach"
  chronotec_narrative.21100.c:0 "This is not worth our effort..."
  chronotec_narrative.21100.c.tooltip:0 "Change approach"

    chronotec_narrative.21110.name:0 "Severed Connection"
    chronotec_narrative.21110.desc:0 "The scar is starting to close, as the emissions are taking longer and longer after each wave... we calculate it could stop projecting energy and information in less than a year at this rhythm."
    chronotec_narrative.21110.a:0 "Disappointing..."
    chronotec_narrative.21110.a.tooltip:0 "TO DO"

    chronotec_narrative.21120.name:0 "Flickering Away"
    chronotec_narrative.21120.desc:0 "The cadence of energy flux and waves is starting to diminish, as if the scar was already exhausted or maybe not enough observed - This is carrying important repercussions on our study as we now can't predict where the energy waves are coming form, or what purpose they have."
    chronotec_narrative.21120.a:0 "Perhaps we should change our approach..."
    chronotec_narrative.21120.a.tooltip:0 "TO DO"

    chronotec_narrative.21140.name:0 "Losing Opportunities"
    chronotec_narrative.21140.desc:0 "Somehow the latter energy waves have passed inadvertently to our sensors; this loss of data may hurt the study of the Scar..."
    chronotec_narrative.21140.a:0 "A shame..."
    chronotec_narrative.21140.a.tooltip:0 "TO DO"

    chronotec_narrative.21160.name:0 "Closer, Closer"
    chronotec_narrative.21160.desc:0 "The signal tuning with the Scar projections has been a success! We have already monitored a way to control when and what will be generated, and with this semi-predictive model we can try to delve deeper into it."
    chronotec_narrative.21160.a:0 "We must continue!"
    chronotec_narrative.21160.a.tooltip:0 "TO DO"

    chronotec_narrative.21180.name:0 "A Matter of Seconds"
    chronotec_narrative.21180.desc:0 "After a thoughtful analysis of the waves we have discover not only the energy projected has no true physically based source, but it is also influenced by time! This also explains the anomalies, partially, as the emissions were done from a different time or even parallel timeline! We will develop a system to mirror them to see what we can earn from this discovery."
    chronotec_narrative.21180.a:0 "Take all the time you need!"
    chronotec_narrative.21180.a.tooltip:0 "TO DO"

    chronotec_narrative.21190.name:0 "Grasping Time"
    chronotec_narrative.21190.desc:0 "It is done! We have been able to fully understand how the waves of space-time bending energy are generated and we have theorized we can synchronize them with a special emitter to mirror the waves.\nWe don't know what consequences this may have but we theorize it should be safe to experiment with."
    chronotec_narrative.21190.a:0 "Continue, we may discover something incredible..."
    chronotec_narrative.21190.a.tooltip:0 "TO DO"
  # > 21120

  # Rift
  chronotec_narrative.22000.name:0 "TO DO"
  chronotec_narrative.22000.desc:0 "TO DO"
  chronotec_narrative.22000.a:0 "TO DO"
  chronotec_narrative.22000.a.tooltip:0 "TO DO"

  # > 21220

  # Situation failed
  chronotec_narrative.2502.name:0 "Overtime is Over"
  chronotec_narrative.2502.desc:0 "After all the effort... we have lost the track of the emmissions of the rift and it now lays inert, projecting nominal radiation but ... something has been lost.\nWe should had analyzed it deeper and made bigger efforts but now seems we lost this opportunity."
  chronotec_narrative.2502.a:0 "At least we learned something today..."
  chronotec_narrative.2502.a.tooltip:0 "TO DO"

  # System is created
  chronotec_narrative.2501.name:0 "A Stranded System"
  chronotec_narrative.2501.desc:0 "A big energy emanation was created the moment we synchronized the rift energy with our technology and the result is... incredible.\nA whole system was generated through the Scar, projecting an impossible amount of energy into tailoring a new hyperlane that we have registered in our cartographic data.\nWe should check it as soon as possible."
  chronotec_narrative.2501.a:0 "Incredible yet certain, we must hurry."
  chronotec_narrative.2501.a.tooltip:0 "A System has been create adjacent to the Scar."
 # /
 # ----------------- phase 2 ---------------
  # Timelooped planet surveyed, adds digsite
  chronotec_narrative.26.name:0 "Stranded In Time"
  chronotec_narrative.26.desc:0 "The survey on the [From.GetStarName] System is complete and ... It's incredibly anomalous. Not only the lack of a core star is relevant but seems a small amount of anomalies and black holes are in a constant orbit around a single unique planet, but this is not the strangest thing...\nThe planet itself is surrounded by a specie of impenetrable field, but not a physical or energy one but ''Time'', just time, all that enters into the atmosphere is straight up frozen in time, except the devices we have tuned with the Scar wave.\nWe should try doing a small control expedition to the surface."
  chronotec_narrative.26.a:0 "We need to discover what secrets lay under that field..."
  chronotec_narrative.26.a.tooltip:0 "Starts the §Y$digsite_chronotec_world$§! Archaeological Site, to discover the secrets of the anomalous world."

