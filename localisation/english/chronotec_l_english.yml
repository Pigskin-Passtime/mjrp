  # chronolord appears
  chronotec_narrative.30.name:0 "Time-Unlocked"
  chronotec_narrative.30.desc:0 "§HThe reactivated entity starts to shape and rearrange itself, like a kind of organic mechanism, forming an elegant yet apparently damaged figure, and after analyzing us during some seconds, proceeds to communicate.§!\n\nIt has been eons since i communicated with other than my kind, which indicates they are no longer here, or haven't arrived... yet.\nI'm grateful for undoing my loop and freeing me from it, and as such, i'll gladly serve your cause.\nMy name is Eios, and i was the curator and investigator of this timeline wonder; I understand you may have questions, and so you have all my time."
  chronotec_narrative.30.a:0 "What exactly are you?"
  chronotec_narrative.30.a.response:0 "§HAn echo starts to resonate in the area, harmoniously emitted from the figure§!\n\nWhile my nature may escape your understanding, at least for now, you don't have to bear fear or doubts about it; I'm as real as any of your kind.\nMy species conquered more than biology, more than technology, more than time itself a long, long time long ago; What you see is a representation of what you think i am and represent, yet my true form encompasses infinite threads intertwined.§!\n\n§HThe echo ceases.§!"
  chronotec_narrative.30.b:0 "How can you contribute to our cause?"
  chronotec_narrative.30.b.response:0 "§HThe marbling entity speaks in a soft, calm yet deep tone, reaffirming each word with an unnatural echo§!\n\nMy capacities are still diminished, but i can use part of my own essence to allow local alterations of reality, bending time to will serve your purpose, in ways you would not believe.\n\n§HTheir words resonate on the whole area, like an echo of a past never explored.§!"
  chronotec_narrative.30.c:0 "Why the planet was looped in time?"
  chronotec_narrative.30.c.response:0 "§HA note of sadness can be felt on the room, as the entity starts speaking again.§!\n\nA mistake. My humbling mistake.\nMessing with forces I was too naive and inexpert to mess, but eons of solitude, learning and reflection made me realize where i failed, an know what, and when, i have to amend it."
  chronotec_narrative.30.d:0 "How could you integrate in our collective?"
  chronotec_narrative.30.d.response:0 "§HThe entity starts speaking communicating, now strangely through a different way.§!\n\nYour kind is no anomaly for my capacities.\nMy complex neural network can access your synaptic projections and both receive and communicate with your collective, without compromising my individuality nor your collectivity."
  # Only available if the player invested enough
  chronotec_narrative.30.e:0 "We know about your Chronomancy..."
