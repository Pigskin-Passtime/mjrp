void_governor_black_hole_digsite_desc:0 "REPLACE_ME45"

vgdigsite.6.name:0 "Black Hole Investigation"
vgdigsite.6.desc:0 "Upon closer inspection of the black hole, it is clear that this part of the black hole is displaying abnormal behaviour, a section of the surface appears to be moving faster than the rest of the black hole, which should be impossible. This same section appears to be the source of the bridges signal, it is highly likely they are connected."
vgdigsite.6.a:0 "This shouldn't be possible."

