l_english:
#first digsite
 void_governor_crash_site:0 "Ancient ARK Ship Remains"
 void_governor_crash_site_digsite_desc:0 "This planet holds the remains of the ARK ship that we found an escape pod from, initial scans show that the majority of the ship is here although a portion of the from appears missing. Searching this ancient ship might contain valuable technologies and provide more information about its story."

vgdigsite.1.name:0 "Crashed Colony Ship Search"
vgdigsite.1.desc:0 "An initial search of the large ships shows that it is split into differing sections, the main sections are a living sector located above the other sectors, a maintenance and power sector as well as some menial areas for logistics. The front portion of the ship is missing, this likely contained the bridge and related areas as they are all absent. We will now focus are search on the different areas to ensure we don't miss any hidden interests."
vgdigsite.1.a:0 "A good plan."

vgdigsite.2.name:0 "Destroyed Living Sector"
vgdigsite.2.desc:0 "Originally when searching the living sector, we found practically nothing of use. Due to the ships age, anything exposed not made out of strong materials or metals are practically completely erased. All the materials used to construct this ship far outdates any other constructed object we have ever come across. It is difficult to tell exactly what each building could have been used for due the sheer wear of time and the initial damage of crashing onto a planet. The majority of the sector was likely shared living spaces, as well as shared eating areas and possibly some areas for recreation. \n\nDespite the damage, near the middle of the sector buried underneath decayed structures, we found a small room built from a different stronger material which appeared to contain artifacts and trinkets. We suspect this building might have been used as a museum or area to store artifacts of note from this empires history. Unfortunately, most of the items are still worn beyond any recognition of usefulness, however, the material the room is made of itself could provide our engineers valuable research towards stronger materials and armour. With this area searched, we will now move onto the maintenance and power sector located below."
vgdigsite.2.a:0 "Hopefully the other sectors provide more information."

vgdigsite.3.name:0 "Damaged Maintanence Area and Reactor"
vgdigsite.3.desc:0 "The maintancene area is in better shape than the Living sector, this is due to the living sector above it protecting it from the environment, as a significant amount of damage done to the living sector simply appears to be wear. This sector was built to be efficient and is made up of multiple corridors, storage areas and workshops. It appears that anything that broke could be brought down here for repairs. \n\nA few of the storerooms contain resources which we could use as minerals and alloys, these are being transported now. This section also contained rooms filled with various screens and computers, upon testing they appear operational, just lacking a significant power source. \n\nWhich brings us to the state of the ships reactor. Its not looking good, it has sustained damage and is completely non functional. It is larger than any reactor we could put on a ship but we could likely repair it, sourcing parts from around our empire. It would take some time to understand the technology behind the reactor and to perform rigourous safety testing before we start it. In addition to this, we will need to ensure the rest of the power grid is operational. \n\nHopefully, after restoring power to the ship, we can access its logs to find out more about this ship and whoever created it."
vgdigsite.3.a:0 "Lets begin restoring it."

vgdigsite.4.name:0 "Reactor Operational"
vgdigsite.4.desc:0 "All safety tests are now complete and the ships reactor has been reactivated. Upon restoring power, it becomes clear that while the power systems were mostly operational, the ships data storage has been heavily corrupted. From what information is left, it is clear that this ship is one of a kind. An ARK ship containing the last of the 'Ishdan empire', a fanatic materialist empire devoted to pushing the boundaries of science. Unfortunately for them, it is clear the ship never completed its misson. \n\nAccessing the ships network allowed us to find a map of the ship, showing us some more storage areas as well as accessing some remaining logistics logs. Some of these logistics logs were signed of by the leader of the ship 'Inanis', likely the captain. Unfortunately for them, their ship fell pray to something and crash landed here, with the front of the ship likely ending up swallowed by the black hole. It is unclear wether the mining drones were the cause of this, or if the mining drones simply found this system before us. \n\nIn addition to all of this, after turning on the power, some of the ships consoles started creating a static noise, these sounds were initially ignored, assumed to be damaged systems or until it was discovered that this noise was actually the ship recieving a signal from an external source, rather than an interal one. After not gaining much from the ships data log, our focus has shifted into finding the source of this signal."
vgdigsite.4.a:0 "Perculiar"

vgdigsite.5.name:0 "Signal Source Located"
vgdigsite.5.desc:0 "We have located the source of the signals. We do not understand how, but it appears to originate from inside of the systems black hole. This should be impossible, but we have checked and checked again. Even more confusingly, the location appears constant within the black hole, which is even more impossible than something surviving and transmitting from within. \n\nThe signal received from the ship was also not static, once we understood the transmission was coming from inside the black hole, it was easily translated by an ai detecting incredibly slow speeds due to the time dilation of a black hole. \n\nThe immense gravity of a black hole causes time to travel faster. This means that within the immense gravity of a black hole, time is likely moving thousands times faster than it is for us. \n\nThe transmission itself was useless, only containing "moving lights, all gone". This whole sitation is impossible, we must investigate the black hole further for answers."
vgdigsite.5.a:0 "How is this possible?"

