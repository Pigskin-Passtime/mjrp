Famine.21.title:0 "Discoveries"
Famine.21.desc:0 "After months of in depth study, your team makes the connection that the thermal energy patterns match those released by the supermassive black hole, albeit much weaker. The simple conclusion is that someone or something is feeding it, causing it to grow larger and consume all the matter surrounding it at an alarming rate. It's clear something must be done, and the force behind it all shall be punished. "
Famine.21.a:0 "Declare war on every empire!"
Famine.21.b:0 "We know we're correct, find the cause"
Famine.21.c:0 "Start experimenting just to be sure"
Famine.21.d:0 "Check ancient history books for a motive"
Famine.22.title:0 "Bad Ideas"
Famine.22.desc:0 "Some people say there are no wrong opinions. I say otherwise. I am always correct, this is true, but you? Not so much. Your opinions and ideas are so wrong it makes my maths paper look like an FTL drive blueprint. It's time to think again."
Famine.23.title:0 "Fancy Lab"
Famine.23.desc:0 "With a new fancy science lab built, using the government's money for funding, your team can make some real headway into figuring out exactly how the black hole is being fed. They claim this will help them with deducing who is doing it, and how to stop them."
Famine.24.title:0 "Uncertainty"
Famine.24.desc:0 "With the team of super-geniuses acting like toddlers over who's right and who's wrong, the only adult in the room steps forward. The 12 year old child of the caretaker asked to go the toilet. Now your scientists simply believe they must run some tests to see who is really correct. Oh the woes of egos."
Famine.25.title:0 "History Is Boring"
Famine.25.desc:0 "With half your scientists asleep and the rest playing with their toy particle accelorator, your advisors took matters into their own hands. After scouring the libraries for information, they found out that there WERE mentions of a system which exists just outside the non-negligible point of the black hole's pull. It was assumed any life on there would have died out 100-200 years after the sighting, but there's a chance that they're out there, one only needs to look."
Famine.26.title:0 "Cue The Music"
Famine.26.desc:0 "After constructing a very elaborate telescope to attempt to gaze on the system close to the center, confirmed sightings were made of a system which contained what could possibly be an artificial construction. Whether attempts at first contact are advised or not, is up for debate."
Famine.26.a:0 "Ask other empires if they have more information"
Famine.26.b:0 "Espionage is the only way"
Famine.26.c:0 "Perhaps some copying may go amiss"
Famine.27.title:0 "Tough Times"
Famine.27.desc:0 "Unfortunately due to the extreme poverty, most trade routes haev been closed between even the friendliest of empires. It would appear that we have to simply find out for ourselves, who this mystery empire is. Be it friend, or foe."
Famine.28.title:0 "Or Maybe Not"
Famine.28.desc:0 "While our spies are pretty good, the orders they were given were... let's just say that sneaking into royal museums at night is not the best way to go about getting information. We may have to resort to our own technological prowess to try to reach that system safely."
Famine.29.title:0 "They Won't Notice, Right?"
Famine.29.desc:0 "After copying a far more successful empire's technology, we are able to start creating a design that will allow us to build our own artificial portal straight into that system. The downside is well, it's 'experimental'. Explosions are bound to happen unless we are extremely careful"
Famine.30.title:0 "Construction Underway"
Famine.30.desc:0 "Construction is underway. The issue is it's hard to find the manpower due to the mass starvation and poverty. Experts state that it will take at least a couple years to fully test the portal to see if it's safe to use for any ships, let alone if it goes to the right place. These are hard times, and the people can't take much more punishment."
Famine.30.a:0 "Skip all the testing"
Famine.30.b:0 "Lives above all else"
Famine.30.c:0 "Ignore safety, just test the location"
Famine.30.d:0 "Maybe we should skip some building parts"
Famine.31.title:0 "You Muppet"
Famine.31.desc:0 "You Moron, fool, useless bozo. You fell for the classic blunder of not testing something you made. The huge explosion was felt all accross your empire, as shattered ships, and broken bones, fell into the recess of deep space. It would appear this design doesn't work, so it's back to the drawing board for what's left of the science team."
Famine.32.title:0 "Promising Employer"
Famine.32.desc:0 "Following all the regulations, despite complaints from numerous confident scientists, you finished the majority of the tests, deeming the portal safe. It's now time to attempt to get visual readings on the system, to help calibrate the exit co-ordinates"
Famine.33.title:0 "Moving Forward, Not Back"
Famine.33.desc:0 "After an extended argument, which led to 3 hospitalised scientists, the team now needs to make a decision on what to do next. On the wall hangs a stark reminder that war is NOT an option yet, in the form of a broken tooth."
Famine.33.a:0 "More war!"
Famine.33.b:0 "We need an expert"
Famine.33.c:0 "Perhaps history is the answer"
Famine.34.title:0 "Expensive Hire"
Famine.34.desc:0 "After spending a lot of money on hiring an expert, your team assists him with his research where possible, until finally the verdict becomes clear. These definitely aren't normal thermal changes, but they are similar to those from a black hole. It would seem that some experiments are in order, to find out what's really happening in this galaxy."
Famine.35.title:0 "This is OUR Design"
Famine.35.desc:0 "Thinking never did much good, except for that one robot who developed their own intelligence that one time, but we don't talk about that. Hours and hours spent in the workshop, leading up to a blueprint which one might call... dodgy."
Famine.35.a:0 "Time to get building"
Famine.37.title:0 "Are You Sure?"
Famine.37.desc:0 "The head chief looked at you, 'I have never wanted to hear those words more in my life'"
Famine.37.a:0 "Uh Oh"
Famine.38.title:0 "Collapse"
Famine.38.desc:0 "When told to make the building faster by skipping some parts, the chief decided to remove some structural supports. Without checking with the engineers first. The increased tension was too much, and the whole thing collapsed, rebuilding is the only option here."
Famine.38.a:0 "Just do the safety tests and get moving"
Famine.38.b:0 "FULL POWER!"
Famine.38.c:0 "let's do everything properly"
Famine.40.title:0 "Broken Backs"
Famine.40.desc:0 "While power does solve many things, it doesn't solve the fact that attempting to rebuild something even faster, can often end in disaster. Especially with the incompetent squad at hand. We must build once again, but maybe with a little less power."
Famine.41.title:0 "Slow And Steady"
Famine.41.desc:0 "The race isn't won, in fact it's probably lost, but you can still come second. After completing all the safety checks, and cutting no corners, the calibration is all that's left for the portal. The enemy almost in sight, the population watches on anxiously, hoping that the terror streaking across the galaxy will soon terminate."
Famine.42.title:0 "The Time Has Come"
Famine.42.desc:0 "Will you enter the portal straight away, or make sure the lives of your crew are in the right place after going through? The clock is ticking."
Famine.42.b:0 "Check the location"
Famine.42.c:0 "Surely it will work right?"
Famine.44.title:0 "The Rozzers"
Famine.44.desc:0 "Following all the regulations this time, you finish the majority of the tests, deeming the portal safe. It's now time to attempt to get visual readings on the system, to help calibrate the exit co-ordinates"

Famine.45.title:0 "Weather Report"
Famine.45.desc:0 "Indeed, it would seem that the mysterious thermal fluctuations originate from near the supermassive black hole. It would be best to put a stop to this soon, we must figure out what to do next."
Famine.45.a:0 "Attempt to single out and analyse the background thermal radiation"
Famine.45.b:0 "Send a science ship to investigate"
Famine.45.c:0 "Set up a telescope"
Famine.45.d:0 "Triangulate the position of the waves using the temperature dates"
Famine.46.title:0 "Mission Failure"
Famine.46.desc:0 "It would appear that with out meager technological outposts, we are unable to pinpoint the radiation seperatly from that of other stars, therefore we must set about improving out outposts with sensors to get some accurate data."
Famine.47.title:0 "Mission Failure"
Famine.47.desc:0 "The science ship has found nothing, despite attempting move forward, it was unable to find the appropiate hyperlanes nor access any uncharted space to safely obtain the desired results. It would appear we have to attempt to learn more remotely for now."
Famine.48.title:0 "A Lucky Break"
Famine.48.desc:0 "It seems as though our telescope spun round and knocked out a scientist. As though by divine miracle, she then woke up and instantly calculated that the thermal changes seemed to be coming from inside the black hole. The scientific community is now requesting funding to start experimenting on likely causes for this."
Famine.49.title:0 "Smart Stuff"
Famine.49.desc:0 "After hours of deliberation, your team has determined that a very small circumference around the black hole is to blame, although we don't have the technology to directly see what's happening yet, it would appear we have to theorize some more. The scientific community is now requesting funding to start experimenting on likely causes for this."
Famine.50.title:0 "Crossroads"
Famine.50.desc:0 "Different factions within your main strike group are debating on what to use their funding on. They are now asking for your input."
Famine.50.a:0 "Test thermal displacement"
Famine.50.b:0 "Start making black holes"
Famine.50.c:0 "Simulate the output of the center stars"
Famine.50.d:0 "Listen to the crazy 'shooting star' scientist"
Famine.51.title:0 "Wasn't Me..."
Famine.51.desc:0 "So while experimenting, one genius had the idea to use a non-euclidean method of moving the thermal energy. One dark matter explosion and half a scientist later, and we now have to explain to some very angry parents why their son looks like a smurf from the left side. Our research building is also sadly gone, reduced to atoms."
Famine.52.title:0 "Almost There"
Famine.52.desc:0 "Through extensive testing, we have determined the result of whatever the cause is, extreme growth of the supermassive black hole. however it would seem that buidling a black-hole-cannon is slightly too far beyond anyone, however much our admiral would want it. Back to the drawing board, but spirits are high, and the tank of hopium is full."
Famine.53.title:0 "Almost There"
Famine.53.desc:0 "After simulating the current thermal radiation on all the stars closest to the black hole, we realised that the black hole itself should be exuding plenty of energy itself. This is the break we needed, just a bit further and we can determine the cause. Then all that's left is the why..."
Famine.54.title:0 "Ain't No Way"
Famine.54.desc:0 "So while we refused to give him illegal gun parts for a star cannon, the idea stuck, and eventually we tried firing different star classes into a minature black hole. Someone has been sending neutron stars or similar into the supermassive black hole, enlarging it rapidly, and reducing the matter around it, leading to extreme heat loss accross the galaxy. We must find out who the culprit is."
Famine.55.title:0 "Listen Here Punk"
Famine.55.desc:0 "After beating up multiple enovys from different embassies, and holding the rest at gunpoint, the realisation that none of the known co-operative empires are to blame. So with confusion our confusion raised, and better trade deals gained, we must march on into the unknown, to find the true enemy of the galaxy."
Famine.55.a:0 "Send out radio signals"
Famine.55.b:0 "Think gun + ship + recruitment"
Famine.55.c:0 "It can't be easy, moving a neutron star..."
Famine.56.title:0 "What Did You Think Would Happen?"
Famine.56.desc:0 "Ahh, the ol' classic, ancient method of communication. You found nothing, absolutely nothing. What a waste of effort. How, in any universe, nay, realm of thought, did you think that an empire who is intentionally destroying the galaxy, want to be found, let alone respond to a radio signal? I am thoroughly disappointed in your choice. It's just simply embarrassing"
Famine.57.title:0 "Quantum What?"
Famine.57.desc:0 "Of course, throwing an expedition ship into random uncharted space is going to work, why wouldn't it. So as you have unsucc- oh hold on, your team found it. A group of ragtag volunteers, looking to make their parents proud, boldly strode into empty space, looking for a solar system with a type 2 empire. By some miracle, they found what appears to be a functioning, but very aggressive, society who are space born. Attempts to now create a gateway connection for fast travel are underway."
Famine.58.title:0 "Guess Work"
Famine.58.desc:0 "As though in a mystery detective novel, you slowly begin to realise that the enemy would in fact, be very VERY close to the black hole, since feeding it neutron stars from lightyears away must be a lot harder to do. It's time to begin the search, quadrant by quadrant with automated ships, until you inevitably find the enemy."
Famine.59.title:0 "Visual Contact"
Famine.59.desc:0 "You've found a patrolling fleet, as well as a large unidentifiable starbase. This must be it. Now we just need to set up some form of gateway."
Famine.59.a:0 "Send a squad to build an exit first"
Famine.59.b:0 "Attempt to go without an exit"
Famine.60.title:0 "Long Drive"
Famine.60.desc:0 "With supplies running low, and fuel almost empty, the crew barely manage to scrape their way into the system undetected, using the technology you gave them to create a gate that should connect through to you, if your calculations are correct"
Famine.61.title:0 "Internal Research"
Famine.61.desc:0 "After some previous failures, the team morale is low. They need someone in charge, a leader for guidance. The constant arguing about the best course of action means nothing gets done"
Famine.61.a:0 "Take Some Coffee"
Famine.61.b:0 "Knuckle down and analyze the data"
Famine.62.title:0 "Take Some Coffee"
Famine.62.desc:0 "A quick recharge can definitely help, although too much caffeine can lead to wasted work hours due to the crash. Well, time to get to work"
Famine.63.title:0 "A Breakthrough!"
Famine.63.desc:0 "After hours of deliberation, your team has determined that a very small circumference around the black hole is to blame, although we don't have the technology to directly see what's happening yet, it would appear we have to theorize some more. The morale of the team is higher than ever, though their bank accounts are suffering. The scientific community is now requesting funding to start experimenting on likely causes for this."
Famine.64.title:0 "Narrow It Down"
Famine.64.desc:0 "After a while, the team managed to figure out what was going on. It would appear that neutron stars are being fired into the supermassive black hole, causing it to enlarge at an unprecedented rate. This causes it to consume a large quantity of the matter surrounding it, leading to a massive loss in heat generation for the galaxy. We now have to figure out who is doing this, and stop them"
Famine.64.a:0 "We don't need them"
Famine.64.b:0 "Ask the other empires 'nicely'"
Famine.64.c:0 "Use *cracks knuckles* unorthodox methods"
Famine.65.title:0 "Stroke Of Genius"
Famine.65.desc:0 "One of your scientists manages to design a potential portal that will lead right to the location of where the neutron stars seem to be appearing from. The work has only just begun, but is it safe?"
Famine.66.title:0 "Questionable Legality"
Famine.66.desc:0 "With the room set up for your 'guests', it's time to invite the delegates in for a short chat with you and your... friends"
Famine.67.title:0 "Enemy Territory"
Famine.67.desc:0 "Deep behind enemy lines, saving private galaxy is a go. Your team has to unanimously make a decision, or they risk internal divide, which would spell devastation for the group."
Famine.67.a:0 "Go for some sightseeing"
Famine.67.b:0 "Connect the portal"
Famine.68.title:0 "Really?"
Famine.68.desc:0 "While the asteroid belt was pretty, the enemy fleet DOES have eyes (or so we assume) and the expedition force was shot down mercilessly. It seems we must send some probes to check if the system is still safe to venture."

Famine.103.title:0 "Galacic Empire Defeated!"
Famine.103.desc:0 "With the Galacic Empire defeated, the galaxy once again returned to its usual state, leaving behind an undiscovered system with portals all over, that could be used for someone's benefit, or to their downfall. The race for power and glory has once again resumed its relentless path."
Famine.103.a:0 "And the galaxy was forever grateful"


r_potato:0 "Rotten Potato"
r_potato_desc:0 "A long lost vegetable, with the mystical powers of turning your hard earned food into cash. Make big stack dollar money with this relic, and become the economical powerhouse you were always meant to be."
TGF_Wormhole:0 "Artificial Portal"
TGF_Wormhole_desc:0 "A doorway to an almost unexplored land, potentially dangerous. You have been warned"
kill_enemy_title:0 "Destroy The Galacic Empire"
kill_enemy_desc:0 "The Galacic Empire is overrunning the galaxy, they must be destroyed immediately, or all shall suffer the consequences"
