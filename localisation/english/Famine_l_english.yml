TGF_tooltip: "§P Welcome to The Great Famine mod. Made by Kirby101, this mod spawns a small mid-game crisis to overcome, which could possibly cripple your (and everyone else's) economy. Can you complete the special projects first to end the crisis and reap the reward, or will you leave them around, to possibly benefit from a global highway in the end. This is pretty much my first mod so the content could be lacking compared to others, but I hope you have fun playing regardless."
TGF_allowed: "§G The Great Famine Enabled§!"
TGF_disabled: "§Y The Great Famine Disabled§!"

