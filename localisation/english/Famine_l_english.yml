TGF_Mod_2:0 "Potato Terror"
TGF_Mod_2_desc:0 "Let Them Eat Dirt - A Wise Man"
TGF_Mod_3:0 "Frost Bite? What Frost Bite?"
TGF_Mod_3_desc:0 "The Supreme Art Of War Is To Subdue The Enemy Without Fighting - A Wiser Man"
TGF_Mod_4:0 "The CEO Cries Himself To Sleep"
TGF_Mod_4_desc:0 "We're All Gonna Die - A Man"
Famine.1.name:0 "Unexplained Flickers"
Famine.1.desc:0 "Our Scientists have come forth with strange readings, lower efficiency with our solar panels, and our plants' health has started to deteriorate. One suggests it's because of lack of light and heat, although this makes no sense, all our stars are following the anticipated life-cycle. We can only wait and see what will happen in the future."
Famine.1.a:0 "Hopefully this isn't a sign..."
Famine.2.desc:0 "Disaster! Almost all crops not within a self-contained ecosystem have started having health problems, leading to an extreme food shortage. Our intelligence suggests similar events have occurred all across the galaxy. The people have been referring to it as 'The Great Famine'. Debates have started on whether this is a natural phenomenon, or something much more sinister is afoot."
Famine.2.a:0 "Oh No! Anyway"
Famine.2.b:0 "Start rationing, immediately!"
Famine.3.a:0 "A sign, the beings above are smiling upon us!"
Famine.3.b:0 "We have to get to the bottom of this."
Famine.25.a:0 "It's sciencin' time"

mysterious_fluctuation_chain_title:0 "Unusual Readings"
mysterious_fluctuation_chain_desc:0 "Thermal and light fluctuations seem to be tearing across the galaxy. We are uncertain as to its origins, but we can say with some uncertainty, that this may with disrupt our livelihood soon."

Stage_0:0 "Begin The Investigation"
Stage_1_a_x:0 "A More Scientific Approach"
Stage_2_a_x:0 "Studying The Lore"
Stage_3_a_x:0 "Dangerous Operation"
Stage_1_a_y:0 "Tone Down The Aggression"
Stage_2_a_y:0 "Think, Think Harder, Use That Noggin"
Stage_3_a_y:0 "Buildin' Time"
Stage_4_a_y:0 "Decisions Decisions..."
Stage_1_b_x:0 "Data Gathering"
Stage_2_b_x:0 "Begin The Experiments"
Stage_3_b_x:0 "Interrogation"
Stage_4_b_x:0 "Search And Destroy"
Stage_1_b_y:0 "Get The Chalk"
Stage_2_b_y:0 "Pinpointing The Cause"
Stage_3_b_y:0 "Connecting The Highway"
Stage_0_desc:0 "We must start looking into what's going on, the people can't take much more of this suffering"
Stage_1_a_x_desc:0 "We have to look into these events further. Asking the people simply won't yield good enough results. A good start would be building some outposts to attempt to analyse the weather data coming in."
Stage_2_a_x_desc:0 "No one likes reading, least of all Barry. Barry is a fine chap, an upstanding member of society. Barry is now dead. He refused to read the books. Get to work."
Stage_3_a_x_desc:0 "Building dangerous new tech, oh this was Barry's favourite pastime... I can't any more, why is he gone, why didn't he learn to read!?"
Stage_1_a_y_desc:0 "Now I love fighting as much as the next guy, but unfortunately we can't fight what isn't here. We really need to calm down this group of... 'scientists' before the blood bucket becomes full."
Stage_2_a_y_desc:0 "Surely if we put our heads together, we can figure out this conundrum, right?"
Stage_3_a_y_desc:0 "As some wise people have said, speed is key. What is a key? What is speed, other than the rate at which someone or something moves or operates or is able to move or operate? How can speed manifest itself into a key? Life's biggest questions right here."
Stage_4_a_y_desc:0 "As the safety checks are being finished, the uncertainty of the whole operation is brought to light. Is this really a quick bombing run, or are you just poking the hornet's nest?"
Stage_1_b_x_desc:0 "We must collect all the available weather information in order to come to a conclusion. Some experts believe that this is a freak accident, but we aren't so convinced."
Stage_2_b_x_desc:0 "Experimentation is the key to success. We must conduct these in very enclosed environments several times to get accurate results, but once we know the end result, finding the cause should be a lot easier."
Stage_3_b_x_desc:0 "Where's my money, huh? Where is it! ... oh he's not the right guy? *cough cough* Right well, as you were."
Stage_4_b_x_desc:0 "Like a hunter in the bushes, watching their prey, the crew is in a very advanced space ship, searching the endless void for a potential group of entities. Ok that metaphor wasn't great, but it was Barry's favourite one. Ahh, I still have his favourite book here with me. Sadly I can't read it since it has no words on it, but apparently it has some bumps in it called braille? They just feel awful to me."
Stage_1_b_y_desc:0 "We need ideas and fast. It's time to start brainstor- NO, I DIDN'T SAY TO START A STORM, THAT WEATHER MACHINE WAS FOR RAIN ONLY!"
Stage_2_b_y_desc:0 "Now that we know how the heat has gone, it's time to start finding out exactly what caused it. We're so very close to having the answer, i'm sure just a couple more tests with differring theories will get us there."
Stage_3_b_y_desc:0 "Hopefully the portal on the other side holds, now we just have to make sure our side connects properly. All the struggles and hardships have come down to this very moment."
 
Famine.2.name:0 "Dad, Why Are We Selling The Farm?"
Famine.3.title:0 "WARNING: INTERNAL FLUID TEMPERATURE TOO LOW"
Famine.3.desc:0 "The temperature all around the galaxy has dropped dramatically, the synthetics are requiring vastly more energy to maintain their internal temperatures, or they risk freezing their fluids, leading to brittle body plates. The people are starving and cold, desperate for salvation as the famine only worsens, it appears this nightmare will never end. We should check the situation log periodically for updates."
Famine.4.title:0 "Reports, CEO's Are No Longer Burning Money"
Famine.4.desc:0 "The mass unrest has built up. No one can afford any luxuries anymore, ruining the economy. The future seems bleak, with no end in sight. Our scientists have agreed that something like this can only be explained with theories based on artificial machines designed to destroy ALL empires. But the motive remains ever a mystery. Some scientists suggest an investigation team, funded by the government, may find a solution to our problems, or at least the cause of all this."
Famine.4.a:0 "Ok, so about that smiling..."
Famine.4.b:0 "But my luxury yacht!"

Famine.20.title:0 "Conspiracy Theories"
Famine.20.desc:0 "The investigation hasn't brought up much, but the thermal fluctuations seem to be vastly out of expected values for any storm. Many people have begun forming cults. It's time to take a much more scientific approach, study the temperature differences and confer with other empires. This cannot be natural, otherwise the galaxy is doomed."
Famine.69.title:0 "Survey Results"
Famine.69.desc:0 "After investigating the aftereffects, you decide to survey each colony within your empire. The investigation reveals that most of the population closer to the supermassive black hole experienced the colder temperatures much earlier than the others. But, as your advisors remind you, whether the words of peniless conspiracy theorists can be trusted is up for debate. It's time for your team to do some research into the weather patterns of all the planets, to determine whether its sporadic weather events, or the fluctuations."

Famine.100.title:0 "Galacic Empire"
Famine.100.desc:0 "It seems you've found us, after constructing a little gate within one of your systems. But we won't go down without a fight, this galaxy SHALL fall, and The Great Famine shall terrorize all for eternity, just like my childhood once was. The Galacic Empire shall fight with all we have to protect Coruscant"
Famine.100.a:0 "We will destroy you!"
Famine.100.b:0 "Did you spell 'Galactic' wrong?"
Famine.100.c:0 "You're system's called Goblon?"
Famine.101.title:0 "Galacic Empire"
Famine.101.desc:0 "It seems you've found us, after constructing a little gate within on of your systems. But we won't go down without a fight, this galaxy SHALL fall, and The Great Famine shall terrorize all for eternity, just like my childhood once was. The Galacic Empire shall fight with all we have to protect Coruscant"
Famine.101.a:0 "We will destroy you!"
Famine.101.b:0 "Did you spell 'Galactic' wrong?"
Famine.101.c:0 "Goblon deez nuts"

