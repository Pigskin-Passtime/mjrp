 hskv_situation_vault:0 "The Everdawn Vault"
 hskv_situation_vault_type:0 "$hskv_situation_vault$"
 hskv_situation_vault_desc:0 "Thayo's long running plan is now finally coming to fruition. We have only a limited amount of time to get in there and find the valuable repositories of §Y$NAME_hskv_thayo_old_empire$§! artifacts, technology, and the Astral Anchor. If we take too long then §Y[hskv_target_fe_country.GetRealName]§! will be alerted and their response will be nothing short of cataclysmic."
 hskv_situation_vault_outcome:0 "Everdawn Vault bypasses our jamming to send a distress call"
 hskv_vault_stage_1_desc:0 "Our finest explorers and soldiers are working around the clock to explore and secure the vault."
 hskv_situation_vault_monthly_change_tooltip:0 "Everdawn Vault is still operational and is attempting to circumvent our jamming to put out a distress signal."
 hskv_situation_vault_exploration:0 "Secure the Vault"
 hskv_situation_vault_exploration_approach_tt:0 "With the stakes this high of a §Y[hskv_target_fe_country.GetRealName]§! response, there is only one logical approach; every resource at our empire's disposal MUST be available for this operation, no matter the cost."


