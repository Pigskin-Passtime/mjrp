 hskv_spawn:0 "Spawn Thayo Everdawn"
 hskv_tooltip:0 "Imprisoned for ages, this Former Imperial Chancellor now works for you. While exceptionally talented, he is not entirely loyal to you as he works towards his personal goal of pulling off a heist against the Fallen Empire which imprisoned him.\n\nWhile You can perform the start of his quest line as a Gestalt or Homicidal Empire (with some rewards), the quest line will be over once you are forced to refuse the option to hire him.\n\nGalaxy Setup Requirements:A non Machine Fallen Empire\n\nRequired DLC: §GNone§!\n\nEnhanced slightly by DLC: §YNemesis and Ancient Relics§!"

