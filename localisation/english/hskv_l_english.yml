# Situations
 hskv_situation_thayo_manhunt:0 "The Hunt for Thayo Everdawn"
 hskv_situation_thayo_manhunt_type:0 "$hskv_situation_thayo_manhunt$"
 hskv_situation_thayo_manhunt_desc:0 "Thayo Everdawn has finally gone too far. We must find him in order to recover the assets and resources he has stolen from us."
 hskv_situation_thayo_manhunt_monthly_change_tooltip:0 "Our current progress in our search for Thayo."
 hskv_situation_thayo_manhunt_outcome:0 "Locate and Capture Thayo Everdawn"
 hskv_situation_thayo_manhunt_frugal:0 "Minimal Effort"
 hskv_situation_thayo_manhunt_frugal_approach_tt:0 "Despite the damage to our empire and our pride done to us by Thayo, we have bigger issues to be concerned about than some wild Pilipo chase."
 hskv_situation_thayo_manhunt_regular:0 "Nominal Effort"
 hskv_situation_thayo_manhunt_regular_approach_tt:0 "Thayo cannot be allowed to escape justice. But neither can we divert what little of our resources we have left. We can only hope the trail will not go cold by the time we locate him."
 hskv_situation_thayo_manhunt_generous:0 "Elevated Effort"
 hskv_situation_thayo_manhunt_generous_approach_tt:0 "The betrayal of trust Thayo has shown us cannot go unpunished. For all of Thayo's skill, he is not perfect and must have made errors we can exploit. His underestimation of us will be his final mistake."
 hskv_situation_thayo_manhunt_extreme:0 "Extreme Effort"
 hskv_situation_thayo_manhunt_extreme_approach_tt:0 "We will spare no expense at hunting down this no good lying double-crossing rapscallion! When we find him, he will wish we had left him to rot in that prison."
 hskv_thayo_stage_1_desc:0 "Our agents are scouring the galaxy for any sign of Thayo and his accomplices."
