# Event Chains
 hskv_thayo_crack_the_shield_chain_title:0 "Prepare to Crack the Shield in Azure Dream"
 hskv_thayo_crack_the_shield_chain_desc:0 "Build a §YDisruption Field Generator§! on a starbase in Azure Dream in order to enable to cracking the shield process."
 hskv_thayo_create_wormhole_chain_title:0 "Prepare to generate a Wormhole in Azure Dream"
 hskv_thayo_create_wormhole_chain_desc:0 "Build a §Y$sm_hskv_warmhole_generator$§! on a starfortress or larger starbase in Azure Dream in order to enable the wormhole stabilization process."
 hskv_thayo_secure_dawns_end_chain_title:0 "Secure Dawn's End"
 hskv_thayo_secure_dawns_end_chain_desc:0 "Before we can access the vault, we must secure the system. Note that once we enter the system, the enemy WILL be alerted. It is unclear how much time we have once this occurs, but we will have no time to spare. It is STRONGLY recommended that we have any potential assets we might need for this operation to succeed, be they be soldiers, scientists, construction ships, military fleets, and science vessels, as well as a stockpile of resources."
 hskv_thayo_levelup_chain_title:0 "Level up Thayo Everdawn"
 hskv_thayo_levelup_chain_desc:0 "Level up Thayo Everdawn to continue to progress his story."

# Events
 hskv.10.name:0 "Mysterious Signal coming from Shielded World"
 hskv.10.desc:0 "After a particularly long and grueling investigation by [Root.GetLeaderName], they managed to complete their analysis of planet known as Azure Prison. The planet is shielded with an energy barrier that makes it completely opaque and blocks all known and even several theoretical scanning techniques. Neither are there any external sources of the shield, which has so far ignored all attempts at manipulating it. Had this been all, their investigation would had been over quickly. But a single... anomaly in this anomaly warranted a much deeper and closer look.\n\nThe barrier does appear to be leaking some sort of signal. It is faint, and distorted, but it does seem to interact with certain radiation wave frequencies. [Root.GetLeaderName] believes a special project with significant resources and more importantly, budget, might be able to learn something more from this."
 hskv.11.name:0 "Azure Prison"
 hskv.11.desc:0 "Thanks to the hard work from the science team, they managed to decipher the signal. They determined that it is actually communication coming from someone inside the world! While the bandwidth is tiny and can only transmit text, it does allow for us to communicate with only a few second delay. They claimed to have been imprisoned here and are requesting our help in escaping. While we believe he 'seems' authentic, we simply lack the information to know for certain his intentions. We decided that it would be best if you talked with him and come to your own conclusions."
 hskv.12.name:0 "The Azure Prisoner"
 hskv.12.desc:0 "Hello [Root.Leader.GetName]. I suppose you are the one I must convince that my plight is genuine? Very well then.\n\nMy name is Thayo Everdawn and I have been imprisoned here for... I'll be honest I lost count long ago. It was only several hundred years ago that I managed to subvert my warden's defenses and begin to pick away at the barrier from my side. Leading to the faint signal which brought you to me. I ask that you free me from this prison created by the [hskv_target_fe_country.GetRealName]. I could say you'd have my gratitude, but that is not something I personally believe in. Instead we must barter like equals. For only then would we both have something the other wants."

 hskv.12.option.a:0 "Why were you imprisoned?"
 hskv.12.option.a.response:0 "For my crimes against the [hskv_target_fe_country.GetRealName]. In their defense, I will not deny some of them. Although by the end it was clear that I was being made a scapegloru for every wrong in their society as they threw manufactured crimes on top of my very real ones. So great was this list of crimes that they decreed death was too good for me. And one life's sentence was too short. So they forcefully prolonged my life to an unnatural extent. There was also some torture, but they took pains to make sure that my mind never broke. That I would continue to be cognitive and sound within the confines of my own mind as I live out in this hell they manufactured for me. They claimed to be seeking justice, but it was vengeance they sought.\n\nBut as the years went by, even they seem to have forgotten me. I am certain if any do remember me, it's as some boogytoro that scares their spawn into going to bed on time.\n\nIn the end, it is not the fact that they punished me that is the injustice, but rather the severity. No one, no matter their crimes, should have to face a punishment such as this."
 hskv.12.option.b:0 "Why should we free you?"
 hskv.12.option.b.response:0 "If you desire an intrinsic reward, you can take pleasure in freeing me from this suffering. But there are other far more compelling extrinsic reasons for doing so.\n\nFirst, you would gain access to this facility for salvage and study, even if the facility is not very large, it is certainly filled with wonders beyond your primitive imaginations.\n\nSecond, this world, while small, would make for a decent colony for your empire once you bring down the shield.\n\nThird, I can offer you my services. While I may be a little rusty, I can assure you that my skill in governance was never equaled. But alas, not even my skill could have saved us in the end. I am certain that even with your primitive tools, I will make your empire the envy of your neighbors."
 hskv.12.option.c:0 "I am ready to make a decision"

 hskv.13.desc:0 "Well? What have you decided. I cannot deny the risks of helping me. Even outside the risks of trusting me, you also risk confrontation with [hskv_target_fe_country.GetRealName], either directly or through their automated defenses. But I ask you to look past that and see the potential of what lies behind this barrier and my tireless assistance. Barring that, I also plead for your compassion. To free me from this suffering here."
 hskv.13.option.a:0 "Yes. We will help you."
 hskv.13.option.b:0 "No. We will not."
 hskv.13.option.b.tooltip:0 "This will effectively end the Thayo Everdawn questline"

 hskv.14.desc:0 "§YThere is a long pause before a reply is made.§!\n\nTo say that this disappoints me would be a grave understatement and yet I cannot fault you entirely. You must balance the needs and wants of many factors, desires, and risk. Your visit does at least give me hope as you have validated my efforts here. Perhaps it will take me another hundred years. Or maybe a thousand. But one day, someone will help. Or perhaps I will finally chip away at the shield enough to bring it down. I just need to continue to wait either for them find me or for this facility to finally fail.\n\nGoodby [Root.Leader.GetName]"

 hskv.15.desc:0 "Thank you [Root.Leader.GetName]. Then it would mean we have much to do. While I have freed myself of some of the shackles my wardens have placed upon me, I am still very limited in what I can do.\n\nThe means of our communication is the key to how to bring down this shield. We can use this signal to try to destabilize it, but I can only generate so much power from my end. I believe if you create a much more powerful version of it on the outside, matching the pitch, frequency, and overlapping amplitudes of the signal I am sending that it will cause the imperfections in the shield to expand into a hole large enough for a ship to enter. Or violently collapse. Without such an incredibly niche background of this kind of physics, I admit everything I have been doing has just been improvising, so I am uncertain as to what might happen.\n\nEven if I am rather good at rapid improvisation."
 hskv.16.desc:0 "I will continue to work with your scientists and engineers, but a general idea of what needs to be done is that you'll need apply an excessive amount of energy to this signal. Larger than anything your ships can produce. Only a starbase would be able to house a §YDisruption Field Generator§! large and powerful enough to affect it.\n\nI would also warn you that this facility has some, but not many defenses. The defenses here were designed to stop me from escaping, as the shield itself would be more than enough to stop any external force. So even with such primitive weapons, you should be able to overwhelm them, especially if you properly equip your starbase. More importantly, I can disrupt their communications to prevent them from warning [hskv_target_fe_country.GetRealName]. As if they were ever warned, you would be utterly annihilated."

 hskv.21.name:0 "Destabilizing the Shield"
 hskv.21.desc:0 "With the module installed on the starbase in Azure Dream, we are ready to begin the destabilization process to bring down that shield. When you are ready to authorize this special project, we will begin. But if we heed Thayo's warning about possible automated defenses, we should only do it when we have sufficient forces ready to react."

 hskv.22.name:0 "Destabilizing the Shield"
 hskv.22.desc:0 "In unison, Thayo and your scientists begin to match frequency and pump as much power into the subatomic particle waves and directed them towards the shield. The starbase quivered from the amount of energy being funneled through the generator, but that was nothing compared with what was happening to the shield. The seemingly perfect sphere of energy starts to fluctuate. At first only enough to be picked up by sensitive sensors, but within minutes visible shock waves begin to form and interfere with each other, each time further compounding the destabilization.\n\nThen in a flash the shield collapses, the immense energy contained within rushing out as a shockwave emitting from the planet. The starbase shutters from the impact with the shockwave, losing power briefly before being restored. As the status reports come in it soon becomes apparent that the shockwave caused a kind of EMP blast which fried every shield in the system. It will take some time to repair them... time which we might not have.\n\nWithin hours of the collapse, a handful of relatively small ships begin to take off from the surface. They offer no hails, refuse all communications, and are moving to towards our starbase with a speed and agility that surpass our best designs."

 hskv.24.name:0 "Azure Prison"
 hskv.24.desc:0 "With the spacecraft automated defenses taken out, we can finally turn our attentions to the former shielded world Azure Prison. Thayo wasn't wrong that the world could sustain a colony, even if it is a small planet with an unfortunately low gravity. The only other notable feature is a single facility taking up a surprisingly large area. But perhaps that is not surprising given that it was designed to last for thousands if not more years without any outside support.\n\nWhile there are still a sizable number of ground forces for us to worry about, we should be able to manage without needing a full scale planetary assault. As Thayo said, their purpose is to be wardens for a single individual, not defend against an outside force. Even with their technological edge, it will not be long before we fully reclaim the facility for ourselves."
 hskv.26.name:0 "Azure Prison"
 hskv.26.desc:0 "Thanks to information Thayo gave us before our attack, we were able to quickly find the holding chamber for him. It is no conventional cell, but one where his body lies in a stasis pod, while his mind is imprisoned in a nearby mainframe. Performing the commands he gave us, we were able to release him from captivity. As he slowly rouses from age old comatose, you are suddenly struck with a realization that he is not same species as [hskv_target_fe_country.GetSpeciesName]. As you ponder whether or not this is relevant, Thayo attempts to stand but fails, and you can see the painful expression of him eating his own pride as he is carried out to someplace safer where he can recuperate."

 hskv.27.name:0 "Azure Prison"
 hskv.27.desc:0 "Within a month, the facility has been fully secured and the world is now ready for colonization. While some of the facility was damaged by the shield collapse and collateral damage as our forces moved in, it is still in a working condition. Given the automated nature of it, we will be able to reap the benefits of this facility for generations to come. Not to mention millions of PhD thesis papers as countless scientists study it's secrets.\n\nAs for Thayo himself, he has made a remarkable and expedite recovery given the state he was in. With his recovery nearly complete he insisted he wanted to speak with you."

 hskv.30.name:0 "Thayo Everdawn"
 hskv.30.desc:0 "You have no idea how good it feels to be free of that nightmarish machinery. Free to finally walk in the light of the sun. Any sun really. Free to travel the cosmos themselves. While you have my thanks. Gratitude is worthless. But the accord we reached is far more valuable than anything you found down there in my prison. Thus I am indeed willing to offer you my services. You would do well to accept so I can get to work. I have much to do, and even more to catch up on."
 hskv.30.option.a:0 "What was that device you were hooked up to?"
 hskv.30.option.b:0 "I noticed you are not the same species as the [hskv_target_fe_country.GetSpeciesName]. Why is that?"
 hskv.30.option.c:0 "What talents can you offer to our empire?"

 hskv.30.option.a.response:0 "You might think that this shielded planet, this facility, or even that stasis pod was my prison. But no, the actual prison on this planet was the simulated world which my mind was trapped in. The ageless suffering, torture, reprieve, and even hints of manufactured joy. It took me countless years before I managed to break free of that shackle, gaining root access and allowing me to extend my reach to some, but not all, of the systems in this place.\n\nThere is a part of me that still thinks I never escaped it. That this is still all part of the simulation. But rationally, I know that is not the case. The simulated world they built was not perfect; indeed, it was never meant to be. It's sole purpose was merely to contain me. It also suppressed my psychic abilities which have been slowly recovering. And while they were excessively vindictive in their punishment, and I will admit this prolonging of my life was creative, they were far too shortsighted as to offer me the greatest torture of all, false hope."
 hskv.30.option.b.response:0 "Were you expecting me to have been a citizen of their empire? No. I was never a part of that puerile, callow, and unsophisticated cartel they call an empire.\n\nAlas, for all their faults, they were indeed the instrument of my defeat. I once helped rule an empire that could make even the very stars quake in fear. But we grew complacent and focused inward at the exclusive of all else. By the time we realized our mistake, it was too late. I pride myself in my ability to see five moves ahead of everyone, but the circumstances of our fall was that of an outside context, one which [hskv_target_fe_country.GetRealName] took full advantage of. Sadly, seeing five moves ahead doesn't help when someone not in the game intervenes. The irony that [hskv_target_fe_country.GetRealName] is now in the same state as we were so many years ago is not lost upon me."
 hskv.30.option.c.response:0 "Well. Previously I was the chancellor of the Everdawn Dynasty. While my second cousin ruled as queen, I was her right hand man enforcing her will on the galaxy. If you want proof of my skill and reputation; look no further than the fact that [hskv_target_fe_country.GetRealName] spared no effort in their 'justice' for me, where as my queen was merely executed.\n\nBut aside from my organization skills, I am also psychic, something that was quite rare outside of the royal family, which was extremely useful whenever I needed to get my hands dirty, which was quite often."

 hskv.30.option.dismiss:0 "The deal is off"
 hskv.30.option.dismiss.tooltip:0 "This will effectively end Thayo's questline. But what will Thayo do next?"
 hskv.30.option.hire:0 "Welcome aboard!"
 hskv.30.option.hire.tooltip:0 "Welcoming a mysterious alien into a position of power who has been imprisoned for tens of thousands of years of unspecified crimes surely won't have any ramifications?"






 hskv.95.name:0 "Thayo Acclimates to governing"
 hskv.95.desc:0 "It seemed like it was only a few years ago when Thayo struggled integrating himself with our society, let alone actually governing. While there are still many minutiae of our empire he struggles with, but he is no longer accidentally making a fool of himself and has started to prove himself to be quite an asset to our empire."
 hskv.96.name:0 "Thayo Acclimates to governing"
 hskv.96.desc:0 "Thayo's integration with our society continues to improve. On one hand, it has taken him several years to reach his current state, but on the other hand, it is remarkable just how quickly he has relearned so many skills and talents from his time before his imprisonment. He probably would never admit it, but his time on that world took quite the toll on him and the fact that he has managed to recover in any functioning way is astounding."
 hskv.97.name:0 "Thayo Acclimates to governing"
 hskv.97.desc:0 "Thayo's long road to recovery as come to and end. He has finally reached his stride and moves between officials, officers, CEOs, and countless other individuals across all levels of society as if he was a born and raised [Root.GetSpeciesName]. The trials of his imprisonment have been put behind him, but all that seemed to do is to make him even more determined as he runs a constant stream of meetings to govern our empire."


 hskv.120.name:0 "Thayo Everdawn"
 hskv.120.desc:0 "Thayo has been hard at work as he charms his way through upper society and government in the course of his work. Somehow, despite the fact that he has many duties and responsibilities, he has doing quite a lot on the side as well. He claims it is because his body only needs a short amount of rest, but what is really on display is a truly tireless determination.\n\nHe has proceeded to hand us a very detailed report on [hskv_target_fe_country.GetRealName]. He admits that it is heavily outdated and mostly from his very ancient memory, but this report has been a gold mine for study and analysis. Beyond this singular report, he has also claimed to have a hidden source of some basic, but current, information on [hskv_target_fe_country.GetRealName]. He refuses to elaborate, and there is some concern that this is a security risk, one that could trigger a diplomatic incident. But having any kind of intelligence on one of the most powerful empires in the galaxy is quite the win."
 hskv.121.name:0 "The Unwanted Destitute Dregs"
 hskv.121.desc:0 "You are not sure how Thayo did it, but somehow during the course of his duties he managed to locate several entirely hidden cities. At first you were surprised, but then it soon became clear why they were so hidden. These cities are full of people who wished to remain off the grid for criminal purposes outside the reach of our law. In short, they are full of low life smugglers, drug dealers, and criminals organizations. Thayo purposed several solutions to this dilemma below, with his own recommendation for integration back with our empire."
 hskv.121.option.a:0 "Bring them back into the fold, whatever the cost"
 hskv.121.option.a.tooltip:0 "While the additional of such a questionable labor force would be quite the boon, we should consider that they might not wish to be brought back into the ford, even with a generous package. Not to mention the morally bankrupt among them might continue to relapse into their criminal ways."
 hskv.121.option.b:0 "They may continue to exist, so long as they pay their due"
 hskv.121.option.b.tooltip:0 "So long as they pay their taxes and do not cause too much trouble, they may continue to exist."
 hskv.121.option.c:0 "Wipe that hive of scum and villainy off the star map"
 hskv.121.option.c.tooltip:0 "Such a criminal haven is a cancer on our society that must be removed, with force if needed."

 hskv.130.name:0 "Thayo Everdawn"
 hskv.130.desc:0 "In Thayo's tireless efforts to smooth out the operations of our empire, it seems he has created his very own private network of orderlies and assistants above and beyond the scope of his regular duties. You knew that his organizational skills were peerless, but the fact that he had manages to keep track of it all without fail is impressive.\n\nThis has allowed him to have the resources to be effective at both his duties on the council and on the planets under his jurisdiction. Most recently he has started working out some ways to improve worker productivity as he directs his ever growing network towards our workers. Although the workers do not appreciate this level of oversight, it has been showing results and promoting an increase of efficiency."
 hskv.130.response:0 "REPLACE_ME"
 hskv.131.desc:0 "As the sophistication of Thayo's private network continues to grow and get ever larger, some doubts and concerns began to form by some of Thayo's detractors. They wouldn't raise these issues directly to him, but rather behind his back. The most notable argument is that this private network of his exists outside the bounds of the government, thus not only is it outside most checks and balances but also would make his private network loyal only to him. This concern does begin to gnaw on you, although perhaps you are overthinking it too much. Instead you decide to do what they would not, talk to Thayo about it. "
 hskv.132.desc:0 "You just noticed that did you? Yes, that is perhaps my most signature approach to governance, one which I was quick to replicate here. Accurate information, knowing the motivations of all players in the game, and even being able to nudge things a certain way. These are the key to both making sound decisions and also to ensure the best possible outcome. You can not plan five moves ahead if you can't even see what their current move is now."
 hskv.132.response:0 "So a spy network?"
 hskv.133.desc:0 "REPLACE_ME  (MAKE BETTER) You are not wrong in such an interpretation. There would be much overlap between the two concepts. Still, you do make a good point that perhaps I should be offering these services to your own Intelligence Director. Perhaps it might allow us both to perform even better at our jobs."

 hskv.135.name:0 "Strange Rumors"
 hskv.135.desc:0 "While Thayo might overstep himself with his initiative, his record since joining your empire has been flawless. However, this impeccable record has started to see the first signs of… not quite a black mark, but an undercurrent of worry. It is not that anything wrong has been found or proven, but rather that there has been a considerable amount of rumors and talk about Thayo, specifically about what he has been doing with his own private network of orderlies. Shady dealings, meeting with individuals of questionable moral caliber, and even accusations of him enriching himself over the course of performing his duties.\n\nSome have wondered if these unsubstantiated rumors are a ploy by some rival or foreign empire to discredit him. While others have suggested that the amount of leeway he has been given has allowed him to put his claws into more and more pies in the empire, eventually getting to the point where he might be in control instead of you. TODO (a little more, random crime somewhere)"
 hskv.135.response:0 "REPLACE_ME"

 hskv.136.desc:0 "REPLACE_ME"
 hskv.136.response:0 "REPLACE_ME"
 hskv.137.desc:0 "REPLACE_ME"
 hskv.137.response:0 "REPLACE_ME"

 hskv.140.desc:0 "The collaboration between Thayo and your Intelligence officers has been paying dividends. Already the efficiency of all your agents have been improved by a significant amount such that you are all surprised that something as simple as organizational logistics with a smart mixture of strong managerial authority mixed with local autonomy who are empowered to improvise could provide such a noticeable benefit as to throw out every leadership book written in the past century."
 hskv.141.name:0 "Dangerous Initiative"
 hskv.141.desc:0 "You were not expecting to wake up to a golden bomb being placed on your desk, but that is precisely the best analogy for the report Thayo has put on your desk. In it, Thayo has detailed a daring plan, called Operation Suffocating Tendril to discover and convert a number of potential assets across nearly every single empire we are in contact with. This in itself is a very interesting proposal that as a lot of merit, risk, and costs associated with it.\n\nThat wasn't the problem though. The problem was that he had already put this operation into effect over a year ago and you only just discovered it this morning. Now you need to figure out what damage control, if any, you want to perform on this."
 hskv.141.option.a:0 "Operation Suffocating Tendril is exactly what we need!"
 hskv.141.option.a.tooltip:0 "We will gain a random asset from nearly every empire we are in contact with. We will also gain a -25 opinion with every empire as well."
 hskv.141.option.b:0 "The scope of this must be restricted at all costs"
 hskv.141.option.b.tooltip:0 "The fallout of this could risk a serious diplomatic incident that we must avoid. The benefit of a Gather Information operation will complete against nearly every empire we are in contact with."
