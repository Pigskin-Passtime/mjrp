 hskv_hunt.2100.name:0 "Thayo Everdawn's location identified"
 hskv_hunt.2100.desc:0 "Despite the many setbacks and traps we had to deal with, we managed to finally identify Thayo's base of operations in an obscure and secluded system. All records suggested that the trading post located here was a very old space station suffering from neglect, barely able to make it's taxes. But an eye witness report from a covert operative has shown us footage that it is bustling as if it was one of our central trading hubs. Whatever Thayo is planning, it is big, big enough to rival small empires. But whatever it is, it must be stopped so we can recover what he stole from us."
 hskv_hunt.2100.response:0 "Commence Operation Dawntaker"
 hskv_hunt.2101.name:0 "Operation Dawntaker"
 hskv_hunt.2101.desc:0 "The operation was sealed at the highest possible classification. Everything was on a Needs to Know basis. Although you still couldn't shake the feeling that Thayo's agents are in so deep that he already knows. Still, after careful preparations you order the assault.\n\nYour fleet warps in, hoping for the element of surprise, but it is clear that they are already expecting you. But while they had a number of sizable combat vessels at the ready to intercept, it was clear that they were hopelessly outmatched. Your fleet came in expecting a fight, if at a minimum to capture fleeing ships, but to your admiral's surprise, your demands of surrender were accepted.\n\nEven more surprising was that Thayo himself was present at the trading post, although the only condition of his surrender was to speak with you. With him finally in custody, we can humor his final request and get to the bottom of this whole mess."
 hskv_hunt.2102.name:0 "Thayo Everdawn"
 hskv_hunt.2102.desc:0 "§YThayo walks into the conference room on the fleet's flagship, escorted by five armed guards, yet his demeanor gives you pause, for it is not the disposition of one who has lost, but rather one of confidence, the confidence has has always shown ever since he first began working for us.§!\n\nI must say that I am impressed [Root.Leader.GetName]. You know how I pride myself being five moves ahead of everyone. But it would seem that I may have played my hand too soon, and now I am only two moves ahead. That's right. You might believe you have me in checkmate, but rest assure, this is merely check.\n\nStill. Your interference will cause this entire operation to suffer an unacceptable setback. Thus in order to ensure the continue success of my project, attempting to try and accomplish it by myself is no longer an option, we are going to need to work together."
 hskv_hunt.2102.option.response:0 "After all you've done? Why on [Root.Capital.GetName] would I accept?"
 hskv_hunt.2102.desc:0 "Remember how I once told you that [hskv_target_fe_country.GetRealName] forcefully prolonged my life? I spared you the grisly details at the time. But those details are the crux of the matter, of my suffering.\n\nYou see, I am not just long lived, but conditionally immortal. Now now. That is not to say you couldn't fling this body into the sun. But this shell is an avatar for my consciousness. The source of which is elsewhere. And let me assure you, having a consciousness but no body is the closest thing to an actual hell this side of the Shroud. Something which [hskv_target_fe_country.GetRealName] demonstrated several times to me during my imprisonment.\n\nEverything I've done since you freed me was for a single goal. To recover my stolen consciousness, because, believe or not, I am tired of this long life of suffering... Even more so that it is at the whim of my jailer, a chain I can never be freed of unless I take back what never should had been stolen from me."

 hskv_hunt.2102.option.a:0 "Where is your consciousness located?"
 hskv_hunt.2102.option.a.response:0 "It is located in a system off the star maps near [hskv_target_fe_country.GetRealName] which they fittingly call Dawn's End. There a giant starbase called the Everdawn Vault, houses what remains of our once great empire. Cultural artifacts and technological marvels that they somehow decided not to purge from all records. But it also houses the Astral Anchor which houses my consciousness. You might consider it something akin to a phylactery, to borrow a term used in some of your folk tales of old. It takes advantage of my psychic connection, transmitting through the Shroud, and forcefully binds me there, should this body ever succumb."
 hskv_hunt.2102.option.b:0 "What is your plan?"
 hskv_hunt.2102.option.b.response:0 "Walking through the front door of [hskv_target_fe_country.GetRealName] is out of the question. Even were you able to get into their good graces, they would never let you anywhere near there. So I plan to take advantage of some historical curiosity between Azure Dream and Dawn's End. There once used to be a stable wormhole between the two systems back when they were constructing my prison. But at some time between my imprisonment there and now, the wormhole collapsed. Whether it was by their doing or just natural decay I cannot say. But I've been working on developing a device which will restore the wormhole which connects the two systems, albeit temporary, thus getting us access to the vault.\n\nOnce there I will use a special device to jam their inter-systems communications and prevent them from sending word to the rest of [hskv_target_fe_country.GetRealName]. It will not stop them forever, but it will buy us the time we need to complete the operation and cover our tracks."
 hskv_hunt.2102.option.c:0 "Enough Talk"
 hskv_hunt.2103.name:0 "REPLACE_ME"
 hskv_hunt.2103.desc:0 "Alright then. What do you think? If we're successful, the contents of this vault will exceed your wildest expectations and [hskv_target_fe_country.GetRealName] will never realize it was us."
 hskv_hunt.2103.option.1:0 "We want in on your plan, but no more tricks"
 hskv_hunt.2103.option.2:0 "No. We've had enough of your shenanigans"
 hskv_hunt.2104.name:0 "REPLACE_ME"
 hskv_hunt.2104.desc:0 "§YThayo pauses to take a long sigh§!\n\nI was afraid it would come to this. I thought I would have had enough time to complete this project before any consequences would catch up to me. But it would seem that I have misjudged you that my offer of the vault would be spurned like so. It is fortunate then that my plans do account for such miscalculations. Let me just say, I did warn you.\n\n§YThayo then suddenly claps his hands three times§!\n\nActivate Contingency Dusk Star."
 hskv_hunt.2104.response:0 "What?!"
 hskv_hunt.2105.name:0 "Chaos"
 hskv_hunt.2105.desc:0 "Suddenly three of the five armed guards watching Thayo turned their guns on the other two before one shoots at the monitor allowing you to communicate with him. As the signal goes dead you see alarms and reports filling your notifications."
 hskv_hunt.2106.desc:0 "Chaos was not just confined to that room, but across the entire system. We had aldready accounted for the risk of sleeper agents for this mission, but it would seem that Thayo cashed in all his chips. Fighting began to break out between our own forces while Thayo's combat vessels that stood down now suddenly power back up. By the time the dust settles, there is no sign of Thayo. While he might have had to leave the majority of his ill gotten goods in the system, the extensive unexpected fighting has caused widespread damage to some of these assets."
 hskv_hunt.2110.desc:0 "While the value of my word has been lessened to you, perhaps you can take solace in that I have bared my most important and personal motivation. Assuming you believe me of course. But knowing my motivation, you should be able to see how it drove all my actions since the day you freed me. And it is this consistency, these actions that further this goal, which you should believe in. Of course how I achieve that goal can be complex, far reaching, and obfuscated, but they all lead towards this goal. And it is -that- you should believe in, not my words.\n\n.There is also one thing to note about this device is that it requires a substantial amount of Zro to function as well as a very large starbase to power it. Sourcing this much will require a significant amount of investment, something which I can help with if needed. It was, unfortunately, the one deficiency that was holding back my operation from a timely execution."
 hskv_hunt.2111.desc:0 "We will help you, but "
#TODO Offer an Ether Drake Nest to get Zro if you don't got any?


 hskv.1113.name:0 "Wormhole Stabilization Generator built"
 hskv.1113.desc:0 "With the Wormhole Stabilization Generator built in Azure Dream, we can now begin the complicated special project to stabilize the wormhole."
 hskv.1114.name:0 "Wormhole Stabilized"
 hskv.1114.desc:0 "The Wormhole Stabilization Generator was successful in at least temporarily bridging the wormhole between Azure Dream and Dawn's End. As Thayo warned, once we enter, he will use the jamming device to prevent them from sending a distress call out, but we will only have a short time period to secure the vault and it's treasures.\n\nIt is strongly recommended that we have a reasonable stockpile of resources as well as soldiers, construction ships, and science ships in reserve at Azure Dream before we send our fleets into Dawn's End."



 hskv.1120.name:0 "Dawn's End"
 hskv.1120.desc:0 "Our fleet has just passed through the wormhole into Dawn's End. The system contains few things of note outside of the substantial asteroid field, save for a single very large starbase like structure, no doubt the Everdawn Vault Thayo spoke of. However, before we have any time to survey the system, a large fleet has begun to take off from the facility and move on an intercept course to us. Even before they have all finished taking off, the flagship of the group has hailed us with a communication beam that is so powerful that at first we thought it might have been a long range attack. It is doubtful that any peaceful resolution can be had, but we might as well hear them out."
 hskv.1121.name:0 "Communication from §H[hskv_target_fe_country.GetRealName]§!"
 hskv.1121.desc:0 "Arrogant little wretch! I don't know how you barbarians managed to find this system. But this system is restricted and is under the protection of §H[hskv_target_fe_country.GetRealName]§! and unless you leave immediately, I will annihilate every single one of your worthless toys you call spaceships. And depending on how I feel afterward, maybe I'll head through that wormhole you somehow created and destroy everything on the other side too. But not before I inform my liaison about this trespassing onto our-\n\n§HThe smug [hskv_target_fe_country.GetSpeciesName] pauses as they look off screen, and you feel some gleeful vindication at him being somewhat flabbergasted.§!\n\nWhat do you mean you can't contact [hskv_target_fe_country.Capital.GetName]?!\n\n§HThe realization they are still communicating with you hits them as they turn back to you, in an expression you can only assume to be [hskv_target_fe_country.GetSpeciesName] equivalent of the rage of a thousand burning suns.§!\n\nYour actions have earned you no mercy. Your death will be so swift that you won't even have time to make your peace."
 hskv.1121.response:0 "We've come too far to back down now. Battlestations!"

 hskv.1122.name:0 "Time is ticking"
 hskv.1122.desc:0 "Thayo has sent us a message, very politely, that the jamming device will not keep §H[hskv_target_fe_country.GetRealName]§! from communicating from their high command indefinitely. Eventually they will break through or find some alternative way of sending a message. Thayo does have a contingency plan for this, but there will be consequences and strongly urges you to secure the vault before it is too late."





 hskv.1130.name:0 "Dawn's End secured"
 hskv.1130.desc:0 "With the defeat of §H[hskv_target_fe_country.GetRealName]§! fleet, we can move in our forces to secure Everdawn vault. The size of it, as well as the sensitivity of securing it without damaging it, will make this a significant challenge for our forces. It is also imperative to take note of how much time we have available. If we are unable to fully secure the vault before the jamming device is overcome, then §H[hskv_target_fe_country.GetRealName]§! will be alerted to our actions and we can expect a quick and merciless response. In order to help you keep track of how much time we have, a situation has been created to give you an overview of the heist itself."

