 hskv_heist.2800.name:0 "Everdawn Heist - Final Phase"
 hskv_heist.2800.desc:0 "Navigating the seemingly endless corridors of the inner vault took longer than expected. The clock was ticking and the anxiety of running out of time was on everyone's mind. But eventually a forward scout reported the largest and most impressive vault so far, with doors twice has large as any other vault we've seen so far. On the door itself was a single [hskv_target_fe_country.GetSpeciesName] statement - The Everdawn Tyrant - May his soul suffer under the weight of his sins until the very stars fade away'  Opening the door proved to be surprisingly trivial compared to every other challenge we've had to deal with so far, but what it revealed surpassed our wildest expectations.\n\nInside at the very center of the chamber was a large spherical device, humming with some dark unknowable energy. The walls were lined with strange computers and robotic workers moving slowly around as they maintain it. Then a bolt of purple lightning arced around the spherical device and to your horror, it began to uncurl and then reform into an ominous floating machine that moved closer to the entrance.\n\nUnauthorized Personnel in the Everdawn Containment Facility. Lethal force authorized.\n\nBefore the machine began to spit out concentrated laser fire. This is it, the final obstacle in our way!"
 hskv_heist.2800.option.a:0 "Can we use explosions again?"
 hskv_heist.2800.option.a.tooltip:0 "Screw it. I don't care that we shouldn't damage this room, I am sick and tired of dealing with these impediments."
 hskv_heist.2800.option.b:0 "Hack it"
 hskv_heist.2800.option.b.tooltip:0 "Another machine we can target with our cyber warfare techniques. However the length of time this will take depends entirely on how skilled our empire is at codebreaking."
 hskv_heist.2800.option.c:0 "Use Military Force"
 hskv_heist.2800.option.c.tooltip:0 "Few things can't be solved with overwhelming firepower lead by a competent commander."
 hskv_heist.2810.desc:0 "But before you could give any order to fall back and begin the process of dealing with this final machine, you suddenly notice a cloaked figure already deep inside the room. Not cloaked as in a physical cloak, but rather the tell tale shimmer of light bending around it. Only noticeable due to the speed at which it was moving. As your scouts retreated from the room, the footage of inside the room continued to show it moving towards an elevated platform near the back that could supervise the entire chamber."
 hskv_heist.2811.desc:0 "You order your forces to engage with the machine, an attempt to distract it from whatever that cloaked shimmer is as it enters the elevated platform. It was at that moment that the machine screams some large mechanical noise and rushes towards the platform. It tries to put one of its tendrils through the entrance before it screams further. A scream not of emotion, but rather a result of it pushing itself 110% of it's capabilities. Then the lights on the machine suddenly go out and it collapses to the floor."
 hskv_heist.2812.desc:0 "REPLACE_ME - Reveal Thayo has the figure"
 hskv_heist.2813.desc:0 "REPLACE_ME - Thayo gets his consciousness back and becomes level 10"










 hskv_heist.3000.name:0 "The Treasures of the Everdawn Dynasty"
 hskv_heist.3000.desc:0 "REPLACE_ME - SO MUCH LOOT"


 hskv_heist.3005.name:0 "A Panicked Giant"
 hskv_heist.3005.desc:0 "It was only a matter of time before [hskv_target_fe_country.GetRealName] would learn of the theft that occurred there. But thanks to our efforts, we managed to cover our tracks well enough that they have no idea it was us. In fact because we knew this would happen, we managed to take some actions preemptively to make us seem less suspicious. But in their paranoia of unseen threats, they view everyone as a possible suspect to the crime, even without any evidence. How this will change galactic politics is unclear. Perhaps they will lash out, perhaps not. But as long as they see everyone else as more suspicious than us, we should be fine."
 hskv_heist.3010.name:0 "False Flag Operation"
 hskv_heist.3010.desc:0 "While Thayo has very good reason to be joyful as of late, you can see the joyful glint in his eyes as he offers a proposal to you. Due to the speed at which they managed to secure the inner vault, we now have time to do more than just cover our tracks, but to actually implicate another empire for our actions. This false flag operation would likely result in provoking [hskv_target_fe_country.GetRealName] into a hostile action against them, significantly harming one of our galactic rivals and potentially giving us an opening to exploit them. Which of the following empires should we implicate for the Heist on Everdawn Vault?"
 hskv_heist.3010.option.a:0 "[hskv_fe_false_flag_candidate_1.GetRealName]"
 hskv_heist.3010.option.a.tooltip:0 "[hskv_target_fe_country.GetRealName] will declare war on [hskv_fe_false_flag_candidate_1.GetRealName] in 90 days"
 hskv_heist.3010.option.b:0 "[hskv_fe_false_flag_candidate_2.GetRealName]"
 hskv_heist.3010.option.b.tooltip:0 "[hskv_target_fe_country.GetRealName] will declare war on [hskv_fe_false_flag_candidate_2.GetRealName] in 90 days"
 hskv_heist.3010.option.c:0 "[hskv_fe_false_flag_candidate_3.GetRealName]"
 hskv_heist.3010.option.c.tooltip:0 "[hskv_target_fe_country.GetRealName] will declare war on [hskv_fe_false_flag_candidate_3.GetRealName] in 90 days"
 hskv_heist.3010.option.d:0 "[hskv_fe_false_flag_candidate_4.GetRealName]"
 hskv_heist.3010.option.d.tooltip:0 "[hskv_target_fe_country.GetRealName] will declare war on [hskv_fe_false_flag_candidate_4.GetRealName] in 90 days"
 hskv_heist.3010.option.e:0 "[hskv_fe_false_flag_candidate_5.GetRealName]"
 hskv_heist.3010.option.e.tooltip:0 "[hskv_target_fe_country.GetRealName] will declare war on [hskv_fe_false_flag_candidate_5.GetRealName] in 90 days"
 hskv_heist.3010.option.f:0 "No need to risk it, just cover our tracks"
 hskv_heist.3011.name:0 "Communication from §H[hskv_target_fe_country.GetRealName]§!"
 hskv_heist.3011.desc:0 "We never realized just how full of yourselves you lesser species are. Thinking that you can just attack our most secret systems and get away with it! It seems like a farmer must remove weeds from the garden, so must we from you insolent miscreants. You best use this time to consider your actions and learn from them, least we return to finish the job.\n\n§HYou were framed for this transgression§!"
 hskv_heist.3011.response:0 "It wasn't us!"


