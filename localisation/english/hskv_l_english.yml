 hskv_hunt.1000.name:0 "Gone"
 hskv_hunt.1000.desc:0 "Gone. It's all... Gone. Much of our energy and resources, some of our ships and even some of our leaders whom we once thought were loyal... gone. In the span of a single day, countless transactions funneled away our energy credits into a torrent of credit laundry schemes as to vanish entirely, entire warehouses full of building materials or exotic crystals emptied, and ships vanishing while in transit.\n\nOnce the shock wore off, replaced with raw panic, every resource was applied to investigate and get to the bottom of it. The initial fear of it being an act of war was quickly dispelled, although now replaced with the fear that our enemies might instead might pounce on us in our moment of weakness. It soon became abundantly clear that this was an inside job, and when you look at the sheer scope and scale of this theft, there really is only one person in the galaxy who was skilled , motivated, and audacious enough to pull something like this off."
 hskv_hunt.1000.response:0 "THAYO EVERDAWN!!!"
 hskv_hunt.1000.response.tooltip:0 "In additional, roughly 20% of our fleet will also go missing"
 hskv_hunt.1001.name:0 "Task Force Created"
 hskv_hunt.1001.desc:0 "Given the sheer size of this grand larceny, including the theft of critical materials for the empire, let alone the insult of working with us for so long before ultimately betraying us, that there is no choice but to try and hunt Thayo down. It won't be easy, Thayo has almost certainly covered his tracks as he prepared this hiest decades in advance. But even he could not cover every track for an operation of this scale. Yet perhaps the most alarming thing of all is that we have no insight into his motivation as to why he did this. While greed could explain some of his many actions, it does not explain all of them. A few theorize that he could be trying to misdirect us, but without knowing what his goal could be, it is hard to figure out what he might be doing right now.\n\nNone the less, we have started a task force to try and locate Thayo. This information will be summarized in an ongoing situation where you can authorize our budget and resources for our effort."
 hskv_hunt.1001.response:0 "He will not get away with this"

