 bts.35.name: "Besmirch At The Federation"
 bts.35.1.desc: "secretly accepted hundreds of thousands of dollars in Liberty Bonds in exchange for leasing former Navy oil reserves in Wyoming known as Teapot Dome to a private company."
 bts.35.2.desc: "fed rumor 2"
 bts.35.3.desc: "fed rumor 3"
