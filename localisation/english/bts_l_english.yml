 bts.32.name: "Gossips At The Galactic Community"
 bts.32.1.desc: "he company hired to build the Union Pacific Railroad, used its stock to bribe top officials in President Ulysses S. Grant’s administration — including the Vice President, the Speaker of the House and other members of Congress — to secure federal support to build a transcontinental railroad."
 bts.32.2.desc: "involved a secret arrangement to sell weapons"
