l_english:
  # Flags for picker:
  naod_allowed: "§GNaodeus Allowed§!"
  naod_disabled: "§RNaodeus Disabled§!"
  spawn_naod: "Spawn Naodeus"
  naod_tooltip: "Naodeus is (presumably) a shroud entity, who likes to see prosperity, change and species cooperate with each other."
  # Names
  naod_Naodeus: "Naodeus, Bringer of Change"
  naod_system_name: "Ilianas"
  naod_planet_name: "Talil"
  naod_Schwiff: "Schwiff"
  naod_Schwiff_pl: "Schwiffs"
  naod_Feder: "Feder"
  naod_Feder_pl: "Feder"
  naod_Rukh: "Rukh"
  naod_Rukh_pl: "Rukhs"
  naod_militias: "Battle mages" 
  
  naod_scan_talil: "The planet §HTalil§! is exceptional in several ways. It is inhabitated by several different species that seem to live in harmony with each other. "

  naod_naodeus_backstory: "Naodeus is a entity that lived on the planet Talil. The entity is not from that planet, we are even quite certain that it is from beyond the physical plane. It might have its origin in the shroud."
  
  #Event series to recruit Naodeus
  naod_event_observation_post_opener_title: "A letter"
  naod_event_observation_post_opener: "The observation post above §HTalil§! has received a strange massage. To be precise a sealed letter addressed \"To $COUNTRY$\" made from several material unique to the planet below. The seal shows a chimera made of the three sapient species on the planet. Nobody nows how it ended up in the observation post, but this morning the head scientist found it on her desk."
  naod_event_observation_post_opener_a: "Open the letter."
  naod_event_observation_post_opener_b: "This must be a hoax. Destroy it."
  naod_event_observation_post_opener_c: "This letter is radating psychic in immense ammounts, we should be careful."
  naod_open_letter: "The letter reads in perfect [Root.GetSpeciesAdj] language: \n §HDear observers, \n \n I hope you have made your self comfortable above this nice little planet I live on at the moment. I'm curious to meet you and I have a proposal for your boss boss. I'm sure you have ways to contact him. I will be up with you in 180 days. \n \n Love, \n Naodeus, Bringer of Change§!"
  naod_open_letter_a: "Prepare for that day, the guest should feel welcome."
  naod_open_letter_b: "This has to be a hoax. Find the jester and punish him or her."
  naod_open_letter_c: "Triple the guards. Kill the would-be-intruder."
  naod_event_manifestation_a: ""
  naod_event_manifestation_b: ""
  naod_event_manifestation_c: "The observation post was on high alert. Armed squadrons patroled the observation post. The scientists were in the main analysis room"
  naod_event_manifestation_d: ""
  naod_naodeus_recruitment_initial_title: "Naodeus"
  naod_naodeus_recruitment_initial_desc: "I have been called a lot of names in my lifes. The name most used is §HNaodeus§!. \nIt has been a really long time since I have met a spacefaring civilisation. At least two, more likely five to twelve, reincarnations ago.\nI came her to give you an offer and a warning. \nFirst the offer, I'm interested in working for your nation. §HI hope we can make this galaxy together a better place for everyone.§! Second the warning: §RIf you nation dare to harm the children of Talil, you or your successor will pay for the atrocity personally.§!"
  naod_naodeus_recruitment_species_question: "What are you?"
  naod_naodeus_recruitment_species_answer: "A very interesting question. Sadly you language does not have a good category for me. The best might be shapeshifter, who likes to test the limits of the reality containing her."
  naod_naodeus_recruitment_transporation_question: "How did you come onto this station?"
  naod_naodeus_recruitment_transporation_answer: "I bend space, so that this room is next to my bed chamber."
  naod_naodeus_recruitment_reincarnations_question: "Reincarnations?"
  naod_naodeus_recruitment_reincarnations_answer: "Sometimes life gets dull and boring, so I quit and start a new one by getting reborn. Why do you ask?"
  naod_naodeus_recruitment_training_question: "What exactly can you do for us?"
  naod_naodeus_recruitment_training_answer: "I can help you improve the cooperation between species in your nation. I might be able to show you and others from your nation life from a different perspective."
  naod_naodeus_recruitment_price_question: "What do you expect to get out of this deal?"
  naod_naodeus_recruitment_price_answer: "New perspectives, new friends, new ways to break the boundarys of my own imagination, new things to lern, new way to learn old things, debates that will help me further refine or even better change my point of view. Also, as I said, I hope that we together can make this galaxy a better place."
  
  #Event to grant the special project to turn synths into biological pops
  naod_special_project_offer: "I have talked with several synths about the shroud and they where all very interested in it. They were sad, that they would quite likely never experience it first hand. So I ponder a while, how I could change that. I designed a ritual to transform them into biological beings with a deep conection to the shroud! I need some resource to prepare the ritual so I wanted to ask if could get them and if yes on which scale I should perform it?"
  naod_special_project_offer_no: "I don't think we should waste resource on this."
  naod_special_project_offer_yes: "It's all or nothing."
  naod_special_project_offer_yes_hover: "Starts the Complete Inverse Synthtic Evolution special project" 

  naod_special_project_name: "Complete Inverse Synthetic Evolution"
  naod_special_project_desc: "Transforms all synthetic pops into biological ones with the (latent) psychic trait."

  #Event to troll xenophobe pops.
  naod_event_karmic_justice_racism_name: "Karmic Transformation"
  naod_event_karmic_justice_racism: "<Xenophob Leader> is holding a speech"

  #Event to troll spirtualist pops.

  #Events about shroud entities


  #Events that force Naodeus to leave
  naod_attack_on_talil: "§H[Root.GetRulerTitle] [Root.GetRulerName]§! was holding a speech to the masses about the invasion of §HTalil§!, when [Root.Leader.GetSheHe] suddenly screamed in pain. Before anyone could reach [Root.Leader.GetHerHim] to help, [Root.Leader.GetHerHim] caught fire. A disembodied chorus of deeply dishamornious voices shouted §H\"It's time you pay for your arrogance.\"§! \n Seconds later [Root.GetRulerName] evaporated."
  naod_attack_on_talil_naodeus_ruler: "When §H$naod_Naodeus §! learned, that his military attacked §HTalil§! he was furious. It left the nation, killing on her way out the attacking army."
  naod_become_the_crisis: "§H[Root.GetRulerTitle] [Root.GetRulerName]§! found a letter on [Root.Leader.GetHerHim] desk. §H\"Dear Monster. \n Under the circumstances I can't cooperate with you or your minions any longer. I quit. I'm disgusted that I helped you along the way, so I will give you a parting gift. I hope it will weaken you enough, that someone else can stop you. \n May you die the horrible death you deserve,\n $naod_Naodeus\" \n The letter desintegrated and everyone in the nation transformed in horrifing ways."
  naod_become_the_crisis_naodeus_ruler: "§H$naod_Naodeus §! has vanished without a trace. Everyone else in the council was found dead."
  
