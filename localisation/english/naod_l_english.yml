  naod_naodeus_backstory: "Naodeus is a entity that lived on the planet Talil. The entity is not from that planet, we are even quite certain that it is from beyond the physical plane. It might have its origin in the shroud."
  ### Special Project ###
  NAOD_INVERSE_SYNTHETIC_EVOLUTION_PROJECT: "Inverse Synthetic Evolution"
  NAOD_INVERSE_SYNTHETIC_EVOLUTION_PROJECT_DESC: "Transforms all synthetic pops in $COUNTRY$ in biological pops with (latent) psionic abilities."

  ### Static Modifiers ###
  naod_brilliance_from_diversity: "Brilliance from Diversity"
  naod_brilliance_from_diversity_desc: "We gained an insight into the many perspectives Naodeus takes to enhance the beauty and quality of the products around us."
  naod_psionic_defense: "Psionic Defense"
  naod_psionic_defense_desc: "A strong shared mental guard to warn against unwanted intruders."

  ### Traits ###
  leader_trait_manifested_change: "Manifestation of Change"
  leader_trait_manifested_change_desc: "It is assumed, that this leader is a manifestation from the shroud."
  leader_trait_bringer_of_unrest: "Bringer of Unrest"
  leader_trait_bringer_of_unrest_desc: "The tendency to encourage doubt in every principle coupled with a will for lengthly discussions with every opposition increases the influence of other ethics."
  leader_trait_xeno_integrator: "Xeno Integrator"
  leader_trait_xeno_integrator_desc: "This leader is a master to orchestrate the cooperation of different species."
  leader_trait_xeno_integrator_effect: "$PLANET_EFFECTS_TXT$:\n$t$Increase $mod_planet_jobs_produces_mult$ output by §G.5%§! per Species on the Planet\n$t$Increase £trade_value£ §Y$TRADE_VALUE$§ by §G1%§! per Species on the Planet\n\n$SECTOR_EFFECTS_TXT$:\n$t$Increase $mod_planet_jobs_produces_mult$ output by §G0.25%§! per Species on each Planet\n$t$Increase £trade_value£ §Y$TRADE_VALUE$§! by §G0.5%§! per Species on each Planet"

  ### Events ###
  #Event series to recruit Naodeus
  #Path Science Ship
  naod.beingWatched.title: "Watchers being watched"
  naod.beingWatched.desc: "The crew surveying §HTalil§! reports, that they felt permenantly being watched, while on mission around the planet. Some rise concerns, that they might have overlooked something. Other want to investigate further, hoping that they can find the reason for this phenomenon."
  naod.beingWatched.a: "Further investigate."
  naod.beingWatched.b: "We have more important things to do."

  naod_search_nadoeus_desc: "The scientists surveying the planet Talil had the permanent feeling of being watched. They want to investigate further if they can find the reason of that feeling."

  naod.studiesOfTalil.title: "Unexpected Findings"
  naod.studiesOfTalil.desc: "The scientists found several exceptionel things. They either did not realise on their first survey or they thought they eyes played tricks on them. \n The inhabitants of Talil might be in an equvivalent of the feudal era, but they seem to be capable of psionics. \n There are three main species on this planet, which live in perfect harmony with one another. This is in itself remarkable, but truly remarkable is, that there are thounsands of sapient creatures with no clear ancestry, who are completely integrated into society. \n Something the scientists could not find was the source of the feeling of being watched. Some propose, that we should speak with the natives, maybe even bribe them to get informations about entities, which could be the watching us."
  naod.studiesOfTalil.a: "Bribe them."
  naod.studiesOfTalil.b: "This was a waste of time."

  naod.meetTheNatives.title: "Friendly Hosts"
  naod.meetTheNatives.desc: "The scientists talked with many people on the planet. Each one directed them to another person. Each host was very friendly but also quite curious about us. The scientists kept our secrets mostly, but learned a lot about their culture. In the end an elderly sapient creature which is very hard to describe in short terms just told them: §H\"You amused Change enough, that she will wait for you in your flying house. I guess she loves to see the stars from up there.\"§!"
  naod.meetTheNatives.a: "There really is an unexpected guest in our science vessel."

  naod.naodeusOnBoard.title: "A Guest"
  naod.naodeusOnBoard.desc: "A young native, a §HRukh§! is waiting on the bridge. He eyes everything with utmost glee grinning from ear to ear. \" Welcome home, dear visitors!\" He vanished and several steps closer to us an elderly §HSchwiff§! appeard. \"I hope, I do not frighten you.\" She also vanished and an adult §HFeder§! of unidentifiable sex was now standing before us. \"I want to speak with your boss boss and I'm sure you can open a communication channel. \""
  naod.naodeusOnBoard.a: "Let's talk!"
  #Recruitment Window
  naod_naodeus_recruitment_initial_title: "Naodeus"
  naod_naodeus_recruitment_initial_desc: "I have been called a lot of names in my lifes. The name most used is §HNaodeus§!. \nIt has been a really long time since I have met a spacefaring civilisation. At least two, more likely five to twelve, reincarnations ago.\nI came here to give you an offer and a warning. \nFirst the offer, I'm interested in working for your nation. §HI hope together we can make this galaxy a better place for everyone.§! Second the warning: §RIf your nation dares to harm the children of Talil, you or your successor will pay for the atrocity personally.§!"
  naod_naodeus_recruitment_species_question: "What are you?"
  naod_naodeus_recruitment_species_answer: "A very interesting question. Sadly your language does not have a good category for me. The best might be shapeshifter, who likes to test the limits of the reality containing her."
  naod_naodeus_recruitment_transporation_question: "How did you come onto this station?"
  naod_naodeus_recruitment_transporation_answer: "I bend space, so that this room is next to my bed chamber."
  naod_naodeus_recruitment_reincarnations_question: "Reincarnations?"
  naod_naodeus_recruitment_reincarnations_answer: "Sometimes life gets dull and boring, so I quit and start a new one by getting reborn. Why do you ask?"
  naod_naodeus_recruitment_training_question: "What exactly can you do for us?"
  naod_naodeus_recruitment_training_answer: "I can help you improve the cooperation between species in your nation. I might be able to show you and others from your nation life from a different perspective."
  naod_naodeus_recruitment_price_question: "What do you expect to get out of this deal?"
  naod_naodeus_recruitment_price_answer: "New perspectives, new friends, new ways to break the boundarys of my own imagination, new things to lern, new ways to learn old things, debates that will help me further refine or even better change my point of view. Also, as I said, I hope that we together can make this galaxy a better place."
  naod_naodeus_recruitment_true_form_question: "Is this your true form?"
  naod_naodeus_recruitment_true_form_answers: "That depends mainly on your definition of \"true form\". I can think of at least 8 different definitions of this term, which would result in different answers."
  #Path Observation Post  
  naod_event_observation_post_opener_title: "A letter"
  naod_event_observation_post_opener: "The observation post above §HTalil§! has received a strange massage. To be precise a sealed letter addressed $H\"To $COUNTRY$\"§! made from several materials unique to the planet below. The seal shows a chimera made of the three sapient species on the planet. Nobody nows how it ended up in the observation post, but this morning the head scientist found it on her desk."
  naod_event_observation_post_opener_a: "Open the letter."
  naod_event_observation_post_opener_b: "This must be a hoax. Destroy it."
  #naod_event_observation_post_opener_c: "This letter is radating psychic in immense ammounts, we should be careful."
  naod_open_letter: "The letter reads in perfect [Root.GetSpeciesAdj] language: \n §HDear observers, \n \n I hope you have made yourself comfortable above this nice little planet I live on at the moment. I'm curious to meet you and I have a proposal for your boss boss. I'm sure you have ways to contact him. I will be up with you in 180 days. \n \n Love, \n Naodeus, Bringer of Change§!"
  naod_open_letter_a: "Prepare for that day, the guest should feel welcome."
  naod_open_letter_b: "This has to be a hoax. Find the jester and punish him or her."
  naod_open_letter_c: "Triple the guards. Kill the would-be-intruder."
  naod_event_manifestation_a: ""
  naod_event_manifestation_b: ""
  naod_event_manifestation_c: "The observation post was on high alert. Armed squadrons patroled the observation post. The scientists were in the main analysis room"
  naod_event_manifestation_d: ""
  
  #Event to grant the special project to turn synths into biological pops
  naod_special_project_offer: "I have talked with several synths about the shroud and they where all very interested in it. They were sad, that they would quite likely never experience it first hand. So I pondered for a while, how I could change that. I designed a ritual to transform them into biological beings with a deep conection to the shroud! I need some resources to prepare the ritual so I wanted to ask if could get them and if yes on which scale I should perform it?"
  naod_special_project_offer_no: "I don't think we should waste resource on this."
  naod_special_project_offer_yes: "It's all or nothing."
  naod_special_project_offer_yes_hover: "Starts the Complete Inverse Synthtic Evolution special project" 
  #Events that force Naodeus to leave
  naod_attack_on_talil: "§H[Root.GetRulerTitle] [Root.GetRulerName]§! was holding a speech to the masses about the invasion of §HTalil§!, when [Root.Leader.GetSheHe] suddenly screamed in pain. Before anyone could reach [Root.Leader.GetHerHim] to help, [Root.Leader.GetHerHim] caught fire. A disembodied chorus of deeply dishamornious voices shouted §H\"It's time you pay for your arrogance.\"§! \n Seconds later [Root.GetRulerName] evaporated."
  naod_attack_on_talil_naodeus_ruler: "When §H$naod_Naodeus §! learned that the military attacked §HTalil§! he was furious. It left the nation, killing on her way out the attacking army."
  
