 menp_branchial_tech_1:0 "Multiverse Analysis Department"
 menp_branchial_tech_1_desc:0 "The mysteries of ['concept_branchial_space'] demand further investigation, and so we shall create a dedicated agency for this purpose."
 menp_branchial_features_1:0 "Multiverse Applications Department"
 menp_branchial_features_1_desc:0 "While the Analysis Department probes the mysteries of ['concept_branchial_space'], the Applications Department will devise ways of applying this knowledge in our empire's endeavors."
 menp_branchial_upgrades_1:0 "Quantum Teleportation Mastery"
 menp_branchial_upgrades_1_desc:0 "Our insight into the true nature of quantum interactions allows us to easily apply techniques that were once extraordinarily difficult to initiate."
 menp_branchial_progression_1:0 "Meta-Empiricism"
 menp_branchial_progression_1_desc:0 "Modern science is built on the concepts of observers and systems. It is prime time we start focusing on the former rather than just the latter."
 branchial_level_2_req_clear_tooltip:0 "£trigger_yes£ Has researched the §Y$tech_branchial_crisis_1$ technology§!"
 branchial_level_2_req_tooltip:0 "£trigger_no£ Has researched the §Y$tech_branchial_crisis_1$ technology§!"
 menp_branchial_tech_2:0 "Branchial Weaponry"
 menp_branchial_tech_2_desc:0 "Experiments in quantum teleportation have revealed the ability of \"redefinition\", that is, the ability to replace an object in our world with a counterpart in ['concept_branchial_space']. The applications of this power are nearly limitless, although the technology is still in its infancy."
 menp_branchial_features_2:0 "Branchial Talents"
 menp_branchial_features_2_desc:0 "Our knowledge of ['concept_branchial_space'] has expanded enough that many of our most gifted minds have discovered unique applications of it for their own ambitions."
 menp_branchial_upgrades_2:0 "Branchial Navy"
 menp_branchial_upgrades_2_desc:0 "Our researchers have proposed several potential upgrades to our naval technology, utilizing deeper insights into Branchial mechanics. If successful, these improvements could boost our navy significantly."
 menp_branchial_progression_2:0 "Seeing is Weaving"
 menp_branchial_progression_2_desc:0 "It is clear to us now. Consciousness creates reality. We must find a way to replicate the power of the mind to shape reality, without having to resort to troublesome artificial intelligences."
 branchial_level_3_req_clear_tooltip:0 "£trigger_yes£ Has researched the §Y$tech_branchial_crisis_2$ technology§!"
 branchial_level_3_req_tooltip:0 "£trigger_no£ Has researched the §Y$tech_branchial_crisis_2$ technology§!"
 menp_branchial_tech_3:0 "Who Controls the Past..."
 menp_branchial_tech_3_desc:0 "...controls the future. Our researchers have brought forward a game-changing proposition. The device they have presented, if fitted on our ships, could rewrite the history of whatever it hits, opening the door to a whole host of applications, including the conversion of enemy ships to our side. We must pursue this technology as soon as it is feasible."
 menp_branchial_features_3:0 "Every Man a Physicist"
 menp_branchial_features_3_desc:0 "The Branchial fervor has nearly our entire populace in its clutches now. The fundamentals of Branchial mechanics are taught in schools across our empire, and most high leadership offices now discriminate towards those knowledgeable in the science."
 menp_branchial_upgrades_3:0 "Branchial Confidence"
 menp_branchial_upgrades_3_desc:0 "We now know enough about ['concept_branchial_space'] to feel comfortable outfitting our navy with more ambitious components, which dive deeper into this esoteric realm, further utilizing it to our advantage."
 menp_branchial_progression_3:0 "Consensus Controlled"
 menp_branchial_progression_3_desc:0 "The sheer complexity of the Consensus Tapestry is indeed concerning, but it rests upon a faulty foundation. By creating consciousnesses with a different \"formatting\" to the ones in our universe, we could potentially rewrite vast swathes of the wider universe."
 branchial_level_4_req_clear_tooltip:0 "£trigger_yes£ Has researched the §Y$tech_branchial_crisis_3$ technology§!"
 branchial_level_4_req_tooltip:0 "£trigger_no£ Has researched the §Y$tech_branchial_crisis_3$ technology§!"
 menp_branchial_tech_4:0 "Eternal Empire"
 menp_branchial_tech_4_desc:0 "Controlled redefinition of the Consensus Tapestry could allow us to rewrite the history of entire planets, bringing whole populations into the fold as if they were always part of us, their very culture shaped to our liking."
 menp_branchial_features_4:0 "Interstellar Monarch"
 menp_branchial_features_4_desc:0 "The power to redefine an entire enemy empire has long been an ambition of ours. We expected significant challenge in achieving it, but the barriers in front of us have made this dream far out of our reach. Until now."
 menp_branchial_upgrades_4:0 "Infinite Possibilities"
 menp_branchial_upgrades_4_desc:0 "We now fully possess the power to summon the endless possibilities of ['concept_branchial_space'] to our side. Our power will soon grow beyond that of any foe."
 branchial_level_5_req_clear_tooltip:0 "£trigger_yes£ Has researched the §Y$tech_branchial_crisis_4$ technology§!"
 branchial_level_5_req_tooltip:0 "£trigger_no£ Has researched the §Y$tech_branchial_crisis_4$ technology§!"
 menp_branchial_tech_5:0 "Weaver of Fate"
 menp_branchial_tech_5_desc:0 "We've done it. Everything our empire has been working towards was for this moment. Our researchers have developed a device that could be the key to godhood, not by overcoming the consciousness formatting, but rewriting the formatting itself to our desires."
 menp_branchial_features_5:0 "Absolute Singularity"
 menp_branchial_features_5_desc:0 "Just as it is possible to stretch an object in physical space, our researchers have discovered a way to extend an object in ['concept_branchial_space'] as well, up to the point where it becomes a Branchial Singularity, absolute, immortal, and immutable by anything except its own will."
 menp_branchial_upgrades_5:0 "Even Further Beyond"
 menp_branchial_upgrades_5_desc:0 "The final generation of naval technology is within our reach, promising the ability to utilize ['concept_branchial_space'] to its true ultimate potential."

