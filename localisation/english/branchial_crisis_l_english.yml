l_english:

 ap_branchialweaver:0 "Branchial Weaver"
 ap_branchialweaver_desc:0 "There is growing speculation among our scientists that the \"random\" interactions at the quantum level may not be so random after all. If we could find a way to manipulate them, we could reach a whole new level of knowledge and power."

 concept_branchial_space:0 "§GBranchial Space§!"
 concept_branchial_space_desc:0 "Branchial Space is an emergent space formed from the various entangled quantum states of our universe. It contains all possible configurations of the universe, past present and future, that are consistent with the laws of physics."
 concept_branchial_redefinition:0 "§GBranchial Redefinition§!"
 concept_branchial_redefinition_desc:0 "Branchial Redefinition is a powerful technique which involves \"distortion\" of the universal quantum reference frame, thus effectively \"rewriting\" the history of objects to transform them into a different state. This power has a whole host of applications, from simple multiversal travel, to the complete reconstruction of reality itself."

