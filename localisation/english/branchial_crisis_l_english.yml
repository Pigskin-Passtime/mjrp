 branchial_proficiency_crisis_level_desc:0 "To advance through the Crisis levels, accumulate $branchial_proficiency$ and research the Special Crisis Technologies"

 branchial_proficiency_crisis_description_title:0 "Branchial Weaver"
 branchial_proficiency_crisis_description:0 "$menace_crisis_description_intro$\n\nThe newly discovered ['concept_branchial_space'] of the multiverse is extremely fascinating. It is a realm where potentiality flows freely, with limitless universes existing side by side. If these chaotic flows of possibility could somehow be harnessed, channeled, then we would become truly unstoppable."
 branchial_proficiency_crisis_howto_title:0 "Multiverse Rewriting"
 branchial_proficiency_crisis_howto:0 "Pursuing §HCrisis Objectives§! generates £branchial_proficiency£ §H$branchial_proficiency$§!, improving our understanding of ['concept_branchial_space']. As our knowledge grows, we must partake in ['concept_branchial_redefinition'] to secure our rightful place as monarchs over all reality."

