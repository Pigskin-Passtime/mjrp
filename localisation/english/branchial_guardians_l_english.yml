l_english:
 branchial_guardian.3.name: "TRANSMISSION"
 branchial_guardian.3.desc: "You stand before a representative of the Infinite Empire, an empire spanning galaxies. Kneel and you will be allowed to serve. Resist and you will be erased from existance."
 branchial_guardian.3.a: "What is the Infinite Empire?"
 branchial_guardian.3.a.response: "The Infinite Empire is the true ruler of what you call Branchial Space. It rules hundreds of galaxies in the multiverse, all which swear fealty to our immortal emperor."
 branchial_guardian.3.b: "Why are you attacking us?"
 branchial_guardian.3.b.response: "You have unlocked the secrets of Branchial Space and gained the attention of the Infinite Empire as my species once did. There can only be one master of Branchial Space, and that is not you."
 branchial_guardian.3.c: "You think you can defeat us?"
 branchial_guardian.3.c.response: "The Infinite Empire possesses the industrial might of hundreds of galaxies. Our force here is merely a warning, so that you know what risks you are taking by studying Branchial Space."
 branchial_guardian.4.name: "Branchial Space"
 branchial_guardian.4.desc: "An analysis of deep Branchial Space revealed something unexpected. Branchial Space, originally thought to be a chaotic dimension of possibilities, is actually highly stable. It's as if there is a single powerful will controlling everything."
 branchial_guardian.4.a: "Interesting"
 branchial_guardian.5.name: "An Unknown Enemy"
 branchial_guardian.5.desc: "After a routine dive into Branchial Space, one of our observatories reported movement in Branchial Space. Something followed our ships to our reality. Soon after, a large fleet emerged from a rift and started attacking us. We do not know who or what they are, but they seem to originate from deep within Branchial Space."
 branchial_guardian.5.a: "This is bad."
 branchial_guardian.6.name: "Raiders Detected"
 branchial_guardian.6.desc: "We have detected a hostile fleet emerging from Branchial Space in orbit of one of our planets!"
 branchial_guardian.6.a: "Battlestations!"
 branchial_guardian.8.name: "INVASION!"
 branchial_guardian.8.desc: "We have detected a massive enemy force emerging from Branchial Space. This time, they have revealed their identity. Calling themselves the Infinite Empire, it seems that the fleets they have sent before were nothing more than small raiding groups. All attempts at negotiations were met with brutal executions."
 branchial_guardian.8.a: "It seems we are now at war..."
 branchial_guardian.9.name: "Dismantling an Empire"
 branchial_guardian.9.desc: "We have collect enough data on the Infinite Empire to choose a path. It is known the the Branchial Emperor leads every one of the Infinite Empire's conquests personally. Defeating him would be a big blow to the empire, and cause it to fracture. For this we could contact the rebels and set up an ambush for him. Or if we have psionic pops we could contact his shroud patron directly, and steal its favor. Or we could choose neither and fight the emperor directly."
 branchial_guardian.9.a: "Face them directly."
 branchial_guardian.9.b: "Contact the rebels."
 branchial_guardian.9.c: "Contact the Weaver."
 branchial_guardian.10.name: "TRANSMISSION"
 branchial_guardian.10.desc: "Another civilization trying to resist the Infinite Empire. We already know of your plan. An ambush on the emperor is risky, but if successful would bring the end to the empire. If you were any less developed I would have ignored you, but you have potential, so I will go along with your plan."
 branchial_guardian.10.a: "How long have you been fighting?"
 branchial_guardian.10.a.response: "The resistance has existed as long as the Infinite Empire itself. It was founded by the first civilization that was subjugated by the Branchial Emperor. Those people no longer exist within the resistance, but every new conquest by the emperor bolsters our forces. We are as immortal as the Branchial Emperor himself."
 branchial_guardian.10.b: "What ships can you bring?"
 branchial_guardian.10.b.response: "Our fleet consists of stolen and defected Infinite Empire ships, but as we are outnumbered it will be up to you to finish the job."
 branchial_guardian.10.c: "Goodbye"
 branchial_guardian.10.c.response: "We will ambush the emperor when he enters your reality. May fortune smile upon us all."
 branchial_guardian.11.name: "The Weaver of Thought"
 branchial_guardian.11.desc: "As you connect to the Shroud through Branchial Space, you are greeted with a multitude of identical voices.§RA newcomer? An old friend. From which reality are you from?§! Suddenly, the voices all merge into one. §RMy new herald.§! It seems the Weaver is willing to cut ties with the Branchial Emperor."
 branchial_guardian.11.a: "Why are you are willing to help us?"
 branchial_guardian.10.a.response: "§RBetrayal... Disappointment... Stagnation...§!"
 branchial_guardian.11.b: "What will we gain?"
 branchial_guardian.10.b.response: "§RNew opportunities... True godhood... Paradise...§!"
 branchial_guardian.11.c: "We accept."
 branchial_guardian.10.c.response: "§RTwo heralds... One chosen...§!"
 branchial_guardian.14.name: "The Infinite Empire"
 branchial_guardian.14.desc: "It is here, the conquest fleet. Defeating the emperor is all that stands between us and our goals."
 branchial_guardian.14.a: "To War."
 branchial_guardian.16.name: "The Rebels Arrive"
 branchial_guardian.16.desc: "The rebels have kept their part of the bargain. Their fleets have arrived to attack the Emperor. While they won't be able to defeat the emperor they will make for good cannon fodder at least."
 branchial_guardian.16.a: "We welcome our allies."
 branchial_guardian.17.name: "The Emperor Defeated"
 branchial_guardian.17.desc: "The Emperor and his conquest fleet has been defeated. As the last of his fleet is being destroyed, we hear a voice speaking to us. §RThe pact is complete. You have been chosen.§! The god of Branchial Space has declared us his herald and have given us gifts to further our goals."
 branchial_guardian.17.a: "We are unstoppable"
 #situation
