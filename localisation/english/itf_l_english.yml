# events
 itf_story.10.name:0 "Into the Forest"
 itf_story.10.desc:0 "It has been a year since the colony on [root.GetName] has been established. [root.GetName] is populated rather scarcely in these early days of the colony, with no more than half a dozen settlements and townships on the moon. Most of them are located on the other hemisphere from the §YEnchanted Forest§! as for the most part people feel wary about it. Still, as the saying goes, these is nothing a [root.owner.GetSpeciesName] cannot get used to.\n\nIn order to protect the people from any potential dangers from the §YForest§!, planetary administration has proposed to set up a Warden service. These brave [root.owner.GetSpeciesNamePlural] will oversee the §YForest§! and try to limit any contacts of local population with the wilderness."
 itf_story.10.tooltip:0 "§G1§! £job_warden£ $job_warden$ is available on [root.GetName]"
 itf_story.10.a:0 "Establish the Wardens"
 itf_story.10.b:0 "Establish the Wardens"
 itf_story.20.name:0 "Into the Forest"
 itf_story.20.desc:0 "Latest report from the Head Warden Office on [root.GetName] includes a rather peculiar incident. A strange and unusual animal has been sighted leaveing the §YEnchanted Forest§! and heading towards the nearest [root.owner.GetSpeciesName] settlement. Fortunately, Wardens have reacted immediately by apprehending the creature and safely transporting it back to its original habitat before it could do too much damage to the settlement. Howewer, what makes this rather mundane incident interesting, is that no creature similar to this has been ever seen on [root.GetName] or anywhere else in the known part of the Galaxy. With yet another proof of how little it is known about the §YForest§!, finest minds of the [root.owner.GetName] scientific community have proposed to send an expedition into the wilderness in order to learn more about it."
 itf_story.20.a:0 "Prepare an expedition"
 itf_story.31.name:0 "Into the Forest"
 itf_story.31.desc:0 "After spending many months in the §YEnchanted Forest§!, the researchers have learnt a great deal about its flora and fauna, which in turn may lead to a better understanding of biology."
 itf_story.32.name:0 "Into the Forest"
 itf_story.32.desc:0 "After spending many months in the §YEnchanted Forest§!, the researchers have learnt a great deal about healing properties of some of its herbs and plants, which in turn may lead to advancements in the population health."
 itf_story.33.name:0 "Into the Forest"
 itf_story.33.desc:0 "After spending many months in the §YEnchanted Forest§!, the researchers have learnt a great deal about its plantlife and ways to potentially limit its growth. And while there are no plans to do so on [root.GetName], this knowledge can still be useful on other worlds."
 itf_story.34.name:0 "Into the Forest"
 itf_story.34.desc:0 "After spending many months in the §YEnchanted Forest§!, the researchers have found ancient and compleletely overgrown ruins. Very little information and a few technological devices have survived the ages, but even these small glimpses into the past are immensely valuable to the scientific community."
 itf_story.35.name:0 "Into the Forest"
 itf_story.35.desc:0 "After spending many months in the §YEnchanted Forest§!, the researchers have learnt a great deal about its plantlife. A particular sort of trees have with both nutricious and tasty fruits have been found in the wilderness."
 itf_story.36.name:0 "Into the Forest"
 itf_story.36.desc:0 "After spending many months in the §YEnchanted Forest§!, the researchers have learnt a great deal about its flora and fauna, which in turn may lead to a better understanding of biology."
 itf_story.39.name:0 "Into the Forest"
 itf_story.39.desc.noSpiritualist:0 "Despite a certain cussess of the recent expedition, there is no doubt that the §YEnchanted Forest§! still has many more mysteries to solve. With that in mind, planetary administation of [root.GetName] has proposed to set up a permanent scientific outpost for long-term monitoring and research."
 itf_story.39.desc.spiritualist:0 "$itf_story.39.desc.noSpiritualist$ Alternatively, in order to get a deeper understanding of the §YForest§! and its spiritual connections to the resf of the Galaxy, a temple could be built instead of an outpost."
 itf_story.39.a:0 "Set up a research outpost"
 itf_story.39.a.tooltip:0 "§G1§! £job_researcher£ $job_researcher$ is available on [root.GetName]"
 itf_story.39.b:0 "Set up a temple"
 itf_story.39.b.tooltip:0 "§G1§! £job_priest£ $job_priest$ is available on [root.GetName]"
 itf_story.39.c:0 "Set up a research outpost"
 itf_story.39.c.tooltip:0 "§G1§! £job_researcher£ $job_researcher$ is available on [root.GetName]"
 itf_story.40.name:0 "Into the Forest"
 itf_story.40.desc:0 "As the colony on [root.GetName] grows more and more, some start questioning the special protection status of the §YEnchanted Forest§!. Planetary administration has proposed a plan to cut down parts of the §YForest§! in order to free up more space for future development. Howewer, this plan greatly displeases some of the political groups on [root.GetName], as well as local ecological activists. Furthemore, the §YEnchanted Forest§! is a vital part of the ecosystem and destroying even the small part of it will most likely worsen the ecological situation."
 itf_story.40.a:0 "It's only a small part"
 itf_story.40.b:0 "We will not risk it"
 itf_story.40.c:0 "We will not risk it"
 itf_story.41.name:0 "Into the Forest"
 itf_story.41.desc:0 "As the constructon team has finished cutting down parts of the forest, it is now possible to use up to 10% more of the planet surface."
 itf_story.41.a:0 "We needed that space"
 itf_story.50.name:0 "Into the Forest"
 itf_story.50.desc:0 "In the past few years mysterious ghost lights has been seen in the §YEnchanted Forest§! numerous times. Uet it is still unknow, whether it is just a natural phenomena, a trick of the light perhaps, or if there is something more beside it. In the recent weeks these lights have increased their activity, sometimes even venturing outside of the §YForest§!. People on [root.GetName] seem to be generally weary of this anomaly, some even chose to leave the moon."
 itf_story.60.name:0 "Into the Forest"
 # itf_story.60.desc:0 ""
