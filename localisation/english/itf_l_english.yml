# event chains
 itf_enchanted_forest_chain_title:0 "Into the Forest"
 itf_enchanted_forest_chain_desc:0 "A newly founded colony on [itf_forest_moon.GetName] coexists with a thick and wild forest, which is potentially full of mystery and danger and is commonly known among [root.owner.GetSpeciesNamePlural] as the §YEnchanted Forest§!. Only time will tell what it will bring to the colony and to the [root.owner.GetSpeciesName] civilisation in general."

# origin
 origin_itf:0 "Into the Forest"
 origin_itf_desc:0 "Mysterious Forest Moon is orbitting the Homeworld of this civilisation."
 origin_tooltip_itf_effects:0 "Start the game with a small §Y$pc_gaia$§! in the home system and uncover its secrets."
