 d_enchanted_forest_1:0 "Enchanted Forest"
 d_enchanted_forest_1_desc:1 "Enchanted Forest extends over a large portion of the moon surface. It appears to be a dark and gloomy place, populated by strange creatures. Mysterious ghost lights are often seen in the wilderness at nights, but it is yet unknown whether it is just a natural phenomena or perhaps there is something more to it."
