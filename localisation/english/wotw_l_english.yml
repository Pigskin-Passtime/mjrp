# event chains
 wotw_enchanted_forest_chain_title:0 "Will O' The Wisps"
 wotw_enchanted_forest_chain_desc:0 "A newly founded colony on [wotw_forest_moon.GetName] coexists with a thick and wild forest, potentially full of mystery and danger, commonly known among [root.owner.GetSpeciesNamePlural] as the §YEnchanted Forest§!. Only time will tell what it will bring to the colony and to the [root.owner.GetSpeciesName] civilisation in general."

# origin
 origin_wotw:0 "Will O' The Wisps"
 origin_wotw_desc:0 "A small and forested gaya world is orbitting the home planet of this civilisation."
 origin_tooltip_wotw_effects:0 "Start the game with a mysterious §YForest Moon§! in the home system and uncover its secrets."
 START_SCREEN_WOTW:1 "#TODO"

# jobs
 job_warden:0 "Warden"
 job_warden_plural:0 "Wardens"
 job_warden_desc:1 "These brave people are sworn to protect the colony from the Forest, as well as the other way around."
 job_warden_effect_desc:0 "£job_warden£ $job_warden_plural$ turn £consumer_goods£ §Y$consumer_goods$§! into £unity£ §Y$unity$§! and £society£ §Y$society_research$§!"
 mod_job_warden_add:0 "$job_warden$ Jobs"
 mod_job_warden_per_pop:0 "§G+1§! $job_warden$ Job per $VALUE$ Pops"
 mod_job_warden_per_pop_short:0 "\n§G+1§! £mod_job_warden_add£ per $VALUE$ £pop£"

# initializers
 wotw_origin_system_NAME:0 "Will O' The Wisps"
 wotw_origin_system_DESC:0 "This will always be the starting system when using the Will O' The Wisps Origin."

# special projects
 WOTW_1_PROJECT:0 "Into the Forest"
 WOTW_1_PROJECT_DESC:0 "Send a scientific expedition in order to learn more about the §YEnchanted Forest§!."

# static modifiers
 wotw_extensive_moon_system:0 "$extensive_moon_system$"
 wotw_extensive_moon_system_desc:0 "$extensive_moon_system_desc$"
 wotw_eerie_presence:0 "Eerie Presence"
 wotw_eerie_presence_desc:0 "A eerie presence looms over the Forest. It feels as if something sinister is about to happen."

# traits
 trait_attuned_to_nature:0 "Attuned To Nature"
 trait_attuned_to_nature:0 "§LThis species has a deep connection to the wildlife.§!\n"

# events
 wotw_story.1.name:0 "Will O' The Wisps"
 wotw_story.1.desc:0 "It has been a year since the colony on [root.GetName] has been established. [root.GetName] is populated rather scarcely in these early days of the colony, with no more than half a dozen settlements and townships on the moon. Most of them are located on the other hemisphere from the §YEnchanted Forest§! as for the most part people feel wary about it. Still, as the saying goes, these is nothing a [root.owner.GetSpeciesName] cannot get used to. So on order to protect the people from any potential dangers from the §YForest§!, planetary administration has proposed to set up a Warden service. This brave [root.owner.GetSpeciesNamePlural] will oversee the §YForest§! and try to limit any contacts of local population with the wilderness."
 wotw_story.1.a:0 "Establish the Wardens"
 wotw_story.1.b:0 "Establish the Wardens"
 wotw_story.2.name:0 "Will O' The Wisps"
 wotw_story.2.desc:0 "wip: wardens report an encounter with a strange animal and suggest an expedition into the wilderness"
 wotw_story.2.a:0 "Prepare an expedition"
 wotw_story.3.name:0 "Will O' The Wisps"
 wotw_story.3.desc:0 "wip: results of the expedition ar inconclusive. strange ghost lights are seen in the forest often enough, but "
 wotw_story.3.a:0 "Set up a research outpost"
 wotw_story.3.b:0 "Set up a chapel"
 wotw_story.3.c:0 "Set up a research outpost"
 wotw_story.4.name:0 "Will O' The Wisps"
 wotw_story.4.desc:0 "wip: as the colony on the [root.GetName] grows more and more, some start questioning the special protection status of the §YEnchanted Forest§!. options are allow a local coproration to use part of the forest for its need or prohibit any such plans"
 wotw_story.4.a:0 "Let them do it"
 wotw_story.4.b:0 "Prohibit any such activity"
 wotw_story.4.c:0 "Prohibit any such activity"
 wotw_story.5.name:0 "Will O' The Wisps"
 wotw_story.5.desc:0 "wip: an eerie presence is felt everywhere on the [root.GetName]. ghost lights in the forest have increased their activity."
 wotw_story.6.name:0 "Will O' The Wisps"
 wotw_story.6.desc:0 "wip: ghost lights reveal themselves to [root.owner.GetSpeciesNamePlural] to be a highly developed civilisation that had transcended millenia ago. they'we been watching for quite some time and have concluded that even though [root.owner.GetSpeciesNamePlural] are not completlely beyond hope, thy still have much to learn. at this point the lights offer their guidance, but it is up to [root.owner.GetSpeciesNamePlural] to chose whether to accept it or not."
 wotw_story.6.a:0 "Accept"
 wotw_story.6.b:0 "Reject"
