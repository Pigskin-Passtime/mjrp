l_english:
 # MHMCL_L_english
 # By Metallichydra
 
 # Menu
 MHMCL_allowed: "§GMircorv Allowed§!"
 MHMCL_disabled: "§RMircorv Disabled§!"
 spawn_MHMCL: "Spawn Mircorv"
 MHMCL_tooltip: "Mircorv is a robotic leader who comes from the Iltrani system. It is flexible, and depending on your "
 
 # Tooltips
 relic_triumph_cooldown_mhmcl_extremelyshort: "\n$relic_activation_cooldown$: £time£ §Y25§!"
 
 ################################
 # Iltrani System
 ################################
  NAME_MHMCL_system: "Iltrani"
  NAME_MHMCL_the_radiant: "Radiant"
  NAME_MHMCL_battle_for_iltrani: "Battle for Iltrani"
  mhmcl_battle_for_iltrani: "Battle for Iltrani"
  
  # Entering the system for the first time
  MHMCL_setup_event.1.name: "Sudden Tear"
  MHMCL_setup_event.1.desc: "The [Root.GetName] has made a discovery in the [From.GetName] system. At first the crew decided to investigate the shielded planet, but just as they approached it a tear in time and space suddenly appeared."
  MHMCL_setup_event.1.a: "Amazing"
  
  # Seeing the battle
  MHMCL_rift_event.1.desc.machine: "Immediately after entering the rift we were thrust into what appears to be an ongoing battle beteen two star nations in the Iltrana system.\n\nTo one side massive ranks of ships move in perfect synchronization, firing volleys of plasma with a precision that rivals ours.\n\nThe other side is continually losing ships, yet we can see no change in the amount of ships present.\n\nOur instuments show that their communications channels are open, and in fact have."
  MHMCL_rift_event.1.desc.exterminator: "Immediately after entering the rift we were thrust into what appears to be an ongoing battle beteen two star nations.\n\nTo one side massive ranks of oddly shaped ships move in perfect synchronization, firing volleys of plasma while bolts of pure energy arc through the empty void.\n\nThe other side is continually losing ships, yet we can see no change in the amount of ships present. From initial scans we have picked up life signatures from those ships, and strangely enough neither does the number of these drop. It appears as if that the battle is locked in a stalemate."
  MHMCL_rift_event.1.desc.hive: "$MHMCL_rift_event.1.desc$"
  MHMCL_rift_event.1.desc.pacifist: "$MHMCL_rift_event.1.desc$"
  MHMCL_rift_event.1.desc.militarist: "$MHMCL_rift_event.1.desc$"
  MHMCL_rift_event.1.desc: "Immediately after entering the rift we were thrust into what appears to be an ongoing battle beteen two star nations.\n\nTo one side massive ranks of oddly shaped ships move in perfect synchronization, firing volleys of plasma while bolts of pure energy arc through the empty void.\n\nThe other side is continually losing ships, yet we can see no change in the amount of ships present.\n\nOur instuments show that their communcations channels are open."
  MHMCL_rift_event.1.a: "Contact the first fleet."
  MHMCL_rift_event.1.b: "Contact the second fleet."
  MHMCL_rift_event.1.c: "Get us away from those filthy organics!"
  MHMCL_rift_event.1.d: "Better watch from a distance."
  
  # The Mircorv Greets you
  MHMCL_rift_event.2.common: "As our attempts at communication was noticed by the battling fleet they dispatched a small squadron which picked up the rift sphere. We were immidiately greeted by mechanical beings and a synthetic voice in our own language."
  MHMCL_rift_event.2.desc.machine: "£MHMCL_rift_event.2.desc.exterminator£"
  MHMCL_rift_event.2.desc.exterminator: "$MHMCL_rift_event.2.common$\n\n§E"Greetings, [Explorer.GetSpeciesName]! Please do not resist.\nWe are currently establishing a stable connection.\nPlease do not resist."§!\n\nThe drones that had entered the rift sphere immediately began dismantling [Leader.GetName] and then rearranging and replacing parts.\n\nAfter a short time [Leader.GetName] was unrecognizable, though no instruments reported any failures or errors."
  MHMCL_rift_event.2.desc.hive: "$MHMCL_rift_event.2.common$$MHMCL_rift_event.2.common$\n\n§E"Greetings, [Explorer.GetSpeciesName]! Please allow your drones to be escorted you to my command module so we can more easily cooperate.\nPlease do not resist."§!\n\nThe drones that had entered the rift sphere immediately began escorting [Leader.GetName] and [Leader.GetHisHer] team into a small transport ship."
  MHMCL_rift_event.2.desc: "$MHMCL_rift_event.2.common$\n\n§E"Greetings, [Explorer.GetSpeciesName]! Please allow my drones to escort you to my command module.\nPlease do not resist."§!\n\nThe drones that had entered the rift sphere immediately began escorting [Leader.GetName] and [Leader.GetHisHer] team into a small transport ship, forcefully moving those who resisted."
  MHMCL_rift_event.2.a: "That was only what we wanted"
  MHMCL_rift_event.2.b: "Unsettling"
  
  # The Mircorv asks for your help
  MHMCL_rift_event.3.common: "The current battle we saw when we entered is a war between the Mircorv and an unidentified empire which appeared out of nowhere a few solar cycles ago.\n\nThis empire has been attacking the machine intelligence and all other empires in the galaxy with a seemingly endless supply of fleets.\n\nAs a last resort the Mircorv elected to use an experimental device to tear a rift in time and space in order to make contact with an empire that might help them gain a strategic advantage."
  MHMCL_rift_event.3.desc.machine: "After proper communication channels were established through [Leader.GetName] the machine intelligence, which presented its identification code as simply §YMircorv§!, began transmitting data explaining the current situation: $MHMCL_rift_event.3.common$"
  MHMCL_rift_event.3.desc.hive: "After entering the command module our drones were met with the sight of a massive computer which we assume is the main focal point of the synthetic hivemind. It explained that it was the §YMircorv§!, one of many empires that has been at war with an unidentified empire.\nDespite their best efforts, the Mircorv and its allies have been unable to push back their enemy, and have now resorted to their last plan: Tear a hole in time and space to make contact with an empire that might help them gain a strategic advantage."
  MHMCL_rift_event.3.desc: "After entering the command module we were greeted by a massive computer which identified itself as the §YMircorv§!. It immediately began explaining the current situation: $MHMCL_rift_event.3.common$"
  MHMCL_rift_event.3.a: "We should help them"
  MHMCL_rift_event.3.a.machine: "Request Accepted"
  MHMCL_rift_event.3.a.hive: "We will help"
  
  # The Mircorv Perform Operation
  MHMCL_rift_event.4.desc.machine: "After agreeing to help them the drones that had reconfigured [Leader.GetName] began connecting more cables, enabling a direct connection with the entire Mircorv fleet.\n\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!\n\nNow with the entire fleet under [Leader.GetName]'s command, we have to think about how we are going to handle the battle."
  MHMCL_rift_event.4.desc.hive: "After agreeing to help them, a small group of specialized drones took [Leader.GetName] and dragged [Leader.GetHimHer] to an operating table with instruments that we have never seen before, though many of the tools attached to it speaks of its use in reconfiguring organic components in living beings.\nBefore anything could be done, several holes where drilled through [Leader.GetName]'s skull and cables were attached to [Leader.GetHisHer] brain, enabling a direct connection to the entire Mircorv fleet.\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!"
  MHMCL_rift_event.4.desc.hive.cyborg: "After agreeing to help them, a the Mircorv drones attached a cable to [Leader.GetName]'s cybernetic interfacing port, enabling a direct connection to the entire Mircorv fleet.\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!"
  MHMCL_rift_event.4.desc: "A synthetic voice echoes throughout the room:\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!\n\nThe drones that had escorted us into the command module immediately took [Leader.GetName] over to an operating table in the room and began cutting [Leader.GetHimHer] open before connecting various cables to [Leader.GetHisHer] brain. Despite this gruesome and sudden action, the Mircorv continued to treat our crew with the utmost care and respect and kept reassuring us that [Leader.GetName] was simply being prepared for [Leader.GetHisHer] new duty.\n\nAfter a few moments the procedure was over and [Leader.GetName] reported that [Leader.GetHeShe] has a direct connection to the Mircorv fleet through the implants."
  MHMCL_rift_event.4.desc.synthetic: "A synthetic voice echoes throughout the room:\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!\n\nThe drones that had escorted us into the command module immediately took [Leader.GetName] over to an operating table in the room and began opening [Leader.GetHimHer] and attaching cables to [Leader.GetHisHer] internal components, though no harm seem to have come of this. Additionally, [Leader.GetName] reports that [Leader.GetHeShe] can now send commands to the Mircorv Fleet, effectively putting us at war against the mysterious spacefarers."
  MHMCL_rift_event.4.desc.cyborg: "A synthetic voice echoes throughout the room:\n§E"We have tried everything already. Our only hope is that you can fare better than us"§!\n\nThe drones that had escorted us into the command module immediately began attaching cables to [Leader.GetName]'s cybernetic interfacing port, enabling a direct connection between [Leader.GetName] and the Mircorv fleet."
  
  MHMCL_rift_event.4.a: "[Leader.GetName] should get therapy when [Leader.GetHeShe] gets back"
  MHMCL_rift_event.4.a.machine: "Alterations will be removed"
  MHMCL_rift_event.4.a.hive: "We should remove those when they get back"
  
  MHMCL_rift_event.4.b: "Fascinating!"
  MHMCL_rift_event.4.b.machine: "An inefficient procedure"
  MHMCL_rift_event.4.b.hive: "We are all part of the fleet now"
  
  # The Mircorv asks how you wish to help
  MHMCL_rift_event.5.desc.machine: "$MHMCL_rift_event.5.desc$"
  MHMCL_rift_event.5.desc.hive: "$MHMCL_rift_event.5.desc$"
  MHMCL_rift_event.5.desc: "A screen turns on to show the current state of the battle, showing that the fleets are of equal numbers.\nThe Mircorv fleets, now obeying our command, has entered a defensive formation until we give our first order."
  
  MHMCL_rift_event.5.a: "A sudden attack will be unexpected"
  MHMCL_rift_event.5.a.machine: "$MHMCL_rift_event.5.a$"
  MHMCL_rift_event.5.a.hive: "$MHMCL_rift_event.5.a$"
  
  MHMCL_rift_event.5.b: "We need some sort of advantage"
  MHMCL_rift_event.5.b.machine: "$MHMCL_rift_event.5.b$"
  MHMCL_rift_event.5.b.hive: "$MHMCL_rift_event.5.b$"
  
  MHMCL_rift_event.6.desc.machine: "$MHMCL_rift_event.6.desc$"
  MHMCL_rift_event.6.desc.hive: "$MHMCL_rift_event.6.desc$"
  MHMCL_rift_event.6.desc: "As our fleets surge forwards they are met with heavy fire.\nA few of the enemy ships perish from bursts of electromagnetic arcs that appears to be the Mircorv's main weaponry, though our analytic instruments does not show any changes in numbers."
  
  MHMCL_rift_event.6.a: "The instruments must be wrong"
  MHMCL_rift_event.6.a.machine: "Rerun analytics and continue"
  MHMCL_rift_event.6.a.hive: "$MHMCL_rift_event.6.a$"
  
  MHMCL_rift_event.6.b: "Retreat!"
  MHMCL_rift_event.6.b.machine: "Disengage"
  MHMCL_rift_event.6.b.hive: "Retreat"
  
  MHMCL_rift_event.6.c: "Create a distraction!"
  MHMCL_rift_event.6.c.machine: ""
  MHMCL_rift_event.6.c.hive: ""
  
  # The fleet is crippled
  MHMCL_rift_event.7.desc.machine: "Despite the obvious futility, the fleets obey the command.\nSeveral enemy ships are ripped to pieces, though our own numbers are declining at a rapid pace.\nAfter a short battle our fleet has been reduced to almost nothing, though miraculously the one that we are on is left unharmed.\n\nThe enemy fleet suddenly stops firing on us, and enters orbit of the Mircorv homeworld."
  MHMCL_rift_event.7.desc.hive: "$MHMCL_rift_event.7.desc.machine$"
  MHMCL_rift_event.7.desc: "$MHMCL_rift_event.7.desc.machine$"
  
  MHMCL_astral_rift_event.7.desc.machine.shell: "As our fleets enter formation it becomes clear that we are unable to last more than a few moments. Enemy fleets surge forward, unimpeded by the defensive formation, and despite our electromagnetic arcs taking out almost half the fleet, nothing changes.\n\nOur own numbers continually dwindle down, until there is only a small portion of our original forces left."
  MHMCL_astral_rift_event.7.desc.hive.shell: "$MHMCL_astral_rift_event.7.desc.machine.shell$"
  MHMCL_astral_rift_event.7.desc.shell: "$MHMCL_astral_rift_event.7.desc.machine.shell$"
  
  MHMCL_rift_event.7.a.machine: "Engage communications with the enemy"
  MHMCL_rift_event.7.a.hive: "Perhaps we could speak with them?"
  MHMCL_rift_event.7.a: "We have yet to try diplomacy"
  
  MHMCL_rift_event.7.b.machine: "Ask for integration into [Explorer.GetName] mainframe."
  MHMCL_rift_event.7.b.hive: "Bring the Mircorv into the sphere"
  MHMCL_rift_event.7.b: "$MHMCL_rift_event.7.b.hive$"
  
  MHMCL_rift_event.7.c.machine: "Leave the Mircorv"
  MHMCL_rift_event.7.c.hive: "Leave them to their fate"
  MHMCL_rift_event.7.c: "Better leave before they get mad"
  
  # Negotiations
  MHMCL_astral_rift_event.8.desc.machine.last_stand: "§E"You are not the Mircorv!"§!\n\nThe being on the screen is neither organic nor mechanical, instead being made of some sort of crystalline structure in bright colors.\n\n§E"If we had known that they had managed to breach through to your dimension we would have explained everything to you."§!"
  MHMCL_astral_rift_event.8.desc.machine: "$MHMCL_astral_rift_event.8.desc.machine.last_stand$"
  MHMCL_astral_rift_event.8.desc.hive.last_stand: "$MHMCL_astral_rift_event.8.desc.machine.last_stand$"
  MHMCL_astral_rift_event.8.desc.hive: "$MHMCL_astral_rift_event.8.desc.machine.last_stand$"
  MHMCL_astral_rift_event.8.desc.last_stand: "$MHMCL_astral_rift_event.8.desc.machine.last_stand$"
  MHMCL_astral_rift_event.8.desc: "$MHMCL_astral_rift_event.8.desc.machine.last_stand$"