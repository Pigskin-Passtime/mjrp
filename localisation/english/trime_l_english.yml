 trime_leader_trait_legendary_timeskipper_desc:0 "His Mind scrambled over Eons, his Body aged and deaged countless Times. §Y$NAME_trime_time_lord$§! has had enough Time to regret, forget and repeat. His Time is nothing more than Waves reapeatly crashing on the Shores of his Fate."
