trime_stage1:0 "Waiting"
trime_stage2:0 "More Waiting"
 trime.1.name:0 "Second Meeting"
 trime.1.desc:0 "Ah, Era Dwellers, in the Presence of Aevum, the Essence of Time itself, you stand here again. What inquiries do these Cyclic Beings harbor within the Confines of their fleeting Existence? Speak, and let the Echoes of your short-lifed Desires reverberate through our Discourse.\nI present a Quest, Era Dweller. Illuminate the Heavens of my Realm, §Y[trime_primitive_rewind_world.GetName]§!, reveal the Extent of your Capabilities. Let the Radiance of your Endeavors pierce the Shadows that dance in the Tapestry of my World!"
 trime.1.a:0 "Who are you?"
 trime.1.a.response:0 "I am §Y$NAME_trime_time_lord$§!, a God. Immortal, Time's current eludes my Grasp, as Shadows dance in the veiled Whispers of Eternity."
 trime.1.b:0 "Why did you send §Y[trime_future_leader.GetName]§Y back in Time?"
 trime.1.b.reponse:0 "Why should I not? We, Era Dwellers, have spoken in Echoes of the Past and glimpsed a Future yet unborn. The Current, a mere Reflection, aligns with the Symphony woven by Fate. To Question the Convergence is to resist the Cosmic Embrace."
 trime.1.c:0 "Do you know anything about §Y[trime_primitive_rewind_world.System.GetName]§!?"
 trime.1.c.response:0 "It reflects my Power. It is my Home, shaped by the Sinew of my Existence to mirror my All. I, the Weaver of Eras, fashioned it to cradle the boundless Echoes of my Being."
 trime.1.d:0 "§YAlright, we shall do you bidding.§!"
 trime.1.e:0 "§YNonsense. Prepare for invasive Actions!§!"
 trime.2.name:0 "Low on Time"
 trime.2.desc:0 "The §Y[trime_primitive_rewind_world.System.GetName]§! System is experiencing serious spatial and temporal Anomalies. Time has stopped to a Crawl. Every Ship or Being entering the Systems will be slowed by a Factor of ~9. Even Messages from [this.GetName] are delayed and had to be reconstructed after leaving the System. We are not sure what could cause such Anomalies. "
 STRANGE:0 "Strange"
 trime.5.name:0 "Third Meeting"
 trime.5.desc:0 "Haha, well done Time-Bounded. Indeed, you have entwined Entertainment and Beauty. Truly remarkable what such primitives Technology can conjure upon my Night Sky.\nNow, Era-Dweller, prepare thyself for my next whispered Will. "
 trime.5.a:0 "What about a Reward?"
 trime.5.a.response:0 "Ah, Era-Dweller, perceive, Time meanders through Labyrinthine Passages. I neither deny nor yearn to deny your feeble Request, but the Moment for my Action has not yet unraveled itself. "
 trime.5.b:0 "Why do you live among Primitives?"
 trime.5.b.response:0 "The Primitives, as you name them, may forge the Shackles of your tomorrow's Dominion. Or shall you ensnare them in the Web of your Mastery first? Judgment is a fleeting wisp in the currents of Time. To me, all Cyclic Beings bear the an indistinct similar Visage.\n§Y*He pauses for a Second.*§!\nYou may distaste, yet they mirror the Echoes of your past Self. Soon, they will fly the Skies and roam the Heavens, just as your current Selfs."
 trime.5.d:0 "§YWhat do want us to do next?§!"
 trime.4.name:0 "$trime.5.name$"
 trime.4.desc:0 "This Spirit of yours pleases me, Era Dweller. For now, your only decree is to embrace Patience. Let the Sands of §Y20 years§! Sift through the Hourglass before our Fates intertwine once more."
 trime.4.b:0 "Is your Species supposed to have a Beard?"
 trime.4.b.response:0 "Did your Fate's Strings entwine with the celestial Realms, you call Space? Were you destined to soar among the Starts? Was your Species born to endure the Cosmic Expanse? \n§Y*He pauses.*§!\nYet, in the Face of this cosmic Reality, you concern yourself with the Existence of my Beard?"
 trime.4.a:0 "§YAlright, let us wait.§!"
 trime.4.d:0 "§YWe have no Time for this. Prepare for Invasion.§!"
 trime.7.name:0 "Defeated Chronomancers Curse"
 trime.7.desc:0 "Oh Era Dwellers, what a brave, yet foolish Act you have done. For your Barbaric Endeavors, I shall bestow you with a Parting Gift of mine.\n§Y*As he speaks all around the Planet Time begins to flow at Lightning Speed. It seems like he is sucking the Currents out of the Systems. The Invasion Armies slowly start to panic as they fear a God's Anger.*§!\n Let it be etched in your Consciousness, Era Dwellers, that this Path was of your own Doing. Face the Consequences. \n§Y*Sirens begin to echo on [Root.Capital.GetName] as his Curse begins to take Effect.*§!"
 trime.7.a:0 "That was all?"
 trime.9.name:0 "Interlude"
 trime.9.desc:0 "I commend your Patience, yet, with outmost Regret, I must inform you. Fate, a relentless arbiter, has placed a Trial on our destined Summit. Your fragil 20 Years fall short to satify my required Span. Let us meet in the Middle, shall we? I shall  §Yreset your Progress by 5 Years§! and we shall converge in the Aftermath."
 trime.9.a:0 "§YOk§!"
 trime.9.b:0 "§YEnough. Invade §Y[trime_primitive_rewind_world.GetName]§!!"
 trime.10.name:0 "Forth Meeting"
 trime.10.desc:0 "I congratulate you, Era Dweller. Even in the Face of Fate's notorious Whims, you have achieved what I desired. Rest a While, if you so wish, or crave the next Trial. Fear not, your Reward looms near.\n§Y*He seemingly looks pleased. With a bright Smile and expecting Eyes he meets your tired Expression*§!\n And now, as a final Endeavor, a Testament to my divine Pleasure. Construct for me a Temple, let it be the Pinnacle of your Architectural Prowess. Honor me with the Grandeur of your highest Creation."
 trime.10.a:0 "§YAlright. Lets get building.§!"

 trime.11.name:0 "Last Meeting"
 trime.11.desc:0 "Yes well done. Take Pride in your Achievements. You inquire: What is our reward for such great Patience and Endeavor? It is simple, Era Dweller, indeed! A god shall grace your Realms.§Y I, $NAME_trime_time_lord$, shall join your Empire.§! Feel the Freedom to worship my Presence throughout the passing of Seasons."

