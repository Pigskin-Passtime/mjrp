 #recruit window dialogue
 trime.11.a:0 "What can you offer us?"
 trime.11.a.response:0 "Oh, young One, cease the queries of what I can offer your realm. Instead, ponder what offerings you shall present to a god. Your Trials, a Testament to worthiness, draw to a close. Embrace the Culmination, bask in the Power bestowed upon you. Why question that which transcends your young Current?\n§Y*He pauses to think.*§!\nLet me reveal the Tapestry of my Capabilities. Have you ever contemplated the Weaponization of Time, the Art of delaying Foes, hastening economic Flow, or expediting the construction of grand Structures?"
 trime.11.b:0 "What happened to the Creature, which destroyed Observation 37?"
 trime.11.b.response:0 "I have pondered the Enigma of Events lost in the Currents of Time, and it seems you have unearthed a Fragment of the Puzzle. Allow me to shed some Light. The Creature, known to the Primitives as 'Vumi,' has chosen this System as its recurring Tomb, returning to the Brink of Death every few Years. I can affirm it is the same Entity, caught in a cyclical Dance of Demise. Yet, a curious turn of Fate unfolded some hundred Years past, and the ritualistic Dying ceased. Neither the Primitives nor I hold the Key to the Mystery that unfolded in the Shadows of that bygone Era.\n§Y*He grins*§!\nOne might say, only Time will tell."
 trime.11.c:0 "Why were you never evacuated?"
 trime.11.c.response:0 "You have touched upon a tender Chord, Era Dweller. As painful as it is, I suspect my Messages never found their Way Home. Lost in the Systems, Echoes endlessly reverberating back and forth, a Lament sung by the timeless Corridors. Nothing more than Mockery, a cruel Jest played by the cosmic Forces upon the Stage of my Existence. The Fate of me and my Crew, now shrouded in the Veils of your Knowledge alone."
 trime.11.d:0 "You are no God, arent you?"
 trime.11.d.response:0 "§Y*Long pause. Probabaly the longest HE ever took.*§!\nWhat do you expect me to say? Yes and no, both veiled in Untruths. I harbor no Illusions for you to comprehend the Boundaries of my Power. Understand this: no God, in Essence, is without Limits. Were you born a God, or did the Flow of Time grant you the Title? Through Millennia my Power surpassed your era-bound Understanding, and yet remains bounded. In the eyes of the Primitives, you and I are divine, each possessing godlike Abilities. It is not the absence of Limitations that defines Godhood, but the Manifestation of what can be achieved. In this present Epoch, I am a God, until the Day when I am no longer."
 #trime.11.b.custom_tooltip:0 "REPLACE_ME"

 trime.16.name:0 "Caiptain's Log: Day 1276"
 trime.16.desc:0 "At last, I got this Thing to work again. If only for one last Message. Confirming: This will be my last Recording. After our Evacution from the Observation Station our Escape Pods flew by and in several Anamolies. One Crew Member deaged into Non-Existence, another into his Grave. Only 3 of us made it on the Surface. Our Rations were mostly spoiled. Our only Option was to continue to the nearest Primitve City for Food and Shelter. To Hell with the Prime-Directive. I could not let my Crew die like this.\n§Y*A small sigh escapes him in the Recording.*§!\n We managed to enter one City. Not as Aliens were we met, but as Messiahs. They believed us to be Messagers of God. Somehow our Appearances were already carved on several Walls. In the following Year, Shlay and Dirko died. Shlay had contracted a fatal Infection. Dirko was mauled to Death by a Group of Heretics after abusing his new Role. What shameful Deaths. I, however, remain. For what Purpose? Who knows. \n§Y*A long Pause.*§!\n To whoever finds this Message, tell our Kin to expect us dead. \n - Aevum T. Dohrnii - Only Survivor of Obervation Station 37 "
 trime.16.a:0 "Tragic"
 trime.16.b:0 "§YLets ask him.§!"
 trime.13.name:0 "Caiptain's Log: Day 437"
 trime.13.desc:0 "For the last Year we have not observed any Anomalies within the Primitives. They seem to be unaware of our Presence. We are certain the are worshipping a God, of some kind. Regarding the strange Behaviour of the §Y[trime_primitive_rewind_world.System.GetName]§!: I am uncertain we will ever find what or who shattered Time this Way. Me and the Crew remain optimistic and hope, depsite all Odds, to uncover the Roots. \n - Aevum T. Dohrnii - Caiptain and leading Scientist of Obervation Station 37 "
 trime.13.a:0 "Interesting"
 trime.14.name:0 "Caiptain's Log: Day 576"
 trime.14.desc:0 "A massive Object arrived in the System.\n§Y*Sirens can be heard in the Background. You can notice a certain Panic wihtin his Voice.*§!\n It seems larger than than Asteroids and smaller than average Planets. No Hyperdrive was detected. The Entry Point was Way too close to the Star to be a normal Jump. Whatever just arrived, Time faults around it. Some Temporal Anomalies shattered our Board Systems back into the Stone Age.  \n - Aevum T. Dohrnii - Caiptain and leading Scientist of Obervation Station 37 "
 trime.14.a:0 "Fascinating"
 trime.15.name:0 "Caiptain's Log: Day 579"
 trime.15.desc:0 "After 3 Days of futil Attempts to repair the Board System, we had to evacuate to the  §Y[trime_primitive_rewind_world.GetName]'s§! Surface. We suffered some Casulties, Jeff and Qualtrek. Please let their Families know that both died saving the Rest of us and in Service to their Empire.\n§Y*Crashing of falling Debris can be heard.*§!\n We require urgent Evacution Shuttles. Our Situation is dire. I repeat, Evacuation is our only Option \n - Aevum T. Dohrnii - Caiptain and leading Scientist of Obervation Station 37 "
 trime.15.a:0 "Worrying"
 trime.17.name:0 "Signals lost in Time"
 trime.17.desc:0 "We have found several Messages which seem to be stuck in a Time Loop. We located the first one and are ready to decode them. What should we do?"
 trime.17.a:0 "Let's start decoding"
 trime.17.b:0 "Not Interested"
 trime.18.name:0 "Interlude"
 trime.18.desc:0 "Requirements are fleeting Echoes. Desires are elusive Shadows. Our Fates intertwine once more. Why, Dwellers of this Era, do our Paths meet so soon again?"
 trime.18.a:0 "§YMaybe we should not ask.§!"
  trime.18.c:0 "§YNothing divine Being.§!"
 trime.19.name:0 "Future's Messenger"
 trime.19.desc:0 "Sir, we found the §Y$NAME_trime_time_lord$§!! in §Y[trime_primitive_rewind_world.System.GetName]§! System. He seemed unaware of our Presence. The mission was a complete Success."
 trime.19.a:0 "Who are you?"
 trime.19.a.response:0 "I am [trime_future_leader.GetName]. Scientist and Explorer."
 trime.19.b:0 "What was your Mission?"
 trime.19.b.response:0 "To observe the Entity known as §Y$NAME_trime_time_lord$§!. "
 trime.19.c:0 "[trime_future_leader.GetName] is already in active service."
 trime.19.c.response:0 "Yes .. I am here on my Ship on active Duty, aren't I?"
 trime.19.d:0 "You seem older"
 trime.19.d.response:0 "The §Y[trime_primitive_rewind_world.System.GetName]§! System works in mysterious Ways."
 trime.19.welcomeback:0 "Welcome in the Past"
 trime.20.name:0 "Loop Anew"
 trime.20.desc:0 "10 Years ago a Scientist sent to observe the §Y[trime_primitive_rewind_world.System.GetName]§! System returned to the Past. We should consider doing the same as our other Future Self. Another Option could be to see what happens if History does not repeat itself. The Choice is yours."
 trime.20.a:0 "Complete the Loop"
 trime.20.tt:0 "Sent [trime_future_leader2.GetName] to the Past"
 trime.20.b:0 "Ignore the Loop"
 trime.21.name:0 "Unidentified Escape Pod"
 trime.21.desc:0 "An Unidentified Object is approaching our Home System. It seems like one of our special-designed Scientist Ship Escape Pods. We were unable to identify it. The Pod is wearing the Insignia of one of our active Scientists. "
 trime.21.a:0 "Open Channel"
 trime.21.b:0 "Blast it to Bits"

