trimed.40520.name:0 "Everything here is W.I.P"
 trimed.40520.desc:0 "A self-proclaimed god that manipulates the flow of time. He ages in reverse. He will use his powers to some extent to help you. His manipulations come at the cost of his own lifetime. Meaning he loses health per manipulation. His empire will be responsible to keep him old and healthy."
 trimed.40520.a:0 "What is up with your beard?"
