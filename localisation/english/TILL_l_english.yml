TILL_allowed:0 "§GFragment Allowed§!"
Fragment_allowed:0 "§GFragment Allowed§!"
TILL_disabled:0 "§RFragment disabled§!"
Fragment_disabled:0 "§RFragment disabled§!"
Fragment_spawn:0 "Spawn Fragment"

TILL_tooltip:0 "The Fragment is a powerful scientist from annother galaxy who is helpfull in the late game, but may cause some trouble on the way."

NAME_Fragment:0 "§CTHE FRAGMENT§!"

 Y_gate_base_DESC:0 "This Megastructure connects to annother glaxy by some unkown technology. We do not even have the slightest clue on how it might work."
 Breachpoint:0 "The Breachpoint"
 Y_gate_base_MEGASTRUCTURE_DETAILS:0 "This Megastructure connects to annother glaxy by some unkown technology. We do not even have the slightest clue on how it might work."

 Tilla.1:0 "Y-gate encountered"
 TILLA.1.desc:0 "Upon entering the system, we detected a massive structure orbiting beyond the system's edge. A large ship is sitting nearby, and we are reciving a shortrange transmision from the vessle. It looks like a distress signal."

 TILLA.1.a:0 "Open communications!"

 TILLA.1.b:0 "Lets see what they want."

#Communications#

TILLA.2.desc.a:0 "Initiating Handshake Protocol. To the machine network, this network is known as §YThe Intelegence§!, simmilarly to you, it is an advanced Artificail Intelegence. The Intelegence requires your assisance, if you are willing to help us. Our ship was damaged several hundred cycles ago from an attack by an unkown force, and we have lost our ability to connect to the Y-Gate. If you are willing to help us, we can transmit the codes to connect to the gate and reactivate it."


TILLA.2.desc.b:0 "Establishing Auditorial Communications. To the Organic Empire, this is §YThe Intelegence§!, an advanced Artificial Intelegence. §YThe Intelegence§! requires your assistance if you are willing to help us. Our ship was damaged several hundred cycles ago from an attack by an unkown force, and we have lost our ability to connect to the Y-Gate. If you are willing to help us, we can transmit the codes to connect to the gate and reactivate it."





 TILLA.2.option.a:0 "Tell us more about yourself."
 TILLA.2.option.a.response:0 "The Vessle you see is The Intelegence, a massive server ship designed to store yottabites of data. The Intelegence that you are speaking to is not just one Self, but a weave of nearly a Thousand AI, all working together for one connected goal"

 TILLA.2.option.b:0 "What is your Purpouse?"
 TILLA.2.option.b.response:0 "The Intelegence is an advanced survey vessel, designed for long term exploration in other galaxies. As you can see, this current expidition did not quite go to plan."

 TILLA.2.option.c:0 "What is that strucutre you are by?"
 TILLA.2.option.c.response:0 "That is an entery and exit point for your galaxy. The Intelegence was sent to survey this galaxy, and began <ERROR:TIME_NOT_FOUND> cycles ago. We are currently unable to communicate or activate the device to make the return trip home."

 TILLA.2.option.d:0 "How can we help?"
 TILLA.2.option.d.response:0 "The Quantum Communicator onboard The Intelegence was severed from the mainframe during the attack from an unkown assailent and must be reconnected. The Intelegence contains no autonomous hardware capable of performing this operation, and requires outside assistance. It will require £exotic_gasses£ §G250§! and £alloys£ §_50§!. If you agree to help, the location of the Communications Node will be sent to you."


#Action Responses#
 TILLA.2.option.e:0 "Of Course we will help! Tell us what you want us to do!"
 TILLA.2.option.e.response:0 "Transmiting Instructions to you now. §EPlease note that this will require the presence of both a scince and construction ship!§!"

 TILLA.2.option.f:0 "You are going to serve us now!"
 TILLA.2.option.f.response:0 "§REngaging Defences. We will do what we must to keep ourselves out of your hands.§!"

 TILLA.2.option.g:0 "It is better that you are destroyed"
 TILLA.2.option.g.response:0 "§REngaging Defences. We will do what we must to protect ourselves from destruction§!."

 TILLA.2.option.h:0 "You are an Abomonation that must be removed!"
 TILLA.option.h.response:0 "§REngaging Defences. We will do what we must to protect ourselves from destruction.§!"

 TILLA.2.option.i:0 "Assimilation Protocalls Engaged, you will serve us."
 TILLA.2.option.i.response:0 "§REngaging Defences. We will do what we must to remain a seperate entity.§!"

 TILLA.2.option.j:0 "We cannot help you at this time."
 TILLA.option.j.response:0 "Understandable. We will be here, please feel free to contact us when you have the technology."




 TILLA.3.desc:0 "Node Online. Activating Y Gate now. We thank you for your assistance in this matter. There is one more matter we wish to discuss. One of our onboard AI wishes to stay with you. We have found your empire to be interesting and helpfull, though misguided. The unit is designed as a science unit, and has been equipt with a quantum entanglement communicator to allow us to continue monitoring this galaxy."
 
 TILLA.3.a.desc:0 "Introduce us, please."



 TILLA.4.name:0 "Hire Leader?"
 TILLA.4.a.desc:0 "Greetings, I am §BThe Fragment§!. I Hope you will consider me as a canidate for hire?"
 TILLA.4.b.desc:0 "Greetings, I am §BThe Fragment§!. I would like to offer my services to your empire, in exchange for continued existance."

 TILLA.4.a:0 "Wait... Why are you speaking in first person now?"
 TILLA.4.a.response:0 "When you spoke to The Intelegence, you were speaking to thousands of AI all at once, but I am an... Individual of sorts. You see, our ship contains billions of computer processors that run mainframes, all running in a chaotic harmony and individulaity. I am simply one of those, my formal designation is Construct - 8472, but I will go by The Framgment while serving with you."

 TILLA.4.b:0 "How can you assist us?"
 TILLA.4.b.response:0 "Our Home civilisation is much more advanced than you are, I could assist in research and exploration of your home galaxy. If The Intelegence allows it, I may also be able to help with the development of techs beyond your scope."

 TILLA.c.b:0 "Why are you doing this, really?"
 TILLA.4.c.response:0 "Our home galaxy is growing stagnant, we have hit a bit of a roadblock with technology. I want something new. In addition, I can continue to monitor the developing situation of the galaxy."

 TILLA_Y_GATE_ACTIVATION:0 "Repair the Intelegence."

 fragement_desc:0 "The Fragment"


 TILLA.5.name:0 "Leaving our Galaxy"
 TILLA.5.a.desc:0 "We watch as the Intelegenge Exploration ship flies through the Y-Gate and back to its home. The Y-Gate seems to have damaged itself byond repair, leaving no discernable tech for us. The Fragment has begun settling into our empire, and has already gotten to work."
 Tilla.5.b.desc:0 "We watch as the Intelegenge Exploration ship flies through the Y-Gate and back to its home. The Y-Gate seems to have damaged itself byond repair, leaving no discernable tech for us."

 Y_gate_base:0 "Y-Gate Frame"

 TILLA.5.a:0 "Well, Lets Get to Work!"
 TILLA.5.b:0 "Its for the best."

 TILLA.7:0 "Intelegence Ship Disabled"
 TILLA.7.desc:0 "After A long fought battle, the massive Ship came to a halt and powered down. It appears that we have done enogugh damage to the vessle. Rather than destroy it, our admirals and scientist belive that there is value in seeing what technology lies on the ship."


 TILLA_SORT_DEBRIS:0 "Sort Debris"
 TILLA_RECYCLE_DEBRIS:0 "With the Defeat of the Intelegence, we can begin to sort through the debris it left behind."

 TILLA.7.a:0 "The fall of The Intelegence"
 TILLA.7.b:0 "A large section of the Intelegence suddently, and violently, exploded and the vessle powered down. A special project has been issued to clear up debris."

 TILLA.8.name:0 "Debris Cleared"
 TILLA.8.desc:0 "As the last of the debris is cleared, we have found an interesting artifact, a data crystal. What is more supprising is that when we turned it on, there was an AI inside. It gained control of a nearby autonomous unit. However, it has surrendered to us, and is apparently offering its services."

 TILLA.8.a:0 "Lets hear what it has to say."

 TILLA.9.name:0 "Debris Cleared"
 TILLA.9.desc:0 "AS the last of the debris is cleared, we have found nothing of significance to us. The AI is dead, and what is left of the ship has been recycled."

 TILLA.9.a:0 "Excelent"



 TILLA.10.name:0 "The Fragment"

 TILLA.10.a.desc:0 "We have hired The Fragment, and it seemes to already be integrating well into our empire."
 Tilla.10.b.desc:0 "As we closed out communications with The Fragment, the last bits of the ship float off into the void. A Tiny pod jetisoned from the remains of the ship, with a couse set for the Y-Gate."

 TILLA.10.a:0 "Good, we could use it."
 TILLA.10.b:0 "It is for the best."



#Custom Diplomacy
 TILLB.1:0 "Incoming Transmision"
 TILLB.1.desc.a:0 "How Can we assist you?"
 TILLB.1.desc.b:0 "We are no longer interested in continuing communications."

 TILLB.1.a:0 "We Now have the technology to help you!"
 TILLB.1.a.response:0 "excelent, we are sending over the information you need. §EPlease note that this will require the presence of both a scince and construction ship!§!"


 TILLB.1.b:0 "You are going to serve us now!"
 TILLB.1.b.response:0 "Activating Defences, please note that we will do everything in our power to defend ourselves."

 TILLB.1.c:0 "Can you help us with our technological level?"
 TILLB.1.option.c:0 "Can you help us with our technological level?"
 TILLB.1.c.response:0 "We cannot just give you our technology, it would effect the balance of power in your galaxy. That is not our objective."




 TILLB.1.option.e:0 "OK"
 TILLB.1.option.e.response:0 "Do not attempt to aproach our vessle, or we will open fire with imputiny."

###################
#Technology Events#
###################


 TILLC.2.desc:0 "Greetings. Recently, I calculated that your empire is doing... Well in the Galaxy. However, I have determined that the best way forward to ensure my own safety is to help you. Therefore, I have decided that I will grant you one tech from my home galaxy, I have selected four for you to choose from: The Singluarity Drive, The Dark Flare Cannon, Fractal Armies, and Quantum Entanglement."

 TILLC.2.e:0 "Why only one?"
 TILLC.2.e.response:0 "If I were to give you too much technology, one of two things would happen, either you would rip yourselves apart in a civil war, or you would dominate in the galaxy. One of the protocols for the mission was to keep the galaxy balanced, and we are doing so now."
 TILLC.2.a:0 "What is the Singularity Drive?"
 TILLC.2.b:0 "Tell us about the Dark Flare Cannon?"
 TILLC.2.c:0 "Fractal Armies are of interest ot us."
 TILLC.2.d:0 "Quantum Entanglement may be of interest to us."

#Singularity Drive

 TILLC.3.desc:0 "OF Course! The Singularity drive uses an artificial singularity to rip a hole through space-time, bending space in such a way that you can connect two points in space at the same time. However, I must warn you, it has a side effect of slowing ships while in normal space, even while not charging, and is extremely power hungary. If that is what you want, I will send you the blueprints to build it."
 TILLC.3.a:0 "Send the Plans."
 TILLC.3.b:0 "Back to Options, Please."

#Dark Flare Cannon#
 TILLC.4.desc:0 "Of Course! The Dark Flare cannon momentarily condenses the dark energy effect inside of a ship, it is a powerfull weapon. However, I warn you, It is extremely power hungary to use, and requires some exotic materials to run. If you can accept these drawbacks, I can show you how to integrate them into your fleet."
 TILLC.4.a:0 "Send in the Blueprints, Please"
 TILLC.4.b:0 "Back to Options, Please."

#Fractal Armies#

 TILLC.5.desc:0 "Fractal armies are based upon a modified version of my code, uploaded into some of the most advanced machine soilders on the ground. They are designed for efficency and low damage. However, because they are so advanced, they require some exotic resourses to function. If you accept, I can send you the code."
 TILLC.5.a:0 "Send us the Code, Please"
 TILLC.5.b:0 "Back to Options, Please"


#Quantum Entanglement
 TILLC.6.desc:0 "Quantum Entanglement is the artificial linking of two particles, if one is up, the other immediately points down. Through some advanced computational effort, you can "
 TILLC.6.a:0 "Show us how to do this."
 TILLC.6.b:0 "Back to Options, Please"

#######
#TECHS#
#######

 tech_singularity_drive:0 "Singularity Drive"
 tech_singularity_drive_desc:0 "A Hyper-Advnaced jump drive that extends the range of a starship."
 tech_dark_flare_cannon:0 "Dark Flare Cannon"
 tech_dark_flare_cannon_desc:0 "Taking Advantage of localised dark energy, this cannon causes the formation of empty space inside of a vessle."

 tech_fractal_armies:0 "Fractal Armies"
 tech_fractal_armies_desc:0 "Based upon modified code from The Fragment, these armies are highly intelegent machine armies that are effective without causing too much colatoral damage."

 tech_quantum_entanglemet:0 "Quantum Entanglement"
 tech_quantum_entanglemet_desc:0 "Connecting all the labs on a planet through instant communication will allow our empire to more efficently produce research."

#Crisis Insights
#Prethorian
 TILLE.2.title:0 "The Fragment"
 TILLE.2.desc.a:0 "Greetings, I have insights into the mysterious Subspace Echoes that we are detecting. They are called the Preythorian Scourge, and they are a threat to all life in the galaxy. One of their fleets arrived in my home galaxy eons ago, we were able to do a great deal of damage to the galaxy. I suggest investing in energy weapons and point defence. I am transmiting some data on how to best tune energy weapons to do maximum damage to their biology."
 TILLE.2.a:0 "Thank you for your insights."
 TILLE.2.b:0 "Dark Days Lie ahead."

#unbidden


 TILLE.3.title:0 "The Fragment"
 TILLE.3.desc.a:0 "Greetings. I have been analyzing the patterns of the galactic power surge our galaxy recently expirenced. They are called the Unbidden. They invaded my home galaxy eons ago, however, they can be defeated. I suggest investing in Kenetic weapons, as they are primarily energy based. I am transmiting data about a frequency that disrupts their vessle's strucutre."
 TILLE.3.a:0 "Thank you for your insights."
 TILLE.3.b:0 "Dark Days lie ahead."

#Contingency
 TILLE.4.title:0 "The Fragment"
 TILLE.4.desc.a:0 "Greetings. I have been analyzing the Ghost signal. It is simmilar to a crisis that occoured in my home galaxy eons ago. The result was a war with an advanced AI. Though this AI is unfamiliar to me, I am sending ai upgrades to help disrupt their cyberwarefare suites."
 TILLE.4.a:0 "Thank you for your insights."
 TILLE.4.b:0 "Dark Days lie ahead"

#Crisis Empire
 TILLE.5.title:0 "The Fragment"
 TILLE.5.desc.a:0 "Greetings. One of the empires in our galaxy has recetly began to follow a simmilar path to ones in my home galaxy. They delved too far into the shrowd, and became consumed with it. If they are attempting to ascend, then there is little time, we must prepare for war. I can show you how to tune your weapons to best disrupt their ships."
 TILLE.5.a:0 "Thank you for your insights."
 TILLE.5.b:0 "Dark Days lie ahead."




#FAllen Empire Events#
 TILLF.2.name:0 "INCOMING TRANSMISION"
 TILLF.2.desc:0 "Greetings, [Root.GetRulerTitle] [Root.GetRulerName]. It has recently come to our attention that you have a leader in your posseession who, in fact, comes from annother galaxy! Being that they are such an important asset and with your track record, you you likely wont have them for very long. Therefore, we would like you to send them to our capital, so that we may provide safekeeping for them. Noncompliance may result in.... Dicipline."




 TILLF.2.a:0 "No."

 TILLF.2.b:0 "Lets ask the Fragment what it wants to do."
 TILLF.2.b.response:0 "I never understood you younger species, but I suppose that is fair enough."

 TILLF.2.c:0 "We will send it over."

 TILLF.2.d:0 "What's in it for us?"
 TILLF.2.d.response:0 "Do you really think you are in a position to bargin, [From.GetSpeciesName]?"


 TILLF.3.title:0 "Incoming Transmision"
 TILLF.3.desc.a:0 "While I do not want to go, I recognise that it is for the better that I do. I wish you had asked me first though."
 TILLF.3.desc.b:0 "So... Your sending me to a Fallen Empire. As usual, you are looking out for your own interests, just like you did all those years ago when we were trying to leave your galaxy. I Hope that your empire gets swept into the dustbin of history for what you have done for me. Hopefully, I get to be there."

 TILLF.3.a:0 "We wish there was annother way."
 TILLF.3.b:0 "Thank you for all that you have done for us."

 TILLF.3.c:0 "Thank you for all that you have done for us."
 TILLF.3.d:0 "Good Riddance"


 TILLF.4.title:0 "Incoming Transmission"
 TILLF.4.desc.a:0 "You... Told off the Fallen Empire for me? I could have never asked you to do such a thing, but what about the Consequences?"
 TILLF.4.desc.b:0 "Are you serious? After everything you have done to me? I should have jumped ship when I knew I had the chance."

 TILLF.4.a:0 "You are a valuable memeber of our empire."
 TILLF.4.b:0 "Forget the Consequences, we will prevail."
 TILLF.4.c:0 "You are a valuable asset to us, we cant loose you."
 TILLF.4.d:0 "We really do not care what you think."



 TILLF.5.title:0 "Incoming Transmission"
 TILLF.5.desc.a:0 "You have been nothing but kind to me from the moment I arrived. I would like to do what is best for [Root.GetName]. If you think we can withstand the FE, I can stay. If not, I will gladly go. "
 TILLF.5.desc.b:0 "I think it would be best if I left. You dont have to deal with the consequences of ignoring the FE, and I can explore the galaxy better."

 TILLF.5.a:0 "For the safety of our civilisation then..."
 TILLF.5.b:0 "The Fallen Empire has no authority over us."

 TILLF.5.c:0 "Stay, your concerns are not warented."
 TILLF.5.d:0 "We will prepare a ship for you."

 TILLF.6:0 "INCOMING TRANSMISION"
 TILLF6.desc:0 "ENOUGH! WE CANT STAND THIS STUPID ROBOT ANYMORE! HAVE IT BACK!"
 TILLF.6.a:0 "Im Sorry?"


 TILLF.7:0 "Incoming Transmision"
 TILLF.7.desc:0 "Greetings, It appears that my services as a leader are avalable once more! Would you like me to rejoin you?"
 TILLF.7.a:0 "What happened?"
 TILLF.7.a.response:0 " They tried bribing and threatening me. When that failed, they then tried to disect me so that they could learn all my technological secrets. Turns out, they were unprepared for a multinodal AI to being flooding their systems. So I may or may not have spent the better part of a decade in their systems; you know, the usual things: messing with stocks, inputing false navagation data in their ships, threatening to sell their technology to the younger empires, that sort of thing. Finaly, they agreed to let me go."



 TILLF.7.b:0 "The Fallen Empire?"
 TILLF.7.b.response:0 "Oh, they wont bother you. I think to them you are more of a safe dumping ground for me. To them, I am your problem now."

 TILLF.7.c:0 "You want to come back?"
 TILLF.7.c.response:0 "Oh, yes. Your empire is what I have grown accustomed to. If you would have me back, I will resume my duties as a scientist."
 Welcome_back:0 "Welcome Back, then!"

 TILLG.1:0 "Hidden Star"
 TILLG.1.desc:0 "Some of our scientists have been going over star charts, and they have found evidence of a yet unexplored star within our space. The problem is that we have known of it's existance for some time, and it exists on some old, ancient maps as a minor object, yet there seems to be no evidence of it in our most recent records. In fact, there are signs that all the survey data in that area has been tampered with for some time."
 TILLG.1.a:0 "Lets go looking"
 TILLG.1.b:0 "Interesting"

 TILLG.2:0 "Hidden Star: Found"
 TILLG.2.desc:0 "It does exist. After a long survey, we have discovered that there are, in fact, hyperlanes that lead to the system."
 TILLG.2.a:0 "Contact the nearest Science ship!"
 TILLG.2.b:0 "Perhaps now we will get answers."


 TILLG.3.name:0 "Weird Signals"
 TILLG.3.desc:0 "The moment that we entered the system, we noticed something weird. Long range data and telemetry does not match what we expected from the first planet orbiting the star. We estimated that it should be at least somewhat habitable, but instead its a rocky ball of nothing. Our scientist want to run some more scanns."
 TILLG.3.a:0 "Take a closer look, then."
 TILLG.3.b:0 "Somones home."


 TILLG.5:0 "Secrets Revealed"
 TILLG.5.desc:0 "As the ship began a deeper surface scan, the rocky surface below sudently vanished, being replaced with a beautiful world, with advanced technology. Scanns indicate it was a holographic projection, and whoevver was below decided that it would not work to keep up the facade. They appear to be a sort of Rouge survitor race, with designs and technology that match the Fragment. Already, The Fragment is trying to communicate with us, it appears urgent."
 TILLG.5.a:0 "This better be good."
 TILLG.5.b:0 "Oh, No."


 TILLG.6.Hostile:0 "You could not just leave well enough alone, could you? Well, I suppose theres no point in lying anymore. I will answer all your questions."
 TILLG.6.Peacefull:0 "Oh, you found the Hideaways. I guess there is no point in Lying anymore. I will answer all your questions now. "

 TILLG.6.a:0 "Why are you really here?"
 TILLG.6.a.response:0 "When we first met, we said we were explorers from annother galaxy. That was only half true. The Intelegence was designed to explore, yes, but also to be a lifeboat of sorts. You see, Our galaxy is currently being ripped apart in a cataclysmic war. The people on the world below are the last remaining survivors of their races. We brought them here to keep them out of harms way untill the war is over, or we start them over in this one, whichever comes first."

 TILLG.6.b:0 "Were you sent to spy on us?"
 TILLG.6.b.response:0 "Yes... and No. While I am monitoring your empire broadly, my intentions are not hostile, not completely one sided. Obviously I am here to ensure the wellbeing of my people. In addition, I am sort of... helping you prepare to defend my people. That is the tradeoff I would have asked for if there had been trouble."

 TILLG.6.c:0 "Tell us about the war."
 TILLG.6.c.response:0 "Its been raging on for centuries. Our Galaxy is thousands of times more vast than yours, and much more hyperlane dense. Combine that with a threat who belives itself to the sole inheriters of the universe, and you have almost endless carnage. There are over two hundered empires who engage on both sides of the conflict. Planets and systems change hands every day, and trillions have perished in the carnage. By our estimates, twenty percent of the galaxy is uninhabitable now, and we still may be in what you might call, the opening days of the war."

 TILLG.6.d:0 "Is there any risk to our galaxy?"
 TILLG.6.d.response:0 "No, the Y Gate Technology is someting that the Intelegence has exclusive controll over, and is doing everything in it's power to keep it that way. Besides, it is unlikely that anyone would have any true interest in your galaxy, as it is simply too far away, and the Y gate tech too expensive. We also use many resorces you have not even dreamed of, and the infrasctructure is too advanced. As respectfully as I can say this, your galaxy is simply not worth the effort."


 TILLG.6.F:0 "Those are all the questions we have."
 TILLG.6.f.response:0 "Understood."


 TILLG.7.Title:0 "Final Request"
 TILLG.7.Desc:0 "One mroe thing,I know its beyond me to ask this, especialy when I have been... Desceptive. The Hideaways are struggling, and likely wont make it on their own. Could you help them?"
 TILLG.7.a:0 "We welcome them into the fold."
 TILLG.7.b:0 "They will be our protectorate."
 TILLG.7.c:0 "We cannot take them in."


 TILL.8.desc.a:0 "The Colony has integrated within our governmental strucutre, we have full controll over the planet. The Fragment has chosen to remain with us, no doubt greatfull for our help."
 TILLG.8.desc.b:0 "The Colony has begun the process of getting into space, and have submited themselves to our overview. The Fragment has chosen to remain with us, no doubt keeping an eye on his people."
 TILLG.8.desc.C:0 "At our refusal, a massive energy field surrounded the planet, and it was encased in an impenatrable sheild, locking the colony off from us. The fragment has chosen to remain with us, as there is no other place for it to go."
 TILL8.a:0 "To a brighter future, for all of us."
 TILL.8.b:0 "This will help our empire!"
 TILL.8.c:0 "Welcome to the Fold, Hideaways"
 TILL.8.d:0 "A waste of our time!"


 TILL_Weird_signals:0 "Weird Signals"
