l_english:
 NAME_Nar:0 "Nar"
 NAME_Nar_plural:0 "Nar"
 narll_fe_lab:0 "Dilapidated Laboratory"
 narll_fe_lab_des:0 "Scanners have unearthed a colossal complex concealed beneath the icy expanse of [From.Planet.GetName]. This subterranean structure not only exudes substantial energy signatures but also harbors frozen bio-matter within its depths."
 narll_catch_phrase:0 "§L"Let's relish in the freedom of discovery."§!"
 narll_backstory:0 "As a sentient entity composed entirely of energy, §Y$NAME_Nar$§! possesses a distinctive perspective on the fundamental nature of reality and an insatiable urge to explore. However, due to xer unnatural state, xe harbors a profound disdain for the empire that subjected them to this involuntary transformation."
 narll_legendary_joins:1 "§Y$NAME_Nar$§! joins your Empire as a §HLeader§!"
 narll_allowed:0 "§GNar Allowed§!"
 narll_disabled:0 "§RNar Disabled§!"
 spawn_narll:0 "Spawn Nar"
 narll_tooltip:0 "An energy being with ties to an ancient empire and a deep desire for freedom and exploration."
 narll_chain_title:0 "Solar Signals"
 narll_chain_desc:0 "Using the equipment salvaged from the dilapidated laboratory, you've detected enigmatic signals emanating from the star within this system. The signals suggest a rapid fade, projecting a mere two-year lifespan before complete decline."
 narll.1.name:0 "Solar Orbit"
 narll.1.desc:0 "§HThe entity gestures towards us, uttering incomprehensible sounds in an unknown language. After some adjustments, we successfully calibrate our translators to decipher its speech, facilitating communication.§!\n\n"I must thank you, [owner.GetSpeciesName]! I was stuck in that Star for..." §H\n\nXe pauses for a second, thinking about it.§!\n\n"...a very long time.""
 narll.1.a:0 "What exactly are you?"
 narll.1.a.response:0 "I find myself uncertain about my true nature, as were my creators. However, what has been deduced is that I am a creature comprised entirely of pure energy, unified into a singular being through a self-sustaining energy field."
 narll.1.b:0 "Why were you in that star?"
 narll.1.b.response:0 "The experiment to transform me into this... entity proved more successful than anticipated, eliciting unforeseen concerns and fear from my creators. It appears they became apprehensive about the implications of their success, worrying that my existence could attract peril to the Galaxy. Though they remained tight-lipped about the details, faced with limited options for disposal, they ultimately opted to eject me into a star."
 narll.1.c:0 "What are you planning to do now?"
 narll.1.c.response:0 "Most likely, I plan to embark on a journey through the stars. Being confined within one for an extended period has heightened my appreciation for the widespread beauty that exists throughout the cosmos. However, the monotony of witnessing only a single star has grown wearisome.\n\nI am considering aligning myself with a faction, as navigating the galaxy alone proved perilous in my earlier experiences, and I doubt that circumstance have evolved."
 narll.1.d:0 "What can you offer to our empire?"
 narll.1.d.response:0 "Without intending to boast, I was once a highly proficient scientist. My enduring survival in that star has forced me to acquire new skills and knowledge. I can offer invaluable expertise in thoroughly exploring and understanding every facet of a planet, delving into even the most obscure details."
 narll.10.title:0 "Research Lab Entrance"
 narll.10.desc:0 "We've identified a section within the complex, apparently dedicated to housing the energy reserves. Despite substantial dilapidation in various areas, this particular sector remains active, powered, and fortified."
 narll.10.a:0 "Continue"
 narll.11.title:0 "Energy Stores"
 narll.11.desc:0 "We've located the section housing the sensed energy reserves. Now, a decision must be made regarding how to handle this newfound discovery."
 narll.11.a:0 "Take the energy"
 narll.11.b:0 "Investigate the storage method"
 narll.12.title:0 "Data Servers"
 narll.12.desc:0 "The data servers, though partially intact, have suffered considerable degradation, with almost all information irretrievable. The remaining fragments indicate a concentration on merging field theory and biology. Extracting specific data poses a risk of triggering a destructive cascade. The decision now lies in determining which aspect - field theory or biology - should be the primary focus of our attention."
 narll.12.a:0 "Physics Research"
 narll.12.b:0 "Biology Research"
 narll.13.title:0 "Signal Receiver"
 narll.13.desc:0 "The sole operational computer within the laboratory is a signal receiver, directing attention towards the local star. This suggests a potential connection to the success of the experiments conducted here, possibly indicating the location of any remaining successful results."
 narll.13.a:0 "Trace the Signal"
 narll.13.b:0 "Ignore the Signal"
 narll_signals:0 "Strange Solar Signals"
 narll_signals_DESC:0 "Strange Solar Signals"
 narll.20.title:0 "Successful Retrieval"
 narll.20.desc:0 "Successfully coaxing the source of the peculiar signals out of the solar body, we bring it into our cargo hold. There, we discover a vaguely [owner.GetAdjective] figure composed of what seems like crackling energy."
 narll.20.a:0 "Open Communications"
 narll.210.title:0 "A Curious Proposal"
 narll.210.desc:0 "§Y$NAME_Nar$§! §Hpresents a thought-provoking proposition,§! I can partition a small fraction of myself, offering assistance in advancing one of your objectives. However, these entities will cease to exist without my conscious control after a span of 5 years.\n\n§HHow might we employ this unique offer?§!"
 narll.210.a:0 "Study it to improve our £physics£ §BPhysics Research§!"
 narll.210.b:0 "Use them to empower our £energy£ §YEnergy§! generation"
 narll.210.c:0 "Use them to strengthen our weaponry"
 narll.210.d:0 "Use them to harden our shields"
 narll.220.title:0 "Communications from §H[narll_creator.GetName]§!"
 narll.220.desc:0 "Having detected our discovery of one of their former laboratories, they urge us to erase any research data obtained from it. According to them, this data harbors a perilous threat to the entire galaxy."
 narll.220.a:0 "Yes, we shall do so [narll_creator.GetSpeciesNamePlural]!"
 narll.220.b:0 "§R(Lie)§! Yes, we shall do so [narll_creator.GetSpeciesNamePlural]!"
 narll.220.b.tt:0 "The result of this will depend on your encryption. Failure will give a malus and they will not leave the matter be."
 narll.220.c:0 "We shall do no such thing, despot."
 narll.221.title:0 "Response from [narll_creator.GetSpeciesNamePlural]!"
 narll.221.desc:0 "We have noticed your attempt at deception, and you will regret this!"
 narll.221.a:0 "Ominous"
 narll.230.title:0 "An Intriguing Proposal"
 narll.230.desc:0 "[From.GetSpeciesNamePlural]!, after careful consideration, I am prepared to extend this offer to you. I have devised a preliminary plan for replicating my transformation, albeit to a significantly lesser degree. This could provide substantial benefits to your population, such as an extended lifespan or an enhanced affinity for any energy-based technology."
 narll.230.a:0 "We will prepare anything necessary."
 narll.230.b:0 "No, we have no interest in this!"
 narll.231.title:0 "Finished Biological Field Experiments"
 narll.231.desc:0 "Our experiments with biologically sustained self-contained energy fields have concluded successfully. The next phase of our research involves delving into the intricacies of generating energy solely from our bodily processes."
 narll.231.a:0 "Very well, continue"
 narll.232.title:0 "Finished Genetic Field Generation Experiments"
 narll.232.desc:0 "Having completed our experiments on incorporating field generation into our genetic code, the only remaining challenge lies in effectively endowing our species with these newly acquired traits."
 narll.232.a:0 "Finally, enact it!"
 narll.233.title:0 "Genetic Modifications Completed"
 narll.233.desc:0 "We have finalized the modification of our genetic code, enabling us to transform into beings that are partially composed of energy."
 narll.233.a:0 "Marvelous"
 narll.240.title:0 "Technological Proposal"
 narll.240.desc:0 "I believe, with some assistance, I can potentially recollect some of the distinctive technologies my empire utilized. However, this process will leave me weakened for a few years. You only need to prepare a machine that would enable me to stabilize my form."
 narll.240.a:0 "Prepare the Machine"
 narll.240.b:0 "That sounds like a risk that isn't worth it."
 narll.241.title:0 "Memory Reconstruction"
 narll.241.desc:0 "We've completed the construction of the machine that will facilitate the reconstruction of §Y$NAME_Nar$s§! memories. We face a choice. We can either attempt to retrieve the memories of a single technology or opt for a more potent pulse, risking potential complications, in an attempt to recover two memories."
 narll.241.a:0 "Only retrieve the memories of one technology"
 narll.241.b:0 "Full power, we need those technologies"
 narll.250.title:0 "Communications from §H[narll_creator.GetName]§!"
 narll.250.desc:0 "They assert that we are harboring a dangerous individual who managed to escape their containment. They strongly advise us to return this individual, emphasizing that xe poses a significant threat to the entire galaxy."
 narll.250.a:0 "Fine, we shall deliver xer to you."
 narll.250.b:0 "We would never give up one who has served us so dutifully."
 narll.402.title:0 "§Y$NAME_Nar$§! Re-converged"
 narll.402.desc:0 "§HWe see xer slowly take shape out of the floating plasma cloud, slowly reconstructing xerself, layer for layer.§!\n\n"Ahhh, thank you for pulling me back from my demise.""
 narll.402.a:0 "Welcome back"
 narll_leader_trait_legendary_energy_manipulation:0 "Energy Manipulation"
 narll_leader_trait_legendary_energy_manipulation_desc:0 "Due to their distinctive body and experiences, they have acquired the ability to manipulate and sense various forms of energy by harnessing their unique nature."
 narll_leader_trait_legendary_energy_manipulation_custom_tt:1 "Regularly generates a random positive deposit on worlds in the solar system."
 narll_leader_trait_energy_being:0 "Innate Field Manipulation"
 narll_leader_trait_energy_being_desc:0 "Given their nature as a being partially composed of energy, this leader possesses an innate ability to manipulate fields, affording them significant advantages across various domains.."
 narll_trait_energy_being:0 "Energy Being"
 narll_trait_energy_being_desc:0 "§LThrough complicated procedures inspired by§! §Y$NAME_Nar$ §Lthis species has become in one partially made out of energy§!"
 narll_trait_energy_being_custom_tt:1 "Decreases Pop £food£ §YFood§! or £minerals£ §YMineral§! Upkeep by §G75%§! depending on if you are Biological or Lithoid\n- £energy£ Energy Upkeep per 100 £pops£ Pops: +0.25"
 narll_physics:0 "Study the Solar Gift"
 narll_energy:0 "Solar Gift of Generation"
 narll_shields:0 "Solar Gift of the Armor"
 narll_weapons:0 "Solar Gift of Burning"
 narll_opinion_refused_deletion:0 "Refused to delete dangerous data."
 narll_opinion_refused:0 "Refused to hand over dangerous fugitive §Y$NAME_Nar$§!"
 narll_opinion_delivered:0 "Handed over §Y$NAME_Nar$§!"
 narll_opinion_deleted_data:0 "Agreed to delete data."
 narll_deleted_data:0 "Deleted Crucial Research Data"
 narll_opinion_tried_tricking:0 "They attempted to deceive us."
 narll_turning_chain_title:0 "Partial Energy being transformation"
 narll_turning_chain_desc:0 "We are investigating turning our population into half-energy based beings."
 narll_revive_machine:0 "Revive $NAME_Nar$ in the Capital"
 narll_revive_machine_DESC:0 "Reconsolidate xer form in a specially designed chamber in the capital."
 narll_de_unlock:0 "Investigate $NAME_Nar$'s Memories For Technology"
 narll_de_unlock_DESC:0 "Create a device capable of drawing out almost forgotten memories from xer form."
 narll_turning_society:0 "Self-Contained Biologic Fields"
 narll_turning_society_DESC:0 "Research a way to use our bodies to generate electrical fields."
 narll_turning_physics:0 "Genetic Energyfield Generator"
 narll_turning_physics_DESC:0 "Research a way to store the previous results in our genetic material."
 narll_turning:0 "Incorporate Energyfield Genetics"
 narll_turning_DESC:0 "Apply our findings and become as energy."
 narll.700.title:0 "Kill"
 narll.700.desc:0 "Kill Nar"
 narll.700.a:0 "KILL!"