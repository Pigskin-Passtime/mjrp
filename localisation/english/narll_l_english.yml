# TODO: this entire file needs a rework
l_english:
 NAME_Nar:0 "Nar"
 NAME_Nar_plural:0 "Nar"
 narll_fe_lab:0 "Dilapilated Laboratory"
 narll_fe_lab_des:0 "Scanners detect a giant complex buried beneath the ice and snow of [From.Planet.GetName]. They also seem to contain significant quantities of energy and even some frozen biomatter."
 narll_catch_phrase:0 "§L"Let's relish in the freedom of discovery."§!"
 narll_backstory:0 "As a being of pure energy, §Y$NAME_Nar$§! has an unique view on the physicality underpinning reality, and an incredible drive to explore. Though as xer state is not natural, xe do harbour a certain amount of dislike for the empire who forced this involuntary transformation upon them."
 narll_legendary_joins:1 "§Y$NAME_Nar$§! joins your Empire as a §HLeader§!"
 narll_allowed:0 "§GNar Allowed§!"
 narll_disabled:0 "§RNar Disabled§!"
 spawn_narll:0 "Spawn Nar"
 narll_tooltip:0 "An energy being with ties to an ancient empire and a deep desire for freedom and exploration."
 narll_chain_title:0 "Solar Signals"
 narll_chain_desc:0 "You have sensed suspicious signals using the equipment from the dilapidated laboratory. They seem to come from the systems star. It seems to be fading rapidly, lasting only two years with the current rate of decline."
 narll.1.name:0 "Solar Orbit"
 narll.1.desc:0 "§HIt seems to gesture to us, and speaking an unknown language. After a bit of tweaking we manage to calibrate our translators to the language it uses allowing us to establish communications.§!\n\nI must thank you, [owner.GetAdjective]! I was stuck in that Star for, §HXe pauses for a second, thinking about it§!, a very long time."
 narll.1.a:0 "What exactly are you?"
 narll.1.a.response:0 "I am not quite sure on what exactly I am either, nor were my creators. But what was figured out is that I am a creature of pure energy, kept as one being by a self-sustaining energy field."
 narll.1.b:0 "Why were you in that star?"
 narll.1.b.response:0 "While the experiment of turning me into... this was a success, moreso than expected even, they began to be afraid of what they did, and that it was a success. Apparently they were afraid my existence would attract a danger to the Galaxy?\nThey would not talk about that, but as most quick ways of elimination were out they simply shot me into a star."
 narll.1.c:0 "What are you planning to do now?"
 narll.1.c.response:0 "Explore the stars probably. Have been in one too long to not see the beauty that is everywhere, but... only seeing one got quite boring.\nPlanning to join up with some faction, being on your own has been quite dangerous back in my time and I strongly doubt that changed."
 narll.1.d:0 "What can you offer to our empire?"
 narll.1.d.response:0 "Not to boast, but I was a quite skilled scientist, and I only managed to survive this long by learning some new tricks in there. I will be able to find everything on a planet, up to the most obscure aspects."
 narll.10.title:0 "Research Lab Entrance"
 narll.10.desc:0 "We have found a partition of the complex that seems to house the energy reserves, but while a lot of area is dilapidated it is still powered and protected."
 narll.10.a:0 "Continue"
 narll.11.title:0 "Energy Stores"
 narll.11.desc:0 "We have found the area that stored the energy we sensed. We will need to decide what to do with them."
 narll.11.a:0 "Take the energy"
 narll.11.b:0 "Investigate the storage method"
 narll.12.title:0 "Data Servers"
 narll.12.desc:0 "While the data servers have partially survived the data is almost all lost. It seems to focus on combining field theory and biology, but if we try to extract any specific data it will cause a cascade destroying the remaining data. Which aspect should we focus on."
 narll.12.a:0 "Physics Research"
 narll.12.b:0 "Biology Research"
 narll.13.title:0 "Signal Receiver"
 narll.13.desc:0 "The only functional computer left in this laboratory is a signal receiver which seems to point to the local star. It might indicate the location of a success of these experiments."
 narll.13.a:0 "Trace the Signal"
 narll.13.b:0 "Ignore the Signal"
 narll_signals:0 "Strange Solar Signals"
 narll.20.title:0 "Successful Retrieval"
 narll.20.desc:0 "We managed to draw the source of the strange signals out of the solar body into our cargo hold, where we find a vaguely [owner.GetAdjective] figure made out of what appears like crackling energy."
 narll.20.a:0 "Open Communications"
 narll.210.title:0 "A Curious Proposal"
 narll.210.desc:0 "§Y$NAME_Nar$§! §Happroaches you with a curious offer§!\n\nI can split a small part of myself, which can be used to help to further one of your goals, though they will expire without my conscious control after 5 years.\n\n§HWhat would you use this for?§!"
 narll.210.a:0 "Study it to improve our §BPhysics Research§! ADD SYMBOL"
 narll.210.b:0 "Use them to empower our %energy%! §YEnergy§! generation FIX SYMBOL"
 narll.210.c:0 "Use them to strengthen our weaponry"
 narll.210.d:0 "Use them to harden our shields"
 narll.220.title:0 "Communications from §H[narll_creator.GetName]§!"
 narll.220.desc:0 "[Root.getSpeciesNamePlural], we have discovered that you found one of our abandoned laboratories, one which holds secrets that would be a terrible danger to the galaxy. It would be the best for everyone if you were to delete any data you have found from it."
 narll_deleted_data:0 "Deleted crucial research data"
 narll.220.a:0 "Yes, we shall do so [narll_creator.GetSpeciesNamePlural]!"
 narll.220.b:0 "§RLie§! Yes, we shall do so [narll_creator.GetSpeciesNamePlural]!"
 narll.220.b.tt:0 "The result of this will depend on your encryption. Failure will give a malus and they will not leave the matter be."
 narll.220.c:0 "We shall do no such thing, despot."
 narll.221.title:0 "Response from [narll_creator.GetSpeciesNamePlural]!"
 narll.221.desc:0 "We have noticed your attempt at deception, and you will regret this!"
 narll.221.a:0 "Ominous"
 narll.230.title:0 "An Intruiging Proposal"
 narll.230.desc:0 "[From.getSpeciesNamePlural]!, I have considered this for a while and believe it is now time to make you this offer. I have a rough idea on how to replicate my transformation, if to a far lesser extent, giving your population quite a few benefits, like an extended lifespan, or increased affinity for any energy-based technology."
 narll.230.a:0 "We will prepare anything necessary."
 narll.230.b:0 "No, we have no interest in this!"
 narll.231.title:0 "Finished Biological Field experiments"
 narll.231.desc:0 "We have finished our experiments with biologically upheld self contained energy fields. Now we only have to research how to generate solely from our bodily processes."
 narll.231.a:0 "Very well, continue"
 narll.232.title:0 "Finished Genetic Field Generation experiments"
 narll.232.desc:0 "We have finished our experiments on how to inscribe field generation into our Genetic code. The last remaining obstacle is actually giving our species these traits."
 narll.232.a:0 "Finally, enact it!"
 narll.233.title:0 "Genetic Modifications Completed"
 narll.233.desc:0 "We have completed modifying our genetic code to have us become beings, partially made up of energy."
 narll.233.a:0 "Marvelous"
 narll.240.title:0 "Technological Proposal"
 narll.240.desc:0 "I believe, with some help, I might be able to recall some of the unique technologies my empire used. Though it will leave my weakened for a few years. You would only need to prepare a machine that would allow me to stabilise my form."
 narll.240.a:0 "Prepare the Machine"
 narll.240.b:0 "That sounds like a risk that isn't worth it."
 narll.241.title:0 "Memory Reconstruction"
 narll.241.desc:0 "We have finished constructing the machine that would allow us to reconstruct §Y$NAME_Nar$s§! memories. We could either only attempt to retrieve the memories of one technology, or we could use a far stronger pulse and attempt to get two, though there might be some risks."
 narll.241.a:0 "Only retreive the memories of one technology"
 narll.241.b:0 "Full power, we need those technologies"
 narll.250.title:0 "Communications from §H[narll_creator.GetName]§!"
 narll.250.desc:0 "[From.getSpeciesNamePlural]!, you harbour a dangerous individual, which escaped from their final resting place. We recommend you return xer to us, as xer continued existence puts the galaxy in great danger."
 narll.250.a:0 "Fine, we shall deliver xer to you."
 narll.250.b:0 "We would never give up one who has served us so dutifully."
 narll.402.title:0 "§Y$NAME_Nar$§! reconverged"
 narll.402.desc:0 "§HWe see xer slowly take shape out of the floating plasma cloud, slowly reconstructing xerself, layer for layer.§!\n\nAhhh, thank you for pulling me back from my "
 narll.402.a:0 "Welcome back"
 narll.403.title:0 "Field Reconvergence Chamber Constructed"
 narll.403.desc:0 "We have finished constructing the Field Reconvergence Chamber, allowing §Y$NAME_Nar$§! to regain xer form on our capital instead at the place of xer demise."
 narll.403.a:0 "Excellent"
 narll.404.title:0 "Field Reconvergence Chamber"
 narll.404.desc:0 "With our experience reconverging §Y$NAME_Nar$§! we might be able to create a machine that allows us to converge xer remotely."
 narll.404.a:0 "Begin the construction"
 narll.404.b:0 "No need."
 narll_leader_trait_legendary_energy_manipulation:0 "Energy Manipulation"
 narll_leader_trait_legendary_energy_manipulation_desc:0 "Thanks their unique body and experiences they have learned how to use it to manipulate and sense different forms of energy."
 narll_leader_trait_legendary_energy_manipulation_custom_tt:1 "Generates a random positive planetary feature on surveyed planets."
 narll_leader_trait_energy_being:0 "Innate Field Manipulation"
 narll_leader_trait_energy_being_desc:0 "Thanks to their nature as a being of energy this leader is able to inherently manipulate fields, and ability which grants them benefits in all areas."
 narll_trait_energy_being:0 "Energy Being"
 narll_trait_energy_being_desc:0 "§LThrough complicated procedures inspired by§! §Y$NAME_Nar$! §Lthis species has become in one partially made out of energy§!"
 narll_trait_energy_being_custom_tt:1 "Decreases food £food£ §YFood§! or £minerals£ §YMineral§! upkeep by §G60%§! depending on if you are Biological or Lithoid"
 narll_physics:0 "Study the Solar Gift"
 narll_energy:0 "Solar Gift of Generation"
 narll_shields:0 "Solar Gift of the Armor"
 narll_weapons:0 "Solar Gift of Burning"
 narll_opinion_refused_deletion:0 "Refused to delete dangerous data."
 narll_opinion_refused:0 "Refused to hand over dangerous fugitive §Y$NAME_Nar$§!"
 narll_opinion_delivered:0 "Handed over §Y$NAME_Nar$§!"
 narll_opinion_deleted_data:0 "Agreed to delete data."
 narll_deleted_data:0 "Deleted crucial research data"
 narll_opinion_tried_tricking:0 "They attempted to deceive us."
 narll_turning_chain_title:0 "Partial Energy being transformation"
 narll_turning_chain_desc:0 "We are investigating turning our population into half-energy based beings."
 narll_revive:0 "Revive $NAME_Nar$ on location"
 narll_revive_machine:0 "Revive $NAME_Nar$ in the Capital"
 narll_build_revive_machine:0 "Create Field Reconvergence Chamber"
 narll_de_unlock:0 "Investigate $NAME_Nar$s memories for technology"
 narll_turning_society:0 "Self-contained Biologic Fields"
 narll_turning_physics:0 "Genetic Energy Field Generator"
 narll_turning:0 "Incorporate it into our species"
 narll.700.title:0 "Kill"
 narll.700.desc:0 "Kill Nar"
 narll.700.a:0 "KILL!"