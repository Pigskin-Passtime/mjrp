l_english:

 ##############
 # Technology #
 ##############

 tech_Advanced_AI_Integration: "AI Algorithm Adjustments"
 tech_Advanced_AI_Integration_desc: "With the expertise of our new friend we have adjusted our AI algorithms to become more efficient"

 tech_Irassian_Bioweapon_Warfare: "Irassian inspired Bioweapons"
 tech_Irassian_Bioweapon_Warfare_desc: "By mutating many diseases recorded in the remainders of the irassian archives, including the Javorian Pox, we have created advamced bioweapons we can use for ground combat and orbital bombardments"

 tech_AI_Command_System: "AI Command system"
 tech_AI_Command_System_desc: "A new building desiganted for planetary defence capabilities"

 #############
 # Buildings #
 #############

 building_non_gestalt_Proto_AI_Core: "Proto AI Core"
 building_non_gestalt_Proto_AI_Core_desc: "The first step towards the integration of highly advanced AI into our planetary infrastructure."

 building_non_gestalt_Spectre_Core: "Spectre Core"
 building_non_gestalt_Spectre_Core_desc: "The Spectre Core represents perhaps the most ambitious AI experiment in our known galaxy yet. Its capabilities are far beyond everything our scientists have imagined. One may wonder what other effects we have not discovered yet."

 building_machine_Proto_AI_Core: "Proto Core"
 building_machine_Proto_AI_Core_desc: "Successfull partial integration of advanced AI algorithms into our planetray infrastructure."

 building_machine_Spectre_Core: "Spectre Core"
 building_machine_Spectre_Core_desc: "Full integration of the new AI Core into our Planetary command hub. Feels odd."

 building_hive_Proto_AI_Core: "Proto AI Core"
 building_hive_Proto_AI_Core_desc: "The first step towards the integration of highly advanced AI into our planetary infrastructure."
 building_hive_Spectre_Core: "Spectre Core"
 building_hive_Spectre_Core_desc: "With the help of our new friend, we have fully integrated the AI contained in this Core into our planetary systems. One may wonder if we have gone too far and what its capabilities truely are."

 building_Atmospheric_Simulation_Site: "Atmospheric Stimulation Site"
 building_Atmospheric_Simulation_Site_desc: "By using a large amount of zro, we can briefly experience total psyonic oneness with each other. a shame these effects only last for a few seconds."

 building_Zro_Physics_Lab: "Artificial Portal Site"
 building_Zro_Physics_Lab_desc: "We cannot completely explain how, but by using enough Zro in this facility we have created a dimensional portlal. In this dimension physics follow other laws. How intersting to observe it."

 building_Automated_Command_System: "Automated Bunkers"
 building_Automated_Command_System_desc: "Automated Bunkers designated for large scale planetary defence."

 building_Irassian_Health_Institute: "Automated Health Institude"
 building_Irassian_Health_Institute_desc: "By using irassian insights about biology, we have created an advanced, automated medical facility. Since its completion birth rates rose up."

 building_Baol_Remembrance_Site: "Baol Remembrance Site"
 building_Baol_Remembrance_Site_desc: "A truely unique species, with an interesting past, both should be remembered. In service to this goal, this is a museum and research facility purely designated to the baol."

 building_Baol_Bioelectricity_Farm: "Baol Energy Farm"
 building_Baol_Bioelectricity_Farm_desc: "The species of the Baol makes a good fuel for bio reactors. Also until they are growing up, we can research their biological processes"

 building_Holoreality_Spa: "Holoreality Spa"
 building_Holoreality_Spa_desc: "Nobody leaves this building without a happy expression. This Spa allows anyone to fully experience any adventure they want, therefore maximizing fun during free time. Also this building improves every Amenity on the planet in Quality"
 
 building_Virtual_Reality_Lab: "Virtual Reality Lab"
 building_Virtual_Reality_Lab_desc: "Due to its incomprehensibly advanced Virtual Reality, this lab allows to simulate anything as accurate as possible. This helps us in Physics, and also makes drone maintainance easier."
 
 building_First_League_Foundry: "First League Foundary"
 building_First_League_Foundry_desc: "This is the peak of first league inspired industry. Allowing high production of alloys at a lower cost planet-wide. Still there is much to learn about their engeneering."


 ########
 # Jobs #
 ########

 job_Baol_researcher: "Baol Researcher"
 job_Baol_researcher_plural: "Baol Researchers"
 job_Baol_researcher_desc: "This Specialist is designated to observe and research the internal Biology of the Baol."

 job_Baol_Technician: "Baol Technician"
 job_Baol_Technician_plural: "Baol Technicians"
 job_Baol_Technician_desc: "Regulator of Baol growth, Researcher of their Biology, Architect of their end."


 job_Vultaum_Drone: "Virtual Reality Unit"
 job_Vultaum_Drone_plural: "Virtual Reality Units"
 job_Vultaum_Drone_desc: "A unit specialised on Simulations of physical processes and on simulating programming mistakes"


 job_First_League_Foundry_Operator: "First League Metallurgist"
 job_First_League_Foundry_Operator_plural: "First League Metallurgist"
 job_First_League_Foundry_Operator_desc: "Specialist using and researching ancient equipment"

 job_First_League_Foundry_Drone: "First League Drone"
 job_First_League_Foundry_Drone_plural: "First League Drones"
 job_First_League_Foundry_Drone_desc: "Complex Drone using and researching ancient equipment"


 job_AI_Core_Operator: "Core Operator"
 job_AI_Core_Operator_plural: "Core Operators"
 job_AI_Core_Operator_desc: "Maintains the Algorithms. Also finding new insights every day"
 

 job_vizier: "Vizier Drone"
 job_vizier_plural: "Vizier Drones"
 job_vizier_desc: "Reduces Deviancy and serves as Helperdrone with the help of Calculations made by the AI Core"

 job_AI_Processor: "Processor Drone"
 job_AI_Processor_plural: "Processor Drones"
 job_AI_Processor_desc: "Assistant Drones to the core. Increases grid stability"


 job_AI_Operator: "AI Operator"
 job_AI_Operator_plural: "AI Operators"
 job_AI_Operator_desc: "Interface between the hive and the AI Core. Responsible for optimization of planetary output"

 job_AI_Interpretor: "Interpreter"
 job_AI_Interpretor_plural: "Interpreters"
 job_AI_Interpretor_desc: "Interprets thoughts of fellow drones with the help of the Cores Processors. Efficient at reducing deviancy and increasing planetary stability"
 
 ##########
 # Traits #
 ##########

 trait_cbernetic_hive: "Cybernetic Hive Individual"
 trait_cbernetic_hive_desc: "By using advanced Cybernetics, our Species has made a new step in its evolution. With those implants, it is possible to be part of a collective consciousness without losing out on our individuality. This ensures more efficient communication, enabling us to deal with all problems more efficiently."
 
 leader_trait_cybernetic_hive: "Cybernetic Hive Individual"
 leader_trait_cybernetic_hive_desc: "This Leader has edvanced cybernetic implants made for efficient communication with all other cybernetic hive members of our species. Therefore this leader can work more efficiently while still having a free spirit."

 trait_gestalt_individualism: "Gestalt-Individualism"
 trait_gestalt_individualism_desc: "The new cybernetics our friend designed allow for keeping the integrity of the hive, while at the same time making our drones able to think independently for themselves. However unlike other species' individuals, our population has no need for luxury goods. This allows for more efficient drones, ... uhhm individuals."

 leader_trait_the_architect: "The Architect"
 leader_trait_the_architect_desc: "last Being of an Ancient species. His Cybernmetics are far more advanced than we have witnessed ever before. They seem to allow Immortality."

