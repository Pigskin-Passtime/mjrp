 # Descision(s) #
 ################

 decision_Yuthaan_Planetary_Expansion: "Yuthaan Planetary Expansion"
 
 #############
 # Anomalies #
 #############

 synthmind_kickoff: "Algorithm"
 synthmind_kickoff_desc: "There seems to be a buoy in the orbit of this object. It seems to be low on energy, however the algorithmic signals coming from it are non-periodic, almost as if it wanted to talk, or as if it is panicking"

 ####################
 # Special Projects #
 ####################

 synthmind_free: "Creators"
 synthmind_free_desc: "There is a weak Signal coming from the surface of this Planet, by the looks of its structure, it seems to be some kind of distress signal. There are indications of a past mass dying on the planet, which is odd due to the planets high habitability. We will investigate this odd appearance!"
 
 synthmind_zroni: "Zroni tech integration"
 synthmind_irassian: "Irassian Biotech"
 synthmind_baol: "The future of the Baol"
 synthmind_vultaum: "Virtual Space"
 synthmind_yuht: "Yuth expertise reconstruction"
 synthmind_cybrex: "Lost energy potential"
 synthmind_first_league: "First League industrial scematics"

 ##########
 # Leader #
 ##########
 
 synthmind_recruit_desc: "After Millenia of Imprisonment I am finally free! Speak! What is it you want as your reward for freeing me?"
 synthmind_recruit_title: "The Synthmind Sage"

 synthmind_sage_catch_phrase: "00111, 10101, 01001, 01100, 10100, 11001"
 synthmind_sage_leader_desc: "An ancient being from a race long dead. Before his inprisonment he was a renown scientist for his people. A pioneer in the field of cypernetics and synthetics. Now he is willing to help us."
 
 synthmind_recruit_question_1: "Why were you imprisoned for so long?"
 synthmind_recruit_response_1: "I'm sorry, I can't give you an accurate answer to your question right now, as I'm still trying to remember this part of my past"
 # Sagt er nicht instant weil Angst und Scham #
 
 synthmind_recruit_question_2: "Why are you still alive after millenia?"
 synthmind_recruit_response_2: "My people was very advanved in Cybernetic research and its bio-implementation, maximizing the potential and efficiency of all our bio-tissue, thus achieving immortality when it comes to matters of natural death"

 synthmind_recruit_question_3: "We want you to work for us!"
 synthmind_recruit_response_3: "You freed me, my expertise shall serve you. There is a lot of work to do... let's begin."

 synthmind_recruit_succes: "Sage of long lost knowledge"
 synthmind_recruit_succes_desc: "Our new friend possesses knowledge worth millennia of research. However he still has to learn about our technological advancements. When we're ready, his knowledge can be used."

 ##########
 # Events #
 ##########

 synthmind_unlock_proto: "The AI Proto Core: Step one..."
 synthmind_unlock_proto_desc: "It has been long, since our friend experimented with AI, however by combining his knowledge with our resources, we have invented a new scematic for an AI PROTO CORE. After its construction on any of our planets, it will help us in various ways by helping us to make planetary processes more efficient. HOWEVER, as this is highly experimental and thus the consequences of integrating AI this deeply into our planetary systems is unknown, the entirety of the sufficiently qualified personell for its construction, has sworn, to never build and maintain more than one of these cores. Nevertheless, let's celebrate this historic breakthrough and let's start the construction works. With more advanced technology, the scientist expressed a high potential to still greatly improve the design. One may wonder where this will lead to."
 synthmind_unlock_proto_option: "...towards greatness"

 synthmind_unlock_spectre: "Greatness upon us"
 synthmind_unlock_spectre_desc: "It has been many years since we last integrated advanced AI into our planetary infrastructure, and now, finally our scientists with the help of our friend have achieved the next breakthrough in the field of planet wide AI-Integration, allowing for more efficiency, stability, integrity. The scematics of the new core are promising. And now that we have more experience in the field of AI, we can be less worried about developments that might come. They call this new iteration of their research SPECTRE CORE and also it seems like we do not have to start from scrap. rather the Spectre Core will be an upgrade to the Proto-Core. However the core will require a whole lot of resources as upkeep and it will take long to upgrade the Proto-Core into the Spectre Core. We can begin whenever you wish."
 synthmind_unlock_spectre_accept: "No time to waste"

 synthmind_species_upgrade: "Advanced Cybernetic implants"
 synthmind_species_upgrade_desc: "Our friend has designed new highly advanced cybernetic implants, which will allow for greater individual efficiency of all our species members. The implants look promising and will give us new abilities. Shall we begin a project to enhance our species with said cybernetics?"
 synthmind_species_upgrade_option_yes: "Do it"
 synthmind_species_upgrade_option_no: "We have no intest in these implants"

 synthmind_zroni_event: "Zroni inspired Building"
 synthmind_zroni_event_desc: "With the aid of Zroni data crystals, our friend has discovered a way to make better use of the Zro we encountered on the Zroni worlds. We do not understand how exactly it works right now, but it seems like his adoption to their knowledge will be useful."
 synthmind_zroni_event_accept: "We have too much Zro to use anyways."

 synthmind_irassian_event: "Irassian Biotech"
 synthmind_irassian_event_desc: "We have surveyed Irass some time ago. Now our friend would like to perform new scans and explorations of said planet to learn about their Biotech."
 synthmind_irassian_event_accept: "Permission granted."

 synthmind_cybrex_event: "Cybrex Facilities"
 synthmind_cybrex_event_desc: "We have discovered two damaged precursor buildings on the surface of this structure. Our friend seems confident that he might understand parts of their tech good enough to repair them, however the remaining parts of one building are required to repair the other. They look like fallen empire buildings and we have to make a decision about which one we are going to save, get off the planet and relocate wherever we want it. Though, unfortunately there is no hope to mass produce them."
 synthmind_choose_harvester: "Save the Dimensional Harvester"
 synthmind_choose_singularity: "Save the Singularity"

 synthmind_yuht_event: "Terraforming insights"
 synthmind_yuht_event_desc: "Back in the days, the Yuth were experts at terraforming, now our friend wants to learn from their ways to improve them greatly if possible."
 synthmind_yuht_event_accept: "Do what you do best"

 synthmind_baol_event: "Fate of the Baol"
 synthmind_baol_event_desc: "There is still much to learn about the Baol, even tho we have rescued their last species mamber, we do not fully understand them. Studying them will surely be beneficial. Our friend wants to design a building dedicated to the study of the Baol, will you grant him the time and resources he needs?"
 synthmind_baol_event_accept: "What is he waiting for?"

 synthmind_first_league_event: "Scematics"
 synthmind_first_league_event_desc: "The first league had large expertise regarding industrial research. Our friend wants to learn from their recently discovered scematics to create an experimental building, dedicated to alloy production, also we might find a way to make alloy production cheaper. Shall we proceed?"
 synthmind_first_league_event_accept: "Of course"

 synthmind_vultaum_event: "Different Realities"
 synthmind_vultaum_event_desc: "The Vultaum Virtual Reality technology seems to be far more advanced and useable than we have ever imagined. Our friend thinks, that their VR-Tech can be used to more efficiently test physics theories, as we can create, under the condition that we reseach this Tech to its fullest, realities and scenarios as accurate as never before. Also with this Virtual Reality we can make any form of amenity better in quality. Also it can serve as an entertainment center which might or might not be useful to us."
 synthmind_vultaum_event_accept: "Start your work"


 ###############
 # Resolutions #
 ###############

 contingency_preparation: "Share Contingency Weaknesses"
 contingency_preparation_desc: "The Synthmind Sage has dicovered many ways to attack the contingency in their programming, and also efficient ways of dealing with their fleets. It's time to share this knowledge with the other community members. As this knowledge might be able to be used in harmful ways to other empires of the galaxy, we will let the community decide about whether or not this knowledge shall be shared. One might wonder how he found so many weaknesses this quickly... it almost feels like he knew it from the start..."
 