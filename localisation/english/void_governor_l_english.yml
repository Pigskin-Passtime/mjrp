#matter decompressor event
vg.104.name:0 "Potential Mega-Structure Technology" 
vg.104.desc:0 "Now that we are capable of Mega-Engineering, We should be able to apply what we learnt from freeing Inanis from the black hole to create a Mega Structure capable of drawing minerals from a black hole. Our scientists call this a "Matter Decompressor"."
vg.104.a:0 "Ok."

#Flavor Events
vgflavor.2.name:0 "Studying Inanis of the Void's Power" #building event
vgflavor.2.desc:0 "Now that Inanis has settled into our empire, our scientists have discussed the possibility of studying the effects of Inanis power. Inanis themselves have readily agreed to this, understanding that better knowledge of how this power functions might allow them to gain more control over it. \n\nOur scientists now need to design a research lab which, while on a planet governed by Inanis, would allow for various tests to be performed in a safe environment."
vgflavor.2.a:0 "This is great news."

vgflavor.4.name:0 "Inanis of the Void's Skill" #trait event
vgflavor.4.desc:0 "Inanis of the Void has been using their power to increase the productivity of our planets for some time now. Inanis has proposed we let them have more control over the entire planet they govern. They believe that they can now more efficiently manage a planet affected by their power, expecting roughly a 5% productivity increase. \n\nWe have decided to grant this request, their control over their abilities has steadily increased as we have studied it as well as their expert governing skills has more than proved their worth to us."
vgflavor.4.a:0 "Practice makes perfect."
 
#vgflavor.5.name:0 "REPLACE_ME" # dont need
#vgflavor.5.desc:0 "REPLACE_ME"
#vgflavor.6.name:0 "REPLACE_ME"
#vgflavor.6.desc:0 "REPLACE_ME"

vgflavor.7.name:0 "Dark Matter based Defences" #dark matter deflector
vgflavor.7.desc:0 "After years of studing Inanis, we have finally cracked how they were able to survive inside of Consequences Desire. Unknowingly, Inanis was able to channel dark matter into a defensive aura around that section of the bridge, Inanis can recreate a small copy of this when given access to dark matter. This defensive aura was what our probe detected within the black hole, but was far beyond our understanding then. \n\nWe predict with this knowledge, we should be able to combine our shield technologies with this principle to create shields generated by dark matter. These shields would likely be significantly more effective than regular shields."
vgflavor.7.a:0 "Those shields would be a great addition to our fleets."
 
vgflavor.8.name:0 "Dark Matter based Power" #dark matter power
vgflavor.8.desc:0 "It has finally been revealed how Inanis was able to transmit signals for so long inside the black hole, even without a power source the systems stayed operational. When in the presence of dark matter, Inanis radiates small amounts of power around them. \n\nThis affect from Inanis isn't substantial, but after some testing, we believe it will be possible to apply this small scale effect on a much larger scale within reactors. Using dark matter as the fuel, these reactors would be incredibly powerful and efficient when compared to even our best reactors."
vgflavor.8.a:0 "This could revolutionise our energy industry!"
 
vgflavor.9.name:0 "Dark Matter based Propulsion" # dark matter propulsion
vgflavor.9.desc:0 "Inanis has shown us a new ability, they appear to be able to manipulate gravity around an object. This allows them to be propelled without Inanis actually touching them. This ability appears to strain Inanis significantly, we did not want to push the study to far but were able to gather critical information regardless. It appears that Inanis somehow uses dark matter to propel the object, warping gravity in a localised area around the object. \n\nWe should, in theory, be able to reverse engineer this effect and possibly even create engines powered using dark matter on our ships. We predict these engines would be substantially faster than the regular engines we currently use. Inanis has agreed, albeit reluctantly, to give us more data to make this a possibility."
vgflavor.9.a:0 "Faster Ships will be a huge benefit to all our ships."