void_governor_tooltip:0 "Hailing from a time long forgotten, Inanis of the Void is trapped within a timeless prison, forced to watch the universe evolve without them. Why are they trapped? How are you going to free them from the impossible? How will you use their powers in your empire? \n\nGalaxy Setup Requirements:: A non Gestalt, non Fanatical Purifier Empire. \n\n Required DLC:: §GNone§"


