l_english:
 #anomaly 
 void_governor_category:0 "Repeating Signal"
 void_governor_category_desc:0 "Our scanners have detected a constant repeating signal from somewhere on [Root.GetName]'s surface."

#anomaly event
vg.1.name:0 "Signal Source Found"
 vg.1.desc:0 "The signal was a repeating distress call from a ship, which appears to be incredibly ancient. Early scans show that this ship is easily more than a few millenia old. This ship is an escape pod from a larger ship, we have found encrypted navigation logs for its main vessel, decrypting these will take time. A special project has been added to the situation log."
 vg.1.a:0 "A ship that ancient? Facinating."

#special project completion event
 vg.2.name:0 "Ships Location found"
 vg.2.desc:0 "The travel logs of the main vessel have been decrypted, a uncharted system was discovered using triangulation data, this has been marked in your situation log."
 vg.2.a:0 "Onwards!"

#special project name
void_governor_special_project:0 "Decrypting Navigation Logs"
void_governor_special_project_desc:0 "replacemee"
#situation log event poi name and desc
void_governor_black_hole_poi:0 "Ship's Position"
 void_governor_black_hole_desc:0 "REPLACE_ME2"

# On entering the Void Governors System event
 vg.3.name:0 "Wreckage Identified"
 vg.3.desc:0 "Upon entering the system, it is immedietly clear of what has happened to the main ship. Debris around Desires Consequence clearly shows ship remains, in addition multiple mining drone signitures have been detected activating in the system, it is adviced to bring military force before proceeding."
 vg.3.a:0 "Ok."

 void_governor_chain_title:0 "Repeating Distress Signal"
 void_governor_chain_desc:0 "We have found a escape pod from a larger ship, following its navigation logs could lead us to the main ship."


#system initializers name of star
 D:0 "Desires Consequence"

