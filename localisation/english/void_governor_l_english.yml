 #anomaly 
 void_governor_category:0 "Repeating Signal"
 void_governor_category_desc:0 "Our scanners have detected a constant repeating signal from somewhere on [Root.GetName]'s surface."

#anomaly event
vg.1.name:0 "Signal Source Found"
 vg.1.desc:0 "The signal originated from a small vessel, which appears to be incredibly ancient. Early scans show that this ship is easily thousands of years old if not significantly more. This small vessel is an escape pod from a larger ship that jettisoned when the main ship sustained heavy damage. We have found encrypted navigation logs for its main vessel. Decrypting these will take time, but should provide the location of the ship or its course. A special project has been added to the situation log."
 vg.1.a:0 "A ship this ancient? Facinating."
vg.1.fail:0 "You are a gestalt or a fanatic purifier. Inanis's event cannot start."

#special project completion event
 vg.2.name:0 "Ships Location found"
 vg.2.desc:0 "The travel logs from the main vessel have been decrypted. The last log recieved was that the main ships emergency ftl attempt had failed in a previously uncharted system. This newly discovered system has been marked in your situation log."
 vg.2.a:0 "That log doesn't bode well."

#special project name
