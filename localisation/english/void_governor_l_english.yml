void_governor_black_hole_poi:0 "Uncharted System from Navigation Logs"
 void_governor_black_hole_desc:0 "This new system will likely contain the ship or clues into the location of the main"

# On entering the Void Governors System event
 vg.3.name:0 "Wreckage Identified"
 vg.3.desc:0 "Upon entering the system, it is immedietly clear of what has happened to the main ship. Debris around both Desires Consequence and Desires End clearly shows ship remains. Most of these remains are present around Desires End, it is likely that the ship crashed there. \n\nAs we entered the system, we detected multiple hostile ship signals activating around Desires End. It appears military force must be brought before proceeding."
 vg.3.a:0 "Ok."

 void_governor_chain_title:0 "Repeating Distress Signal"
 void_governor_chain_desc:0 "We have found a escape pod from a larger ship, following its navigation logs could lead us to the main ship."


