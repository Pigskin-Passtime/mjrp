 inanis_desc:0 "Inanis of the Void, a legendary leader of the placeholder empire."
  vg.101.desc:0 "testing if this is that"

#
leader_trait_time_warper:1 "Time Warper"
leader_trait_time_warper_desc:0 "This leader has been warped by the gravitational energies of a black hole, they can alter the flow of time around and inside them, making time move faster on planets."

leader_trait_time_warper_upgraded:1 "Practiced Time Warper"
leader_trait_time_warper_upgraded_desc:0 "This leader has been warped by the gravitational energies of a black hole, they can alter the flow of time around and inside them, making time move faster on planets. After years of practise, they can use it more effectively."

#
leader_trait_time_warper_tt:0 "This trait provides any benefit and deficit that increase time on a planet would bring by 15%."

# Hiring event options
vg.101.name:0 "Inanis of the Void Introduction"
vg.101.desc:0 "§HInanis stands tall, facing the camera. After taking a moment to compose themselves, they greet you§!. \n\nI understand it is you who gave the order and authorised my extraction. I remain forever in your debt for freeing me. Without your intervention, I could have spent an eternity alone with nothing but my own thoughts for company. \n\nThe on-site team here has already informed me of what has transpired. It appears that the universe I knew has moved on without me. Your scientists were kind enough to answer all of my questions, I will now answer yours."
 vg.101.a:0 "Who are you?"
 vg.101.b:0 "Played for fools?"
 vg.101.c:0 "I am so sorry."
 vg.101.d:0 "The Ishdan empire? We have no records of this at all."
 vg.101.e:0 "Time travels faster in your presence, it even affected a black hole, how?"
 vg.101.f:0 "Would you work for us? Together we could learn more about your power."

