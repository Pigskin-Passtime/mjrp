#######sab_ralph_fired_death_events#######

sab_death_ship_1:0 "Legacy of the Shadow Titan" #Blade written#
sab_death_ship_1_desc:0 "§HA video transmission begins with a flicker, the screen initially obscured by static, reminiscent of an encrypted channel. Gradually, the static dissipates, revealing a dimly lit room draped in shadows. The ambient hum of machinery underscores the atmosphere, creating an air of secrecy. Ralph Fasmid appears§\n\n§EI trust this message reaches you in good standing. It's been years since my departure from this mortal coil, and I find it necessary to reveal a secret I took to the grave.\n\nBefore my untimely demise, I brokered a deal that transcends the boundaries of life and death. A deal that now bears fruit, a fruit of colossal proportions—the Titan-class spaceship named §GMarket Bull.§\n\n§EYes, that's right. A vessel of immense power, cloaked in shadows and awaiting your command. Its acquisition was not without sacrifice, and now, from the afterlife, I bequeath to you this symbol of retribution and dominance.\n\nThe Titan awaits, a phantom from the darkness. Use it wisely, for its potential is beyond measure. May it become the embodiment of your empire's strength, a testament to the shadows that linger even after my passing.\n\nRemember, this gift comes with a price—no benevolence is bestowed without its trials. Navigate the cosmos with caution, for power attracts envy, and shadows breed adversaries.\n\nThis is my final gift to you, a legacy forged in the clandestine depths of space.\n\nFarewell, and may the shadows guide your path.\n\nRalph Fasmid§" #Blade written#
sab_titan_give:0 "Truly he was loyal" #Blade written#

sab_death_ship_3:0 "Covert Backlash" #Blade written#
sab_death_ship_3_desc:0 "§EAttention,\n\nI trust this message reaches you amidst the chaos that's about to unfold. You may think you've won, but firing me was your gravest mistake. I am not one to be dismissed lightly.\n\nAs the gears of revenge turn, so shall the fate of your pitiful fleet. You thought you could cast me aside like a broken tool, but I am no tool. I am a weapon, and now you'll bear witness to my true capabilities.\n\nIn a few moments, your ships will feel the repercussions of your ill-advised decision. Consider it a lesson in the cost of betrayal. May the void swallow your vessels whole, as you've swallowed my loyalty.\n\nThis is not a threat; it's a promise. The shadows hide many secrets, and today, your empire shall learn that they also conceal the instruments of its downfall.\n\nWatch closely as your fleet succumbs to the consequence of your actions.\n\nRegards,\nRalph Fasmid§\n\n\n§HIt appears that the saboteur sabotaged us on his way out. To say Ralph has gone postal is an understatement.§" #Blade dialoge, EgoInvicta description#
sab_destroy_ships:0 "That's business for you"