 sab_stolen_ships_2:0 "Need a hand from a few big fellas?"
 sab_stolen_ships_2_desc:0 " I was cruising along and came across some drones that looked like someone else could put them to better use than having them working aimlessly in some long forgotten system."
 sab_perfect.2:0 "Lets put these to work"
 sab_stolen_ships_3:0 "We clipped a few of their wings"
