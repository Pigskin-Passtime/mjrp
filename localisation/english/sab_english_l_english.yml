 #######sab_building_event_chain_2.0#######
 
 sab_casino.1.a:0 "Roll them dice!"
 sab_opening_the_casino_one:0 "New Phantom Casino Grand Opening!"
 sab_opening_the_casino_one_desc:0 "Hey Boss, Phantom Casino is ready to operate on any planet you desire, Just don't keep a vacation home there..." #Blade written#
 sab_spy_buildings:0 "A NEW ENTERPRISE TO UNFOLD"
 sab_all_3_buildings:0 "Boss, I've been brainstorming a couple of intriguing ventures. One involves gathering valuable intel discreetly, while the other is an exciting opportunity to acquire some unique \"rides.\" Additionally, I've been entertaining the idea of opening a casino—a venture that could, let's say, influence the currents of power in ways that would benefit us." #Blade and EgoInvicta#
 sab_only_cafe_and_casino:0 "Boss, while the Extreme Oasis themepark is flourishing, I've been revisiting past proposals. It seems we've shelved two promising ideas: a clandestine café for acquiring scientific research and a covert casino for destabilizing entire planets. Both, as you might recall, double as ingenious spy bases." #Blade written#
 sab_only_cafe_and_theme_park:0 "Boss, the success of Phantom Casino has set the stage for even greater covert ventures. I find myself revisiting the café and themepark proposals, considering their hidden potential. Imagine, a cafe silently extracting scientific advancements or a themepark concealing a shadowy web of intrigue." #Blade written#
 sab_only_casino_and_theme_park:0 "Boss, with the restaurant thriving, I've revisited our past proposals. How about a themepark that subtly boosts our fleet size while hindering our rivals? Alternatively, we can delve into a casino venture, discreetly destabilizing the entire planet it's situated on. The choice is yours, but the potential strategic gains are immense. What shall be our next grand endeavor?" #Blade written#
 sab_cafe_only:0 "Boss, now that Phantom Casino and Extreme Oasis are in full swing, I've got one last enticing proposition on the table—an exclusive spy café. Picture a discreet haven where the art of espionage blends seamlessly with the rich aroma of my bean based caffeinated drink, offering us a unique opportunity to gather intel while adding a touch of mystery to our operations." #Blade written#
 sab_casino_only:0 "Boss, considering our recent venture into the thrilling world of the Spion Cafe and Extreme Oasis, I've got another tantalizing opportunity on the horizon - a casino that goes beyond mere profits. Picture this: a covert establishment where the subtle art of espionage intertwines with the allure of chance, offering us a unique way to shape the destiny of any planet discreetly." #Blade written#
 sab_theme_park_only:0 "Boss, it's always a pleasure to collaborate on our strategic ventures. I know we've touched upon the idea of a theme park before, but I'd like to propose it one last time. This themepark, intertwined with our existing café and casino operations, could serve as the ultimate trifecta in our shadowy endeavors. Imagine a place where extreme amusement conceals an intricately designed spy base, subtly siphoning off fleet power from the unsuspecting empire its located in. The synergy of these ventures promises not only entertainment but a continuous stream of strategic advantage. Shall we delve deeper into the possibilities of this stellar enterprise?" #Blade written#
 
