#######RalphFasmid#######

sab_ralph.01.name:0 "Ralph Fasmid"
sab_ralph.01.desc:0 "§HA fluster of folders and papers greet your ears, a long spindly fellow turns around sipping a bean based caffeine beverage. His antennas twitch and quickly a notepad appears in his hand and his other readies a pen.§ \n \n \n §EI'm Ralph Fasmid, spymaster. I look forward to finding out any secret you chase no matter how dark§"
sab_ralph.01.a:0 "How did you find us?"
sab_ralph.01.a.response:0 "You guys aren't exactly quiet signals going every which way. Even an amateur from my  planet could have pinged you guys. Don't worry I'll help you work on that and then some. You guys will be able to hear bacteria migrate by the time I'm done working on your systems."
sab_ralph.01.b:0 "How can you help us?"
sab_ralph.01.b.response:0 "Ralph Fasmid is all about service. I make a mean bean based caffeinated product and I find that really helps my customers open on that. I also have experience maintaining and repairing any sort of listening system you could think."
sab_ralph.01.c:0 "What can you tell me about your people."
sab_ralph.01.c.response:0 "We were masters of camouflage during our early years we're easily able to blend in with the environments around us. When we finally reached the stars we deployed those same tactics that worked for us back then. We found ourselves in every circle in every Empire, both large and small. A war waged from ancient rivals that seeked to end our influence after a few of our agents were caught riling up ancient rivalries amongst their people. The few of us remaining hire ourselves out."
sab_ralph.01.d:0 "Why us?"
sab_ralph.01.d.response:0 "A business enterprise like yours should always be looking for business partners. My associates and I have ways to make good decisions... §HHis eyes narrow§E great decisions. Think of the riches we would be able to share. I'd take that deal, §HHe leans in towards you§E would you take that deal?§"
sab_ralph.01.hire_custom_tooltip:0 "§YRalph Fasmid §Wjoins our company as a §HLeader.§"
sab_ralph.01.name.1:0 "Ralph Fasmid"

sab_ralph.01.e:0 "CHEATER!!"
sab_ralph.01.e.response:0 "You can't get me unless you are megacorp. now go play a megacorp or go buy it friend. Besides, nothing i do will help you unless you can place branch offices."

