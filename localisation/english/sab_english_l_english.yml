 sab_anomaly:0 "Phantom Frequency"
 sab_desc_testing_please:0 "A strange burst of Radio waves hit every satellite, too random to be anything but intelligent. You are quick to angle your satellites in such a way to track the direction of their origin. Quickly ready your ships! " #### thanks to Marthus for catching an error here for us#####
 sab_message_testing_1:0 "Phantom Frequency"
 sab_desc_testing_1:0 "Your crew tells you the planet has no signs of life and appears to have been long dead. However a scan did pick up a broadcasting signal originating from within a cave. While searching the surrounding area a device was found with only the initials RF on it."
 sab_first_event.1.a:0 "Have our crew decipher this frequency"
 sab_first_event.1.b:0 "R.F.? Probably means Radio Failed"
 sab_opening_cafe:0 "A New Enterprise to unfold"
 sab_opening_cafe_desc:0 "Boss, I got a couple of ideas to run by you. So one little side business which is great for picking up some intel on friends and foe alike. The other is a great way to grab some new rides"
 sab_buisness_ventures.1.a:0 "Let's get these bean based caffeinated beverages to the people."
 sab_buisness_ventures.1.b:0 "People need more \"fun\" in their life. Let's get the rides going."
 sab_opening_cafe_one:0 "New Spion Cafe Grand Opening"
 sab_opening_cafe_one_desc:0 "I got some staff trained up to begin running our new cafes, boss. Some of my best agen... I mean staff will be stationed across the galaxy for your use."
 sab_opening_theme_park:0 "New Extreme Oasis Grand opening!"
 sab_opening_theme_park_desc:0 "Boss, the themepark is now a beacon of excitement for all the galaxy! We even gained some \"New\" transport. §HRalph winks to you§"
 
