# Mictla_l_english_archeology_anomalies
# Pat173

l_english:
 mictla_planet_anomaly:0 "Lifeless Cities"

 mictla_planet_anomaly_desc:0 "The survey of satellite [Root.GetName] sparked intrigue: Detailed biometric readings paint a contrasting picture, revealing an absence of life in even its simplest forms despite structures hinting at sapient life. We could conduct an investigation to learn more."

 site_mictla_temple:0 "Gargantuan Structure"

 mictla_arc_events.1.name:0 "Gargantuan Structure"

 mictla_arc_events.1.desc:0 "While conducting research of the empty structures, many things have come to note for our researchers. After further scans confirm the complete lack of life. There has also been no hints of sapient life other than the structures, like lack of tools, records, or habitable spaces. Just before our researchers were about to archive this search as another oddity, One of our subsurface scans has shown a gargantuan structure just above the mantle. Much larger and complex than any structures on the surface."

 mictla_temple_intro_a:0 "We should investigate further."

 site_mictla_temple.intro:0 "Just before our [Root.Owner.GetSpeciesAdj] researchers were about to archive this search as another oddity, one of our subsurface scans has shown a gargantuan structure just above the mantle, much larger and complex than any structures on the surface. \n\nOur researchers are looking for entryways into the underground structure."

 mictla_arc_events.2.name:0 "The Descent"

 mictla_arc_events.2.desc:0 "Our subsurface exploration has unveiled what we were looking for: An entrance connecting the vast subterranean structure to the surface, the descent towards the mantle a long and labyrinthine one. Our researchers stand at the threshold, eager to uncover the secrets concealed within the depths of this revealed connection."

 mictla_arc_events.2.a:0 "Proceed Further."

 mictla_arc_events.3.name:0 "Rubble Pile"

 mictla_arc_events.3.desc:0 "At the bottom of the great descent we have encountered our answer to one of the mysteries of the surface. Tools, furniture, machinery and debris has been piled up at the bottom of the descent. Anything that was not fixed to the ground was seemingly brought here and piled. In order to access the structure ahead, we will have to move the giant pile or destroy it."

 mictla_arc_events.3.a:0 "Melt through it."

 mictla_arc_events.3.b:0 "Retrieve what seems valuable and destroy anything else"

 mictla_arc_events.3.c:0 "Carefully retrieve as many objects as we can"

 mictla_arc_events.3a.name:0 "Extended Excavation"

 mictla_arc_events.3a.desc:0 "Due to our decision to retrieve some of the objects in the pile, our clearing of the rubble will take longer."

 mictla_arc_events.3b.name:0 "Resumed Excavation"

 mictla_arc_events.3b.desc:0 "Our team has finally retrieved anything of value from the pile, all that's left now is to destroy the debris."

 mictla_arc_events.4.name:0 "Chamber Complex"

 mictla_arc_events.4.desc:0 "After clearing the pile we have reached what feels like an endless complex of chambers, mostly empty, dark rooms interconnected by tunnels and natural caves. The purpose behind urgently sealing the entrance remains unknown, but we are confident that the answers lie somewhere within this subterranean maze.""

 mictla_arc_events.4.a:0 "A long search."

 mictla_arc_events.5.name:0 "Religious Vault"

 mictla_arc_events.5.desc:0 "Throughout our extensive expedition within the chamber complex, we stumbled upon a room teeming with valuables, effigies, and rare minerals. Our researchers propose that this serves as a designated offering room with religious significance.  \n\nTowards the rear of the chamber, a sealed door stands resilient, crafted from a material surpassing the strength of any other section within this colossal structure. The nature of the offerings appears intricately tied to the mysteries concealed beyond this door."

 mictla_arc_events.5.a:0 "Work towards opening the vault."

 mictla_arc_events.6.name:0 "Archive room"

 mictla_arc_events.6.desc:0 "Having successfully unlocked the vault door, we discovered a room that appears to function as an archive. Unfortunately, any records once stored here have vanished. \n\nTwo notable elements remain intact: an empty sarcophagus of significant size, large enough to accommodate [Root.Owner.GetSpeciesNamePlural], and an inscribed text on the rear wall that awaits decryption."

 mictla_arc_events.6.a:0 "Translate the text."

 mictla_arc_events.7.name:0 "Sealed Consciousness"

 mictla_arc_events.7.desc:0 "The mural's message has been deciphered:\n\n§H"The mind holding power over death has been sealed here; we pray its power never returns to this lush paradise."§!\n\nAfter a brief discussion, our scientists concluded that to break the seal, the open sarcophagus must be occupied. [leader_scientist.GetName] is willing to lie on it if [leader_scientist.GetSheHe] fits."

 mictla_arc_events.7.a:0 "Let [leader_scientist.GetName] lie on the sarcophagus."

 mictla_arc_events.7.b:0 "Order one of the junior [Root.Owner.GetSpeciesAdj] archeologists to lie on the sarcophagus."

 mictla_arc_events.7.c:0 "This is too dangerous for anyone to attempt."

 site_mictla_whispers:0 "Flesh Planet"

 site_mictla_whispers.intro:0 "Initial scans confirm that [Root.Planet.GetName] presents a layer of unorganized organic matter in its surface, this points at a relation to Mictla. We should investigate further."

 mictla_arc_events.11.name:0 "Inexplicable Sickness"
 
 mictla_arc_events.11.desc:0 "After sending a survey team down to the planet's surface, it has been noted that some of the crew in the survey team have contracted an inexplicable illness. Their body functions have deteriorated greatly, and their minds are in a constant state of delirium. Medical diagnosis shows that no foreign agents are affecting the individuals; rather, their own cells seem to be causing the issue on their own. Further surveys of the surface will require more analysis of this peculiar illness."
 
 mictla_arc_events.12.name:0 "Organic Resonance"
 
 mictla_arc_events.12.desc:0 "Further study towards the illness has revealed its nature. Seemingly, some kind of singal originating from Wailing is directly affecting organic matter, The matter on the surface of the planet acts as an amplifier for the signal. We also observe that the signal reaches [Root.GetName], but it's faint enough to be negligible. \nTo continue the exploration of Wailing we will make use of remote-controlled machines and organic samples to detect the strength of the signal."

 mictla_arc_events.13.name:0 "Wailing Resonance"
 
 mictla_arc_events.13.desc:0 "Following the intensity of the organic signal, we have reached what seems to be its epicenter. Deep within organic matter, we discovered a deep red, extremely dense accumulation of organic material. The signal next to it is so strong that it degenerated the organic samples into malformed and unorganized matter almost instantly. Detaching this dense concentration of matter from the rest of the organic matter on the surface has quieted the signal. From a wailing to a whisper; organic matter near it no longer seems affected, and the signal has become negligible."

 mictla_arc_events.13.a:0 "Mictla must know what to do with this."

 mictla_arc_events.13.b:0 "If only Mictla was still around, we could understand how to use this."

 mictla_arc_events.14.name:0 "Wailing Resonance"
 
 mictla_arc_events.14.desc:0 "Thank you, you have acquired the Wailing Resonance. We express our gratitude greatly. We will now reach onto it, and with it, serve our purpose."
 mictla_arc_events.14.a:0 "Use it for the benefit of the [Root.Owner.GetName]"