 leader_trait_viz_raff_power_behind_the_throne:0 "Power Behind The Throne"
 viz_raff_trait_line:"§c"Ignore the rumours [Root.GetVizRaffHonorific], they're all quite baseless I assure you."§!"
 leader_trait_viz_raff_power_behind_the_throne_desc:0 "This leader serves the state loyally, empowering others and remaining a humble servant.$NEW_LINE$$NEW_LINE$$viz_raff_trait_line$"
 leader_trait_viz_raff_undessicated:0 "Undesicated"
 leader_trait_viz_raff_undessicated_desc:0 "Aeons ago, this leader had their flesh replaced with a gleaming metal body. They remain secretive about the exact process."
 leader_trait_viz_raff_truth_dweller.tooltip:0 "Listening Posts and Dark Matter Listening Posts built in system adjacent to other empires will yield a special "
 leader_trait_viz_raff_water_bringer.tooltip:0 "Enables Irrigation Network planetary decision and Orbital Canal Orbital Ring building."
 leader_trait_viz_raff_monument_builder.tooltip:0 "-0.025% Megastructure Build Cost and Megastructure Build Speed for each slave, non-free pop, or simple drone in empire."
 asset_viz_raff_listening_post:0 "Spy Satellite"
 asset_viz_raff_listening_post_desc:0 "From the neighboring Listening Post, operatives gather data on military fleet activity."
 viz_raff_arc.1.name:0 "Catastrophic Damage"
 viz_raff_arc.1.desc:0 "The vast structure on [From.Planet.GetName] has suffered the same terrible damage inflicted across the wider planet. The civilization that once lived here wiped themselves out in a nuclear war, and howling winds laced with live isotopes have scoured the surface ever since.$NEW_LINE$$NEW_LINE$As yet, no useful records have been found for analysis, leaving our archeologists digging through corroded masonry looking for clues."
 viz_raff_arc.2.name:0 "Palace Complex"
 viz_raff_arc.2.desc:0 "We have penetrated deeper into the superstructure of the complex, accessing parts of the building less badly damaged by radiation and weather. Here we've been able to confirm the building's function as a governing complex, or palace of some kind. The civilization that built it were relatively advanced, probably only a few decades away from FTL travel when they self-destructed. They also also built primitive robots, the rusting heaps of which we have found scattered about the palace."
 viz_raff_arc.3.name:0 "The Door"
 viz_raff_arc.3.desc:0 "As we explored deeper into the palace complex, we've found ever greater numbers of the primitive robots. Even those in the best condition are little more than rusting hulks, but they seemed to have been in the process of trying to seal up the palace when radiation damage overcome them. On the lowest level of the palace, we've found a still sealed door. All our efforts are now focussed on breaching it."
 viz_raff_arc.4.name:0 "The Stasis Pod"
 viz_raff_arc.4.desc:0 "On the other side of the door we found a vast chamber. Here, sealed away from the radiation and the elements, we at last found working examples of technology from the civilization that built the palace.$NEW_LINE$$NEW_LINE$The room is filled with machines, labouring with age, but still functioning enough to sustain a single stasis pod."
 viz_raff_arc.4.a:0 "Open the pod."
 viz_raff_arc.4.b:0 "Dismantle it for parts."
 viz_raff_arc.5.name:0 "Vizierch Raffar"
 NAME_Vizierch_Raffar:0 "Vizierch Raffar"
 viz_raff_arc.5.desc:0 ""\n\n§HClouds of coolant gas spill from the stasis pod as it is opened. After a long moment, a metal figure staggers out. He gleams despite the centuries spent in this place, and his eyes burn with an inquisitive fire.§!\n\n§cI had feared I would spend eternity with that casket... but I am glad to be amongst the living once more. In gratitude, I pledge myself unto your service... if you will have me.§!"
 viz_raff_catch_phrase:0 "I live to serve. How may I best aid you?"
 viz_raff_backstory_line:0 "§c"Your other advisors have suspicious minds [Root.GetVizRaffHonorific]"§!"
 viz_raff_backstory:0 "A §Ysynthetic being§! rescued from stasis. Much of his story cannot be verified.$NEW_LINE$$viz_raff_backstory_line$"
 paragon_viz_raff_joins:0 "§Y$NAME_Vizierch_Raffar$§! joins your Empire as a §HLeader§!"
 viz_raff_arc.5.a:0 "What happened to the civilization on this planet?"
 viz_raff_arc.5.a.response:0 "§cWe destroyed ourselves. Once, I had the privilege to serve this planet as its ruler. But my lands were too rich, too prosperous. I did not see the jealousy that built in the hearts of my rivals... until they launched the first missiles.§!"
 viz_raff_arc.5.b:0 "What are you?"
 viz_raff_arc.5.b.response:0 "§cMy name is Vizierch Raffar, and once I was this world's humblest servant. Back before my world was dust, I invented a process to replace mortal flesh with gleaming metal. It was a gift I shared freely with this world's people.§!"
 viz_raff_arc.5.c:0 "How did you end up in this stasis pod?"
 viz_raff_arc.5.c.response:0 "§cAt first I hoped the war could be won, and this world saved. Then, when that was not possible, I brought as many people as I could to the palace. Finally, as the radiation grew worse, we scrambled to assemble a refuge for even one person. When we finished the stasis casket... my people insisted I use it.§!"
 viz_raff_arc.5.d:0 "You are a soulless husk!"
 viz_raff_arc.5.d.response:0 "§cNot at all! Though I am a thing of metal now, once I was an organic creature, like yourselves. I still believe I possess a soul, even if I've altered it's shell.§!"
 viz_raff_arc.5.e:0 "You've removed every trace of your flesh?"
 viz_raff_arc.5.e.response:0 "§cAnd proudly! The soul is a fiction and I am no more or less the person I was for being free of the weakness of flesh.§!"
 viz_raff.1.name:0 "Upon Protocol"
 viz_raff.1.desc:0 "§c"My infinite gratitude once again for rescuing me from that haunted planet. I remain your humble servant in all things. Might I enquire, how would you like to be addressed in future?"§!"
 viz_raff.1.a:0 "As Sire."
 viz_raff.1.b:0 "As Ma'am."
 viz_raff.1.c:0 "As Empire."
 viz_raff.1.d:0 "As Supreme One."
 viz_raff.1.e:0 "As Your Holiness."
 viz_raff.1.f:0 "No title, please."
 viz_raff.1.g:0 "As Commander."
 viz_raff.2.name:0 "Upon Military Matters"
 viz_raff.2.desc:0 "§c"Greetings [Owner.GetVizRaffHonorific]. This is a matter of some delicacy, but it relates to our current war effort. I've been collating intelligence reports about enemy strongholds, as well as the state of our our forces, and I as sure you are aware, our ground forces are presently terribly outmatched. I've been pondering how best to correct this - without the loss of needless [Owner.Species.GetName] life of course.$NEW_LINE$$NEW_LINE$As I'm sure you are aware, I'm a roboticist of some minor skill. Grant me resources and I will build you an army our enemies will fear!"§!"
 viz_raff.2.a:0 "You shall have your resources."
 viz_raff_increase_power_warning:0 "§RThis will make it more difficult to oppose Vizierch Raffar in the future.§!"
 viz_raff.2.a.tooltip:0 "Spawn 8 §cHierophant Guard§! armies on [Owner.capital_scope.GetName].$viz_raff_increase_power_warning$"
 viz_raff.2.b:0 "Request denied."
 viz_raff.3.name:0 "Upon Service"
 viz_raff.3.desc:0 "[viz_raff_leader.GetName] continues to be a force within our empire. Each day, his influence grows as he brings new ideas about administration, politics, technology and power to our court. Lately, he has been petitioning again for further powers, which he promises will be rewarded by even more efficient service to us.$NEW_LINE$$NEW_LINE$§c"I wish nothing more than to help even more than I am [Owner.GetVizRaffHonorific]. Simply sign these documents and I will be on my way."§!"
 viz_raff.3.a:0 "Of course."
 viz_raff.3.a.tooltip:0 "[viz_raff_leader.GetName]'s Legendary Trait will improve. His next Leader Trait pick will be a §cVizier Trait§!.$NEW_LINE$$NEW_LINE$$viz_raff_increase_power_warning$"
 viz_raff.3.b:0 "I think not."
 viz_raff.3.b.tooltip:0 "This will have no effect."
 viz_raff.5.name:0 "Upon Rulership"
 viz_raff.5.desc:0 "§c"How time flies, does it not [viz_raff_coup_target.GetVizRaffHonorific]? Why I can hardly believe how many years it has been since I came to [viz_raff_coup_target.GetName]. In the years since then, I've come to realize that sometimes, the best way to serve is to rule. And plenty of people agree! Why, you can hear them chanting in the streets.$NEW_LINE$$NEW_LINE$Guards! Remove [viz_raff_coup_target.Ruler.GetName]."§!"
 viz_raff.5.a:0 "§cThis is for the best.§!"
 viz_raff.5.a.tooltip:0 "§cVery wise [viz_raff_coup_target.GetVizRaffHonorific].§!"
 viz_raff.5.b:0 "Guards! Seize the traitor [viz_raff_leader.GetName]."
 viz_raff_resistance_successful:0 "We will succeed in defeating [viz_raff_leader.GetName]'s coup."
 viz_raff_resistance_failed:0 "[viz_raff_leader.GetName]'s coup will succeed."
 viz_raff.6.name:0 "Coup Defeated!"
 viz_raff.6.desc:0 "The fighting has been fierce, but we have at last defeated the coup of [viz_raff_leader.GetName]. His supporters have been ousted from the capital, and we can begin the process of dismantling his power structure within our empire. [viz_raff_leader.GetName] himself however, has eluded capture, and remains at large. Initial reports suggest he fled off-world as soon as it became clear he would not succeed."
 viz_raff.7.name:0 "Coup Successful"
 viz_raff.7.desc:0 "Aided by a vast conspiracy within the government, and legions of cheering supporters on the streets, [viz_raff_leader.GetName] has swept away the old guard and seized control of the [Root.GetName] in a short, brutal coup."
 viz_raff.7.a:0 "§c"Now the real work begins."§!"
 viz_raff.8.name:0 "Incoming Transmission"
 viz_raff.8.desc:0 "[Root.Species.GetName]. You should know we have granted the individual known as [viz_raff_leader.GetName] political asylum. When we heard the things you had required of him under your service... let us simply say we had thought better of you."
 viz_raff.8.a:0 "[viz_raff_leader.GetName] is a dangerous schemer! He cannot be trusted."
 viz_raff.8.a.response:0 "He warned us exactly what kind of lies we could expect from you. For shame."
 viz_raff.9.name:0 "Upon Change"
 viz_raff.9.desc:0 "[viz_raff_leader.GetName] appears in a transmission broadcast across the whole empire. Standing on the steps of his newly constructed palace complex, he announces the next great step of his plan for [Owner.GetName].$NEW_LINE$$NEW_LINE$§c"There will be an end to hunger! To disease! To poverty! To disorder!"§!"
 viz_raff.9.a:0 "§cA great day.§!"
 viz_raff.10.name:0 "The Great Transformation"
 viz_raff.10.desc:0 "Across the empire, on every world, Ascension Forges bellow black smoke into the sky. The citizenry of [Root.GetName] walk into them (or a taken in chains), and they march out in bodies of flawless metal.$NEW_LINE$$NEW_LINE$They were promised immortality, but for most their new bodies are little more than primitive automatons, barely sophisticated enough to serve their function, let alone house independent thought. The ruling class fares better - they retain their faculties even once the Ascension Forges has stripped their flesh."
 viz_raff.10.a:0 "§cAll according to my design.§!"
 viz_raff_sit.1.name:0 "[viz_raff_leader.GetName]'s Power Grows"
 viz_raff_sit.1.desc:0 "[viz_raff_leader.GetName] has brought with him a range of new ideas about political philosophy from his homeworld. Amongst these is the role of Grand Vizier, a person who acts as a [Owner.Ruler.GetRulerTitle]'s [Owner.Species.GetSpeciesHandName] in all things. He is excited to demonstrate the potential of the position... and obviously has a candidate in mind to fill it."
 viz_raff_sit.1.a.tooltip:0 "Enable Grand Vizier Council Position."
 viz_raff_sit.2.name:0 "[viz_raff_leader.GetName]'s Power Grows"
 viz_raff_sit.2.desc:0 "[viz_raff_leader.GetName] has always been a singular figure in our empire, and one whose natural charisma is bolstered by his deep network of patronage he has built in the years since he arrived here. This growing body of support has found expression in a new political faction. The call for the establishment of a materialistic, authoritarian society... headed by [viz_raff_leader.GetName] himself, of course."
 viz_raff_sit.2.a.tooltip:0 "Enables Faction: §c$pft_viz_raff_faction$§!"
 viz_raff_sit.3.name:0 "[viz_raff_leader.GetName]'s Power Grows"
 viz_raff_sit.3.desc:0 "As [viz_raff_leader.GetName]'s resources have grown, he has acquired laboratory facilities across our empire. Here he and his servants can work on vital projects in absolute secrecy. And, as [viz_raff_leader.GetName] is quick to point out, merely the presence of such a facility in a city lowers its crime rate."
 viz_raff_sit.3.a:0 "How remarkable."
 viz_raff_sit.a.tooltip:0 "Enable Ascension Forges planetary building."
