 d_viz_raff_irrigation_network:0 "Irrigation Network"
 d_viz_raff_irrigation_network_desc:0 "A continent-spanning system of channels and aqueducts makes water available for even the most remote farmland."
 sm_ring_viz_raff_orbital_canals:0 "Orbital Canals"
 sm_ring_viz_raff_orbital_canals_desc:0 "Titanic gravity engines stabilize vast ionic corridors from surface to orbit, bringing the cost of transport and transit to almost nothing."
 leader_trait_viz_raff_water_bringer:0 "Bringer of the Waters of Line"
