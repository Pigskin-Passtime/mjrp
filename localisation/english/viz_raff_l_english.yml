 councilor_viz_raff_grand_vizier:0 "Grand Vizier"
 viz_raz_position_line:0 "§c"One lives to serve [Root.GetVizRaffHonorific]"§!"
 councilor_viz_raff_grand_vizier_desc:0 "The $TITLE$ serves an administrative role, allowing others to do their job more efficiently.$NEW_LINE$$NEW_LINE$$viz_raz_position_line$"
