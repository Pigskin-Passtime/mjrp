 leader_trait_viz_raff_staff_bearer_desc:0 "He who wields the Sacred Staff! Look upon its mesmerizing gazes and be filled with despair and wonder!"
 leader_trait_viz_raff_truth_dweller:0 "Dweller In Truth"
 leader_trait_viz_raff_truth_dweller_desc:0 "Destroyer of Falsehoods, Slayer of Untruths! He dwells in truth and sees all!"
 leader_trait_viz_raff_seal_keeper:0 "Keeper of the Seal of State"
 leader_trait_viz_raff_seal_keeper_desc:0 "Keeper of the Seal - let no [Root.GetSpeciesName] go without his say so, let him sit at the heart of all things."
 leader_trait_viz_raff_monument_builder:0 "Raiser of Monuments"
 leader_trait_viz_raff_monument_builder_desc:0 "He has raised the monuments to the vault of heaven and broke open the double doors of the horizon. They shall last unto eternity."
 leader_trait_viz_raff_constellation_hammer:0 "Hammer of the Constellations"
 leader_trait_viz_raff_constellation_hammer_desc:0 "The stars themselves tremble at him, for where he commands the fleets, the sun is eclipsed."
 leader_trait_viz_raff_divine_oracle:0 "Oracle of Divine Wisdom"
 leader_trait_viz_raff_divine_oracle_desc:0 "Hark! Each word is wisdom unto itself, and by repeating his words the priests come unto wisdom."
