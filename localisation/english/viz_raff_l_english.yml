 viz_raff_palace_stasis_site:0 "Blasted Heath"
 viz_raff_palace_stasis_site_desc:0 "[From.Planet.GetName] was once home to intelligent life, but no longer. The aliens that called this place home fought a war with nuclear weapons so fierce it has all but erased the biosphere. Their civilization on [From.Planet.GetName] seems to have been centered around a singular structure located in the ruins of their largest city."
 viz_raff_hierophant_guard:0 "Hierophant Guard"
 building_viz_raff_ascension_forge:0 "Ascension Forge"
 viz_raff_building_line:0 "§c"Best not to dwell on it [Root.GetVizRaffHonorific]§!""
 building_viz_raff_ascension_forge_desc:0 "A secretive laboratory built by Vizierch Raffar. A steady stream of robots emerge.$NEW_LINE$$NEW_LINE$$viz_raff_building_line$"
 building_viz_raff_ascension_forge_desc_food:0 "A secretive laboratory built by Vizierch Raffar. A steady supply of meat emerges.$NEW_LINE$$NEW_LINE$$viz_raff_building_line$"
 job_ascension_engineer_desc:0 "$job_ascension_engineer_plural$ labour in the secret laboratories of the Vizierch."
 decision_viz_raff_irrigation_network:0 "Build Irrigation Network"
