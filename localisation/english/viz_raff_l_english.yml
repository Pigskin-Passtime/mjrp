l_english:
 viz_raff_palace_stasis_site:0 "Blasted Heath"
 viz_raff_palace_stasis_site_desc:0 "[From.Planet.GetName] was once home to intelligent life, but no longer. The aliens that called this place home fought a war with nuclear weapons so fierce it has all but erased the biosphere. Their civilization on [From.Planet.GetName] seems to have been centered around a single unique structure located in the ruins of their largest city."
 viz_raff_hierophant_guard:0 "Hierophant Guard"
 viz_raff_hierophant_guard_desc:0 "Frighteningly tough, the imperious metal soldiers of the Hierophant Guard make quick work of the enemy (and of allies who stand in flensing range)."
 building_viz_raff_ascension_forge:0 "Ascension Forge"
 viz_raff_building_line:0 "§G"Best not to dwell on it [Owner.GetVizRaffHonorific]"§!"
 building_viz_raff_ascension_forge_desc:0 "A secretive laboratory built by Vizierch Raffar. A steady stream of robots emerge.$NEW_LINE$$NEW_LINE$$viz_raff_building_line$"
 building_viz_raff_ascension_forge_desc_food:0 "A secretive laboratory built by Vizierch Raffar. A steady supply of meat emerges.$NEW_LINE$$NEW_LINE$$viz_raff_building_line$"
 building_viz_raff_ascension_forge_desc_minerals:0 "A secretive laboratory built by Vizierch Raffar. A steady supply of minerals emerges.$NEW_LINE$$NEW_LINE$$viz_raff_building_line$"
 job_ascension_engineer_desc:0 "$job_ascension_engineer_plural$ labour in the secret laboratories of the Vizierch."
 decision_viz_raff_irrigation_network:0 "Build Irrigation Network"
 decision_viz_raff_irrigation_network_desc:0 "Water is brought unto the desert - thus does it spring with new life!"
 d_viz_raff_irrigation_network:0 "Irrigation Network"
 d_viz_raff_irrigation_network_desc:0 "A continent-spanning system of channels and aqueducts makes water available for even the most remote farmland."
 sm_ring_viz_raff_orbital_canals:0 "Orbital Canals"
 sm_ring_viz_raff_orbital_canals_desc:0 "Titanic gravity engines stabilize vast ionic corridors from surface to orbit, bringing the cost of transport and transit down to almost nothing."
 leader_trait_viz_raff_water_bringer:0 "Bringer of the Waters of Life"
 leader_trait_viz_raff_water_bringer_desc:0 "§lHe who brings water unto the dry places - wherever there is water he brings life.§!$NEW_LINE$This leader is highly accomplished in the field of aqua-engineering, particularly its application to improving planets."
 councilor_viz_raff_grand_vizier:0 "Grand Vizier"
 viz_raz_position_line:0 "§G"One lives to serve [Owner.GetVizRaffHonorific]"§!"
 councilor_viz_raff_grand_vizier_desc:0 "The $TITLE$ serves an administrative role, allowing others to do their job more efficiently.$NEW_LINE$$NEW_LINE$$viz_raz_position_line$"
 councilor_viz_raff_grand_vizier_unlock_title:0 "§HCouncil Position from [viz_raff_leader.GetName]§!"
 opinion_viz_raff_lies:0 "Believed Raffar's Lies"
 pft_viz_raff:0 "Vizierch Faction"
 pft_viz_raff_desc:0 "This faction are a cult of personality organized around a single leader."
 VIZ_RAFF_FACTION_RULER_DEMAND:0 "§GVizierch Raffar§! is Ruler"
 VIZ_RAFF_FACTION_NOT_RULER_DEMAND:0 "§GVizierch Raffar§! is not Ruler"
 VIZ_RAFF_FACTION_RULER_DEMAND_DESC:0 "Having §GVizierch Raffar§! be Ruler pleases the [Root.GetName]."
 VIZ_RAFF_FACTION_POWER_DEMAND:0 "§GVizierch Raffar§! is $councilor_viz_raff_grand_vizier$"
 VIZ_RAFF_FACTION_NOT_POWER_DEMAND:0 "§GVizierch Raffar§! is not $councilor_viz_raff_grand_vizier$"
 VIZ_RAFF_FACTION_POWER_DEMAND_DESC:0 "Having §GVizierch Raffar§! be $councilor_viz_raff_grand_vizier$ pleases the [Root.GetName]."
 mod_pop_faction_viz_raff_attraction_mult:0 "$SOTV$ Faction Attraction"
 job_ascension_engineer:0 "Ascension Engineer"
 job_ascension_engineer_plural:0 "Ascension Engineers"
 mod_job_ascension_engineer_add:0 "$job_ascension_engineer$ Jobs"
 leader_trait_viz_raff_staff_bearer:0 "Bearer of the Sacred Staff"
 leader_trait_viz_raff_staff_bearer_desc:0 "§lHe who wields the Sacred Staff! Look upon its mesmerizing gazes and be filled with despair and wonder!§!$NEW_LINE$This leader wields a mesmerizing staff, an ancient relic that amplifies its wielder's charisma."
 leader_trait_viz_raff_truth_dweller:0 "Dweller In Truth"
 leader_trait_viz_raff_truth_dweller_desc:0 "§lDestroyer of Falsehoods, Slayer of Untruths! He dwells in truth and sees all!§!$NEW_LINE$This leader is an expert in espionage, and excels in pioneering new ways to discover our enemies' secrets."
 leader_trait_viz_raff_seal_keeper:0 "Keeper of the Keys"
 leader_trait_viz_raff_seal_keeper_desc:0 "§lLet no message go without his say so, let him sit at the heart of all things.§!$NEW_LINE$This leader has taken special interest in the security of our internal communications, and is a master of cryptographic technologies."
 leader_trait_viz_raff_monument_builder:0 "Raiser of Monuments"
 leader_trait_viz_raff_monument_builder_desc:0 "§lHe has raised the monuments to the vault of heaven and broke open the double doors of the horizon. They shall last unto eternity.§!$NEW_LINE$This leader is a master of project organization, and the application of forced labour to megastructure-scale problems."
 leader_trait_viz_raff_constellation_hammer:0 "Hammer of the Constellations"
 leader_trait_viz_raff_constellation_hammer_desc:0 "§lThe stars themselves tremble at him, for where he commands the fleets, the sun is eclipsed.§!$NEW_LINE$This leader is focused on the largest ships and weapons, and spares no expense in outfitting them lavishly."
 leader_trait_viz_raff_divine_oracle:0 "Oracle of Divine Wisdom"
 leader_trait_viz_raff_divine_oracle_desc:0 "§lHark! Each word is wisdom unto itself, and by repeating his words the priests come unto wisdom.§!$NEW_LINE$With a steady stream of proclamations and revelations, this leader guides the priesthood to uncover deeper truths."
 VIZ_RAFF_SIRE:0 "Sire"
 VIZ_RAFF_MAAM:0 "Ma'am"
 VIZ_RAFF_EMPIRE:0 "Empire"
 VIZ_RAFF_SUPREME_ONE:0 "Supreme One"
 VIZ_RAFF_HOLINESS:0 "Your Holiness"
 VIZ_RAFF_NO_TITLE:0 "O' Titleless One"
 VIZ_RAFF_COMMANDER:0 "Commander"
 VIZ_RAFF_GENERIC:0 "Great One"
 situation_viz_raff_accumulating_power:0 "Raffar Accumulates Power"
 situation_viz_raff_accumulating_power_type:0 "Political Intrigue"
 situation_viz_raff_accumulating_power_desc:0 "Ever since he arrived on [owner.capital_scope.GetName], [viz_raff_leader.GetName] has been rapidly integrating themselves with our political establishment - and acquiring power for themselves...$NEW_LINE$$NEW_LINE$$viz_raff_trait_line$"
 situation_viz_raff_accumulating_power_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_little_control$"
 situation_viz_raff_accumulating_power_mod_is_ruler:0 "[viz_raff_leader.GetName] is Ruler"
 situation_viz_raff_accumulating_power_mod_is_vizier:0 "[viz_raff_leader.GetName] is $councilor_viz_raff_grand_vizier$"
 situation_viz_raff_accumulating_power_mod_is_has_buildings:0 "Ascension Forges Built"
 VIZ_RAFF_GREAT_TRANSFORMATION:0 "The Great Transformation"
 VIZ_RAFF_GREAT_TRANSFORMATION_TITLE:0 "The Great Transformation"
 VIZ_RAFF_GREAT_TRANSFORMATION_DESC:0 "Vizierch Raffar has been preparing a great project for our people in utmost secrecy. Having perfected the ascension process he underwent millennia ago, he is now prepared to offer it to all our citizens.\n\nIn fact, he insists.\n\nAll our pops will be upgraded to synthetic lifeforms."
 leader_trait_viz_raff_power_behind_the_throne:0 "Power Behind The Throne"
 viz_raff_trait_line:"§G"Ignore these rumours [Owner.GetVizRaffHonorific], they're all quite baseless I assure you."§!"
 viz_raff_trait_line_2:"§G"Ignore any rumours to the contrary [Root.Owner.GetVizRaffHonorific], they're all quite baseless I assure you."§!"
 leader_trait_viz_raff_power_behind_the_throne_desc:0 "This leader serves the state loyally, empowering others and remaining a humble servant.$NEW_LINE$$NEW_LINE$$viz_raff_trait_line_2$"
 leader_trait_viz_raff_undessicated:0 "Undesicated"
 leader_trait_viz_raff_undessicated_desc:0 "Aeons ago, this leader had their flesh replaced with a gleaming metal body. They remain secretive about the exact process."
 leader_trait_viz_raff_truth_dweller.tooltip:0 "$t$§YListening Posts§! and §YDark Matter Listening Posts§! built in systems adjacent to other empires will yield an §YAsset§!."
 leader_trait_viz_raff_water_bringer.tooltip:0 "$t$Enables §YIrrigation Network§! planetary decision and §YOrbital Canal§! Orbital Ring building."
 leader_trait_viz_raff_monument_builder.tooltip:0 "$t$Building a Megastructure will trigger a §Y$viz_raff.14.name$§! event."
 asset_viz_raff_listening_post:0 "Spy Satellite"
 asset_viz_raff_listening_post_desc:0 "From the neighboring Listening Post, operatives gather data on military fleet activity."
 viz_raff_arc.1.name:0 "Catastrophic Damage"
 viz_raff_arc.1.desc:0 "The vast structure on [From.Planet.GetName] has suffered the same terrible damage inflicted across the wider planet. The civilization that once lived here wiped themselves out in a nuclear war, and howling winds laced with live isotopes have scoured the surface ever since.$NEW_LINE$$NEW_LINE$As yet, no useful records have survived to analyze, leaving our archeologists digging through corroded masonry looking for clues."
 viz_raff_arc.2.name:0 "Palace Complex"
 viz_raff_arc.2.desc:0 "We have penetrated deeper into the superstructure of the complex, accessing parts of the building less badly damaged by radiation and weather. Here we've been able to confirm the building's function as a governing complex: a palace of some kind. The civilization that built it were relatively advanced, probably only a few decades away from FTL travel when they self-destructed. Though nothing organic has survived, we have found the remains of primitive robots, the rusting hulks of which are scattered about the palace."
 viz_raff_arc.3.name:0 "The Door"
 viz_raff_arc.3.desc:0 "As we explored deeper into the palace complex, we've found ever greater numbers of the primitive robots. Even those in the best condition are little more than hollow shells of metal, but they seemed to have been in the process of trying to seal up the palace when radiation damage overcame them. On the lowest level of the palace, we've found a fortified door with it's seals intact. All our efforts are now focused on breaching it."
 viz_raff_arc.4.name:0 "The Stasis Pod"
 viz_raff_arc.4.desc:0 "On the other side of the door we found a vast chamber. Here, sealed away from the radiation and the elements, we at last found working examples of technology from the civilization that built the palace.$NEW_LINE$$NEW_LINE$The room is filled with dusty machines, labouring with age, but still functioning enough to sustain a single stasis pod."
 viz_raff_arc.4.a:0 "Open the pod."
 viz_raff_arc.4.b:0 "Dismantle it for parts."
 viz_raff_arc.5.name:0 "Vizierch Raffar"
 NAME_Vizierch_Raffar:0 "Vizierch Raffar"
 viz_raff_arc.5.desc:0 "§HClouds of coolant gas spill from the stasis pod as it is opened. After a long moment, a metal figure staggers out. He gleams despite the centuries spent in this place, his eyes burn with something unknowable.§!\n\n§G"I had feared I would spend eternity within that casket... but I am glad to be amongst the living once more. In gratitude, I pledge myself unto your service... if you will have me."§!"
 viz_raff_catch_phrase:0 "I live to serve. How may I best aid you?"
 viz_raff_backstory_line:0 "§G"Your other advisors have suspicious minds [Owner.GetVizRaffHonorific]"§!"
 viz_raff_backstory:0 "A §Ysyntheic being§! rescued from stasis. Much of his story cannot be verified.$NEW_LINE$$viz_raff_backstory_line$"
 paragon_viz_raff_joins:0 "§Y$NAME_Vizierch_Raffar$§! joins your Empire as a §HLeader§!"
 viz_raff_arc.5.a:0 "What happened to the civilization on this planet?"
 viz_raff_arc.5.a.response:0 "§GWe destroyed ourselves. Once, I had the privilege to serve this planet as its ruler. But my lands were too rich, too prosperous. I did not see the jealousy that built in the hearts of my rivals... until they launched the first missiles.§!"
 viz_raff_arc.5.b:0 "What are you?"
 viz_raff_arc.5.b.response:0 "§GMy name is Vizierch Raffar, and once I was this world's humblest servant. Back before my world was dust, I invented a process to replace mortal flesh with gleaming metal. It was a gift I shared freely with this world's people.§!"
 viz_raff_arc.5.c:0 "How did you end up in this stasis pod?"
 viz_raff_arc.5.c.response:0 "§GAt first I hoped the war could be won, and this world saved. Then, when that was not possible, I brought as many people as I could to the palace. Finally, as the radiation grew worse, we scrambled to assemble a refuge for even one person. When we finished the stasis casket... my people insisted I use it.§!"
 viz_raff_arc.5.d:0 "You are a soulless husk!"
 viz_raff_arc.5.d.response:0 "§GNot at all! Though I am a thing of metal now, once I was an organic creature, like yourselves. I still believe I possess a soul, even if I've altered it's shell.§!"
 viz_raff_arc.5.e:0 "You've removed every trace of your flesh?"
 viz_raff_arc.5.e.response:0 "§GAnd proudly! The soul is a fiction and I am no more or less the person I was for being free of the weakness of flesh.§!"
 viz_raff.1.name:0 "Upon Protocol"
 viz_raff.1.desc:0 "§G"My infinite gratitude once again for rescuing me from that haunted planet. I remain your humble servant in all things. Might I enquire, how would you like to be addressed in future?"§!"
 viz_raff.1.a:0 "As Sire."
 viz_raff.1.b:0 "As Ma'am."
 viz_raff.1.c:0 "As Empire."
 viz_raff.1.d:0 "As Supreme One."
 viz_raff.1.e:0 "As Your Holiness."
 viz_raff.1.f:0 "No title, please."
 viz_raff.1.g:0 "As Commander."
 viz_raff.2.name:0 "Upon Military Matters"
 viz_raff.2.desc:0 "§G"Greetings [Owner.GetVizRaffHonorific]. This is a matter of some delicacy, but it relates to our current war effort. I've been collating intelligence reports about enemy strongholds, as well as the state of our our own forces. As I am sure you are aware, our ground forces are presently terribly outmatched. I've been pondering how best to correct this - without the loss of needless [Owner.Species.GetName] life of course.$NEW_LINE$$NEW_LINE$I am a roboticist of some minor skill - grant me resources and I will build you an army our enemies will fear!"§!"
 viz_raff.2.a:0 "You shall have your resources."
 viz_raff_increase_power_warning:0 "§RThis will make it more difficult to oppose Vizierch Raffar in the future.§!"
 viz_raff.2.a.tooltip:0 "Spawn 8 §YHierophant Guard§! armies on [Owner.capital_scope.GetName].$viz_raff_increase_power_warning$"
 viz_raff.2.b:0 "Request denied."
 viz_raff.3.name:0 "Upon Service"
 viz_raff.3.desc:0 "[viz_raff_leader.GetName] continues to be a force within our empire. Each day, his influence grows as he brings new ideas about administration, politics, technology and power to our court. Lately, he has been petitioning again for further powers, which he promises will be rewarded by even more efficient service to us.$NEW_LINE$$NEW_LINE$§G"I wish nothing more than to help even more than I am [Owner.GetVizRaffHonorific]. Simply sign these documents - no need to read them - and I will be on my way."§!"
 viz_raff.3.a:0 "Of course."
 viz_raff.3.a.tooltip:0 "[viz_raff_leader.GetName]'s §lLegendary Trait§! will improve. He will gain a random §GVizier Trait§!.$NEW_LINE$$NEW_LINE$$viz_raff_increase_power_warning$"
 viz_raff.3.b:0 "I think not."
 viz_raff.3.b.tooltip:0 "This will have no effect."
 viz_raff.5.name:0 "Upon Rulership"
 viz_raff.5.desc:0 "§G"How time flies, does it not [viz_raff_coup_target.GetVizRaffHonorific]? Why I can hardly believe how many years it has been since I came to the [viz_raff_coup_target.GetName]. In the years since then, I've come to realize that sometimes, the best way to serve is to rule. And plenty of people agree! Why, you can hear them chanting in the streets.$NEW_LINE$$NEW_LINE$I've prepared this letter of resignation for you [viz_raff_coup_target.GetVizRaffHonorific]. I think it would be best if you spent some time with your family. While you can."§!"
 viz_raff.5.a:0 "§GThis is for the best.§!"
 viz_raff.5.a.tooltip:0 "§GVery wise [viz_raff_coup_target.GetVizRaffHonorific].§!"
 viz_raff.5.b:0 "Guards! Seize the traitor [viz_raff_leader.GetName]."
 viz_raff_resistance_successful:0 "success in defeating [viz_raff_leader.GetName]'s coup."
 viz_raff_resistance_failed:0 "[viz_raff_leader.GetName]'s coup succeeding."
 viz_raff.6.name:0 "Coup Defeated!"
 viz_raff.6.desc:0 "The fighting has been fierce, but we have at last defeated the coup of [viz_raff_leader.GetName]. His supporters have been ousted from the capital, and we can begin the process of dismantling his power structure within our empire. [viz_raff_leader.GetName] himself however, has eluded capture, and remains at large. Initial reports suggest he fled off-world as soon as it became clear he would not succeed."
 viz_raff.7.name:0 "Coup Successful"
 viz_raff.7.desc:0 "Aided by a vast conspiracy within the government, and legions of cheering supporters on the streets, [viz_raff_leader.GetName] has swept away the old guard and seized control of the [Root.GetName] in a short, brutal coup."
 viz_raff.7.a:0 "§G"Now the real work begins."§!"
 viz_raff.8.name:0 "Incoming Transmission"
 viz_raff.8.desc:0 "[Root.Species.GetName]. You should know we have granted the individual known as Vizierch Raffar political asylum. When we heard the things you had required of him under your service... let us simply say we had thought better of you."
 viz_raff.8.a:0 "Vizierch Raffar is a dangerous schemer! He cannot be trusted."
 viz_raff.8.a.response:0 "He warned us exactly what kind of lies we could expect from you. For shame."
 viz_raff.9.name:0 "Upon Change"
 viz_raff.9.desc:0 "[viz_raff_leader.GetName] appears in a transmission broadcast across the whole empire. Standing on the steps of his newly constructed palace complex, he announces the next great step of his plan for [Owner.GetName].$NEW_LINE$$NEW_LINE$§G"There will be an end to hunger! To disease! To poverty! To disorder!"§!"
 viz_raff.9.a:0 "§GA great day.§!"
 viz_raff.10.name:0 "The Great Transformation"
 viz_raff.10.desc:0 "Across the empire, on every world, Ascension Forges bellow black smoke into the sky. The citizenry of the [Root.GetName] walk into them (or are taken in chains), and they march out in bodies of flawless metal.$NEW_LINE$$NEW_LINE$They were promised immortality, but for most their new bodies are little more than primitive automatons. Barely sophisticated enough to serve their function, let alone house independent thought. The ruling class fares better - they retain their faculties even once the Ascension Forges have stripped their flesh."
 viz_raff.10.a:0 "§GAll according to my design.§!"
 viz_raff_sit.1.name:0 "[viz_raff_leader.GetName]'s Power Grows"
 viz_raff_sit.1.desc:0 "[viz_raff_leader.GetName] has brought with him a range of new ideas about political philosophy from his homeworld. Amongst these is the role of §GGrand Vizier§!, a person who acts as a [Owner.Ruler.GetRulerTitle]'s [Owner.GetSpeciesHandName] in all things. He is excited to demonstrate the potential of the position... and obviously has a candidate in mind to fill it."
 viz_raff_sit.1.a.tooltip:0 "Enable §GGrand Vizier§! Council Position."
 viz_raff_sit.2.name:0 "[viz_raff_leader.GetName]'s Power Grows"
 viz_raff_sit.2.desc:0 "[viz_raff_leader.GetName] has always been a singular figure in our empire, and one whose natural charisma is bolstered by his deep network of patronage he has built in the years since he arrived here. This growing body of support has found expression in a new political faction. The call for the establishment of a materialistic, authoritarian society... headed by [viz_raff_leader.GetName] himself, of course."
 viz_raff_sit.2.a.tooltip:0 "Enables Faction: §G$pft_viz_raff$§!"
 viz_raff_sit.3.name:0 "[viz_raff_leader.GetName]'s Power Grows"
 viz_raff_sit.3.desc:0 "As [viz_raff_leader.GetName]'s resources have grown, he has acquired laboratory facilities across our empire. Here he and his servants can work on vital projects in absolute secrecy.\n\n§G"These facilities allow me to perfect my augmentation techniques on willing volunteers. Well, willing enough. You wouldn't want to stand in the way of progress would you [Owner.GetVizRaffHonorific]?"§!"
 viz_raff_sit.3.a:0 "How remarkable."
 viz_raff_sit.3.b:0 "How concerning."
 viz_raff_sit.3.a.tooltip:0 "Enable §YAscension Forges§! planetary building."
 job_ascension_engineer_effect_desc:0 "£job_ascension_engineer£ $job_ascension_engineer_plural$ reduce £crime£ §YCrime§! and £mod_pop_growth_speed£ §Y$MOD_POP_GROWTH_SPEED$§!, and assemble new £pop£ §YRobot Pops§!"
 job_ascension_engineer_food_effect_desc:0 "£job_ascension_engineer£ $job_ascension_engineer_plural$ reduce £crime£ §YCrime§! and £mod_pop_growth_speed£ §Y$MOD_POP_GROWTH_SPEED$§!, and produce $r_food$."
 job_ascension_engineer_minerals_effect_desc:0 "£job_ascension_engineer£ $job_ascension_engineer_plural$ reduce £crime£ §YCrime§! and £mod_pop_growth_speed£ §Y$MOD_POP_GROWTH_SPEED$§!, and produce $r_minerals$."
 viz_raff_icon.is_authoritarian:0 "Our authoritarian ethic enables us to take this course of action."
 viz_raff_icon.is_spiritualist:0 "Our spiritualist ethic enables us to take this course of action."
 viz_raff_icon.is_egalitarian:0 "Our egalitarian ethic enables us to take this course of action."
 viz_raff_icon.is_militarist:0 "Our militarist ethic enables us to take this course of action."
 mod_planet_priests_engineering_research_produces_add:0 "£engineering£ $engineering_research$ from £job_priest£ [GetPriestPlural]"
 mod_planet_priests_physics_research_produces_add:0 "£physics£ $physics_research$ from £job_priest£ [GetPriestPlural]"
 mod_planet_priests_society_research_produces_add:0 "£society£ $society_research$ from £job_priest£ [GetPriestPlural]"
 mod_planet_priests_consumer_goods_upkeep_mult:0 "£job_priest£ Priest £consumer_goods£ Consumer Goods Upkeep"
 leader_trait_viz_raff_mysterious_illness:0 "Mysterious Illness"
 leader_trait_viz_raff_mysterious_illness_desc:0 "This leader has become suddenly and inexplicably seriously ill, preventing them from carrying out their duties on the Council.$NEW_LINE$$NEW_LINE$§G"How terribly unfortunate [Owner.GetVizRaffHonorific]. I do wish them well."§!"
 leader_trait_viz_raff_mysterious_illness_robot:0 "Blue Screen of Doom"
 leader_trait_viz_raff_mysterious_illness_robot_desc:0 "This leader has become suddenly and inexplicably struck with malfunction, preventing them from carrying out their duties on the Council.$NEW_LINE$$NEW_LINE$§G"How terribly unfortunate [Owner.GetVizRaffHonorific]. I do wish them well."§!"
 policy_viz_raff_master_of_ceremonies:0 "Ceremonial Outlook"
 policy_viz_raff_master_of_ceremonies_desc:0 "We can choose which ceremonies and rituals to observe.\n"
 leader_trait_viz_raff_master_of_ceremonies:0 "Master of Ceremonies"
 leader_trait_viz_raff_master_of_ceremonies_desc:0 "§lWhen the sun rises! When the sun sets! When it crosses the sky in flaming chariot!§!$NEW_LINE$This leader is in charge of an elaborate web of rituals, ceremonies and observances."
 viz_raff_ceremonies_inauguration_name:0 "Rituals of Inauguration"
 viz_raff_inauguration:0 "Rituals of Inauguration"
 viz_raff_inauguration_desc:0 "Our rituals will focus on celebrating new beginnings.\n\n$t$On Completing Building:\n$tt$Gain 5 £unity£§Y$unity$§! \n$t$Per 20 Pops Grown:\n$tt$Gain 1 £unity£§Y$unity$§!\n$t$On Completing Colony:\n$tt$Gain 500 £unity£§Y$unity$§!"
 viz_raff_ceremonies_remembrance_name:0 "Rituals of Remembrance"
 viz_raff_remembrance:0 "Rituals of Remembrance"
 viz_raff_remembrance_desc:0 "Our rituals will focus on remembering things departed.\n\n$t$On Ship Lost:\n$tt$Gain 1 £unity£§Y$unity$§! \n$t$On Leader Dies:\n$tt$Gain 50 £unity£§Y$unity$§!\n$t$On Activating Relic:\n$tt$Gain 500 £unity£§Y$unity$§!"
 viz_raff_ceremonies_advancement_name:0 "Rituals of Advancement"
 viz_raff_advancement:0 "Rituals of Advancement"
 viz_raff_advancement_desc:0 "Our rituals will focus on glorifying our progress.\n\n$t$On Technology Gained:\n$tt$Gain 50 £unity£§Y$unity$§! \n$t$On Leader Level Up:\n$tt$Gain 50 £unity£§Y$unity$§!\n$t$On Agenda Completed:\n$tt$Gain 50 £unity£§Y$unity$§!"
 leader_trait_viz_raff_supreme_hierophant:0 "Hierophant of the Reliquary"
