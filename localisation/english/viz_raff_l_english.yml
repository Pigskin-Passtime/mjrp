 leader_trait_viz_raff_mysterious_illness:0 "Mysterious Illness"
 leader_trait_viz_raff_mysterious_illness_desc:0 "This leader has become suddenly and inexplicably seriously ill, preventing them from carrying out their duties on the Council.$NEW_LINE$$NEW_LINE$§c"How terribly unfortunate [GetVizRaffHonorific]. I do wish them well."§!"
 leader_trait_viz_raff_mysterious_illness_robot:0 "Blue Screen of Doom"
 leader_trait_viz_raff_mysterious_illness_robot_desc:0 "This leader has become suddenly and inexplicably struck with malfunction, preventing them from carrying out their duties on the Council.$NEW_LINE$$NEW_LINE$§c"How terribly unfortunate [GetVizRaffHonorific]. I do wish them well."§!"