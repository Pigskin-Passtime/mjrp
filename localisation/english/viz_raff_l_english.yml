 situation_viz_raff_accumulating_power:0 "Raffar Accumulates Power"
 situation_viz_raff_accumulating_power_type:0 "Political Intrigue"
 situation_viz_raff_accumulating_power_desc:0 "Ever since he arrived on [Owner.capital_scope.GetName], [viz_raff_leader.GetName] has been rapidly integrating themselves with our political establishment... and acquiring power for themselves..$NEW_LINE$$NEW_LINE$$viz_raff_trait_line$"
