 spawn_EVJ24:0 "Spawn The Jailer"
 EVJ24_tooltip:0 "The Jailer stands vigilant over the last vestige of his once noble people; an enormous prison detaining the god which destroyed them. Help him keep this ancient evil locked away and he will lend his skills and experience as a vigilant commander and penal colony governor.\n\nJust know that gods can't be detained forever..."
 
