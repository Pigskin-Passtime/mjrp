 EVJ24_middle4_digsite: "Genetic Match"
 EVJ24_middle4_digsite_desc: "A minor archaeological finding on this world contained genetic fragments that were found to match parts of  [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s genome. Could this lead us to discovering the mysterious origin of [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]?"
 
 EVJ24_middle4_digsite_nakahi_pilgrimage: "The Nakahi Exodus"
 EVJ24_middle4_digsite_nakahi_pilgrimage_desc: "We have made remarkable archaeological discoveries of [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s species, the Nakahi, who once long ago faced a catastrophe. Some evidence indicates the survivors fled to a distant world inhabited by a pre-FTL civilisation. Do the Nakahi remain on this world today?"
 
 EVJ24_beginning_mau_tona: "A Star Prison"
 EVJ24_beginning_mau_tona_desc: "This ancient megastructure, apparently a colossal prison, promises exciting discoveries within it's vast halls. We have lost contact with only inhabitant and warden of this station, perhaps they remain somewhere within?"
 
 
