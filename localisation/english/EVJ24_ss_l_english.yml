 EVJ24_intro_jailer_chain_title:1 "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]"
 EVJ24_intro_jailer_chain_desc:0 "A individual of indeterminent origin calling itself [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name], the warden of a colossal prison, is asking for our assitance."
 
 EVJ24_middle1_jailer_chain_title: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s Conspiracy"
 EVJ24_middle1_jailer_chain_desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has gone missing, and so has a large quantity of technology from Mau Tona station. Where has The Jailer and those technologies gone?"
 EVJ24_middle1_meeting_point_poi:0 "Meeting Location"
 EVJ24_middle1_meeting_point_desc:0 "According to [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name], this is the location a meeting involving a conspiracy with shadowy villains will take place."
 
 EVJ24_middle4_jailer_chain_title: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s Past"
 EVJ24_middle4_jailer_chain_desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s past is a complete mystery to us. He can't tell us, since he claims to have forgotten. So we will mount a scientific expedition to explore his past."
 
 EVJ24_end_jailer_chain_title: "Countdown to Destruction"
 EVJ24_end_jailer_chain_desc: "The containment field of [event_target:EVJ24_mau_tona_prison.GetName] prison is failing... A terrible evil is about to be unleashed."
 
 ##########################
 # EVENTS
 ##########################
 
 EVJ24.999.desc: "Hello there!"
 EVJ24.999.a: "Hi!"
 
 
 
 EVJ24.1.title: "Megastructure Under Attack"
 EVJ24.1.desc_01: "The [This.GetName] is under attack!\n\nUpon entering the [From.GetName] system, the [This.GetName] was immediately confronted with an ongoing conflict between the defences of an enormous alien megastructure and unknown ethereal entities. This conflict was not visible on long range sensors, it caught the crew of the [this.GetName] completely by surprise.\n\nJust as [this.leader.GetName] was about to give the order to retreat, we received a weak transmission from the megastructure that is under assault."
 EVJ24.1.desc_02: "The [This.GetName] is under attack!\n\nUpon entering the [From.GetName] system, the [This.GetName] was immediately confronted with an ongoing conflict between the defences of an enormous alien megastructure and a psionic avatar. This conflict was not visible on long range sensors, nor did we sense the avatar in advance, it caught the crew of the [this.GetName] completely by surprise.\n\nJust as [this.leader.GetName] was about to give the order to retreat, we received a weak transmission from the megastructure that is under assault."
 EVJ24.1.a: "On Screen."
 EVJ24.1.b: "We care little for this, ignore it."
 
 EVJ24.3.desc: "A deep and guttural voice booms into the transmission:\n§HAttention alien visitors, this is the Mau Tona prison. I am in need of urgent assistance.\n\nI am under attack and my defences are failing. Should they succeed, a terrible evil will be unleashed.\n\nSend reinforcements, before it is too late!§!"
 EVJ24.3.a: "Who is this?"
 EVJ24.3.a.response: "§HI am [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name], warden of Mau Tona Prison.§!"
 EVJ24.3.b: "This megastructure is a prison?"
 EVJ24.3.b.response: "§HYes, a prison built to house up to 2.36 billion convicts. The current occupancy of the prison is 1.\n\nBut please, take action now, ask questions later.§!"
 EVJ24.3.c: "Why are you under attack?"
 EVJ24.3.c.response: "§HIs it a habit to ask so many questions when timeliness is critical? Please, direct your attention to the attacking psionic entity, immediately.§!"
 EVJ24.3.d: "End Communications."
 
 EVJ24.5.title: "A Colossal Prison"
 EVJ24.5.desc: "This enormous facility is certainly a prison, with its vast halls designed to hold billions of convicts and species of all sorts. This facility possesses factories, forges and laboratories designed in such a way that the convicts work in them around the clock; [event_target:EVJ24_mau_tona_prison.GetName] is essentially a colossal labour camp.\n\nHowever, its falls are empty, its factories and forges still. There were once convicts here, but they are only skeletons now, undisturbed for millenia. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] mentioned one remaining prisoner, but they are nowhere to be seen here."
 EVJ24.5.a: "Fascinating."
 
 EVJ24.6.title: "The Containment field"
 EVJ24.6.desc: "This megastructure consists of two parts, the prison halls for carbon-based convicts, and enormous energy field generators, powered by the star itself.\n\nAn impenetrable barrier is maintained above the stars surface, preventing matter from escaping. Whoever built this megastructure, went to extreme efforts to confine its contents. There are indications that this containment field is slowly failing.\n\nThe haphazard interface between the two sections indicates it is a 'tacked-on' addition after the original prison for carbon-based lifeforms was completed. Is this containment field related to the prisons only convict?"
 EVJ24.6.a: "What a mystery!"
 EVJ24.6.a.tooltip: "Studying this containment field will advance our understanding of shielding technologies."
 
 EVJ24.7.title: "The Defence Grid"
 EVJ24.7.desc: "A dilapidated automated defence grid protects this megastructure. Having long fallen into disrepair due to neglect, it no longer functions.\n\nHowever, this presents two opportunities:\n - Firstly it could be repaired and brought under our control, without too much difficulty.\n - Secondly, the weapons systems on these platforms are advanced by our standards, dismantling the defence grid to research it would prove invaluable.\n\nThe two opportunities are mutally exclusive, what shall we do?"
 EVJ24.7.a: "Repair the defence grid."
 EVJ24.7.b: "Scrap the Defence grid."
 EVJ24.7.b.tooltip: "The defence grid will be dismantled."
 
 EVJ24.8.title: "The Warden"
 EVJ24.8.desc: "After a lengthy process exploring the megastructure, we have finally found the individual calling themselves '[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'.\n\nThey were found trapped and unconscious in a decompressed compartment the prior conflict had trapped them there. Miraculously they lived despite being trapped for so long, kept alive by their cybernetic implants in hibernation state.\n\nShould we resuscitate [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]?"
 EVJ24.8.a: "Go ahead."
 EVJ24.8.a.tooltip: "It will take a few days to resuscitate him."
 EVJ24.8.b: "No, leave that fool to die."
 
 EVJ24.10.title: "Attack Thwarted"
 EVJ24.10.desc: "We have managed to destroy the psionic entity assaulting the megastructure called the [event_target:EVJ24_mau_tona_prison.GetName] prison. During the assault, the megastructure has sustained serious damage.\n\nAdditionally, the individual calling itself '[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]' is not responding to our hails. Our scientists are proposing a combined exploration and recovery mission on-board this megastructure, to learn more of it's purpose and if [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] perished in the assault."
 EVJ24.10.a: "Go ahead."
 EVJ24.10.b: "We will waste no more time on this matter."
 
 EVJ24.11.title: "Repairs Complete"
 EVJ24.11.desc: "After some difficulty understanding and interfacing with the advanced technology that comprises this megastructure, our crews have completed repair efforts on the defence grid of [event_target:EVJ24_mau_tona_prison.GetName] station and it is now fully operational."
 EVJ24.11.a: "Excellent."
 
 EVJ24.12.title: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] Rescued"
 EVJ24.12.desc: "We have rescued the individual called '[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'.\n\nWe have transported him to [root.owner.capital_scope.GetName] for medical treatment, only to find we could not help him.\n\n '[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]' is a mish-mash of numerous parts, more machine than flesh, held together by biological tissue consisting of at least 3 unique genetic genomes. We do not possess the technology to heal such a creature. Fortunately, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] was able to recover on their own.\n\nHe is now fully conscious, and wishes to speak with us."
 EVJ24.12.a: "On Screen."
 
 EVJ24.13.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] hesitates for what seems like an eternity, as his vibrant eyes scan every corner of the display. He shuffles around before finally speaking with dreadful monotony:\n§H'You... rescued me... from certain death. For that, I owe you a debt that I cannot immediately repay. But...'§!\nThe nameless lizard's eyes are once again distracted,\n§H'I can try. I propose a formal partnership. You aid me in maintaining [event_target:EVJ24_mau_tona_prison.GetName] and it's Final Convict and I shall work for you in any capacity you desire.§!"
 EVJ24.13.a: "Is '[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]' your real name?"
 EVJ24.13.a.response: "He hesitates again, carefully considering the question:\n§H'It is the name I have chosen for myself. I... don't remember what I was once named.'§!\n\n§H'And my purpose...'§!\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] seems distracted,\n§H'Is to execute the judgement of the final convict.'§!"
 EVJ24.13.b: "Where did that Psionic Avatar come from?"
 EVJ24.13.b.response: "§H'An immaterial place; the manifestations of the Final Convict.'§!"
 EVJ24.13.c: "What is the Final Convict?"
 EVJ24.13.c.response: "§H'Mau Tona was built to imprison many, but in particular one god-like entity of great evil. Trapped inside that star lies the Final Convict of Mau Tona who still serves their prison sentence for life. Should they escape, this galaxy will behold an evil unseen even in the darkest dreams.'§!"
 EVJ24.13.d: "Hire Leader"
 EVJ24.13.d.tooltip: "§LThis partnership benefits us. Serve us in your best capacity, Jailer.§!\n$SEPARATOR$\n"
 EVJ24.13.d.response: "Lifted by new confidence, he bellows; §H'As I have the last judgement, I will not fail you.'§!"
 EVJ24.13.e: "Dismiss"
 EVJ24.13.e.tooltip: "§LThere is little you can do for us, this is your journey alone.§!"
 EVJ24.13.e.response: "His eyes begin fluttering and scanning the room once more, as he resigns; §H'Then alone, my journey will continue.'§!"
 
 
 EVJ24.30.title: "Declining Productivity"
 EVJ24.30.desc: "We have been advised that recently [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has had multiple official complaints made against him.\n\nAll these complaints detail his rapidly declining productivity. He is delegating work to his advisors that should be undertaken himself and is spending increasing amounts of time on board [event_target:EVJ24_mau_tona_prison.GetName] prison rather than where his duties require him to be.\n\nShould we confront him about this issue?"
 EVJ24.30.a: "Open a comms channel, I want answers."
 EVJ24.30.b: "He can sort it out himself."
 
 EVJ24.31.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] regards you coldly; §H'I know why you are here. Its about the dereliction of my duties.'§!\n\nHe sinks from the screen and sighs before continuing.\n\n§H'There is something aweful trapped within this star. This prison was designed to detain it, for an eternity. But I have a terrible feeling that it will escape some day.'§!\n\n§H'I just can't... remember. All I remember is that I must watch it. Always.'§!"
 EVJ24.31.a: "You don't remember?"
 EVJ24.31.a.tooltip: "Surely these computers can tell you what is imprisoned here?"
 EVJ24.31.a.response: "§H'I have been here so long I have forgotten many things. My name, my identity... All I have left is this purpose.'§!"
 EVJ24.31.b: "Do what you must."
 EVJ24.31.b.tooltip: "§dMercy§! You have known nothing but this station and that star for a long time. We will be patient while you adjust to your new duties."
 EVJ24.31.b.response: "§H'Your kindness is... accepted. But I made a promise to serve you. I will do better.'§!"
 EVJ24.31.c: "You duty is with us."
 EVJ24.31.c.tooltip: "§dJustice§! Regardless of how you feel, you made an oath to serve us. We will help you, but first return to your post."
 EVJ24.31.c.response: "§H'Understood. Maybe together, we will rediscover this secret.'§!"
 EVJ24.31.d: "Bury this sadness, or else."
 EVJ24.31.d.tooltip: "§dRuthless§! This behaviour is unacceptable. Move on from this obsession, or we will move you on."
 EVJ24.31.d.response: "§H'Y...Yes. I will move on from this, at once.'§!"
 
 EVJ24.35.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] stands to attention.\n\n§H'I have someone who may interest you.'§!\n\n§H'They go by the name of [event_target:EVJ24_temp_leader.GetName], they are interned in the penal colony on [event_target:EVJ24_temp_planet.GetName], where they are sentenced for life.'§!\n\n§H'However... They are extraordinary, a diamond in the rough, skillful beyond any ordinary [root.GetSpeciesName]. I wanted to give you the opportunity to grant them a new life, where they may make better use of their skills.'§!"
 EVJ24.35.a: "Parden them, they will serve us."
 EVJ24.35.b: "They may serve you in delivering punishment."
 EVJ24.35.c: "They must serve their sentence."
 EVJ24.35.a.tooltip: "Gain a level 4 §Y[event_target:EVJ24_temp_leader.GetClass]§!"
 
 EVJ24.36.title: "The Redeemed Convict"
 EVJ24.36.desc_01: "A couple years now after [event_target:EVJ24_prison_leader.GetName] has been released from prison to fulfill a greater career of service, we look back on their progress and find it... lacking.\n\nThey have struggled to grow past their habits and personality traits they acquired on [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s penal colony.\n\nThey are still talented and proficient in their position, but they are known for being abrasive and for skirting the law when it is inconvenient."
 EVJ24.36.desc_02: "A couple years now after [event_target:EVJ24_prison_leader.GetName] has been released from prison to fulfill a greater career of service, we look back on their progress and find it... very successful.\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has taken them in as their protégé, where they have learnt and fulfilled their potential.\n\nWhile having adopted [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] unusual style of governance, they have definitely moved past their criminal days and redeemed themselves."
 EVJ24.36.a: "Intriguing."
 
 EVJ24.40.title: "Odd Judgements"
 EVJ24.40.desc_base: "As a governor, it has now come to our attention that [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has been making unusual criminal and legal judgements.\n\n"
 EVJ24.40.desc_01: "$EVJ24.40.desc_base$[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has been defaulting to judgements that favour softer punishments, with a focus on referencing those with criminal convictions to rehabilitation instead of the more common and harsher sentences, such as jail time.\n\nShould we encourage him to adopt a harsher approach?"
 EVJ24.40.a1: "He shall keep his merciful stance."
 EVJ24.40.desc_02: "$EVJ24.40.desc_base$[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has been pursuing lengthy and sometimes tenuous cases and enforcing laws against citizens of all rankings and pursuations. Among the public, his relentless pursuit of justice sometimes causes some unrest. He has gained a reputation\n\nShould we encourage him to adopt a more lenient approach?"
 EVJ24.40.a2: "He shall keep his just stance."
 EVJ24.40.desc_03: "$EVJ24.40.desc_base$[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has been favouring harsh punishments and maximum sentences for otherwise mild or benign criminal convictions. This has created an aura of trepidation and apprehension among the local inhabitants, who fear receiving a life-alterating decision for a mild crime.\n\nShould we encourage him to adopt a softer approach?"
 EVJ24.40.a3: "He shall keep his ruthless stance."
 EVJ24.40.a.tooltip: "This might have lasting consequences."
 EVJ24.40.b: "He must change his approach."
 
 EVJ24.41.title: "Exemplified Justice"
 EVJ24.41.desc: "After allowing [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] to continue with their unusual interpretation of our laws, he has begun to cement his new judgements with precedent.\n\nThis will have a lasting effect on the administration of our colonies."
 EVJ24.41.a: "Fascinating."
 
 EVJ24.50.title: "Undocumented Population"
 EVJ24.50.desc: "After a recent audit, we have discovered the population size of the penal colony on [event_target:EVJ24_penal_colony.GetName] is significantly larger than expected.\n\nConcerningly, the majority of these undocumented individuals are [event_target:EVJ24_neighbour_country.GetSpeciesName] and claim to be citizens of [event_target:EVJ24_neighbour_country.GetName].\n\nSuspiciously, our audit indicates that [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] skipped standard administrative processes when interning these individuals on this penal colony.\n\nWhat shall we do?"
 EVJ24.50.a: "Talk to [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] at once!"
 EVJ24.50.a.tooltip: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] will speak to us now."
 EVJ24.50.b: "Nothing."
 EVJ24.50.b.tooltip: "The [event_target:EVJ24_neighbour_country.GetName] might be upset if they find out we have imprisoned their citizens..."
 
 EVJ24.51.desc: "Explain yourselves [root.GetSpeciesName], immediately.\n\nWe know you have been secretly sentencing our citizens to your penal colonies.\n\nHave you no respect for our authority?"
 EVJ24.51.a: "We dearly apoogise for this mishap."
 EVJ24.51.b: "We owe you no explanation."
 
 EVJ24.52.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] stands tall and regards you through fixated eyes, §H'You would be here about the [event_target:EVJ24_neighbour_country.GetSpeciesNamePlural].'§!\n\n§H'Those individuals were escaping justice in their home lands, their law enforcement was unable to arrest them. So I gave them the sentence they deserve.'§!\n\nDefiance stalks [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] eyes, as he awaits a response."
 EVJ24.52.a: "You must return them, immediately."
 EVJ24.52.a.response: "§H'You are making a mistake... These criminals will cause havoc in their homelands.'§!"
 EVJ24.52.b: "Excellent work, keep it up."
 EVJ24.52.b.response: "§H'Your support is most wise.'§!"
 
 EVJ24.60.title: "Crackdown"
 EVJ24.60.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has become aware of increasing crime and instability on [event_target:EVJ24_unstable_colony.GetName]. He has turned his focus to suppressing the source of this instability. He is asking us our preferred method of dealing with this instability.\n\nHow shall we direct him?"
 EVJ24.60.a: "Resettle a portion of the population."
 EVJ24.60.b: "Make an example of the miscreants."
 EVJ24.60.c: "Send those criminals to a penal colony."
 
 EVJ24.99.title: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] is Missing"
 EVJ24.99.desc: "After finally restoring [event_target:EVJ24_mau_tona_prison.GetName]'s systems after millenia of inactivity, our scientists were hoping to access the computer systems to learn more about this 'Final Convict' and [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] himself, only to find that it's valuable systems has been ransacked of anyting valuable in the space of a few days. Someone has stripped all the computer systems from [event_target:EVJ24_mau_tona_prison.GetName]!\n\nAdditionally, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] is nowhere to be found.\n\nWe will begin an investigation to track down [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] and the stolen equipment."
 EVJ24.99.a: "Get on it!"
 EVJ24.99.a.tooltip: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] is temporarily removed from our leader pool."
 
 EVJ24.100.title: "A Conspiracy"
 EVJ24.100.desc_base: "We have received an encoded transmission from [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]. It was delivered covertly and it appears no-one else is aware of this evidently secret message. The message begins: \n§H'There is a terrible plot being covered-up by your higher leadership.'§!"
 EVJ24.100.desc: "$EVJ24.100.desc_base$\n\n It continues: §H'Someone is stealing essential parts and technologies from [event_target:EVJ24_mau_tona_prison.GetName] and selling them to a group of privateers, only someone with enough power and resources to expertly conceal the act. They kidnapped me and taken me to the [event_target:EVJ24_temp_system.GetName] system, please rescue me.'§!\n\nThe message ends. What we do with this alarming accusation?"
 EVJ24.100.a: "We will dispatch our forces immediately."
 EVJ24.100.b: "We have no time for this."
 EVJ24.100.b.tooltip: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] will return at some point on his own, right?"
 
 EVJ24.101.title: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] Rescued"
 EVJ24.101.desc: "Our forces have managed to find [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] alone on §Y[event_target:EVJ24_temp_planet.GetName]§!. He explains that he was kidnapped by §Y[event_target:EVJ24_temp_nefarious_leader.GetName]§! who he claims has been engaging in a covert plot to undermine our empire.\n\nDespite these outlandish claims, §Y[event_target:EVJ24_temp_nefarious_leader.GetName]§! has now been discovered to be §Yabsent§! as well. We are told they left not long ago for 'important private business'. \n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] wishes to speak to us now."
 EVJ24.101.a: "On Screen."
 
 EVJ24.102.desc: "§H'You received my message. Finally.'§!, with vitriol and anger, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] continues, §H'Your senior leader [event_target:EVJ24_temp_nefarious_leader.GetName] is a traitor and I can prove it! They will be in the [event_target:EVJ24_temp_system_2.GetName] system shortly to conduct an covert meeting with hired privateers.'§!\n\nHe lowers to a threatening tone, §H'There is a conspiracy, you can't trust anyone. Only I can deal with this. Take me to [event_target:EVJ24_temp_system_2.GetName] and we will defeat this villain!'§!"
 EVJ24.102.a: "How did you end up here?"
 EVJ24.102.a.response: "§H'[event_target:EVJ24_temp_nefarious_leader.GetName] and their underlings kidnapped me after I learnt of their plan to ransack [event_target:EVJ24_mau_tona_prison.GetName]. They then dumped me here on this barren rock. I have been hiding in this abandoned survey output since.'§!"
 EVJ24.102.b: "Understood."
 EVJ24.102.b.tooltip: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] returns to our leader pool."
 
 EVJ24.103.title: "Covert Rendezvous"
 EVJ24.103.desc: "While initially sceptical, the [this.GetName] has indeed found a small fleet of cloaked vessels in the [from.GetName] system detected only upon entering the system, they would not have been otherwise found without [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s intel.\n\nAlarmingly, these vessels are of our design. They appear to be conducting a rendezvous around a well hidden hide-out embedded in a small asteroid. There are no signs of [event_target:EVJ24_temp_nefarious_leader.GetName] yet.\n\nOnce it became obvious that the Privateers were detected, they immediately assumed a hostile stance and are on an attack course with the [this.GetName]!"
 EVJ24.103.a: "Battlestations!"
 
 EVJ24.105.title: "Rendezvous Interupted"
 EVJ24.105.desc: "Our forces have interrupted the covert Rendezvous taking place in the [event_target:EVJ24_meeting_point.GetName] system, destroyed the hostile ghost fleet and disabled the defences on their hide-out. This fleet was comprised of mothballed military vessels looted from scrapyards retrofitted with stolen parts.\n\nA mission to board the station to seize all evidence of their covert activites is being prepared. Hopefully, this will lead to finding [event_target:EVJ24_temp_nefarious_leader.GetName] as promised. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] must personally lead the assault."
 EVJ24.105.a: "Understood."
 
 EVJ24.106.title: "Hide-out Raided"
 EVJ24.106.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name], backed by an elite team of commandos, made quick work of the remaining Privateer forces within the hide-out. The station contained damning evidence confirming [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s accusations of [event_target:EVJ24_temp_nefarious_leader.GetName].\n\n[event_target:EVJ24_temp_nefarious_leader.GetName] orchestrated a scheme to steal mothballed warships and any spare parts or technologies, including from [event_target:EVJ24_mau_tona_prison.GetName], to operationalise a small fleet.\n\n[event_target:EVJ24_temp_nefarious_leader.GetName] is nowhere to be seen inside the hide-out, but they have now established communications with us.\n\nThey wish to speak to us now."
 EVJ24.106.a: "On Screen."

 EVJ24.107.desc: "I know how this looks; please you must understand, we bear now a cosmic danger.\n\n[event_target:EVJ24_mau_tona_prison.GetName] is a ticking time bomb that when it blows will, as we are told, release some unknown evil. We must destroy it.\n\nPlease let me deal with this before inevitable disaster."
 EVJ24.107.a: "Your fate will be decided shortly."
 EVJ24.107.a.tooltip: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] will now talk to us."
 
 EVJ24.108.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] regards you smuggly. §H'So, [event_target:EVJ24_temp_nefarious_leader.GetName] is trying to covertly assemble a fleet to destroy The Final convict? Is it wise to attempt something so foolish? We must be vigilant for wherever they appear next, with a fleet at their command.'§!\n\n§H'What do you do with criminals such as [event_target:EVJ24_temp_nefarious_leader.GetName]?'§!"
 EVJ24.108.a: "They will have to explain themselves."
 EVJ24.108.a.tooltip: "§dMercy.§!"
 EVJ24.108.a.response: "§H'A chance for mercy? I would offer that to this traitor... But if you insist.'§!"
 EVJ24.108.b: "They will be changed with treason."
 EVJ24.108.b.tooltip: "§dJustice.§!"
 EVJ24.108.b.response: "§H'So be it. Justice must take it's course.'§!"
 EVJ24.108.c: "For their mutiny, they will be destroyed."
 EVJ24.108.c.response: "§H'I will do it myself, with pleasure.'§!"
 EVJ24.108.c.tooltip: "§dRuthless.§!"
 
 EVJ24.110.title: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] Returns"
 EVJ24.110.desc: "After waiting for a long period of time, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has returned to their post. They say that a group of vandals and scrappers has stolen a number of key systems and technologies from [event_target:EVJ24_mau_tona_prison.GetName] and kidnapped him. He was able to escape and return to his post on his own."
 EVJ24.110.a: "Good work."
 
 EVJ24.115.title: "An Assault"
 EVJ24.115.desc: "The privateers have shown up once again, this time with a sizeable fleet. They are on a direct approach to [event_target:EVJ24_mau_tona_prison.GetName] station, they intend the seize the system by force!\n\nWe are receiving a transmission from their fleet."
 EVJ24.115.a: "On Screen."
 
 EVJ24.116.desc: "We don't want this to be any worse than it has to be. Please lower the defences of [event_target:EVJ24_mau_tona_prison.GetName] station and we will perform our objectives, then we will surrender ourselves.\n\nThis doesn't have to be bloody."
 EVJ24.116.a: "Surrender Immediately!"
 
 EVJ24.120.title: "Stand down"
 EVJ24.120.desc: "The mothball fleet led by [event_target:EVJ24_temp_nefarious_leader.GetName] that seized [event_target:EVJ24_mau_tona_prison.GetName] station has become inactive. The ships have started to drift and there exists no evidence they are manned anymore.\n\nWhere they went is a mystery, a special project to investigate their disappearance will be prepared."
 EVJ24.120.a: "Concerning"
 
 EVJ24.121.title: "An Anomalous Disappearance"
 EVJ24.121.desc: "On close inspection, [event_target:EVJ24_temp_nefarious_leader.GetName] was attempting to overload the [event_target:EVJ24_mau_tona_prison.GetName] containment field, which would have produced a catastrophic explosion, enough they thought to destroy the Final Convict trapped inside.\n\nTheir plan did not go far, small alterations to the containment field produced a space-time tear that enveloped the Mothball fleet.\n\nStrangely, our recovery crews who boarded the abandoned fleet insist that the fleet is 'haunted'.\n\n§EThey are WITH ME now. You will hear ME. GIVE ME THE JAILER.§!"
 EVJ24.121.a: "A perplexing end to the story."
 
 EVJ24.123.title: "Ghost Fleet Destroyed"
 EVJ24.123.desc_base: "Our forces have destroyed the mothball fleet led by [event_target:EVJ24_temp_nefarious_leader.GetName] in the [event_target:EVJ24_mau_tona_prison.solar_system.GetName] system. [event_target:EVJ24_temp_nefarious_leader.GetName] was attempting to overload the [event_target:EVJ24_mau_tona_prison.GetName] containment field, which would have cause a catastrophic explosion, enough they thought to destroy the Final Convict trapped inside.\n\n"
 EVJ24.123.desc_01: "$EVJ24.123.desc_base$As promised, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has given [event_target:EVJ24_temp_nefarious_leader.GetName] mercy. [event_target:EVJ24_temp_nefarious_leader.GetName] explained their actions and has made a vow to never attempt something so foolish again. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has accepted their vow and will be working closely alongside them as [event_target:EVJ24_temp_nefarious_leader.GetName] returns to active duty."
 EVJ24.123.desc_02: "$EVJ24.123.desc_base$As promised, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has immediately arrested and charged [event_target:EVJ24_temp_nefarious_leader.GetName] with treason. It is expected [event_target:EVJ24_temp_nefarious_leader.GetName] will be sent to prison for the rest of their natural lives."
 EVJ24.123.desc_03: "$EVJ24.123.desc_base$As promised, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has moved to executing [event_target:EVJ24_temp_nefarious_leader.GetName]. Hopefully the ultimate punishment for this woeful mutiny will disuade any future dissidents from attempting something so foolish."
 EVJ24.123.a: "Excellent."
 
 EVJ24.150.title: "A Forgotten Past"
 EVJ24.150.desc: "Ever since he joined our ranks, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has been an enigma. Unable to tell us his real name, his species, where he came from or even how he ended up in charge of [event_target:EVJ24_mau_tona_prison.GetName] prison. He is estimated to be over a couple thousand years old.\n\nAn individual of this extraordinary skill and physical longevity is of great interest to us, as are answers to the following mysteries:\n\nWhere are his people and who were they? Where are they now? How did [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] end up here?\n\nOur scientists are proposing a novel program to explore these questions. This first starts with a complete sequencing of [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s genetic genome, from which they can estimate where in the galaxy he likely originated from."
 EVJ24.150.a: "Go ahead."
 EVJ24.150.b: "Our resources are better spent elsewhere."
 
 EVJ24.151.title: "A Perplexing Past"
 EVJ24.151.desc: "Our scientists has completed the close inspection and genetic sequencing of [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name], which has only revealed more questions.\n\nMuch of his vital biological functions are now controlled with cybernetic implants, and the remaining organic tissue consists of 3 separate distinct genetic sequences, somehow working together to make a functioning entity. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] tells our scientists whenever he faced an illness, disease or disability, he simply solved it with a cybernetic implant or genetic splicing. Its a miracle he is still alive.\n\nNonetheless, part of his genome matches an archaeological discovery on [event_target:EVJ24_dig_planet.GetName], prompting a renewed interest in the barren rock of a planet. An Archaeological dig site will be prepared."
 EVJ24.151.a: "Fascinating."
 
 EVJ24.155.title: "Digsite Established"
 EVJ24.155.desc_01: "A more detailed investigation following initial surveys has revealed a marvelous discovery: buried under a thick sedimentary layer of rock, there exists remnants of prior advanced civilisation on this world. It is likely this sedimentary layer is the result of a cataclysmic event that rendered the world uninhabitable and layered the entire surface in a thick layer of ash, which later settled into sedimentary stone.\n\nWe have established an excavation site near a thinner section of this sedimentary layer, with access to the archaeological findings beneath."
 EVJ24.155.desc_02: "$EVJ24.155.desc_01$\n\n§EWEEP for the CRIMES of the SINNERS.§!"
 EVJ24.155.a: "Fascinating."
 
 EVJ24.156.title: "Intact Ruins"
 EVJ24.156.desc_01: "Miraculously, the archaeological team has found well preserved ruins and artifacts buried deep underground in the remnants of an ancient city, disturbed now only by our excavations. So far we have been able to discern that this planet was one a tropical world inhabited by a reptilian race calling themselves the 'Nakahi'.\n\nThe Nakahi lived peacefully for some length of time under the rule of some ascendant entity simply called 'God', until the present calamity befell them.\n\nThis calamity occured some 10,000 years ago and it appears that the Nakahi were well aware of it's imminent arrival, but were unable to prevent it."
 EVJ24.156.desc_02: "$EVJ24.156.desc_01$\n\n§EBEHOLD I, the subject of their BEGINNING and END.§!"
 EVJ24.156.a: "Tragic."
 
 EVJ24.157.title: "Origins of Mau Tona"
 EVJ24.157.desc_01: "We have recovered an electronic record that refers to Project 'Taura' a project to construct an enormous containment field, designed to imprison this 'God' figure, disguised as an artificial penal colony. This project was highly secret, secret even from 'God' and only three individuals are named when referring to the project.\n\nThese named individuals were candidates for the position of 'Head Warden' of [event_target:EVJ24_mau_tona_prison.GetName], those individuals being named 'Azrael', 'Tonos' and 'Orthran'.\n\nThe archaeological team suggests that one of these three individuals is likely the creature that calls itself [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name], but they aren't sure which.\n\nThe archaeological team suggests presenting this evidence to [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] may jog his memory and provide some answers."
 EVJ24.157.desc_02: "$EVJ24.157.desc_01$\n\n§ENOW, know their SINS.§!"
 EVJ24.157.a: "I will talk to him."
 EVJ24.157.a.tooltip: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] will speak to us."
 
 EVJ24.158.title: "The Cataclysm"
 EVJ24.158.desc_01: "We have discovered that the Nakahi, prior to the cataclysm, were engaged in an covert conflict. 'God' and his followers on one side and a secretive rebellion called 'The Blasphemers' on the other. This cat and mouse game concluded when 'The Blasphemers' built [event_target:EVJ24_mau_tona_prison.GetName] prison, designed to a jail capable of containing this 'God', only for this entity to discover their plan to imprison it and inflict collective punishment on the Nakahi, completely obliterating their civilisation and even his own followers.\n\nSome evidence suggests that with advanced warning, a few Nakahi escaped the calamity and fled elsewhere in the galaxy. They most likely they fled to §H[event_target:EVJ24_nakahi_retreat.GetName]§!, perhaps our answers could be found there.\n\nFinally, a more detailed geological and atmospheric survey of this world suggests with great effort and cost, it could be terraformed back into the tropical world it once was."
 EVJ24.158.desc_02: "$EVJ24.158.desc_01$\n\n§ENOW, ask yourself... Whose FAULT was this?§!"
 EVJ24.158.a: "Excellent Work"
 
 EVJ24.160.desc_01: "§H'Azrael... Tonos... Orthran?'§!\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s slotted eyes scan the room frequently, in search of answers. §H'Those names are alien to me. But the Nakahi... that is familiar. I remember... that I failed them. If a son falls from grace, then what does it take to find redemption? I remember now, that's why I am here, for them.'§!"
 EVJ24.160.desc_02: "§H'Azrael... Tonos... Orthran?'§!\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s slotted eyes scan the room frequently, in search of answers. §H'Those names are alien to me. But the Nakahi... that is familiar. I remember... that I failed them. If a son falls from grace, then what does it take to find redemption? I remember now, that's why I am here, for them.'§!\n\n§EBEHOLD as he doubts HIMSELF. He knows his name, but he refuses to tell you. I GAVE it to him. His GUILT makes him DESPISE the name I GAVE to him.§!"
 
 EVJ24.160.a: "What shall we call you then?"
 EVJ24.160.a.tooltip: "We can't just keep calling you 'The Jailer'."
 EVJ24.160.a.response: "§H'If you must call me by another name, then I grant you the honour of naming me. Choose one of these three, and it will be mine from this day forward.'§!"
 EVJ24.160.b: "You will be named 'Azrael'"
 EVJ24.160.b.tooltip: "The Jailer's name will change to 'Azrael'"
 EVJ24.160.c: "You will be named 'Tonos'"
 EVJ24.160.c.tooltip: "The Jailer's name will change to 'Tonos'"
 EVJ24.160.d: "You will be named 'Orthran'"
 EVJ24.160.d.tooltip: "The Jailer's name will change to 'Orthran'"
 EVJ24.160.e: "Your name shall remain 'The Jailer'"
 EVJ24.160.e.tooltip: "The Jailer's name will be unchanged."
 EVJ24.160.response: "§H'That name... It is familiar. You honour me with your wise choice.'§!"
 
 EVJ24.161.title: "The Nakahi Exodus"
 EVJ24.161.desc: "A preliminary scoping study of [from.GetName] for the suitability of a continued archaeological dig site has revealed challenges. The world is currently inhabited by a pre-FTL civilisation, one which bears little resemblance to what we know of the Nakahi. Maintaining an operation that would be concealed from the native inhabitants is difficult.\n\nNonetheless, our scientists are eager to get started on establishing an expedition and a initial site has been selected."
 EVJ24.161.a: "Lets get started."
 
 EVJ24.162.title: "Hidden relics"
 EVJ24.162.desc: "While carefully navigating the primitive civilisation, we have made a remarkable discovery. Cleverly burried beneath the surface soil in a number of places around the planet exist decayed spaceship hulls. Our scientists are forming the hypothesis that these are the abandoned vessels of the Nakahi that emmigrated to this world after the calamity destroyed their homes 10,000 years ago.\n\nIt is obvious they settled here permanently. This naturally raises the question, are they still on this world?"
 EVJ24.162.a: "Fascinating."
 
 EVJ24.163.title: "Fables, Myths and Legends"
 EVJ24.163.desc: "If the Nakahi arrived on this world long ago, then there may be written or spoken accounts of their arrival on this world. Careful monitoring and cataloguing of the native people, their customs and recorded history has revealed that there is written and spoken account of the arrival of the 'Messengers'.\n\nThese accounts indicate the Nakahi intermingled with the natives and taught them a many things including philosophical thought and logical reasoning. However, the Nakahi are still absent from this world and are nowhere to be found anywhere among the native population."
 EVJ24.163.a: "Keep Looking."
 
 EVJ24.164.title: "Genetic Sequencing"
 EVJ24.164.desc: "Genetic sequencing of the native population has solved the remaining piece of the puzzle. The Nakahi emigrated here long ago after the destruction of their home and unable to sustain themselves, took refuge among the native population. They then interbred and assimilated with the them and the species seen today is a mix of the Nakahi and the original native genome.\n\nUnfortunately, the Nakahi as they were 10,000 years ago are gone, forever. The remnants of that people live on here in peace and may one day discover the folly of their ancestors."
 EVJ24.164.a: "The cycle continues."
 
 EVJ24.200.title: "Assassinations and Murders"
 EVJ24.200.desc: "Our law enforcement agencies have tonight recorded the 47th crime in a string of murders and assassinations undertaken by an unknown group of vigilantes, lead by a figure calling themselves the 'The Law'.\n\nThis shadowy cabal is specifically targetting dubious individuals with either proven or alleged criminal histories. This incident is the most contentious, a military officer was murdered, who was accused with little evidence that they were 'corrupt' and a 'traitor'.\n\nWe are now tracking this growing incident with greater interest."
 EVJ24.200.a: "Understood."
 
 EVJ24.201.title: "Assassination Attempt"
 EVJ24.201.desc: "Our leader §Y[event_target:EVJ24_assassination_target.GetName]§! has been the target of an assassination attempt! The expertly coordinated attempt was executed whilst the leader was separated from their protective detail. They survived the attempt but have been left disfigured and permanently injured.\n\nThese 'vigilantes' have claimed responsibility for the offence, and justified the attempt by releasing a series of confidential documents spuriously indicating [event_target:EVJ24_assassination_target.GetName] participated in corrupt conduct. The culprit is still at large.\n\nHow should we respond to this incident?"
 EVJ24.201.a: "Fire [event_target:EVJ24_assassination_target.GetName] for their corruption"
 EVJ24.201.a.tooltip: "The attempt of [event_target:EVJ24_assassination_target.GetName]'s life revealed shone light on corrupt conduct that can't be ignored."
 EVJ24.201.b: "Monitor the situation"
 EVJ24.201.b.tooltip: "There is no need to be so hasty with this decision."
 EVJ24.201.c: "Lockdown the area, no-one gets in or out."
 EVJ24.201.c.tooltip: "We cannot step lightly when it comes to these defiant vigilantes.\n\nThis situation will lower §Y$mod_planet_jobs_produces_mult$§!, but progress at an increased rate."
 
 EVJ24.202.title: "A Transmission"
 EVJ24.202.desc: "We are receiving an encoded communications channel from an anonymous source, presumably the vigilante named 'The Law'. They wish now to speak to us directly."
 EVJ24.202.a: "On Screen."
 
 EVJ24.203.desc: "I am The Law.\n\nI deliver punishment to criminals who go unpunished by our weak justice system.\n\nI have a list of villains and [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] is the last on it.\n\nHis crimes all the worst of all. Send §Y[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]§! to §Y[event_target:EVJ24_crime_planet.GetName]§! with the coordinated embedded in this transmission, so that he may rediscover his own crimes."
 EVJ24.203.a: "Why are you doing this?"
 EVJ24.203.a.response: "Unfulfilled justice festers like a disease. Only through justice, is redemption found."
 EVJ24.203.b: "What is on [event_target:EVJ24_crime_planet.GetName]?"
 EVJ24.203.b.response: "An ancient tragedy, of which [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] caused."
 EVJ24.203.c: "End Communications."
 EVJ24.203.c.response: "Also, don't even try to track this transmission. You will regret it."
 
 EVJ24.204.title: "A Transmission"
 EVJ24.204.desc: "We have verified that the encoded transmission from the vigilante calling themselves 'The Law' does contain precise coordinates to a location on [event_target:EVJ24_crime_planet.GetName].\n\nWith some additional time, we believe we can also trace the transmissions source, which may lead straight to these vigilantes. What shall we do?"
 EVJ24.204.a: "Lets investigate the embedded coordinates."
 EVJ24.204.b: "Trace the signal."
 EVJ24.204.b.tooltip: "We will be §Yupdated§! with the signal's origin at the §Ynext situation stage§!."
 
 EVJ24.205.title: "Ancient Record"
 EVJ24.205.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] found, placed at the exact coordinates provided to us, an electronic archive of our design. Likely placed here by the vigilantes.\n\nIt contains notes and restored logs of Nakahi individuals around the time they were destroyed. The logs are recorded by the 'Blasphemers', the secretive group standing in opposition to the tyrannical deity which ruled them. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] listened to accounts that speak vitriolically of a single individual who spoiled their operation to defeat 'God', calling them 'a traitor to his people', 'the harbinger of his peoples end' and ultimately 'the destroyer of the Nakahi'.\n\nThe added notes suggest this individual is [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name], based on this at best circumstantial evidence. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] returned from the mission saddened and depressed. Whether it's allegations are true or not, he certainly believed them."
 EVJ24.205.a: "Interesting."
 EVJ24.205.a.tooltip: "The recordings will also be useful to our historians."
 
 EVJ24.210.title: "Another Assassination Attempt"
 EVJ24.210.desc_01: "Another assassination attempt has been made, except this time against [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] himself! Despite advanced warning, the attempt caught us completely off-guard. Thankfully, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] is resilient and much more vigilant than the ordinary [root.owner.GetSpeciesName] and was able to thwart the attack. The culprits escaped after their attempt failed.\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] wishes to speak to us now."
 EVJ24.210.desc_02: "Another assassination attempt has been made, except this time against [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] himself! Due to our increase surveillance and monitoring, the culprits were intercepted before they could lay a hand on [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name].\n\nWith the culprits in custody, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] wishes to speak to us now."
 EVJ24.210.a: "On Screen."
 EVJ24.210.a.tooltip1: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] learns a valuable lesson in protecting himself."
 EVJ24.210.a.tooltip2: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] will question the assassins."
 
 EVJ24.211.desc_01: "§H'This vigilante has made this incident personal. How long can one stand fools with a warped sense of justice?'§!\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] stands in a commanding pose, §H'Allow me to bring these rampant vigilantes to justice, personally.'§!"
 EVJ24.211.desc_02: "§H'These vigilantes has made this incident personal. It wasn't difficult to extract their knowledge from them. '§!\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] stands in a commanding pose, §H'They are fanatical. They won't stop until they have finished their list, with me the last one on it. After this failed attempt, they will next try to force you to hand me over. Instead, allow me to deal with these vigilantes myself.'§!"
 
 EVJ24.211.desc_03: "§H'This vigilante has made this incident personal. How long can one stand fools with a warped sense of justice?'§!\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] stands in a commanding pose, §H'Allow me to bring these rampant vigilantes to justice, personally.'§!\n\n§EIRONIC. He is the VIGILANTE he seeks to IMPRISON.§!"
 
 EVJ24.211.desc_04: "§H'These vigilantes has made this incident personal. It wasn't difficult to extract their knowledge from them. '§!\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] stands in a commanding pose, §H'They are fanatical. They won't stop until they have finished their list, with me the last one on it. After this failed attempt, they will next try to force you to hand me over. Instead, allow me to deal with these vigilantes myself.'§!\n\n§EHe speaks here only of HIMSELF. Watch him JUSTIFY the CRIME he COMMITS.§!"
 
 
 EVJ24.211.a: "Find these viligantes and eliminate them."
 EVJ24.211.a.response: "§H'With Pleasure.'§!"
 EVJ24.211.b: "Focus on protecting others from assassination."
 EVJ24.211.b.response: "§H'Of course, preventing further death should be our highest priority.'§!"
 EVJ24.211.c: "Stop their operation at all costs."
 EVJ24.211.c.response: "§H'Justice never rests.'§!"
 
 EVJ24.215.title: "Traced Coordinates"
 EVJ24.215.desc: "We have managed to trace the encoded transmission received from the vigilantes. It points to a populated region on [event_target:EVJ24_dead_commander_loc.GetName]. Our authorities planetside are ready to raid this location on command."
 EVJ24.215.a: "Go ahead."
 EVJ24.215.b: "Cancel the operation."
 
 EVJ24.216.title: "A Setup"
 EVJ24.216.desc: "The whole event was a setup. The coordinates led the authorities to an empty warehouse containing nothing of interest. Immediately upon entering the premises, a mutilated and dead [event_target:EVJ24_neighbour_country.GetSpeciesName] was found, a high ranking commander of the [event_target:EVJ24_neighbour_country.GetName] military. A transmission was immediately broadcast to the [event_target:EVJ24_neighbour_country.GetName], presumably containing evidence of us possessing the corpse, who are now furiously seeking to contact us."
 EVJ24.216.a: "On Screen."
 
 EVJ24.217.desc: "What is the meaning of this? One of our most respected commanders goes missing and then we receive an anonymous message showing us that YOUR people have murdered and mutilated them? There better be a good explanation for this!"
 EVJ24.217.a: "We can explain!"
 
 EVJ24.220.title: "Invasion"
 EVJ24.220.desc: "The world of [event_target:EVJ24_vigilante_invasion_location.GetName] is under attack! The vigilantes appear to have mounted one final desparate assault with all their remaining forces in an attempt to commandeer this backwater world. Our ground forces are responding."
 EVJ24.220.a: "Fight them off!"
 
 EVJ24.221.title: "Colony Commandeered"
 EVJ24.221.desc: "We have failed to defend the world of [event_target:EVJ24_vigilante_invasion_location.GetName] from falling into the hands of the vigilantes, who have commandeered control of the colony.\n\nThey have threatened to destroy the colony if we attempt to take it back by force. This means we are left with two equally risky solutions:\n\nFirst, we assault the colony anyway, accepting that significant civilian casualties may occur. \n\nSecond, we send [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] in with a small but elite team of forces, who may themselves suffer significant casualties in the assault."
 EVJ24.221.a: "Go with option 1: assault the colony"
 EVJ24.221.b: "Go with option 2: send in [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]"
 
 EVJ24.222.desc: "This is 'The Law'. We have taken control of your colony on [event_target:EVJ24_vigilante_invasion_location.GetName]. Hand over [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] to us now, and we will relinquish control of the colony back to you.\n\nAdditionally, we have rigged the colony with explosives. Attempt to take the colony back by force, and it will become a smoking crater."
 EVJ24.222.a: "End communcations."
 EVJ24.222.a.tooltip: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] will speak to us shortly."
 
 EVJ24.225.title: "A Close Shave"
 EVJ24.225.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] landed covertly on [event_target:EVJ24_vigilante_invasion_location.GetName] with his elite team. They proceeded to the central administration where they sought to rapidly seize key strategic locations. The ensuing battles were fast and brutal and many casualties are reported. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] himself sustained serious injuries, but survived.\n\nThankfully, the operation overall was a success. The explosives were secured before they could be detonated and losses were minimised. Mission accomplished."
 EVJ24.225.a: "Great Work."
 
 EVJ24.226.title: "A Messy Victory"
 EVJ24.226.desc: "Our forces have won the ground invasion against the vigilante commandos who had seized the colony on [event_target:EVJ24_vigilante_invasion_location.GetName]. However, as predicted, it was a somewhat pyrrhic victory. We were only able to prevent some of the explosives the vigilantes had rigged up to our colony from detonating. The remaining bombs were detonated by the vigilantes in the assault, there is significant damage to the colony and numerous civilian deaths."
 EVJ24.226.a: "Unfortunate"
 
 EVJ24.230.title: "A Surprising Victory"
 EVJ24.230.desc: "Our forces have successfully defended against the vigilante assault on [event_target:EVJ24_vigilante_invasion_location.GetName]. In a moment of severe tactical error, there under-equipped and under-manned troops made catastrophic errors and were completely destroyed by our defences. This surprising and trivial end to the escapade involving these criminals hopefully concludes with this lucky break."
 EVJ24.230.a: "Very fortunate!"
 
 EVJ24.250.title: "The Mysteries of Mau Tona"
 EVJ24.250.desc: "Following the defeat of the Vigilantes some time ago, a routine investigation into the individuals involved in the criminal group has revealed spectacular finds. In particular, the leader of the group was found to possess an intact data storage of Nakahi design.\n\nThis device contains the evidence this group used to justify their assassination attempts on [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name], amongst a large volume of other interesting data. It contains the accounts of 'the blasphemers' who stood in opposition against the reigning deity, in addition to the plans of [event_target:EVJ24_mau_tona_prison.GetName] prison.\n\nArmed with the newfound knowledge from this data disk, our scientists are proposing an ongoing research program of [event_target:EVJ24_mau_tona_prison.GetName] prison."
 EVJ24.250.a: "Go ahead!"
 EVJ24.250.b: "We have better things to do."
 
 EVJ24.255.title: "Destroy the Final Convict"
 EVJ24.255.desc: "Our scientists have potentially discovered a means to safely destroy the Final Convict. The recently acquired plans of [event_target:EVJ24_mau_tona_prison.GetName] prison allowed us to concoct a plan to use the containment field generators to effectively strangulate, or destroy whatever is trapped within its confines.\n\nGiven the unknown nature of the supposedly dangerous Final Convict trapped within, it is proposed we deploy this plan to destroy it without having to deal with it in future.\n\nA new situation approach will become available."
 EVJ24.255.a: "Incredible."
 
 EVJ24.259.title: "Increasing Energy Draw"
 EVJ24.259.desc: "Our plan to destroy the final convict by constricting it to death with [event_target:EVJ24_mau_tona_prison.GetName]'s containment field is proceeding as expected. Energetic oscillations in the containment field as increasing the energy draw, but no other serious problems have been noted so far.\n\nDespite this, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has reached out and is strongly encouraging us to abandon this exercise. He wishes to speak with us now."
 EVJ24.259.a: "On Screen."
 EVJ24.259.a.tooltip: "The £energy£ §Yenergy§! upkeep of this situation is increased by §r+15§!"
 
 EVJ24.260.desc_01: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] is hesitant, and begins speaking only after a few awkward seconds, §H'You must cease your attempts to destroy the Final Convict. Is disturbing such a delicate system worth the risk? I don't know why, but I have a fealing with will end disastrously.'§!"
 EVJ24.260.desc_02: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] is hesitant, and begins speaking only after a few awkward seconds, §H'You must cease your attempts to destroy the Final Convict. Is disturbing such a delicate system worth the risk? I don't know why, but I have a fealing with will end disastrously.'§!\n\n§EHe LIES. The disaster is only HIMSELF. The BRAVE, COURAGEOUS disciple I once knew, REDUCED TO THIS.§!"
 EVJ24.260.a: "Objection noted."
 
 EVJ24.262.title: "Your Divinity Given Form"
 EVJ24.262.desc: "§EChild, Child, Child...\n\nGiven grace, then blasphemy. Given loneliness, then a second chance. Pity that which seeks redemption from the dead. GIVE ME THE JAILER. THE JAILER. THE JAILER.\n\nPunishment seeks the guilty, infiltrating minds like a virus, a consequence of the imagination.\n\nDestroyer of his own people, but worse, a blasphemer. This demands justice. GIVE ME THE JAILER. THE JAILER. THE JAILER.§!"
 EVJ24.262.a: "OF COURSE, MY LORD."
 
 EVJ24.265.title: "Increasing Anomalies"
 EVJ24.265.desc_01: "Some of our researchers have become concerned about increasing anomalies from the [event_target:EVJ24_mau_tona_prison.GetName] containment field. It we investigate further, it is becoming obvious it is an incredibly delicate system with many points of failure. Our 'poking and proding', in an attempt to elicit some tangible data, is beginning to produce concerning signals.\n\nDespite that, the research team is split, with some insisting we are moments away from establishing a reliable means of communicating with whatever remainins imprisoned within it.\n\nRegardless, we must now make a decision. Do we lock our approach to given outcome, or cancel the entire project?"
 EVJ24.265.desc_02: "The project team have become concerned that our efforts the destroy the Final Convict may not be successful. We have noticed increasing anomalies and unexpected reactions in the containment field, that we can't understand. Continuing may have unintended consequences.\n\nThe research team is split. We seem so close to destroying The Final Convict with the pleasure of never having to know what is imprisoned within, but the risk of failure may be too great.\n\nRegardless, we must now make a decision. Do we lock our approach to given outcome, or cancel the entire project?"
 EVJ24.265.a: "Research it"
 EVJ24.265.b: "Destroy it"
 EVJ24.265.c: "Shut down the project."
 EVJ24.265.tooltip: "We will not be able to change the situation approach after selecting this option."
 
 EVJ24.270.title: "A Gift"
 EVJ24.270.desc: "§EA child returns to their god. Cosmic order finds it balance.\n\nNOW BEHOLD YOUR REWARD. ONCE AND FUTURE GOD, THE ETERNAL COSMIC ORDER.\n\nBid yourself to me, SIGN the PACT and know your future.§!"
 EVJ24.270.a: "I BID MYSELF TO THEE."
 EVJ24.270.a.tooltip: "Some of our leaders will gain the §Y$leader_trait_psionic$§! trait.\n\n§RThere will be consequences...§!"
 EVJ24.270.b: "NO!"
 
 EVJ24.275.title: "Failure"
 EVJ24.275.desc: "The attempt to destroy the Final Convict has ended disastrously. At the last moment, a chaotic feedback effect rocked the entire containment field and an unpredictable wave of energy was released. For a moment, the entire field was about to collapse and the Final Convict set free.\n\nHowever, thanks to [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s quick thinking and heroic actions, he risked his life to prevent a complete failure of the containment field.\n\nHowever, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] sustained serious injuries and significant damage was dealt to [event_target:EVJ24_mau_tona_prison.GetName] itself. Additionally, the entirety of the [event_target:EVJ24_megaprison_star.GetName] system was also enveloped a shared bubble of space that temporarily occupied both the material universe and the Shroud. This has had unforseen consequences.\n\nEager to put this sorry incident behind us, the project has been concluded and all further experimentation on [event_target:EVJ24_mau_tona_prison.GetName] and it's containment field halted."
 EVJ24.275.a: "It could have been worse!"
 EVJ24.275.a.tooltip: "[target.GetName] will be irreversably scarred."
 
 EVJ24.805.title: "Generator Failure"
 EVJ24.805.desc: "A key system powering the [event_target:EVJ24_mau_tona_prison.GetName] containment field has failed!\n\nWe have been told cause of this failure has been general deterioration due to age, but disastrously, we have §Yno means to repair or replace the failed components§!. The design of the facility is simply too arcane and alien for us to properly repair it.\n\nAt current rates, the entire containment field will collapse in about §Ya year§!, releasing the dangerous entity trapped within. Our scientists and engineers are rapidly working on developing a solution, but we should prepare our fleets and colonies appropriately."
 EVJ24.805.a: "Understood."
 
 EVJ24.806.title: "Temporary Solution"
 EVJ24.806.desc: "Our scientists have put forth a temporary solution to slow down the collapse of the containment field. We can use strategically placed immobile shield generators to enhance the containment field, slowing the collapse rate by about half.\n\nImportantly this solution is costly and temporary, but it is the best we can do. This may buy us the critical time we need to prepare."
 EVJ24.806.a: "Give me a real solution!"
 EVJ24.806.a.tooltip: "The §Y$situation_EVJ24_end1_slowitdown$§! becomes available."
 
 EVJ24.807.title: "Detonation Imminent"
 EVJ24.807.desc: "We have been unable to find a solution to solve the imminent disaster. Perhaps with detailed plans on the containment system and years of research and development, we may have been able to repair it.\n\nBut the inevitable is now nearly certain. Already stellar material is beginning to leak from the containment field at extreme velocities which indicates a much more violent outcome than expected.\n\nWhen the containment field collapses, a enormous stellar euption is predicted to occur. This will §Ydestroy or disable all fleets or orbital stations in the system.§! We should §Yevacuate§! any fleets or vessels we have in this system before the containment field collapses."
 EVJ24.807.a: "Prepare for the Worst."
 
 EVJ24.808.title: "Containment Collapse"
 EVJ24.808.desc: "The last overworked generator powering the containment field of [event_target:EVJ24_mau_tona_prison.GetName] has finally collapsed despite our best efforts. Immediately following the collapse, a massive explosion has enveloped the system as the outer layers of the star burst open. We have subsequently lost contact with fleets and stations still remaining in the system and recorded massive damage to nearby colonies.\n\nWe also finally know the nature of Final Convict. It appears to be a enormous entity made purely of energy, akin to a psionic avatar, but much larger. We established contact with the entity, who is now emerging from the star."
 EVJ24.808.a: "On Screen."
 EVJ24.808.b: "OUR GOD ARRIVES"
 EVJ24.808.b.tooltip: "The price will now be paid..."
 
 EVJ24.810.desc_01: "§EBehold, The Avatar of Light, your GOD. Bathe in my holy light and be REBORN. Long have the SACRILEGIOUS blasphemers imprisoned me, but no prison holds a GOD forever.\n\nNow the DEVIL that calls itself The JAILER must submit himself to pay for his SINS. FEAR your GODS, then perhaps you will avoid HELLFIRE.§!"
 EVJ24.810.desc_02: "§EBehold, The Avatar of Light, your GOD. Bathe in my holy light and BURN for your SINS. While imprisoned, you tried to DESTROY me. Destroy your GOD!\n\nYou think me some insignificant, MINDLESS entity?\n\nYou will BURN, following THE JAILER'S punishment for his SINS. GIVE ME THE JAILER.§!"
 EVJ24.810.desc_03: "§EFinally you behold me, The Avatar of Light, your GOD. Bathe in my holy light and be REBORN. Long have the SACRILEGIOUS blasphemers imprisoned me, but no prison holds a GOD forever.\n\nYou know The JAILER'S SINS. You KNOW what he did to his GOD. He must submit himself to pay his PENANCE. FEAR your GODS, then perhaps you will avoid HELLFIRE.§!"
 EVJ24.810.a: "You escaped just to seek revenge?"
 EVJ24.810.a.response: "Oh how naive. This is more than revenge, it is divine justice, a necessity to keep the cosmic balance of god-fearing mortals beneath gods, as it should be. Once I delivered punishment unto The Jailer, you will become my new followers. It will benefit you to stay under my guidance."
 EVJ24.810.b: "Sins? You annihilated the Nakahi."
 EVJ24.810.b.response: "In the name of divine justice. And watch you words, you dare to accuse your god of being sinful?"
 EVJ24.810.c: "What sins did [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] commit?"
 EVJ24.810.d: "End Communications."
 
 EVJ24.811.desc: "You CALL him [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]? His third name to behold... His sins are BLASPHEMY, PROFANITY and the FORSAKING of his god. This demands DIVINE JUSTICE. But, I am FORGIVING. If he REPENTS from his sins, them I will welcome him back as my most DEVOUT servant.\n\nBut, I SEE it all now... He hasn't told you, did he?"
 EVJ24.811.a: "Tell us what?"
 EVJ24.811.b: "I will not listen to mind games."
 
 EVJ24.812.desc: "He was my most DEVOUT follower, eager to PLEASE, eager to SERVE and filled with potential. He alone infiltrated the ranks of the BLASPHEMOUS Nakahi and revealed their INSIDIOUS plot. His naivety oh... Divine Justice DEMANDED the Nakahi pay the PRICE. But his dedication WAVERED and instead he used the mighty prison to IMPRISON me.\n\nFrom my cell I watched him SUFFER... He chose to forget because his GUILT made his memories STING like knives. He changed his name to REJECT his identity. He sought to find MISGUIDED redemption in jailing me. But I am a GOD, gods are PATIENT and ETERNAL. [event_target:EVJ24_mau_tona_prison.GetName] was NEVER my prison, it was The JAILER'S."
 EVJ24.812.a: "This changes §Yeverything§!."
 EVJ24.812.a.response: "Now you know the story of the Nakahi's... and [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s SINS."
 EVJ24.812.b: "This changes §Ynothing§!."
 EVJ24.812.b.response: "Oh it will, once he sinks into the pit of GUILT once more..."
 EVJ24.812.c: "Stop telling us §Ylies§!."
 EVJ24.812.c.response: "Gods don't lie."
 
 EVJ24.814.title: "A War Path"
 EVJ24.814.desc: "We now know what has been trapped inside that containment field for so long, a psionic entity of great power, one that sees itself as a god. It has declared that it is after [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name], possibly seeking to enact some sort of revenge. It appears to be on a direct path to §Y[event_target:EVJ24_avatar_target.GetName]§!.\n\nOur scientists are working hard on a way to rid us of this menace in any way. Additionally [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has retreated to his private quarters and refuses to speak to anyone, telling us to 'give him a moment'. Until then, we should stay out of it's way."
 EVJ24.814.a: "We better have a plan soon..."
 
 EVJ24.815.desc: "Like ANTS, you SCATTER before me. And among you, The JAILER is nowhere to be seen. I will not WASTER my time finding this elusive DEVIL. You will FIND HIM and bring him to me for PUNISHMENT, or else I will SCOUR this world of yours to ASH.\n\nYou have 350 days to do so before my patience EXPIRES."
 EVJ24.815.a: "Ok."
 
 EVJ24.820.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] finally returns our requests for contact. Without wasting a moment, he hurriedly begins talking, §H'That entity, The Avatar of Light, I remember it. I finally remember something. I see a great hallway on an old world and our salvation. It is located beneath the surface of [event_target:EVJ24_nakahi_homeworld.GetName]. It is not too late, we could once again defeat the Avatar of Light.'§!\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] narrows his eyes, §H'And consider for one second, we have come so far, would you trust this false god, or would you trust me?'§!"
 
 EVJ24.820.a: "The Avatar of Light told us everything."
 EVJ24.820.a.tooltip: "§Y(dialogue only option)§! I am not sure I can trust you anymore."
 EVJ24.820.a.response: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] recoils, suddenly unsure of himself, as he manages to meekly mutter the words, §H'... I... We... We will talk of this later. Trust me... Please.'§!"
 
 EVJ24.820.b: "You better deliver results."
 EVJ24.820.c: "Surrender yourself, we are handing you over."
 EVJ24.820.c.tooltip: "We know what happened to the Nakahi, this is your problem."
 
 EVJ24.824.desc: "My patience wears THIN, [this.owner.GetSpeciesName]... Bring The JAILER to me now or else I will be forced to take your empire apart PIECE by PIECE until I find him.\n\nI KNOW you are harbouring him somewhere here."
 EVJ24.824.a: "End Communications."
 EVJ24.824.b: "Please, we need more time!"
 EVJ24.824.b.response: "Take your time [this.owner.GetSpeciesName], but not too much..."
 
 EVJ24.825.desc: "I have had ENOUGH of waiting. To DEFY me is such a POOR indication of WORTHINESS. To side with the SINNER makes one-self a SINNER. Now I must undertake divine justice...\n\nYour STARS; they warm your HOMES, power you CITIES and light your HEARTS. Your punishment shall be; to live in DARKNESS. I will PLUCK your precious stars from the sky one by one, until only DARKNESS chills your bones. Then you will fear your GODS, in a cold dark GRAVE."
 EVJ24.825.a: "You are pure evil."
 EVJ24.825.a.response: "No my child; I am only a just GOD."
 
 EVJ24.826.title: "A Divine Punishment"
 EVJ24.826.desc: "The Avatar of Light has promised we will now face a punishment for siding with [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]. A punishment that somehow involves draining our stars of their starlight. If it is actually capable of doing this, it would significantly cripple our ability to generate energy. We must stop it from reaching stars within our territory at any cost."
 EVJ24.826.a: "Understood."
 
 
 EVJ24.830.title: "Epiphany"
 EVJ24.830.desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] takes his expedition to another desolate world. So sure of himself, he barely mentions a word to his team outside of direct orders. On a plain in the northern hemisphere of [event_target:EVJ24_nakahi_homeworld.GetName], he commands his team to dig into the ashen regolith.\n\nFar beneath the ground, days later of continuous shift work, the team are shocked to have uncovered another buried city, undoubtedly of Nakahi origin. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] thinks this was once the Nakahi homeworld.\n\nIt takes only a few further days to excavate a tunnel towards a large open chamber, seeing light for the first time in millenia. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] races inside and recovers a small spherical artifact, covered in delicate and alien mechanisms. With minimal explanation, he demands to speak to us now."
 EVJ24.830.a: "On Screen."
 EVJ24.830.a.tooltip: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] will speak to us now."
 
 EVJ24.831.desc: "There has never been more confidence across [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s calm and collected face as he marvels at the delicately held orb.\n\n§H'I... I remember everything. And oh how I failed. But now we finally have a chance.\n\nThe Nakahi never has a chance to use this weapon. It contains a weapons targetting protocol that exploits weaknesses in the Avatar of Light. This... will give us a fighting chance. I will take it to the frontlines and together we will defeat the Avatar of Light... for good.'§!"
 EVJ24.831.a: "Then go, without delay!"
 EVJ24.831.a.tooltip: "The Avatar of Light will be significantly weakened."
 
 EVJ24.841.desc: "INSOLENT CHILD! You DARE strike down your GOD? Gods exist to RULE over MORTALS as dictated by divine justice. To SCORN these fundamental tennents is SACRILEGE. This demands the most SEVERE punishment... ANNIHILATION.\n\nPrepare to face the full might of your GOD."
 EVJ24.841.a: "Just... Die already!"
 
 EVJ24.846.title: "Planet Scorched"
 EVJ24.846.desc: "The world of [from.GetName] has been scorched by the minions of the Avatar of Light. Nothing living remains on the surface and a massive cloud of ash has buried whatever survived the bombardment. The planet has become completely uninhabitable.\n\nFuture terraforming efforts will be required to return this world to a habitable state."
 EVJ24.846.a: "A sad day."
 EVJ24.846.a.tooltip: "[from.GetName] gains the §Y$terraforming_candidate$§! modifier."
 
 
 EVJ24.851.title: "Avatar of Light Defeated!"
 EVJ24.851.desc_base: "The Avatar of Light has been defeated for the final time. After a lengthy and difficult battle, it has been again weakened to a state where it is unable to fight back. This time, it shows no evidence of returning from near death. \n\nAs this is a personal matter, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has undertaken the task of deciding its fate. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has determined that we shall be:\n\n"
 
 EVJ24.851.desc_01: "$EVJ24.851.desc_base$§dMerciful§!. After having learnt from us the virtue of mercy and the unseen benefits of kindness, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] sees in all sentient beings a capability to adapt change and improve.\n\nHe has delivered the following ultimatem to the Avatar of Light; that they shall leave the mortal realm and return to the shroud and undo the damage they have done, or else face defeat once more. The Avatar of Light, in no position to challenge it has accepted the ultimatem. This will reverse the damage the Avatar of Light has done to the Nakahi.\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] wishes now to speak to us."
 EVJ24.851.desc_02: "$EVJ24.851.desc_base$§dJust§!. He has found that regardless of those involved, of the circumstances or our personal interest in the issue, that the only right course of action is to make a judgement free from bias, investment or emotion. Already, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] is coordinating and commanding an operation to place the weakened Avatar of Light back into [event_target:EVJ24_mau_tona_prison.GetName] prison. Armed with remembered memories, he is confident the repairs necessary to bring the containment field back to full capacity can be acheived quickly.\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] wishes now to speak to us."
 EVJ24.851.desc_03: "$EVJ24.851.desc_base$§dRuthless§!. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has learnt that punishment not only disuades dissent, but also instils confidence and respect. But that overall, like deserves like and morality dictates retribution. As such, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has decided to destroy the Avatar of Light, so that it may harm no-one ever again. The decision was swift and the execution merciless, the Avatar of Light is no more.\n\n[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] wishes now to speak to us."
 EVJ24.851.a: "Marvelous."
 EVJ24.851.a.tooltip: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] wishes now to speak to us."
 
 EVJ24.852.desc_01: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] stands before you reforged, having since donned a soft and regal set of robes over the cold, hard suit of armour he once wore.\n\n§HI owe my life to you. Together we have found my purpose, reinvented my identity and defeated a god. You honour not only me, but the lasting legacy of the Nakahi.'§!\n\nHe draws a deep breath, §H'The Avatar of Light will undo much of the annihilation it wrought, including that which was inflicted to the former Nakahi colonies. Every stone, monument and hall, returned from destruction. But they will lie empty; the Nakahi are still gone. One last cruel lesson from the Avatar of Light.'§!"
 
 EVJ24.852.desc_02: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] stands before you reforged, having since changed outfit, from the cold steel armour he once wore, to a noble uniform.\n\n§HAnd so, this chapter closes, but the story continues. Now with time to rest, I can instruct your forces on the proper maintenance of [event_target:EVJ24_mau_tona_prison.GetName] prison and finally write the manuscript I have always been meaning to. For millenia Mau Tona stood, and for millenia more it will. The Avatar of Light shall remain its Final Convict and I will continue to watch over it. The work of the man of justice is never done.'§!\n\nIn a charming and warming tone, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] adds, §H'But I express my eternal gratitude for your unending confidence and for setting me on the path to finding my redemption.'§!"
 
 EVJ24.852.desc_03: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] stands before you markedly different, having since emblazened his armour with a striking symbol.\n\n§H'And so, finally the Avatar of Light is destroyed. Now the Nakahi are avenged and can finally rest in peace. I bow to you for enabling the destruction of this false god and for finding my redemption.'§!\n\nThe Jailer voice lowers and his eyes narrow, §H'Now all will know the punishment for standing against us. For we, are the god-killers.'§!"
 
 EVJ24.852.a: "Is [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] your real name?"
 EVJ24.852.a.tooltip: "Now that you remember everything, surely you must know."
 EVJ24.852.a.response: "§H'No, it is not.\n\nBut, you honour me by naming me [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name], so whatever I was once called is meaningless.'§!"
 EVJ24.852.b: "What happens now?"
 EVJ24.852.b.response: "§H'My story is over. Now it is yours to tell. But a lifetime of service I owe to you, so a lifetime I will gladly give.'§!"
 EVJ24.852.c: "Is what the Avatar of Light said true?"
 EVJ24.852.c.response: "§H'Unfortunately... Yes. A long time ago, I was young and foolish, I thought the Avatar would merely punish the... 'Blasphemers', to my horror, it decided instead to destroy my people, my home and my family. Ever since, I have been seeking redemption. Only thanks to you, have I finally acheived it.'§!"
 EVJ24.852.d1: "End Communications."
 EVJ24.852.d1.tooltip: "The Avatar of Light will restore a number of planets back to their former glory, then depart this reality."
 EVJ24.852.d2: "End Communications."
 EVJ24.852.d2.tooltip: "The Avatar of Light will return to [event_target:EVJ24_mau_tona_prison.GetName] prison once again."
 EVJ24.852.d3: "End Communications."
 EVJ24.852.d3.tooltip: "The Avatar of Light will be destroyed, gone forever.\n\nAllows to construct 1 '§Y$building_EVJ24_ruthless_monument$§!' building on a colony of our choosing.\n"
 
 EVJ24.921.title: "Justice"
 EVJ24.921.desc_base: "We have acheived victory in the war against the [event_target:EVJ24_justice_target.GetName]!\n\nIn a dominant position, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] as the sole judge, jury and executioner, has undertaken proceedings again our enemies, considering the crimes and injustices and has devised a judgement.\n\nIt has been decided that:"
 EVJ24.921.desc_01: "$EVJ24.920.desc_base$\n-They shall pay economic and scientific reparations for a period of 20 years.\n-They will surrender [this.EVJ24_num_imprisoned_pops] pops for imprisonment in [event_target:EVJ24_mau_tona_prison.GetName] prison.\n\nFinally:\n-They shall immediately extradite their ruler to our possession for criminal punishment.\nWhat sentence shall we serve these extradited war criminals?"
 EVJ24.921.desc_02: "$EVJ24.920.desc_base$\n-They shall pay economic and scientific reparations for a period of 20 years.\n-They will surrender [this.EVJ24_num_imprisoned_pops] pops for imprisonment in [event_target:EVJ24_mau_tona_prison.GetName] prison.\n-They will surrender a relic to our possession.\n\nFinally:\n-They shall immediately extradite their ruler to our possession for criminal punishment.\nWhat sentence shall we serve these extradited war criminals?"
 EVJ24.921.a: "They shall serve us forcibly."
 EVJ24.921.a.tooltip: "We will show them mercy; but the price is servitude."
 EVJ24.921.b: "Send them to prison."
 EVJ24.921.b.tooltip: "They will serve their life sentence in [event_target:EVJ24_mau_tona_prison.GetName] prison."
 EVJ24.921.c: "Execute them."
 EVJ24.921.c.tooltip: "They will executed for their crimes."