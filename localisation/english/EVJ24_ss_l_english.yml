 EVJ24_ancient_colony: "Buried Nakahi Colony"
 EVJ24_ancient_colony_desc: "Buried deep under the surface of this world is a civilisation annihilated in a calamity only 10,000 years ago. So well preserved is this ancient city, that it would take many lifetimes to catalogue and research it all."
 
 EVJ24_avatar_of_light_debuff: "Nakahi Device"
 EVJ24_avatar_of_light_debuff_desc: "This arcane device contains a complex weapons targetting pattern that levels the playing field in confrontations with the Avatar of Light."
 
 EVJ24_avatar_of_light_minion_debuff: "Nakahi Device"
 EVJ24_avatar_of_light_minion_debuff_desc: "This arcane device contains a complex weapons targetting pattern that levels the playing field in confrontations with the Avatar of Light."
 
 mod_damage_vs_country_type_EVJ24_AOL_country_mult: "Damage to the Avatar of Light"
 mod_damage_vs_country_type_EVJ24_AOL_minions_country_mult: "Damage to the minions of the Avatar of Light"
 mod_damage_vs_country_type_shroud_spirits_mult: "Damage to Shroud Entities"
 
 EVJ24_restored_colony: "Restored Nakahi Colony"
 EVJ24_restored_colony_desc: "This planet contains the completely restored colony of the Nakahi who inhabited this world tnes of thousands of years ago, now empty."
 
 EVJ24_timeless_vigil_bonus: "Timeless Vigil"
 EVJ24_timeless_vigil_bonus_desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] watches over our empire, remaining vigilant against any threats which we may face in future."
 
 EVJ24_spooky_modifier: "§EGIVE HIM TO ME§!"
 EVJ24_spooky_modifier_desc: "§ETHE JAILER MUST PAY FOR HIS CRIMES.§!"
 
 EVJ24_shroud_touched: "Shroud Touched"
 EVJ24_shroud_touched_desc: "An ill-conceived attempt to destroy the Final Convict has cursed [event_target:EVJ24_mau_tona_prison.GetName] with terrible the Shroud anomalies."
 
 EVJ24_interned_talent: "Interned Talent"
 EVJ24_interned_talent_desc: "Deep within this penal colony, its rough and hostile environment appears to breed a sort of competence and natural talent. These prisoners must remain imprisoned, but their skills can go to use in governing the colony."
 
 EVJ24_interned_hatred: "Survival of the Fittest"
 EVJ24_interned_hatred_desc: "We have discovered that the prisoners of this penal colony have become savvy, skilled and competent due to harsh living conditions. If we breed this into hostile competition, these prisoners would come pre-battle hardened and make excellent military recruits."
 
 EVJ24_jailer_planet_merciful: "Merciful Convictions"
 EVJ24_jailer_planet_merciful_desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has taken to administering a criminal and justice system with an approach to softer judgements favouring rehabilitation over punishment."
 
 EVJ24_jailer_planet_merciful_2: "Forgiving Culture"
 EVJ24_jailer_planet_merciful_2_desc: "Following [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s efforts, this world has become a destination for those seeking redemption, forgiveness and mercy."
 
 EVJ24_jailer_planet_just: "Unerring Convictions"
 EVJ24_jailer_planet_just_desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has taken to administering this world by the book, and to the letter, regardless of the consequences."
 
 EVJ24_jailer_planet_just_2: "Objective Culture"
 EVJ24_jailer_planet_just_2_desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has bred a culture of objectivity in this colonies population, ensuring all decisions are based on fact and follow all revelant statutes."
 
 EVJ24_jailer_planet_ruthless: "Ruthless Convictions"
 EVJ24_jailer_planet_ruthless_desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has taken to administering this world with an iron fist. Stamping down on crime and villainy with the strong punishments available to him."
 
 EVJ24_jailer_planet_ruthless_2: "Ruthless Culture"
 EVJ24_jailer_planet_ruthless_2_desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has entrenched a society of brutal and ruthless punishments and crack downs on anything that falls foul of the law."
 
 EVJ24_neighbour_humiliation: "Diplomatic Humiliation"
 EVJ24_neighbour_humiliation_desc: "A recent incident involving the abduction of citizens froma neighbouring empire was uncovered and we were forced to apologise."
 
 EVJ24_jailer_intervention: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s intervention"
 EVJ24_jailer_intervention_desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has intervened on instability and elevated crime on this world, providing a temporary aleviaton to both."
 
 EVJ24_relic_activation: "Anti-Crime Operation"
 EVJ24_relic_activation_desc: "Using the heavy handed and detailed programs described in the 'Manuscript of Justice' we are stamping down on crime and rebellious activity."
 
 EVJ24_pop_happiness_debuff: "Ruthlessness Observed"
 EVJ24_pop_happiness_debuff_desc: "This population has felt the ruthless crackdown of [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]."
 
 EVJ24_demonstration: "A Demonstration"
 EVJ24_demonstration_desc: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has demonstrated the penalty for treason; death. Through fear, this will disuade further crime for a while."
 
 EVJ24_AOL_marked: "Marked"
 EVJ24_AOL_marked_desc: "§EThis world will KNOW their GOD.§!"
 
 EVJ24_AOL_god_fearing: "Our God"
 EVJ24_AOL_god_fearing_desc: "We know our god lies in wait, imprisoned. It will break free soon. But even now, his influence bolsters our nation."
 
 EVJ24_AOL_consequence: "God Fearing"
 EVJ24_AOL_consequence_desc: "We fear our gods."
 
 #####################
 # TRAITS
 #####################
 
 EVJ24_leader_trait_iron_fist:0 "Iron Hand Rule"
 EVJ24_leader_trait_iron_fist_desc:0 "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] runs his jurisdictions like clockwork, administered with a regiment of soldiers engaged in state mandated labour, quashing crime and villainy before it has a chance to take hold."
 EVJ24_leader_trait_iron_fist_effect:0 "£job_soldier£ Soldiers also provide §G+1.5§! £stability£ stability, doubled on home planet."
 
 EVJ24_leader_trait_penal_col:0 "Eternal Warden"
 EVJ24_leader_trait_penal_col_desc:0 "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has an unparalleled skill to manage and direct a colony of convicts, expertly extracting maximum productivity from mandated labour."
 EVJ24_leader_trait_penal_col_effect:0 "$PLANET_EFFECTS_TXT$:\n§YPenal Colonies§! gain the following:\n\t$mod_planet_jobs_produces_mult$: §G+20%§!\n\t£pop£  $mod_planet_pops_upkeep_mult$: §G-20%§! \n\t£amenities£ $MOD_POP_AMENITIES_USAGE_BASE$: §G-20%§!\n\t£happiness£ $MOD_POP_HAPPINESS$: §R-20%§!\n\t£mod_pop_growth_speed£ $MOD_POP_GROWTH_SPEED$: §R-20%§!\n\nEffects are halved for other planets in the sector."
 
 EVJ24_leader_trait_penal_col_effect_2:0 "The above modifiers apply only to §YPenal Colonies§!."
 
 EVJ24_leader_trait_commando:0 "Special Forces Verteran"
 EVJ24_leader_trait_commando_desc:0 "Ever since signing onto service with our empire, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has seen no shortage of front line combat. They have become particularly skilled at it, despite the injuries they have sustained along the way."
 
 EVJ24_leader_trait_ancient_hero:0 "Last of the Nakahi"
 EVJ24_leader_trait_ancient_hero_desc:0 "While [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] may have forgotten, he fights for his people and for redemption."
 
 EVJ24_leader_trait_merciful:0 "Atoner"
 EVJ24_leader_trait_merciful_desc:0 "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has learnt to value kindness, empathy and mercy, finding good in all beings."
 EVJ24_leader_trait_merciful_effect: "When a planet has more than §Y75§! £stability£ stability, gain §G+20%§! £mod_pop_growth_speed£ $MOD_POP_GROWTH_SPEED$ and §G+5%§! £pop_cat_specialist£ Specialist pop resource output, halved for other planets in the sector."
 
 EVJ24_leader_trait_just:0 "Timeless Vigil"
 EVJ24_leader_trait_just_desc:0 "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has learnt that acheiving justice is a task in patience and making considered, not personal, decisions."
 EVJ24_leader_trait_just_effect:0 "§G+4§! £mod_country_naval_cap_add£ $MOD_COUNTRY_NAVAL_CAP_ADD$ from £job_soldier£ [GetSoldier] Jobs, halved for other planets in the sector."
 
 EVJ24_leader_trait_ruthless:0 "The God-Killer"
 EVJ24_leader_trait_ruthless_desc:0 "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has learnt that like deserves like and that justice is found in vengeance. [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has become the God-Killer."
 
 EVJ24_leader_trait_shroud_touched: "Shroud Touched"
 EVJ24_leader_trait_shroud_touched: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] has touched the shroud, and it scarred him."
 
 EVJ24_leader_trait_sp_commander: "Harsh Origins"
 EVJ24_leader_trait_sp_commander_desc: "This commanders unique experiences fighting for survival on a harsh penal colony has taught them them invaluable lessons."
 EVJ24_leader_trait_sp_official: "Harsh Origins"
 EVJ24_leader_trait_sp_official_desc: "This commanders unique experiences fighting for survival on a harsh penal colony has taught them them invaluable lessons."
 
 EVJ24_leader_trait_jailer_protege: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'s Protégé"
 EVJ24_leader_trait_jailer_protege_desc: "After a recent incident involving this leader, they are being closely supervised and taught by [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]"
 
 
 ##########################
 # SPECIAL PROJECTS
 ##########################
 
 EVJ24_SYSTEM_DISCOVERY_PROJECT:0 "Investigate Purpose of Megastructure"
 EVJ24_SYSTEM_DISCOVERY_PROJECT_DESC:0 "Our scientists are awash with speculation over the purpose of a colossal energy field containing a star in the [From.GetName] system. Other than this feature, the megastructure it is attached to seems to be a simple prison, but of colossal proportions."
 
 EVJ24_INTRO_REPAIR_PRISON: "Repair Defence Grid"
 EVJ24_INTRO_REPAIR_PRISON_DESC: "An attack by a psionic entity has disabled the defence grid of the megastructure. Urgent repairs are needed to make it operational once again."
 
 EVJ24_INTRO_FIND_JAILER: "Find [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]"
 EVJ24_INTRO_FIND_JAILER_DESC: "After the attack on the prison, the we have not been able to re-establish contact with the individual calling itself '[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]'. We should conduct a search and study of the facility to find them."
 
 EVJ24_MIDDLE_1_SYSTEM: "Follow [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]"
 EVJ24_MIDDLE_1_SYSTEM_DESC: "We have received a covert and cryptic message from [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] who is nowhere to be found. The message indicates he was covertly investigating a conspriacy involving senior leadership. The message instructed us meet him in the [event_target:EVJ24_temp_system.GetName] system."
 
 EVJ24_MIDDLE_1_PIRATE_BASE: "Raid Privateer Hide-Out"
 EVJ24_MIDDLE_1_PIRATE_BASE_DESC: "We have intercepted a covert gathering of unknown and hostile privateers, supposedly linked to a conspiracy involving [event_target:EVJ24_temp_nefarious_leader.GetName]. We have disabled their defences and are poised to seize their hide-out to get to the bottom of this plot.\n\n§RThis Special Project must be executed by §Y[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name]§! himself.§!"
 
 EVJ24_MIDDLE_1_INVESTIGATE_SHIPS: "Investigate Disappearance"
 EVJ24_MIDDLE_1_INVESTIGATE_SHIPS_DESC: "The crew of the mothball fleet led by [event_target:EVJ24_temp_nefarious_leader.GetName] have simply disappeared from existence. Is there any any explanation or evidence of where they went?"
 
 EVJ24_MIDDLE_4_PRIMITIVE_WORLD: "The Nakahi Exodus"
 EVJ24_MIDDLE_4_PRIMITIVE_WORLD_DESC: "Evidence from a recent archaeological site suggests The Jailer's ancestors, the Nakahi, fled from a calamity to this world, this day inhabited by a primitive civilisation. Are the Nakahi still one this world today?"
 
 EVJ24_END_2_REMEMBER: "Salvation from the Avatar of Light"
 EVJ24_END_2_REMEMBER_DESC: "[event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] tells us he remembers a world which contains a means to defeat the Avatar of Light. It apparently is located deep beneath the surface of this world."
 
 EVJ24_MIDDLE_3_DIG: "The Jailer's Crimes"
 EVJ24_MIDDLE_3_DIG_DESC: "Coordinates from a dubious vigilante point to this location, a location that apparently contains details of The Jailer's supposed crimes."
 
 EVJ24_MIDDLE_3_ASSAULT: "Tactical Operation"
 EVJ24_MIDDLE_3_ASSAULT_DESC: "In a desperate final attempt, the vigilantes have comandeered one of our lesser defended colonies. They offer to return control of the colony to us, if we hand [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] over to them. Instead, [event_target:EVJ24_jailer_leader.EVJ24_get_jailer_name] will lead a tactical operation to destroy the vigilante commandos who commandered the colony."
 
 #######################
 # SITUATIONS
 #######################
 
 situation_EVJ24_end1_prisonbreak:0 "Containment Field Collapse"
 situation_EVJ24_end1_prisonbreak_type:0 "Containment Field Collapse"
 situation_EVJ24_end1_prisonbreak_desc:1 "A primary containment field generator on [event_target:EVJ24_mau_tona_prison.GetName] has failed. The field is at risk of failing and the Final Convict, trapped inside the star, may be set free!"
 situation_EVJ24_end1_prisonbreak_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_little_control$"
 situation_EVJ24_end1_donothing:0 "Do Nothing"
 situation_EVJ24_end1_donothing_tt:0 "We are unable to resolve the situation. All we can do it watch it unfold."
 situation_EVJ24_end1_slowitdown:0 "Bolster Remaining Generators"
