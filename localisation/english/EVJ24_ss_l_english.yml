 r_EVJ24_manuscript: "Manuscript of Justice"
 r_EVJ24_manuscript_desc: "This detailed and enigmatic manuscript written by The Jailer describes the steps required to quash crime, rebellion and villainy. When needed, we can deploy the crackdown programs it provide to round-up criminals, miscreants and dissidents to imprison then in a penal colony."
 EVJ24_relic_active_tooltip: "\nOnce the modifier ends, §Y1-3§! pops will created on a penal colony, if one exists."
 
