# Mictla_l_english_events
# Pat173

l_english:

 NAME_Mictla:0 "Mictla, Whispering Aggregation"

 mictla_catchphrase:0 "We will bring your empire to greater heights."

 mictla_backstory:0 "A poorly understood group of molecules that have acquired sapience and a [mictla_species.GetName] as vessel. It holds great knowledge over life and death, and it seeks greater understanding of the world around it."

 mictla_events.1.name:0 "Out of the bottle"

 mictla_events.1.desc:0 "The Sarcophagus has opened back up, out from it comes a different person. A [mictla_species.GetAdj] yes, but not the same [mictla_species.GetAdj] that went into the sarcophagus, their features unsettling. It wishes to speak to us."
 
 mictla_events.2.name:0 "Mictla, Whispering Aggregation"

 mictla_events.2.desc:0 "We thank you [Root.GetRulerTitle] [Root.GetRulerName]. Too long have We been contained in this desolate moon, for this new vessel let us thank you. We are known as Mictla, and We will bring your empire to greater heights."

 mictla_events.question.a:0 "What are you?"

 mictla_events.desc.a:0 "We are Mictla, a compound of molecular understanding that reaches out and learns through vessels like this one. We seek to support you and all [Root.GetSpeciesNamePlural]."

 mictla_events.question.b:0 "What happened here?"

 mictla_events.desc.b:0 "We were venerated, aiding the inhabitants of this solitary moon. However, fear drove them to betray us. We reached out to all life, making them part of us. They became us, and we returned to our seal to wait for eons."

 mictla_events.question.c:0 "What happened to the [mictla_species.GetName] that entered the sarcophagus?"

 mictla_events.desc.c:0 "They are now us. We are their language, views, and manners. They are part of us, and we are part of them. §RWe grow our understanding§!."

 mictla_events.2.a:0 "Hire Mictla"

 mictla_events.2.a_custom_tooltip:0 "§LYour knowledge will be invaluable to our empire!§!"

 mictla_events.2.d:0 "Dismiss"

 mictla_events.2.d_custom_tooltip:0 "§LWe can't trust the twisted words of a corpse puppeteered by a parasite!§!"

 mictla_events.1.name:0 "Out of the bottle"

 mictla_events.1.desc:0 "The Sarcophagus has opened back up, out from it comes a different person. A [mictla_species.GetAdj] yes, but not the same [mictla_species.GetAdj] that went into the sarcophagus, their features unsettling. It wishes to speak to us."

 mictla_events.3.name:0 "Wail Backfires"

 mictla_events.3.desc:0 "After activating the Wailing Resonance by providing organic matter to amplify its modified signal with, many among our population have experimented psychological and physiological changes. Rumors of divine visions, disease-curing miracles, and the anticipation of salvation have spread. Some have started praising Mictla as a divine figure that will protect them from suffering. \n\nThis change among our population appears accidental, likely a result of Mictla having a [mictla_species.GetName] vessel. \n Nevertheless, this widespread psychological shift is sure to cause turmoil within our society."

 mictla_events.3.b:0 "We must address this"

 mictla_events.3.a:0 "This is a sign of divinity!"

 mictla_events.3.c:0 "Without Mictla, many in our population feel abandoned."

 mictla_events.4.name:0 "Mictla is gone"

 mictla_events.4.desc:0 "With Mictla gone from [Root.Owner.GetName], many in our population feel abandoned and hopeless. This sentiment might take years to amend."

 mictla_events.5.name:0 "Mictla Ascends"

 mictla_events.5.desc:0 "The Wailing incident is over, and the people now sing praises and pray for Mictla, as they have been recognized as our new guides in this uncertain world. The cult of Mictla has now become the majority within our population, and plans to allow Mictla to reach onto us, faithful servants, are now in place. This marks the dawn of a new era for our nation."

 mictla_events.5.a:0 "¡¡¡We're going on an adventure!!!"

 mictla_events.6.name:0 "Mictla Assimilation"

 mictla_events.6.desc:0 "You have allowed us to reach onto you; you are us, and we are you. We are eternally grateful for the knowledge and the learning. We understand [Root.owner_species.GetNamePlural] and our symbiosis is assured. With this greater reach and understanding, we will surely become the greatest we could ever be."

 mictla_events.6.a:0 "Mictla be praised!"

 mictla_events.7.name:0 "Cult of Mictla Supressed"

 mictla_events.7.desc:0 "The Wailing incident is over. With our heavy-handed supression and purging of the cult of Mictla, our country is slowly returning to normalcy. It will still take time for the individual minds of our people to recover. \n\n§GMictla claims they will ensure further activations of the Resonance Wail do not affect our population§!."

 mictla_situation_events.1.name:0 "Cultist Purge"

 mictla_situation_events.1.desc:0 "To address the growing crisis, we have resorted to suppressing and purging any supporters of the Cult of Mictla. This has involved mass raids, political assassinations, and open skirmishes with extremists. While our people may not be pleased by these actions, it has proven effective at halting the growth of the Cult."

 mictla_situation_events.1.a:0 "Many more will suffer if the cult is not stopped."

 mictla_situation_events.1.b:0 "The horror.."

 mictla_situation_events.2.name:0 "Veneration growing"

 mictla_situation_events.2.desc:0 "The belief in Mictla's divinity is on the rise, and more and more people are becoming vocal about their dissatisfaction with the current leadership in [Root.Owner.GetName]. Those who once held discontent due to turmoil now desire change."

 mictla_situation_events.3.name:0 "Intensifying Devotion"

 mictla_situation_events.3.desc:0 "Mictla's divinity has grown at an unprecedented speed, perhaps due to the nature of the Wailing incident. Now, many of our leaders and a significant portion of the population stand behind the belief that Mictla will guide us to a better tomorrow, and they must ascend as our eternal leader. Plans for the transition of power have been drafted, and more people have rallied in both praise and protest."

 mictla_situation_events_popsDied:0 "Some pops will be destroyed."

 mictla_situation_events_popsConverted:0 "Some pops will be converted"

 mictla_pulse_events.1.name:0 "Flesh Shaping"

 mictla_pulse_events.1.desc:0 "We would like to help [Root.Owner.GetName] with our faculties. Let us reach onto organic matter; large, gargantuan piles of matter. We will provide a weapon like no other."

 mictla_pulse_events.1.a:0 "Strike fear into my enemies!"

 mictla_pulse_events.1.b:0 "What a terrible tool of violence."

 mictla_pulse_events.2.name:0 "Tuned Cells"

 mictla_pulse_events.2.desc:0 "We would like to help [Root.Owner.GetName] with our faculties. Let us reach onto great minds; outstanding, genius minds. We will ensure their knowledge is maintained and perpetuated."  

 mictla_pulse_events.2.question.a:0 "Won't this assimilate them into you like it did your vessel?"

 mictla_pulse_events.2.question.a.desc:0 "We understand the [Root.owner_species.GetNamePlural] are not keen to be reached. We will ensure they remain themselves while we are within them."
 
 mictla_pulse_events.2.a:0 "This offer is too generous despite what our people may think"

 mictla_pulse_events.2.b:0 "Mictla be praised! for they bless us with life."

 mictla_pulse_events.2.c:0 "We won't let a parasite within our leaders."

 mictla_pulse_events.3.name:0 "Price to Pay"
 mictla_pulse_events.3.desc:0 "We would like to make a request. We must reach further, onto more knowledge, more understanding. §RLet us reach onto [mictla_sacrifice.GetName].§! With this, we will be of greater help to the [Root.owner_species.GetName]."

 mictla_pulse_events.3.a:0 "You may reach onto [mictla_sacrifice.GetHerHis]."

 mictla_pulse_events.3.b:0 "We refuse to sacrifice [mictla_sacrifice.GetHerHis] to you."

 mictla_pulse_events.3.c:0 "Enough sacrifices!"

 mictla_pulse_events.4.name:0 "Whispering Resonance"
 mictla_pulse_events.4.desc:0 "We require help. Now that we are free again, we can sense it anew; it calls for us. Help us reach our destiny, our learning. And we will surely be of greater help."

 mictla_pulse_events.4.question.a:0 "What are you talking about?"

 mictla_pulse_events.4.question.a.desc:0 "The Resonance. We have sensed it for eons; it calls for us. We must reach onto it, make it us. We were surely destined for it."