 # Event Chains
 celestial_interdimensional_pursuit_title: "Interdimensional Pursuit"
 celestial_interdimensional_pursuit_desc: "The Base of Convergence, known to be home to all manner of things extradimensional and alien, is acting strange. No doubt The Astral Corps are behind some of this. What could they want?"
 celestial_chain.101.name: "The Lock"
 celestial_chain.101.desc: "We have received reports about strange occurrences near the §YBase of Convergence§!. After a sudden burst in energy from the central vortex, scanners have shown that the energy both emitted and absorbed by the rift has drastically dropped. In fact, a luminescent barrier of some sort seems to have formed over the vortex.\n\nWe suspect the §HThe Astral Corps§! to be behind this, though what they hope to gain from this is entirely unknown."
 celestial_chain.101.a: "Disconcerting."
 celestial_chain.102.name: "A Visit from the Corps"
 celestial_chain.102.desc: "While investigating the changes to the vortex at the §YBase of Convergence§!, a transmission was sent to us from The Astral Corps. However, it was not from the orbital station, but rather from the vortex itself. This could potentially be dangerous."
 celestial_chain.102.a: "On screen."
 celestial_chain.103.desc: "§BTransmission secured. Receiving dedicated transmission:§!\n\n§Y[Root.GetSpeciesName]. We would not contact you if this was not a vital matter. We have reason to believe that a high-profile fugitive is present in your dimension.\n\nThey go by many names: The Interdimensional Vagabond, the Great Zah'gul...\n\n§HThe Celestial Wayfarer§!.\n\nWould you happen to know anything about this? We are willing to offer §Hlarge§! rewards for information.§!"
 celestial_chain.103.a: "What have they done to warrant this chase?"
 celestial_chain.103.a.reply: "§YThat is classified. In fact, it may very well be dangerous for you to know.\n\nAll you need to know is that their ability to traverse worlds... it is a monumental threat to the stability of the universe.\n\nWe ask you since you were the ones who discovered that strange compass. In fact, we are almost certain the Wayfarer was behind that hijacking of this outpost's Keeper Unit.§!"
 celestial_chain.103.b: "We can tell you where they are."
 celestial_chain.103.c: "We know not of this Wayfarer."
 celestial_chain.104.desc: "§YAh, how fortunate. Transmit the necessary data to the outpost over the Base of Convergence, and we will take it from there.\n\nYou made the right choice.§!\n\nThank you for your cooperation. Be assured, the Astral Corps will provide ample reward."
 celestial_chain.104.a: "Understood."
 celestial_chain.105.desc: "§Y...how disappointing.\n\nBe assured, any attempts of deception and manipulation will not go unpunished. You know not of the importance of this mission.§!\n\n§BConnection terminated.§!\n\nThank you for your time. Remember, the Astral Corps fights for §Hyou§!!"
 celestial_chain.105.a: "How strange..."
 celestial_astral_endowment: "Interdimensional Endowment"
 celestial_astral_endowment_desc: "Selling information to the Astral Corps is certainly beneficial to the economy."
 celestial_chain.106.name: "Wayfarer's Disappearance"
 celestial_chain.106.desc: "Recently, our transmissions with §YCelestial Wayfarer§! have been met with no response. After an attempt to confront the scientist in their quarters, our researchers were met with no presence of the Wayfarer, their room in quite the disarray.\n\nEither they were quick to flee, or they were taken. Either way, this does not bode well for their safety."
 celestial_chain.106.a: "Attempt to find them."
 celestial_chain.107.name: "Unknown Transmission"
 celestial_chain.107.desc: "Despite our best efforts at discovering clues and hints to the whereabouts of the Celestial Wayfarer, our research team has found next to nothing. In fact, it seems that despite the mess of their quarters, the Wayfarer did a good job leaving almost no trace behind.\n\nHowever, we were lucky enough to come across their radio-communication device. Not their usual one, that is. One of a very antiquated design. The peculiar nature of it prompted one of our researchers to activate it.\n\nIt seems to be broadcasting a private transmission!"
 celestial_chain.107.a: "On screen."
 celestial_chain.108.name: "Unknown Transmission"
 celestial_chain.108.desc: "... Hello? Can you... me...\n\nPlease..."
 celestial_chain.108.a: "This is [Root.GetRulerTitle] [Root.GetRulerName]. Who are you?"
 celestial_chain.109.name: "The Wayfarer"
 celestial_chain.109.desc: "Oh, it is so good to see you, [Root.GetRulerName]! I was beginning to worry you'd never find me.\n\nI'm sure you're aware of The Astral Corps and their, well, disdain for me. I can assure you, this manhunt is completely unjustified and... well, let's not get into it right now.\n\nI have a plan. And I need your help."
 celestial_chain.109.a: "Why are they after you?"
 celestial_chain.109.a.reply: "Ugh, long story. The guy in charge? He's an absolute narcissist. Thinks that only he should be allowed the power to traverse dimensions and takes it upon himself to stop anyone who opposes him.\n\nLook, have I caused a bit of trouble at times? Sure. Did I hack the outpost at the Base of Convergence? Absolutely...\n\nWhere was I going with this? Anyway, he's brutal, probably insane."
 celestial_chain.109.b: "What does this plan entail?"
 celestial_chain.109.b.reply: "Look, the only reason they're here is because they know I'm in this dimension. They're able to detect the formation of rifts in time-space, so they know exactly where I go and when.\n\nBut, I know how to disrupt their detectors. At the very least disable them for a time. I will lure them away to another world, and that's when you do the dirty. They can't detect me, I get back here: boom, we're good.\n\nYou in?"
 celestial_chain.109.c: "We will help you."
 celestial_chain.109.c.reply: "Great! I knew you would. We gotta be quick, I'll transmit the details to your researchers."
 celestial_chain.109.d: "Sorry, you're on your own."
 celestial_chain.109.d.reply: "...what? You're joking right?\n\nThat's pretty funny, I'll tell you that. Got me, haha...\n\nYou're serious, aren't you? Was it the Corps? Did they pay you off, huh? Must've been quite a lot. Damn scumbag, rot in hell."
 celestial_dimensional_disruption: "Disrupting the Corps"
 celestial_dimensional_disruption_DESC: "The Astral Corps are after the Celestial Wayfarer; using the blueprints sent by the Wayfarer, disabling their equipment will allow the Wayfarer to escape from the Corps safely."
 celestial_chain.110.desc.1: "§BTransmission secured.§!\n\nSalutations, [Root.GetSpeciesName]. Thanks to your information, we were successful in tracking down Zah'gul, the Vagabond.\n\nRest assured, they will be dealt with properly and fairly in accordance to their crimes.\n\nWe will not be in contact again."
 celestial_chain.110.a: "Was this the right thing to do?"
 celestial_chain.110.desc.2: "§BTransmission secured.§!\n\nSalutations, [Root.GetSpeciesName]. Despite your refusal to aid us, we were successful in tracking down Zah'gul, the Vagabond.\n\nRest assured, they will be dealt with properly and fairly in accordance to their crimes. We are providing the benefit of the doubt and permitting your continued liberty.\n\nWe will not be in contact again."
 celestial_wayfarer_killed: "§HThe Celestial Wayfarer§! has been captured"
 celestial_chain.110.b: "Uh oh..."
 celestial_chain.111.desc: "Well, if it isn't the [Root.GetName].\n\nYou'll be glad to know, or perhaps not, that I managed to escape the Astral Corps, yet again, no thanks to you.\n\nAnyway, I am willing to place our past behind us, since I have almost no other place to go to, safely, at least. So as much as this pains me to say, I am back to work.\n\nExpect my retirement sooner, though."
 celestial_chain.111.a: "How did you escape?"
 celestial_chain.111.a.reply: "Oh, you're interested §Hnow§!?\n\nWell, I was captured by a Astral Corps team for a short time. And yeah, I wasn't killed, but they sure enjoyed torturing information out of me. They were too dumb to take off my equipment beforehand."
 celestial_chain.111.b: "Good to have you back."
 celestial_chain.112.name: "Project Complete"
 celestial_chain.112.desc: "Our team in orbit of the Base of Convergence finished constructing a makeshift device based on the Wayfarer's rather crude notes. Upon activation, a large blast was released which echoed throughout the entire star system with a low droning sound.\n\nIt appears as though the vortex itself reacted to the detonation, with a sudden burst of energy from the center of the rift.\n\nWhether the device worked or not, is still unknown to us."
 celestial_chain.112.a: "Let us hope for the best."
 celestial_chain.113.desc.1: "§BTransmission secured.§!\n\nSalutations once again, [Root.GetSpeciesName].\n\nWe wish to inform you of the departure of the Astral Corps from this dimension, though the outpost center over the vortex will remain intact.\n\nConsidering your previous deception with regards to the Wayfarer's location, we will be ceasing all current aid and/or rewards.\n\nGoodbye."
 celestial_chain.113.a: "Well, at least it worked."
 celestial_chain.113.desc.2: "§BTransmission secured.§!\n\nSalutations once again, [Root.GetSpeciesName].\n\nWe wish to inform you of the departure of the Astral Corps from this dimension, though the outpost center over the vortex will remain intact. As per usual, we will offer a small amount of resources as compensation for your trouble.\n\nGoodbye."
 celestial_chain.113.b: "Understood."
 celestial_chain.114.name: "The Return"
 celestial_chain.114.desc: "Some time has passed since the Astral Corps has ceased their search for the Celestial Wayfarer here, and the scientist have finally returned to our service.\n\nThey reported that the project was a success, and they are no longer being pursued, nor does the Corps know of their current location.\n\nThe whole ordeal has left the Wayfarer quite stressed and worried, but for a time, at least, the Wayfarer is safe to continue their work with us."
 celestial_chain.114.a: "Wonderful."
 celestial_diplo_awol: "§LThere is no response.§!"
 celestial_wayfarer_returns: "§YThe Celestial Wayfarer§! returns to us"
 celestial_wayfarer_gone_awol: "§YThe Celestial Wayfarer§! has disappeared"
 
 # Archaeological Sites
 celestial_mission_site_intro: "§LThe dimensional rift leads to another world, one we know frighteningly little about. To truly understand it, we must enter.§!\n\n"

 site_r_celestial_aetherial_codex: "Glyphs of a Forbidden Scroll"
 site_r_celestial_aetherial_codex_desc: "$celestial_mission_site_intro$Tales tell of a tome inscribed with celestial glyphs, apparently holding great and powerful knowledge. Some say this knowledge is enough to drive a person mad, but we seek it nonetheless."
 celestial_chain.302.name: "Alien Symbols"
 celestial_chain.302.desc: "Upon entering the vortex, our expedition team was met by a deep void, not too dissimilar to our own, but with elusive, glowing glyphs of an unknown language floating in the depths of space.\n\nThe void stretches on infinitely, or so it seems. Our only potential path forward is through the aetherial glyphs floating in amongst the dark."
 celestial_chain.302.a: "Study these odd glyphs."
 celestial_chain.303.name: "An Out of Body Experience"
 celestial_chain.303.desc: "Studying the glyphs as an attempt to translate their meanings has not resulted in a lot of success initially. However, after the Celestial Wayfarer approached one of the glyphs alone, the floating symbol began to glow with a sharp light, leaving the Wayfarer frozen, apparently in the literal sense.\n\nThe Wayfarer remained alone in space for hours, until they were manually retrieved by a crewmember. Even upon bringing them back onto the ship, they remained in a trance, their only remaining eye shining with a deep blue."
 celestial_chain.303.a: "Ensure their immediate recovery."
 celestial_chain.304.name: "Library at the End of the World"
 celestial_chain.304.desc: "After so long, the Wayfarer has finally recovered from their mysterious trance. They initially struggled to recall their memories, but then they began to recite a string of words, apparently echoing in their head during their contact with the glyph.\n\nThey also recall visions of a lone building of a magnificent scale within this same void. Perhaps the other glyphs have more secrets to tell."
 celestial_chain.304.a: "Continue the study."
 celestial_chain.305.name: "A Celestial Poem"
 celestial_chain.305.desc: "In what may have been a rather bold plan, several members of the ship crew went out in a similar fashion to the Celestial Wayfarer, placing them in a trance.\n\nWe have collected the reports of each person placed in trances, each linking together to reveal what is expected to be a poem of some kind. Now, the crew are working on deciphering the meaning behind this text, potentially linking them to the strange glyphs."
 celestial_chain.305.a: "Good, report any findings."
 celestial_chain.306.name: "The Aetherial Codex"
 celestial_chain.306.desc: "After a massive breakthrough, the expedition crew uncovered the truth behind the glyphs surrounding the ship in the endless void: they are coordinates, pointing to a cosmic building called the §YCelestial Library§! in the text we deciphered.\n\nFollowing the coordinates led to the very same building seen by the Wayfarer. Within the building's elegant doors, amongst the walls of intricate designs, there lay a scroll of sorts. The Celestial Wayfarer immediately approached the relic, claiming it to be the famed §HAetherial Codex§!. It is now in our possession."
 celestial_chain.306.a: "Splendiferous."

 site_r_celestial_profane_arca: "Extrasensory Tome"
 site_r_celestial_profane_arca_desc: "$celestial_mission_site_intro$A most peculiar artifact is said to exist in another world, using some form of what could be called 'magic' to coerce and affect the minds of others."
 celestial_chain.402.name: "Endless Seas"
 celestial_chain.402.desc: "Upon coming through the other side of the vortex, our science crew was stunned by a beautiful landscape of endless deep and tranquil water, the darkening sky burning with a sharp azure.\n\nAs the blazing blue sun set, the ship approached what appeared to be a quaint village on a lone island in the sea. Scans reveal no other obvious land on the otherwise oceanic world."
 celestial_chain.402.a: "Interesting."
 celestial_chain.403.name: "A Psionic Encounter"
 celestial_chain.403.desc: "Landing on the island, our vessel was immediately approached by a horde of alien tribes-people, covered in various blue and purple markings. Their appearance is akin to a mix of arthropoid bodies with the limbs of reptilians, truly a rather peculiar species.\n\nAs they watched at the crew closely, the Celestial Wayfarer, assuming them to be primitives, began to use their translator device to attempt to speak with the aliens, when they were surprised by a strange voice in their head. Clearly, the tribes-people were communicating through some psionic methods."
 celestial_chain.403.a: "Quite peculiar..."
 celestial_chain.404.name: "A Taboo"
 celestial_chain.404.desc: "After spending some time with the aliens, known as the Zy'gons, we have learned a lot about their ways of life. They are extremely intelligent, almost equivalent to a typical [Root.Owner.GetSpeciesName], but they have chosen to remain in their old, primitivistic way of life, citing it to be more gratifying.\n\nFinally, the Wayfarer asked them about the so-called Tome of Melody we are after. There was silence in the crowd, initially, and a growl (the first audible noise heard from the Zy'gon).\n\nOne alien, taller than the others, came forward with information, informing us about the relic being locked behind in a tomb long ago, out of fear for its power."
 celestial_chain.404.a: "This will not stop us."
 celestial_chain.405.name: "Cave of Echoes"
 celestial_chain.405.desc: "Our expedition team began to journey through a crevice in the ground, previously covered by a great stone boulder. We have been told it is not very far, but have been also warned about the dangers it can pose. It will not dissuade us.\n\nAlmost immediately, a faint drumming began to echo throughout the tunnel towards the relic, pulsing louder as the crew approached the forbidden relic. The maze-like interior will be difficult to navigate quickly, though the musical ringing may prove to be useful in the search."
 celestial_chain.405.a: "Continue the search."
 celestial_chain.406.name: "The Profane Tome"
 celestial_chain.406.desc: "The previous light drumming has now developed into a strange cacophony of various musical instruments, some never heard before by any member of the [Root.Owner.GetName]. The strange harshness was rising to deafening levels, but finally there stood a pillar, one with a large book on top.\n\nThe Wayfarer approached the pillar cautiously, both their heart and the drums beating with more and more vigour. Until, it stopped. All the sounds stopped. The Wayfarer peered over to see the dust and dirt covering the tome, its golden corners shining through despite its age.\n\nThe relic is now ours."
 celestial_chain.406.a: "Splendid."

 site_r_celestial_quantum_gem: "Shard of Convergence"
 site_r_celestial_quantum_gem_desc: "$celestial_mission_site_intro$Even the wise Wayfarer knows shockingly little about this mysterious shard. It is said to hold some sort of power similar to the Base of Convergence, acting as a conduit between worlds."
 celestial_chain.502.name: "White-Out"
 celestial_chain.502.desc: "A dimension of pure white. There is nothing beyond the rift apart from the endless blank void. Is this the wrong dimension, or has the relic been taken already?\n\nThe only thing to do is study the environment, perhaps scan for anything else in the dimension? This may prove futile, but there is no other clear path forward."
 celestial_chain.502.a: "Do what you can."
 celestial_chain.503.name: "A Lone Shard"
 celestial_chain.503.desc: "The endless blankness may be all that is present in this dimension. There seemed to be nothing, until the Wayfarer claimed to see, quite clearly, one lone crystal. It emitted a light green glow, but the crystal itself appeared black.\n\nAnd yet, when the team clamoured together to see this phenomenon, there was nothing. A result of their delirium, or something more?"
 celestial_chain.503.a: "There may be more to this world..."
 celestial_chain.504.name: "Quantum Fluctuations"
 celestial_chain.504.desc: "The shard is indeed real, and furthermore, there are more. The shards exhibit quantum properties on a macroscopic scale, seeming to persist in all states at once until it is observed, where it remains in a singular state.\n\nThere seems to be nothing particularly unique or special about these shards, apart from their quantum behaviour. The team is currently working on collecting any shards for study."
 celestial_chain.504.a: "Keep an eye on these shards."
 celestial_chain.505.name: "Quantum Entanglement"
 celestial_chain.505.desc: "Several shards have since been collected and studied separately; they truly exhibit no other behaviours and seemingly have no other use, despite being made of an unknown element. However, when two shards were brought close together, what seemed to be faint echoes could be heard from both shards.\n\nCoincidentally, the crew piloting the ship reported a sudden change in environment; the pure white was transforming into a deep blue, with shining specks of red, orange and blue. Likely stars."
 celestial_chain.505.a: "Surely more than a coincidence?"
 celestial_chain.506.name: "Quantum Echo Prism"
 celestial_chain.506.desc: "With quite little regard for safety, the Celestial Wayfarer, with a small group of crewmembers, brought together the various crystalline shards. The echoes returned, getting louder as another shard approached, allowing for a clearer understanding, were it not for the cacophony of different echoes. And in fact, the previously-white environment continued to transform even more, away from the more typical view of space, at an alarmingly faster rate.\n\nThere seemed to be no clear reason or common factor between each state. Sometimes it was a random place in space, or a lush landscape, sometimes a dimension of blinding energies and whispers, sometimes it was impossible to tell.\n\nThen, when the last shard was added to the collection, a sudden flash of white surrounded the ship, and then it all stopped. It was once again pure white, and the shards joined together into one large prism."
 celestial_chain.506.a: "Good."

