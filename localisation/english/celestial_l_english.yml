 celestial.1.desc: "Activating the §HAetherial Codex§! requires one to read the words etched onto the scroll. §Y[celestial_codex_target.GetName]§! was the one to do so.\n\nAs [celestial_codex_target.GetSheHe] read from the codex, [celestial_codex_target.GetSheHe] gained great knowledge about previously unknown technologies and information, allowing a great boost for our [Owner.GetScientistPlural].\n\nHowever, as a consequence of this unforetold power, [celestial_codex_target.GetName] writhed in pain as their body was overcome by the strange powers of the taboo scroll. We remain to see how they are affected as a result."
 celestial.1.a: "Understood."
