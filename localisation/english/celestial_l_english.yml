 celestial_relic_desc_1a: "§HThe Aetherial Codex§!"
 celestial_relic_desc_1b: "A strange, mystical relic. It "
 celestial_relic_desc_1c: "apparently holds forbidden "
 celestial_relic_desc_1d: "knowledge, but may grant"
 celestial_relic_desc_1e: "great knowledge."
 celestial_relic_desc_1f: "Cost: §Y£energy£ 5000§!"
 celestial_relic_desc_2a: "§HThe Otherworldly Crystal§!"
 celestial_relic_desc_2b: "There is said to be a great"
 celestial_relic_desc_2c: "crystal beast within the deep"
 celestial_relic_desc_2d: "void. No explorer has"
 celestial_relic_desc_2e: "returned from the journey."
 celestial_relic_desc_2f: "Cost: §Y£energy£ 5000§!"
 celestial_relic_desc_3a: "§HRemnants of the End§!"
 celestial_relic_desc_3b: "Many dimensions are dying,"
 celestial_relic_desc_3c: "their secrets lost. But we are not"
 celestial_relic_desc_3d: "one to lose such treasures"
 celestial_relic_desc_3e: "of a dying world."
 celestial_relic_desc_3f: "Cost: §Y£alloys£ 2000§!"
 celestial_relic_desc_4a: "§HDimensional Conduit§!"
 celestial_relic_desc_4b: "Dimensions and worlds weave"
 celestial_relic_desc_4c: "together, with these conduits"
 celestial_relic_desc_4d: "allowing such traversal."
 celestial_relic_desc_4e: "Many desire such devices."
 celestial_relic_desc_4f: "Cost: §Y£energy£ 5000§!"
 celestial_relic_desc_5a: "§HEntanglement§!"
 celestial_relic_desc_5b: "Manipulating realities is a risky"
 celestial_relic_desc_5c: "endeavour, but may prove"
 celestial_relic_desc_5d: "useful. Some fear"
 celestial_relic_desc_5e: "uncertainty, but we do not."
 celestial_relic_desc_5f: "Cost: §Y£minerals£ 4000§!"
 celestial_relic_desc_6a: "§HThe Psionic Arca§!"
 celestial_relic_desc_6b: "One should not fear the horrors"
 celestial_relic_desc_6c: "within the void, for they hold"
 celestial_relic_desc_6d: "unimaginable powers,"
 celestial_relic_desc_6e: "remaining unforeseen to us."
 celestial_relic_desc_6f: "Cost: §Y£energy£ 5000§!"

