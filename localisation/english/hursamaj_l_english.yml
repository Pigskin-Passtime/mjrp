l_english:
 hursamaj_allowed:0 "Ursa Major Allowed"
 hursamaj_disabled:0 "Ursa Major Disabled"
 spawn_hursamaj:0 "Spawn Ursa Major"
 hursamaj_tooltip:0 "Ursa Major is intially a leader with negative traits a high upkeep, but after reaching level 5 and completing his event chain, he is born anew with powerful traits."

 spawn_ursa_minor:0 "oh my"
 NAME_Ursa_Major_Leader_System:0 "Ursalera"
 hursamaj_events.5.name:0 "Jamming Drones Destroyed"
 hursamaj_events.5.desc:0 "Almost immediately after destroying the jamming drones in the $NAME_Ursa_Major_Leader_System$ system, multiple centuries worth of what seem to be distress signals came flooding through our systems.\n\nThe encryption and transmission method of each are varied, implying the jamming drone has been scrambling the messages despite attempts specifically to get around it. What is most confusing is it seems the drones were cataloguing and transmitting these messages somewhere else, though we cannot determine its destination.\n\nA special project has already been formulated to locate the source of the distress signals on the nearby barren planet."
 NAME_Ursa_Minor_Jamming_Drone_fleet:0 "Jamming Drones"
 NAME_Ursa_Minor_Jamming_Drone_class:0 "Jamming Drone"
 NAME_Ursa_Minor_Jamming_Drone_ship:0 "Jammer"
 NAME_Ursa_Minor_Jamming_Drone:0 "Jamming Drone"
 hursamaj_events.5.a:0 "Curious."
 URSA_MINOR_RECRUIT_PROJECT:0 "Triangulate Distress Signals"
 URSA_MINOR_RECRUIT_PROJECT_DESC:0 "The source of the distress signals we intercepted seems to vary in location over time, suggesting they were transmitted from seperate sights. With proper data modeling we may be able to predict the exact location of the next sight, and locate whoever is responsible for their transmission."
 hursamaj_events.7.a:0 "Why don't you join us?"
 hursamaj_events.7.b:0 "No Thanks."
 hursamaj_events.7.desc.gestalt:0 "The responsible party suprisingly seems to be a single male biological specimen! It stared at us blankly when we first tried to communicate with it and inspected the jury-rigged communication devices it had built. He seemed to not believe we were real, but a few shots of a potent stimulant snapped him out of his stupor. He is less repulsive than we expected, and claims to be a military commander of sorts. He has offered to join our cause, as thanks for freeing him from \"wallowing in misery\". He would make an interesting pet, for now at least."
 hursamaj_events.7.desc.normal:0 "The responsible party suprisingly seems to be a single male biological specimen! It stared at us blankly when we first tried to communicate with it and inspected the jury-rigged communication devices it had built. He seemed to not believe we were real, but a few shots of a potent stimulant snapped him out of his stupor. He bears a striking resemblence to a character from our culture's fairy tales, and claims to be a military commander of sorts. He has offered to join our cause, as thanks for freeing him from \"wallowing in misery\"."
 hursamaj_events.7.c:0 "How did you end up stranded here?"
 hursamaj_events.7.c.response:0 "After I failed to fend off oppresive invaders, they laid waste to my planet, destroyed our star, and trapped me here to set an example to anyone that would oppose them."
 hursamaj_events.7.d:0 "How long have you been here?"
 hursamaj_events.7.d.response:0 "I have no way to know. They imploded our star and polluted the sky so I couldn't see the light of distant galaxies. I was able to fashion rudimentary devices to measure time passage, but had no frame of reference for them."
 hursamaj_events.7.e:0 "How did you survive on that barren planet? Are you immortal?"
 hursamaj_events.7.e.response:0 "The drones you destroyed had a means of reviving me if I tried to end my suffering, and my tormentors did something to me so I would not age. They wanted my mind to stay fresh, to wallow in my failure."
 NAME_commander_ursamajor:0 "Ursa Major"
 NAME_Commander_Ursa_Minor:0 "Ursa Major"
 hursamaj_events.7.hire_custom_tooltip:0 "§Y$NAME_commander_ursamajor$§! joins our empire as a §HLeader§!."
 ursa_minor_desc:0 "A traumatized final survivor of his species, relying on wisdom from centuries ago."
 ursa_minor_catch_phrase:0 "I must find a way to redeem myself."
 leader_trait_ursa_minor_unbearable:0 "Unbearable"
 leader_trait_ursa_minor_unbearable_desc:0 "Constantly late, never able to finish a thought, and generally unorganized, this leader significantly slows down council agendas."
 leader_trait_ursa_minor_hibearnator:0 "Hibearnator"
 leader_trait_ursa_minor_hibearnator_desc:0 "A few thousand years without a day and night cycle causes this leader to require much more rest and food than other biological life."
 leader_trait_ursa_minor_embearassing:0 "Embearassing"
 leader_trait_ursa_minor_embearassing_desc:0 "Constantly dropping weapons, misreading maps, soldiers lose much of their pride with this leader, and generally embarrasses our society."
 leader_trait_ursa_minor_overbearing:0 "Overbearing"
 leader_trait_ursa_minor_overbearing_desc:0 "A combination of micromanaging and misunderstanding roles makes this leader a poor choice to manage a planet."
 leader_trait_ursa_major_grizzled_veteran:0 "Grizzled Veteran"
 leader_trait_ursa_major_grizzled_veteran_desc:0 "This leader holds extensive wisdom on the governing of society, helping himself and other leaders learn quickly."
 leader_trait_ursa_major_cub_scout:0 "Cub Scout"
 leader_trait_ursa_major_cub_scout_desc:0 "Though his knowledge of the universe is antiquated, this leader's curiosity and enthusiasm drive him forward."
 leader_trait_ursa_major_bear_hands:0 "Bear Hands"
 leader_trait_ursa_major_bear_hands_desc:0 "This leader's knowledge of hand to hand combat is suprisingly useful, in an era where we have mostly ignored the art."
 leader_trait_ursa_major_two_bear_arms:0 "The Right Two Bear Arms"
 leader_trait_ursa_major_two_bear_arms_desc:0 "Using his DNA as a template, this leader offers all civilians two clones of his right arm. They love it."
 hursamaj_events.81.name:0 "Valuable Resource Consumed!"
 hursamaj_events.81.name.normal:0 "National Honey Consumed!"
 hursamaj_events.81.name.gestalt:0 "Royal Honey Consumed!"
 hursamaj_events.81.name.machine:0 "Engine Lubricant Consumed!"
 hursamaj_events.81.desc.normal:0 "In a fit of hunger, Commander Ursa Major consumed the entierty our historic national honey exhibit, the pride of our people. The loss of food and income from tourism is truly a national tragedy."
 hursamaj_events.81.desc.gestalt:0 "In a fit of hunger, Commander Ursa Major consumed a massive quantity of the royal honey produced for our offspring. Luckily we can replace it with modern technology, but we will not soon forget this."
 hursamaj_events.81.desc.machine:0 "In a fit of hunger, Commander Ursa Major consumed a huge quantity of our engine lubricant, which he claims to have mistook for honey. We did not have the patience to point out that lubricant is almost the polar opposite of honey."
 hursamaj_events.81.a:0 "Disappointing."
 PRESCRIPTED_species_name_ursa_major:0 "Ursolar"
 hursamaj_events.82.name:0 "Ship Designs Corrupted"
 hursamaj_events.82.desc:0 "Commander Ursa Major somehow managed to spill space coffee on the only hard copy of our ship design templates, significantly corrupting the data."
 hursamaj_events.82.a:0 "This will set us back."
 hursamaj_corrupted_ship_data_modifier:0 "Corrupted Ship Data"
 hursamaj_corrupted_ship_data_modifier_desc:0 "Our corrupted ship data is causing delays and increases in cost."
 hursamaj_events.83.name:0 "Encryption Key Compromised"
 hursamaj_events.83.desc:0 "Commander Ursa Major misplaced the sci-fi equivalent to a nuclear launch key. Though we have disabled its code, the data within it has become widespread, significantly reducing the effectiveness of our encryption."
 hursamaj_events.83.a:0 "Lets keep those away from him from now on."
 hursamaj_nuclear_launch_key_modifier:0 "Lost Encryption Key"
 hursamaj_nuclear_launch_key_modifier_desc:0 "Losing an encryption key has significantly compromised our counterintelligence."
 hursamaj_humiliated:0 "National Anthem Blundered"
 hursamaj_humiliated_desc:0 "We're still trying to recover from this humiliation..." 
  hursamaj_events.84.name:0 "Anthem Broadcasted"
 hursamaj_events.84.desc:0 "Commander Ursa Major somehow butt dialed a mass transmission to the galaxy of him egregiously failing to sing our national anthem. There's no telling who has seen it."
 hursamaj_events.84.a:0 "How can anyone blunder this much!?"
 hursamaj_events.91.name:0 "Military Stockpile Seized"
 hursamaj_events.91.desc:0 "Since his ascension, Commander Ursa Major's memory has improved significantly, and he has recalled the coordinates of a significant resource stockpile from his old civilization."
 hursamaj_events.91.a:0 "This could prove useful."
 hursamaj_events.92.name:0 "Stuffed Animal Distribution"
 hursamaj_events.92.desc.normal:0 "Commander Ursa Major suprised our entire society today, distributing stuffed animals in his likeness to every planet as a token of his thanks. Popular with adults and children alike, this gift has unified us as a species in gratefulness."
 hursamaj_events.92.desc.gestalt:0 "Commander Ursa Major suprised our entire society today, distributing stuffed animals in his likeness to every planet as a token of his thanks. Our drones seem to enjoy chewing on them, and the simple motion frees up congnitive space for increased unification."
 hursamaj_events.92.desc.machine:0 "Commander Ursa Major suprised our entire society today, distributing stuffed animals in his likeness to every planet as a token of his thanks. Some ancient infrastructure in our code seems to function significantly better in proximity to these objects, though why we should value such frivolities is logically lost on us."
 hursamaj_events.92.a:0 "Delightful."
 hursamaj_stuffed_toys:0 "Stuffed Toys"
 hursamaj_stuffed_toys_desc:0 "Ursa Major's toys continue to work their magic."
 hursamaj_events.93.name:0 "Construction Assistance"
 hursamaj_events.93.desc:0 "Commander Ursa Major has recently begun to dedicate his free time towards personally assisting in ship construction via remote drones. His animalistic instinct has proven useful but impossible to analyze as he rips and bends alloys with both ferocity and grace."
 hursamaj_events.93.a:0 "Much Appreciated."
 hursamaj_ship_construction_assist:0 "Construction Assistance"
 hursamaj_ship_construction_assist_desc:0 "Construction drones continue to execute Ursa Major's custom routines, but they will eventually break down."
 hursamaj_events.94.name:0 "Story Revealed"
 hursamaj_events.94.desc:0 "Commander Ursa Major cleared his throat and addressed our leaders. He regalled the tale of how his civilization fell to ruin when they came under attack from his tormentors.\n\nHow he was forced to declare martial law as society crumbled around him, every failure made by officials and leaders explained in thorough detail, along with alternatives that would have proven superior. He choked back tears as he recalled the mistakes he made in that fateful final battle. How his tormentors turned his planet to ash, imploded his star, and liquidated his entire species, all while forcing him to watch.\n\nHe explained that after his tormentors imbued him with eternal life and left him stranded as a cruel joke, he meditated on all the ways he could have done things differently, every tiny adjustment that could have made their defenses hold. He recounted endless innovations he discovered on his seemingly barren planet, shocking even our most esteemed scientists. The commander who had previously seemed clumsy described logistical solutions so complex and intertwined it sounded like he was reading from a high level textbook.\n\nUrsa Major finished with a single request: to learn from his mistakes."
 hursamaj_events.94.a:0 "Inspiring."
 hursamaj_events.10.name:0 "Strange Call"
 hursamaj_events.10.desc:0 "\"He is ours... Give him back... Give back Ursa Major...\""
 hursamaj_events.10.a:0 "Who are you?"
 hursamaj_events.10.a.response:0 "\"Phlaxanoids?... Xolograns?... Chimaertos?... It has been so long since our ascension... We forget...\""
 hursamaj_events.10.b:0 "Why do you want him?"
 hursamaj_events.10.b.response:0 "\"He opposed us once... Now we delight in his misery... He is ours...\""
 hursamaj_events.10.c:0 "And if we refuse?"
 hursamaj_events.10.c.response:0 "\"You shall be made into nothing...\""
 hursamaj_events.10.d:0 "He's all yours."
 hursamaj_events.10.d.response:0 "\"...\""
 hursamaj_events.10.e:0 "He is not yours anymore."
 hursamaj_events.10.e.response:0 "\"...\""
 hursamaj_events.10001.name:0 "Strange Call"
 hursamaj_events.10001.desc:0 "Suddenly we pick up a faint signal. We can't tell where its coming from, and it almost seems to be congealing from all directions. Our comms light up and we feel strangely compelled to answer."
 hursamaj_events.10001.a:0 "On Screen."
 hursamaj_events.11.name:0 "Tormentor Invasion"
 hursamaj_events.11.desc:0 "Spacetime seems to bend and rumble, and suddenly a hostile fleet appears within our capital system. Though the fleet is impressive, it floats and operates as if guided by a memory within a dream. Nonetheless, its intentions are clear."
 hursamaj_events.11.a:0 "Let us bear down on them."
 NAME_Ursa_Major_Tormentors:0 "The Tormentors"
 NAME_Ursa_Major_Tormentors_fleet:0 "Forest Fire"
 NAME_Ursa_Major_Tormentor_Small:0 "Ash"
 NAME_Ursa_Major_Tormentor_Medium:0 "Ember"
 NAME_Ursa_Major_Tormentor_Large:0 "Deadwood"
 hursamaj_events.12.name:0 "Ursa Major Sacrifice"
 hursamaj_events.12.desc:0 "Just as the final ship in the enemy fleet is destroyed, a strange hum begins to eminate from our capital, as a wormhole crackles and begins to open in one of our most populated districts. A strange substrance begins to spill out, turning all it comes into contact with into ash.\n\nCommander Ursa major, who we had thought was elsewhere, suddenly charged into it, yelling \"You won't destroy my home again!\" After a few seconds of roaring and sounds of battle from the wormhole, it suddenly slammed shut.\n\nAnd then, silence."
 hursamaj_events.12.a:0 "His sacrifice will not be forgotten."
 hursamaj_events.13.name:0 "Ursa Major Returns"
 hursamaj_events.13.desc.normal:1 "Shock was an understatement for what we felt when Ursa Major strode into the barracks with a grin stretched across his face. He briefly paused in front of his memorial with a smirk, then flagged down the nearest personnel officer. §!\n\nUrsa Major reporting for duty, refreshed and eager after my leave of absence."
 hursamaj_events.13.desc.gestalt:1 "Shock was an understatement for what we felt when Ursa Major strode into the barracks with a grin stretched across his face. He looked around confused for a moment, seeming to think the death of a single drone for the good of the many is worth celebrating. §!\n\nUm... Ursa Major reporting for duty?"
 hursamaj_events.13.c:0 "How did you survive?"
 hursamaj_events.13.c.response:0 "Turns out the plane of existence my tormentors inhabited was not well defended on the inside, and they lost a lot of their talent for violence since their \"ascension\"."
 hursamaj_events.13.d:0 "You look a bit different."
 hursamaj_events.13.d.response:0 "There seems to be a bit of time dilation in there, I spent a good two hundred years tearing down their massive devices. Towards the end of it, I felt myself beginning to age once again, as their machinations sputtered out."
 hursamaj_events.13.e:0 "Did you get revenge on your tormentors?"
 hursamaj_events.13.e.response:0 "Hardly. From what I could tell their \"ascension\" did not go as planned. I wiped out a thousand or so fused hulking masses of flesh begging for death, but I spent most of my time tearing through machinery before the dimension collapsed and I was returned here."
 hursamaj_events.13.b:0 "You should retire."
 hursamaj_events.13.a:0 "Welcome back."
 hursamaj_events.13.hire_custom_tooltip:0 "§Y$NAME_commander_ursamajor$§! returns to his post as a §HLeader§!." 
 ursa_major_desc:0 "A fearless commander who risked everything to avenge his people and save his new home."
 ursa_major_catch_phrase:0 "I can bearly believe it, but I am finally at peace."
 
 
 

 
 
 
