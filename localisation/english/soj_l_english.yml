 soj_military_chain_title:0 "§SMilitary Skills§!"
 soj_military_chain_desc:0 "Our sensors have detected an energy signature on a ship that could be ideal for absorption by our new friend $NAME_Soj$. We need to locate this energy signature."
 soj_mil_system_1_poi:0 "Hostile fleet"
 soj_mil_system_1_poi_desc:0 "We should send a fleet to search for the hostile ships."
 soj_q.1001.name:0 "$soj_military_chain_title$"
 soj_q.1001.desc:0 "$soj_military_chain_desc$"
 soj_q.1001.a:0 "Find the ship"
 soj_q.1003.name:0 "Ship tracked down"
 soj_q.1003.desc:0 "We were able to track down the ship. It is an unmanned drone which is based on a highly developed computer system whose energy $NAME_Soj$ can use."
 soj_q.1003.a:0 "Proceed"
 soj_q.1005.name:0 "Ship destroyed"
 soj_q.1005.desc:0 "We were able to track down the ship. But it seems to have been destroyed by someone else."
 soj_q.1005.a:0 "That's a problem"
 soj_q.1006.name:0 "Ship boarded"
 soj_q.1006.desc:0 "Our team enters the ship to locate the energy core."
 soj_q.1006.a:0 "Proceed"
 soj_q.1007.name:0 "$Q_SUCCESS$"
 soj_q.1007.desc:0 "$Q_SUCCESS_DESC$ $soj_military_chain_title$"
