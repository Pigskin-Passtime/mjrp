 soj_allowed:0 "§YSpirit of The Junction§! §GEnabled§!"
 soj_disabled:0 "§YSpirit of the Junction§! §RDisabled§!"
 spawn_soj:0 "Spawn §YSpirit of The Junction§!"
 soj_tooltip:0 "In the endless expanse of the universe lies a forgotten star system called §Y\"The Junction\"§!. Lonely and unfathomable, a mysterious wreck drifts there, which appears to be the home of an extremely strange life form. The discovery of this strange wreck promises an extraordinary encounter that will change our view of life in this universe forever."
