 soj_trait_module_culture:0 "Cultural Knowledge"
 soj_trait_module_culture_desc:0 "$Q_SUCCESS_DESC$ $soj_q.3001.name$"
 
 soj_engine_chain_title:0 "§YCrafting Attainments§!"
 soj_engine_chain_desc:0 "One way to quench $NAME_Soj$'s thirst for energy could be inspiration through craftsmanship. He would not only be creative himself, but also soak up the energy and creativity from the work of others.\n\n§BBuild a Megastructure§!."
 soj_q.4001.name:0 "$soj_engine_chain_title$"
 soj_q.4001.desc:0 "One way to quench $NAME_Soj$'s thirst for energy could be inspiration through craftsmanship. He would not only be creative himself, but also soak up the energy and creativity from the work of others."
 soj_q.4001.a:0 "Let's build a Megastructure!"
 soj_q.4002.name:0 "A masterpiece of technology!"
 soj_q.4002.desc:0 "We have built a breathtaking megastructure - a marvel of technology and creativity that goes beyond the limits of imagination. We are faced with the question of whether $NAME_Soj$ should absorb this monumental creation in his quest for energy. Should he use the energy of this structure to quench his thirst and expand his abilities?"
 soj_q.4002.a:0 "Let $NAME_Soj$ absorb the newly built megastructure."
 soj_q.4002.a.tooltip:0 "§RDestroy the§! §Y[from.GetName]§!§R!§!"
 soj_q.4002.b:0 "We will built another structure for him to absorb."
 soj_q.4002.c:0 "Abort $NAME_Soj$'s quest for Crafting Knowledge."
 soj_q.4007.name:0 "$Q_SUCCESS$"
 soj_q.4007.desc:0 "$Q_SUCCESS_DESC$ $soj_q.4001.name$"
 soj_q.4007.a:0 "$Q_SUCCESS$"
