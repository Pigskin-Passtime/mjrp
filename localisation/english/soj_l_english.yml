 soj_trait_module_military_desc:0 "$Q_SUCCESS_DESC$ $soj_military_chain_title$"

 soj_science_chain_title:0 "§SPhysical Knowledge§!"
 soj_science_chain_desc:0 "To quench $NAME_Soj$ thirst for energy, stars are his first thought. They offer masses of energy, but is that enough? Peter needs large amounts of energy to be able to improve his physical abilities, there's no question about that. But stars alone might not be enough to quench his thirst."
 soj_sci_system_1_poi:0 "An Interesting Candidate for Absorption"
 soj_sci_system_1_poi_desc:0 "We should send a science ship to set up everything for the absorption of the star."
 soj_sci_system_2_poi:0 "An Interesting Candidate for Absorption"
 soj_sci_system_2_poi_desc:0 "We should send a science ship to set up everything for the absorption of the star."
 soj_sci_system_3_poi:0 "An Interesting Candidate for Absorption"
 soj_sci_system_3_poi_desc:0 "We should send a science ship to set up everything for the absorption of the star."
 soj_q.2001.name:0 "$soj_science_chain_title$"
 soj_q.2001.desc:0 "$soj_science_chain_desc$"
 soj_q.2001.a:0 "Search for suitable stars for absorption."
 soj_q.2001.b:0 "Offer a scientist for absorption."
 soj_q.2001.b.tooltip:0 "Stars alone would not be enough to increase his abilities. It is clear that additional neural, cognitive energy is necessary."
 soj_q.2002.name:0 "Path to the Stars"
 soj_q.2002.desc:0 "Absorbing some stars should be enough to satisfy $NAME_Soj$'s basic hunger for energy and expand his mind."
 soj_q.2002.a:0 "Enjoy the Energy"
 soj_q.2003.name:0 "Scientist needed"
 soj_q.2003.desc:0 "It has become clear that additional neural energy is probably needed to expand $NAME_Soj$'s mind. Three scientists have volunteered to stand ready as a source of energy."
 soj_q.2003.a:0 "Choose §Y[soj_sci_leader_1.GetName]§!"
 soj_q.2003.a.tooltip:0 "§RThe leader dies§!"
 soj_q.2003.b:0 "Choose §Y[soj_sci_leader_2.GetName]§!"
 soj_q.2003.b.tooltip:0 "$soj_q.2003.a.tooltip$"
 soj_q.2003.c:0 "Choose §Y[soj_sci_leader_3.GetName]§!"
 soj_q.2003.c.tooltip:0 "$soj_q.2003.a.tooltip$"
 soj_q.2003.d:0 "Abort $NAME_Soj$'s quest for Scientific Knowledge"
 soj_q.2006.name:0 "$Q_SUCCESS$"
 soj_q.2006.desc:0 "$Q_SUCCESS_DESC$ $soj_science_chain_title$"
 soj_q.2007.name:0 "$Q_SUCCESS$"
 soj_q.2007.desc:0 "$Q_SUCCESS_DESC$ $soj_science_chain_title$"
 ABSORB_SOJ_STAR_1:0 "Absorb Star"
 ABSORB_SOJ_STAR_1_DESC:0 "We found an interesting star in this system. $NAME_Soj$ can now start the absorption of its power."
 soj_trait_module_science:0 "Physical Knowledge"
 soj_trait_module_science_desc:0 "$Q_SUCCESS_DESC$ $soj_science_chain_title$"

 soj_culture_chain_title:0 "§YCultural Senses§!"
 soj_culture_chain_desc:0 "To quench $NAME_Soj$'s thirst for energy, one possible source could be the effervescent culture that the galaxy has to offer. The diversity of traditions, art forms, languages and ways of life in different civilizations could be a rich and unique source of energy that could fulfill $NAME_Soj$'s needs. Exploring these different cultural facets could be an exciting way to satisfy his hunger for energy and further develop his skills."
 soj_q.3001.name:0 "$soj_culture_chain_title$"
 soj_q.3001.desc:0 "$soj_culture_chain_desc$"
 soj_q.3001.a:0 "Choose §Y[soj_culture_planet_1.GetName]§!"
 soj_q.3001.a.tooltip:0 ""
