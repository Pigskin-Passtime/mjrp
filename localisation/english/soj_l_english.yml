 pc_soj_ship:0 "Mysterious Ship"
 pc_soj_ship_desc:0 "A massive, destroyed ship drifts lonely through space. The sensors report no signs of life, and examinations of the hull indicate that it has been drifting in orbit around a small dwarf star for decades. What could have caused it to end up here, and who was the crew on board?"
 SOJ_SHIP_PROJECT:0 "A Ship in the Void"
 SOJ_SHIP_PROJECT_DESC:0 "$pc_soj_ship_desc$"
 soj_building_transcend:0 "Neuronal Energy Translocator"
 soj_building_transcend_desc:0 "A masterpiece of modern technology that allows neuronal energy to be shifted in space and time."
 soj_r_gift:0 "Krskh's Gift"
 soj_r_gift_desc:0 "A gift that our friend $NAME_Soj$ left behind."
 soj_mod_gift_triumph:0 "$soj_r_gift$"
 soj_mod_gift_triumph_desc:0 ""
 soj_trait_legendary_spirit:0 "$NAME_Soj$"
 soj_trait_legendary_spirit_desc:0 ""

 # Discover and Flavor Events
 
 soj_d.2.name:0 "Power"
 soj_d.2.desc:0 "After extensive scans and outboard expeditions by our research team, we came across a remote section of the ship that is still powered and has an atmosphere of methane and argon. This section was so deep inside the ship that our sensors could not locate it through the many thick outer walls of the huge wreck."
 soj_d.3.name:0 "Signs of Life"
 soj_d.3.desc:0 "As our scientists enter the room in their protective suits, they are greeted by a scene that seems exotic and alive. There are shades of green, yellow and purple everywhere, and the room seems to be filled with exotic liquids and plants. As they explore the room, the scientists notice a small yellowish glowing sphere moving rapidly around them and making strange sounds: "Mawuhdea Krshkf Murhs". Astounded by this discovery, the scientists are initially unsure what they have seen. After much thought, a young scientist suggests that the movements and the repetitive sequence of sounds might indicate that it could be a life form. After a thorough discussion, the other scientists agree and decide to report this discovery to the Xeno Council."
 soj_d.100.name:0 "Xeno Council: First Evaluation"
 soj_d.100.desc:0 "The initial evaluation of the Xeno Council has shown that it is very likely to be a life form and that communication could be possible after further research..."
 soj_d.1000.name:0 "Xeno Council: Breakthrough"
 soj_d.1000.desc:0 "The Xeno Council has achieved a significant breakthrough. Through frequency modulation on a narrow frequency band, the universal translator could be able to translate the sounds into a language we can understand if tuned correctly. The scientists must return to the ship and make the attempt."
 soj_d.1001.name:0 "Silence..."
 soj_d.1001.desc:0 "The creature is nowhere to be found. The room is empty and there is absolute silence..."
 soj_f.100.name:0 "Absorption"
 soj_f.100.desc:0 "Krksh approaches you and says: \"I told you about my special abilities. One of these abilities is to absorb certain forms of energy, which broadens my horizons and strengthens my abilities. You could almost describe it as a thirst that I would now like to quench. Is there a specific type of energy that I can absorb?\""
 soj_f.100.a:0 "£military_power£ A form of energy that strengthens your §YMilitary Skills§!"
 soj_f.100.b:0 "£physics£ A form of energy that strengthens your §YPhysical Knowledge§!"
 soj_f.100.c:0 "£amenities£ A form of energy that strengthens your §YCultural Senses§!"
 soj_f.100.d:0 "£job_artificer£ A form of energy that strengthens your §YCrafting Attainments§!"
 soj_f.200.name:0 "The Thirst"
 soj_f.200.desc:0 "$NAME_Soj$ buzzes around you quickly and in irregular movements. With a worried tone, he replies, \"As an energy-based life form, my species must regularly absorb energy. I'm sorry, but I can't hold it in any longer. My thirst is too great. I can't help it, I have to quench my need for energy. It's beyond my control.\""
 soj_f.201.name:0 "$NAME_Soj$ out of control"
 soj_f.201.desc:0 "Krksh disappears, and shortly afterwards it happens: Overwhelmed by his uncontrollable thirst for energy, he absorbs until his need is finally satisfied."
 soj_f.202.name:0 "$NAME_Soj$ calms down"
 soj_f.202.desc:0 "$NAME_Soj$ regains control and his thirst seems to be quenched, but the damage is done. Was it really worth it?"
 soj_f.300.name:0 "Transcendence"
 soj_f.300.desc:0 "$NAME_Soj$ approaches you: \"I told you about my companions' departure. Technically speaking, they didn't just leave, they transcended. Our species has been striving for this all its life. But that requires absorbing as much energy as is produced by the supernova of a class YTA star. You have probably never heard of such a star, since none exists in your galaxy. Despite your company, for which I feel nothing but gratitude, I feel lonely and would like to follow my companions. That is why I have devised a plan. This building could help me to transcend. Can you help me?\""
 soj_f.301.name:0 "$soj_building_transcend$"
 soj_f.301.desc:0 "After a long construction period, the building whose plans $NAME_Soj$ gave us has been completed and appears to function within the intended parameters."
 soj_f.302.name:0 "Star the Process"
 soj_f.302.desc:0 "All facilities are now operational. We can now start the transcendence process."
 soj_f.303.name:0 "A Success"
 soj_f.303.desc:0 "The transcendence process was completed and Krksh disappeared in a beam of energy. Before he left, he left a message:\n\n§Y"Thank you. My gift to you."§!\n\nThe entire community is happy to have helped this extraordinary creature."
 soj_h.1.name:0 "$NAME_Soj$"
 soj_h.1.desc:0 "The translator works and the sounds of the creature can be translated:\n\"Greetings, physical life forms. Can you understand me? Yes? That is pleasing. My name is $NAME_Soj$ I am a member of an energy-based species called Oglamar. Once we were much like you, physical beings, but millennia ago our species evolved. Now we feed on the experiences and energies that the universe offers. We roam space in search of it, and like you, we are explorers. Unfortunately, my companions have been gone for a long time and I feel very lonely. If you don't mind, I would like to join you and find a new home in your company. Of course you can rely on my services - I have some skills I can offer you, you must know.\""
 soj_h.1.a:0 "Why are you so lonely here in a broken ship?"
 soj_h.1.a.response:0 "\"When my companions left a long time ago, I continued my journey, always on the lookout for more fascinating energies. As you can imagine, it is impossible to operate such a huge ship alone. That is why I was stranded in this lonely system a long time ago and have always been looking for a way to 'leave' like my companions.\""

