l_english:
 origin_lostspawn: "Lost Spawn"
 origin_lostspawn_desc: "This civilisation is the creation of a spaceborne entity, guiding their growth and evolution from the stars. During their developement their creator abandoned them, but through legends and tales the story of their creation lived on. Now with the far reaches of space within their grasp, they seek answers among the cosmos."
 origin_tooltip_lostspawn_effects: " - Home planet has the §YNo Stone Unturned§! Archaeological Site\n - Begin with the §YIn Search of Answers§! event chain, leading you to the truth behind the creation of your people"
 START_SCREEN_LOST_SPAWN: "Our myths and legends all tell tales of our creation. They speak of a giant entity shaping our world and us to perfection. They watched over us, and we drew comfort from their presence as they guided us. However, this did not last, eventually we were abandoned by our creator and fell to ruin. But we rose once again from the ashes, reborn.\n\nThis did not halt our progress and now, with the advent of spaceflight, the very stars themselves are within our grasp. But ancient questions still remain, and with our new technological capabilities, we might finally have some answers within our reach."
 
