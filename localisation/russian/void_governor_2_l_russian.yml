l_russian:
#first digsite
 void_governor_crash_site:0 "Ancient ARK Ship Remains"
 void_governor_crash_site_digsite_desc:0 "This planet holds the remains of the ARK ship that we found an escape pod from, initial scans show that the majority of the ship is here although a portion of the from appears missing. Searching this ancient ship might contain valuable technologies and provide more information about its story."

vgdigsite.1.name:0 "Crashed ARK Ship Search"
vgdigsite.1.desc:0 "An initial search of the large ships shows that it is split into differing sections, the main sections are a living sector located above the other sectors, a maintenance and power sector as well as some menial areas for logistics. \n\nThe front portion of the ship is missing, this likely contained the bridge and related areas as they are all absent. We will now focus are search on the different areas to ensure we don't miss any hidden interests."
vgdigsite.1.a:0 "A good plan."

vgdigsite.2.name:0 "Destroyed Living Sector"
vgdigsite.2.desc:0 "Originally when searching the living sector, we found practically nothing of use. Due to the ships age, anything exposed not made out of strong materials or metals are practically completely erased. All the materials used to construct this ship far outdates any other constructed object we have ever come across. It is difficult to tell exactly what each building could have been used for due the sheer wear of time and the initial damage of crashing onto a planet. The majority of the sector was likely shared living spaces, as well as shared eating areas and possibly some areas for recreation. \n\nDespite the damage, near the middle of the sector buried underneath decayed structures, we found a small room built from a different stronger material which appeared to contain artifacts and trinkets. We suspect this building might have been used as a museum or area to store artifacts of note from this empires history. Unfortunately, most of the items are still worn beyond any recognition of usefulness, however, the material the room is made of itself could provide our engineers valuable research towards stronger materials and armour. With this area searched, we will now move onto the maintenance and power sector located below."
vgdigsite.2.a:0 "Hopefully the other sectors provide more information."

vgdigsite.3.name:0 "Damaged Maintanence Area and Reactor"
vgdigsite.3.desc:0 "The maintancene area is in better shape than the Living sector, likely due to the living sector above it protecting it, as a significant amount of damage done to the living sector simply appears to be wear. This sector was built to be efficient and is made up of multiple corridors, storage areas and workshops. It appears that anything that broke could be brought down here for repairs. \n\nA few of the storerooms contain resources which we could use as minerals and alloys, these are being transported now. This section also contained rooms filled with various screens and computers, upon testing they appear operational, just lacking a significant power source. \n\nWhich brings us to the state of the ships reactor. Its not looking good, it has sustained damage and is completely non functional. It is larger than any reactor we could put on a ship but we could likely repair it, sourcing parts from around our empire. It would take some time to understand the technology behind the reactor and to perform rigourous safety testing before we start it. In addition to this, we will need to ensure the rest of the power grid is operational. \n\nHopefully, after restoring power to the ship, we can access its logs to find out more about this ship and whoever created it."
vgdigsite.3.a:0 "Lets begin restoring it."

vgdigsite.4.name:0 "Reactor Operational"
vgdigsite.4.desc:0 "All safety tests are now complete and the ships reactor has been reactivated, by studying this reactor we should be able to improve our own reactors now. Upon restoring power, it becomes clear that while the power systems were mostly operational, the ships data storage has been heavily corrupted. From what information is left, it is clear that this ship is one of a kind. An ARK ship containing the last of the 'Ishdan empire', a fanatic materialist empire devoted to pushing the boundaries of science. Unfortunately for them, it is clear the ship never completed its misson. They were running from something in their empire, a worm? That can't be right... \n\nAccessing the ships network allowed us to find a map of the ship, showing us some more storage areas as well as accessing some remaining logistics logs. Some of these logistics logs were signed of by the leader of the ship 'Inanis', likely the captain. Unfortunately for them, their ship fell pray to something and crash landed here, with the front of the ship likely ending up swallowed by the black hole. It is unclear wether the mining drones were the cause of this, or if the mining drones simply found this system before us. \n\nIn addition to all of this, after turning on the power, some of the ships consoles started creating a static noise, these sounds were initially ignored, assumed to be damaged systems. Eventually it was discovered that this noise was actually the ship recieving a signal from an external source, rather than an error or damage. After not gaining much from the ships data log, our focus has shifted into finding the source of this signal."
vgdigsite.4.a:0 "Unfortunate, hopefully this signal proves useful."

vgdigsite.5.name:0 "Signal Source Located"
vgdigsite.5.desc:0 "We have located the source of the signal. We do not understand how, but it appears to originate from inside of the systems black hole. This should be impossible, but we have checked, double checked and checked again. Even more confusingly, the location appears constant within the black hole, which is even more impossible. Nothing should be able to escape a black hole, not even light can. Yet something is clearly inside of this one, transmitting data to this ship. \n\nThe signal received from the ship was not static. Once we understood the signal was coming from within a black hole we could change how we perceived it. \n\nTime behaves weirdly around black holes. The closer you get to one, the faster time moves. This is why the signal appeared to be static. When the signal was recorded, time was moving significantly faster. It was never static, it was just incredibly slow due to this time dilation. We got an AI to analyse all of the signal from the time we have spent here. The transmission itself was sadly useless, only containing a few words. "moving lights, most are gone". This phrase would be strange to be automatic, it is likely written by a sentient being. Could they be refering to the absence of the mining drones? This whole sitation is impossible, we must investigate the black hole for answers!"
vgdigsite.5.a:0 "How is this possible?"


#second digsite
void_governor_black_hole:0 "Abnormal Black Hole"
void_governor_black_hole_digsite_desc:0 "A signal is being transmitted from somewhere within this black hole, there must be a way to find out how."

vgdigsite.6.name:0 "Black Hole Investigation"
vgdigsite.6.desc:0 "Upon closer inspection of the black hole, it is clear that this part of the black hole is displaying abnormal behaviour, a section of the surface appears to be moving faster than the rest of the black hole, which should be impossible. This same section appears to be the source of the signal, it is highly likely they are connected."
vgdigsite.6.a:0 "This shouldn't be possible."

vgdigsite.7.name:0 "Studying the Abnormal Activity"
vgdigsite.7.desc:0 "The black holes abnormal behaviour allows us to get far closer to the black hole that we would've thought possible, the event horizon of this area is noticibly closer to the black hole than the rest. While we expected time to move faster as we got closer to the black hole, our calculations were completely off, time was moving faster than expected and we are sure our maths was correct. \n\nAfter some deep scans into the black hole, we have managed to locate the centre of the abnormality, which is also the same position that the signal is coming from. A deeper study into the abnormal area should provide more information about how it functions."
vgdigsite.7.a:0 "Most perplexing."

vgdigsite.8.name:0 "Abnormality Studied"
vgdigsite.8.desc:0 "The abnormal section of the black hole displays features which are simply not possible. This section of the black hole is traversable, there is no event horizon. It is still an incredibly hostile environment, severely damaging anything we send in there, but we can occasionally bring the damaged remains of probes back. After discovering this, we sent probes, reinforced with armour and shielding we would normally use on our military fleets in. Even most of these were torn apart. A few drones were retrieved after collecting valuable data from within the black hole for both this mission and our research. \n\nThe centre of the black holes abnormal behaviour appears to be a part of the ARK ships missing bridge, the bridge must be resistant to the effects of the black hole to still be relatively intact. This confirms that the signal received is coming from the bridge and something is sending these singals from inside. \n\nEven with this data it is still unclear what is the cause of these abnormalities, although it is likely from something within the bridge itself, projecting some sort of defensive aura around the bridge. This aura also seems to change the flow of time, speeding it up, which is likely why our estimates were wrong. Due to all these weird effects, we should in theory be able to remove the bridge from the black hole if we wished. Although this would require careful planning and will require considerable deliberation from our top physicists and engineers on how best to proceed."
vgdigsite.8.a:0 "Give them the go ahead, we could study or use this power for ourselves."

vgdigsite.9.name:0 "Extraction Plan Devised"
vgdigsite.9.desc:0 "It took a while, but our scientists have worked together to formulate a plan on how to extract the remains of the bridge from the black hole. Utilising our military armour technology and combining it with the stronger materials found on the ARK ship, we should be able to create a tether which should be able to survive the forces of the black hole during the extraction process. It will grab onto the bridge and then our science ship will use its engines to pull the bridge out. Allowing us to access it for study. All that is needed now is to create the tether. \n\nThis will take some time."
vgdigsite.9.a:0 "Ok."

vgdigsite.10.name:0 "Tether Created"
vgdigsite.10.desc:0 "The tether is complete and is being transported to the site as we speak. All abnormal behaviour have remained consistent, there is no reason to believe this shouldn't work. We need to do some preliminary tests with the tether to ensure it will withstand the forces from the black hole for the amount of time it is needed for. These tests are already underway and the extraction will commence soon if it passes these tests."
vgdigsite.10.a:0 "Inform me when the extraction starts."

vgdigsite.11.name:0 "Extraction Underway"
vgdigsite.11.desc:0 "All lights read green. The tether passed every test we had, we predict that I should be able to withstand the forces of the black hole for a few years during the extraction. The abnormal behaviour has also remained consistent still so we do not predict many complications due to that. The science ship has been prepped on what to do in an emergency, simply disconnecting the tether and charging emergency FTL should be enough. The tether is now being deployed and the mission is underway."
vgdigsite.11.a:0 "Great news."

vgdigsite.12.name:0 "Extraction Complete"
vgdigsite.12.desc:0 "The extraction is now complete. The plan succeeded near flawlessly, with the exception that the tether took significant damage during the extraction process. We predict this is due to time moving faster closer to the bridge than the science ship, causing increased forces between them. While the tether was damaged, it was coated and interlaced with dark matter. Our physisists predict that we should be able to harvest dark matter from black holes because of this, something previously thought impossible. \n\nHowever, onto important matters. The bridge when removed from the black hole broke apart, harmlessly falling back into the black hole. During this, our scientists detected a single lifesign connected to part of the wreakage. Against the better wishes of some crew members, the lead scientist of the ship flew the science ship closer to the black hole in order to collect this lifesign. After collection, the science crew discovered they were Inanis, the leader of the ARK ship, and they were very much alive. After an initially hostile response, Inanis accepted a medical team examine them. We have decided to let the science ship inform them of all we know about their vessel and history, we expect them to be from an era that we could never of heard of, simply lost to the passage of time. We expect them to contact us in a few days, when they have had time to process the initial shock of the event. \n\nOur scientists have noted that the passage of time around our science ship is now significantly faster than it should be. It appears that the source of the time dilation is actually Inanis themselves! Once we have let inanis recover, we will ask them about this and study them to help understand this power. We expect Inanis to take a week to be comfortable answering any questions, we will contact you when they are ready." 
vgdigsite.12.a:0 "This is great news, we will wait."