l_russian:
  ### Flags for picker: ###
  naod_allowed: "§GNaodeus Allowed§!"
  naod_disabled: "§RNaodeus Disabled§!"
  spawn_naod: "Spawn §YNaodeus§!"
  naod_tooltip: "Naodeus is (presumably) a shroud entity, who likes to see prosperity, change and species cooperate with each other."
  naod_catch_phrase: "It is always fascinating to watch a young species climb the ladder of progress."
  ### Names ###
  naod_Naodeus: "Naodeus, Bringer of Change"
  naod_system_name: "Ilianas"
  naod_planet_name: "Talil"
  naod_Schwiff: "Schwiff"
  naod_Schwiff_pl: "Schwiffs"
  naod_Feder: "Feder"
  naod_Feder_pl: "Feder"
  naod_Rukh: "Rukh"
  naod_Rukh_pl: "Rukhs"
  naod_militias: "Battle mages" 

  naod_naodeus_backstory: "Naodeus is a entity that lived on the planet Talil. The entity is not from this planet, in fact we are even quite certain that it is from beyond the physical plane. It might have its origin in the Shroud."
  ### Special Project ###
  NAOD_INVERSE_SYNTHETIC_EVOLUTION_PROJECT: "Inverse Synthetic Evolution"
  NAOD_INVERSE_SYNTHETIC_EVOLUTION_PROJECT_DESC: "Transforms all synthetic pops in $COUNTRY$ into pops of the primary species with (latent) psionic abilities or into one species of Talil."

  ### Static Modifiers ###
  naod_brilliance_from_diversity: "Brilliance from Diversity"
  naod_brilliance_from_diversity_desc: "We have gained an insight into the many differnt perspectives Naodeus is taking to enhance the beauty and quality of the products that surround us."
  naod_psionic_defense: "Psionic Defense"
  naod_psionic_defense_desc: "A strong shared mental guard to warn us against unwanted intruders."

  ### Traits ###
  leader_trait_manifested_change: "Manifestation of Change"
  leader_trait_manifested_change_desc: "It is assumed that this leader is a manifestation from the Shroud."
  leader_trait_bringer_of_unrest: "Bringer of Unrest"
  leader_trait_bringer_of_unrest_desc: "The tendency to encourage doubt in every principle coupled with a will for lengthy discussions with every opposition increases the influence of other ethics."
  leader_trait_xeno_integrator: "Xeno Integrator"
  leader_trait_xeno_integrator_desc: "This leader is a master of orchestrating the cooperation of different species."
  leader_trait_xeno_integrator_effect: "$PLANET_EFFECTS_TXT$:\n$t$Increase §Y$mod_planet_jobs_produces_mult$ output§! by §G0.5%§! per Species on the Planet\n$t$Increase £trade_value£ §Y$TRADE_VALUE$§! by §G1%§! per Species on the Planet\n\n$SECTOR_EFFECTS_TXT$:\n$t$Increase §Y$mod_planet_jobs_produces_mult$ output§! by §G0.25%§! per Species on each Planet\n$t$Increase £trade_value£ §Y$TRADE_VALUE$§! by §G0.5%§! per Species on each Planet"

  ### Events ###
  #Event series to recruit Naodeus
  #Path Science Ship
  naod.beingWatched.title: "Watchers being watched"
  naod.beingWatched.desc: "The crew surveying §HTalil§! reports that they felt permanently being watched, while on mission around the planet. Some raise concerns that they might have overlooked something. Other want to investigate further, hoping that they can find the reason for this phenomenon."
  naod.beingWatched.a: "Further investigate."
  naod.beingWatched.b: "We have more important things to do."

  naodeus_category: "Watching Presence"
  naod_search_nadoeus_desc: "The scientists surveying the planet Talil had the permanent feeling of being watched. They want to investigate further if they can find the reason for that feeling."

  naod.studiesOfTalil.title: "Unexpected Findings"
  naod.studiesOfTalil.desc: "The scientists found several exceptional things. They either did not realize on their first survey or they thought their eyes played tricks on them. \n The inhabitants of Talil might be in an equivalent of the feudal era, but they seem to be capable of psionics. \n There are three main species on this planet, which live in perfect harmony with one another. This is in itself remarkable, but truly remarkable is that there are thousands of sapient creatures with no clear ancestry, who are completely integrated into society. \n Something the scientists could not find was the source of the feeling of being watched. Some propose, that we should speak with the natives, maybe even bribe them to get informations about entities, which could be the watching us."
  naod.studiesOfTalil.a: "Bribe them."
  naod.studiesOfTalil.leave: "This was a waste of time."

  naod.meetTheNatives.title: "Friendly Hosts"
  naod.meetTheNatives.desc: "The scientists talked with many people on the planet. Each one directed them to another person. Each host was very friendly but also quite curious about us. The scientists kept our secrets mostly, but learned a lot about their culture. In the end an elderly sapient creature which is very hard to describe in short terms just told them: §H\"You amused Change enough, that she will wait for you in your flying house. I guess she loves to see the stars from up there.\"§!"
  naod.meetTheNatives.a: "There really is an unexpected guest in our science vessel."

  naod.naodeusOnBoard.title: "A Guest"
  naod.naodeusOnBoard.desc: "A young native, a §HRukh§! is waiting on the bridge. He eyes everything with utmost glee grinning from ear to ear. \" Welcome home, dear visitors!\" He vanished and several steps closer to us an elderly §HSchwiff§! appeared. \"I hope, I do not frighten you.\" She also vanished and an adult §HFeder§! of unidentifiable sex appeared before us. \"I want to speak with your boss boss and I'm sure you can open a communication channel.\""
  naod.naodeusOnBoard.a: "Let's talk!"
  #Recruitment Window
  naod_naodeus_recruitment_initial_title: "Naodeus"
  naod_naodeus_recruitment_initial_desc: "I have been called a lot of names in my lifes. The name most used is §HNaodeus§!. \nIt has been a really long time since I have met a spacefaring civilization. At least two, more likely five to twelve, reincarnations ago.\nI came here to give you an offer and a warning. \nFirst the offer: I'm interested in working for your nation. §HI hope together we can make this galaxy a better place for everyone.§! Second the warning: §RIf your nation dares to harm the children of Talil, you or your successor will pay for the atrocity personally.§!"
  naod_naodeus_recruitment_species_question: "What are you?"
  naod_naodeus_recruitment_species_answer: "A very interesting question. Sadly your language does not have a good category for me. The best might be shapeshifter, who likes to test the limits of the reality containing her."
  naod_naodeus_recruitment_transporation_question: "How did you come to this station?"
  naod_naodeus_recruitment_transporation_answer: "I bend space, so that this room is next to my bedchamber."
  naod_naodeus_recruitment_reincarnations_question: "Reincarnations?"
  naod_naodeus_recruitment_reincarnations_answer: "Sometimes life gets dull and boring, so I quit and start a new one by getting reborn. Why do you ask?"
  naod_naodeus_recruitment_training_question: "What exactly can you do for us?"
  naod_naodeus_recruitment_training_answer: "I can help you improve the cooperation between species in your nation. I might be able to show you and others from your nation life from a different perspective."
  naod_naodeus_recruitment_price_question: "What do you expect to get out of this deal?"
  naod_naodeus_recruitment_price_answer: "New perspectives, new friends, new ways to break the boundaries of my own imagination, new things to learn, new ways to learn old things, debates that will help me further refine or even better change my point of view. Also, as I said, I hope that we together can make this galaxy a better place."
  naod_naodeus_recruitment_true_form_question: "Is this your true form?"
  naod_naodeus_recruitment_true_form_answers: "That depends mainly on your definition of \"true form\". I can think of at least 8 different definitions of this term, which would result in different answers."
  #Path Observation Post  
  naod_event_observation_post_opener_title: "A Letter"
  naod_event_observation_post_opener_desc: "The observation post above §HTalil§! has received a strange message. To be precise a sealed letter addressed $H\"To $COUNTRY$\"§! made from several materials unique to the planet below. The seal shows a chimera made of the three sapient species on the planet. Nobody knows how it ended up in the observation post, but this morning the head scientist found it on her desk."
  naod_event_observation_post_opener_open: "Open the letter."
  naod_event_observation_post_opener_ignore: "This must be a hoax. Destroy it."
  naod_open_letter_title: "Letter to Us"
  naod_open_letter_desc: "The letter reads in perfect [Root.GetSpeciesAdj] language: \n §HDear observers, \n \n I hope you have made yourself comfortable above this nice little planet I live on at the moment. I'm curious to meet you and I have a proposal for your boss boss. I'm sure you have ways to contact him. I will be up with you in 180 days. \n \n Love, \n Naodeus, Bringer of Change§!"
  naod_open_letter_nice: "Prepare for that day, the guest should feel welcome."
  naod_open_letter_ignore: "This has to be a hoax. Find the jester and punish him or her."
  naod_open_letter_aggressive: "Triple the guards. Kill the would-be-intruder."
  naod.11.a.title: "Odd Guest"  
  naod.11.a.desc: "The day Noadeus would visit us has finally come. Our crew scanned the planet and the direct surroundings very closely. No ship from Talil, but this was expected. There has not been one the last time. Exactly 180 days after we opened that letter a young female Schwiff, one of the native species from Talil appeared in the main room of the observation post. She looked amazed and ran a bit around inspecting with enormous joy our technologies. The scientists were completely bewildered and needed some time to react to her. She asked one scientist about his work and the tools he used for it and got the answers she wanted. Then she vanished. \n One moment later an ancient looking Rukh, another native species of Talil appeared next to another scientist. \"It has been a very long time since I have been on a spaceship,\" he stated in a slow but melodic voice. He also disappeared and a third person, an adult Feder of indeterminable sex appeared right next to the head scientist. \"We can have more fun later, let's do the business part of the meeting.\""
  naod.11.a.reply: "Sure, what is your proposal?"

  naod.11.b.title: "Unexpected Guest"
  naod.11.b.desc: "A group of scientists were discussing their observation from the primitive cultures of the planet Talil below them, when a new voice replied: §H\"Uhm actually, this ritual shows the mutual respect and trust for each other and is more or less mandatory, before negotiation in that region of Talil.\"§! An adult Feder, one of the primary species of the planet below, was standing next to them. The Feder looked strange in several ways, one thing was that its sex was undeterminable. The scientists were confused. \"How...?\" It answered, \"I am Naodeus, I wrote you a letter some time ago. I know you ignored it and I find that rude, but I am still interested in talking with your boss boss. So, would you kindly start a transmission to him/her/them?\""
  naod.11.b.apology: "We are sorry for the misunderstanding. We start the transmission."
  naod.11.b.hostiliy: "Leave or we will get rid of you."

  naod.11.c.title: "Unwanted Guest"
  naod.11.c.desc: "The observation post was on high alert. Armed squadrons patrolled the observation post. The scientists were in the main analysis room scanning the region around the observation post. No signs of an intruder, understandably, since those Xenos below lack the ability to build ship to reach it. §H\"Hello!\"§! an unknown female voice said. The scientists saw an adult Feder, one of the species from the planet below. The head scientist drew in a panic the weapon she was given for this day and opened fire on the Xeno. The Feder completely ignored the holes the scientist made in her. §H\"Could you please stop, this is a waste of ammunition.\"§! Soldiers kicked in the door, stormed in and also started shooting at the intruder. Annoyance crept onto her face. §H\"I am Naodeus, an entity from beyond this world. You weapons are useless against me.\"§!"
  naod.11.c.hostiliy: "Begone, Monster."

  naod.12.title: "Warning"
  naod.12.desc:  "§H\"I am not interested in killing you.\"§! Naodeus said cold. Then they transformed into a mist filling the whole station. Eyes, mouths with teeth, tentacles appeared all over the place. §H\"But if you harm the children of Talil, I will take revenge and there is nothing you can do to stop me.\"§! With that the mist and the creepy Feder were gone." 
  naod.12.hostility: "That was disturbing."
  
  naod.14.title: "Greetings"
  naod.14.desc: "The observation post above Talil got contacted by the inhabitants of Talil. They say that Naodeus gave them a toy to speak with us and they would like to learn more about us."
  naod.14.a: "That was unexpected."
  #Event to grant the special project to turn synths into biological pops
  naod_inverse_synthetic_evolution_proposal_title: "Inverse Synthetic Evolution"
  naod_inverse_synthetic_evolution_proposal_desc: "I have talked with several synths about the shroud and they were all very interested in it. They were sad, that they would quite likely never experience it first hand. So I pondered for a while how I could change that. I designed a ritual to transform them into people of Talil or from your species and with a connection to the Shroud! I need some resources to prepare the ritual so I wanted to ask if could get them and if yes on which scale I should perform it?"
  naod_inverse_synthetic_evolution_proposal_denied: "I don't think we should waste ressource on this."
  naod_inverse_synthetic_evolution_proposal_approval: "Let's do this."
  naod_inverse_synthetic_evolution_proposal_approval_hover: "Starts the Inverse Synthetic Evolution special project"
  
  naod_inverse_synthetic_evolution_special_project_finished_title: "Living Machines"
  naod_inverse_synthetic_evolution_special_project_finished_desc: "A wave of Energy blew over all our planets, transforming all robots in our worlds into living beings. Naodeus did try to explain to us how they did it, but failed spectacularly. The result of his process itself was on the other hand a total success."

  naod_inverse_synthetic_evolution_special_project_finished_answer: "Incredible."
  # Flavor Events
  naod_friends_from_talil_title: "Friends from Talil"
  naod_friends_from_talil_desc: "Naodeus: \"Hi there, I spoke with some buddies at Talil and some even visited me here. They found it here very interesting and they asked me, if they could move in. Since they will need some papers, I wanted to ask you if you could organize them?\""
  naod_friends_from_talil_yes: "Sure, but how did you get all these people here?"
  naod_friends_from_talil_no: "Their home planet needs them more."
  
  naod_brilliance_from_diversity_title: "Brilliance from Diversity"
  naod_brilliance_from_diversity_desc: "Our citizens found a way to partly recreate the thought processes Naodeus uses to enhance the artistic mastery of consumer goods. It is complex and in fact needs the cooperation of people from different species, but it greatly increases the beauty, utility and longevity of our consumer goods."
  naod_brilliance_from_diversity_answer: "Magnificent."

  # Vengeance
  # Normal attack
  naod.24.title: "Brutal Regicide"
  naod_attack_on_talil: "§H[Root.GetRulerTitle] [Root.GetRulerName]§! was holding a speech to the masses about the invasion of §HTalil§!, when [Root.Leader.GetSheHe] suddenly screamed in pain. Before anyone could reach [Root.Leader.GetHerHim] to help, [Root.Leader.GetHerHim] caught fire. A disembodied chorus of deeply disharmonious voices shouted §H\"I warned you, and now it is time for you to pay for your arrogance.\"§! \n Seconds later [Root.GetRulerName] evaporated."
  naod.24.answer: "Horrifying!"

  naod.25.title: "Council Killing Spree"
  naod_attack_on_talil_naodeus_ruler: "When §HNaodeus§! learned that the military attacked §HTalil§! it was furious. He left the capital, killing on her way out every other member of the council. Changing their forms in a wild frenzy."
  naod.25.answer: "Horrifying!"
  # World Cracker
  naod.23.title: "Brutal Backlash"
  naod.23.desc: "Since weeks a thin dark mist enveloped our capital planet. It was eery, but transparent for our sensors and totally harmless until recently. After the destruction of Talil, this changed rapidly. The mist seemed to ignite, burning itself around our capital world. Killing everyone from the ruling class by evaporating them. On every glass surface on the planet a message was written: \"You butchered my children, so I butchered your masters.\""
  naod.23.battlecry: "We will mourn their sacrifices."

  naod.26.title: "Disappearances"
  naod.26.desc: "Naodeus had pleaded to stop the attack on Talil to no avail. Now after it is done, §Hthey have gone missing§!. As have §Hall other members of the council§! and the §Hwhole ruling class on our capital planet§!."
  naod.26.battlecry: "How is this possible?"
