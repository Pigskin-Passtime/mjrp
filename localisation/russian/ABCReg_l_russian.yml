  #Events
  ABCReg.0.name: "Not a small sensor malfunction?"
  ABCReg.0.desc: "What could only be rationalized as a sensor malfunction in [From.GetName] soon turned into an undeniable truth. In this system, as all readings and alarms started ringing, lies an entity, a thing of gargantuan proportions, seemingly biological yet barded with energy signatures that could only be synthetic. Amongst this cacophony of alerts, some signals differentiate themselves from multiple points of this organism, likely an attempt at communication. We are being hailed."
  ABCReg.0.a: "How?"

  ABCReg.1.name: "A bold proposition" 
  ABCReg.1.desc: "Greetings! Greetings! Greet… Ah, there you are. \n\nApologies for any inconvenience this may have caused. My name is Bubbles, and it has been a very long time since I've met one of your kind. Pardon my lack of manners; I've been seeking to pledge myself in service of a civilization such as yours for a very long time now. \n\n As for the role, I can assume that governing is out of the question, so admiral will do! It may not look like it, but I have led many important conflicts in the past. This experience will serve you well. \n\n So, what do you say? ready to accept me within your ranks?"
  ABCReg.1.a: "Wait, you are the entire thing?"
  ABCReg.a.response: "That is correct! I've never ceased growing since I was born, and I must say these proportions are getting ridiculous. It comes in very handy to intimidate would-be aggressors, but you can forget about me ruling from a planet or leading a direct ground assault."
  ABCReg.1.b: "You seem quite eager to join us; what's the catch?"
  ABCReg.b.response: "Ah, yes, the truth is, I think I've been locked in this system for quite a while now, and for reasons I can't explain or understand, it is only through an alliance with an empire or faction such as yours that I may be able to get out. Of course, this alone pays for my services. I know these can be sensitive matters."
  ABCReg.1.c: "So what can you do exactly?"
  ABCReg.c.response: "Well, I have accumulated an array of weapons over the years, and they have proved efficient; after all, I'm still alive and quite old. I know the galaxy quite well, and I can even take a hit or two instead of your little guys. I seriously doubt you will find many leaders like me; I haven't in thousands of years."
  ABCReg.1000.d: " Why are you red? "
  ABCReg.1000.d.response: " I don't know. "
  
  ABCReg.5.name: "A fumbling start"
  ABCReg.5.desc: "The living sentient "ship" known as Bubbles had a rocky start amongst our admirals. Although she boasted about her considerable experience, we haven't detected any outstanding capabilities in that regard, save for her deep understanding of the hyperlane web. Being such a massive warship, she also had a difficult time assuming her function as admiral while manning her armada of organic strike craft. Confronted about this detail, Bubble claims it has been far too long since she has met any empire or assumed this level of responsibility, and that to recover some of her expertise, she would have to recall her past life as an admiral of various factions."
  ABCReg.5.a: "Acknoweldged."


  ABCReg.10.name: "Warped landscape"
  ABCReg.10.desc: "Upon entering in [From.GetName], our enormous friend communicated curious elements and instructions to us. One of the planet has the disconcerting ability to communicate to us directly with flashing images of its warped landscape by simply thinking about it, followed by a simple querry \"let us in.\". Bubbles reassured us we were safe, and indeed \"letting in\" the voice had no effect that we are aware of. It seems it is this planet she wants to investigate"
  ABCReg.10.a: "eerie..."

  ABCReg.11.name: "Peace and prosperity"
  ABCReg.11.desc: "After lingering in orbit of the unsettling shrouded world, Bubbles stirs and begins to narrate her history with what she refers to as the conclave. This conclave was one of the first empires she met in her travels, a civilization she describes as pious and peaceful, deeply rooted in traditions. Amongst their diverse display of unity and faith, one involved an empire-wide communion through a chosen few to the shrouded planet. The planet would whisper in return; the more synchronized the union, the more melodic and peaceful its truth. Eventually, the conclave would grant her the ability to participate in this harmonious chorus, alongside other more exotic psionic capabilities."
  ABCReg.11.a: "Peculiar"

  ABCReg.12.name: "A psionic gift"
  ABCReg.12.desc: " "Their aspiration for the betterment of themselves and others was a sight to behold. They would take in whoever welcomed their ways. They improved me too; they were concerned with my "frail form" back then, and after much training, I could slip through space, ignoring hyperlanes, and also deflect plasma weaponry." "
  ABCReg.12.a: "That is a significant improvement"
 
  
  ABCReg.20.name: "Windy weather, stormy weather..."
  ABCReg.20.desc: "Upon entering the Carris system, we are greeted with a minor space storm. A beautiful sight inside a nebula, some of its frozen world faintly shimmering with the abundant amount of light. It seems it is also exactly what Bubbles was looking for as she slowly naviguates the system."
  ABCReg.20.a: "Proceed"

  ABCReg.21.name: "A memory of camaraderie"
  ABCReg.21.desc: "Weathering the tumultuous conditions of the Carris system, bubbles stared at one of its frozen planets with great intensity before telling her tale. After serving as a warship for various like-minded factions, she stumbled upon a brute and crude empire referred to as "the Crew". Though the first exchanges with them were tense, she just managed to convince them of not being some form of big game target practice and remained in their systems. However, seeing one of their ships being attacked by some ransomers prompted her to take action, as she protected the ship and disabled all of its assailants. Grateful for this action, “the Crew” formerly invited her as an admiral in their rowdy but no less sizeable gang of misfits, for border patrol primarily across their nebulous storm-stricken systems. Like most members, and with her acknowledgment, they started adding cybernetic parts to the already sizeable amoeba, and most importantly, a lot of missiles and thrusters."
  ABCReg.21.a: "Peculiar"

  ABCReg.22.name: "A cyber-entente"
  ABCReg.22.desc: " " These planets acted as both a border and a symbol for this empire; the conditions were harsh for the fleets themselves, which is why they aspired to a more “just” lifestyle, and would not tolerate in-fighting. Their martial doctrine and culture were unsettling to me at first, but there was some truth to their behaviors. Perhaps what made me popular in that empire beyond saving that ship was the ingenious idea of one of their captains to start using smaller cyber-enhanced versions of me as familiars. It's intriguing, isn't it? Or perhaps it was my cooking... Alas, this wasn't meant to last. Although it took much more time than anticipated, they ended up disbanding, and I resumed my journey." "
  ABCReg.22.a: "Hang on, what do you mean by "familiars" ?"

  ABCReg.30.name: "Gazing into the abyss"
  ABCReg.30.desc: "Upon entering the [From.GetName], several scientists started second-guessing the indication of our peculiar ally. Bubbles, however, is positive; this is the system she was looking for, and she would like to take a closer look at the only celestial body present, a large black hole."
  ABCReg.30.a: "This can't be right."

  ABCReg.31.name: "A somptuous host"
  ABCReg.31.desc: "Sensory readings shared by bubbles show her slowly navigating around the black hole in an unusual pattern. As she does, pictures, readings, and other data increase exponentially in quality and detail until our very own technology no longer processes it, perhaps confirming the utility of her mission. As our scientist stared mesmerized at this new development, a ghostly structure, the very one she seemed to be contemplating, gradually appeared on screen. She then started explaining : \n\nThis black hole was once the center of a powerful civilization, with the structure itself being a projection from her memory, a synthetic empire that had consolidated all of its resources in this single system and remained largely ignored by the rest of the galaxy. Upon entering the system, the then-sizeable amoeba was greeted by their lavish emperor directly, who urged her to stay as a guest. He would invite her to visit the various sections of this megastructure and propose upgrading all of her cybernetic parts as a welcoming gift. There she stayed with her host for eons, interacting with a populace that could match her life-span and indulging the curious cohort of scientist mini-robots that would analyze and upgrade her."
  ABCReg.31.a: "Astonishing!"

  ABCReg.32.name: "A synthetic friend"
  ABCReg.32.desc: " "Although it was but one system, I had never imagined anyone to reach such technological wonders. One time, the emperor visited me with a mini singularity as his head, a mask of a sort he would use to communicate with the rest of the galaxy, a veritable tour de force he was content to display. Knowing of my past wandering amongst the stars, he showed for the first time what I could only describe as anxiety from his metal form. Shortly after, he would return with a synthetic companion designed exclusively for me. He would serve as both a friend and a vessel for me to access the small confines of their megastructure. It was indeed a prosperous time, one that would eventually come to an end as I returned to an empty structure, my benevolent host and his people vanishing without a trace." "
  ABCReg.32.a: "Well then, introduce us to this "friend" "
  
  ABCReg.40.name: "The Seg sector"
  ABCReg.40.desc: "Upon entering the Seg system, Bubbles sensors darted in various directions, targeting each celestial body in search of what she wanted, or perhaps indecisive about the one she would study first. She claims each of these worlds was habitable once, but our own theories are incompatible with this idea. \n\nCould any of these molten husk of a planets have been thriving habitable worlds  " ##TODO
  ABCReg.40.a: "intriguing"

  ABCReg.41.name: "An age of strife"
  ABCReg.41.desc: "Bubbles stirs from her pondering and elaborates on the story of this Seg and the empire linked to it. \n\nThis was one of the three systems that ruled over what she called “the federation of T'lat”, a restless and vast organization that would span most of the neighboring systems. As she jumped into this system with her colossal form, her intrusion gave a pause to an ongoing civil war between several species members of the federation. After seemingly lengthy deliberation, a cohort of officials ended up hailing her directly as she was prepared to leave. They disclosed an unsettling truth to her; she was the very last of her kind, and scanners depicted that she was sick. They proposed to heal her of this condition, a terminal illness her myriad of synthetic prostheses could no longer endure, in exchange for the rehabilitation of the amoeba species, somehow a former member of this federation as well and even more surprisingly, an extinct species in this galactic age. She eventually agreed, at least the various factions had found common ground and would cease fighting."
  ABCReg.41.a: "Interesting"

  ABCReg.42.name: "Strenght lies in numbers"
  ABCReg.42.desc: " "The clockwork efficiency of the federation was truly a sight to behold; it was like there had never been any strife between them. Their deep understanding of biology led them to quickly enhance and harden my skin and its regenerating properties while staying clear of the technology they didn't know. Before long, my rejuvenated body would also start reproducing large-scale amoebas, the federation promptly communicated and convinced the newly formed pods to join them. I could not ascertain for sure their intentions towards me, or even each other for that matter going forward, so after a few centuries, we parted ways. " "
  ABCReg.42.a: "That is a significant improvement"
  
  ABCReg.50.name: "A bad omen"
  ABCReg.50.desc: "Upon entering the Pion system, the loquacious Bubbles quickly grew silent. The colossal warship shared with us the coordinates of several systems that could help her work through her unexpected amnesia, but she never mentioned this system. Most of the planets have been hollowed out of their core, and there is no sign of alien presence. Realizing we took notice of her unusual behavior, she confirmed this system was indeed worth investigating, although she would have preferred to forget it."
  ABCReg.50.a: "A grim spectacle."

  ABCReg.51.name: "The wrong encounter"
  ABCReg.51.desc: "Gazing at the crudely hollowed world of Pion III, the eclipsing amoeba stood there. Eventually, she shared her uneasy experience with an empire she kept referring to in oddly out-of-character terms: vermin, blight, disaster, or even calamity. Her first meeting with the unknown creatures was one of aggression, as their red designs fired red slabs of an unknown material right into her flesh. Thanks to her instinctively keeping her distance from some of the more short-ranged vessels, the assailant eventually withdrew. Not long after, in an uncanny attempt at diplomacy, the creatures contacted Bubble directly, referring to a greater threat they would be wise to face together. Feeling threatened, she reluctantly agreed, and in this very system, the two sides stood in front of a third, sizeable fleet of synthetic designs, hurling a raging storm of metal and fire in a battle she yet chose to forget."
  ABCReg.51.a: "Peculiar"

  ABCReg.52.name: "Parting with the calamity"
  ABCReg.52.desc: " "What occurred here, I must say, I wish I never remembered. In an uncanny, perhaps personal, perhaps indifferent fashion, the horrendous critters started producing their very own cohort of amoebas to fight this mortal enemy. As the battle slowly grew to a close, I realized what a mistake it was to have remained, to have intervened in this battle that wasn't mine, and promptly left. I wasn't unscathed either, as the red, rock-like substance I received in that earlier confrontation melded within my outer skin. What little information I could gather afterward was that this alien fleet used this system to lure their enemy away from their core world, allowing their concealed pairs to pounce and reduce their civilization to rubble. The fleet I saw retreating never made it back to their systems in time and…” She paused, and in her distraction, she didn't realize the crystalline-like entities forming around her, as if reacting to something. There it stood—a silent fleet, a motionless fleet." "
  ABCReg.52.a: "Ominous"
  
  ABCReg.221.name: "Like wildplasma..."
  ABCReg.221.desc: "News of the “amoeba pets“ spread out like wildplasma within the higher strata of leadership of our empire. Everyone wanted their very own bubbly familiar, and before we could even react, many among us received their amoeba-shaped cyber-friend."
  ABCReg.221.a: "I want one..."
  
  ABCReg.321.name: "Signal from the Hereafter"
  ABCReg.321.desc: "The synthetic being known as B.O.A.T. has been regenerated within one of the highly advanced complexes inside bubbles and is ready to serve again. Bubbles herself was surprised by this turn of events but pledged to serve through her synthetic companion once more, should we need it."
  ABCReg.321.a: "That's a relief..."
  
  ABCReg.421.name: "A loyal brood"
  ABCReg.421.desc: "The recent memory recovered from her time with the federation has greatly increased the resilience of bubbles, and many of her “flagella” have started growing to outstanding sizes, becoming their very own sentient organisms, much like in her story. Bubbles assures us that they are loyal to our fleet, so long as they are properly treated."
  
  
  ABCReg.60.name: "A memorable partnership"
  ABCReg.60.desc: "Helping the formidable ally, Bubbles to recover her memory and become a paragon of admiralty made us realize one thing. Her most memorable moments with various factions involved a gift—a souvenir for her to remember and to endure the cold void in between encounters. Faced with this truth, many of our leaders have started working tirelessly towards the perfect gift for Bubbles, not as a parting token but as a proud testament to our alliance. This endeavor will fail, however, if our efforts aren't focused on the same goal."
  ABCReg.60.a: "Let us teach her how befriend more people"
  ABCReg.60.b: "A bowtie and teachings about macropolitics will do wonders  "
  ABCReg.60.c: "We can't afford to loose bubble, focus everything on teaching her to stay alive"
  ABCReg.60.d: "Repair and uppgrade the broken nourishment center"
  ABCReg.60.e: "Because of the "Pet" event, we know for sure marketing Bubbles would have incredible results"
  ABCReg.60.f: "We could try to clean and patch up some of the broken facilities."
  
  
  
  
  
  
  
  
  
  ABCReg_bubbly_chain_title: " Seeking answers "
  ABCReg_bubbly_chain_desc: "Bubbles, our gigantic friend from gehellum alveo, claims she has already served as admiral for previous galactic powers although her isolation has affected both her memories and capabilities. If we were to lead her back to certain key systems she would almost certainly recover some of those abilities."
  
  
  