l_english:
 fleshsong_tooltip: "Mutations start affecting your pops, you can either try and cure them or make the most of them through a situation."
 fleshsong_allowed: "§GThe Song of Flesh Enabled§!"
 fleshsong_disabled: "§RThe Song of Flesh Disabled§!"

 situation_song_of_flesh_monthly_change_tooltip: "The progress of this §YSituation§! is dependent on the §YApproach§! we pick. Ignoring or embracing the Song will pull us further under its influence."

####################################################
### ARMIES
####################################################
 fleshsong_amalgam_army: "Amalgams"
 fleshsong_amalgam_army_desc: "A congealed biomass of cloning material. It moves with an uncanilly rythmic jaunt."
 NAME_Biowaste_Amalgams: "Amalgams" #country name

####################################################
### TECHNOLOGY
####################################################
 tech_cure_fleshsong: "Remedy of Tune"
 tech_cure_fleshsong_desc: "Using specially developed acoustic medical equipment, the Song's influence can be cut off and affected tissue removed with minimal impact on the host."
 cure_fleshsong_title: "§HUnlocks Feature:§! Remove Song Traits"
 cure_fleshsong_desc: "Researching this technology will allow for the removal of Song traits from species."
 tech_sing_fleshsong: "Sonorous Transgenesis"
 tech_sing_fleshsong_desc: "We are one with the tune, our bodies in harmony, as we sing the song and the flesh cries out our name."
 sing_fleshsong_title: "§HUnlocks Feature:§! Improved Song Traits"
 sing_fleshsong_desc: "Researching this technology will improve positive effects of Song traits by 50% and reduce negative effects."

####################################################
### TRAITS
####################################################
 trait_fleshsong_attuned: "Attuned"
 trait_fleshsong_attuned_desc: "The Song has woven itself deep within this species, granting its host an unnatural sway over others."
 fleshsong_attuned_tooltip: "£unity£ Unity from £pops£ Jobs: §G+5%§!\nPop Upkeep: §R+50%§!\nPop Growth Speed: §R-5%§!\n§BEmbracing the Song reduces negative effects and increases positive effects.§!"
 fleshsong_attuned_basic: "£unity£ Unity from £pops£ Jobs: §G+5%§!\nPop Upkeep: §R+50%§!\nPop Growth Speed: §R-5%§!"
 fleshsong_attuned_enhanced: "£unity£ Unity from £pops£ Jobs: §G+15%§!\nPop Upkeep: §R+20%§!"

 trait_fleshsong_rythmic: "Rythmic"
 trait_fleshsong_rythmic_desc: "New organs syncronise the innards of this species and those of the flora around them to work to an old, forgotten tune."
 fleshsong_rythmic_tooltip: "£food£ Food from £pops£ Jobs: §G+10%§!\nPop Upkeep: §R+50%§!\nPop Growth Speed: §R-5%§!\n§BEmbracing the Song reduces negative effects and increases positive effects.§!"

 trait_fleshsong_sonorous: "Sonorous"
 trait_fleshsong_sonorous_desc: "Additional orifices located on this species' body hum a melody on the edge of recognition. Those with teeth have a surprisingly strong bite."
 fleshsong_sonorous_tooltip: "£happiness£ Pop Happiness: §G+2%§!\nPop Upkeep: §R+50%§!\nPop Growth Speed: §R-5%§!\n§BEmbracing the Song reduces negative effects and increases positive effects.§!"


 trait_fleshsong_gunked_gears: "Gunked Gears"
 trait_fleshsong_gunked_gears_desc: "Soft, meaty tissue grows uncontrolled within these machines, impeding locomotion and granting uncanny insights."
 fleshsong_gunked_gears_tooltip: "£society£ Research from £pops£ Jobs: §G+5%§!\nPop Upkeep: §R+50%§!\nPop Assembly Speed: §R-10%§!\n§BEmbracing the Song reduces negative effects and increases positive effects.§!"

 trait_fleshsong_moldy_circuitry: "Moldy Circuits"
 trait_fleshsong_moldy_circuitry_desc: "A network of mold and mycelia has taken root on several circuits within these machines, with some affected claiming to hear whispers while they recharge."
 fleshsong_moldy_circuitry_tooltip: "Output from Specialist £pops£ Jobs: §G+2%§!\nPop Upkeep: §R+50%§!\nPop Assembly Speed: §R-10%§!\n§BEmbracing the Song reduces negative effects and increases positive effects.§!"

 trait_fleshsong_ichor_leakage: "Ichor Leakage"
 trait_fleshsong_ichor_leakage_desc: "A dark viscous liquid oozes out of openings in the frames of these machines. It has proved surprisingly conductive."
 fleshsong_ichor_leakage_tooltip: "£energy£ Energy from £pops£ Jobs: §G+10%§!\nPop Upkeep: §R+50%§!\nPop Assembly Speed: §R-10%§!\n§BEmbracing the Song reduces negative effects and increases positive effects.§!"

