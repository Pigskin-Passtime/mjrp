 scluster_disabled: "§R$STORM_CLUSTER$ $DISABLED$§!"
 scluster_installed_after_game_start: "$THE_STORM_CLUSTER$ - Ошибка мода" # "$THE_STORM_CLUSTER$ - Mod Error"
 scluster_installed_after_game_start_desc: "Кризисный мод $THE_STORM_CLUSTER$ загружен, но не установлен должным образом. Это может произойти, если мод был добавлен в ваш игровой набор после запуска игры.\n\nВы хотите включить $STORM_CLUSTER$?\n(Внимание: если вы запускаете несколько кризисов MODJAM в середине игры без использования менеджера модов MODJAM, только один из них сможет активироваться.)" # "$THE_STORM_CLUSTER$ mid-game crisis mod is loaded but not properly installed. This can happen if the mod was added to your playset after the game was started.\n\nDo you want to enable the $STORM_CLUSTER$?\n(Caution: If you are running multiple MODJAM mid-game crisises without using the MODJAM mod manager, only one of them will be able to fire.)"

