 scluster.101.name: "$crisis.11.name$" # Subspace Echoes
 scluster.101.desc: "$sensor_station_01_plural$ ao redor da galáxia estão detectando grandes flutuações subespaciais repentinas!\n\nNossos [Root.GetScientistPlural] acreditam que estes são ecos causados por uma enorme quantidade de massa - da ordem de mais de uma dúzia de sistemas estelares! - que está prestes a emergir do subespaço. Eles relatam que esta massa emergirá fora da própria galáxia, o que significa que deve haver pouco perigo imediato de colisão estelar, mas alertam que podemos sentir distorções temporárias na realidade à medida que ela emerge." # "$sensor_station_01_plural$ around the galaxy are detecting sudden large subspace fluctations!\n\nOur [Root.GetScientistPlural] believe these are echoes caused by an enormous amount of mass - on the order of over a dozen star systems! - which is about to emerge from subspace. They report that this mass will emerge outside the galaxy itself, meaning there should be little immediate danger of stellar collision, but warn that we may feel temporary distortions in reality as it emerges." # i.e. the game may freeze for a minute while everything spawns

 # Alert event for players
 scluster.115.name: "Consequências da emergência do subespaço" # "Subspace Emergence Aftermath"
 scluster.115.desc: "À medida que as ondulações do subespaço e os tremores secundários gravíticos desaparecem, nossos [owner.GetResearchers] calcularam a localização do surgimento do subespaço no sudoeste galáctico.\n\nNossos [owner.GetSensoryWorkers] também estão relatando que observaram a formação de §H[owner.scluster_wormholes_seen]§! novos buracos de minhoca." # "As the subspace ripples and gravitic aftershocks fade, our [owner.GetResearchers] have calculated the location of the subspace emergence to be to the galactic southwest.\n\nOur [owner.GetSensoryWorkers] are also reporting that they've observed the formation of §H[owner.scluster_wormholes_seen]§! new wormholes."
 scluster.115.desc.galcom: "Além disso, os §H$resolution_galacticstudies_cooperative_research_channels$§! estabelecidos pela [global_event_country.GetGalCommunityOrGalImperium] também divulgaram um relatório de que um total de §H[global_event_country.scluster_wormholes_seen_galcom]§! novos buracos de minhoca foram detectados por membros da [global_event_country.GetCommunityOrImperium]. Equipes científicas em toda a galáxia estão se preparando para investigar esses fenômenos." # "Additionally, the §H$resolution_galacticstudies_cooperative_research_channels$§! established by the [global_event_country.GetGalCommunityOrGalImperium] have also issued a report that a total of §H[global_event_country.scluster_wormholes_seen_galcom]§! new wormholes have been detected by [global_event_country.GetCommunityOrImperium] members. Science teams across the galaxy are setting out to investigate these phenomena."
 scluster.115.a: "Dificilmente isso será uma coincidência..." # "This is unlikely to be a coincidence..."
