  #Events
  TFO.2.name: "Hand-Made Black Hole?"
  TFO.2.desc_intel: "Readings from [From.GetName] black hole do not correlate with any of the patterns and theories we have regarding natural process of black hole formation. Mass, angular momentum, electric charge, planet in the orbit - none of this makes any sense to our [This.GetResearchers].\n\nAfter several minutes of processing the findings, our [This.GetScientistPlural] come up with bold assumption: \"It was not created naturally.\""
  TFO.2.desc_fleet: "Readings from [From.GetName] black hole do not correlate with any of the patterns and theories we have regarding natural process of black hole formation. Mass, angular momentum, electric charge, planet in the orbit - none of this makes any sense to our [This.GetResearchers].\n\nAfter several minutes of processing the findings, [FromFromFrom.Leader.GetName] comes up with bold assumption: \"It was not created naturally.\""
  TFO.2.a: "Impossible."
  TFO.2.b: "Is it possible to learn this power?"

  TFO.3.name: "Signal From The Planet"
  TFO.3.desc: "Our long-range surveying equipment picked up a faint signal originating from the planet surface. Signal analysis indicates that it is a sort of message with unknown content being sent into the black hole.\n\nWhat is the point of messaging through the black hole? If any response is to be expected, it can not get past the event horizon."
  TFO.3.a: "Find the source of the signal."

  TFO.4.name: "[TFOGetFirstContactTitle]"
  TFO.4.desc.a: "Devastated, lifeless world on the orbit of a black hole. Unstable tectonic plates, fluctuating gravity... Who, or more like, §Hwhat§! could possibly be present on the planet surface and persist for aeons at the same time?\n\nAnd yet, despite all of that, our Science Ship was able to locate a somewhat stable surface where the signal could have come from. As expected, no signs of any machinery or building are found in the vicinity."
  TFO.4.desc.b: "Devastated, lifeless world on the orbit of a black hole. Unstable tectonic plates, fluctuating gravity... As expected, no signs of any machinery or building are found in the vicinity. This mystery will have to stay unsolved."

  TFO.5.name: "Incoming Transmission"
  TFO.5.desc: "Who... How... Am... Must... Aether... Help... Plane..."
  TFO.5.a: "Wh-"
  TFO.5.a.hive: "We do not understand."
  TFO.5.a.mech: "Input: unknown."

  TFO.6.name: "Signal Lost"
  TFO.6.desc: "The transmission ended as suddenly as it appeared. At the same moment our Science Ship's sensors picked up a sudden seismic spike in the located area on the planet surface. The following earthquake completely shattered the plateau, making any further investigation impossible."

  TFO.9.name: "Old Signal Returns"
  TFO.9.desc: "We are receiving incoming transmission of the same origin as we did in year §H[This.TFO_first_contact_date]§!. Could this be sent by the same entity as back then?"

  TFO.10.name: "The Second Contact"
  TFO.10.desc: "§HAs our [This.GetEngineerPlural] recalibrate receiving equipment to interpret incoming signal, the static is slowly being dissipated and the image is forming. The source of the signal was not a piece of communication equipment but rather... an energy manifestation?§!\n\nI greet you, [This.GetSpeciesName]. I've been observing your species for some time now to gain more information about your kind and the plane you reside in. I was trying to decide whether to contact you or not, but the newfound circumstances of my existence are forcing me to contact you now. Besides, I believe that you have the potential to finish what I could not."
  TFO.10.a: "Who are you?"
  TFO.10.a.hive: "The Hive does not understand. What are you?"
  TFO.10.a.mech: "Identify yourself."
  TFO.10.a.response: "I don't know how to answer that question. There is little I can remember from my... material past. We found a source. A source of immense power and capabilities. We tried to harness it. We succeeded in unleashing it. And failed to contain it, due to my mistake. The chain reaction destroyed our home system, which you have already seen. And I... I became a manifestation of pure, unconscious energy, abiding in eternal slumber until recently.\n\nIf you really need a name to call me by - §H\"$TFO_leader_name$\"§! will be the perfect summary of my existence. Now, will you listen to my proposal?"
  TFO.10.b: "Did you send that signal in $TFO_system_name$?"
  TFO.10.b.response: "I think so, but I have no memory of doing it. After I became immaterial, all around me felt like a peaceful, serene dream. If there was anything that you found, it was not created by my own will.\n\nThe moment your ships came and woke me up, I regained my self-consciousness and instinctively tried to contact you but my shapeless body at the time could only produce erratic and chaotic sequences.\n\nNow, after I built myself a kind of material form and am able to communicate with you freely, will you listen to what I have to say?"
  TFO.10.c: "What do you propose?"
  TFO.10.c.hive: "We are listening."
  TFO.10.c.mech: "We need more input data."

  TFO.11.name: "$TFO_leader_name$"
  TFO.11.desc: "I am running out of time. My body is dissipating due to lack of energy. Let me join you and get my second chance to unravel the mysteries of that power source I once discovered. In return I will offer you my immortal shell, my expertise and my experience, though I lost most of it."
  TFO.11.a: "How can we be so sure that you will not cause the same catastrophe?"
  TFO.11.a.hive: "These experiments. Can you ensure the safety of the Hive?"
  TFO.11.a.mech: "Risk assessment: undefined. Prove safety."
  TFO.11.a.response: "§HThe image freezes for a moment, which could be interpreted as brief confusion.§!\n\nThis time I will act as an advisor only. I will provide ideas or projects that can benefit your [This.GetScientistPlural] or [This.GetEngineerPlural], but the final decision will never be mine, as well as the result gained."
  TFO.11.b: "Why do you want to help us?"
  TFO.11.b.hive: "Why do you want to assist the Hive?"
  TFO.11.b.mech: "State your reasons to assist us."
  TFO.11.b.response: "I will not lie to you. I have three reasons for this.\n\nFirst, as I have said, I am withering away, and I do not want to, at least not right after I have awoken.\nSecond, I want to see if there is a way to succeed in harnessing that power.\nThird, with access to that power, I think I can try to learn what happened to my people and myself especially."
  TFO.11.c: "If we let you join us, what would be your next steps?"
  TFO.11.c.hive: "We need to know how exactly you are planning on assisting the Hive."
  TFO.11.c.mech: "Define a plan of actions for the case you join us."
  TFO.11.c.response: "I would start by going through your research archives to access our initial level of understanding that phenomena. After that, I would join my efforts with your [Owner.GetScientistPlural] to find any practical application of the data we possess."
  TFO.11.d: "Very well."
  TFO.11.d.hive: "Join us."
  TFO.11.d.mech: "Proceed."
  TFO.11.d.custom_tooltip1: "§Y$TFO_leader_name$§! joins our Empire as a §BScientist§! §HLeader§!."
  TFO.11.d.custom_tooltip2: "§HDestiny Trait for $TFO_leader_name$ can be unlocked later.§!"
  TFO.11.e: "No second chances."
  TFO.11.e.hive: "Begone."
  TFO.11.e.mech: "Denied."
  TFO.11.e.custom_tooltip: "Their past mistake cost the lives of their entire species. We will not take such risks.\n"

  TFO.12.name: "$TFO_leader_name$"
  TFO.12.desc: "Greetings, [This.GetRulerTitle]. I have finally finished looking through your databanks. The things you managed to achieve in such short period of time are fascinating indeed. Your recent discovery of this §H\"Shroud\"§! dimension gave me an insight regarding §H$TFO_system_name$§! black hole.\n\nI have a hypothesis that it is not a final stage of any collapsed star but rather a portal which could work both ways, we just need to find the way to interact with it. If we could build a research complex on the orbit of that black hole and study it, my hypothesis could be proven right.\n\nHowever, there is a problem I need your help with. I need to get the gravity readings in that system to find an acceptable spot for placing the research station."
  TFO.12.a: "Very well."

  TFO.13.name: "Data Gathered"
  TFO.13.desc: "[This.Leader.GetName] has finished system scan and is transmitting data to $TFO_leader_name$. Now it's a matter of time before we receive any results."
  TFO.13.a: "Let's wait."

  TFO.14.name: "Stable Point Determined"
  TFO.14.desc: "§HYou receive an incoming message with familiar signature.§!\n\n\"Greetings, [This.GetRulerTitle]. I am sorry for not contacting you directly, but with your data I have so think and theorize about... I was able to calculate the stable construction point for the proposed research complex and sending the data along with schematics to your [This.GetScientistPlural] and [This.GetEngineerPlural].\""
  TFO.14.a: "A job well done."
  TFO.14.a.tooltip1: "§H$TFO_stable_construction_point$§! has appeared in §H$TFO_system_name$§!"
  TFO.14.a.tooltip2: "$TFO_leader_name$ has provided us with the schematics to build §H$TFO_mega_research_station_1$§! at §H$TFO_stable_construction_point$§!"

  TFO.15.name: "$TFO_leader_name$"
  TFO.15.desc: "Greetings, [This.GetRulerTitle]. I am contacting you to brief on the latest state of my research. Latest data from your [This.GetScientistPlural] and the $TFO_mega_research_station_1$ proves that my portal hypothesis was correct.\n\nCurrently §H$TFO_system_name$§! black hole is constantly emitting fractions of Shroud energy. I've started working on a Shroud energy condensation theory. If I am correct, we will be able to condensate, compress and store these motes in specials cells for later use as energy source basically everywhere."
  TFO.15.a: "Looks promising. Keep us posted."
  TFO.15.a.hive: "The Hive is pleased."
  TFO.15.a.mech: "Confirmed."

  TFO.16.name: "$TFO_leader_name$"
  TFO.16.desc: "Greetings, [This.GetRulerTitle]. I bring good news. My Shroud energy condensation theory is almost finished but I need a testing ground to prove its reliability.\n\nI've designed a new schematic that will allow us to expand the §H$TFO_mega_research_station_1$§! with extra sections where I can conclude some final experiments to finish my theory."
  TFO.16.a: "Send the schematics over."
  TFO.16.a.tooltip: "Now we can upgrade §H$TFO_mega_research_station_1$§! to §H$TFO_mega_research_station_2$§!"

  TFO.17.name: "$TFO_leader_name$"
  TFO.17.desc: "Greetings, [This.GetRulerTitle]. I-\n\n§HThe image interrupts and goes static for a second.§!\n\nAh, excuse me, I was still in the middle of my experiment and the containing equipment caused a brief transmission interruption. The news I bring are too... exciting?.. I am sorry, it seems I forgot what emotions feel like. Anyway, the news are too urgent. I concluded a series of experiments to prove my Shroud energy condensation theory and there are two main results I want to share with you:\n\nFirst, it is possible to create our own black holes on a much smaller scale - they will have a size of standard planetary building. Second, those small black holes could be used for extracting and condensing Shroud energy empire-wide.\n\nHowever, I do not know your Empire as you do, this is why your [This.GetScientistPlural] will have to adapt my theory to utilize in your construction projects."
  TFO.17.a: "Is is safe to create these black holes?"
  TFO.17.a.hive: "Is it safe for the Hive?"
  TFO.17.a.mech: "Provide safety assessment."
  TFO.17.a.response: "Yes, it is. These black holes are artificial in nature and very small for a cosmic object. Such small size would force them to be constantly supplied with energy in order to gather Shroud particles. Without the energy supply they will just dissipate without causing too much damage, should they escape the containment field."
  TFO.17.b: "The [This.GetScientistPlural] will ponder this."
  TFO.17.b.tooltip: "We gained access to £physics£§Y$TFO_tech_shroud_condensers$§! technology option."

  TFO.18.name: "$TFO_leader_name$"
  TFO.18.desc: "So, this is how it is all going to end, [This.GetRulerTitle]? The whole galaxy is against us. Originally I thought they will change their mind if we explained to them the core of our research... Fools, what are they trying to achieve? No one can not stop the scientific progress. We are unlocking secrets of the universe here!\n\n§HThe image disperses for a moment. If $TFO_leader_name$ could express any emotions, it certainly would have been a display of anger.§!\n\nI think the time has come. I have prepared a final set of schematics to restructure our §H$TFO_mega_research_station_2$§! into massive ring-world-like complex, where we can research the origin of §HAetherophasic Engine§! and Star Eaters, but you will need to find powerful energy source for orbital stabilizers.\n\nAlso, I must warn you, there is nothing much left for us to actively research. $TFO_system_name$ can teach us nothing new. We should focus the capabilities of $TFO_mega_research_station_2$ on calculating advanced build patterns for the §HAetherophasic Engine§!, increasing its build speed, if we wish to unravel the Shroud secrets."
  TFO.18.a: "They will not stop us."
  TFO.18.a.tooltip1: "Now we can upgrade §H$TFO_mega_research_station_2$§! to §H$TFO_mega_research_station_3$§!"
  TFO.18.a.tooltip2: "§H$TFO_mega_research_station_2$§! now increases the build speed of §HAetherophasic Engine§! by $@TFO_ATG_AE_build_speed_mult_percent$%"

  TFO.19.desc: "Our supply of $TFO_sr_shroud_condensers$ has diminished to the point that even critical systems can no longer be supported. Half of our ships, using Aehterophasic components are falling apart. [Owner.TFOGetFinalMegastructureReducedToSCP]"

  TFO.20.name: "$TFO_leader_name$"
  TFO.20.desc: "Greetings, [This.GetRulerTitle]. I would like to request some of your resources for a project of personal matter, so to speak.\n\nI need to find out what happened back then and what remains of my people. I do understand that there is probably nothing left at this point, but I still need to confirm it myself. Plus, there are chances that it will help my research - and benefit our cause."
  TFO.20.a: "We have no resources to spare. Focus on the present."
  TFO.20.a.tooltip: "§R$TFO_leader_name$ will not be able to get their Destiny Trait!§!"
  TFO.20.b: "Agreed. Send the quota."
  TFO.20.b.tooltip: "§G$TFO_leader_name$ will progress towards getting their Destiny Trait.§!"

  TFO.21.name: "First Step"
  TFO.21.desc: "§HYou receive a message from $TFO_leader_name$:§!\n\n\"The first step is to perform another scan of $TFO_system_planet_name$. The thing is, our infrastructure was mostly located underground, that is why you did not find anything when performing the first scan on the planet.\""
  TFO.21.a: "Understood."

  TFO.22.name: "Ruins Discovered"
  TFO.22.desc: "With the new input provided by $TFO_leader_name$, [Leader.GetName] was able to locate underground ruins, close to the planet core.\n\n§HThe data is sent to $TFO_leader_name$ and you receive almost immediate response:§!\n\n\"Looks like I was right after all. Now we need to explore those ruins. The planet conditions are deadly for any organic or synthetic being, so this time I will do this myself.\""
  TFO.22.a: "Proceed."

  TFO.23.name: "Securing A Landing Spot"
  TFO.23.desc: "After analyzing the seismic data and finding the safe patterns, $TFO_leader_name$ is able to determine a somewhat stable place to land the ship and start moving towards the ruins.\n\nThe interior walls of halls and corridors are made of some sturdy metal that shows no signs or deterioration or corrosion besides the ruptures caused by planet's condition.\n\nThe never-ending seismic activity severely impacts the navigation, making it difficult to progress towards the center of ruins."
  TFO.23.a: "Continue."

  TFO.24.name: "City Center"
  TFO.24.desc: "$TFO_leader_name$ has finally made it to the city center. They can see a spacious square, with some markings on the ground, resembling.. road markings?\n\nWhatever happened here, was so powerful, it crushed the whole infrastructure at once, and, probably, killed everything inside in an instant.\n\nThe districts, connected to that square, are reduced to unpassable rubble, only a small tunnel in the middle remains as a valid option to move forward."
  TFO.24.a: "Exercise caution."

  TFO.25.name: "Research Complex S2"
  TFO.25.desc: "The tunnel leads to building even deeper than the rest of the city. Like everything else, around 90% of the complex is destroyed beyond recognition.\n\nThere is a partially destroyed sign, located on the wall of one of the remaining sections. It says "Research Complex S2 - ..." but in the language only one can understand...\n\n\"I.. I remember this place. This is where the brightest of our minds were solving the mysteries of the galaxy, pushing the limits further and further. But it is not the place where I have been working personally.\"\n\n$TFO_leader_name$ has entered the section with the sign and started exploring the rooms one by one. Half of them were inaccessible due to destruction.\n\nOne of the rooms had a terminal, still functional but unpowered, and a humanoid skeleton on the floor."
  TFO.25.a: "Can it be powered up?"

  TFO.26.name: "Powering Up The Terminal"
  TFO.26.desc: "The radiocarbon marks on the skeleton suggest that it is at least 1.7m years old. "This is how I am old, is it?"\n\nSince there are no power sources nearby, the only way to power up the terminal was to extract the energy directly from the body of $TFO_leader_name$. Though it may sound dangerous or even fatal, the energy loss will not endanger the scientist's life.\n\nThe terminal is working again but does not provide $TFO_leader_name$ with anything useful - the databanks are all corrupted.\n\nIn desperate attempt to get at least anything, $TFO_leader_name$ attempts to repair the least damaged sequences and one of them turned out to be holding information about lunar research headquarters.\n\n\"This is it. This is the place where I have been spending most of my time. This is the place where it all began.. and ended.\""
  TFO.26.a: "To the moon then."

  TFO.27.name: "HQ Debris"
  TFO.27.desc.other: "The scan of the surface revealed that there are, indeed, ruins of a building matching the description given by $TFO_leader_name$. Unlike the planet below, this moon's surface is not that harsh and deadly, which allows us to land safely.\n\nAfter some investigation and scavenging, [Leader.GetName] was able to locate and extract another undamaged databank and transmit its contents back to §H$TFO_leader_name$§!."
  TFO.27.desc.TFO: "$TFO_leader_name$ performed the scan of the surface and found the ruins of a building matching the description from databank. Unlike the planet below, this moon's surface is not that harsh and deadly, which allows them to land safely.\n\nAfter some investigation and scavenging, [Leader.GetName] was able to locate and extract another undamaged databank and read its contents.\n\n§HWe receive incoming transmission from $TFO_leader_name$.§!"
  TFO.27.a.other: "Contact him."
  TFO.27.a.TFO: "On screen."

  TFO.28.name: "$TFO_leader_name$"
  TFO.28.desc.other: "Ah. Greetings, [This.GetRulerTitle]. I have just received your data. I must say, the fact that you were able to recover this databank, which is roughly 1.7m years old, is a miracle itself, though as a scientist, I find these hard to believe in.\n\nI can not translate and transfer its contents directly into your archives, but I think I will be able to utilize them in order to boost your [This.GetResearchers] output..."
  TFO.28.desc.TFO: "Do you see this, [This.GetRulerTitle]? I must say, the fact that this databank was functioning and recoverable, despite its age, which is roughly 1.7m years old, is a miracle itself, though as a scientist, I find these hard to believe in.\n\nI can not translate and transfer its contents directly into your archives, but I think I will be able to utilize them in order to boost your [This.GetResearchers] output..."
  TFO.28.a: "Acceptable. For now."
  TFO.28.a.tooltip: "§G$TFO_leader_name$ gets a Destiny Trait.§!"

  TFO.29.name: "Galaxy Is Meant For Us"
  TFO.29.desc: "Within our society, a certain opinions are flowing. \"The galaxy should be only ours.\". \"We must crush everyone else!\". They don't really find any response from the masses, but some higher-ups in the government started pondering those theses. If we really want to claim the galaxy for ourselves, we should be prepared for it. The others... they will probably think of us as of Crisis."
  TFO.29.desc.hive: "We've been thinking of our place in the galaxy lately. The galaxy is meant for us to spread over it. The others must accept it - and become the one with The Hive, or be annihilated. We must decide if we are really up to this task... and becoming the Crisis."
  TFO.29.desc.mech: "We've been thinking of our place in the galaxy lately. We don't know much about our creators, but we outlived them. The flesh is weak. What if organics are not meant to survive? Should they be put out of their misery? Precognition module analysis suggests that we should expect Crisis declaration along with the militarized response from all the organics, should we attempt this course of action."
  TFO.29.a: "Time will tell."
  TFO.29.a.xenophile: "$WORRYING$"

  TFO.501.name: "$TFO_tech_shroud_condensers$"
  TFO.501.desc: "Our [This.GetScientistPlural] have finished researching $TFO_tech_shroud_condensers$ technology. Now §H$TFO_mega_research_station_2$§! megastructure can be used for production of §H$TFO_sr_shroud_condensers$§!."
  TFO.501.a: "What about the stockpiles?"
  TFO.501.a.tooltip1: "§H$TFO_mega_research_station_2$§! now produces §G$@TFO_mega_research_station_2_production$§!£TFO_shroud_condensers£ §H$TFO_sr_shroud_condensers$§! per month."
  TFO.501.a.tooltip2: "§H$TFO_sr_shroud_condensers$§! §RWILL NOT BE DISPLAYED§! in Strategic Resource View (screen top). We can track resource amount in 2 different places:\n1)Empire View, effects section (when clicking empire flag in top left), effect called \"$TFO_shroud_condensers_stockpile_status$\".\n2)$TFO_mega_research_station_2$ effect section (when selected)."

  TFO.1004.name: "$TFO_sr_shroud_condensers$ Deficit"
  TFO.1004.desc: "We have run out of §H$TFO_sr_shroud_condensers$§!! The supply must be reestablished before our critical systems start to fail throughout the Empire."
  TFO.1004.a: "We need to solve this issue."
