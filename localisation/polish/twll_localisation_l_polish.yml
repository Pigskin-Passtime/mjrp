l_polish:

  NAME_legendary_puzzle_system:0 "Dimensiva Custodiae"
  NAME_Warpeo:0 "Warpeo, the dimensional phantasm"
  NAME_Dimentional_Guardians:0 "Dimentional Locks"
  NAME_Warpeo_Guardian:0 "Dimentional Lock"
  r_warpeo_artifice:0 "Warpeo Artifice"
  r_warpeo_artifice_desc:0 "The relic has been crafted by the dimensional phantasm and only appears to react in their presence. Its structure nor material is unknown to us, but its power seems to amplify the phantasm's dimensional abilities for use at much greater scales."
  r_warpeo_artifice_regular_effect:0 "Amplify Warpeo's dimensional prowess."
  warpeo_not_assigned_fail:0 "§HWarpeo operates best assigned to a fleet§!"
  warpeo_system_no_lock_fail:0 "Warpeo's fleet is in a solar system where no dimensional locks are present."
  warpeo_system_no_bypass_or_locked_fail:0 "Warpeo's fleet is in a solar system where there are no bypasses, or a dimensional lock(s) has been placed on the bypass(es)."
  WARPEO_GUARDIANS_PROJECT:0 "Dimensional vortexes and station"
  WARPEO_GUARDIANS_RESET_PROJECT:0 "Restarting the pillar devices"
  warpeo_enemy_fleet_mia_time:0 "Warpeo's influence"
  leader_trait_space_manipulator:0 "Space Manipulator"
  leader_trait_space_manipulator_desc:0 "The dimensional effects of Warpeo's presence are many, empowering fleets to be as illusive as the universe itself."

  twll_events.1.name:0 "Mysterious Dimensional Vortexes"
  twll_events.1.desc:0 "We have encountered strange wormhole-like manifestations that do not appear to have naturally occurred. There is also a station in the middle that may have something to do with these phenomena. We can investigate the station and confirm our suspicions, but our sensors are not detecting any life onboard so it should be safe to proceed; however, with caution nevertheless."
  twll_events.1.a:0 "See what you can find..."

  twll_events.2.name:0 ""
  twll_events.2.desc:0 "As an interdimensional being, Warpeo grew weary of his situation. Existing without purpose for an untold amount of time, he decided to begin testing his limits with wormholes and the potential behind these unknown phenomena.\n\nDuring his experimentations, Warpeo made himself known to multiple lifeforms spanning across the universe. His appearance and prowess was frightening to many, sparking fear and concern. His careless interactions have led him to be tricked and sealed away for a few millennia.\n\nThe seal's workings were unknown to him, however, five dimensional devices were set up to endlessly imprison him in an inescapable void."
  twll_events.2.a:0 "Hopefully this was just a misunderstanding..."

  twll_events.3.name:0 "Warpeo vocalises..."
  twll_events.3.desc:0 "Greetings,\n\n§HA strange relatively miniature wormhole-like vortex materialises as a mysterious entity becomes visible shortly after.§!\n\nI am Warpeo and as thanks for my release, I shall aid you in your cause for the duration of your fleeting existence... If you so wish."
  twll_events.3.a:0 "Hello, Warpeo."
  twll_events.3.a.response:0 "I'm impressed you managed to break the seal those creatures tricked me into... I am the dimensional phantasm, bending space itself to my will. I have existed since time itself, but that is still the one thing I cannot seem to grasp. In my absence in the universe, I have developed a way to generate transient wormholes on a larger scale than those that can only contain me..."
  twll_events.3.b:0 "Is that... a wormhole?"
  twll_events.3.b.response:0 ""
  twll_events.3.c:0 "Who imprisoned you?"
  twll_events.3.c.response:0 ""

  twll_events.5.name:0 "Station Control Hall?"
  twll_events.5.desc:0 "Found something! There are 4 pillar shaped devices, and they all surround the one in the middle. Something is written on each with the one in the middle telling five narratives… Perhaps it's an activation sequence riddle?!\n\nClue one; stars are formed from clouds of gas and dust, and the dimension where time is reversed is the past. You must activate this device last, as it will take you back to the origin of the ancients.\n\nClue two; planets orbit the sun in a roughly flat alignment, and the dimension where space is curved is the gravity. You must activate this device third, as it will show you the influence of the ancients on the solar system.\n\nClue three; comets are composed of ice and rock and orbit far from the sun, and the dimension where matter is dispersed is the entropy. You must activate this device second, as it will reveal the chaos and disorder that the ancients faced.\n\nClue four; black holes emit no light or sound and consume everything around them, and the dimension where energy is conserved is the mass. You must activate this device first, as it will unlock the power and potential of the ancients.\n\nClue five; whereas this one, refers to something that the ancients sealed in fear, knew nothing about, and could not understand."
  twll_events.5.a:0 "Event Horizon"
  twll_events.5.b:0 "Oort Cloud"
  twll_events.5.c:0 "Ecliptic Plane"
  twll_events.5.d:0 "A Phantasm"
  twll_events.5.e:0 "Nebula"
  twll_events.6.name:0 "Warpeo Artifice Activation"
  twll_events.6.desc:0 "How would you like to proceed?"
  twll_events.6.a:0 "Dimensional Lock Override"
  twll_events.6.b:0 "Place Dimensional Lock(s)"
  twll_events.6.c:0 "Force Enemy MIA"
  twll_events.6.d:0 "[[PLACEHOLDER]]"
  twll_events.7.name:0 "The fleet has been... 'mitigated'"
  twll_events.7.desc:0 "Warpeo's fleet has engaged an enemy fleet and used the relic to force the opponent into a state of MIA!"
  twll_events.7.a:0 "Good news, push on!"
  twll_events.8.name:0 "Warpeo vocalises..."
  twll_events.8.desc:0 "Relic... Anyone?"
  twll_events.8.a:0 "We'll take good care of it!"
  twll_events.8.b:0 ""
  twll_events.8.b.response:0 ""
  twll_events.8.c:0 ""
  twll_events.8.c.response:0 ""