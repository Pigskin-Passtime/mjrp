 NAME_Zullius: "Zullius"
 celestial_rifts_in_space: "Spatial Rifts"
 celestial_rifts_in_space_DESC: "The Dimensional Wayfarer has expressed concern over the recent sudden changes in the rifts and distortions within our empire. Though initially miniscule, these rifts have grown exponentially more common and detectable. There may be something dangerous afoot."
 celestial_unbidden_rift_sp: "The Rift"
 celestial_unbidden_rift_sp_DESC: "We have detected a previously uncharted star system, Zullius, and with it, an extreme amount of pulsating energies emitting from the surrounding miasma. Reports indicate an especially high concentration of spatial distortions within the star system.\n\nThe Dimensional Wayfarer has so far found no reasoning behind these strange effecst, though this study may prove dangerous."
 celestial_situation_sp1: "Studying the Portals"
 celestial_situation_sp1_DESC: "Some of our researchers have suggested sending probes with the purpose of studying the curious rifts caused by the extradimensional incursion throughout our empire."
 celestial_situation_sp2: "Blocking the Invaders"
 celestial_situation_sp2_DESC: "Despite what little we know of the dimensional rifts, the Dimensional Wayfarer has supplied us with some potentially functional schematics for devices which may assist in preventing the formation and development of these rifts."
 celestial_situation_sp3: "Minor Incursions"
 celestial_situation_sp3_DESC: "Probable theories suggest that the rifts used by the extradimensional invaders, when in their 'young' state, are very susceptible to explosive weaponry. This may be useful in repelling the incursion."
 celestial_invaders_finale: "Closing the Portal"
 celestial_invaders_finale_DESC: "Thanks to our combined efforts with The Astral Corps, we have gleaned much knowledge with regards to the alien intruders, now known to be The Unbidden.\n\nNow, their only remaining bypass into our universe remains in the Zullius system. We must extinguish this portal, and the Wayfarer seems to know exactly how to do so. However, we must provide military support to ensure their methods are safe from the minor fleets attempting to hold up the portal."
 celestial_wayfarer_victory: "Victory of the Wayfarer"
 celestial_wayfarer_victory_gestalt: "$celestial_wayfarer_victory$"
 celestial_wayfarer_sacrifice: "Sacrifice of the Wayfarer"
 tech_celestial_solar_lightning: "Solar Fulmination"
 tech_celestial_solar_lightning_desc: "A strange weapon from another world, where sunlight manifests as a form of lightning. According to explorers, this sunlight is held in very high regard, associated with individuals known as Gods."
 tech_celestial_void_laser: "Negative-Mass Laser"
 tech_celestial_void_laser_desc: "A ship component made of incomprehensible technology. It seems to utilise dark matter in an unknown chemical reaction, resulting in a particularly effective energy weapon."
 tech_celestial_warp_drive_1: "Familiar Warp Drive"
 tech_celestial_warp_drive_1_desc: "A special type of ship drive utilising a form of warp technology which has been adjusted for use within the hyperlane network. Strangely, there is an odd feeling of familiarity to it."
 tech_celestial_warp_drive_1_tt: "§HUnlocks Drive Component:§! Warp Drive"
 tech_celestial_warp_drive_2: "Upgraded Warp Drive"
 tech_celestial_warp_drive_2_desc: "An upgraded version of the Warp Drive, merged with our own Hyper Drive technology."
 tech_celestial_warp_drive_2_tt: "§HUnlocks Drive Component:§! Upgraded Warp Drive"
 tech_celestial_warp_drive_3: "Advanced Warp Drive"
 tech_celestial_warp_drive_3_desc: "The final level of Warp drive, quite similar in make in terms of the theoretical Jump Drive, but largely safer."
 tech_celestial_warp_drive_3_tt: "§HUnlocks Drive Component:§! Advanced Warp Drive"

