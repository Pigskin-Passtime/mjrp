 spawn_celestial: "Spawn §YThe Dimensional Wayfarer§!"
 celestial_tooltip: "A mysterious nomad from a forgotten dimension. They hold unknown technology and relics from various dimensions and worlds, but there may be more than meets the eye with this traveller. Nevertheless, their goods no doubt offer great power and unique knowledge.\n\nDLC Required: §GNone§!\nAvailable to: §GAll empire types§!"
 
 NAME_Cosmic_Emporium: "The Wayfarer's Cosmic Emporium"
 NAME_Astral_Corps: "The Astral Corps"
 NAME_Keeper: "Keeper 9a32rt"
 celestial_setup.8.name: "The Keeper"
 celestial_setup.8.desc: "§BTransmission secured.§!\n\nSalutations, [Root.GetSpeciesName]. We did not expect to be found so soon."
 celestial_setup.8.a: "Who are you?"
 celestial_setup.8.a.reply: "We are Keeper 9a32rt of §HThe Astral Corps§!, an organisation dedicated to the security and stability of various worlds, some beyond our own. We are one of the Keepers dedicated to keep this region safe through our observation.\n\n§RFurther information cannot be disclosed.§!"
 celestial_setup.8.b: "What is this star system?"
 celestial_setup.8.b.reply: "...\n\nThis is the §HBase of Convergence§!. You have no doubt found that this region of space experiences particularly extreme quantum fluctuations. Perhaps you have even seen the strange anomalies randomly appearing in the area.\n\n§RFurther information cannot be disclosed.§!"
 celestial_setup.8.c: "Well met."
 celestial_setup.8.c.reply: "Processing...\n\n§BReceiving dedicated transmission:§!\n§Y[Root.GetSpeciesName]. Do not be foolish. Leave this outpost at once and do not approach the rift. This is your only warning.§!\n\nA pleasure to meet you. Goodbye."
