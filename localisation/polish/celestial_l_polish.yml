 pc_celestial_vortex: "Mysterious Vortex"
 pc_celestial_vortex_desc: "A strange rift seemingly from eons past. Some say it acts as a conduit to other dimensions, but the truth is entirely unknown."
 pc_celestial_vortex_small: "Mysterious Vortex"
 pc_celestial_vortex_small_desc: "A rift leading to another world. Traversing it requires very careful work and technology."
 NAME_Celestial_Vortex: "Wayfarer's Vortex"
 NAME_Wayfarer: "The Dimensional Wayfarer"
 NAME_TheWayfarer: "ISS Nomadic Arc"
 NAME_NomadsPillage: "Nomad's Spoils"
 NAME_NomadsShip: "Arcania"
 leader_trait_celestial_vagabond_astralplanes: "Interdimensional Vagabond"
 leader_trait_celestial_vagabond_astralplanes_desc: "A strange, devious alien hailing from a foreign dimension. Their arcane knowledge has certainly attracted our researchers."
 leader_trait_celestial_vagabond: "$leader_trait_celestial_vagabond_astralplanes$"
 leader_trait_celestial_vagabond_desc: "$leader_trait_celestial_vagabond_astralplanes_desc$"
 leader_trait_celestial_eccentric: "Eccentric Zeal"
 leader_trait_celestial_eccentric_desc: "This leader pursues their missions and endeavours with a particularly unique wanderlust for knowledge and souvenirs. Some may say they act quite hyper-fixated at times."
 celestial_catch_phrase: "§L"You and me are going to do great things together! Especially me."§!"
 desc_celestial: "A strange scavenger with an unknown past. Their journeys have yielded some great and unique relics for research."
 paragon_celestial_joins: "§Y$NAME_Wayfarer$§! joins your Empire as a §HScientist§!\nGain control of the §YISS Nomadic Arc§!, an armed Science Ship with the §HSpatial Distortion§! ability"
 celestial_setup.3.name: "The Wayfarer"
 celestial_setup.3.desc: "§HWe have successfully established communications with the strange vessel.\n\nThe scaly alien appears with a strange display of both curiosity and suavity. A few of their appendages are covered in wrappings and their face has some peculiar markings and scars. And yet, they appear quite cheery and welcoming.§!\n\nOh, hey there! Nice to meet you. Can't help but notice you've somehow come across my compass. Very impressive! I would absolutely love to talk with you about how you did that... but sadly, I'm quite busy.\n\nYou wouldn't mind passing that over to me?"
 celestial_setup.3.a: "Where did you come from? Who are you?"
 # celestial_setup.3.a.response: "Oh? I very well may be, would you happen to know something about that?\n\n§HSuddenly their body burst ahead with a slyish smile.§!\n\nTell ya what, I'll give you a great deal: you give back my... compass. I work for you. Trust me, I have quite the repertoire! And I really need that back."
 celestial_setup.3.a.response: "Well... You needn't worry about that. Let's just say I come from a place long forgotten. Look, my deal is going to buncha different places with that compass. I can't do that without that compass.\n\n§HSuddenly their body burst ahead with a slyish smile.§!\n\nTell ya what, I'll give you a great deal: you give back my... compass, and I work for you. Trust me, I have quite the repertoire! And I really need that back."
 celestial_setup.3.b: "What can you do for us?"
 celestial_setup.3.b.response: "§HAs though slightly insulted, the alien recoils for a time before lifting their arms up by their side with a wide grin.§!\n\nWell! Good question, here's a better one: do you desire control? Or maybe power? Or is it freedom? All this and more can be provided with some of my... technology. Plus, I've seen and obtained quite a few items of interest. They'd certainly interest an intelligent ruler such as yourself."
 celestial_setup.3.c: "Relics and artifacts? Of what kind?"
 celestial_setup.3.c.response: "Well, of all kinds, really. Some from eons past, some from a few centuries later. There are worlds you would not believe exist! I know I hardly do. Either way, you'd make great use of some of my relics.\n\n... As soon as I can set up shop. And avoid some of my... less favourable customers."
 celestial_ship_button_desc: "§HSpatial Distortion§!\nDisrupt the gravity wells of a star, removing all connected hyperlanes for 5 years.\nCost: £energy£5000\nCooldown: £time£ 10 years"
 celestial_action_activity_key: "Moving to isolate the $PLANET_NAME|Y$ system"
 celestial_context_menu_title: "Spatial Distortion"
 SHIP_CELESTIAL_DISTORTION: "Spatial Disruptor\n§WCan use the §YSpatial Distortion§! ship action§!"
 celestial_used_distortion: "Spatial Distortion Cooldown"
 celestial_used_distortion_desc: "§WCannot use the §YSpatial Distortion§! ship action§!"
 celestial_isolated_star: "Isolated Star\n§WThis star system has been cut off from the Hyperlane network temporarily.§!"
 MESSAGE_STAR_ISOLATED_TITLE: "Star Isolated"
 MESSAGE_STAR_ISOLATED: "The §H[Root.GetName]§! system has been isolated from the rest of the galaxy."
 MESSAGE_STAR_RETURNED_TITLE: "Star Restored"
 MESSAGE_STAR_RETURNED: "The §H[Root.GetName]§! system has been reconnected to the Hyperlane network."
 arcania_wayfarer: "Science Ship"
 arcania_wayfarer_plural: "Science Ships" 
 celestial_flavour.1.name: "Workplace Accident"
 celestial_flavour.1.desc: "While working with §YScientist [celestial_flavour_event_leader.GetName]§!, the §HDimensional Wayfarer§! claims to have accidentally activated a device intended for their joint research. Initial reports seem to suggest that [celestial_flavour_event_leader.GetName] was hit by some form of high-power ionisation beam, severely affecting the molecular structure of [celestial_flavour_event_leader.GetName]'s body. As a result, their life expectancy has been deemed to have been severely reduced.\n\nNeedless to say, they are quite upset."
 celestial_flavour.1.a: "Reprimand the Wayfarer."
 celestial_flavour.1.b: "Science can be dangerous."
 leader_trait_celestial_risktaker: "Risk-taker"
 leader_trait_celestial_risktaker_desc: "This leader can be considered quite liberal when it comes to standard safety protocols. They tend to not be very cautious in their endeavours."
 celestial_flavour.2.name: "Arcane Endeavours"
 celestial_flavour.2.desc: "The §HDimensional Wayfarer§! has recently requested aid in the form of resources and researchers for their attempt at deciphering some sort of strange artifact. They claim it functions as a codex of some sort, potentially revealing a brand new technology."
 celestial_flavour.2.a: "Permit it."
 celestial_flavour.2.b: "We cannot spare the resources as of now."
 celestial_flavour.3.name: "Successful Deciphering"
 celestial_flavour.3.desc: "Our joint research with the Wayfarer has yielded successful results! After decoding strange runes on the codex, a method of safely prying open the device was devised and completed.\n\nA rather antique-looking scroll was inside, and while most of the information was previously known by our researchers, some insights into rare technologies could be gleaned."
 celestial_flavour.3.a: "Good."
 celestial_flavour.4.name: "Unexpected Success"
 celestial_flavour.4.desc: "Despite being dissuaded by our refusal to provide resources, the Wayfarer has managed to devise a way of decoding the ancient codex of theirs. Unfortunately, their method of doing so was... slightly explosive.\n\nDespite the destruction of the codex, as well as minor damage to the surrounding area on §Y[capital_scope.GetName]§!, the Wayfarer has managed to gleam some experience and knowledge."
 celestial_flavour.4.a: "At least something came of it."
 random_cap_building_ruined: "A random building on §Y[capital_scope.GetName]§! is ruined."
 celestial_setup.10.name: "A Mystical Vortex"
 celestial_setup.10.desc: "When the [Root.GetName] approached the [From.GetName] system, the crew on-board were immediately greeted by a truly majestic, yet fear-inducing sight.\n\nAn impossibly massive, sprawling rift of some kind, with vast fields of debris and seemingly-ancient ships encompassing the vortex. Standing out amongst the fragmented planets and asteroids, there was a shining orbital station adjacent to the vortex's magenta emissions, somehow managing to remain safely still.\n\nMost noticeably, the [Root.GetName]'s sensors began to go off the charts, detecting extreme fluctations in energies, transmissions and noise. A special project has been prepared to investigate the station."
 celestial_setup.10.a: "How... peculiar."
 celestial_convergence_sp: "Outpost of the Great Vortex"
 celestial_convergence_sp_DESC: "The §HBase of Convergence§!, as our researchers have dubbed it, is home to a truly massive rift of otherworldly proportions. The nearby debris is overshadowed by a lone space station, seemingly built long, long ago."
 celestial_setup.11.name: "An Otherworldly Origin"
 celestial_setup.11.desc: "The [Root.GetName] is currently in the middle of completing the special project near the Base of Convergence. Very little was gleaned about the strange rift itself, as attempts to approach it would be met with stronger and stronger gravitional forces. The risk of destruction resulted in the team aboard focusing on uncovering the secrets behind the outpost in low orbit of the rift.\n\nUpon completing an initial survey of the station, our crew began to prepare to enter the inside, when we received a sudden transmission from the outpost itself.\n\nThe team will continue to study the debris fields for technology and information."
 celestial_setup.11.a: "Open comms and continue the project."
 celestial_setup.12.name: "Project Completed"
 celestial_setup.12.desc: "The [Root.GetName] has completed the project near the rift at the Base of Convergence.\n\nMost of the debris was impossible to distinguish from any other form of scrap, but almost every piece of scrap seemed to have been of different origins. Even the ships and stations floating amongst the remnants were of various compositions and materials.\n\nThe only thing to uncover was the age of each piece of debris; most are old; very old, with few pieces being from the last decade. And yet, there is one, largely intact, ship nearer to the rift more than anything else, emitting some powerful energies. A short exploration revealed some sort of broken compass, emitting purple lights as our crew approached.\n\nThe destroyed relic was retrieved, but little is known about it."
 celestial_setup.12.a: "Intriguing."
 celestial_relic_timer: "§YOur researchers are currently studying this relic.§!"
 celestial_setup.13.desc: "§BTransmission secured.§!\n\nGreetings. We have noticed a particularly unique relic in your possession. You must... §RERROR§!\n\n§BDedicated transmission node vulnerable. §RVulnerable. Vul--§!§!\n\n§YError resolved. Hello, [Root.GetName]. That Derelict Compass in your possession seems to be in quite the sad state. I have seen this sort of artifact many times.\n\nIf you're willing to part with it for a time, I can repair it for you.§!"
 celestial_setup.13.a: "Of course, we shall do so."
 celestial_setup.13.a.reply: "§YSplendid.\n\nFret not, I will contact you later once necessary.§!"
 celestial_setup.13.b: "We would prefer if you instead offer aid in repairs."
 celestial_setup.13.b.reply: "§YUh. Understood.\n\nExpect a transmission to your research department soon.§!"
 celestial_give_relic: "Temporarily give the §YDerelict Compass§! to §HThe Astral Corps§!."
 celestial_get_relic_aid: "§HThe Astral Corps§! will help us restore the §YDerelict Compass§!."
 celestial_setup.14.desc: "§YGood to see you [Root.GetRulerName].\n\nI am pleased to inform you that the compass restoration project has been completed. Despite the resource costs in doing so being greater than expected, you do not have to cover these expenses. Consider it a gift.\n\nActivating the relic would be interesting, after working on this project for so long. The compass, I've seen it before. It has... §RERROR§!\n\nDamn.. must... activate-§!\n\n§BControl restored. Engaging emergency standby mode.§!"
 celestial_setup.14.a: "Hmm. How strange."
 celestial_setup.14.b: "What is going on here?"
 relic_compass_alive_effect: "\n§YThe Astral Corps urged us to activate it. We do not know what will happen.§!"
 celestial_setup.15.name: "Vessel from Beyond"
 celestial_setup.15.desc: "Upon activating the arcane §HCelestial Compass§!, it suddenly lit up with a deep, blue hue, with the arrow accelerating as it spun around the compass. As our researchers watched in fear and curiosity, the arrow began to slow down while the compass shock violently.\n\nThen it stopped. After the initial confusion, our sensors detected a strange increase in the energy fluctuations released by the Base of Convergence. Enshrouded by a flash of light, there came a large, antiquated vessel, covered in gold and lights conveying a sense of grandiosity.\n\nNo doubt this appearance was a result of the compass's activation. While the vessel does not appear outwardly hostile, thankfully, it could be potentially dangerous."
 celestial_setup.15.a: "Work on contacting the vessel."
 NAME_Astral_Incursion: "Otherwordly Beasts"
 celestial_legion: "Celestial Beast"
 
 r_celestial_aetherial_codex: "Aetherial Codex"
 r_celestial_aetherial_codex_desc: "An ethereal and ancient scroll from a grand library of another dimension.\n\nIt is considered a forbidden relic, for though it appears short, the scroll seems to unravel infinitely, revealing strange energies. Whether this is some optical trick, arcane technology or otherwise, it is certainly unsettling."
 relic_aetherial_codex_effect: "§H3 random technology sub-categories§!:\n  - Gain a research boost\n  - Partially research a technology\nA random leader gains §Y1-2§! negative traits"
 r_celestial_compass_alive: "Celestial Compass"
 r_celestial_compass_alive_desc: "Large, ancient compass of an unknown origin. Restored with the help of The Astral Corps, who have suggested activating it.\n\nThis relic appears as to hold some sort of mysterious power within the gem at the center. Its purpose is not known."
 r_celestial_compass_broken: "Derelict Compass"
 r_celestial_compass_broken_desc: "A strange and defunct compass.\n\nAll power that may have once been held within the gem at the center of this relic has dissipated. Perhaps it can be repaired?"
 r_celestial_compass_final: "Celestial Compass"
 r_celestial_compass_final_desc: "The Dimensional Wayfarer, from a world long-destroyed, took to dimension-hopping for a living. As the last of their kind, they hold great treasures and relic, the most vital of which is this compass, allowing their travels. It is a token of their friendship, as well as a sign of peace."
 r_celestial_compass_weak: "$r_celestial_compass_final$"
 r_celestial_compass_weak_desc: "Large, ancient compass of an unknown origin, belonging to a mysterious traveller from another dimension.\n\nThis relic appears as to hold some sort of mysterious power within the gem at the center. Its purpose is not known."
 celestial_r_celestial_compass_final_modifier: "Celestial Speed"
 celestial_r_celestial_compass_weak_modifier: "$celestial_r_celestial_compass_final_modifier$"
 r_celestial_profane_arca: "Profane Tome"
 r_celestial_profane_arca_desc: "The texts within this grand book cause some astral, or perhaps psionic, manifestations when recited. When this occurs, it is believed that the pysche of intended individuals can be altered and transfixed, even just slightly.\n\nUnfortunately, continued use of the tome results in sudden collapse, and even death, in extreme cases."
 relic_profane_arca_effect: "Gain §G+100§! £opinion£ opinion with every empire, decaying over §Y10§! Years"
 r_celestial_quantum_gem: "Quantum Echo Prism"
 r_celestial_quantum_gem_desc: "This gem seemingly acts as a catalyst for quantum entanglement, and when supplied with great power, this uncertainty breaches even nearby dimensions.\n\nThe powers of the gem's fluctuations may be able to be redirected for our benefit."
 relic_quantum_gem_effect: "§HUnlocks Decision:§! §GDeploy Quantum Crystal§! on stars\nUsing the decision on two stars in different systems will create a §YWormhole§! lasting for §Y10§! Years"
 r_celestial_spectral_beacon: "Spectral Beacon"
 r_celestial_spectral_beacon_desc: "The true origin and purpose of this device is still unknown. Retrieved from a dimension filled with strange energies and blinding light, all we know is that the beacon is some sort of waypoint, or perhaps conduit, for interdimensional entities."
 relic_spectral_beacon_effect: "§HUnlocks Decision:§! §G$decision_celestial_beacon_installation$§!, spawning several unique §YExtradimensional§! £pop£ Pops\nExtradimensional Pops may spread the §YPortal Sickness§! trait to Pops"
 r_celestial_star_core: "Cinders of a Star"
 r_celestial_star_core_desc: "Remains of the last star of a dying dimension. The embers have been contained within a containment sphere.\n\nWhether this star is unique or this is true for all stars from the origin dimension, this core holds immense electrical energy, able to strangely transform tools and weapons made of energy."
 celestial_star_core_uses: "There are §Y[Root.celestial_core_module_uses]§! embers left."
 relic_star_core_effect: "§HUnlocks Starbase Building:§! §GStar Crux Vault§!, which transforms a Starbase into a §Y[Root.GetCelestialCoreStationType]§! and provides strong boons for a short time\n\n$celestial_star_core_uses$"
 r_celestial_tainted_gem: "Tainted Crystal"
 r_celestial_tainted_gem_desc: "A small fragment of a gargantuan crystalline entity, or more accurately, one of its limbs.\n\nMuch like the original entity, a strange, dark substance is covering a portion of the crystal. Whether this matter is the source of the shard's power or siphoning it, we believe it to be some form of exotic matter, perhaps even dark matter."
 relic_tainted_gem_effect: "§HRandom leader:§!\n  - Gains §Y2§! levels\n  - Gains the §YShardbearer§! trait\nThe §YShardbearer§! trait has varying, powerful effects depending on leader class"
 
 celestial_setup.20.name: "The Dimensional Wayfarer"
 celestial_setup.20.desc: "[Root.GetRulerName]! I've come to you with a great opportunity!\n\nAfter spending a few months... ahem, §Ydealing§! with some of my previous customers, I am proud to inform you that §HThe Cosmic Emporium§! is open for business!\n\n'But what does this emporium sell?', I hear you ask. Well, all kinds of technologies, workers, ship parts; you get the idea. Some goods you can't get anywhere else!\n\nPlus, if you're interested, we can initiate joint expeditions to find some relics I've heard quite a lot about. Dangerous? Perhaps. But very valuable!"
 celestial_setup.20.a: "Let us have a look at your wares."
 celestial_cosmic_emporium_opening: "Opens the §HWayfarer's Cosmic Emporium§!, where goods can be bought and missions started\n$celestial_cosmic_emporium_available$"
 celestial_setup.20.b: "Good to know."
 celestial_cosmic_emporium_available: "§HThe Cosmic Emporium§! can be accessed through the §YContacts Menu§!"
 CELESTIAL_DIPLO_TITLE: "The Cosmic Emporium"
 celestial_diplo.1.a: "Visit the Cosmic Emporium."
 celestial_diplo.1.b: "Close communications."
 celestial_diplo_1: "Good to see you, [Root.GetRulerTitle]! What can I do for you today?"
 celestial_diplo_2: "We got all sorts of good stuff here: safe technology, some unsafe technology, some strange artifacts here, a few workers there...\n\nVolunteers, I mean. Volunteers."
 celestial_diplo_3: "Please be reassured that any misleading information or dysfunctional equipment you may have obtained from The Cosmic Emporium (Trademarked) is absolutely the fault of the customer.\n\nWe take no responsibility for any possible interdimensional incursions."
 celestial_diplo_4: "Ah, my friend, how's galactic governance going?"
 celestial_diplo_5: "I might be what some consider 'slimey' and a 'scumbag', but I never cross my co-workers!\n\nThe last time I tried, I lost my right eye."
 celestial_diplo_6: "Greetings! What can I interest you in? Relics, perhaps?"
 celestial_diplo_7: "Please, I promise I can find some substitute for the project...\nHuh? Oh, wrong dimension, my bad.\n\nAnyhow, what can I do for you?"
 celestial_diplo_8: "$celestial_diplo_2$"
 celestial_diplo_9: "Of course, what can I do for you today?"
 celestial_diplo_10: "No problem, what will it be?"
 celestial_diplo_11: "Oh, wonderful! Is it time for some near-death missions?"
 celestial_diplo_12: "Industrial oil? Rope? Explosives? You want it? It's yours my friend! As long as you have enough Energy Credits!"
 # celestial_diplo_13: "Sorry, [Root.GetRulerName]. I can't give credit. Come back when you're a little... mmmmm... richer!"
 celestial_emporium_relic_1_desc: "Ah, this codex apparently holds dangerous knowledge, so great it pains the reader. Probably worth it."
 celestial_emporium_relic_2_desc: "Not going to lie, all I know about this one is that it's some rare kind of crystal. Still interested, though!"
 celestial_emporium_relic_3_desc: "This piece of history is said to be a fragment of a dying world, we need to act quick to get this before it's too late."
 celestial_emporium_relic_4_desc: "I've heard quite a few tales about this one. We must be careful with it."
 celestial_emporium_relic_5_desc: "Apparently this one displays some sort of quantum properties. I'm sure you're looking forward on getting your science team's hands on it."
 celestial_emporium_relic_6_desc: "Heh, I've been chasing this one down for a while, there's a lot of individuals after it."
 COSMIC_EMPORIUM_RELIC_DESC_BACKUP: "Sounds good, let's be off soon."
 celestial_relic_button_completed_tt: "§YThese relics have been collected. Check the Wayfarer's other missions for more quests§!"
 SELECT_CELESTIAL: "Select mission"
 BACK_CELESTIAL: "Back"
 PRICES_INFO_CELESTIAL: "Ask about prices"
 cosmic_emporium_relic_response: "[Root.GetEmporiumRelicDesc]\n\nI've transmitted the information to your science department, check your Situation Log for the details."
 cosmic_emporium_prices_response: "How do I work out prices, you ask?\n\nWell, I set a base amount depending on the good for sale. If your bustling economy is powerful enough, then I may begin to increase prices depending on your income of Energy Credits.\n\nIt's just good business."
 celestial_relic_mission_spawning: "Wayfarer's Mission Survey"
 celestial_relic_mission_spawning_DESC: "We are working with the Dimensional Wayfarer to locate a suitable star system in our search for a certain relic from another dimension. Upon completion, we will be able to go on an archaeological expedition, thanks to the Wayfarer's arcane technology."
 celestial_chain.0.name: "$celestial_relic_mission_spawning$"
 celestial_chain.0.desc: "§HThe Dimensional Wayfarer§! has completed their study of the §Y[celestial_relic_quest_target.solar_system.GetName] system§! and has successfully located a location beyond the gravity well of the star to create a distortion in the form of a dimensional rift.\n\nAccording to the Wayfarer, entering this vortex to complete their expedition with the ship's crew may be dangerous, and as such, the expedition will require the expertise of the Dimensional Wayfarer."
 celestial_chain.0.a: "Understood."
 celestial_relic_quest_target_tt: "A §YMysterious Vortex§! is created in the §Y[celestial_relic_quest_target.solar_system.GetName] system§! with a unique archaeological site"
