 celestial_chain.226.name: "Situation Progress"
 celestial_chain.226.desc: "We, alongside the Astral Corps, have made some progress with regards to stopping the extradimensional incursion.\n\nBy following a lead related to the composition of the rifts opened, attempts have been made in supplying great amounts of energy to disintegrate said rifts. Though potentially unsafe, if successful, this technique may boost our work."
 celestial_chain.226.a: "We shall do so."
 celestial_chain.226.b: "Focus on another method."
 celestial_chain.227.desc: "We have progressed much since the last report, with various sub-teams finding many partially-successful techniques of preventing, or at least inhibiting, the formation of the portals.\n\nOthers have managed to research the scrap and debris of §YUnbidden§! ships provided to us by the §YAstral Corps§!, allowing our military department to work on anti-Unbidden weapons.\n\nHowever, further experimentation must be done to ensure the stability of these weapons, but there is little time to do so. What is to be the fate of this project?"
 celestial_chain.227.desc.g: "We have progressed much since the last report, with various drone-think tanks finding many partially-successful techniques of preventing, or at least inhibiting, the formation of the portals. Some of us have managed to research the scrap and debris of Unbidden ships provided to us by the Astral Corps, allowing our war-drones to work on anti-Unbidden weapons.\n\nHowever, further experimentation must be done to ensure the stability of these weapons, but there is little time to do so. What is to be the fate of this project?"
 celestial_chain.227.a: "Provide the required resources."
 celestial_chain.227.b: "Roll out these weapons immediately."
 celestial_chain.227.c: "Scrap the program, there are other things to work on."
 celestial_flavour.1.desc.g: "While working with §YResearch Drone [celestial_flavour_event_leader.GetName]§!, the §HDimensional Wayfarer§! claims to have accidentally activated a device intended for cooperative research. The consciousness felt as [celestial_flavour_event_leader.GetName] was hit by some form of high-power ionisation beam, severely affecting the molecular structure of [celestial_flavour_event_leader.GetName]'s body. As a result, they have been acting quite unusual, seemingly disconnecting from the gestalt network at random times."
 celestial_flavour.2.desc.g: "The §HDimensional Wayfarer§! has recently requested aid in the form of resources and a multitude of research drones for their attempt at deciphering some sort of strange artifact. They claim it functions as a codex of some sort, potentially revealing a brand new technology."
 celestial_flavour.3.desc.g: "Our drones, with the Wayfarer, were successful in their research. After decoding strange runes on the codex, a method of safely prying open the device was devised and completed.\n\nA rather antique-looking scroll was inside, and while most of the information was already integrated into the collective consciousness, some insights into rare technologies could be gleaned."
 celestial_flavour.4.desc.g: "Despite being dissuaded by our refusal to provide resources, the Wayfarer has managed to devise a way of decoding the ancient codex of theirs. Unfortunately, their method of doing so resulted in a minor explosion.\n\nDespite the destruction of the codex, as well as minor damage to the surrounding area on §Y[capital_scope.GetName]§!, the Wayfarer has managed to gleam some experience and knowledge."
 celestial_flavour.5.name: "Arcane Powers"
 celestial_flavour.5.desc: "The Dimensional Wayfarer has approached our offices personally, which is quite a rare occurrance. They have claimed that they hold a relic of inscrutable power, apparently from a dimension known as The Shroud.\n\nAccording to them, searching to learn the hidden knowledge within is very, very risky. No doubt it will cause some sort of unforeseen consequences; but, as they are under our command, we hold the ability to decide to continue the research into this artifact."
 celestial_flavour.5.desc.g: "The Dimensional Wayfarer has approached their personal drone-representative, which is quite a rare occurrance. They have claimed that they hold a relic of inscrutable power, apparently from a dimension known as The Shroud.\n\nAccording to them, searching to learn the hidden knowledge within is very, very risky. No doubt it will cause some sort of unforeseen consequences; but, as they are under our command, we hold the ability to decide to continue the research into this artifact."
 celestial_flavour.5.a: "Give the go-ahead."
 celestial_flavour.5.b: "This is too risky."
 celestial_flavour.6.name: "Astral Invasion"
 celestial_flavour.6.desc: "The Wayfarer has sent an urgent report! Their progress with the relic of the Shroud has slowed dramatically, but during their project, they were made aware of a sudden space-time anomaly near to [capital_scope.GetName], thanks to their compass.\n\nPersonnel stationed in low orbit have since reported a tear in space, growing larger. From it, beasts made of a luminescent material clawed through into space, releasing an ear-piercing screech. They are now racing down onto [capital_scope.GetName]!"
 celestial_flavour.6.desc.g: "The Wayfarer has sent an urgent report! Their progress with the relic of the Shroud has slowed dramatically, but during their project, they were made aware of a sudden space-time anomaly near to [capital_scope.GetName], thanks to their compass.\n\nSentinel drones in orbit noticed a tear in space, growing larger. From it, beasts made of a luminescent material clawed through into space, releasing an ear-piercing screech. They are now racing down onto [capital_scope.GetName]!"
 celestial_flavour.6.a: "Battlestations!"
 celestial_flavour.7.name: "Defeating the Astral Beasts"
 celestial_flavour.7.desc: "The Celestial Beasts which previously travelled onto the surface of [capital_scope.GetName] have been defeated, the denizens of the world remaining safe. Our science department requested a few samples and carcasses of the creatures for study, perhaps we are able to learn some information from their bodies.\n\nNevertheless, the Dimensional Wayfarer has profusely apologised for the danger they introduced, claiming that they have already locked away the device safely, to ensure the security of our people."
 celestial_flavour.7.desc.g: "The Celestial Beasts which previously travelled onto the surface of [capital_scope.GetName] have been defeated, keeping our hold on the world safe. We have kept a few samples and carcasses of the creatures for study to learn some data from their bodies.\n\nNevertheless, the Dimensional Wayfarer has profusely apologised for the danger they introduced, claiming that they have already locked away the device safely, to ensure the security of our people."
 celestial_flavour.7.a: "Lesson learned, at least."
 celestial_flavour.8.desc: "The Celestial Beasts which previously overran our armies on [capital_scope.GetName]  have been defeated after our liberation armies landed. Our science department requested a few samples and carcasses of the creatures for study, perhaps we are able to learn some information from their bodies.\n\nNevertheless, the Dimensional Wayfarer has profusely apologised for the danger they introduced, claiming that they have already locked away the device safely, to ensure the security of our people."
 celestial_flavour.8.desc.g: "The Celestial Beasts which previously overran our warrior drones on [capital_scope.GetName]  have been defeated after our liberation armies landed. We have kept a few samples and carcasses of the creatures for study to learn some data from their bodies.\n\nNevertheless, the Dimensional Wayfarer has profusely apologised for the danger they introduced, claiming that they have already locked away the device safely, to ensure the security of our people."
 celestial_flavour.8.a: "Well, lesson learned."
