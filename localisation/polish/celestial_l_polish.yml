 # Event Chain 1
 celestial_interdimensional_pursuit_title: "Interdimensional Pursuit"
 celestial_interdimensional_pursuit_desc: "The Base of Convergence, known to be home to all manner of things extradimensional and alien, is acting strange. No doubt The Astral Corps are behind some of this. What could they want?"
 celestial_chain.101.name: "The Lock"
 celestial_chain.101.desc: "We have received reports about strange occurrences near the §YBase of Convergence§!. After a sudden burst in energy from the central vortex, scanners have shown that the energy both emitted and absorbed by the rift has drastically dropped. In fact, a luminescent barrier of some sort seems to have formed over the vortex.\n\nWe suspect the §HThe Astral Corps§! to be behind this, though what they hope to gain from this is entirely unknown."
 celestial_chain.101.a: "Disconcerting."
 celestial_chain.102.name: "A Visit from the Corps"
 celestial_chain.102.desc: "While investigating the changes to the vortex at the §YBase of Convergence§!, a transmission was sent to us from The Astral Corps. However, it was not from the orbital station, but rather from the vortex itself. This could potentially be dangerous."
 celestial_chain.102.a: "On screen."
 celestial_chain.103.desc: "§BTransmission secured. Receiving dedicated transmission:§!\n\n§Y[Root.GetSpeciesName]. We would not contact you if this was not a vital matter. We have reason to believe that a high-profile fugitive is present in your dimension.\n\nThey go by many names: The Celestial Vagabond, the Great Zah'gul...\n\n§HThe Dimensional Wayfarer§!.\n\nWould you happen to know anything about this? We are willing to offer §Hlarge§! rewards for information.§!"
 celestial_chain.103.a: "What have they done to warrant this chase?"
 celestial_chain.103.a.reply: "§YThat is classified. In fact, it may very well be dangerous for you to know.\n\nAll you need to know is that their ability to traverse worlds... it is a monumental threat to the stability of the universe.\n\nWe ask you since you were the ones who discovered that strange compass. In fact, we are almost certain the Wayfarer was behind that hijacking of this outpost's Keeper Unit, come to think of it.§!"
 celestial_chain.103.b: "We can tell you where they are."
 celestial_chain.103.c: "We know not of this Wayfarer."
 celestial_chain.104.desc: "§YAh, how fortunate. Transmit the necessary data to the outpost over the Base of Convergence, and we will take it from there.\n\nYou made the right choice.§!\n\nThank you for your cooperation. Be assured, the Astral Corps will provide ample reward."
 celestial_chain.104.a: "Understood."
 celestial_chain.105.desc: "§Y...how disappointing.\n\nBe assured, any attempts of deception and manipulation will not go unpunished. You know not of the importance of this mission.§!\n\n§BConnection terminated.§!\n\nThank you for your time. Remember, the Astral Corps fights for §Hyou§!!"
 celestial_chain.105.a: "How strange..."
 celestial_astral_endowment: "Interdimensional Endowment"
 celestial_astral_endowment_desc: "Selling information to the Astral Corps is certainly beneficial to the economy."
 celestial_chain.106.name: "Wayfarer's Disappearance"
 celestial_chain.106.desc: "Recently, our transmissions with §YDimensional Wayfarer§! have been met with no response, and all scheduled meetings with them have been unsuccessful. After an attempt to confront the scientist in their quarters, our researchers were met with no presence of the Wayfarer, their room in quite the disarray.\n\nEither they were quick to flee, or they were taken. Either way, this does not bode well for their safety."
 celestial_chain.106.a: "Attempt to find them."
 celestial_chain.107.name: "Unknown Transmission"
 celestial_chain.107.desc: "Despite our best efforts at discovering clues and hints to the whereabouts of the Dimensional Wayfarer, our research team has found next to nothing. In fact, it seems that despite the mess of their quarters, the Wayfarer did a good job leaving almost no trace behind.\n\nHowever, we were lucky enough to come across their radio-communication device. Not their usual one, that is. One of a very antiquated design. The peculiar nature of it prompted one of our researchers to activate it.\n\nIt seems to be broadcasting a private transmission!"
 celestial_chain.107.a: "On screen."
 celestial_chain.108.name: "Unknown Transmission"
 celestial_chain.108.desc: "... Hello? Can you... me...\n\nPlease..."
 celestial_chain.108.a: "This is [Root.GetRulerTitle] [Root.GetRulerName]. Who are you?"
 celestial_chain.109.name: "The Wayfarer"
 celestial_chain.109.desc: "Oh, it is so good to see you, [Root.GetRulerName]! I was beginning to worry you'd never find me.\n\nI'm sure you're aware of The Astral Corps and their, well, disdain for me. I can assure you, this manhunt is completely unjustified and... well, let's not get into it right now.\n\nI have a plan. And I need your help."
 celestial_chain.109.a: "Why are they after you?"
 celestial_chain.109.a.reply: "Well, long story. The guy in charge? He's an absolute narcissist. Thinks that only he should be allowed the power to traverse dimensions and takes it upon himself to stop anyone who opposes him.\n\nLook, have I caused a bit of trouble at times? Sure. Did I hack the outpost at the Base of Convergence? Absolutely...\n\nWhere was I going with this? Anyway, he's brutal, probably insane."
 celestial_chain.109.b: "What does this plan entail?"
 celestial_chain.109.b.reply: "Look, the only reason they're here is because they know I'm in this dimension. They're able to detect the formation of rifts in time-space, so they know exactly where I go and when.\n\nBut, I know how to disrupt their detectors. At the very least disable them for a time. I will lure them away to another world, and that's when you do the dirty. They can't detect me, I get back here: boom, we're good.\n\nYou in?"
 celestial_chain.109.c: "We will help you."
 celestial_chain.109.c.reply: "Great! I knew you would. We gotta be quick, I'll transmit the details to your researchers."
 celestial_chain.109.d: "Sorry, you're on your own."
 celestial_chain.109.d.reply: "...what? You're joking right?\n\nThat's pretty funny, I'll tell you that. Got me, haha...\n\nYou're serious, aren't you? Was it the Corps? Did they pay you off, huh? Must've been quite a lot. Damn scumbag, rot in hell."
 celestial_dimensional_disruption: "Disrupting the Corps"
 celestial_dimensional_disruption_DESC: "The Astral Corps are after the Dimensional Wayfarer; using the blueprints sent by the Wayfarer, disabling their equipment will allow the Wayfarer to escape from the Corps safely."
 celestial_chain.110.desc.1: "§BTransmission secured.§!\n\nSalutations, [Root.GetSpeciesName]. Thanks to your information, we were successful in tracking down Zah'gul, the Vagabond.\n\nRest assured, they will be dealt with properly and fairly in accordance to their crimes.\n\nWe will not be in contact again."
 celestial_chain.110.a: "Was this the right thing to do?"
 celestial_chain.110.desc.2: "§BTransmission secured.§!\n\nSalutations, [Root.GetSpeciesName]. Despite your refusal to aid us, we were successful in tracking down Zah'gul, the Vagabond.\n\nRest assured, they will be dealt with properly and fairly in accordance to their crimes. We are providing the benefit of the doubt and permitting your continued liberty.\n\nWe will not be in contact again."
 celestial_wayfarer_killed: "§HThe Dimensional Wayfarer§! has been captured"
 celestial_chain.110.b: "Uh oh..."
 celestial_chain.111.desc: "Well, if it isn't the [Root.GetName].\n\nYou'll be glad to know, or perhaps not, that I managed to escape the Astral Corps, yet again, no thanks to you.\n\nAnyway, I am willing to place our past behind us, since I have almost no other place to go to, safely, at least. So as much as this pains me to say, I am back to work.\n\nExpect my retirement sooner, though."
 celestial_chain.111.a: "How did you escape?"
 celestial_chain.111.a.reply: "Oh, you're interested §Hnow§!?\n\nWell, I was captured by a Astral Corps team for a short time. And yeah, I wasn't killed, but they sure enjoyed torturing information out of me. They were too dumb to take off my equipment beforehand."
 celestial_chain.111.b: "Good to have you back."
 celestial_chain.112.name: "Project Complete"
 celestial_chain.112.desc: "Our team in orbit of the Base of Convergence finished constructing a makeshift device based on the Wayfarer's rather crude notes. Upon activation, a large blast was released which echoed throughout the entire star system with a low droning sound.\n\nIt appears as though the vortex itself reacted to the detonation, with a sudden burst of energy from the center of the rift.\n\nWhether the device worked or not, is still unknown to us."
 celestial_chain.112.a: "Let us hope for the best."
 celestial_chain.113.desc.1: "§BTransmission secured.§!\n\nSalutations once again, [Root.GetSpeciesName].\n\nWe wish to inform you of the departure of the Astral Corps from this dimension, though the outpost center over the vortex will remain intact.\n\nConsidering your previous deception with regards to the Wayfarer's location, we will be ceasing all current aid and/or rewards.\n\nGoodbye."
 celestial_chain.113.a: "Well, at least it worked."
 celestial_chain.113.desc.2: "§BTransmission secured.§!\n\nSalutations once again, [Root.GetSpeciesName].\n\nWe wish to inform you of the departure of the Astral Corps from this dimension, though the outpost center over the vortex will remain intact. As per usual, we will offer a small amount of resources as compensation for your trouble.\n\nGoodbye."
 celestial_chain.113.b: "Understood."
 celestial_chain.114.name: "The Return"
 celestial_chain.114.desc: "Some time has passed since the Astral Corps has ceased their search for the Dimensional Wayfarer here, and the scientist have finally returned to our service.\n\nThey reported that the project was a success, and they are no longer being pursued, nor does the Corps know of their current location.\n\nThe whole ordeal has left the Wayfarer quite stressed and worried, but for a time, at least, the Wayfarer is safe to continue their work with us."
 celestial_chain.114.a: "Wonderful."
 celestial_diplo_awol: "§LThere is no response.§!"
 celestial_wayfarer_returns: "§YThe Dimensional Wayfarer§! returns to us"
 celestial_wayfarer_gone_awol: "§YThe Dimensional Wayfarer§! has disappeared"

 # Event Chain 2
 celestial_chain.202.name: "Strange Distortions"
 celestial_chain.202.desc: "What initially began as minor power surges within subspace across the [Root.GetName] have begun to coalesce to form larger ripples and tears within space, distorting the very fabric of the universe. Our scientists are entirely baffled by this occurrence, and what's worse, these distortions are beginning to appear at an expontentially faster rate.\n\nThere has been no adverse effects detected as of yet, but this may be the start of something perilous."
 celestial_chain.202.a: "Keep an eye on the situation."
 celestial_chain.203.name: "The Wayfarer's Concerns"
 celestial_chain.203.desc: "After weeks of studying and attempting to understand the bizarre surges and tears in subspace, very little has been learnt. However, recent studies and observations have been met with personal visits by the §YDimensional Wayfarer§!, who claims that these rifts pose the risk of developing into some more powerful.\n\nIn fact, they suggest that there may be some force or entity behind these anomalies, which explains the fashion in which they are all confined to within our borders.\n\nAlongside a research team, a special project has been prepared in §Y[Root.capital_scope.solar_system.GetName]§! to truly understand what is happening."
 celestial_chain.203.a: "How perplexing..."
 celestial_chain.204.name: "The Source"
 celestial_chain.204.desc: "The co-ordinated study of the sub-spacial distortions has been completed. The results are potentially frightening.\n\nThe rifts and surges are emitting some sort of energy as they rip and tear over time, and a particularly massive concentration of this energy has been detected in a previously §Yuncharted star system§!, which has remained undetected due to the great amounts of ethereal energy blocking our sensors.\n\nIf we wish to uncover the reason behind this strange star system, the §YDimensional Wayfarer§! has volunteered to spearhead an expedition into the §HZullius§! system."
 celestial_unbidden_rift: "Mysterious Rift"
 celestial_chain.204.a: "Get the crew ready."
 celestial_unbidden_rift_tt: "The §YZullius§! system is discovered"
 celestial_chain.206.name: "Unknown Transmission"
 celestial_chain.206.desc: "...we can sense it... finally...\n\nzah'gul... you were a fool to escape here... we will have... justice... we will have... the throne..."
 celestial_chain.206.a: "Who is this?"
 celestial_chain.206.a.reply: "...hunters... we seek nourishment... we seek... justice...\n\n...this dimension is so... full... but first... zah'gul..."
 celestial_chain.206.b: "Why are you here?"
 celestial_chain.206.b.reply: "...we bring vengeance... zah'gul... your wayfarer... food..."
 celestial_chain.206.c: "Are you The Unbidden?"
 celestial_chain.206.c.reply: "ah... that is what you call us..."
 celestial_chain.206.d: "How are you back?"
 celestial_chain.206.d.reply: "...we learn... we adapt... we overcome... this dimension will be ours again..."
 celestial_chain.206.e: "What do you want with us?"
 celestial_chain.207.desc: "...you hold zah'gul... we want... zah'gul..."
 celestial_chain.207.a: "Will you leave if we give you the Wayfarer?"
 celestial_chain.207.a.reply: "...the invasion... in zullius... it may be halted...\n\n...know this... we seek sustenance... safety... is not guaranteed..."
 celestial_chain.207.b: "We will never aid your kind!"
 celestial_chain.207.b.reply: "...such hatred... such fear... you will fall..."
 celestial_chain.208.name: "A Growing Danger"
 celestial_chain.208.desc: "It is clear that the strange distortions and flashes in the §YZullius§! system are becoming more powerful and blinding, no doubt as a result of the increasing extradimensional powers emanating from the rift.\n\nSome of our researchers believe that this is a major potential threat. So much so that the entire star system may become isolated from the Hyperlane network while these extremely powerful emissions and tears grow.\n\nPerhaps we should ensure the §YDimensional Wayfarer§! returns back to safety before anything severe happens."
 celestial_chain.208.a: "Call the Wayfarer back immediately."
 celestial_chain.208.b: "We shall finish the project."
 celestial_chain.209.name: "The Invaders"
 celestial_chain.209.desc: "Unfortunately, our worst fears came true, and even more.\n\nThe impossibly powerful subspatial energies and distortions covering §YZullius§! have entirely encompassed the star system, effectively blocking off the system from the hyperlane network by rendering our hyperdrives ineffective.\n\nWhat's worse, the rift previously studied by the Wayfarer has suddenly expanded after a minor explosion of energy, growing massively in size. From the other side of the portal, a band of ships appeared, seemingly translucent and shining with a light purple light.\n\nThey seem to be moving to attack nearby fleets!"
 celestial_chain.209.a: "This is not good..."
 celestial_chain.209.tt: "§YZullius§! loses all its hyperlanes\nAn extradimensional fleet appears in §YZullius§!!"
 celestial_chain.210.name: "The Astral Corps"
 celestial_chain.210.desc: "Sensors in the §YZullius§! system revealed a secondary portal forming rapidly near to the star. Initial expectations were reinforcements of the alien incursion, but it appears to be a fleet belonging to the §HAstral Corps§!! Their ships, quite similar in build to the extradimensional fleets, began to pursue the invaders and engage them in battle!\n\nPerhaps this alien incursion will not be as lethal as suspected?"
 celestial_chain.210.a: "What a relief."
 celestial_chain.211.desc: "§BTransmission secured.§!\n\nGreetings, [Root.GetSpeciesName]. You have no doubt noticed the hostile activity within the §YZullius§! system. This is not the first time these cruel invaders have attempted to breach another dimension.\n\nThey are known as §HThe Unbidden§!. They lust for nourishment: sapient lifeforms of all kinds. They must not breach this dimension any more than they already have.\n\n[Root.GetSpeciesName], we must form an alliance if we wish to prevent this incursion. We have already informed the §YWayfarer§!, they will be coming with us for a time. Do not worry, they will return to you safely."
 celestial_chain.211.desc_current: "§BTransmission secured.§!\n\nGreetings, [Root.GetSpeciesName]. You have no doubt noticed the hostile activity within the §YZullius§! system. These are the same invaders currently ravaging the galaxy, §HThe Unbidden§!\n\nThey must not form another portal, it will render them almost impossible to truly defeat.\n\n[Root.GetSpeciesName], we must form an alliance if we wish to prevent this incursion. We have already informed the Wayfarer, they will be coming with us for a time. Do not worry, they will return to you safely."
 celestial_chain.211.desc_prev: "§BTransmission secured.§!\n\nGreetings, [Root.GetSpeciesName]. You have no doubt noticed the hostile activity within the §YZullius§! system. These are the same invaders who previously were ravaging the galaxy, §HThe Unbidden§!\n\nThey must not form another portal, as they have no doubt learnt from their previous attempt at conquest.\n\n[Root.GetSpeciesName], we must form an alliance if we wish to prevent this second incursion. We have already informed the Wayfarer, they will be coming with us for a time. Do not worry, they will return to you safely."
 celestial_chain.211.a: "Let us work together."
 celestial_chain.211.a.reply: "Good. We will forward the details about what to do to aid our efforts."
 celestial_chain.211.tt: "Hyperlanes to §YZullius§! are restored\nThe Unbidden fleet has been defeated\nThe §HDimensional Wayfarer§! will temporarily work under the §YAstral Corps§!"
 celestial_chain.213.name: "Studying the Rifts"
 celestial_chain.213.desc: "The Astral Corps has given us a mission: to learn more about the rifts still forming as a result of the energies released by the extradimensional portal in §YZullius§!.\n\nThese distortions are not as common as previously, however, so we should act soon to ensure we are able to study them to gain a good understanding of how they form.\n\nThe §YSituation Log§! has been updated with the project."
 celestial_chain.213.a: "Understood."
 celestial_chain.214.name: "Blocking the Invaders"
 celestial_chain.214.desc: "Thanks to the knowledge of the §HDimensional Wayfarer§!, we have been provided with some schematics and notes for various devices with the apparent ability to inhibit the formation of the alien portals, and even destroy them entirely, perhaps.\n\nNevertheless, we must act quick if we are to make use of this knowledge. The §YSituation Log§! has been updated with the project for a construction vessel."
 celestial_chain.215.name: "Minor Incursions"
 celestial_chain.215.desc: "Recently, very minor reconnaissance fleets have began to appear throughout our empire, seemingly sent by §HThe Unbidden§!. Most of these has been so weak that our patrol and security fleets have automatically dealt with them, sometimes even destroying them completely.\n\nHowever, the volume of ships appearing has been growing; if we are to stop this before too late, we need to strike before the fleets even come through.\n\nIt is possible, according to reports, that these portals are partially vulnerable while they are forming. The §YSituation Log§! has been updated with the project for a military fleet."
 celestial_chain.216.desc: "The project set for us by the §YAstral Corps§! has been completed. Though no breakthrough was discovered, we learnt quite a lot in terms of the composition of these portals and their properties.\n\nForwarding these details to the Corps would likely progress our mission to stop the incursion, though not by much. We could instead develop this knowledge into a more useful technology of some kind."
 celestial_chain.216.a: "The mission must be placed first."
 celestial_chain.216.b: "Work on that technology."
 celestial_chain.217.desc: "Using the Wayfarer's plans and notes, our construction and device manufacturing teams were partially successful in developing technologies to inhibit the formation of various portals and distortions caused by §HThe Unbidden§!. Minor fluctuations and rifts were successfully stopped, but unfortunately, these are indeed extremely miniscule in the grand scheme of things.\n\nThe Wayfarer is still thankful for our efforts, and suggests we still may be able to develop something useful out of this. Or, we can scrap the entire project."
 celestial_chain.217.a: "Pass on the data to the Wayfarer."
 celestial_chain.217.b: "Scrap it all."
 celestial_chain.218.desc: "Good news from the §YAstral Corps§!: their joint missions with our fleets have been quite the success. The amount of fleets appearing throughout the galaxy as a result of the incursion in §YZullius§! have dwindled drastically.\n\nNot only have these fleets been destroyed, but many of the unstable rifts have dissipated due to our explosive and plasma weaponry.\n\nWe may continue this research further and focus on further combatting the Unbidden ships, or we can utilise our current findings for ourselves, to develop our fleets for a time."
 celestial_chain.218.a: "Continue the work."
 celestial_chain.218.b: "Use our findings immediately."
 celestial_chain.220.name: "The Last Task"
 celestial_chain.220.desc: "We have made massive success with our allies, the §YAstral Corps§! and the §YDimensional Wayfarer§!. Not only have we severely reduced the amount of §HUnbidden§! ships tearing through into our dimension, but we have collectively made many new discoveries and developed many technologies made to stop the alien invaders.\n\nWith one thing left to do, the §YDimensional Wayfarer§! has returned with their vessel under our command. Now, the Astral Corps has devised one, final special project in orbit of the §YUnbidden portal in Zullius§! to seal the interdimensional gateway for good. The §YDimensional Wayfarer§! must be the one to complete the project, as their ship holds great spatial powers and abilities which will aid the mission.\n\nThis could be the beginning of the end."
 celestial_chain.220.desc_current: "We have made massive success with our allies, the §YAstral Corps§! and the §YDimensional Wayfarer§!. Not only have we severely reduced the amount of §HUnbidden§! ships tearing through into our dimension, but we have collectively made many new discoveries and developed many technologies made to stop the alien invaders.\n\nWith one thing left to do, the §YDimensional Wayfarer§! has returned with their vessel under our command. Now, the Astral Corps has devised one, final special project in orbit of the §YUnbidden portal in Zullius§! to seal the interdimensional gateway for good. The §YDimensional Wayfarer§! must be the one to complete the project, as their ship holds great spatial powers and abilities which will aid the mission.\n\nAlthough the other Unbidden portal remains still, this will mark a great start to their end."
 celestial_chain.220.desc_prev: "We have made massive success with our allies, the §YAstral Corps§! and the §YDimensional Wayfarer§!. Not only have we severely reduced the amount of §HUnbidden§! ships tearing through into our dimension, but we have collectively made many new discoveries and developed many technologies made to stop the alien invaders.\n\nWith one thing left to do, the §YDimensional Wayfarer§! has returned with their vessel under our command. Now, the Astral Corps has devised one, final special project in orbit of the §YUnbidden portal in Zullius§! to seal the interdimensional gateway for good. The §YDimensional Wayfarer§! must be the one to complete the project, as their ship holds great spatial powers and abilities which will aid the mission.\n\nThe Unbidden have fallen once already. They will do so again."
 celestial_chain.220.a: "We're almost there!"
 celestial_leader_back: "The §HDimensional Wayfarer§! returns to our command"
 celestial_chain.222.name: "Closing the Portal"
 celestial_chain.222.desc: "Success! The portal used by the Unbidden to cross into our dimension has been destroyed!\n\nThanks to the §YWayfarer§!'s technological prowess, alongside the garrisons of the §HAstral Corps§!, and of course, our military and economic aid, the dimensional conduit holding together the portal imploded. The Astral Corps has deployed a permanent sentinel-fleet within the Unbidden's dimension, hoping to keep the beasts at bay, hopefully §Ypermanently§!.\n\nAfter this long fight, the §YDimensional Wayfarer§! has finally begun the journey back home, earning their well-worth rest.\n\nThe Astral Corps have left without a message. No doubt they do not wish to continue close relations with anyone. Though, the Wayfarer is sending a transmission to us."
 celestial_chain.222.desc_current: "Success! The portal used by the Unbidden to cross into our dimension has been destroyed!\n\nThanks to the §YWayfarer§!'s technological prowess, alongside the garrisons of the §HAstral Corps§!, and of course, our military and economic aid, the dimensional conduit holding together the portal imploded. Of course, the fight against these §RExtradimensional Invaders§! is far from over, but this marks a great leap towards our safety.\n\nAfter this long fight, the §YDimensional Wayfarer§! has finally begun the journey back home, earning their well-worth rest.\n\nThe Astral Corps have left without a message. No doubt they do not wish to continue close relations with anyone. Though, the Wayfarer is sending a transmission to us."
 celestial_chain.222.desc_prev: "Success! The portal used by the Unbidden to cross into our dimension has been destroyed!\n\nThanks to the §YWayfarer§!'s technological prowess, alongside the garrisons of the §HAstral Corps§!, and of course, our military and economic aid, the dimensional conduit holding together the portal imploded. The Astral Corps has deployed a permanent sentinel-fleet within the Unbidden's dimension, hoping to keep the beasts at bay, hopefully §Ypermanently§!, especially after this second attempt at an invasion.\n\nAfter this long fight, the §YDimensional Wayfarer§! has finally begun the journey back home, earning their well-worth rest.\n\nThe Astral Corps have left without a message. No doubt they do not wish to continue close relations with anyone. Though, the Wayfarer is sending a transmission to us."
 celestial_chain.222.a: "On-screen."
 celestial_chain.223.name: "Victory"
 celestial_chain.223.desc: "Good to see you, [Root.GetRulerName]. It has been quite the journey, has it not? I'm just glad it's finally over.\n\nWell, for now at least."
 celestial_chain.223.a: "So what now?"
 celestial_chain.223.a.reply: "Well, I think my previous, erm, §Yproblems§! with the Astral Corps has been dealt with. Not going to lie, I was a tad worried they wouldn't let me return to your command, but they were surprisingly nice.\n\nMaybe they're not as bad as I thought. I mean, they did stop those beasts, after all. A good time was had by all, I'm sure!"
 celestial_chain.223.b: "Will you return to work with us?"
 celestial_chain.223.b.reply: "About that... The Astral Corps offered me a job, with them, to continue our joint operations. You know, keeping the worlds safe. I've been thinking about it.\n\nIt's definitely a far-cry from the previous perilous and thrilling missions! But, maybe it's a good idea. What do you think? Do you still wish for me to continue my work with you? There's certainly still work to be done."
 celestial_chain.223.c: "You should stay with us."
 celestial_chain.223.c.reply: "Heh, I was hoping you would say that. I'll let the Corps know; we'll still stay in contact for work occasionally, but I will remain under your command, [Root.GetRulerTitle]."
 celestial_chain.223.d: "The Astral Corps know more. Go with them."
 celestial_chain.223.d.reply: "I suppose so. You can keep my ship and my compass, I won't need those anymore.\n\nWe've had some good times as a team. I hope to see you sometime soon, friend."
 celestial_chain.224.desc: "Success! The portal used by the Unbidden to cross into our dimension has been destroyed!\n\nThanks to the §YWayfarer§!'s technological prowess, alongside the garrisons of the §HAstral Corps§!, and of course, our military and economic aid, the dimensional conduit holding together the portal imploded. The Astral Corps has deployed a permanent sentinel-fleet within the Unbidden's dimension, hoping to keep the beasts at bay, hopefully §Ypermanently§!.\n\nHowever, there is also bad news. During the battle within their own dimension, the §HUnbidden§! launched a surprise raid on our alliance fleets. Despite managing to defeat them after some time, the Wayfarer's ship was left severelt damaged and burnt. Their ship was unable to be rescued.\n\n§RThey did not made it back.§!"
 celestial_chain.224.desc_current: "Success! The portal used by the Unbidden to cross into our dimension has been destroyed!\n\nThanks to the §YWayfarer§!'s technological prowess, alongside the garrisons of the §HAstral Corps§!, and of course, our military and economic aid, the dimensional conduit holding together the portal imploded. Of course, the fight against these §RExtradimensional Invaders§! is far from over, but this marks a great leap towards our safety.\n\nHowever, there is also bad news. During the battle within their own dimension, the Unbidden launched a surprise raid on our alliance fleets. Despite managing to defeat them after some time, the Wayfarer's ship was left severelt damaged and burnt. Their ship was unable to be rescued.\n\n§RThey did not made it back§!."
 celestial_chain.224.desc_prev: "Success! The portal used by the Unbidden to cross into our dimension has been destroyed!\n\nThanks to the §YWayfarer§!'s technological prowess, alongside the garrisons of the §HAstral Corps§!, and of course, our military and economic aid, the dimensional conduit holding together the portal imploded. The Astral Corps has deployed a permanent sentinel-fleet within the Unbidden's dimension, hoping to keep the beasts at bay, hopefully §Ypermanently§!, especially after this second attempt at an invasion.\n\nHowever, there is also bad news. During the battle within their own dimension, the Unbidden launched a surprise raid on our alliance fleets. Despite managing to defeat them after some time, the Wayfarer's ship was left severelt damaged and burnt. Their ship was unable to be rescued.\n\n§RThey did not made it back.§!"
 celestial_chain.224.a: "They cannot be forgotten..."
 celestial_chain.225.name: "Sacrifice"
 celestial_chain.225.desc: "§BTransmission secured. Receiving dedicated transmission:§!\n\n§YGood to see you, [Root.GetRulerTitle]. My congratulations on our collective victory. You truly did highlight your prowess. As thanks for your cooperation, I will forward a gift of resources to your people.\n\nI assume you have heard the grave news, however. Indeed, Wayfarer Zah'gul did not survive the ordeal. Despite my past resentment towards them, they were a vital asset in this operation.§!"
 celestial_chain.225.a: "What will you do now?"
 celestial_chain.225.a.reply: "§YThe same as before, naturally. We will remain isolated from this galaxy, and from the [Root.GetName]. It is for the betterment of this dimension, and others. But we will remember your valiance.\n\nAs for the Wayfarer's previous assets, namely their ship and Celestial Compass, we will pass control to you.§!"
 celestial_chain.225.b: "Well, goodbye for now."
 celestial_chain.225.b.reply: "§YIndeed. Hopefully we will not have to be in contact again.\n\nGodspeed, [Root.GetSpeciesName].§!\n\n§BConnection terminated.§!\n\nGoodbye."
 celestial_chain.228.name: "Relics of the Wayfarer"
 celestial_chain.228.desc: "While inspecting the previous quarters of the §YDimensional Wayfarer§!, we came across a hidden passge to another, small room. After recovering from the initial surprise, an investigation found a stash of resources and relics! There was also a note written, likely by the Wayfarer:\n\n§HTo the [Root.GetSpeciesName] of the [Root.GetName]: I leave to you all my (safe) goods and items. Hopefully you find these of use. Godspeed.§!"
 celestial_chain.228.a: "Godspeed indeed."
 celestial_eventchain2_over_relics_gained: "2 unique relics from the §HDimensional Wayfarer§! are obtained."
 
 # Archaeological Sites
 celestial_mission_site_intro: "§LThe dimensional rift leads to another world, one we know frighteningly little about. To truly understand it, we must enter. But only the §HDimensional Wayfarer§! is able to access this vortex.§!\n\n"

 site_r_celestial_aetherial_codex: "Glyphs of a Forbidden Scroll"
 site_r_celestial_aetherial_codex_desc: "$celestial_mission_site_intro$Tales tell of a tome inscribed with celestial glyphs, apparently holding great and powerful knowledge. Some say this knowledge is enough to drive a person mad, but we seek it nonetheless."
 celestial_chain.302.name: "Alien Symbols"
 celestial_chain.302.desc: "Upon entering the vortex, our expedition team was met by a deep void, not too dissimilar to our own, but with elusive, glowing glyphs of an unknown language floating in the depths of space.\n\nThe void stretches on infinitely, or so it seems. Our only potential path forward is through the aetherial glyphs floating in amongst the dark."
 celestial_chain.302.a: "Study these odd glyphs."
 celestial_chain.303.name: "An Out of Body Experience"
 celestial_chain.303.desc: "Studying the glyphs as an attempt to translate their meanings has not resulted in a lot of success initially. However, after the Dimensional Wayfarer approached one of the glyphs alone, the floating symbol began to glow with a sharp light, leaving the Wayfarer frozen, apparently in the literal sense.\n\nThe Wayfarer remained alone in space for hours, until they were manually retrieved by a crewmember. Even upon bringing them back onto the ship, they remained in a trance, their only remaining eye shining with a deep blue."
 celestial_chain.303.a: "Ensure their immediate recovery."
 celestial_chain.304.name: "Library at the End of the World"
 celestial_chain.304.desc: "After so long, the Wayfarer has finally recovered from their mysterious trance. They initially struggled to recall their memories, but then they began to recite a string of words, apparently echoing in their head during their contact with the glyph.\n\nThey also recall visions of a lone building of a magnificent scale within this same void. Perhaps the other glyphs have more secrets to tell."
 celestial_chain.304.a: "Continue the study."
 celestial_chain.305.name: "A Celestial Poem"
 celestial_chain.305.desc: "In what may have been a rather bold plan, several members of the ship crew went out in a similar fashion to the Dimensional Wayfarer, placing them in a trance.\n\nWe have collected the reports of each person placed in trances, each linking together to reveal what is expected to be a poem of some kind. Now, the crew are working on deciphering the meaning behind this text, potentially linking them to the strange glyphs."
 celestial_chain.305.a: "Good, report any findings."
 celestial_chain.306.name: "The Aetherial Codex"
 celestial_chain.306.desc: "After a massive breakthrough, the expedition crew uncovered the truth behind the glyphs surrounding the ship in the endless void: they are coordinates, pointing to a cosmic building called the §YCelestial Library§! in the text we deciphered.\n\nFollowing the coordinates led to the very same building seen by the Wayfarer. Within the building's elegant doors, amongst the walls of intricate designs, there lay a scroll of sorts. The Dimensional Wayfarer immediately approached the relic, claiming it to be the famed §HAetherial Codex§!. It is now in our possession."
 celestial_chain.306.a: "Splendiferous."

 site_r_celestial_profane_arca: "Extrasensory Tome"
 site_r_celestial_profane_arca_desc: "$celestial_mission_site_intro$A most peculiar artifact is said to exist in another world, using some form of what could be called 'magic' to coerce and affect the minds of others."
 celestial_chain.402.name: "Endless Seas"
 celestial_chain.402.desc: "Upon coming through the other side of the vortex, our science crew was stunned by a beautiful landscape of endless deep and tranquil water, the darkening sky burning with a sharp azure.\n\nAs the blazing blue sun set, the ship approached what appeared to be a quaint village on a lone island in the sea. Scans reveal no other obvious land on the otherwise oceanic world."
 celestial_chain.402.a: "Interesting."
 celestial_chain.403.name: "A Psionic Encounter"
 celestial_chain.403.desc: "Landing on the island, our vessel was immediately approached by a horde of alien tribes-people, covered in various blue and purple markings. Their appearance is akin to a mix of arthropoid bodies with the limbs of reptilians, truly a rather peculiar species.\n\nAs they watched at the crew closely, the Dimensional Wayfarer, assuming them to be primitives, began to use their translator device to attempt to speak with the aliens, when they were surprised by a strange voice in their head. Clearly, the tribes-people were communicating through some psionic methods."
 celestial_chain.403.a: "Quite peculiar..."
 celestial_chain.404.name: "A Taboo"
 celestial_chain.404.desc: "After spending some time with the aliens, known as the Zy'gons, we have learned a lot about their ways of life. They are extremely intelligent, almost equivalent to a typical [Root.Owner.GetSpeciesName], but they have chosen to remain in their old, primitivistic way of life, citing it to be more gratifying.\n\nFinally, the Wayfarer asked them about the so-called Tome of Melody we are after. There was silence in the crowd, initially, and a growl (the first audible noise heard from the Zy'gon).\n\nOne alien, taller than the others, came forward with information, informing us about the relic being locked behind in a tomb long ago, out of fear for its power."
 celestial_chain.404.a: "This will not stop us."
 celestial_chain.405.name: "Cave of Echoes"
 celestial_chain.405.desc: "Our expedition team began to journey through a crevice in the ground, previously covered by a great stone boulder. We have been told it is not very far, but have been also warned about the dangers it can pose. It will not dissuade us.\n\nAlmost immediately, a faint drumming began to echo throughout the tunnel towards the relic, pulsing louder as the crew approached the forbidden relic. The maze-like interior will be difficult to navigate quickly, though the musical ringing may prove to be useful in the search."
 celestial_chain.405.a: "Continue the search."
 celestial_chain.406.name: "The Profane Tome"
 celestial_chain.406.desc: "The previous light drumming has now developed into a strange cacophony of various musical instruments, some never heard before by any member of the [Root.Owner.GetName]. The strange harshness was rising to deafening levels, but finally there stood a pillar, one with a large book on top.\n\nThe Wayfarer approached the pillar cautiously, both their heart and the drums beating with more and more vigour. Until, it stopped. All the sounds stopped. The Wayfarer peered over to see the dust and dirt covering the tome, its golden corners shining through despite its age.\n\nThe relic is now ours."
 celestial_chain.406.a: "Splendid."

 site_r_celestial_quantum_gem: "Shard of Convergence"
 site_r_celestial_quantum_gem_desc: "$celestial_mission_site_intro$Even the wise Wayfarer knows shockingly little about this mysterious shard. It is said to hold some sort of power similar to the Base of Convergence, acting as a conduit between worlds."
 celestial_chain.502.name: "White-Out"
 celestial_chain.502.desc: "A dimension of pure white. There is nothing beyond the rift apart from the endless blank void. Is this the wrong dimension, or has the relic been taken already?\n\nThe only thing to do is study the environment, perhaps scan for anything else in the dimension? This may prove futile, but there is no other clear path forward."
 celestial_chain.502.a: "Do what you can."
 celestial_chain.503.name: "A Lone Shard"
 celestial_chain.503.desc: "The endless blankness may be all that is present in this dimension. There seemed to be nothing, until the Wayfarer claimed to see, quite clearly, one lone crystal. It emitted a light green glow, but the crystal itself appeared black.\n\nAnd yet, when the team clamoured together to see this phenomenon, there was nothing. A result of their delirium, or something more?"
 celestial_chain.503.a: "There may be more to this world..."
 celestial_chain.504.name: "Quantum Fluctuations"
 celestial_chain.504.desc: "The shard is indeed real, and furthermore, there are more. The shards exhibit quantum properties on a macroscopic scale, seeming to persist in all states at once until it is observed, where it remains in a singular state.\n\nThere seems to be nothing particularly unique or special about these shards, apart from their quantum behaviour. The team is currently working on collecting any shards for study."
 celestial_chain.504.a: "Keep an eye on these shards."
 celestial_chain.505.name: "Quantum Entanglement"
 celestial_chain.505.desc: "Several shards have since been collected and studied separately; they truly exhibit no other behaviours and seemingly have no other use, despite being made of an unknown element. However, when two shards were brought close together, what seemed to be faint echoes could be heard from both shards.\n\nCoincidentally, the crew piloting the ship reported a sudden change in environment; the pure white was transforming into a deep blue, with shining specks of red, orange and blue. Likely stars."
 celestial_chain.505.a: "Surely more than a coincidence?"
 celestial_chain.506.name: "Quantum Echo Prism"
 celestial_chain.506.desc: "With quite little regard for safety, the Dimensional Wayfarer, with a small group of crewmembers, brought together the various crystalline shards. The echoes returned, getting louder as another shard approached, allowing for a clearer understanding, were it not for the cacophony of different echoes. And in fact, the previously-white environment continued to transform even more, away from the more typical view of space, at an alarmingly faster rate.\n\nThere seemed to be no clear reason or common factor between each state. Sometimes it was a random place in space, or a lush landscape, sometimes a dimension of blinding energies and whispers, sometimes it was impossible to tell.\n\nThen, when the last shard was added to the collection, a sudden flash of white surrounded the ship, and then it all stopped. It was once again pure white, and the shards joined together into one large prism."
 celestial_chain.506.a: "Good."

 site_r_celestial_spectral_beacon: "Spectral Beacon"
 site_r_celestial_spectral_beacon_desc: "$celestial_mission_site_intro$There exist a many multitude of various dimensions and worlds beyond our understanding. Most of these, we will never explore, or even see for ourselves. However, there apparently exists some sort of device, devised by a greatly advanced civilisation, providing the ability to tear through dimensions.\n\nOr so it is said."
 celestial_chain.602.name: "Shrouded"
 celestial_chain.602.desc: "A world of deep, purple swirling clouds meets us on the other side of the vortex. Crumbling pillars of stone loom over pools of toxic fluids emitting rancid gases. There is truly nothing apart from this desolate wasteland for as far as the visual receptor can see.\n\nThe Wayfarer warned the crew of spending too much time outside of the ship, for the very atmosphere is apparently harmful to all forms of matter. Still, we must continue to explore the environment to find this artifact we are looking for."
 celestial_chain.602.a: "Continue the survey."
 celestial_chain.603.name: "Endless Wastes"
 celestial_chain.603.desc: "The world seemed to reach on infinitely. Despite the clearly repetitive setting, it appeared that no two places were the same, despite spending weeks covering the world's surface. Any attempts of using electronic devices to aid in this exploration proved futile. Perhaps the dangerous atmosphere is to blame.\n\nNevertheless, it may be more valuable to attempt to escape the planet surface, exploring above the clouds."
 celestial_chain.603.a: "Do so, but remain cautious."
 celestial_chain.604.name: "Miasma"
 celestial_chain.604.desc: "The swirling clouds initially appeared to continue for eternity, much like the surface of the planet, but this was fortunately not true.\n\nAfter a long trek through violent storms and wailing gales, the ship successfully broke out of the planet atmosphere, finding a pleasant void littered with many stars and planets nearby. Strangely enough, there appeared to be a miniscule distance between stars and planets, in comparison our world.\n\nHowever, in orbit of this same planet, there was a minor tear in space itself, surrounding by a very similar miasma covering the planet."
 celestial_chain.604.a: "It may be the only way forward."
 celestial_chain.605.name: "The Rapture"
 celestial_chain.605.desc: "Upon approaching the rift, it appears there is actually many, many tiny tears in the region, surrounding a particularly thick and potent cluster of clouds and light, originating from one point on the planet. The journey back onto the planetary surface was much less dangerous this time, with the beam of light guiding the crew's way.\n\nBreaking back through the orbital fog, the crew was blinded by a beaming, blue light, with ordered pillars surrounding the apparent source. Bodies litter the environment, all petrified into some sort of stone. Their facial features are still recognisable, but match no species known to us. Our scientists have assumed that the expressions of all the aliens is fear and panic. And yet, this may be what we are looking for."
 celestial_chain.605.a: "Disconcerting."
 celestial_chain.606.name: "The Beacon"
 celestial_chain.606.desc: "Despite initial fear, the Wayfarer, alongside the ship's members, ventured out of the ship to approach the beacon. With them they brought a variety of devices and tools to lift off the strange device, seemingly the source of the light. The beacon was slowly pried off of the stone plinth holding it up, appearing smaller than initially expected.\n\nAs it was lifted away, the beaming glare suddenly stopped, and the previously pulsating energies ceased immediately. In fact, the clouds themselves appeared to clear away slowly, though there was not much to see.\n\nBefore anything unexpected could happen, the ship escaped back into our space, bringing with them the §HSpectral Beacon§!."
 celestial_chain.606.a: "Excellent."

 site_r_celestial_star_core: "Cinders of a Star"
 site_r_celestial_star_core_desc: "$celestial_mission_site_intro$We have heard of rumours of a dying dimension, apparently holding secrets and technology which may be lost to time. We must obtain this before too late."
 celestial_chain.702.name: "Ancient Battlegrounds"
 celestial_chain.702.desc: "On the other side of the vortex, the ship was greated by a truly gargantuan field of debris; tiny scraps of metal and rock, with the occasional derelict hull and ship floating in the darkness. Initial scans of the remains show little to no useful resources or items left over within the ships and star stations.\n\nThere is no light nor planetary surfaces anywhere, apart from one, sole star remaining in the darkness, possibly holding the vestiges of civilisation in this universe, or the region, at the very least."
 celestial_chain.702.a: "Approach the star."
 celestial_chain.703.name: "Technosphere"
 celestial_chain.703.desc: "As the [Root.GetName] approaches the lone star, they find that they are not alone. Almost hiding behind the star, which is burning exceptionally bright, there is a strange construction in the shape of a perfect sphere, made of shining metal and covered in grooves and indents.\n\nNo signals can be picked up from it, nor does anything we send make it respond. It appears to be simply sitting in space, perhaps waiting."
 celestial_chain.703.a: "Keep an eye on it."
 celestial_chain.704.name: "The Infinity Machine"
 celestial_chain.704.desc: "Our team contemplated out next course of action with regards to the machine, before it suddenly began to release a sort of signal, a rhythmic pulse pointed towards the blinding star. The research team managed to successfully use this transmission as an opening to exploit, perhaps hoping to find some sort of data or information within the sphere. However, shortly after, we received a signal from the orb.\n\n§HAh, hello, hello. Nice to meet you. What are you doing here? It's no place to be for ones such as you.§!\n\nOur team offered to route communications to the [Root.Owner.GetRulerTitle], but it refused, citing there to be little time left.\n\n§HYou seem confused. Best we can do is explain what will happen, soon...\n\nOh of course, through words! We always forget. You are all so similar.\n\nThis place is dying. Time's running out, you see. We're about to leave, in just a bit.§!"
 celestial_chain.704.a: "Leave? To where? Keep conversing with it."
 celestial_chain.704.b: "The Infinity Machine? How did it get here?"
 celestial_chain.705.name: "Remnants"
 celestial_chain.705.desc: "We asked the machine about its destination. The machine, now known to be the Infinity Machine, continues.\n\n§HAnywhere. We do not expect you Brief Ones to understand, but that's alright, it's happened before. Or has it?§!\n\nA loud, deep droning sound has begun emitting from the sphere, for a short time.\n\n§HOh, that's ours. Well it was enjoyable to catch up. Can't wait to meet you sometime soon again. What was, will be, and all that.§!\n\nWith a loud, sudden thump, the Infinity Machine began slowly moving towards the star, accelerating as it approached the celestial body. It soon crashed into the star itself, disappearing into the light. What did it try to do? We may never know."
 celestial_chain.705.a: "Finish up the survey, we must leave soon."
 celestial_chain.705.desc_b: "The Infinity Machine continues after an audible gasp.\n\n§HOh! We remember you Briefs, we never did truly convey how thankful we were for your aid. Or did we? It's hard to remember.§!\n\nA loud, deep droning sound has begun emitting from the sphere, for a short time.\n\n§HOh, that's ours. Well it was enjoyable to catch up. Can't wait for you to find us again. What was, will be, and all that.§!\n\nWith a loud, sudden thump, the Infinity Machine began slowly moving towards the star, accelerating as it approached the celestial body. It soon crashed into the star itself, disappearing into the light. What did it try to do? We may never know."
 celestial_chain.705.desc_c: "The Infinity Machine continues after a long pause.\n\n§HAh, we remember you. You know, we're glad you've stopped with the 'hacking random machines' thing you do. Well you will, anyhow. Or have you already?.§!\n\nA loud, deep droning sound has begun emitting from the sphere, for a short time.\n\n§HOh, that's ours. Well it was enjoyable to catch up. Can't wait for you to find us again. What was, will be, and all that.§!\n\nWith a loud, sudden thump, the Infinity Machine began slowly moving towards the star, accelerating as it approached the celestial body. It soon crashed into the star itself, disappearing into the light. What did it try to do? We may never know."
 celestial_chain.705.desc_d: "We asked the Infinity Machine about how it travelled here.\n\n§HThe same way we left, of course. Or has that not happened yet? Either way, we will at some point.§!\n\nA loud, deep droning sound has begun emitting from the sphere, for a short time.\n\n§HOh, that's ours. Well it was enjoyable to catch up. Can't wait for you to find us again. What was, will be, and all that.§!\n\nWith a loud, sudden thump, the Infinity Machine began slowly moving towards the star, accelerating as it approached the celestial body. It soon crashed into the star itself, disappearing into the light. What did it try to do? We may never know."
 celestial_chain.705.a: "Finish up the survey, we must leave soon."
 celestial_chain.706.name: "Cinders of the World"
 celestial_chain.706.desc: "Shortly after the Infinity Machine disappeared into the light, the star itself began going dark extremely rapidly. But we saw no dead core in its place; there was instead a reflective sphere, dilating space as we approached, similar to a black hole.\n\nWithin it we glimpsed the shine of newly-formed stars, the beautiful nebulae dancing across space. Was this no star? Or perhaps this dimension's stars hold some unknown irregularity compared to that of ours.\n\nCracks began to appear on the spherical body, and small fragments of this strange star began to shatter and break off. The Wayfarer commanded the crew to gather up the fragments, for we will not be leaving this world without anything."
 celestial_chain.706.a: "How interesting."

 site_r_celestial_tainted_gem: "Tainted Stone"
 site_r_celestial_tainted_gem_desc: "$celestial_mission_site_intro$There is said to exist a stone, or gem perhaps, holding great energies within. These may be quite useful for our research, or even towards our economy."
 celestial_chain.802.name: "Crystal World"
 celestial_chain.802.desc: "Exiting the portal, our crew found themselves on the surface of a crystalline planet, or some form of celestial body. There is no atmosphere to speak of, and every inch of the surface is covered in various crystals and shining gems jutting out of the ground in a random arrangement.\n\nThere is some sort of beauty in this ordered mess, but to truly obtain something of worth, the Wayfarer suggests mining and studying the crystals."
 celestial_chain.802.a: "Good."
 celestial_chain.803.name: "Sample Studies"
 celestial_chain.803.desc: "Several samples have been retrieved from the crystal-world; most of the crystals appear to possess no particularly useful or unique properties, however a select few seen to be very effective conductors of electricity, though these are quite scarce.\n\nNo doubt there is some other composition of crystals and stones, some which may be more effective or interesting to study. Nonetheless, the crew will attempt to survey the rest of the planet to search for something more."
 celestial_chain.803.a: "Continue to do so."
 celestial_chain.804.name: "Quakes"
 celestial_chain.804.desc: "During another expedition to obtain rock samples, the very earth began to shake and rumble.\n\nOur first thought was an earthquake or tremor, but the shaking continued for days, seeming to grow more and more violent. To ensure the crew's safety, the [Root.GetName] took off from the surface of the planet, only to find some sort of asteroid field of crystalline rocks and various stones.\n\nAs the ship travelled further away from the planet, the field of crystals continued to follow us, or perhaps it was always just a truly gargantuan field of debris? And yet, the pulses from the shaking planet reached us, even this far."
 celestial_chain.804.a: "Something is wrong here."
 celestial_chain.805.name: "Crystalline Beast"
 celestial_chain.805.desc: "It wasn't a planet.\n\nThe surface the [Root.GetName] was previously on was the surface of an impossibly massive crystal beast! The earthquake we felt was, in fact, the creature apparently waking up and moving what appeared to be its limb. The crystal appearance of the entity meant that it was almost impossible to discern any facial or bodily features, apart from a sole, flashing gem, probably similar in size to the [Root.GetName]. It resonated with a high-pitched screech.\n\nThe beast is rapidly moving towards us, even with its massive size."
 celestial_chain.805.a: "Get out of there!"
 celestial_chain.806.name: "Otherworldly Crystal"
 celestial_chain.806.desc: "The entity approached out ship with an extreme speed, the Wayfarer piloting their ship with high proficiency and speed in their attempts to evade the beast as it swung its crystal limbs towards us.\n\nSuddenly, the ship was smacked from behind, tilting the rear of the vessel upwards as alarms on the ship started blaring. The crew immediately attempted to regain control as the Wayfarer and their vortex-generating device began to work on an emergency escape.\n\nA small rift was torn into the space ahead of the ship, and soon we returned to our dimension; the crystalline beast attempted to cross with the ship, but the vortex dissipated as a part of one of their limbs reached through. Perhaps the massive crystal will prove useful."
 celestial_chain.806.a: "A close one there."

 # Relic Details
 celestial.1.name: "The Codex"
 celestial.1.desc: "Activating the §HAetherial Codex§! requires one to read the words etched onto the scroll. §Y[celestial_codex_target.GetName]§! was the one to do so.\n\nAs [celestial_codex_target.GetSheHe] read from the codex, [celestial_codex_target.GetSheHe] gained great knowledge about previously unknown technologies and information, allowing a great boost for our [Owner.GetScientistPlural].\n\nHowever, as a consequence of this unforetold power, [celestial_codex_target.GetName] writhed in pain as their body was overcome by the strange powers of the taboo scroll. We remain to see how they are affected as a result."
 celestial.1.a: "Understood."
