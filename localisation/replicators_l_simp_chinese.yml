# Attack Events - Your empire got hacked.
replicators.9.name: "Security Breach!"
replicators.9.desc: "Another empire gained unauthorized access to our servers! Our agencies for cybersecurity are already working on a solution. \n\nNew §Ysituation§! available."
replicators.9.a: "We must act quickly!"
replicators.16.name: "Burning Firewalls"
replicators.16.desc: "The enemy is close to win this fight, we have to act fast before they gain sensitive data from us."

# Situations - Empire Hack
situation_replicators_hack: "Replica Virus"
situation_replicators_hack_desc: "Right now our systems are facing a massive cyberattack known as the §RReplica Virus§!. We have to act quickly to avoid any further damage in our infrastructure. \n\nThe further the virus advances, the harder it will be to solve the security leak."
situation_replicators_hack_type: "Cyberattack"
situation_replicators_hack_monthly_change_tooltip: ""
replicators_hack_weak: "Security Breach"
replicators_hack_medium: "Malfunctioning Decryption"
replicators_hack_strong: "Overloading"
replicators_hack_end: "System Crash"
approach_repl_firewall_research: "Improve Security"
approach_repl_firewall_strong: "Overcharge Decryption"
approach_repl_firewall_medium: "Simple Decryption"
approach_repl_firewall_nothing: "We can't afford it."
string_replicators_firewall: "Firewall Strength"
situation_replicators_hack_finish_tooltip: "Our systems can not keep up with the attack and malfunction one after another. \n\n§EEffects:§! \nRisk of §Rbroken infrastructure§! or similar. We can only estimate the negative outcome. \n\nReplicators (Level): §R+1§!"
situation_replicators_hack_fail_tooltip: "The attack of the Replicators fails & we do not receive any damage to our infrastructure or systems. \n\n§EEffects:§!\nReplicators (Level): §G-1§!"
replicators.17.name: "System Failure"
replicators.17.desc: "The recent cyberattacks caused major damage in our systems & infrastructure. We are sure the enemy will benefit from the collected information.\n\n§WReplicators (Level):§! §R+1§!"
replicators.18.name: "No Way In"
replicators.18.desc: "A loud applause awoke the cyber-security-centers after finally solving the current security leak that allowed the enemy to fall into our systems.\n\n§WReplicators (Level):§! §G-1§!"

replicators.21.name: "Sabotage on planet §Y[event_target:hacked_infrastructure.GetName]§!!"
replicators.21.desc: "Ruined building"
replicators.22.name: "Sabotage on planet §Y[event_target:hacked_infrastructure.GetName]§!!"
replicators.22.desc: "A devastating cyberattack on §Y[hacked_infrastructure.GetName]§! caused many systems to malfunction, thus causing heavy damages in industrial areas."
replicators.23.name: "Malfunction on starbase §Y[event_target:hacked_infrastructure.GetName]§!!"
replicators.23.desc: "A recent attack on our security systems opened multiple large hangar doors, which caused an immediate explosion in multiple areas. Also some automatic defence platforms began to open fire on own units, but didn't cause any fatalities."
replicators.24.name: "Fleet §Y[event_target:hacked_infrastructure.GetName]§! eaten by nanites!"
replicators.24.desc: "A swarm of nanites was literally eating the hull of some of our ships. The affected fleet requires imminent repairs before we can send them back to battle."

# Situations - Hacking the Replicators
situation_replicators_counterhack: "Counterhack"
situation_replicators_counterhack_desc: "Our systems are ready to deal a decisive blow against the matrix of the Replicators. The security experts are waiting for your command."
situation_replicators_counterhack_type: "Counterhack"
situation_replicators_counterhack_monthly_change_tooltip: ""
