approach_repl_brutforce_weak: "DDoS Attack"
string_replicators_brutforce: "Codebreaking-Speed"
situation_replicators_counterhack_finish_tooltip: "A successful attack on their systems allows us to to gain new §Ydiplomacy options§! when dealing with the Replicators. \n\n§EEffects:§!\nReplicators (Level): §G-2§!"
situation_replicators_counterhack_fail_tooltip: "Their decryption is too strong for us, if we don't do anything they will attack us back. \n\n§EEffects:§! \n- §Y1§! year §R-2§! encryption \n- §Y1§! year §R-2§! decryption \nReplicators (Level): §R+1§!"
replicators.19.name: "Soure Injection - §RFailed§!"
replicators.19.desc: "The attack against the systems of the Replicators failed. Experts say it will take §Y1§! year until our machines are repaired. \n\n§WEncryption:§! §R-2§! \n§WDecryption:§! §R-2§! \n§WReplicators (Level):§! §R+1§!"
replicators.20.name: "Soure Injection - §GCompleted§!"
replicators.20.desc: "We successfully sent manipulated network packets into the systems of the Replicators. We are sure such attacks will delay their actions until further forces will arrive or join our fight against them. \n\n§WReplicators (Level):§! §G-2§"

