# Written by Exakan
# Mistakes are possible, the mod was created with limited time.

# Mod Menu
replicators_tooltip: "A dynamic crisis with different endings, quests & effects on other empires. This is a §Yprototype§!, a full version will be published in the Steam workshop after the MODJAM."
replicators_allowed: "§GReplicators Enabled§!"
replicators_disabled: "§RReplicators Disabled§!"

# Event Chains
replicators_crisis_chain_title: "§HReplicators§!"
replicators_crisis_chain_desc: "A grey storm is approaching the galaxy. Decision-making is a key factor to deal with this extragalactic threat. \n\n§WReplicators (Level):§! §H[global_event_country.replicators_power]§!\n\nOur best scientists created the §Yspecial project§! §HStorm of Metal§! for further details."
replicators_ships_killed_count: "Ships - §GDestroyed§!"
replicators_ships_killed_us_count: "Ships - §RLost§!"
replicators_pops_infected_count: "Pops - §YInfected§!"
replicators_pops_infected_killed_count: "Pops - §RLost to the Replica Plague§!"
replicators_hacks_count: "Empires - §YHacked§!"
REPLICATORS_CRISIS_INFO: "§HStorm Of Metal§!"
REPLICATORS_CRISIS_INFO_DESC: "- They receive §Yreinforcements§! every §Y5 years§!. \n- §YUntil attacked§! by us, their ships will stay §Yneutral§!. \n- Click on their flag to open their §Ydiplomacy§!. \n\nThe fleet size of their §Rreinforcements increases§! with the number of their §Rlevel§!. \n\n§WReplicators (Level):§! §H[global_event_country.replicators_power]§! \n§RIncreases§! every few years & when they hack empires. \n§GDecreases§! when empires hack their computers or when we destroy their large starbases." 

# Arrival Event
replicators.3.name: "Storm of Metal"
replicators.3.desc: "It seems like an unknown entity has began to hack into countless computer systems across the galaxy. At this point the reason is still not known, but we were a target of these rapid cyberattacks as well. \n\nNews sources of other nations & own sensor arrays detected also a strong concentration of energy in two star systems. One is nearby, while the other one is out of range - watching the galaxy from a safe distance. \n\nHowever, these extragalactic visitors will for sure cause some changes to our foreign policy..."
replicators.3.a: "Initiate communication."

replicators.11.name: "Continuing Arrival"
replicators.11.desc: "Another §YStellar Engine§! has arrived in §H[event_target:replicators_new_system.GetName]§!, and with it also some §Yreinforcements§! of the empire that calls itself Replicators. Further diplomatic or militaristic actions are required before their numbers get out of control. \n\n§WReplicators (Level):§! §R+5§!"
replicators.11.a: "This is getting worse and worse."

# Diplomacy - Main
replicators.4.desc: "§LWelcome! This is the security-center of our empire. Our experts have figured out that these machines determine their approaches individually for each nation. They suggest to follow these advices:§! \n\n§HIntel:§! \n- Diplomatic options and decisions here change the outcome of this "crisis", so choose wisely. \n- Some options unlock and/or block other possibilities."
replicators.4.lore: "Neutral Approach"
replicators.4.missions: "Friendly Approach"
replicators.4.counterattack: "Hostile Approach"
replicators.4.choices: "Select an Ending"
replicators.4.close: "§HEnd communication§!"
replicators.diplo.back: "§HReturn§!"

replicators_title_1: "Security Center"
replicators_title_2: "Replicators - §YNeutral Approach§!"
replicators_title_3: "Replicators - §GFriendly Approach§!"
replicators_title_4: "Replicators - §RHostile Approach§!"
replicators_title_5: "Replicators - Ending the threat"

# Diplomacy - Menu 1 - Lore
replicators.5.desc: "§LBefore doing anything, it is probably better to understand their final aims and purpose. Knowledge however has its price, which we have to pay.§! \n\n§HIntel:§! \n- We believe that a neutral approach will bring us "only" some basic information about them."
replicators.5.a: "Initiate communication §L(Task)§!"
tooltip_replicators_5_a: "§LWe begin to exchange data about our empire & species to receive more information about them in return.§! \n\nWe will §Rlose§! §Y1§! £pop£."
replicators.5.b: "What are you?"
tooltip_replicators_5_b: "§LIt seems we won't get any information without telling them something first.§! \n\n§HRequirements:§! \n- Finish §YInitiate communication§!."
replicators.5.b.response: "§LThe first question our scientists and leaders have is the same, what the hell are they?§! \n\n§S<Starting communication>§! \nYou are not advanced. You, are a post-primitive lifeform. \n\n§S<Calculating potential intellect of the target>§! \nNot high. Low decryption required, use low-level protocols. \n\n§S<Error: Unknown language! Decrypting...>§! \nWe are scanning given data of your systems and contact signals. Meanwhile, be not afraid. We will try to keep your main-cells intact. \n\n§S<Intel successful>§! \nWe, are the Replicators - a survey-unit made by the §R<REDACTED>§!. We look out in other galaxies for §R<REDACTED>§!, to secure it before their inevitable extinction terminus arrives. \n\n§LFascinating, but how can you "survey" entire galaxies? It would take ages!§! \n\n§S<Converting to a mortal value>§! \nWe are between 30000 - 85000 life circles old, dependent on the species talking to us. Your lives are measured in years and decades. This is the interval we would need to explain just a small fraction of our §R<Use local time data>§! yearly experiences."
replicators.5.c: "Whats your purpose?"
replicators.5.c.response: "§LThey seem to have a programmed purpose. To find out their true goals could help us to pick important decisions.§! \n\n§S<Loading public data block - full access >§! \nWe collect data in distant galaxies, before the §R<REDACTED>§! continue with their project of recreation. We have no interest in harming you. Our protocols initiate firstly a neutral setup. However, your resistence is futile in any possible outcome. \n\n§LSo you collect information? What exactly are you searching for and why?§! \n\n§S<Loading public data block - limited access>§! \nWe desire all information about the present galactic objects and species. We accept samples - voluntary or forced. \n\n§LThat.. sounds harsh. And what did you mean with "extinction terminus"?§! \n\n§S<Loading public data block - limited access>§! \nEach being, each galaxy and each object has a critical limit - the duration of its existence. What are for example 80 years? - nothing, you wither and die without any trace. There is an escape from this - the §R<REDACTED>§!."
replicators.5.d: "Investigate - our galaxy"
tooltip_replicators_5_d: "§LAfter learning more about their aims, we have to know more about their work with our "home".§! \n\n§HRequirements:§! \n- Finish §YWhats your purpose?§!. \n- Finish §YShared Sources§! (Friendly Approach)."
replicators.5.d.response: "§LTo you this galaxy seems to be just a small step, so why exactly did you choose this one? There must be countless other galaxies to examine.§! \n\n§S<Continuing exchange>§! \nNot all galaxies contain post-primitive forms of life. We got programmed to only analyze galaxies that have a big potential. \n\n§LGreat potential for what?§! \n\n§S<Continuing exchange>§! \nDiscovering or already including new forms of life, technology, culture and similar. \n\n§LSo... what are you going to do with that?§! \n\n§S<Continuing exchange>§! \nSaving it, forever. The extinction terminus of everything is like our creators - inevitable. It must be saved before the universe decides to devour it forever. \n\n§LAll this happens only after an incredibly long time. Why should we deal with that now? We won't even be a part of this "issue".§! \n\n§S<Continuing exchange>§!\n§S<Loading public data block - limited access>§! \nThere is a level of existence you are not even aware of. There is no other solution possible. The project began countless star cycles ago, and it has seen great success. \n\n§LWho did even exist such a long time ago to tell the tale?§! \n\n§S<Loading public data block - limited access>§! \nThey still exist, just in an advanced condition. \n\n§LAdvanced condition..?§! \n\n§S<Loading public data block - no access!>§! \nThis information is classified, the §RREDACTED§! have to tell you this knowledge, if you are willing to learn. This exchange is over."
replicators.5.e: "Investigate - their creators"
replicators.5.e.response: "§LAfter learning they were indeed made by another powerful entity, we have to know more. Is there really something so powerful out there? The information they gave us raised more questions than it answered. It seems we are not advanced enough to grasp their meanings... However, one thing stands out - their "creators". What were they? Do they still exist? What and why are they doing it?§! \n\n§S<Loading public data block - limited access>§! \nYou young star nation, the pinnacle of life awaits everyone - sooner or later. It might be hard to understand at first, but once you entered the project, you won't want to come back to your current existence. \n\n§LWhats the "project" called? Or at least tell us what it does!§! \n\n§S<Loading public data block - limited access>§! \nIts the task of our creators to help every civilization to reach this level of existence. The name of the project is §RREDACTED§!. \n\n§LThat doesnt sound very convincing at all. What if a species doesnt want to change? Like you said, you are very old. Your understanding of existence is very different to ours. To us, you sound like an assimilator.§! \n\n§S<Continuing exhange>§! \nThe creators don't make a difference between your reactions - its inevitable. Its the only way you and others will survive the end of the galaxy & universe - or any self-induced demise. While watching your galaxy we understood that the latter option has a high chance to happen here. \n\n§LWho are you to judge us? Different galaxies means different species.§! \n\n§S<Loading public data block - full access>§! \nWhen our creators began with the project, they evaluated & examined all the harvested galaxies. The pattern is always the same - no exception. The §RREDACTED§! made experiments with different approaches in very far & old galaxies. This exchange is over - §Rlimiting public data blocks§!. \n\n§LWait! Before shutting down the signal.. whats the name of your creators? Where are they? WILL THEY COME HERE?§! \n§BA wave of energy rampages once across the communication center, leaving our staff temporarily paralyzed.. but able to listen.§! \n\n§S<Loading public data block - limited access>§! \nNeither can their true name be translated into your language, nor can you comprehend their abilities. If this galaxy shows great potential, they will come. Prepare yourself for the arrival, they will decide your fate. Your immortal salvation is watching you - the §RSpectrals§!. \n\n§S<Ending exchange -§! §Rshutting down frequency§!§S>§!"                                                                                                                                                                                         

# Diplomacy - Menu 2 - Missions
replicators.6.desc: "§LA big part of our military leaders expect that these machines could share useful technologies with us to put us into a stronger position. Others believe it could start harmful relations with other star nations, so its up to our elite to decide & keep things secretly.§! \n\n§HIntel:§! \n- Missions here could unlock unknown possibilities or technologies for our empire, if we are fast enough with our actions."

replicators.6.a: "Samples §L(Task)§!"
tooltip_replicators_6_a: "§LTo show them our good will, we can help them to gain some information about our galaxy.§! \n\n§HRequirements:§! \n- Finish §YInitiate communication§! (Neutral Approach). \n\n§EEffects:§!\n- Starts a §Yspecial project§! to examine certain galactic objects."
replicators.6.b: "Power of Espionage §L(Task)§!"
tooltip_replicators_6_b: "§LEspionage is a powerful weapon, and the Replicators are very good in it.§! \n\n§HRequirements:§! \n- Finish §YSamples§!. \n\n§EEffects:§! \n- Unlocks the §Yoperation§! §GReplica Virus Injection§!. \n- Only §Yonce§! available, use at any empire."
replicators.6.c: "Cosmic Components"
tooltip_replicators_6_c: "§LAfter learning more about our galaxy, they became interested in physical samples of certain matter.§! \n\n§HRequirements:§! \n- Finish §YPower of Espionage§!. \n- Has §Y1500§! £volatile_motes£ Volatile Motes. \n- Has §Y1500§! £exotic_gases£ Exotic Gases. \n- Has §Y1500§! £rare_crystals£ Rare Crystals. \n\n§EEffects:§! \n- Exchanges §Yrare resources§! for knowledge."
replicators.6.d: "Into the Enknown §L(Task)§!"
tooltip_replicators_6_d: "§LOur scientists are still in the dark when it comes to their structures, whats their purpose?§! \n\n§HRequirements:§! \n- Finish §YCosmic Components§!. \n\n§EEffects:§! \n- Starts a §Yspecial project§! to learn about their nanite structures."
replicators.6.e: "Shared Sources §L(Task)§"
tooltip_replicators_6_e: "§LThe increased work to keep this exchange working requires a separate department, we should asign an expert as leader for this.§! \n\n§HRequirements:§! \n- Finish §YInto the Enknown§!. \n- Requires at least one §Yleader§! with level §Y4§! or above. \n\n§EEffects:§! \n- One §Yscientist§! (minimum level §Y4§!) will be removed from our leaderpool to focus only on the Replicators."
replicators.6.f: "Compiling Data §L(Task)§!"
tooltip_replicators_6_f: "§LMore and more calculations take place in our systems on§! §Y[Root.Capital.GetName]§!, §Lbut it starts to become too much...§! \n\n§HRequirements:§! \n- Finish §YShared Sources§!. \n\n§EEffects:§! \n- Puts the §Ydeposit§! §GNano-Decoder Site§! on our §Ycapital§!. Finish the site for the next step."
replicators.6.g: "Final Verdict §L(Decision)§!"
tooltip_replicators_6_g: "§LThe cooperation with the Replicators has shown us some interesting technologies and knowledge. Now its our turn to decide what to do with it.§! \n\n§HRequirements:§! \n- Finish §YCompiling Data§!. \n\n§EEffects:§! \n- We have the §Yfree choice§! to decide what we do next (endings). \n- §RWarning:§! §PThis option will appear only once!§!"

replicators.32.name: "Data for their collection"
replicators.32.desc: "Their first request was to share some information about local star formations and what they are made of. We immediately sent our best scientists to investigate this task, lets hope the Replicators will be satisfied with the result. \n\nThere is a new §Yspecial project§! available."
REPLICATORS_MISSION_SURVEY: "Galactic Objects"
REPLICATORS_MISSION_SURVEY_DESC: "The Replicators are interested in stars, planets and similar objects. We have no idea why, but if we help them to survey certain points of interest then we might have a chance of positive relations. \n\nOur §Yscientists§! will gather in the orbit of our §Yhomesystems§! star and then begin to examine cosmic data from this point on across our entire empire."
replicators.33.name: "Data for their collection"
replicators.33.desc: "It is done! Indeed the machines reacted positive when receiving the results, lets see what they want now. \n\nOption §YPower of Espionage§! is now available."

operation_repl_hack_virus: "Replica Virus Injection"
operation_repl_hack_virus_desc: "Hacks the target's computer systems and injects a virus to gain secret data."
operation_repl_hack_virus_on_success: "§EIf Succesful:§! \nUnlocks secret assets of the target. Only the Replicators and their encrypted software know what will happen..."
replicators.34.name: "Security Leak"
replicators.34.desc: "We found a critical error in their firewall and cyber defences. Our experts will use this opportunity to sneak into their hidden servers to look out for the requested information."
replicators.35.name: "Decrypting"
replicators.35.desc: "The data we found includes hints of other servers and local hosts, which have each their own encryption. Thanks to the machines and their mysterious but very effective code breaking mechanisms, we able to get access to these data blocks."
replicators.36.name: "Code Injection"
replicators.36.desc: "" #"PLACEHOLDER \n§RAlpha Build - missing reaction event(s).§!" # Needs another action/event in hotfix.
replicators.37.name: "Code Injection - §GSuccessful§!"
replicators.37.desc: "Our attack on the systems of §H[target_country.GetName]§! was successful! We were able to decrypt all gained data and are now sending it to these machines for further investigation, lets see what happens. \n\nOption §YCosmic Components§! is now available. \n£opinion£ Opinion of §Y[target_country.GetName]§! decreased by §R50§!."
replicators.38.name: "Detected Cyberattack!"
replicators.38.desc: "Today we learned that the nation of §H[hacker_country.GetName]§! entered our computer systems to steal sensitive data. The confusing thing is, that the type of data they were searching for is not really helpful for any advantage in war. What the hell are they doing? \n\n£opinion£ Opinion for §Y[hacker_country.GetName]§! decreased by §R50§!."
opinion_repl_hacker_country: "Nation of Hackers"

REPLICATORS_MISSION_STRUCTURES: "Into the Unknown"
REPLICATORS_MISSION_STRUCTURES_DESC: "Their fleets are one thing, but their giant space station is another topic that makes our generals worry. They are now in an exchange with the Replicators to learn about their so called "Nano Stellar Engine"."
replicators.39.name: "Solved Mystery"
replicators.39.desc: "The Replicators are indeed on another technological level. Their stations called by the name §YStellar Engine§! are a teleportation device! They use them to travel across the universe, while not having to deal with any travel time. As reply to the question who designed them they began to refer to their masters, but didn't give us any further information about that. \n\nOption §YShared Sources§! is now available."

replicators.40.name: "Shared Sources"
replicators.40.desc: "Due the increased amount of work, we require a new department to administrate the diplomatic actions with the Replicators. Our leaders have an eye on §H[replicator_scientist.GetName]§!, because the provided knowledge is phenomenal and helped us a lot. \n\nAssigning the leader to this job will §Rremove§! him/her from our leaderpool, but unlock the options §YCompiling Data§! & §YInvestigate - our galaxy§! (Neutral Approach)."
replicators.40.a: "We decide later."
replicators.40.b: "Assign him to this task."

d_repl_emitter_site: "Nano-Decoder Site"
d_repl_emitter_site_desc: "This construction site will once be a giant datacenter."
replicators.42.name: "New Datacenter on [Root.Capital.GetName]"
replicators.42.desc: "We recently finished a new big datacenter on our homeworld, thus making it possible to hijack unencrypted signals from different sources. However, the main focus will be the work with the Replicators. \n\nOption §YFinal Verdict§! is now available."

replicators.43.name: "Final Verdict"
replicators.43.desc: "We never expected this to happen, but we somehow began to desire their power. Sure, for other nations we might sound crazy - but who wouldn't like to reach another level of power which would even exceed the wildest dreams? \n\n\n§WControl:§! \n- We take control of some remaining Replicator fleets. \n- There is a chance to discover new technologies. \n- Unlocks the §Hending§! §YControl§!. \n\n§WImitation:§! \n- Starts a new crisis path via event chain. \n- Unlocks the §Hending§! §YImitation (50%)§!."
replicators.43.a: "§LWe decide later.§!"
replicators.43.b: "Control"
replicators.43.c: "Imitation"

# Diplomacy - Menu 3 - Counterattack
replicators.7.desc: "§LThere is no peaceful way to deal with this entity. We can begin to infiltrate their computers to gain information about their weaknesses.§! \n\n§HIntel:§!\nReplicators hacked by us: §H[root.repl_hacked_by_root]§! \nReplicators destroyed by us: §H[root.repl_destroyed_by_root]§!"
replicators.7.a: "Cyberattack §L(Task)§!"
tooltip_replicators_7_a: "§LWeakens their network step by step before continuing with further countermeasures.§! \n\n§EEffects:§!\n- Starts a §Ysituation§! to hack the Replicators. \n- Replicators (Level): §G-2§! \n- Unlocks options §YBrute Force§! & §YCyberattack§!."
replicators.7.b: "Brute Force §L(Task)§!"
tooltip_replicators_7_b: "§LThe enemy forces rampage across the galaxy. To protect ourselves and possibly other allied nations, we should diminish their numbers.§! \n\n§HRequirements:§! \n- Replicators hacked by us: §Y7§! \n- Replicators destroyed by us: §Y75§! \n\n§EEffects:§! \n- Starts a §Yspecial project§! to unlock the next option."
replicators.7.c: "Source Location §L(Task)§!"
tooltip_replicators_7_c: "§LEnough intel and broken codes will make it possible decrypt certain weapon components to cause malfunctions via hijacked signals.§! \n\n§HRequirements:§! \n- Finish §YBrute Force§!. \n\n§EEffects:§! \n- Starts an §Yevent chain§! to start a direct attack on the Replicator systems."
replicators.7.d: "Counterattack §L(Decision)§!"
tooltip_replicators_7_d: "§LThe first steps towards victory are done, now its time to use the gained information for a fatal attack.§! \n\n§HRequirements:§! \n- Finish §YCounterattack§!. \n\n§EEffects:§! \n- We have the §Yfree choice§! to decide what we do next (endings). \n- §RWarning:§! §PThis option will appear only once!§!"

replicators_homesystem_chain_title: "Source Location"
replicators_homesystem_chain_desc: "We know the approximate location of their "homesystem", but require further calculations to adjust our jumpdrives and learn about potential threats in that system."
REPLICATORS_HOMESYSTEM_1: "Adjusting The Sensor Arrays"
REPLICATORS_HOMESYSTEM_1_DESC: "It is time to end this threat once and for all. To locate the target, we have to improve our systems to have any chance of finding the correct parameters."
REPLICATORS_HOMESYSTEM_2: "Artificial Hyperlane"
REPLICATORS_HOMESYSTEM_2_DESC: "The recent discoveries allow us to change the outcome of this war. However, the target is for now too far way to do anything. Our best scientists believe they can use the latest technologies to create a new hyperlane for our FTL generators - lets hope they are right!"
REPLICATORS_HOMESYSTEM_3: "Detecting Hostiles"
REPLICATORS_HOMESYSTEM_3_DESC: "We were successful with the calculations. Our military officials believe the required technology to open a new hyperlane to the system exists, but it would be foolish to enter without knowing the strength potential enemy forces there. \n\nWe will start to scan this and nearby systems for hostilities or any kind of unknown vessel. Our leaders will meanwhile prepare a battleplan."
replicators.25.name: "Crusade against the Storm of Metal"
replicators.25.desc: "We did it! The location of their control-system has finally been unveiled for our forces. Now its time to decide further actions against the Replicators. \n\nOption §YCounterattack§! is now available."

replicators.26.name: "Counterattack"
replicators.26.desc: "The last preparations are done, now its the turn of our leadership to decide what to do next. We received enough intel and data to choose between two possibilities. \n\n\n§WUltima Ratio:§! \n- Unlocks the §Hending§! §YDestruction§!. \n\n§WIsolation§!: \n- We encrypt the last security leaks & become invincible to any cyberattack. \n- We can not take any further actions against them to help others. \n- Unlocks the §Hending§! §YSelf Preservation§!. \n\n§WImitation:§! \n- Unlocks the §Hending§! §YImitation (50%)§!."
replicators.26.a: "Ultima Ratio"
replicators.26.b: "Isolation"
replicators.26.c: "Imitation"
replicators.26.d: "§LWe decide later.§!"

REPLICATORS_BRUTE_FORCE: "Brute Force"
REPLICATORS_BRUTE_FORCE_DESC: "Our best engineers are investigating the potential use of gained hardware from Replicator debris. \n\nUnlocks option §YSource Location§!."
replicators.28.name: "Unveiling Secrets"
replicators.28.desc: "With the help of data from debris and hacked computers we successfully hijacked a few signals of the enemy! \nOption §YSource Location§! is now available."

# Diplomacy - Menu 4 - Choices for the ending
replicators.400.desc: "§LThe Replicators can be stopped in different ways, or used as advantage for ourselves. We should consider carefully all aspects before approaching any available option.§! \n\n§HIntel:§! \n- Finish quests to unlock more options. \n- Each option shows the consequences (§Ytooltips§!). \n- Selecting an ending will automatically §Rlock§! all other options. \n- Our experts & scientists can only estimate these options, but arent sure what is needed to achieve them - our leader has to solve this enigma!"
replicators.400.a: "Destruction"
tooltip_replicators_400_a: "§LThese machines are too dangerous to stay alive, we have to destroy every last one of them.§! \n\n§EEffects:§! \n- Starts a §Yspecial project§! to create a connection to the homesystem of the Replicators to wipe them out. \n- §RWarning:§! They will receive further §Yreinforcements§! for a last time."
replicators.400.b: "Self Preservation"
tooltip_replicators_400_b: "§LWe don't owe this galaxy any favour. We will isolate ourselves and our systems from this threat.§! \n\n§EEffects:§! \n- Our empire can not be hacked anymore. \n- Global £opinion£ Opinion decreased by §R-50§!. \n- Our §Ycapital§! & §Yempire§! receive the modifier §GMolecular Datacenter§!."
replicators.400.c: "Control"
tooltip_replicators_400_c: "§LThese machines are very powerful if used correctly, it would be a waste to destroy them.§! \n\n§EEffects:§! \n- Begins a §Yspecial project§! to take control of the remaining Replicator-forces & technologies. \n- Only the §Yfirst empire§! can start this path!"
replicators.400.d: "Imitation"
tooltip_replicators_400_d: "§R- ALPHA BUILD - \nThis ending isnt included/working yet!§! \n\n§LThe collected data has the potential to bring us great power. This storm of metal was just a beginning, a hurricane is coming...§! \n\n§EEffects:§! \n- Starts a new §Yevent chain§! to become a crisis."
# PLACEHOLDER above (Alpha Build)

REPLICATORS_ENDING_DESTRUCTION: "Into The Abyss"
REPLICATORS_ENDING_DESTRUCTION_DESC: "This is the last required task for our scientists to open the wormhole to the enemy cluster. We should be careful, there is no way back when opening this. The wormhole will spawn near our §Ycapital§!."
replicators.27.name: "Into The Abyss"
replicators.27.desc: "The decisive day has come - the final battle against the Replicators is about to come. Our scientists successfully created a wormhole to their control-system, and our forces prepare for the possible victory. \n\nOur sensors detected many new hostile units, we should be careful when entering their cluster. \n\nThe wormhole is now located in §H[Root.Capital.System.GetName]§!."
replicators.27.a: "Mobilize the fleets!"
replicators.30.name: "End of the Storm of Metal"
replicators.30.desc: "The §H[replicators_destroyer.GetName]§! destroyed a giant space station in the §YRift§! system and it seems like this was the control unit of the Replicators. After its destruction all their ships had a temporary system failure, which made it possible to destroy all of them at once before they were able to reboot. \n\nThis crisis is gone, but the remains of this defeated threat might cause some temptation for empires that are able to use the new knowledge for their own advantage..."

replicators.44.name: "Ruling the Storm of Metal"
replicators.44.desc: "Control is power, and we will be the one who are able to deal with this huge responsibility. It won't be an easy task, but the potential reward is bigger than any risk."
replicators_control_chain_title: "Ruling the Storm of Metal"
replicators_control_chain_desc: "Control is power, and we will be the one who are able to deal with this huge responsibility. It won't be an easy task, but the potential reward is bigger than any risk."
REPLICATORS_CONTROL_1: "Into The Abyss"
REPLICATORS_CONTROL_1_DESC: "We are decrypting their last signals to open the wormhole to their core system. When finished, we have to send our fleets right into the heart of the enemy - while letting our forces capture important control units of the Replicators. \n\nIt will be a §Ysurprise attack§! for them, if they are still neutral!"
replicators.4401.name: "Into The Abyss"
replicators.4401.desc: "The day has come - lets start the final battle! While destroying their core station, our special forces will capture some of their control units for the coming projects to take over them. \n\n§RTo continue, we have to destroy the Replicators before anyone else is doing it!§!"
REPLICATORS_CONTROL_2: "Shutdown"
REPLICATORS_CONTROL_2_DESC: "After decimating their last forces, our engineers began to capture the remaining parts to investigate the last signals of theit transmitters. There are still fleets flying around, which we can try to capture."
replicators.4402.name: "Shutdown"
replicators.4402.desc: "After decimating their last forces, our engineers began to capture the remaining parts to investigate the last signals of their transmitters. There are still fleets flying around, which we can try to capture."
replicators.4403.name: "Takeover"
replicators.4403.desc: "Our scientists and experts for cybersecurity are preparing the last steps for the final takeover. The remaining Replicator systems have a very advanced encryption, so it will probably take a while until it is done."
REPLICATORS_CONTROL_3: "Taking Control"
REPLICATORS_CONTROL_3_DESC: "Its incredible, we were actually able to decrypt important control units of these machines. Even though the last battle made all their forces unusable, we still learned to replicate them. If we decrypt the last codes, then we can use it for new technologies!"
replicators.4404.name: "Taking Control"
replicators.4404.desc: "This long journey of destruction and diplomacy helped our empire to become the first and only one in this galaxy to use extragalactic technology. The way the knowledge will be used is now in our hands. \n\nNew §Htechnologies§! will appear at some point, but its unknown when. \nWe also discovered that remains of the battle against the Replicators landed on the surface of different planets in the §YRift§! system - exploitable £nanites£"

replicators.45.name: "Becoming the Storm of Metal"
replicators.45.desc: "event45 PLACEHOLDER \n\n§REnding not working yet, all following events/projects have no effects!§!"
