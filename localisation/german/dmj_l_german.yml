# dmj_l_english
# By Jin2188

l_german:

 #Wrapper Stuff
 
 dmj_allowed:0 "§GDaniel Reinhard Allowed§!"
 dmj_disabled:0 "§RDaniel Reinhard Disabled§!"
 spawn_dmj:0 "Spawn §YDaniel Reinhard§!"
 dmj_tooltip:0 "Former God-Emperor of a primitive human civilization. He becomes more powerful with worship, but too much fanaticism will allow him to revolt and take over your empire."
 
 ##########################
 #SOLAR SYSTEM INTIALIZERS#
 ##########################
 
 NAME_dmj_infernal_stronghold:0 "Infernal Stronghold"
 NAME_dmj_Unholy_Bastion:0 "Unholy Bastion"
 
 BYPASS_DMJ_SHROUD_TUNNEL:0 "$SHROUD_TUNNEL_GALACTIC$"
 
 ########
 #EVENTS#
 ########
 
 #Primary Event Chain
 
 dmj.1.name:0 "Bizarre System"
 dmj.1.desc:0 "As the [Root.GetFleetName] enters the system, [Root.Fleet.Leader.DmjGetLeaderTitle] [Root.Fleet.GetLeaderName] reports on their surroundings, which are quite odd according to [Root.Fleet.Leader.GetHerHim]. Apparently, there are two rocky planets orbiting around a central black hole. The surfaces of the two planets cannot be discerned due to an extremely thick fog that blocks all sensors. Additionally, the planets appear to be surrounded by a viscous energy that they appear to be drawing from the central black hole. Whatever this system is, its structure does not appear to be natural. It seems to have been designed for a certain purpose.\n\n[Root.Fleet.Leader.DmjGetLeaderTitle] [Root.Fleet.Leader.GetFirstName] barely has time to finish [Root.Fleet.Leader.GetHerHis] description before [Root.Fleet.Leader.GetSheHe] suddenly reports hearing a strange voice in [Root.Fleet.Leader.GetHerHis] head. According to [Root.Fleet.Leader.GetHerHim], the voice appears to be male, originating from the central black hole, and says something along the lines of:\n\n\"§YDefeat the Sentinels. Free me.§!\"\n\nWe have very little time to decipher the meaning of this message, as almost immediately after the voice fades, the twin planets begin to glow brightly. The energy surrounding them coalesces into a formless mass above each world. Several members of the crew of the [Root.GetFleetName] report a feeling of dread and unwelcomeness upon viewing of the energy masses. Additionally, they report hearing a new voice in their heads, different from the one before. They claim it comes from the entities, but cannot explain how they know this. The new voice appears to be a harmonization of a male and female voice, and utters a single word:\n\n\"§RLeave.§!\""
 
 dmj.3.name:0 "Divine Whispers"
 dmj.3.desc:0 "As the entities, or 'Sentinels' as we presume them to be called, fade into nothingness, the voice from earlier returns. [Root.Fleet.Leader.DmjGetLeaderTitle] [FromFromFromFrom.Fleet.GetLeaderName] reports that the voice is much clearer now. It says:\n\n\"§YThis is not the end. They will return. Destroy the Bastions, they siphon the energy necessary to create them.§!\"\n\n[Root.Fleet.Leader.DmjGetLeaderTitle] [FromFromFromFrom.Fleet.Leader.GetFirstName] claims [FromFromFromFrom.Fleet.Leader.GetSheHe] feels a strangely powerful urge to obey the voice's commands. Whether this is a property of the voice itself or not is unknown. Regardless, we now know what we have to do."
 dmj.3.a:0 "We need more firepower!"
 dmj_sentinels_six_months:0 "The Profane Sentinels will reappear every 6 months after they are destroyed."
 
 dmj.6.name:0 "One Down..."
 dmj.6.desc:0 "The first of the 'Unholy' Bastions has been destroyed. Whatever ethereal techology it functioned off of, it seems raw bombardment did the trick. After enough time bombarding the planet, it seems we damaged a critical component in its functioning, causing the entire planet to collapse under its own gravity. The energy that was being siphoned from the central black hole has also faded, which hopefully means that the Sentinel of this planet will not return."
 dmj.6.a:0 "...one to go."
 
 dmj.7.name:0 "Prison Break"
 dmj.7.desc:0 "The second bastion has fallen. As with the previous one, it collapsed under its own gravity after enough bombardment. As the energy around the second bastion dissipates, a powerful distortion within space can be felt, presumably the work of the voice from earlier. The spacial distortion creates a massive rift below the system, and the central black hole appears to blow apart, revealing a massive shattered object, which can only be described as some kind of monolith. Thankfully, perhaps as an act of gratitude, our ships within the system are spared from being damaged by this cataclysm. After the chaos subsides and everything returns to normal, the voice is heard once again. It identifies itself as $NAME_dmj_daniel$, and expresses a desire to open formal communications with us."
 
 dmj.8.name:0 "$NAME_dmj_daniel$"
 dmj.8.desc:0 "§HOur translation algorithms take a moment to begin processing the man's dialect, as it seems he does not possess a personal translator.§!\n\nFinally! It's been so long since I've had someone to talk to other than those stupid Sentinels. I mean, it's not like those guys were up for conversation anyways, even though they're technically me. Anyways, thanks for getting me out of there. I don't even know how long it's been since they imprisoned me in that place. Why don't I help you out in return?"
 dmj.8.a:0 "What do you mean by the Sentinels 'technically' being you?"
 dmj.8.a.response:0 "They were formed by my energy. In order to contain me, I had to be constantly sapped of psychic energy. Those planets you blew up were siphons, using the energy they stole to form the Sentinels, and using the leftover energy to reinforce my prison. Using my own power against me. I have to say, very clever of them."
 dmj.8.b:0 "Who are 'they'? Why did they imprison you?"
 dmj.8.b.response:0 "My species, the Humans of Earth. I was the leader of a powerful nation, revered by my people. I figured humanity would be better off unified under my rule, but nooooo! They wanted their 'freedom'! Eventually, a powerful psychic on my homeworld dismantled my empire, defeated me, and banished me to this place. Here, I've been biding my time, rebuilding my old body, and waiting for someone to free me."
 dmj.8.c:0 "What do you intend to offer us?"
 dmj.8.c.response:0 "Power. Political, economic, military, or even supernatural, I have you covered in all those categories. The trick is to make your people fear and love you at the same time. So many tyrants rely purely on fear, which always eventually leads to hatred, and their inevitable downfall. If you can make your people love you on top of that fear, they'll let you get away with anything. Then you can slowly consolidate your authority, until it's absolute."
 dmj.8.commissioner:0 "What are your skills regarding planetary governance?"
 dmj.8.commissioner.response:0 "Huh? You mean like provincial rule? Yeah I can do that. In practice it's pretty much the same thing as ruling an empire. I assume you want resources? More output from your workers? I got you covered there."
 dmj.8.delegate:0 "What are your skills regarding diplomacy?"
 dmj.8.delegate.response:0 "Ah, diplomacy. The subtle art of twisting people around your pinkie finger. Yeah, I know all about it. You want to secure some influence abroad? Perhaps acquire a better diplomatic standing among your peers? If so, I'm your guy."
 dmj.8.advisor:0 "What are your skills regarding empire administration?"
 dmj.8.advisor.response:0 "Uh... you know that was basically my whole job back in the day, right? It should be obvious that I'm pretty good at it. I know administration can be a hassle, so just leave all the paperwork to me. That way, you can go out and actually get things done! How about that?"
 
 dmj.9.name:0 "[Root.GetName] Founded"
 dmj.9.desc:0 "Ever since our recruitment of $NAME_dmj_daniel$, he has been slowly spreading his influence within our government. Many of our officials have expressed concern at this, but $dmj_daniel_SECOND_NAME$ has assured them that he is simply doing this to help us. Regardless of whether this is true or not, $dmj_daniel_SECOND_NAME$'s influence has expanded into a full political faction, calling themselves the [Root.GetName]. Their members claim to align themselves with $dmj_daniel_SECOND_NAME$'s values, which, according to them, include spiritualist and conservative values, an extreme centralization of political and military power, and a desire to assert our military dominance over the galaxy. $dmj_daniel_SECOND_NAME$ himself has claimed that this is simply the next step in his attempts to assist us, in response to voices of concern from the upper echelons of our government."
 
 dmj.11.name:0 "[Root.GetName] Radicalizing"
 dmj.11.desc:0 "The recent growth of $NAME_dmj_daniel$'s political organization, the [Root.GetName] has become a source of great worry for many of our government's top officials. This worry has recently been amplified by the [Root.GetName]'s apparent radicalization. They claim that our government does not follow the values $dmj_daniel_SECOND_NAME$ claims to align with, and many of their members have expressed a desire to overthrow the government and replace it with one that follows $dmj_daniel_SECOND_NAME$'s values, and has $dmj_daniel_SECOND_NAME$ himself as its leader.\n\n$dmj_daniel_SECOND_NAME$ himself has offered no comment on the situation."
 dmj.11.a:0 "We will not allow this plot to succeed!"
 
 dmj.15.name:0 "The [reinhardist_rebellion.GetName] Rebels!"
 dmj.15.desc:0 "After a long period of unrest, the [reinhardist_rebellion.GetName] has officially began a true uprising. They now call themselves the [dmj_reinhardist_uprising.GetName], and have already declared ownership of a large chunk of our territory, including any planets led by followers of $dmj_daniel_SECOND_NAME$. They have also declared total war on our empire, in an attempt to assimilate our entire civilization into their new empire. Any devotees of $dmj_daniel_SECOND_NAME$ have defected to this new empire, and $dmj_daniel_SECOND_NAME$ himself has left to be crowned the leader of this uprising. It seems that $dmj_daniel_SECOND_NAME$ has been preparing for this moment for some time, and has decided on this moment to strike. The [Root.GetName] now finds itself in a very difficult situation, and only time will tell if we will survive."
 dmj.15.original:0 "§GWas this his plan all along?§!"
 dmj_rebellion_play_original:0 "You will continue to play as the [Root.GetName]."
 dmj.15.reinhardists:0 "§RTook you guys long enough!§!"
 dmj_rebellion_play_reinhardists:0 "You will play as the [dmj_reinhardist_uprising.GetName]."
 
 dmj.16.name:0 "[Root.GetName] Victorious!"
 dmj.16.desc:0 "After a long and grueling war, the [Root.GetName] has emerged victorious over the $dmj_daniel_SECOND_NAME$ist upstarts. The worlds they stole from us have been retaken, and their people have been re-integrated into our empire. The temples they used to worship the traitor $dmj_daniel_SECOND_NAME$ have been dismantled, and his devotees that defected have either fled, been discharged, or executed. $dmj_daniel_SECOND_NAME$ himself is unfortunately still at large, having escaped after our capture of the [LastKilledCountryName]'s last planet. Regardless, we can rest easy knowing that we no longer have to deal with him and his interference in our affairs."
 dmj.16.regular:0 "Good riddance."
 dmj.16.authoritarian:0 "A pity..."
 
 dmj.17.name:0 "[Root.GetName] Victorious!"
 dmj.17.desc:0 "After a long and grueling war, the [Root.GetName] has emerged victorious over the unholy [LastKilledCountryName]. We have claimed their land and their people for our lord $NAME_dmj_daniel$, and those who defied his will now lay defeated. Our [Root.GetRulerTitle] now controls the entire breadth of [Root.GetAdj] territory, with all of us under his command. The loyalists who dared to defy His commandments have either fled or been executed. With them out of the way, our people can celebrate the coming of a new age, where divinely ordained rule reigns supreme."
 dmj.17.a:0 "Finally!"
 
 # Sol Event Chain
 
 dmj_sol.1.name:0 "Search for Sol"
 dmj_sol.1.desc:0 "$NAME_dmj_daniel$'s home planet has been a recurring topic in his conversations with our government officials. It has become clear to us that he is quite bitter about his defeat by his 'nemesis', a powerful psychic whose name we know know to be §Y$NAME_dmj_michael$§!. Due to this, $dmj_daniel_SECOND_NAME$ has been pushing for us to locate his home system, Sol, and reinstall him on his throne."
 dmj_sol.1.knows_sol_desc:0 "$dmj_sol.1.desc$\n\nInterestingly, a star system that matches $dmj_daniel_SECOND_NAME$'s descriptions seems to already exist within our database. We have brought our data to $dmj_daniel_SECOND_NAME$, and confirmed that the system is indeed his home system of Sol. However, when attempting to sense the psychic energy coming from the system, $dmj_daniel_SECOND_NAME$ claimed to have not detected any significant amount of said energy. $dmj_daniel_SECOND_NAME$ claims that this likely means that $dmj_michael_SECOND_NAME$ has either abandoned the Human people for unknown reasons, or was defeated somehow.\n\n$dmj_sol.final.desc$"
 dmj_sol.1.not_knows_sol_desc:0 "$dmj_sol.1.desc$\n\nUnfortunately, this task has been made difficult by the fact that the Sol system, as described by $dmj_daniel_SECOND_NAME$, does not seem to appear in our database. It does not exist within our borders, and is not among the star systems cataloged outside the fringes of our territory. This leaves us no choice but to conduct an immense scan of every star system in the galaxy. Our scientists have proposed a project that could combine our scanning technology with $dmj_daniel_SECOND_NAME$'s psychic powers to complete such a scan far quicker than normal, although it would still take quite some time. Additionally, we must concern ourselves with what might wait for us once we locate Sol. $dmj_daniel_SECOND_NAME$ has proposed two possibilities, that he considers the most likely: 1. $dmj_michael_SECOND_NAME$ has either been defeated or has abandoned the Humans, and 2. $dmj_michael_SECOND_NAME$ remains on the Human homeworld of $NAME_Terra$. If the former possibility is true, than restoring $dmj_daniel_SECOND_NAME$ist rule should be trivial. However, $dmj_daniel_SECOND_NAME$ has warned us that we will face a great challenge should the latter possibility be true.\n\nIf $dmj_michael_SECOND_NAME$ remains on $NAME_Terra$, then $dmj_daniel_SECOND_NAME$ believes that he will have united the planet under his rule by now. $dmj_daniel_SECOND_NAME$ also believes it likely that he has discovered FTL travel. Should communications be opened with $dmj_michael_SECOND_NAME$'s empire, $dmj_daniel_SECOND_NAME$ believes that peace will not be an option. In fact, he considers it highly likely that $dmj_michael_SECOND_NAME$ will §Rimmediately declare war on our empire§! when he inevitably discovers our involvement in freeing $dmj_daniel_SECOND_NAME$. $dmj_daniel_SECOND_NAME$ has stressed that $dmj_michael_SECOND_NAME$ is not to be underestimated, and that it would be a good idea to build up our military to prepare for a potential conflict."
 dmj_sol.1.a:0 "Let's begin."
 
 dmj_sol.3.name:0 "Sol Unreclaimed"
 dmj_sol.3.desc:0 "Ten years have passed, and $NAME_dmj_daniel$'s ultimatum has run its course. As we have failed to reclaim the Sol system, $dmj_daniel_SECOND_NAME$ has stated that he no longer sees reason to continue working for us, and has promptly left our empire in search of another to join. Our empire's reaction to this news has been a mix of disappointment and relief. While many of our officials are saddened by the loss of such a skilled and powerful individual, some others have stated their relief that we did not let $dmj_daniel_SECOND_NAME$'s ambitions reach a tipping point. Regardless, this event is sure to significantly affect our empire going forward."
 
 dmj_sol.universal.desc:0 "After a long period of searching the galaxy, we have finally found a star system that matches $NAME_dmj_daniel$'s description of Sol."
 dmj_sol.nofaulkner.desc:0 "Upon an overview of the system using his psychic powers, $dmj_daniel_SECOND_NAME$ claims he did not detect any significant psychic presence that would indicate the existence of $NAME_dmj_michael$. Although this is a relief for us, as it makes restoring $dmj_daniel_SECOND_NAME$ist rule much easier for us, $dmj_daniel_SECOND_NAME$ has expressed disappointment that he cannot take revenge for his past defeat."
 dmj_sol.final.desc:0 "$dmj_daniel_SECOND_NAME$ has become increasingly agitated at this discovery, apparently seeing an easy opportunity to take back control of Sol. He has issued an ultimatum: Should we fail to take control of Sol and the Human homeworld within 10 years, $dmj_daniel_SECOND_NAME$ will leave our empire, and find another that is more aligned with his interests. In order to make completing this task more convenient, $dmj_daniel_SECOND_NAME$ has exploited a subspace instability from when he was imprisoned to create a tunnel through the Shroud between the Sol system and his former prison. He has informed us that some psionic aptitude will be required to traverse it properly, but this should still allow us to meet his deadline in short notice."
 dmj_sol.final.reinhardist_desc:0 "In order to make travel to the system more convenient, $dmj_daniel_SECOND_NAME$ has exploited a subspace instability from when he was imprisoned to create a tunnel through the Shroud between the Sol system and his former prison. He has informed us that some psionic aptitude will be required to traverse it properly, but this should still allow us to reclaim Sol in short notice."
 
 dmj_sol.4.name:0 "Pre-FTL Sol Discovered"
 dmj_sol.4.desc:0 "$dmj_sol.universal.desc$ $dmj_sol.nofaulkner.desc$\n\nUpon a more in-depth scan of the system, we detected life signs on the third planet, which $dmj_daniel_SECOND_NAME$ has identified as his home planet of Terra. Bio-signatures appear to match with $dmj_daniel_SECOND_NAME$'s DNA, suggesting that his species is the same as the lifeforms on the planet."
 dmj_sol.4.medieval_desc:0 "$dmj_sol.4.desc$\n\nThe people of this planet are presently in what could be considered a Late Medieval Age, with a firm grasp of metallurgy and a feudal society. The printing press is accelerating the spread of knowledge.\n\n[Root.GetNormalOrReinhardistSolEvent]"
 dmj_sol.4.machine_age_desc:0 "$dmj_sol.4.desc$\n\nAtmospheric contaminants and light pollution visible from orbit are consistent with a densely populated Machine Age society. The people of this planet appear to have mastered air travel, and factories are mass-producing goods in their cities.\n\n[Root.GetNormalOrReinhardistSolEvent]"
 dmj_sol.4.early_space_desc:0 "$dmj_sol.4.desc$\n\nThe people of this planet appear to be in the Early Space Age, as evidenced by the many primitive satellites orbiting their homeworld. Their nation states are on the path towards joining together in a global government, and it is likely only a matter of time before they venture beyond their world and join the galactic community.\n\n[Root.GetNormalOrReinhardistSolEvent]"
 dmj_sol.4.other_empire_owned_desc:0 "$dmj_sol.4.desc$\n\nInterestingly, it appears that this planet belongs to a larger entity, perhaps another interstellar civilization. The technology the people of the planet possess appears very similar to our own, and ships arrive on and leave the planet as if it were standard fare.\n\n[Root.GetNormalOrReinhardistSolEvent]"
 
 dmj_sol.5.name:0 "Destroyed Sol Discovered"
 dmj_sol.5.desc:0 "$dmj_sol.universal.desc$ $dmj_sol.nofaulkner.desc$\n\nThe reason for $NAME_dmj_michael$'s disappearance has become clear upon a more in-depth scan of the system, as the third planet, which $dmj_daniel_SECOND_NAME$ has identified as his home planet of Terra, has no signs of life. We have detected infrastructure that indicates a civilization once existed here, but no longer does. It appears that the Humans have been destroyed, either by themselves, or by some unknown third party. $dmj_daniel_SECOND_NAME$ has stated that this is rather tragic, but not unexpected. He claims his people were by nature divisive and tribalistic, and that it was only a matter of time before they destroyed themselves.\n\n[Root.GetNormalOrReinhardistSolEvent]"
 
 dmj_sol.6.name:0 "[dmj_sol_country.GetName] Discovered"
 dmj_sol.6.desc:0 "$dmj_sol.universal.desc$ Upon an overview of the system, $dmj_daniel_SECOND_NAME$ claims to detect a powerful psychic presence, which he believes to be $NAME_dmj_michael$. Almost immediately afterwards, a rift forms in the [dmj_spawn_system.GetName] system. $dmj_daniel_SECOND_NAME$ claims this tunnel through the Shroud will lead to Sol, allowing us easy access to the heart of $dmj_michael_SECOND_NAME$'s territory. Our attempts to perform a more in-depth scan into the system are blocked, and instead many of the scanner operators claim to feel a powerful psychic presence. A voice speaks to our government officials from within their minds, and demands that formal communications be opened immediately."
 
 dmj_sol.7.name:0 "$NAME_dmj_michael$"
 dmj_sol.7.desc:0 "What... what have you done?! You let him out?! Why?! We locked that guy up for a reason!\n\n*Sigh*\n\nListen. $dmj_daniel_SECOND_NAME$ is dangerous. He's just using you as a stepping stone on his quest for power. He'll stab you in the back the moment he thinks he can get away with it. He needs to go back in the prison, or he'll take over the entire galaxy.\n\nIf you won't stop him, then we'll have no choice but to stop you."
 dmj_sol.7.a:0 "Go ahead and try."
 dmj_sol.7.a.response:0 "Yeah, I figured you'd say that. Don't blame me for what happens next."
 dmj_sol.7.b:0 "Wait! Let's talk about this!"

 dmj_sol.8.name:0 "$NAME_dmj_michael$"
 dmj_sol.8.desc:0 "...Talk? You want to talk? After what you did?\n\n...\n\nI'm sorry. I didn't expect this. I thought you were just some tyrannical regime or something. I mean, I can't say that I don't want this to be resolved peacefully...\n\nTell you what. I'll make you a deal. You help us put $dmj_daniel_SECOND_NAME$ back in that prison, and then we can be friends. Or at least not enemies."
 dmj_sol.8.a:0 "We cannot do that."
 dmj_sol.8.a.response:0 "Damn... Just when I thought you weren't so bad. This is what I get for hoping, I guess."
 dmj_sol.8.b:0 "We understand."
 dmj_sol.8.b.response:0 "Thank you for seeing reason. You'll have to deal with him when he finds out though. We can't really send anything to help you in time."
 
 dmj_sol.9.name:0 "$dmj_daniel_SECOND_NAME$ Finds Out"
 dmj_sol.9.desc:0 "Our government officials have spent much time debating on how to approach $NAME_dmj_daniel$ and inform him of our betrayal. Obviously, there was no easy way to break the news. Recently, however, our officials have informed us of a recent incident. They expressed the situation in terms of good news and bad news:\n\nGood news: We no longer need to break the news to $dmj_daniel_SECOND_NAME$.\n\nBad news: Reinhard found out on his own, and is extremely angry.\n\nHe has obviously become hostile towards us, having abandoned his post. Additionally, the officials report that $dmj_daniel_SECOND_NAME$ has unleashed what he calls his 'battleform', surrounding himself with a swirling mass of psychic energy, similar to the Profane Sentinels we fought in order to free him originally. $dmj_daniel_SECOND_NAME$ has demanded to speak with us directly, perhaps in an attempt to convince us against this course of action."
 
 dmj_sol.10.name:0 "$NAME_dmj_daniel$"
 dmj_sol.10.desc:0 "I- I can't believe you! I offered you so much power, influence, and prestige, AND THIS IS WHAT I GET?! You're just gonna lock me back up?! I'LL KILL YOU!"
 dmj_sol.10.a:0 "Easy now, let's not get violent."
 dmj_sol.10.a.response:0 "SCREW YOU! §RI'M NOT GOING BACK IN THERE!§!"
 
 dmj_sol.11.name:0 "$dmj_daniel_SECOND_NAME$ Reimprisoned"
 dmj_sol.11.desc:0 "$NAME_dmj_daniel$ has been defeated. Our fleets were given orders to simply knock him unconscious, as we were warned of his soul's ability to perservere after death. After we defeated him, we quickly sent his unconscious body to $NAME_dmj_michael$, who placed a psychic seal on his mind to ensure he would not wake up. While we were fighting $dmj_daniel_SECOND_NAME$, $dmj_michael_SECOND_NAME$ was fixing the stronghold where he was formerly imprisoned, along with an entourage of psychic engineers. The shattered planets have been reformed, along with the technology that allows them to siphon psychic energy, and the cell itself has been rebuilt and shrouded with an event horizon. $dmj_daniel_SECOND_NAME$ was then placed into the cell, where he hopefully will not break out again. $dmj_michael_SECOND_NAME$ has warned us to guard the system, in order to prevent anyone else from freeing him. In the end, perhaps it was a good thing that we chose to rectify this mistake of ours, and hopefully, no one else will make the same mistake again."
 dmj_sol.11.regular:0 "Good riddance."
 dmj_sol.11.authoritarian:0 "A pity..."
 
 dmj_sol.13.name:0 "$dmj_michael_SECOND_NAME$ Captured"
 dmj_sol.13.desc:0 "Our forces have completed their invasion of the final planet belonging to the [dmj_sol_country.GetName]. The psychic warriors defending it were certainly quite formidable, but insights from $dmj_daniel_SECOND_NAME$ allowed our solidiers to exploit weaknesses and defeat them. Once we seized control of the planet, our generals gave $dmj_daniel_SECOND_NAME$ the all-clear to locate and place a lock on $dmj_michael_SECOND_NAME$'s soul, sealing his power temporarily. With $dmj_michael_SECOND_NAME$ located, our soldiers quickly captured him and took him into custody. While we were busy with our war against the [dmj_sol_country.GetName], $dmj_daniel_SECOND_NAME$ was busy rebuilding his former prison, in order to permanently seal $dmj_michael_SECOND_NAME$, since the current lock on his soul will not last forever. $dmj_michael_SECOND_NAME$ has requested to speak to us one last time before he is sealed away forever."
 
 dmj_sol.14.name:0 "$NAME_dmj_michael$"
 dmj_sol.14.desc:0 "...So this is it then? All I wanted was to help people, to be kind... I wouldn't have gotten in your way, we could've co-existed, but you decided to free that monster. He doesn't care about you. He doesn't care about anyone, just his own ambitions. I tried to warn you, but you didn't listen. I just... hope you can figure it out before it's too late."
 dmj_sol.14.evil:0 "Enough. Into the cell."
 dmj_sol.14.good:0 "We're sorry."
 
 dmj_sol.15.name:0 "$dmj_michael_SECOND_NAME$ Imprisoned"
 dmj_sol.15.desc:0 "It is done, $dmj_michael_SECOND_NAME$ has been sealed. With him out of the way, we can safely say that we have completed $dmj_daniel_SECOND_NAME$'s task of reclaiming Sol, and getting revenge for his past defeat. However, many of our people have been wondering about what $dmj_michael_SECOND_NAME$ was warning us about. Was what he said true? Will $dmj_daniel_SECOND_NAME$ really betray us? Will his ambitions extend beyond simply reclaiming his homeworld? Perhaps it is best if these questions remain unanswered, or perhaps we should be wary, and prepare for the worst. Maybe, just by freeing $dmj_daniel_SECOND_NAME$, we have made ourselves the enemy of compassion and justice. Maybe, WE are the villains."
 dmj_sol.15.evil:0 "Bah! Questions for later!"
 dmj_sol.15.good:0 "Maybe... maybe..."
 
 dmj_sol.16.name:0 "$dmj_daniel_SECOND_NAME$ Reimprisoned"
 dmj_sol.16.desc:0 "After our defeat at the hands of the [dmj_sol_country.GetName], their demands have come into full effect. $dmj_michael_SECOND_NAME$ has apprehended $dmj_daniel_SECOND_NAME$ by placing a psychic seal on him, and the [dmj_sol_country.GetName] took him into their custody. $dmj_michael_SECOND_NAME$ has spent some time fixing the stronghold within our territory where $dmj_daniel_SECOND_NAME$ was formerly imprisoned, along with an entourage of psychic engineers. The shattered planets have been reformed, along with the technology that allows them to siphon psychic energy, and the cell itself has been rebuilt and shrouded with an event horizon. $dmj_daniel_SECOND_NAME$ was then placed into the cell, where they hope he will not break out again. $dmj_michael_SECOND_NAME$ has demanded we guard the system, in order to prevent anyone else from freeing him. While many of our government officials are angered that such a powerful and skilled individual was forcibly ripped from us, our people's opinions on the matter are more mixed. Some are even expressing relief. Perhaps our surrender was the right thing to do, to prevent $dmj_daniel_SECOND_NAME$'s ambitions from reaching a tipping point. Perhaps we should be more wary of who we trust in the future."
 
 #Flavor Events
 
 dmj_flavor.2.name:0 "Divine Insights"
 dmj_flavor.2.desc:0 "Being such a powerful psychic, $NAME_dmj_daniel$ naturally possesses much knowledge on the nature of psionics. $dmj_daniel_SECOND_NAME$ has offered to share some of this knowledge with us, claiming it could help us greatly. Although the Shroud is very unpredictable according to $dmj_daniel_SECOND_NAME$, he claims that when it works in your favor, it can grant extraordinary power. He claims these insights are just a taste of what is possible, intriguing many of our scientists, who are now working on integrating these insights into our empire."
 
 dmj_flavor.3.name:0 "Manifest Destiny"
 dmj_flavor.3.desc:0 "Recently, $NAME_dmj_daniel$ has began to show interest in the Pre-FTL civilizations within our borders. He has made many speeches to his followers about the need to integrate these 'primitives' into the greater [owner.GetAdj] civilization. He has been preaching an idea known as \"Manifest Destiny\", the belief that it is the divine destiny of [owner.GetAdj]kind to expand their dominion over the galaxy, focusing especially on the 'primitives' within our domain. This newfound zeal is sure to help our Pre-FTL infiltration efforts."
 dmj_reinhard_infiltration_buff:0 "Manifest Destiny"
 dmj_reinhard_infiltration_buff_desc:0 "An idea preached by $NAME_dmj_daniel$ has given our people a newfound zeal to integrate Pre-FTL civilizations into our empire."
 mod_op_cat_infiltration_speed_mult:0 "Operation Speed ($op_cat_infiltration$)"
 mod_op_cat_infiltration_difficulty_mult:0 "$mod_op_cat_infiltration_difficulty_add$"
 mod_op_cat_infiltration_skill_mult:0 "$mod_op_cat_infiltration_skill_add$"
 
 dmj_flavor.4.name:0 "Resource Reallocation"
 dmj_flavor.4.desc:0 "Our officials have recently noticed a concerning dip in our mineral income. Apparently, $NAME_dmj_daniel$ has been siphoning resources from our national supply, for an unknown reason. When questioned about the matter, $dmj_daniel_SECOND_NAME$ claimed the resources were for a 'little side project' of his. Whatever this side project of his is, it is clearly not 'little', as the amount of minerals siphoned for it is quite large, enough to construct a capital building. This has concerned many of our officials, who are now on high alert."
 dmj_flavor.40.name:0 "Definitely Not Little"
 dmj_flavor.40.desc:0 "$NAME_dmj_daniel$'s 'little side project' has been completed, and we were correct about it not being 'little' in any since of the word. $dmj_daniel_SECOND_NAME$ has unveiled a massive cathedral on [dmj_event_temple_planet.GetName], where his followers may go to worship the divine. How a building so massive could go unnoticed by our government is a mystery. Perhaps $dmj_daniel_SECOND_NAME$ used his powers to cloak it somehow. With a dedicated temple for worshippers, we can expect to see $dmj_daniel_SECOND_NAME$'s power grow significantly. Whether this is a good or bad thing is yet to be determined."
 dmj_reinhardist_temple:0 "$dmj_daniel_SECOND_NAME$ist Cathedral"
 dmj_reinhardist_temple_desc:0 "A vast and elaborate complex where devotees of $NAME_dmj_daniel$ go to strengthen him through worship."
 job_reinhardist_devotee:0 "$dmj_daniel_SECOND_NAME$ist Fanatic"
 job_reinhardist_devotee_plural:0 "$dmj_daniel_SECOND_NAME$ist Fanatics"
 job_reinhardist_devotee_desc:0 "Followers of $NAME_dmj_daniel$, who have essentially devoted their entire lives to worshipping him."
 job_reinhardist_devotee_effect_desc:0 "£job_reinhardist_devotee£ $job_reinhardist_devotee_plural$ produce £dmj_sr_devotion£ §Y$dmj_sr_devotion$§!, which translates into £unity£ §Y$unity$§!, £energy£ §Y$energy$§!, £sr_zro£ §Y$sr_zro$§!, and £astral_threads£ §Y$astral_threads$§!."
 mod_job_reinhardist_devotee_add:0 "$job_reinhardist_devotee$ Jobs"
 mod_job_reinhardist_devotee_per_pop:0 "§G+1§! $job_reinhardist_devotee$ per $VALUE$ Pops"
 mod_job_reinhardist_devotee_per_pop_short:0 "\n§G+1§! £mod_job_reinhardist_devotee_add£ per $VALUE$ £pop£"
 
 dmj_flavor.5.name:0 "A [dmj_event_devotee.DmjGetLeaderTitle]'s Devotion"
 dmj_flavor.5.desc:0 "Reports are coming in claiming that [dmj_event_devotee.DmjGetLeaderTitle] [dmj_event_devotee.GetName] has formally declared their conversion to Reinhardism. [dmj_event_devotee.GetSheHe] claims that [dmj_event_devotee.GetSheHe] has been practicing $dmj_daniel_SECOND_NAME$'s commandments in secret, and now feels comfortable publicly declaring [dmj_event_devotee.GetHerHis] faith. Unfortunately, many of the beliefs [dmj_event_devotee.GetName] claims to practice seem counterproductive to a leadership role. Additionally, many of [dmj_event_devotee.GetHerHis] subordinates have also declared their conversion alongside [dmj_event_devotee.GetHerHim], which will likely result in a large increase in $dmj_daniel_SECOND_NAME$'s power. Whether this is a good or bad thing is yet to be determined."
 dmj_random_negative_trait:0 "[dmj_event_devotee.DmjGetLeaderTitle] [dmj_event_devotee.GetName] gains a random negative trait."
 
 dmj_flavor.6.name:0 "Ultimate Sacrifice"
 dmj_flavor.6.desc:0 "Troubling reports have just come in from the planet of [dmj_event_sacrifice_planet.GetName]. It appears that a large group of [owner.GetAdj] citizens on the colony have participated in some sort of ritual sacrifice. Our scanners detect no life signs in the affected individuals, and they appear to be in a permanent catatonic state. Every recorded casualty of this event has been determined to be a member of the [dmj_event_sacrifice_faction.GetName], indicating that $NAME_dmj_daniel$ was behind this. When questioned about the incident, $dmj_daniel_SECOND_NAME$ admitted to being responsible, simply claiming he 'needed some extra juice'."
 dmj_flavor.6.a:0 "That fiend!"
 
 dmj_flavor.7.name:0 "$dmj_daniel_SECOND_NAME$ist Agitation"
 dmj_flavor.7.desc:0 "Reports are coming in discussing a recent political movement within the [dmj_event_agitation_faction.GetName]. It appears that several influential members of the faction have began to express disapproval with our government. While they are not calling for seccession or open revolt, they have been relentlessly criticizing our policies and the way we run things. This has caused many of the [dmj_event_agitation_faction.GetName]'s members to become disillusioned with our government, and many members have been vehemently expressing their disapproval. It will take some time before we will be able to regain their trust."
 dmj_flavor.7.effects:0 "The [dmj_event_agitation_faction.GetName] will have §R-15%§! approval for the next 10 years."
 
 #Leader Revival Events
 
 dmj_leader.2.name:0 "$dmj_daniel_SECOND_NAME$ Returns"
 dmj_leader.2.desc:0 "It seems that death was not enough to get rid of $NAME_dmj_daniel$, as he has returned to us after only a few short years. He claims that he was able to separate his soul from his body in order to survive, and spent the last few years forming a new body with the matter available to him. If this is true, then this means that $dmj_daniel_SECOND_NAME$ may be functionally immortal. Whatever the case, our officials are glad to see him return to the fold."
 
 dmj_leader.4.desc:0 "§HOur translation algorithms take a moment to begin processing the man's dialect, as it seems he does not possess a personal translator.§!\n\nAh, looks like I've finally found someone! Great! Let's get started!"
 dmj_leader.4.a:0 "Who are you?"
 dmj_leader.4.a.response:0 "Oh, sorry, I guess I was just hyped to finally find someone to work for. Name's $NAME_dmj_daniel$. Powerful psychic, former ruler of a primitive civilization, and a very good administrator, if I do say so myself. I've been looking for someone to work for ever since I got out of that prison, and lucky me, I came across you!"
 dmj_leader.4.b:0 "You were imprisoned?"
 dmj_leader.4.b.response:0 "Yeah, by a psychic on my homeworld. I tried to unify my planet, but I was met with resistance, and the rest is history. I got freed eventually, by another alien civilization, but they didn't want me, so now I travel the galaxy looking for powerful empires to serve. Now, how about we get this show on the road already?"
 
 #Misc Events
 
 dmj_misc.1.name:0 "$NAME_dmj_daniel$"
 dmj_misc.1.desc:0 "Yeah? What do you need?"
 dmj_misc.1.a:0 "We require your skills as a §Y$subclass_commander_governor$§!."
 dmj_misc.1.b:0 "We require your skills as a §Y$subclass_official_delegate$§!."
 dmj_misc.1.c:0 "We require your skills as a §Y$subclass_official_economy_councilor$§!."
 dmj_misc.1.d:0 "We require your abilities on the battlefield."
 dmj_misc.1.back:0 "Nevermind."
 
 dmj_misc.21.desc:0 "After a period of mounting tension, the unrest on §Y[Root.GetName]§! has resulted in terrorist action. While casualties and property damage were minimal, faith in the [Root.Owner.GetName]'s ability to protect its citizens has been shaken."
 dmj_misc.22.desc:0 "A major incident has occurred on the badly-troubled colony of §Y[Root.GetName]§!. While state-critical facilities remain unscathed, extensive property damage and significant loss of life as a result of coordinated terrorist attacks have shaken the colony to its core."
 dmj_misc.23.desc:0 "Reports from §Y[Root.GetName]§! suggested that there was an imminent risk that violent rioting would break out. However, thanks to the quick and decisive action of [Root.Owner.GetAdj] forces, in partnership with loyalist civilians, this threat has been quelled."
 
 dmj_misc.7.name:0 "Coronation of the [Root.GetRulerTitle]"
 dmj_misc.7.desc:0 "The demands of the [TargetFaction.GetName] have been heard, and, at long last, we have chosen to fully embrace the faction, adopting $NAME_dmj_daniel$'s core values and polices. Additionally, we have decided that it is only right to declare $dmj_daniel_SECOND_NAME$ himself the eternal sovereign of our empire. Such a radical shift in government warrants a new name as well. We are now the [Root.GetName], and we shall stand, unbreakable, under the rule of our [Root.GetRulerTitle]."
 
 dmj_misc.8.name:0 "[TargetFaction.Owner.GetRulerTitle] crowned in the [TargetFaction.Owner.GetName]"
 dmj_misc.8.desc:0 "An immensely powerful psychic named $NAME_dmj_daniel$ has seized control of the state apparatus of the [TargetFaction.Owner.GetName]. Following a long period of growing support for the §Y[TargetFaction.GetName]§!, the §Y[TargetFaction.Owner.GetName]§! has finally embraced the faction, adopting their core values and policies. As a result of bringing this faction into their government, they have become fanatically religious and authoritarian, seeking to extend their [TargetFaction.Owner.GetRulerTitle]'s rule over the entire galaxy. Time will tell if these ambitions will succeed."
 dmj_misc.8.a:0 "A significant development."
 
 dmj_misc.12.name:0 "$NAME_dmj_daniel$"
 dmj_misc.12.desc:0 "§HOur translation algorithms take a moment to begin processing the man's dialect, as it seems he does not possess a personal translator.§!\n\nFinally! It's been so long since I've had someone to talk to other than those stupid Sentinels. I mean, it's not like those guys were up for conversation anyways, even though they're technically me. Anyways, thanks for getting me out of there. I don't even know how long it's been since they imprisoned me in that place. I would offer to work for you, but you aren't... exactly my type. I'll have to go find someone else, but again, I appreciate the help."
 dmj_misc.12.gestalt:0 "Is our mind not vast enough for you?"
 dmj_misc.12.gestalt.response:0 "Yeah... you see that's the thing, it's a bit too vast. I kind of need single-minded organisms for this to work, sorry."
 dmj_misc.12.purifier:0 "Indeed. Begone, xeno scum."
 dmj_misc.12.purifier.response:0 "Wow, rude! Fine, if that's how you wanna be, then I don't want to help you anyways!"
 dmj_misc.12.swarm:0 "Prey..."
 dmj_misc.12.swarm.response:0 "...I'm... just gonna leave. You guys are weird."
 dmj_misc.12.terminator:0 "<< Organic detected. Commencing extermination protocols. >>"
 dmj_misc.12.terminator.response:0 "Well... that doesn't sound good. I think I'll spare you the trouble and just dip, okay?"
 
