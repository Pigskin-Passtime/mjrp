 dmj_daniel_desc:0 "Former God-Emperor of a primitive civilization, who was defeated and banished to a psionic prison. He claims to be able to assist us in management of our empire."
 dmj_daniel_catch_phrase:0 "Real power comes from making people fear and love you at the same time. Let me help you find that balance."
 
 leader_trait_devotion_conduit:0 "Conduit of Willpower"
 leader_trait_devotion_conduit_desc:0 "This leader has discovered a way to exploit the Shroud for their own benefit. They gain greater power the more people devote their willpower to them, through collective worship, or some other means."
 leader_trait_devotion_conduit_effects:0 "Produces monthly £unity£ £energy£ £sr_zro£ £astral_threads£ based on a new resource: £dmj_sr_devotion£ §Y$dmj_sr_devotion$§!.\n\nMonthly Resources per 1 £dmj_sr_devotion£ §Y$dmj_sr_devotion$§!:\n\t£unity£ §Y$unity$§!: §G+0.5§!\n\t£energy£ §Y$energy$§!: §G+0.5§!\n\t£sr_zro£ §Y$sr_zro$§!: §G+0.05§!\n\t£astral_threads£ §Y$astral_threads$§!: §G+0.05§!\n\nCurrent £dmj_sr_devotion£ $dmj_sr_devotion$: §G+[Root.Owner.dmj_devotion_value]§!"
 
 leader_trait_devotion_conduit_milship:0 "$leader_trait_devotion_conduit$"
 leader_trait_devotion_conduit_milship_desc:0 "$leader_trait_devotion_conduit_desc$"
