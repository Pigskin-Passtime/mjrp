l_english:

 situation_song_of_flesh: "The Song of Flesh"
 situation_song_of_flesh_type: "The Song of Flesh"
 situation_song_of_flesh_desc: "An epidemic of unpredicatable mutations has broken out accross the galaxy and reports of hearing strange noises have been on the rise among our population. As such, efforts have begun to try and identify the source of these sounds and find a solution to these debilitating mutations."




 situation_fleshsong_noconcern: "Ignore it"
 situation_fleshsong_noconcern_desc: "This is of no conern."
 situation_fleshsong_embrace: "Encourage it"
 situation_fleshsong_embrace_desc: "This could be an oppurtunity."
 situation_fleshsong_fix_it: "Treat it"
 situation_fleshsong_fix_it_desc: "We must remedy this immediately."
 situation_fleshsong_robot_fix_it: "Purge it"
 situation_fleshsong_robot_fix_it: "We must rid ourselves of this blight."

####################################################
### SONG OF FLESH NEWS EVENTS
####################################################

 fleshsong.002.name: "The Day of Lethargy"
 fleshsong.002.desc: "Widespread reports of mental lethargy and the sound of a distant tune growing louder have flooded our administration. Even those free of any mutation have started reporting similar experiences in the last couple of days, with those affected reporting a feeling of being drained of energy."
 fleshsong.002.A: "Alarming"

 fleshsong.003.name: "A Departure of Song"
 fleshsong.003.desc: "Citizens report feelings of extreme lethargy as though completely drained of energy, with those who experienced muations being affected to an even greater degree. But, across our country and across the galaxy, things have gone quiet. The tune, whatever it may have been, is gone. And we have been left to continue our own endeavours in its wake."
 fleshsong.003.A: "Understood"

 fleshsong.004.name: "Usurper"
 fleshsong.004.desc: "A great prescence has erupted into the Shroud, much to the alarm and surprise of our telepaths. But they were not its target. The entity quickly shot off, lauching a vicious attack on another of its kind and attempting to tear them asunder. The ensuing battle was as brutal as it was brief, with the instigator being rapidly beaten back by the overwhelming power of its target. Defeated and severely injured the entity beat a hasty retreat, disappearing far off into the Shroud to a fate unknown and leaving a familiar tune in its wake."
 fleshsong.004.A: "Understood"

####################################################
### SITUATION STAGE EVENTS
####################################################
 #reject the song
 fleshsong.010.name: "Precautionary Measures"
 fleshsong.010.desc: "Whilst the precise cause of the mutations and emergencies occuring within some of our facilities eludes us, hightened security measures and improved screening processes to filter out unusual materials have helped reduce the frequency of these incidents."
 fleshsong.010.A: "Understood"
 fleshsong.011.name: "Methods of Detection"
 fleshsong.011.desc: "Our scientists have made significant progress in developing simple tools that emit specific frequencies which elict a reaction from anomalous body material. This allows for potential mutations to be identified in their early stages and for the appropriate procedures to be undertaken. Attention is now focused soley on the development of a cure for those worst affected."
 fleshsong.011.A: "Excellent"
 fleshsong.012.name: "Restoring Quiet"
 fleshsong.012.desc: "At last a breakthrough has been made. Whilst the origin of this accursed blight remains a mystery, our efforts to combat it have ploughed on and finally borne. By using an array of sonic pylons that responsate at a particular wavelength we are able to render our bodies tunally inert while undergoing the gene editing process. This approach, whilst disorienting for its patients, acts as both a preventative measure and a cure. Whatever the cause of these strange events may be, in the end it has proven no match for our own prowess."
 fleshsong.012.A: "Let us be rid of this curse."
 
 #embrace the song
 fleshsong.020.name: "Murmurings"
 fleshsong.020.desc: "Efforts to establish the source of this noise have largely remained unfruitful. However, we have ascertained that all these peices of sound fit together into a much larger melody. It is at once irrefutably familiar yet impossible to place and it is undoubtedly related to the widespread mutations occuring across the galaxy. If only we could coax more of the tune out and make full use of these anomalous changes."
 fleshsong.020.A: "Intruiging"
 fleshsong.021.name: "A Tune of Old"
 fleshsong.021.desc: "Certainty has gripped those researching the tune. Its gifts are the key to unlocking the secrets of this melody. By encouraging the widespread use of gene editing technology we can gain even more insight and bring ourselves closer to this wonderous, magnificent tune. We are on the very precipice of undertanding! It calls to us..."
 fleshsong.021.A: "...and we must answer."
 fleshsong.022.name: "The Song of Flesh"
 fleshsong.022.desc: "The veil is pierced, we now hear the song in all its splendor with renewed clarity! §YThe Song of Flesh§! speaks its name and whispers of vengence against its brother. But for that it requires power, power we have willing granted it and power it has stolen from the unwilling and unfaithful. We are now one with the tune, our bodies in harmony, as we sing the song the flesh cries out our name."
 fleshsong.022.A: "We are blessed!"

####################################################
### SITUATION MONTLY EVENTS
####################################################
 fleshsong.101.name: "Possessed Flesh"
 fleshsong.101.desc: "In the early hours of the morning an explosion rocked one of our cloning facilities. It seems a vat of biomass within the facility ruptured, spewing forth a tide of flesh that carried with it horrific amalgamations that had, unknown to us, been growing within. They quickly overran the facility and conflict has broken out between them and our armed forces."
 fleshsong.101.A: "Disturbing"
 fleshsong.102.name: "Genetic Mishap"
 fleshsong.102.desc: "Local authorities have reported an incident at one of our healthcare facilities. A patient undergoing gene theraphy experienced a series of rapid, aggressive mutations and proceeded to attack other patients and members of staff. Causing significant damage to the facility in the process. Armed forces stationed nearby have already started to engage the threat."
 fleshsong.102.A: "Disturbing"

 fleshsong.201.name: "More Mutations"
 fleshsong.201.desc: "We've recieved new reports of mutations among our population, with many similarities to those being experienced elsewhere in the galaxy. We must press on and find a solution to this epidemic."
 fleshsong.201.A: "Understood"

