l_french:
# wp02_l_french
# By bpainecraft

#MJ requirements
 wp02_allowed:0 "§GWP-02 Allowed§!"
 wp02_disabled:0 "§RWP-02 Disabled§!"
 spawn_wp02:0 "Spawn §YWP-02§!"
 wp02_tooltip:0 "Cinzi Test Range Weapons Platform Asset ID-02 is a powerful weapons research station.\n\nPerhaps your empire could benefit from the station and its weapons and event find out more about the empire that built it."

#System names
 wp02_system_name_1:0 "Cinzi"
 wp02_system_name_2:0 "Arcsan"
 
#Event names and descriptions
 wp02event.1.name:0 "Strange Station"
 wp02event.1.desc:0 "A survey of Cinzi III has revealed a strange station in orbit which appears heavily armed and currently dormant. Additionally, sensor sweeps show a cloud of debris surrounding the station. We may find some valuable technology onboard."

 wp02event.2.name:0 "Station Explored"
 wp02event.2.desc:0 "While exploring the station, we have discovered a complex computer near the stations reactor. It appears that the computer syphons power straight from the reactor to power an advanced AI. Our scientists believe this AI could have knowledge of advanced scientific data and would like to activate it."
 wp02event.3.name:0 "Station scraped"
 wp02event.3.desc:0 "While dismantling the station, we have found a complex computer from near the stations reactor. It appears that the computer syphoned power straight from the reactor to power an advanced AI. Our scientists believe this AI could have knowledge of advanced scientific data and would like to activate it."

 wp02event.5.name:0 "Core Destroyed"
 wp02event.5.desc:0 "As soon as the AI is removed, an automated self destruct system activates. Our crews were able to escape with the materials already collected before the station exploded, however the computer, along with anything worth scavenging, have been reduced to dust."
 wp02event.10.name:0 "The AI speaks"
 wp02event.10.desc:0 "We have managed to reactivate the AI. It calls itself the Cinzi Test Range Weapons Platform Asset ID-02, but allows us to call it §YWP-02§!.\n\nIt takes a few minutes for the AI to decipher our language but when it does it grants us full access to its systems, reporting that it must fulfill its purpose."

#
 wp02event.20.name:0 "Inadequate Missiles"
 wp02event.20.desc:0 "WP-02 has reviewed our weapons and manufacturing capability and determined that while we are currently incapable of creating the munitions required to rearm WP-02, with some assistance from our researchers they could redevelop the technology required. They do warn that the original research was costly and the creators had a technological and economical advantage when creating it, but they believe that their database and stockpile of reserve munitions to reverse engineer will make up for these issues."

 wp02event.21.name:0 "Fragmented Formulas"
 wp02event.21.desc:0 "WP-02 has reviewed the research data from their database and has noticed portions of certain formulas are missing. They have concluded that this is part of the security protocols put in place by the Arcsan Commonwealth. We could try to circumvent these protocols, at the risk of being locked out of the database entirely, or we can proceed without the data."

 wp02event.22.name:0 "Locked Out"
 wp02event.22.desc:0 "During our attempts to bypass WP-02's security we triggered another failsafe which locked down all classified files, including weapons research and blueprints. We managed to download the data we already had access to, but we will have to work out the formula without Arcsan data now." #Future projects are slower
 wp02event.23.name:0 "Security Bypassed"
 wp02event.23.desc:0 "We have managed to decipher the encryption keys and have unlocked full access to WP-02's database which not only included the missing missile formulas, but also data on sensor technologies and advanced armour. This information could keep our researchers busy for years."

 wp02event.24.name:0 "Slow Progress"
 wp02event.24.desc:0 "WP-02 has made small breakthroughs with the development of the new missiles, but progress has been slow without the full formulas."

 wp02event.25.name:0 "Breakthrough"
 wp02event.25.desc:0 "WP-02 has finally figured out the formulas required for the Phase Matter Converter. This breakthrough is sure to speed up the research and development process."

 wp02event.26.name:0 "First activation"
 wp02event.26.desc:0 "After much work from WP-02, a Phase Matter Converter of [Root.Owner.GetName] design is now able to be activated. Final preparations are being made however there is still some uncertainty between some of the project's personal about weather the device is ready, citing concerns with the manufacturing quality of some of the parts."

 wp02event.27.name:0 "Success"
 wp02event.27.desc:0 "Despite Concerns, the Phase Matter Converter has functioned perfectly and our engineers are ready to help fit the devices to missiles for a final test. Should this succeed, we will be able to outfit our ship with these missiles which are capable of passing through matter."
 wp02event.28.name:0 "Failure"
 wp02event.28.desc:0 "The test of the phase matter converter ended abruptly, the devices phase emitters fusing together, phasing out of our reality before instantly returning inside the power relay. The device was destroyed in the explosion that followed, we will have to rebuild it before we can continue testing."
 wp02event.29.name:0 "Belayed Success"
 wp02event.29.desc:0 "We have checked the device, ensuring the parts used are of high quality and have tested it with a perfect success, albeit a few weeks behind schedule. Our engineers are ready to help fit the devices to missiles for a final test. Should this succeed, we will be able to outfit our ship with these missiles which are capable of passing through matter."
 
 wp02event.30.desc:0 "We have rebuilt the device, ensuring the parts used are of high quality and have tested it with a perfect success, albeit months behind schedule. Our engineers are ready to help fit the devices to missiles for a final test. Should this succeed, we will be able to outfit our ship with these missiles which are capable of passing through matter."

 wp02event.31.name:0 "Big Missiles"
 wp02event.31.desc:0 "As suggested my WP-02, we have redeveloped the technology that allows it's missiles to phase through the armour of enemy vessels. Final tests have been a resounding success and we are ready to outfit our ships with these marvels of weapons research."

#
 wp02event.40.name:0 "Message from WP-02"
 wp02event.40.desc:0 "WP-02 has been stuck in Cinzi for as long as they have known. With our recent breakthrough with battleship technology, they believe that we could help build a ship that would allow them to escape the confines of the system. Adding that the ability to move would provide a significant tactical advantage."

 wp02event.41.name:0 "Two Plans"
 wp02event.41.desc:0 "WP-02 has been working with our engineers and has found themselves at an impasse. Trying to fit engines and hyperdrive equipment to WP-02 is going to be difficult, as WP-02 was not designed to move, and they will likely be slower than the rest of the fleet. Alternatively, we could move WP-02 to a battleship of our own design, however this ship would have less capacity for weapons and armour than WP-02. WP-02 has calculated no tactical advantage to either method and has allowed us to make the decision."

 wp02event.42.name:0 "New Engines"
 wp02event.42.desc:0 "WP-02 has had new engines fitted and is ready to move. One of our engineers has suggested that we hold a celebration with WP-02 at our capital."
 wp02event.43.name:0 "A New Body"
 wp02event.43.desc:0 "We have created a new battleship according to the designs provided by WP-02 and are getting ready to transfer WP-02's consciousness to the new ship. Once the process is complete the station will be left unusable, we could scrap it, however there may be more to find onboard now that we don't have to worry about damaging it in our exploration."

 wp02event.44.name:0 "Transfer Complete"
 wp02event.44.desc:0 "WP-02 has been moved to the battleship and is ready to take flight. One of our engineers has suggested that we hold a celebration with WP-02 at our capital."

 wp02event.45.name:0 "A Great Celebration"
 wp02event.45.desc:0 "WP-02 has reached [Root.Capital.GetName] and the celebration of their and our new power has been a great one. WP-02 has reported they look forward to serving us and believe the celebrations have had a great effect on the [Root.Owner.GetName]."

#
 wp02event.50.name:0 "Phasing Station"
 wp02event.50.desc:0 "The crew on one of our stations has reported that parts of the station are phasing out of our reality for short periods at a time. The are requesting help from WP-02 in order to track down the cause of the phasing so they can put a stop to it."

 wp02event.51.name:0 "Culprit Discovered"
 wp02event.51.desc:0 "With help from WP-02's sensor equipment, we have managed to find the cause of the strange behavior on our station. One young engineer has decided to fit a modified Phase Matter Converter from a missile onto the station, intending to allow the device to be used as a defensive mechanism on the station. WP-02 agrees that the idea is sound and with some refinement, could become standard across all our stations. They are requesting to use the station to experiment with the concept."

 wp02event.52.name:0 "Phase Converters Removed"
 wp02event.52.desc:0 "It has taken some time, but the Phase Matter Converter has been removed and all station operations have returned to normal."
 wp02event.53.name:0 "Interesting Results"
 wp02event.53.desc:0 "During our preliminary experiments, WP-02 has made a discovery. While the Phase Matter Converters are designed to temporarily remove matter from our physical plane, they are also capable of stabilizing it within our reality."

 wp02event.54.name:0 "A New Device"
 wp02event.54.desc:0 "WP-02 has designed a new building for our stations and are requesting that it be prepared for a full range of tests. They are claiming that it should greatly increase the strength of the stations armour but will require a lot of energy to run the tests."

 wp02event.55.name:0 "Better Than Expected"
 wp02event.55.desc:0 "The Large Phase Matter Converter has been built on one of our stations and while initial tests showed adequate performance from the device, WP-02 was able to provide a sizeable improvement to the effectiveness of the device, providing more armour and improving the armours resilience. The improved Large Phase Matter Converter is ready to be installed at any station with room for an extra building."

#
 wp02event.60.name:0 "Wormhole in Cinzi"
 wp02event.60.desc:0 "Our sensors have alerted up to a wormhole opening up in cinzi. We have relayed this information to WP-02 who has requested that they be posted at the edge of the wormhole until it finishes its formation."

 wp02event.61.name:0 "A Ship Emerges"
 wp02event.61.desc:0 "As soon as the wormhole had finished forming, a new ship emerged. §HWP-01.§! We understand that WP-02 has been in communication with WP-01 since it arrived, however we have been unable to keep up with the communication."

 wp02event.62.name:0 "Shots Fired"
 wp02event.62.desc:0 "WP-01 has fired upon WP-02, the first strike missing the ship and instead, hitting Cinzi III destroying it entirely. We must send in reinforcements immediately."

 wp02event.63.name:0 "WP-02 Escapes"
 wp02event.63.desc:0 "We were too slow getting reinforcements to Cinzi, WP-02 was forced to use an emergency FTL jump to escape. WP-01 is still in Cinzi and must be disabled before they destroy another planet."

 wp02event.64.name:0 "WP-01 Destroyed"
 wp02event.64.desc:0 "We managed to reach Cinzi and disable WP-01. However moments later the ship self destructed. We still don't know why WP-01 attacked and haven't received any communications from WP-02."

 wp02event.65.name:0 "WP-02 Enters the Wormhole"
 wp02event.65.desc:0 "We have yet to hear from WP-02, however reports are coming in that they have entered the wormhole. We should follow and find out what is happening."

 wp02event.66.name:0 "Arcsan"
 wp02event.66.desc:0 "Having followed WP-02 through the wormhole in Cinzi we have discoverd a new system. §HArcsan§!, the home system of WP-02's creators, appears decrepit with decaying structures scattered across the system. We will need to do a thorough survey of the system to find WP-02." #Habitat, *Orbital Rings, Science Nexus and *Mega Shipyard + *Ecumenopolisis

 wp02event.67.name:0 "Arcsan Orbital Habitats" #If missing MegaCorp, Federations or Overlord
 wp02event.67.desc:0 "Arcsan has a series of orbital structures throughout the system. While they are severely damaged by time there could be something to learn from them. We still have yet find WP-02 or any other signs of intelligent life."
 wp02event.68.name:0 "Arcsan Home World"
 wp02event.68.desc:0 "We have found what was once the home world of the Arcsan people. Its cities are crumbling and the wildlife of the planet is reclaiming the surface. We still have yet find WP-02 or any other signs of intelligent life."
 wp02event.69.name:0 "Arcsan Science Nexus"
 wp02event.69.desc:0 "Orbiting one of the gas giants near the outer edge of the system is a decaying science nexus. While we could likely learn a lot from the structure, its systems have not functioned for a long time. We still have yet find WP-02 or any other signs of intelligent life."
 wp02event.70.name:0 "Arcsan Rural Worlds"
 wp02event.70.desc:0 "The planets near Arcsan Prime have evidence that they were once inhabited, providing food, energy and minerals to the home world. While the wildlife that was imported to these planets is thriving, we still have yet find WP-02 or any other signs of intelligent life."
 wp02event.71.name:0 "Arcsan Mega Shipyard" #If has Federations
 wp02event.71.desc:0 "Arcsan has a massive shipyard in orbit of the largest star with a series of orbital structures throughout the system. While the structures are severely damaged by time there could be something to learn from them. We still have yet find WP-02 or any other signs of intelligent life."
 wp02event.72.name:0 "Arcsan Home World" #If has Overlord
 wp02event.72.desc:0 "We have found what was once the home world of the Arcsan people. Its cities are crumbling is crumbling and the wildlife of the planet is reclaiming the surface. In orbit is a massive ring, once home to refineries and defensive weapons is now devoid of any usable installations. We still have yet find WP-02 or any other signs of intelligent life."

 wp02event.73.name:0 "A Faint Signal"
 wp02event.73.desc:0 "We have finally detected what we believe is the energy signature of WP-02 in the far reaches of the system. It has been recommended that we approach with great care."

 wp02event.74.name:0 "A Message"
 wp02event.74.desc:0 "Upon reaching WP-02, we received a message, requesting that we leave the Arcsan System and destroy the wormhole. This was the only communication we received before our communications with WP-02 were jammed." #Very well, We need answers first, out of the question

 wp02event.75.name:0 "Wormhole Closed"
 wp02event.75.desc:0 "While trying to close the wormhole, we detected a short energy pulse from Arcsan's star. We have since discovered that the entire system has been destroyed, along with anyone inside. We have received one final communication from just before the explosion." #End of the chain
 wp02event.76.name:0 "A Message"
 wp02event.76.desc:0 "We have made our intent clear, we will not leave until we have answers as to what happened, both here in Arcsan and in Cinzi with WP-01. A data packet was sent in return, encrypted with a security key well beyond anything we have seen. Following this, WP-02s weapons powered up. We could stay and fight but it is unlikely we will gain anything from it." #Goes to close wormhole
 wp02event.77.name:0 "Nothing"
 wp02event.77.desc:0 "We have made our intent clear, we will not abandon WP-02 in this system. Nothing has happened yet, but it is obvious that they received our message."

 wp02event.78.name:0 "A Response"
 wp02event.78.desc:0 "WP-02 has finally set us a response to our message. They will continue to serve us, under the condition that we destroy the wormhole, as initially requested, and never speak of the event that occurred at Cinzi ever again."
 wp02event.79.name:0 "Contact Lost"
 wp02event.79.desc:0 "After giving the order to attack we lost communication with all our ships within the Arcsan system, with the system destabilizing and exploding mere moments later."

 wp02event.80.name:0 "Tricked"
 wp02event.80.desc:0 "We have finally deciphered the encryption key for the encoded data packet WP-02 sent us. decrypting the message we found one word, repeated over and over again. §P"Sorry"§!"
 wp02event.81.name:0 "Wormhole Closed"
 wp02event.81.desc:0 "While trying to close the wormhole, we detected a short energy pulse from Arcsan's star. We have since discovered that the entire system has been destroyed, along with anyone inside. WP-02 thanks us for our assistance and states that they look forward to continuing their work with us, researching new technologies."

 wp02event.82.name:0 "A Gift"
 wp02event.82.desc:0 "The final communication we received from Arcsan was from WP-02. The designs for a larger missile, more powerful, possibly even a little excessive. This is the weapon that destroyed Cinzi III's moon, and the final gift from WP-02."

 wp02event.83.name:0 "A Gift"
 wp02event.83.desc:0 "WP-02 has a gift for us. The designs for a larger missile, more powerful, possibly even a little excessive. This is the weapon that destroyed Cinzi III's moon, and the prize idea of WP-02."
 
 

