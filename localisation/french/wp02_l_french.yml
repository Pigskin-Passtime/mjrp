#Special projects
 wp02_search_project:0 "Search the station"
 wp02_search_project_DESC:0 "An old station has been found in orbit of Cinzi III. We should search the station to find out what happened to is and see if any of the technology could benefit us."
 wp02_scrap_project:0 "Scrap the station"
 wp02_scrap_project_DESC:0 "An old military station has been found in orbit of Cinzi III which is too dangerous to be left intact. We should dismantle it, carefully."

 wp02_power_ai_project:0 "Activate the AI" 
 wp02_power_ai_project_DESC:0 "We have discovered a complex computer near the stations reactor. Our scientists believe could contain advanced scientific data and would like to activate it."
 wp02_destroy_ai_project:0 "Purge the AI"
 wp02_destroy_ai_project_DESC:0 "We have discovered a complex computer near the stations reactor that may house an artificial intelligence. We should purge it before it reactivates."

#
 wp02_reverse_engineer_1:0 "Comb the Database"
 wp02_reverse_engineer_1_DESC:0 "WP-02 has important information in their database and needs some time to collect it all in order to start work on creating the weapons designs"

 wp02_hack_the_database:0 "Bypassing Security"
 wp02_hack_the_database_DESC:0 "Some of the information in WP-02's database is encrypted behind Arcsan Commonwealth firewalls. We could try to bypass the firewalls, however if we fail we may be locked out."

 wp02_reverse_engineer_2:0 "Developing Missiles"
 wp02_reverse_engineer_2_DESC:0 "Our WP-02 has started work on the missiles based of the data we could get from WP-02."

 wp02_reverse_engineer_3:0 "Reverse Engineering a Formula"
 wp02_reverse_engineer_3_DESC:0 "Our WP-02 is working on figuring out the formula so we can resume development on the missiles."

 wp02_reverse_engineer_4:0 "Phase Matter Converter"
 wp02_reverse_engineer_4_DESC:0 "With access the the full formula for phase matter conversion, our engineers can build a prototype for testing."

 wp02_reverse_engineer_5:0 "Checking the Device"
 wp02_reverse_engineer_5_DESC:0 "While it may take a little longer, by doing a quality check on the parts, we can ensure the functionality of the Phase Matter Converter."
 wp02_reverse_engineer_6:0 "Rebuilding the Device"
 wp02_reverse_engineer_6_DESC:0 "Rebuilding the device a second time will be faster, however doing so is still going to take a few months."

 wp02_reverse_engineer_7:0 "Engineering Phase Missiles"
 wp02_reverse_engineer_7_DESC:0 "With the prototype Phase Matter Converter functional, we can finally start developing a missile that can utilize a cost-effective version of the technology."

#
 wp02_make_mobile_1:0 "Developing a Plan"
 wp02_make_mobile_1_DESC:0 "WP-02 is a complex and specialized AI built a platform that was never designed to move. We can't just go strapping engines to the platform, and creating a ship that can support the AI will take time. We must create a proper plan before we start any work."

 wp02_make_mobile_2:0 "Strapping Engines to WP-02"
 wp02_make_mobile_2_DESC:0 "With a proper plan created, we can start fitting thrusters and a hyperdrive to WP-02. Though the station will remain slower than our own battleships, the extra armour and weapons will hopefully make WP-02 just as effective."
 wp02_make_mobile_3:0 "Creating a New Battleship"
 wp02_make_mobile_3_DESC:0 "With a proper plan created, we can start construction of a battleship purpose built for WP-02. Though the station would be more powerful than this new ship, the extra maneuverability should hopefully make it just as effective."

 wp02_make_mobile_4:0 "Transferring WP-02"
 wp02_make_mobile_4_DESC:0 "We have prepared the battleship for WP-02 and have started the process to move the AI. However it will be a while before the ship is operational."

 wp02_make_mobile_5:0 "A Celebration"
 wp02_make_mobile_5_DESC:0 "As soon as WP-02 reaches [Root.Capital.GetName], a celebration is to be held. We hope this will be a great day for the [Root.Owner.GetName], celebrating one of our great leaders new life, able to explore the galaxy along side us."

#
 wp02_station_project_1:0 "Finding the Cause"
 wp02_station_project_1_DESC:0 "WP-02 is assisting our crew on [Root.System.GetName] station to find the cause of the phasing. However given the erratic behavior, this may take some time."

 wp02_station_project_2:0 "Removing Phase Converters"
 wp02_station_project_2_DESC:0 "Removing a device that doesn't always exist is  difficult, but we must stop the phasing before something gets broken."
 wp02_station_project_3:0 "Experimenting with Phase Converters"
 wp02_station_project_3_DESC:0 "While the initial implementation of the Phase Matter Converters on [Root.System.GetName] station was less that ideal, WP-02 is working with us to develop a device that will have a positive impact on the stations survivability."

 wp02_station_project_4:0 "Phase Stabilization"
 wp02_station_project_4_DESC:0 "While installing Phase Matter Converters on [Root.System.GetName] station, WP-02 has found that using the devices to make the ship more dense is not only possible, but also currently more effective at increasing the stations survivability and is working to refine the technology to something that could be implemented as a standard design across our stations."

 wp02_station_project_5:0 "A Suite of Tests"
 wp02_station_project_5_DESC:0 "While the device isn't breaking, ensuring that it is working as expected and is effective in increasing the survivability of a station requires testing. This testing may take some time and a lot of energy."

#
 wp02_arcsan_project_1:0 "Sending WP-02 to the Wormhole"
 wp02_arcsan_project_1_DESC:0 "WP-02 has requested to be sent to the wormhole in Cinzi. Given the location of the anomaly, we should let them."

 wp02_arcsan_project_2:0 "Reinforcements Needed"
 wp02_arcsan_project_2_DESC:0 "WP-02 is under attack in the Cinzi system. They will be able to defend themselves for a short time, but will need assistance to win the battle."

 wp02_arcsan_project_3:0 "Reinforcements Needed"
 wp02_arcsan_project_3_DESC:0 "While WP-02 has escaped, we still need to send Reinforcements to Cinzi to disable WP-01."

 wp02_arcsan_project_4:0 "Follow WP-02"
 wp02_arcsan_project_4_DESC:0 "We must follow WP-02 through the wormhole in the Cinzi system."

 wp02_arcsan_project_5:0 "Find WP-02"
 wp02_arcsan_project_5_DESC:0 "WP-02 has to be somewhere in this system, and we must find them. Check near the stars."
 wp02_arcsan_project_6:0 "Find WP-02"
 wp02_arcsan_project_6_DESC:0 "WP-02 has to be somewhere in this system, and we must find them. Check the home world."
 wp02_arcsan_project_7:0 "Find WP-02"
 wp02_arcsan_project_7_DESC:0 "WP-02 has to be somewhere in this system, and we must find them. Check the outer planets."
 wp02_arcsan_project_8:0 "Find WP-02"
 wp02_arcsan_project_8_DESC:0 "WP-02 has to be somewhere in this system, and we must find them. Check the inner planets."
 wp02_arcsan_project_9:0 "Find WP-02"
 wp02_arcsan_project_9_DESC:0 "WP-02 has to be somewhere in this system, and we must find them. Check near the stars."
 wp02_arcsan_project_10:0 "Find WP-02"
 wp02_arcsan_project_10_DESC:0 "WP-02 has to be somewhere in this system, and we must find them. Check the home world."

 wp02_arcsan_project_11:0 "Check the Faint Signal"
 wp02_arcsan_project_11_DESC:0 "We have detected what we believe is WP-02's energy signature and should approach carefully."

 wp02_arcsan_project_12:0 "Close the Wormhole"
 wp02_arcsan_project_12_DESC:0 "As requested by WP-02, we will close the wormhole, as soon as we figure out how to."
 wp02_arcsan_project_13:0 "Cutting Through the Interference"
 wp02_arcsan_project_13_DESC:0 "We need answers. What happened between WP-02 and WP-01 is still a mystery to us, and likely holds the answers to what happened to this system and the Arcsan Commonwealth. We must get a message to WP-02, tell them that we will only leave once we have the truth."
 wp02_arcsan_project_14:0 "Cutting Through the Interference"
 wp02_arcsan_project_14_DESC:0 "We will not leave WP-02 in this system. They are too valuable to leave abandoned in this graveyard. We must get a message to WP-02, tell them that we will only leave with them along side us."

 wp02_arcsan_project_15:0 "Close the Wormhole"
 wp02_arcsan_project_15_DESC:0 "As requested by WP-02, we will close the wormhole, as soon as we figure out how to."

#Event chains
 wp02_event_chain_1_title:0 "Cinzi Abandoned Station"
 wp02_event_chain_1_desc:0 "An old station has been found in orbit of Cinzi III. Though currently dormant, it appears to be extremely powerful and should be handled with care."

 wp02_event_chain_2_title:0 "Reverse Engineering"
 wp02_event_chain_2_desc:0 "WP-02 has reviewed our weapons and manufacturing capability and determined that with some assistance from themselves, we could be capable of using the same weapons they use."

 wp02_event_chain_3_title:0 "Make WP-02 Mobile"
 wp02_event_chain_3_desc:0 "WP-02 wishes to leave Cinzi, citing a tactical advantage as reason, and believes that our recent technological advancements give us the power to do so."

 wp02_event_chain_4_title:0 "Phasing Station"
 wp02_event_chain_4_desc:0 "One of our stations has started phasing out of existence with some strange effects. The stations maintenance team has requested a science team to restore the station to normal operations."

 wp02_event_chain_5_title:0 "Wormhole in Cinzi"
 wp02_event_chain_5_desc:0 "We have spotted a wormhole in Cinzi. WP-02 seems eager to check it out."

#Leader flavor
 wp02_name:0 "WP-02"
 NAME_wp02:0 "WP-02"
 wp02_catch_phrase:0 "§L"Knowledge is power, power is power. Testing protocols resuming."§!"
 wp02_backstory:0 "An AI, created by the Arcsan Commonwealth, Cinzi Test Range Weapons Platform Asset ID-02 was deactivated after an sustaining significant damage. It seems eager to resume testing and restore the weapon that was built so long ago."
 wp02_joins:0 "§Y$wp02_name$§! joins your Empire as a §HLeader§!"

 wp02.1.a:0 "What happened here?"
 wp02.1.a.response:0 "Failure... Loading data files...\n\nEvent, first full fire test of primary weapon. Error, phase matter converters failed, maximum missile velocity. All failsafes ineffective, detonation at end of primary missile tube.\n\n§HThe AI pauses.§!\n\nData missing... No further information."
 wp02.1.b:0 "What can you do for us?"
 wp02.1.b.response:0 "I am Cinzi Test Range Weapons Platform Asset ID-02, created by the Arcsan Commonwealth to create advanced weapon systems and develop military tactics.\n\nI will fulfill my purpose."
 wp02.1.c:1 "Where is Weapons Platform Asset ID-01?"
