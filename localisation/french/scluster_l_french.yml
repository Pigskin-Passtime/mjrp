 scluster.101.name: "$crisis.11.name$" # Subspace Echoes
 scluster.101.desc: "Les $sensor_station_01_plural$ autour de la galaxie détectent de grandes fluctuations soudaines du sous-espace !\n\nNotre [Root.GetScientistPlural] pense qu'il s'agit d'échos causés par une masse énorme - de l'ordre de plus d'une douzaine de systèmes stellaires ! - qui est sur le point d'émerger du sous-espace. Ils rapportent que cette masse émergera en dehors de la galaxie elle-même, ce qui signifie qu'il devrait y avoir peu de danger immédiat de collision stellaire, mais avertissent que nous pourrions ressentir des distorsions temporaires de la réalité à mesure qu'elle émerge." # "$sensor_station_01_plural$ around the galaxy are detecting sudden large subspace fluctations!\n\nOur [Root.GetScientistPlural] believe these are echoes caused by an enormous amount of mass - on the order of over a dozen star systems! - which is about to emerge from subspace. They report that this mass will emerge outside the galaxy itself, meaning there should be little immediate danger of stellar collision, but warn that we may feel temporary distortions in reality as it emerges." # i.e. the game may freeze for a minute while everything spawns

