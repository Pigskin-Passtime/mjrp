# Leader events
  # Before petition if leader is owned
  chronotec_leader.1005.title:0 "$NAME_chronotec_chronolord$"
  chronotec_leader.1005.desc:0 "§HEios is silent, as if somehow you were not able to reach him at this moment.§!"
  chronotec_leader.1005.ask:0 "Is there something we can do for you?"
  chronotec_leader.1005.ask.response:0 "§HThe solemn pause before answering this is unsettling§!\nNot, For now."
  chronotec_leader.1005.close:0 "Close"

  # Recruited, but petition is denied
  chronotec_leader.1010.title:0 "$NAME_chronotec_chronolord$"
  chronotec_leader.1010.desc:0 "§HEios is silent, as if somehow you were not able to reach him at this moment.§!"
  chronotec_leader.1010.close:0 "Close"
  chronotec_leader.1010.ask.about:0 "What will happen with you?"
  chronotec_leader.1010.ask.about.response:0 "§HEios is silent, as if somehow you were not able to reach him at this moment.§!"
  chronotec_leader.1010.ask.planet:0 "What will happen with the planet?"
  chronotec_leader.1010.ask.planet.response:0 "§HEios is silent, as if somehow you were not able to reach him at this moment.§!"
  chronotec_leader.1010.ask.angry:0 "We hope you have not bad feelings about the rejection"
  chronotec_leader.1010.ask.angry.response:0 "§HEios is silent, as if somehow you were not able to reach him at this moment.§!"

  # Recruited, but petition is failed
  chronotec_leader.1020.title:0 "$NAME_chronotec_chronolord$"
  chronotec_leader.1020.desc:0 "§HEios is silent, as if somehow you were not able to reach him at this moment.§!"
  chronotec_leader.1020.close:0 "Close"
  chronotec_leader.1020.ask.about:0 "$chronotec_leader.1010.ask.about$"
  chronotec_leader.1020.ask.about.response:0 "$chronotec_leader.1010.ask.about.response$"
  chronotec_leader.1020.ask.planet:0 "$chronotec_leader.1010.ask.planet$"
  chronotec_leader.1020.ask.planet.response:0 "$chronotec_leader.1010.ask.planet.response$"
  chronotec_leader.1020.ask.sorry:0 "We are sorry for not helping you achieve your goals..."
  chronotec_leader.1020.ask.sorry.response:0 "§HEios is silent, as if somehow you were not able to reach him at this moment.§!"

  # Post planet unveiled
  chronotec_leader.1030.title:0 "$NAME_chronotec_chronolord$"
  chronotec_leader.1030.desc.a:0 "§HEios is messing with some extremely advanced and abstract instrumental, as you contact them.§!\nToday is gonna be a good day for both, i can feel it..."
  chronotec_leader.1030.desc.b:0 "§HEios seems to be enjoying a clear night on its planet, watching constellations while standing alone.§!\nHello, the sky looks promising today and so do all the opportunities we have to unveil!"
  chronotec_leader.1030.desc.c:0 "§HYou can see Eios toying with the Compass.§!\nTime has brought us together, and time will carry us both to incredible moments, and places..."
  chronotec_leader.1030.close:0 "Close"
  chronotec_leader.1030.become.relic:0 "We need your §H$r_chronotec_standard$§! relic"
  chronotec_leader.1030.become.relic.response:0 "It is done, make a good use out of it..."
  chronotec_leader.1030.become.relic.tooltip:0 "Eios will retreat and give us their £unity£ Relic, stopping working as £scientist£ Scientist temporarily"
  #chronotec_leader.1030.become.relic.allow:0 "§RRequires some time after the leader has been converted. Next conversion available at§! §Y[This.chronotec_transformation_timer]§!"
  chronotec_leader.1030.become.leader:0 "We need your services as §H£scientist£ Leader§!"
  chronotec_leader.1030.become.leader.debug:0 "$chronotec_leader.1030.become.leader$"
  chronotec_leader.1030.become.leader.response:0 "It is done, i'm ready to serve."
  chronotec_leader.1030.become.leader.tooltip:0 "Eios will appear as £scientist£ Scientist, and take back their £unity£ Relic"
  #chronotec_leader.1030.become.leader.allow:0 "$chronotec_leader.1030.become.relic.allow$"
  chronotec_leader.1030.powers:0 "Can you tell us about your Chronomantic Powers?"
  chronotec_leader.1030.powers.response:0 "§HEios responds quickly.§!\nI have the power to manipulate time at a local scale, just set me in a governing position whenever you want, and i'll be able to do so..."
  chronotec_leader.1030.relic:0 "Can you tell us about your relic?"
  chronotec_leader.1030.relic.response:0 "§HEios responds quickly.§!\nThe Compass will provide incredible bonuses and restore my power, slowly, if not used.\nIf used, will consume a part of my power to manifest part of an alternative reality on your reality... with all the consequences it could have."
  chronotec_leader.1030.charges:0 "What are the Chronomantic Infusion Charges?"
  chronotec_leader.1030.charges.response:0 "§HEios responds quickly.§!\nTheir are time-energy stored on my own self. Allowing me to retreat with my relic, and not using it, will restore my power slowly, while using the relic or my powers too much will... drain me of them."
  chronotec_leader.1030.changed.corrupted:0 "What can you do now you are Corrupted?"
  chronotec_leader.1030.changed.corrupted.response:0 "§HEios silence gets interrupted with an ominous affirmation.§!\nEVERYTHING...\nI am no longer needing being bound to my relic, so you can have my services and the relic activated together, and my power has increased incredibly... Time will bend to our will!..."
  chronotec_leader.1030.changed.perfected:0 "What can you do now you are Perfected?"
  chronotec_leader.1030.changed.perfected.response:0 "§HEios responds with with a musical, echoing voice.§!\nNow I no longer need any constraint to do my bidding, nor am limited in any regard... Just time is my essence and both me and my Compass are available for your will."

  # Leader taken by other empire but comms are maintained
  chronotec_leader.1040.title:0 "$NAME_chronotec_chronolord$"
  chronotec_leader.1040.desc:0 "§HEios is surprised of our contact.§!\nThanks for contacting me, I am glad we are still on good terms."
  chronotec_leader.1040.why:0 "Why you abandoned us?"
  chronotec_leader.1040.why.response:0 "§HEios tone feels sad.§!\nBecause i had to, just a survival movement, more what i should do, not what i want to do..."
  chronotec_leader.1040.come.back:0 "You are welcome back whenever you want..."
  chronotec_leader.1040.come.back.response:0 "§HEios talks again.§!\nI know, and i would be more than glad to do so, if destiny brings us back together."
  chronotec_leader.1040.bye:0 "Farewell, Eios."

  # Planet is conquered - Farewell to former owner
  chronotec_leader.40100.title:0 "$NAME_chronotec_chronolord$"
  chronotec_leader.40100.desc:0 "§HEios contacts us regarding the loss of their planet.§!\nHello there, i have to inform that... due to the loss of the installations where i have all my instrumental and time-bound elements, we have to temporarily part ways.\nI will continue working with the new owner, until we can find a solution to work all together... As i must do so."
  chronotec_leader.40100.desc.original:0 "§HEios contacts us regarding the loss of their planet.§!\nHello there, i have to inform that... due to the loss of the installations where i have all my instrumental and time-bound elements, we have to temporarily part ways.\nI will continue working with the new owner, until we can find a solution to work all together... As i must do so."
  chronotec_leader.40100.ask.come.back:0 "What we must do in order for you to come back?"
  chronotec_leader.40100.ask.come.back.response:0 "§HEios talks again.§!\nJust retake §HMy planet§! again and we will continue working together as normal.\nI would do it if i could, but without it i would just wither away..."
  chronotec_leader.40100.kind:0 "Will you be fine?"
  chronotec_leader.40100.kind.response:0 "§HEios feels amused and thankful for your worrying.§!\nI will, definitively, but thank you for your kindness...\nI hope we can work together again, soon..."
  chronotec_leader.40100.bye:0 "Farewell, Eios"
  chronotec_leader.40100.bye.original:0 "We will miss you..."

  # Planet is conquered - Hello to new master
  chronotec_leader.40200.title:0 "$NAME_chronotec_chronolord$"
  chronotec_leader.40200.desc:0 "§HEios salutes politely§!\nSeems destiny brought us both to the same place, and as you own my planet now, we are bound to work together if you desire so."
  chronotec_leader.40200.desc.original:0 "§HEios forms what seems like a smile§!\nHello again, old friend. I am really glad we can collaborate together, again."
  chronotec_leader.40200.desc.homicidal:0 "§HEios is intrigued by your presence§!\nBased on what i perceive of you... seems you are not friendly or collaborative at all. I will keep my distance..."
  chronotec_leader.40200.about.you:0 "Tell us about you"
  chronotec_leader.40200.about.you.response:0 "§HEios pauses during some seconds before answering§!\nMy name is Eios, and i was the curator and investigator of the timeline wonder you have just conquered, and i'm bound to it; I understand you may have questions, and so you have all my time."
  chronotec_leader.40200.about.powers:0 "What type of power you have?"
  chronotec_leader.40200.about.powers.response:0 "§HThe question was immediately answered§!\nChronomancy. I can alter the flow of time on a planet if you desire so, or i can channel part of my own power into my relic, to alter time-space at a massive scale.."
  chronotec_leader.40200.about.relic:0 "What relic you possess?"
  chronotec_leader.40200.about.relic.response:0 "The $r_chronotec_standard$. It is a wonder made by my kind, for each one of us, that will slowly restore my power back if you allow me to stay close to it.\n§HEios is now measuring each one of their next words§!\nHowever, I can't stop you from using the relic, which would drain a bit of my power in order to do... incredible things, or terrible things."
  chronotec_leader.40200.welcome:0 "Welcome to our empire"
  chronotec_leader.40200.welcome.original:0 "Welcome back!"
  chronotec_leader.40200.welcome.die:0 "You will be eradicated"
  chronotec_leader.40200.welcome.die.devouring:0 "A decent prey..."
  chronotec_leader.40200.welcome.die.tooltip:0 "Eios will vanish to avoid your aggressive tactics..."

  # Planet is destroyed - Leader farewell
  chronotec_leader.40500.title:0 "$NAME_chronotec_chronolord$"
  chronotec_leader.40500.desc:0 "§HEios communicates with you regarding the recently destruction of its planet, with a sorrowful tone.§!\nIt is... gone. All my efforts, gone... The loss of my installations will make me disappear soon from this timeline forever so... has been a pleasure meeting you"
  chronotec_leader.40500.ask.help:0 "Can we help, somehow?"
  chronotec_leader.40500.ask.help.response:0 "§HEios responds quickly§!\nThere is nothing you can do, sadly..."
  chronotec_leader.40500.ask.relic:0 "Is your $r_chronotec_standard$ destroyed too?"
  chronotec_leader.40500.ask.relic.response:0 "§HEios responds with a muffled tone, as if they were slipping away§!\nYes... all is now gone and so I will..."
  chronotec_leader.40500.farewell:0 "Farewell..."
  chronotec_leader.40500.farewell.original:0 "You will be missed..."
# /

# Relic events
  # Relic activated first time
  chronotec_relic.10.name:0 "Unleashing the Compass"
  chronotec_relic.10.desc:0 "Upon activating the $r_chronotec_standard$, an incredible wave of time-bending energy was released from Fugit, as Eios was able to channel part of its power on it.\nWith just their bare minimum energy restored, they was able to alter time at a whole empire level, which is a feat before no one thought that could not be done.\n\nWho knows what awaits on further uses of such powerful artifact..."
  chronotec_relic.10.a:0 "Incredible"
  chronotec_relic.10.a.tooltip:0 ""

  # Leader gets totally changed
  chronotec_relic.30.title:0 "$NAME_chronotec_chronolord$"
  chronotec_relic.30.desc.corrupted:0 "§HThe decisions you made have drained most of the Chronomantic energy out of Eios and has left them in a ... particular state.\nTheir body is cracked, like if somehow it could not contain the corruption accumulated...  dark and ominous energy pulsates behind each crack,§!"
  chronotec_relic.30.desc.perfected:0 "§HThe decisions you made have... altered Eios form.\nWhere they had cracks and fissures now lines of an incredible gold-like substance appeared, its shape changed into a more... majestic one§!"
  chronotec_relic.30.tell.corrupted:0 "Are you... ok?"
  chronotec_relic.30.tell.corrupted.response:0 "§HEios reacts and speaks back§!\nI am...I am more than ok, I am unleashed, unchained... free.\nEven if corruption consumed most of my power, it just filled a void, made me stronger...\nWe will conquer time, together..."
  chronotec_relic.30.changes.corrupted:0 "What has changed of your powers?"
  chronotec_relic.30.changes.corrupted.response:0 "§HEios twitch while responding§!\nMy power has increased so much i no longer am bound to the Compass exclusively, so now... you can use it! Use it as much as you want, it will make me... stronger.\n\n§HA small cracked laugh can be heard§!\n\nThis... corruption will definitively increase whatever we make...tenfold!"
  chronotec_relic.30.tell.perfected:0 "You seem way... different"
  chronotec_relic.30.tell.perfected.response:0 "§HEios reacts and speaks back§!\nI... I have recovered my purest form... can't even describe the gratitude i feel...\n\n§HThe way they talks about it seems even emotional.§!\n\nTime now flows around me, i can touch it, i can shape it, without pain nor sorrow, just sheer glory and harmony... thank you..."
  chronotec_relic.30.changes.perfected:0 "What has changed of your powers?"
  chronotec_relic.30.changes.perfected.response:0 "§HEios responds, quickly§!\nFirst of all my Compass may have been stabilized so... now you can use it without worrying of tainting or draining my powers, and I no longer need to consecrate myself towards it.\n\n§HEios watches his hands and now gold-trimmed hands§!\n\nAlso I feel... whatever I do with time now, whatever we decide, will be more stable and beneficial, more safe and better!"
  chronotec_relic.30.close:0 "Close"
# /

