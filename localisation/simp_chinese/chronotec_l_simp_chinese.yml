  # Fake anomaly 1
  chronotec_narrative.1001.name:0 "$chronotec_fake_anomaly_strange_energy$"
  chronotec_narrative.1001.desc:0 "After a thoroughful study, we have concluded our sensors were right... but they also were not; a strange anomaly is present on the object, but at the same time it's impossible the signal is transmitted or received from it in any regard, at least from what we know or understand.\nSomehow, the object is in a state of emission and inertia that is, relatively speaking, impossible."
  chronotec_narrative.1001.a:0 "What can this mean?"
  chronotec_narrative.1001.a.tooltip:0 "An anomaly like this can be an indication of something that may happen soon..."

  # Fake anomaly 2
  chronotec_narrative.1002.name:0 "$chronotec_fake_anomaly_strange_resonance$"
  chronotec_narrative.1002.desc:0 "After a throughful study, the resonance of the star corona has been deemed impossible to decipher or codify reliably.\nThe radiation emissions are just coming from nowhere, we have identified the same energy as the emitted from the star but in this case ... the source is not the star.\nOf course this is, based on our understanding of physics, impossible."
  chronotec_narrative.1002.a:0 "What can this mean?"
  chronotec_narrative.1002.a.tooltip:0 "An anomaly like this can be an indication of something that may happen soon..."

  # Fake anomaly 3
  chronotec_narrative.1003.name:0 "$chronotec_fake_anomaly_strange_planet$"
  chronotec_narrative.1003.desc:0 "A myriad of tests have been done regarding these readings and all led us to the same conclusion:\nThe emanations are, of course, from the studied body, but definitively aren't being produced by that celestial body, which has no sense from our understanding of physics."
  chronotec_narrative.1003.a:0 "What can this mean?"
  chronotec_narrative.1003.a.tooltip:0 "An anomaly like this can be an indication of something that may happen soon..."

  # Fake anomaly 4
  chronotec_narrative.1004.name:0 "$chronotec_fake_anomaly_strange_system$"
  chronotec_narrative.1004.desc:0 "We have discarded a thousand different calculations regarding the interferences because, somehow, they make no sense; They are indeed produced by the System's star, but at the same time there is no projection or emanation from the star, nor any close body. This is, in all regards, impossible."
  chronotec_narrative.1004.a:0 "What can this mean?"
  chronotec_narrative.1004.a.tooltip:0 "An anomaly like this can be an indication of something that may happen soon..."

