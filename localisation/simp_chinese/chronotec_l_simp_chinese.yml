  r_chronotec_standard:0 "Chronomantic Compass"
  r_chronotec_standard_desc:0 "An incredible piece of technology that is able to syphon time energy from parallel timelines and dimensions, but seems to be on a diminished or depleted state."
  r_chronotec_standard_effect_tooltip:0 "Tears a rip in space-time, §YAltering Reality§! by overlapping part of a parallel dimension, generating a random effect on an owned system."
  r_chronotec_standard_leader_effect_tooltip:0 "\n§E£scientist£ $NAME_chronotec_chronolord$:§!\nGains a ['concept_chronotec_infusion_charge'] charge each §Y5§! years.\nThe next §Y$chronotec_infusion$§! charge will be received on §Y[This.chronotec_charge_timer]§!"
  #  $chronotec_infusion$s allow the use of $decision_chronotec_chronoacceleration$s while Eios is assigned as a planet governor. 

  r_chronotec_corrupted:0 "Chronocorrupted Compass"
  r_chronotec_corrupted_desc:0 "Completely infused with chaotic Chronomantic energy, this incredible technological device can rip apart entire timelines for the benefit of the user..."
  r_chronotec_corrupted_effect_tooltip:0 "Tears a rip in space-time, §Yaltering reality§! by overlapping part of a parallel dimension, generating a random effect on an owned system.\n§HThe chaotic energy of the relic affects this effect.§!"
  r_chronotec_corrupted_leader_effect_tooltip:0 "\n§E£scientist£ $NAME_chronotec_chronolord$:§!\n$decision_chronotec_chronoacceleration_corrupted$ has increased effects, both positive and negative."

  r_chronotec_perfected:0 "Chronomantic Waystone"
  r_chronotec_perfected_desc:0 "The definitive form of a Chronomantic Compass, now stabilized and capable of manifesting and altering time on several dimensions in parallel."
  r_chronotec_perfected_effect_tooltip:0 "Tears a rip in space-time, §YAltering reality§! by overlapping part of a parallel dimension, generating a random effect on an owned system.\n§HThe perfected state of the relic stabilizes this effect.§!"
  r_chronotec_perfected_leader_effect_tooltip:0 "§E£scientist£ $NAME_chronotec_chronolord$:§!\n$decision_chronotec_chronoacceleration_perfected$ no longer has negatives, and increases/decreases incrementally."

