  decision_chronotec_chronoacceleration_corrupted:0 "Chaotic-Chronoacceleration"
  decision_chronotec_chronoacceleration_corrupted_desc:0 "Eios is able to radically increase the time flow locally using corrupted time-reality bending powers. The cost will be high."
  decision_chronotec_chronoacceleration_corrupted_tooltip:0 "The planet will gain the §Y$pm_chronotec_chronoacceleration_corrupted$§! modifier, §GGREATLY increasing§! £pop£ pop efficiency during §G5§! years.\nAfter that, the §Y$pm_chronotec_chronoacceleration_corrupted_backlash$§! will appear, §RGREATLY reducing§! £pop£ pop efficiency by slowing down time."

