  chronotec_narrative.21100.a:0 "Study it passively"
  chronotec_narrative.21100.a.tooltip:0 "Change approach"
  chronotec_narrative.21100.b:0 "Try to decipher its secrets!"
  chronotec_narrative.21100.b.tooltip:0 "Change approach"
  chronotec_narrative.21100.c:0 "This is not worth the trouble."
  chronotec_narrative.21100.c.tooltip:0 "Change approach"

    chronotec_narrative.21110.name:0 "Severed Connection"
    chronotec_narrative.21110.desc:0 "Based on the observations we have gathered, the scar is starting to close, as the emissions are taking longer and longer after each wave... we calculate it could stop emitting energy and readable signals in less than a year at this rhythm."
    chronotec_narrative.21110.a:0 "Everything disappears in the end."
    chronotec_narrative.21110.a.tooltip:0 "The situation will accelerate towards its end."

    chronotec_narrative.21120.name:0 "Flickering Away"
    chronotec_narrative.21120.desc:0 "The cadence of emissive waves from the scar is starting to diminish, as if whatever caused it to emit them ceased to do so. This is carrying important repercussions on our study as we now cannot predict where the energy waves are coming form, or what purpose they have."
    chronotec_narrative.21120.a:0 "A change in approach may or may not be considered."
    chronotec_narrative.21120.a.tooltip:0 "The situation is starting to fail."

    chronotec_narrative.21140.name:0 "Losing Opportunities"
    chronotec_narrative.21140.desc:0 "After the diminished frequency of the energy waves, now the content are also affected. We are not able to detect the remaining energy waves anymore."
    chronotec_narrative.21140.a:0 "A shame."
    chronotec_narrative.21140.a.tooltip:0 "The situation is going in a negative route."

    chronotec_narrative.21160.name:0 "Closer, Closer"
    chronotec_narrative.21160.desc:0 "The signal tuning with the Scar projections has been a success! We have made a breakthrough and discovered a way to control what will be generated at what time, and with this semi-predictive model we can try to understand its mechanisms."
    chronotec_narrative.21160.a:0 "We must continue!"
    chronotec_narrative.21160.a.tooltip:0 "The situation is going in a positive route."

    chronotec_narrative.21180.name:0 "A Matter of Seconds"
    chronotec_narrative.21180.desc:0 "After a thoughtful analysis of the waves we have discovered not only the energy projected has no true physically based source, but it is also influenced by time! This also explains the anomalies, partially, as the emissions were done from a different time or even parallel timeline! We will develop a system to mirror them to see what we can earn from this discovery."
    chronotec_narrative.21180.a:0 "Take all the time you need!"
    chronotec_narrative.21180.a.tooltip:0 "The situation is going in a positive direction."

    chronotec_narrative.21190.name:0 "Grasping Time"
    chronotec_narrative.21190.desc:0 "It is done! We have been able to fully understand how the waves of space-time bending energy are generated and we have theorized we can synchronize them with a special emitter to mirror the waves.\nWe don't know what consequences this may have but we theorize it should be safe to experiment with."
    chronotec_narrative.21190.a:0 "Continue, we may discover something incredible..."
    chronotec_narrative.21190.a.tooltip:0 "The situation will accelerate towards its end"
  # > 21120

  # Rift
    chronotec_narrative.22000.name:0 "$astral_rift_chronotec_unseal$"
    chronotec_narrative.22000.desc:0 "We are just at the seam of the rift, contemplating an incredible void that emanates powerful temporal anomalous energy.\nThe constant flow and change of this entire area is something we are studying closely, and we hope to get a clear knowledge of what was causing such anomalies and disruptions in our dimension."
    chronotec_narrative.22000.proceed:0 "Proceed"
    chronotec_narrative.22000.proceed.tooltip:0 "We will explore the mysteries of this Astral Rift"

    chronotec_narrative.22110.name:0 "The loop is Made"
    chronotec_narrative.22110.desc:0 "As we went deeper into the Rift, we have noticed something is... odd.\nOur initial cartography of the rift indicates we are going in circles, but we are noticing changing patterns in each iteration, as if each visit altered the space more and more.\n\nWe have the power to go back now and avoid potentially being trapped here forever, but maybe we can understand what this type of loop entrails."
    chronotec_narrative.22110.explore:0 "Explore further, we need to understand this"
    chronotec_narrative.22110.observe:0 "We can't take risks, go back and observe"

    chronotec_narrative.22120.name:0 "A loop within a loop"
    chronotec_narrative.22120.desc:0 "Seems we were not in any type of risk; The space around us seems to be programmed in a constant loop, a temporal anomaly that reshapes and alters itself... and we don't know if with any type of conscious purpose, intelligent design or just fruit of causality.\n\nWhat we know is its naturally impossible to alter time in a non linearly way as it's happening here."
    chronotec_narrative.22120.wonder:0 "What, or who, has created this?"
    chronotec_narrative.22120.monitor:0 "Keep studying this loop"

    chronotec_narrative.22130.name:0 "All that starts..."
    chronotec_narrative.22130.desc:0 "The more we head deeper into the looped section of the rift, the less we understand it.\nWhat initially started as a loop is now changing and threading into different subspaces and elements that appear like a carbon-copy of each other, as if the loop was being... undone?\n\nWe don't understand what has caused this but it is  clear that the previous looping anomaly we were studying is no longer a thing, or if it is, it is not being presented to us as such."
    chronotec_narrative.22130.continue:0 "Maybe our presence changed something?"

    chronotec_narrative.22210.name:0 "A glimpse on Perfection"
    chronotec_narrative.22210.desc:0 "We have reached an area that initially seemed devoid of any kind of content, but suddenly we made readings of some small pockets of intense energy far away from the rift starting point.\nThe readings we are catching there are confusing, as if they were sent backwards, or with a velocity what surpass our capacity to decipher or understand them."
    chronotec_narrative.22210.continue:0 "Continue forward, get closer to those areas..."
    chronotec_narrative.22210.observe:0 "Observe from afar, could be dangerous..."

    chronotec_narrative.22220.name:0 "Those Outside Time"
    chronotec_narrative.22220.desc:0 "Our sphere has entered what seems like an... artificial space. A myriad, perhaps millions, of vaguely shaped entities seem to roam this space, but we seem to have been unnoticed by anything or they just are intentionally ignoring us.\nWhat we are seeing is... a lot of them directly altering material inside the rift, accelerating and decelerating the process of aging and creation of each one, it's some kind of... chronological manipulation."
    chronotec_narrative.22220.continue:0 "Intriguing, study those entities"
    chronotec_narrative.22220.devouring:0 "Would those be edible?"
    chronotec_narrative.22220.purifier:0 "We should eradicate them... eventually"

    chronotec_narrative.22230.name:0 "Unstable Experiment"
    chronotec_narrative.22230.desc:0 "Deeper into the rift, one of the entities seems to be doing... something; It is rearranging entire cosmic forces into a single element, like a tailor, like a ... God, but there is some kind of technological intervention here.\n\nSuddenly, the entity disappeared with the created space without a trace, but we are getting enormous readings that are similar to the ones we got previously, and the direction of the energy is pointing towards our point of origin..."
    chronotec_narrative.22230.end:0 "Monitor those energy surges!"

    chronotec_narrative.22310.name:0 "Creation of Time"
    chronotec_narrative.22310.desc:0 "The area inside the rift we reached is... strange. The flow of time seems to be absolutely halted, even if our protection avoids the dimensional interference of that change, it is noticeable.\nWe are detecting specific ''streams'' of energy where seems time passes at a different pace, and some of those streams come from small elements we are still to study, far away from our location"
    chronotec_narrative.22310.end:0 "Incredible, get closer to those elements"

    chronotec_narrative.22320.name:0 "Guiding Compass"
    chronotec_narrative.22320.desc:0 "The elements we observed from afar seem to be some kind of... artificial device that connects and rearrange time itself, based on how the energy readings and micro probes we sent aged until they were useless or even got decomposed to their original basic components.\nWhat is more strange is... we have seen some entities carrying them around, patching and interweaving threads of time, but always guiding themselves into specific direction after ''holding'' those artefacts.\nIn accordance, we have codenamed them as ''Time Compasses''."
    chronotec_narrative.22320.end:0 "Only if we could use that technology..."
    chronotec_narrative.22320.monitor:0 "Monitor those entities"

    chronotec_narrative.22330.name:0 "Impossible Forces, Impossible Outcomes"
    chronotec_narrative.22330.desc:0 "Our presence hasn't gone unnoticed and seems we are in a spot we should not be.\nSome presences have started to roam the Sphere and we are preparing a retreat, but still... we are getting some extreme readings of energy coming towards us, or better, towards the starting point we created.\n\nWe should head back, now."
    chronotec_narrative.22330.end:0 "Ominous..."

    chronotec_narrative.2500.name:0 "A Stranded System"
    chronotec_narrative.2500.desc.clueless:0 "As we departed from the rift... something came with us; an incredible peak of energy overwhelmed all our sensors when suddenly... something incredible happened.\nA whole system was generated through the Rift, projecting an impossible amount of energy into tailoring a new hyperlane that we have registered in our cartographic data.\nWe should check it as soon as possible."
    chronotec_narrative.2500.desc.knows.chronomancy:0 "As we departed from the rift... the chronomantic energy we detected inside the rift invaded all our sensors as something was ejected from the rift:\nA whole system was generated through it, projecting an impossible amount of energy into tailoring a new hyperlane that we have registered in our cartographic data.\nWe should check it as soon as possible."
    chronotec_narrative.2500.desc.knows.relic:0 "As we departed from the rift... something came with us; an incredible peak of energy overwhelmed all our sensors when suddenly... something incredible happened.\nA whole system was generated through the Rift, projecting an impossible amount of energy into tailoring a new hyperlane that we have registered in our cartographic data.\nWe should check it as soon as possible."
    chronotec_narrative.2500.desc.knows.all:0 "As we departed from the rift... something came with us; an incredible peak of energy overwhelmed all our sensors when suddenly... something incredible happened.\nA whole system was generated through the Rift, projecting an impossible amount of energy into tailoring a new hyperlane that we have registered in our cartographic data.\nWe should check it as soon as possible."
    chronotec_narrative.2500.a:0 "Incredible yet certain, we must hurry."
    chronotec_narrative.2500.a.tooltip:0 "A System has been created adjacent to the Scar."

  # > 21220

  # Situation failed
  chronotec_narrative.2502.name:0 "Overtime is Over"
  chronotec_narrative.2502.desc:0 "After all our effort... we have lost the track of the emissions of the rift and it now lays inert, projecting nominal radiation but ... something has been lost.\nWe should have analyzed it deeper and made bigger efforts but now seems we lost this opportunity."
  chronotec_narrative.2502.a:0 "At least we learned something today..."
  chronotec_narrative.2502.a.tooltip:0 "The situation will end. Something has been lost in the process..."

  # System is created
  chronotec_narrative.2501.name:0 "A Stranded System"
  chronotec_narrative.2501.desc:0 "A big energy emanation was created the moment we synchronized the rift energy with our technology and the result is... incredible.\nA whole system was generated through the Scar, projecting an impossible amount of energy into tailoring a new hyperlane that we have registered in our cartographic data.\nWe should check it as soon as possible."
  chronotec_narrative.2501.a:0 "Incredible yet certain, we must hurry."
  chronotec_narrative.2501.a.tooltip:0 "A System has been create adjacent to the Scar."
 # /
 # ----------------- phase 2 ---------------
  # Entered the system
  chronotec_narrative.2601.name:0 "Anomalous System"
  chronotec_narrative.2601.desc:0 "The $NAME_chronotec_chronolord_system$ system has an unbelievable celestial layout, not only lacking a typical star, but instead possessing a massive planet anchored in place in its stead, irradiating the system with enormous waves of energy."
  chronotec_narrative.2601.desc.no.original:0 "$chronotec_narrative.2601.desc$\nWhatever happened here seems a bit out of what our knowledge of physics can understand..."
  chronotec_narrative.2601.desc.original:0 "$chronotec_narrative.2601.desc$\nSeems those waves are related to all we have been studying, and as such... we need to study it closer."
  chronotec_narrative.2601.a.no.original:0 "Strange..."
  chronotec_narrative.2601.a.no.original.tooltip:0 ""
  chronotec_narrative.2601.a.original:0 "We need to know more!"
  chronotec_narrative.2601.a.original.tooltip:0 "The survey of the system may reveal some important data-"

  # Timelooped planet surveyed, adds digsite
  chronotec_narrative.26.name:0 "Stranded In Time"
  chronotec_narrative.26.desc:0 "The survey on the [From.GetStarName] System is complete and ... It's incredibly anomalous. Not only the lack of a core star is relevant but seems a small amount of anomalies and black holes are in a constant orbit around a single unique planet, but this is not the strangest thing...\nThe planet itself is surrounded by a specie of impenetrable field, but not a physical or energy one but ''Time'', just time, all that enters into the atmosphere is straight up frozen in time, except the devices we have tuned with the Scar wave.\nWe should try doing a small control expedition to the surface."
  chronotec_narrative.26.a:0 "We need to discover what secrets lay under that field..."
  chronotec_narrative.26.a.tooltip:0 "Starts the §Y$site_chronotec_world$§! Archaeological Site, to discover the secrets of the anomalous world."

  # Digsite
    #chronotec_narrative.27010	# Eye of the Storm
    chronotec_narrative.27010.name:0 "Eye of the Storm"
    chronotec_narrative.27010.desc:0 "We have created an isolated safe area using the signal to ensure we are not trapped in the energy field of the planet, tracking an area of powerful energy readings for further study.\nThe area contains diverse structures we have checked as artificially made, which intrigues us even more."
    chronotec_narrative.27010.a:0 "Continue exploring"
    chronotec_narrative.27010.a.tooltip:0 ""

    #chronotec_narrative.27020	# Dimensionally Frozen
    chronotec_narrative.27020.name:0 "Dimensionally Frozen"
    chronotec_narrative.27020.desc:0 "Upon further exploration of the area, we are obtaining records of the surrounding space and ... we are even more intrigued; Most of the elements we are recording are not something we have recorded physically, ever, and some are straight up impossible to replicate or find.\nThe most intriguing part is how some of the elements are aging and become oxidized or deoxidized on the fly, making the study of some of them extremely difficult.\nWe are taking extreme caution measures to avoid cross contamination, but still, something indicates the breach we made on this area is altering ''something'' beyond what we can comprehend."
    chronotec_narrative.27020.a:0 "Strange...Record everything"
    chronotec_narrative.27020.a.tooltip:0 ""

    #chronotec_narrative.27030	# Metronome
    chronotec_narrative.27030.name:0 "Metronome"
    chronotec_narrative.27030.desc:0 "We have found what seems like a relatively important structure that is starting to decay in a time-manner due to the disruption caused by the waves we have emitted.\nThis structure seems central to the area and the source of most of the energy peaks we have recorded, which are starting to ''tick'' in a constant manner, responding to our advances.\nIt would be worth exploring before it crumbles definitively."
    chronotec_narrative.27030.a:0 "Do it so, carefully."
    chronotec_narrative.27030.a.tooltip:0 ""

    #chronotec_narrative.27040	# Revelation
    chronotec_narrative.27040.name:0 "Revelation" 
    chronotec_narrative.27040.desc:0 "Reaching the deepest layer of the structure, we found an entity is floating in stasis in the middle of a big, circular area, surrounded by what seems like artificial circuitry we can't comprehend and with a §Hstrange glowing object§! located on its center.\nThe entity seems still affected by the time-freezing effects, which is odd due to how the rest of the structure has been reenabled and in fact is aging, so we theorize we can project the wave to it to undo its loop..."
    chronotec_narrative.27040.desc.homicidal:0 "Reaching the deepest layer of the structure, we found an entity is floating in stasis in the middle of a big, circular area, surrounded by what seems like artificial circuitry we can't comprehend and with a §Hstrange glowing object§! located on its center.\nThe entity seems still affected by the time-freezing effects, which is odd due to how the rest of the structure has been reenabled and in fact is aging, so we should just take what we can and let this place to rot."
    chronotec_narrative.27040.reanimate.chronolord:0 "Proceed, project the Wave!"
    chronotec_narrative.27040.reanimate.chronolord.tooltip:0 "The Archaeological site will be completed."
    chronotec_narrative.27040.take.relic:0 "Maybe we should just take that §HStrange Glowing object§!..."
    chronotec_narrative.27040.take.relic.tooltip:0 "The Archaeological site will be completed."
    chronotec_narrative.27040.take.relic.homicidal:0 "Grab the §HStrange Glowing object§!, destroy the rest"
    chronotec_narrative.27040.take.relic.homicidal.tooltip:0 "The Archaeological site will be completed."

  # chronolord appears
  chronotec_narrative.30.name:0 "Time-Unlocked"
  chronotec_narrative.30.desc:0 "§HThe reactivated entity starts to shape and rearrange itself, like a kind of organic mechanism, forming an elegant yet apparently damaged figure, and after analyzing us during some seconds, proceeds to communicate.§!\n\nIt has been eons since i communicated with other than my kind, which indicates they are no longer here, or haven't arrived... yet.\nI'm grateful for undoing my loop and freeing me from it, and as such, i will gladly serve your cause.\nMy name is Eios, and i was the curator and investigator of this timeline wonder; I understand you may have questions, and so you have all my time."
  chronotec_narrative.30.a:0 "What exactly are you?"
  chronotec_narrative.30.a.response:0 "§HAn echo starts to resonate in the area, harmoniously emitted from the figure§!\n\nWhile my nature may escape your understanding, at least for now, you don't have to bear fear or doubts about it; I am as real as any of your kind.\nMy species conquered more than biology, more than technology, more than time itself a long, long time long ago; What you see is a representation of what you think i am and represent, yet my true form encompasses infinite threads intertwined.§!\n\n§HThe echo ceases.§!"
  chronotec_narrative.30.b:0 "How can you contribute to our cause?"
  chronotec_narrative.30.b.response:0 "§HThe marbling entity speaks in a soft, calm yet deep tone, reaffirming each word with an unnatural echo§!\n\nMy capacities are still diminished, but i can use part of my own essence to allow local alterations of reality, bending time to will serve your purpose, in ways you would not believe.\n\n§HTheir words resonate on the whole area, like an echo of a past never explored.§!"
  chronotec_narrative.30.c:0 "Why the planet was looped in time?"
  chronotec_narrative.30.c.response:0 "§HA note of sadness can be felt on the room, as the entity starts speaking again.§!\n\nA mistake. My humbling mistake.\nMessing with forces I was too naive and inexpert to mess, but eons of solitude, learning and reflection made me realize where i failed, an know what, and when, i have to amend it."
  chronotec_narrative.30.d:0 "How could you integrate in our collective?"
  chronotec_narrative.30.d.response:0 "§HThe entity starts communicating, now strangely through a different way.§!\n\nYour kind is no anomaly for my capacities.\nMy complex neural network can access your synaptic projections and both receive and communicate with your collective, without compromising my individuality nor your collectivity."
  # Only available if the player invested enough
  chronotec_narrative.30.e:0 "We know about your Chronomancy..."
  chronotec_narrative.30.e.response:0 "§HEios stutters, surprised by the question§!\n\nInteresting, seems we have already met, somehow.§!\n\n§HReaffirming itself, Eios responds hastily.§!\n\nBesides, we have much to do and un-do, together, if you wish so, as you already know my capacities..."
  chronotec_narrative.30.f:0 "What is the $r_chronotec_standard$? Do you have one?"
  chronotec_narrative.30.f.response:0 "§HIf they had a face, you would notice the strange expression on Eios§!\n\nSo... you know about it.§!\n§HThe solemn pause feels ominous.§!\n\nEach one of my kind is given one after their creation, it's an anchorage, a guiding light, our... ''heart'' to make a resemblance to something you may know. Mine is broken, as it's tied to the state of this planet, due to my experiments..."
 # /
 # ----------------- phase 3 ---------------
  # Chronolord Request
  chronotec_narrative.35.name:0 "Timeless Request"
  chronotec_narrative.35.desc:0 "§HEios contacts us with a affirmed tone.§!\n\nOur collaboration has been fruitful and i appreciate your capacities... I feel with the confidence of making a request.\n§HEios makes a solemn pause, like if they are analyzing our reaction.§!\nFear not, won't be a disruptive one, I just need your expertise."
  chronotec_narrative.35.ask:0 "What do you need?"
  chronotec_narrative.35.ask.response:0 "§HEios starts to transmit information§!\n\nI need you to help me undo the loop i started and regain my powers.\nI was able to do it myself, but in my weakened state, i'm absolutely unable while you have proven more than able to do so without effort.\nTrust me, the reward will compensate the time invested..."
  chronotec_narrative.35.knows.relic:0 "So you need your $r_chronotec_standard$ restored?"
  chronotec_narrative.35.knows.relic.response:0 "§HEios stops for a second§!\n\nYes. It's absolutely mandatory for me to even stabilize on this dimension.\nYou know what it means to me, and so i trust you with this task."
  chronotec_narrative.35.remind:0 "Remind us what you need"
  chronotec_narrative.35.remind.response:0 "§HEios starts to transmit information, again§!\n\nI need you to help me undo the loop i started\nI was able to do it myself, but in my weakened state, i'm absolutely unable while you have proven more than able to do so without effort.\nTrust me, the reward will compensate the time invested..."
  chronotec_narrative.35.ask.yes:0 "We will do it"
  chronotec_narrative.35.ask.yes.tooltip:0 "The $situation_chronotec_unloop_planet$ will start"
  chronotec_narrative.35.ask.no:0 "We have no time for this"
  chronotec_narrative.35.ask.no.tooltip:0 "We are sure §HEios§! will be disappointed with this ..."

    # chronolord request is rejected
    chronotec_narrative.3501.name:0 "Timeless Request"
    chronotec_narrative.3501.desc:0 "§HEios seems surprised by your rejection§!\n\nI... I must insist, this is absolutely needed for our collaboration and, ultimately, my development around it.\n§HThe sudden pause shows their desperation.§!\nYou freed me from the loop, this would be a really small effort, and i would reward it, tenfold."
    chronotec_narrative.3501.remind:0 "$chronotec_narrative.35.remind$"
    chronotec_narrative.3501.remind.response:0 "$chronotec_narrative.35.remind.response$"
    chronotec_narrative.3501.reconsider:0 "We will help you then!"
    chronotec_narrative.3501.reconsider.tooltip:0 "We will accept Eios request. $chronotec_narrative.35.ask.yes.tooltip$"
    chronotec_narrative.3501.deny:0 "We can't afford to do that now, Eios"
    chronotec_narrative.3501.deny.tooltip:0 "$chronotec_narrative.35.ask.no.tooltip$"

    # Continuation
    chronotec_narrative.3502.name:0 "Withered"
    chronotec_narrative.3502.desc:0 "§HEios tone seems diminished and echoing away§!\nMy form has been destabilizing on this timeline for years already, and this is... my final stand.\n\nWe may see each other in another timeline, perhaps... Only time will tell."
    chronotec_narrative.3502.something.we.can.do:0 "Is there something we can do?"
    chronotec_narrative.3502.something.we.can.do.response:0 "§HEios pronounce some distant words§!\n\nHa...you had the chance but you decided not to... still, I'm eternally grateful for your initial selfless help, and eternally will remember you."
    chronotec_narrative.3502.farewell:0 "Farewell, Eios"
    chronotec_narrative.3502.farewell.tooltip:0 "Eios will disappear, forever."

    # Request accepted - Situation starts
    chronotec_narrative.3505.name:0 "Undo the Loop"
    chronotec_narrative.3505.desc:0 "It's time for undo the loop that has kept $NAME_chronotec_chronolord_planet$ trapped in a temporal loop, and help Eios to recover its powers.\nThe first logical step would be to make a spearhead  on the zone we secured previously, and continue onwards."
    chronotec_narrative.3505.neutral:0 "Proceed nominally"
    chronotec_narrative.3505.neutral.tooltip:0 ""
    chronotec_narrative.3505.fast:0 "We must focus all our efforts"
    chronotec_narrative.3505.fast.tooltip:0 ""
    chronotec_narrative.3505.ignore:0 "There are more important matters..."
    chronotec_narrative.3505.ignore.tooltip:0 ""

  # Undo the Loop situation
    chronotec_narrative.35005.name:0 "A Last Breath"
    chronotec_narrative.35005.desc:0 "The distorted barrier of the planet is intensifying its grasp and we are close to lose the only safe area we had.\nOur efforts against it seem to be in vain, as each action seem to even accelerate the issue."
    chronotec_narrative.35005.a:0 "Definitively this is not good"
    chronotec_narrative.35005.a.tooltip:0 "The situation will accelerate towards its end"

    chronotec_narrative.35015.name:0 "Losing its Grasp"
    chronotec_narrative.35015.desc:0 "Seems that no matter how we try to isolate areas from the temporal energy, it fights and wins back every single time; it's like if the planet itself were rebelling against the energy projection and... if we are not able to subvert this tendency, we may have to even retreat to space."
    chronotec_narrative.35015.a:0 "Seems we are far away from fixing this..."
    chronotec_narrative.35015.a.tooltip:0 "The situation is going in a negative direction."

    chronotec_narrative.35030.name:0 "Connecting the Loop"
    chronotec_narrative.35030.desc:0 "The first attempts to harmonize our energy signals and the help provided by Eios seem to be bearing fruit! We have expanded the area of anti-temporal energy and we are setting new countermeasures to avoid  a recess.\n\nEven with that we are far far away from achieving our goals, but it is a matter of time we do so."
    chronotec_narrative.35030.a:0 "So far, so good"
    chronotec_narrative.35030.a.tooltip:0 "The situation is going in a positive direction."

    chronotec_narrative.35050.name:0 "Alive, Again, Naturally"
    chronotec_narrative.35050.desc:0 "The planet is reacting strangely to the changes, as if it was getting ''alive'' again; Biosphere is starting to prosper and thrive, the lithosphere is slowly reactivating itself and the atmosphere starting to move.\n\nSeems that undoing the loop is finally giving life to it, and as such, we need to also care of it."
    chronotec_narrative.35050.a:0 "We will do it"
    chronotec_narrative.35050.a.tooltip:0 "The situation is going in a positive direction."

    chronotec_narrative.35075.name:0 "Unfolding The Lines"
    chronotec_narrative.35075.desc:0 "We have reached a point where we have mapped all the planetary affected temporal lines, and all converge now towards Eios's structure.\nBased on our calculations, if we keep the rhythm, the planet would be freed of the loop entirely in less than a year, and stabilized in several."
    chronotec_narrative.35075.a:0 "Continue, we are close!"
    chronotec_narrative.35075.a.tooltip:0 "The situation will accelerate towards its end"

  # Failure
  chronotec_narrative.4001.name:0 "Lost in Time"
  chronotec_narrative.4001.desc:0 "§HEios starts to transmit information§!\n\nEven with your expertise, seems you were not able to... undo what i did.\nSadly, my powers won't grow any further as i'm trapped on this current state, but we may be able to figure out...something, maybe, eventually..."
  chronotec_narrative.4001.a:0 "We are sorry..."
  chronotec_narrative.4001.a.tooltip:0 "Eios is clearly in a diminished state. Who knows what can happen to them in the future."
  # Leader withers
  chronotec_narrative.4002.name:0 "$chronotec_narrative.3502.name$"
  chronotec_narrative.4002.desc:0 "§HEios tone seems diminished and echoing away§!\nMy form has been destabilizing on this timeline for years already, and this is... my final stand.\n\nWe may see each other in another timeline, perhaps... Only time will tell."
  chronotec_narrative.4002.something.we.can.do:0 "Is there something we can do?"
  chronotec_narrative.4002.something.we.can.do.response:0 "§HEios pronounce some distant words§!\n\nYou... you already tried...Nothing can be done, my destiny is already... sealed, forever. But i will remember you, eternally, for your kindness and selfless help..."
  chronotec_narrative.4002.farewell:0 "Farewell, Eios"
  chronotec_narrative.4002.farewell.tooltip:0 "Eios will disappear, forever, from your timeline..."

  # Planet unshielded - gives relic
  chronotec_narrative.40.name:0 "$chronotec_narrative.3502.name$"
  chronotec_narrative.40.desc:0 "§HEios tone is incredibly cheerful this time§!\nWe did it! We have achieved it together, and now... now i can be myself, again.\n§HA small pause and silence filled the entire room, driven by the echo of a power we can't feel§!\nNow... i owe you my time, and as a proof of gratitude, the planet is yours."
  chronotec_narrative.40.ask.planet:0 "Can we really keep this planet?"
  chronotec_narrative.40.ask.planet.response:0 "§HA sound similar to an artificial laugh can be heard§!\nOf course, this small paradise is yours to take and reshape as you fit.\nMy lab will be there always available for my temporal experiments."
  chronotec_narrative.40.ask.powers:0 "What powers have you gained?"
  chronotec_narrative.40.ask.powers.response:0 "§HEios does a more serious tone§!\nFor now... I have restored the capacity to alter the time flux locally, but my power will grow eventually... to points you can't even imagine.\nI would require some time close to my $r_chronotec_standard$ for fully recovering my power."
  chronotec_narrative.40.ask.relic:0 "Tell us more about the $r_chronotec_standard$"
  chronotec_narrative.40.ask.relic.response:0 "The $r_chronotec_standard$ will slowly restore my power back if you allow me to stay close to the relic.\n§HEios is now measuring each one of their next words§!\nHowever, I can't stop you from using the relic, which would drain a bit of my power in order to do... incredible things, or terrible things."
  chronotec_narrative.40.ask.people:0 "Will your people search for you?"
  chronotec_narrative.40.ask.people.response:0 "§HThe solemn pause before answering this is unsettling§!\nWe all do, all the time, for everyone and everywhere. If they did not came to help me, was because they knew you would.\n\nFor our kind, causality is a long-term concept."
  chronotec_narrative.40.ask.next:0 "What comes next?"
  chronotec_narrative.40.ask.next.response:0 "§HThe solemn pause before answering this is unsettling§!\nFor now i require restoring my power, but i can offer part of it if you allow me to control one of your planets, governing it.\n\nIn the not so distant future i will regain all my powers, entirely."
  chronotec_narrative.40.a:0 "The future is ours!"
  chronotec_narrative.40.a.tooltip:0 "Eios can now be contacted as empire, for adjusting its powers and form!"
 # /
