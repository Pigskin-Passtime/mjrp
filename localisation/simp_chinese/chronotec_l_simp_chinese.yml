  chronotec_narrative.20.name:0 "Timeless Scar"
  chronotec_narrative.20.desc:0 "It appears as though the anomalies on the [From.GetStarName] System were not as impossible to track as we thought! An incredible spike of energy was succeeded by the sudden appearance of a time-space anomaly, a ... scar in reality.\nWe estimate being able to obtain more information about the anomalous findings if we dedicate some of our research efforts towards studying it; We also speculate that, with enough energy projected towards it, we can trigger a change in the scar that may allows us to study it closer."
  chronotec_narrative.20.a:0 "Study this anomaly carefully."
  chronotec_narrative.20.a.tooltip:0 "Starts the §Y$situation_chronotec_study_scar$§! Situation to inspect and analyze the scar without direct intervention."
  chronotec_narrative.20.b:0 "We must seize the opportunity!"
  chronotec_narrative.20.b.tooltip:0 "Projecting energy we will force a change in the §YAstral Scar§!."

