l_english:
 
 akeean_starting_init_01_NAME:0 "Shielded"
 akeean_starting_init_01_DESC:0 "A binary star system with a shielded planet in its habitable zone."
 origin_akeean:0 "Shielded"
 origin_akeean_desc:0 "This civilization developed under the protection of an ancient planetary shield. With the shield fading, it is now free to explore the galaxy."
 origin_tooltip_akeean_effects:1 "Homeworld is enveloped by a §YPlanetary Shield§!. Investigating the nature of this shield and why it is deteriorating, may lead to powerful outcomes for this empire. Perhaps the galaxy was protected for millenia from what was §Rkept behind this shield§!?"
 START_SCREEN_AKEEAN:0 "For what might have been millennia, when our ancestors looked towards the night sky, they would not see stars. Only the glow of the shield that would define the limits of our existence.\n\nPhilosophers of old argued that the green sky might delineate the realm of mortals from the realm of the gods. For a long time our species lived in certainty that [GetHomeWorldName] whould be all we'd ever have.\n\nEventually our best minds discovered that the barrier was waning, enough to let us carefully launch orbital craft through ever shifting weak points.\n\nEven though we do not fully understand this barrier surrounding our world yet, we reach for what lies beyond."
 pc_habitat_akeean:0 "Barren World"
 pc_habitat_akeean_desc:0 "Barren and rocky world with a thin or non-existent atmosphere. The surface is covered in meteor impact craters and completely devoid of life."
 d_akeean_moonbase_replicator:0 "Moonbase Replicator"
 d_akeean_moonbase_replicator_desc:0 "This ancient machine is nestled deep within the moon's interior, built into its main reactor from where it also draws its power. A relic of whomever originally built this secret base, its matter replication technology is utterly incomprehensible to us."
 akeean_shield_active:0 "Planetary Shield"
 akeean_shield_active_desc:0 "An impenetrable Planetary Shield surrounds this World.\n\nIn ever shifting locations, parts of the shield may become permeable for spacecrafts and other objects to pass through from either side.\n\nOrbital bombardment and unwelcome landing craft will have a very hard time making it to the surface of this Planet. There is also a benefit to argriculture due to a slight greenhouse effect."
 akeean_shield_inactive:0 "Keymasters release"
 akeean_shield_inactive_desc:0 "With the Planetary Shield removed, travel from and to this Planet has become much easier.\n\nInhabitants of this world can finally observe the sea of stars from the surface of their planet."
 decision_akeean_enable_shield:0 "Raise Planetary Shield"
 decision_akeean_enable_shield_desc:0 "Send a signal to Moonbase to create a Planetary Shield around this world."
 decision_akeean_disable_shield:0 "Dissipate Planetary Shield"
 decision_akeean_disable_shield_desc:0 "Send a signal to Moonbase to absorb and remove the Planetary Shield around this world."
 akeean_shield_reactor_refund:0 "Planetary Shield reabsorbtion"
 akeean_shield_reactor_refund_desc:0 "Energy from the dispersion of the Planetary Shield can be harvested through the moonbase."
 NAME_Endor: "Endor"
 site_akeean_arc_moonbase:0 "The Veil's Keymaster"
 site_akeean_intro:0 "This moon is a Symbol to our species.\n\nSince the shield strongly interfered with visibility to outer space, most of the early space missions that managed to break through the shield ended up here.\n\nUnlike early missions to beyond the Veil, chances for a successful return are no longer zero.\n\nOur survey teams have landed on the moon on a site originally prepared for observation of our Galaxy but quickly became of interest when it became obivous that the moon itself interfered with sensitive electronic devices.\n\nIt is now time to find the origin of this interference."
 origin_akeean.1200.name:0 "Beyond the green Veil."
 origin_akeean.1200.desc:0 "The first team quickly discovered radiation trails leading to some especially large asteroid impact craters, only to discover that something was amiss.\n\nThanks to the shield, asteroid do not threaten the Homworld, so our species pooled knowledge about them is limited. Compared to other craters on this planet, these resemble craters similar to those created by experimentation with fission weapons during our Machine Age, but are much older and larger.\n\nWhite investigation of the craters origin is ongoing, our team discovered a shaft near a ravine in the periphery of the crater."
 origin_akeean.1200.a:0 "Get inside!"
 origin_akeean.1205.name:0 "That's No Moon!"
 origin_akeean.1205.desc:0 "It does not take much effort for our specialists to descend into the opening.\n\nWhat appears to be some sort of large, artificially made thermal exhaust port, eventually opens up into a network of tunnels.\n\nSeismic-Acoustic probing confirmed that these tunnels lead deep inside the Moon and form a massive hollow volume.\n\nAs it Turns out, this is no ordinary moon. It has been hollowed out and a massive underground complex has been installed within."
 origin_akeean.1205.a:0 "Explore the Complex."
 origin_akeean.1210.name:0 "Keymasters sentry"
 origin_akeean.1210.desc:0 "Deep within the moon lies what must have been a city sized research and observation complex.\n\nOur teams have found internal diagrams of the complex and confirmed that the peciluar impact craters used to be emplacements for sensitive surveilance equipment that targeted our Homeworld.\n\nThe reason for their destruction remains unknown.\n\nWhile there is neither a trace of inhabitatns or any signs of a violent struggle or calamity befalling it, the complex appears powered and our teams have found an active terminal to attempt a full reactivation."
 origin_akeean.1210.a:0 "Analyse the terminal."
 origin_akeean.1215.name:0 "Memories from beyond the Veil"
 origin_akeean.1215.desc:0 "A recording of higher priority plays back first, dated during a time of strife on our homeworld after we first passed through the Veil. While a global war was fought on the surface over the societal unrest that followed, no missions were sent towards space.\n\nThe bases sensors are focused on what appears to be a fleet of menancing looking ships that arrived in our system and bombarded first at the shield around our world to little effect for a few days, then turning around and leaving our Homeworlds orbit. Almost as an afterthought they let go of a few missles that hit the exposed sensor equipment on the moon on their way out of the system and thus end any chance of further observation.\n\nIt does not appear like anyone boarded the underground research complex after it was blinded and the fleet must have simply left the system again.\n\nEarlier and far more extensive oberservation logs are avaliable as a compiled archive."
 origin_akeean.1215.a:0 "Download the surveilance archive."
 origin_akeean.1220.a:0 "From the Veil we rise."
 origin_akeean.1220.name:0 "A gaze through time"
 origin_akeean.1220.desc:0 "Whoever manned the research outpost on our moon had deep insight into our species progression over several decades.\n\nWhile only the more recent logs could be accessed, these archives date back to the beginning of our Machine Age.\n\nCertain events had been closely watched, like the many failed attempts to launch spacecraft beyond the Veil. Not only could and did the observers record the spectacular annhiliation of our rockets at the impermeable shield, they also collected the global media of our collective hope, grief and coping with these faliures. When our ancestors attempted to use fission warheads against the shield, which caused near global effects in the movement and appearance of the shield, this too had been recorded in minute detail.\n\nThe first time one of our vehicles passed beyond the Veil, thanks to our new accomplishments in oberservation of the shield has a particular place among the recordings.\n\nIt seems the station had been ordered evacuated soon after, as the monitoring from then on recorded only conincedental parts of the prelude of war on the surface and was blinded months after by the rampaging fleet."
 origin_akeean.1230.a:0 "Now we are the Keymasters"
 origin_akeean.1230.name:0 "The Gatekeeper"
 origin_akeean.1230.desc:0 "Our team has made a breakthrough discovery in the control center of the moonbase.\n\nThe moonbase contains a device which can reabsorb the shield around our homeworld and recover its energy and also at some energy expense recreate it as needed.\n\nNow it is for us to choose if we remain behind the Veil."