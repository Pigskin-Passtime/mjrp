l_english:

 # Origin Containment Failure
 origin_containment_failure: "Containment Failure"
 origin_containment_failure_desc: "This civilisation has been locked on its homeworld for millennia by eight moons emitting a strange and powerful energy field preventing their escape. Only recently have they had a chance to start expanding again when one of the 8 molten moons mysteriously cooled down."

 # Origin "effects" tooltip
 origin_containment_failure_tooltip: "Start with 7 §Y$d_containment_failure_electro_storm$ Blockers§! on your Homeworld:\n   - Infrastructure Build Speed: §R-35%§!\n   - Pop Assembly Speed: §R-35%§!\nHomeworld is surrounded by 8 §YMysterious Moons§!"

 # Origin Start Screen
 START_SCREEN_CONTAINMENT: "It has been several hundred thousand cycles since our empire was locked into our homeworld. Eight moons each emitting a powerful energy field have stood watch over our homeworld. These powerful fields have kept us from reaching into space. Powerful electromagnetic storms also ravage and race across the planet all to keep us in check and contained to this one world. What we know of our captors, our jailers, is nothing. The memory banks of our entire species have been wiped clean. \n\nNow, for unknown reasons, one of the moons that has locked us in has rapidly cooled down, turning it into nothing but a lifeless barren world. Its powerful energy field has entirely disappeared providing a narrow path out into the wider galaxy. A wider galaxy, once again for the taking. \n\nWhile the enemies who contained our people likely are long gone, there appears to be no sign of any other civilisations nearby; space seems dead silent.\n\nOur expansion can begin once again."
 
 # Origin Deposit
 
 d_containment_failure_electro_storm: "Electromagnetic Storm"
 d_containment_failure_electro_storm_desc: "A vast continental sized electromagnetic storm rages across the planet disabling any electronics near it."
 
 # Origin Digsite
 containment_failure_dig: "A Thermal Answer"
 containment_failure_dig_intro: "We must find out why one of the eight moons had cooled down so we may learn how to prevent it from ever activating the energy field that has locked us in again. Vast amount of resources are set aside for this inquiry. It is vital that we investigate, analyse and document everything."
  
 containment_failure_digsite.1.name: "Surface Analysis"
 containment_failure_digsite.1.desc: "Large numbers of probes and drones are sent to map out the entire surface of moon §H[from.planet.GetName]§!. Their primary purpose is to find any sign of artificial structures and detect any energy that is not natural.\n\nThe answers we seek must be found somewhere on the moon."
 
 containment_failure_digsite.2.name: "Deep Core Drilling"
 containment_failure_digsite.2.desc: "None of our scans or readings on the surface of §H[from.planet.GetName]§! have yielded any results. The entire surface is nothing more than solidified molten rock. We must find our answers deeper in the moon's core.\n\nSeveral large machines have been constructed and will be launched at high velocities towards the moon. Their initial impact will create vast craters and save many cycles as they then start drilling towards the core."
 
 containment_failure_digsite.3.name: "The Machine Core"
 containment_failure_digsite.3.desc: "Where we expected a molten or solidified core of iron, we found machine. More accurately, we found a single machine that is at the centre of §H[from.planet.GetName]§!.\n\nIts structure made of unknown materials, yet it is unmistakable a machine. Every part of the core is designed with purpose, tiny circuits and uncountable amounts of parts are all hooked into each other. Though the machine core appears to lie dormant, we are detecting faint amounts of energy signals.\n\nFar from enough to power such a machine, but enough to wonder if the moon truly has finished containing our empire."
 
 # Origin Containment First Event
 
 containment_failure.10.name: "Reason [event_target:containment_failure_moon_alpha_target.GetName]"
 containment_failure.10.desc: "There has to be a reason why the moon §H[event_target:containment_failure_moon_alpha_target.GetName]§! cooled down so suddenly. We must find out why lest we end up being contained to this one world again should it reactivate."
 containment_failure.10.a: "Perform a full planetary analysis"
 
 containment_failure.11.name: "Unexpected [event_target:containment_failure_moon_beta_target.GetName]"
 containment_failure.11.desc: "Planetary and orbital sensors have all confirmed a secondary moon has cooled down rapidly. Why this is happening remains a complete mystery.\n\nResources have been allocated to construct an orbital network of scanners and survey satellites to investigate the eight moons. Fortunately, with the cooling down of §H[event_target:containment_failure_moon_beta_target.GetName]§! a storm on our homeworld has dissipated and has boosted our efficiency."
 
 containment_failure.12.name: "Pattern [event_target:containment_failure_moon_omega_target.GetName]"
 containment_failure.12.desc: "Three is a pattern.\n\nOur homeworld's planetary sensors and survey satellites have picked up large and irregular spikes in the energy field emitted from the moon Omega right before it rapidly cooled down. Exactly like moon §H[event_target:containment_failure_moon_alpha_target.GetName]§! and §H[event_target:containment_failure_moon_beta_target.GetName]§!, moon §H[event_target:containment_failure_moon_omega_target.GetName]§! has a machine core.\n\nScanning the other moons that are still emitting the energy field is difficult, but pattern recognition suggest they are all the same. Artificially crafted structures designed to emit a powerful energy field to disrupt all electronic functions around our homeworld."
 
 containment_failure.13.name: "Expected [event_target:containment_failure_moon_theta_target.GetName]"
 containment_failure.13.desc: "Moon §H[event_target:containment_failure_moon_theta_target.GetName]§! has cooled down. This was expected, but occurred much faster than calculated. The pattern suggests the time between the moons cooling down is reduced by exactly 49.776% every time.\n\nInitial calculations indicate the next moon, moon §H[event_target:containment_failure_moon_iota_target.GetName]§! will cool down in 1.32 years."
 
 containment_failure.14.name: "On Time [event_target:containment_failure_moon_iota_target.GetName]"
 containment_failure.14.desc: "§H[event_target:containment_failure_moon_iota_target.GetName]§! has cooled down as expected, and with it another energy field has dropped. We are starting to vastly outperform the effects of the energy fields.\n\nThe electromagnetic storms on our homeworld are also rapidly dissipating. Once all moons have cooled down our capacity to expand will be unchecked and exponential.\n\nOur calculations put the next cooldown event on moon §H[event_target:containment_failure_moon_sigma_target.GetName]§! at approximately 8 months."
 
 containment_failure.15.name: "Link [event_target:containment_failure_moon_sigma_target.GetName]"
 containment_failure.15.desc: "The event of §H[event_target:containment_failure_moon_sigma_target.GetName]s§! cooling down was expected but not unremarkable. It cooled down exactly as predicted and the machine core remains just as silent as the other moons.\n\nHowever, a short subspace message has started to bounce between all previously cooled down moons. It is proving extremely difficult to read this subspace message.\n\nFurther calculations indicate moon §H[event_target:containment_failure_moon_zeta_target.GetName]§! to be next in line to cool down in 4 months."
 
 containment_failure.16.name: "Message [event_target:containment_failure_moon_zeta_target.GetName]"
 containment_failure.16.desc: "With the solidifying of moon §H[event_target:containment_failure_moon_zeta_target.GetName]§! the subspace message bouncing between the moons has increased in energy by a factor of 8.\n\nDecryption and understanding the message is become exceptionally difficult but our sensors are starting to adapt. We have only managed to decipher the last 2 blocks of the message so far:\n\n§Rcontainment..failure..\n\nenergy..cycle..value..overflow..§!\n\nThe last molten moon, moon §H[event_target:containment_failure_moon_gamma_target.GetName]§! is expected to solidify and cool in just 2 months."
 
 containment_failure.17.name: "Silent [event_target:containment_failure_moon_gamma_target.GetName]"
 containment_failure.17.desc: "Moon §H[event_target:containment_failure_moon_gamma_target.GetName]§!, the last of the molten moons has cooled down, and with it the subspace message has suddenly stopped entirely as well.\n\nOur deciphering of the rest of the bouncing subspace message was a failure. Our sensors are no longer detecting any latent energy readings in any of the moon's machine cores.\n\nWe are finally free and our systems are functioning at full efficiency.."
 containment_failure.17.a: "We are unstoppable"
 
 containment_failure.18.name: "A Final Measure"
 containment_failure.18.desc: "Following an unexpected colossal energy spike, the eight moons of §H[root.GetName]§! have suddenly started broadcasting a high energy repeating unencrypted message in every direction.\nIt reads:\n\n§R - CONTAINMENT FAILURE IN SECTOR Q-42 - \n - ENTITY DESIGNATED XTRM-3 IS NO LONGER RESTRICTED - \n - ....................... - \n - FINAL MESURE ACTIVATED: - \n - DETONATION OF CONTAINMENT UNITS 1 TO 8 - \n - ....................... - \n - PREPARE - PREPARE - PREPARE -§!\n"
 containment_failure.18.a: "Too late."
 containment_failure_tooltip_moons_detonate: "\n§YEvery moon around [root.GetName]§!:\n §R- EXPLODES!§!\n  - Mining stations are destroyed\n  - Research Stations are destroyed\n  - Gain +2 £alloys£\n\n§Y[root.GetName]:§!\n - Devastation: §R+100§!"
  
