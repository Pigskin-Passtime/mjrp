osom_decision_subterranean_fortifications:0 "Subterranean Militarization"
osom_decision_subterranean_fortifications_desc:0 "Establish a permanent military presence and place the colony in a defensive stance at the cost of increased district upkeep."

osom_decision_subterranean_fortifications_remove:0 "Decommission Subterranean Military"
osom_decision_subterranean_fortifications_remove_desc:0 "Remove military forces and reduce colonial regulations."

osom_decision_subterranean_fortifications_gestalt:0 "Subterranean Militarization"
osom_decision_subterranean_fortifications_gestalt_desc:0 "Establish a permanent military presence and place the colony in a defensive stance at the cost of increased district upkeep."

