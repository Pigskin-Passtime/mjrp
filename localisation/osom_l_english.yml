# Subterranean Origin
osom_origin_subterranean:0 "Subterranean"
osom_origin_subterranean_desc:0 "This civilization makes use of extensive natural and artifical subterranean caverns that provide powerful habitation, research, and defensive bonuses."
osom_origin_tooltip_subterranean_effects:0 "Begin with a planetary modifier granting:\n §G+25§! £housing£ Housing\n §G+10§! Maximum Planetary Districts\n §G+15%§! £engineering_research£ $engineering_research$ from £job£ jobs\n §G-15%§! Orbital Bombardment Damage\nProvides a planetary decision to add the bonus to other planets."
START_SCREEN_OSOM_SUBTERRANEAN:0 "Our civilization has long seen the value of extensive cave networks. Subterranean habitation is our way of life and it will follow us as we take to the stars."

# Subterranean Modifiers
osom_planet_subterranean_1:0 "Subterranean Outposts"
osom_planet_subterranean_1_desc:0 "Planetary Surveyors have completed initial mapping of cave networks for the creation of small expeditions and outposts."

osom_planet_subterranean_2:0 "Subterranean Settlements"
osom_planet_subterranean_2_desc:0 "Detailed subterranean mapping and an extensive structural reinforcement of cave networks is present and capable of supporting small settlements."

osom_planet_subterranean_3:0 "Subterranean Cities"
osom_planet_subterranean_3_desc:0 "A planetary network of underground infrastructure is present and capable of supporting large settlements."

osom_planet_subterranean_4:0 "Subterranean Metropolis"
osom_planet_subterranean_4_desc:0 "A planetary network of underground infrastructure and artifical cave systems are present and capable of supporting massive cities."

osom_planet_subterranean_5:0 "Subterranean Arcology"
osom_planet_subterranean_5_desc:0 "A highly sophisticated network of cities, infrastructure, and military fortifications are present deep beneath the planet's surface."

# Military Modifiers
osom_planet_subterranean_fortifications:0 "Subterranean Defenses"
osom_planet_subterranean_fortifications_desc:0 "This colony is taking a highly defensive stance, has deployed additional soldiers, and moved all critical infrastructure deep underground."

osom_planet_subterranean_fortifications_gestalt:0 "Subterranean Defenses"
osom_planet_subterranean_fortifications_gestalt_desc:0 "This colony is taking a highly defensive stance, has deployed additional warrior drones, and moved all critical infrastructure deep underground."

# Mining Modifiers
osom_planet_subterranean_industrialization:0 "Subterranean Mining"
osom_planet_subterranean_industrialization_desc:0 "This colony is undertaking subterranean crystal mining operations and has improved mining efficiency."

osom_planet_subterranean_industrialization_gestalt:0 "Subterranean Mining"
osom_planet_subterranean_industrialization_gestalt_desc:0 "This colony is undertaking subterranean crystal mining operations and has improved mining efficiency."

# Agriculture Modifiers
osom_planet_subterranean_agriculture:0 "Subterranean Agriculture"
osom_planet_subterranean_agriculture_desc:0 "This colony is undertaking subterranean agriculture and mote harvest operations."

osom_planet_subterranean_agriculture_gestalt:0 "Subterranean Agriculture"
osom_planet_subterranean_agriculture_gestalt_desc:0 "This colony is undertaking subterranean agriculture and mote harvest operations."

# Geothermal Modifiers
osom_planet_subterranean_geothermal:0 "Subterranean Geothermal Fracking"
osom_planet_subterranean_geothermal_desc:0 "This colony is undertaking subterranean geothermal fracking operations for exotic gasses and improved energy efficiency."

osom_planet_subterranean_geothermal_gestalt:0 "Subterranean Geothermal Fracking"
osom_planet_subterranean_geothermal_gestalt_desc:0 "This colony is undertaking subterranean geothermal fracking operations for exotic gasses and improved energy efficiency."

# Storage Modifiers
osom_planet_subterranean_storage:0 "Underground Storage Facilities"
osom_planet_subterranean_storage_desc:0 "This colony has designated several caves for storage purposes."

# Subterranean Decisions
osom_decision_subterranean_1:0 "Subterranean Mapping"
osom_decision_subterranean_1_desc:0 "Dispatch surveyors to begin mapping of this planet's natural cave formations."

osom_decision_subterranean_2:0 "Subterranean Stability Assessment"
osom_decision_subterranean_2_desc:0 "Dispatch seismologists to conduct a stability assessment of the planet's cave networks and reinforce cave structural integrity."

osom_decision_subterranean_3:0 "Subterranean Infrastructure"
osom_decision_subterranean_3_desc:0 "Dispatch construction teams to build planetary wide subterranean communications networks, energy grids, and mass transit networks."

osom_decision_subterranean_4:0 "Subterranean Artificial Caverns"
osom_decision_subterranean_4_desc:0 "Dispatch mining and construction teams to further expand planetary cave networks and improve infrastructure."

osom_decision_subterranean_5:0 "Subterranean Advanced Arcology"
osom_decision_subterranean_5_desc:0 "Dispatch a team of architects to conduct advanced subterranean city planning for future generations."

